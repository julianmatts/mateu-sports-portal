<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Objetivos de Venta — Semanal · Mateu Sports</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B1527;--navy-mid:#1a2f55;--navy-soft:#13203a;
  --red:#CC0000;--red-soft:#ff3b3b;
  --white:#fff;--off:#f5f7fc;--muted:#6B7A99;--muted-light:#b0bcd4;
  --card:#fff;--border:#dce3f0;
  --ok:#16a34a;--warn:#d97706;--bad:#dc2626;--exc:#7c3aed;
  --font-d:'Bebas Neue',sans-serif;--font-c:'Barlow Condensed',sans-serif;--font-b:'Barlow',sans-serif;
  --shadow:0 1px 4px rgba(11,21,39,.08);--shadow-md:0 8px 30px rgba(11,21,39,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--off);color:var(--navy);font-family:var(--font-b);min-height:100vh}
img,svg{max-width:100%}

/* ===== HEADER ===== */
.top{background:var(--navy);padding:12px 22px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:3px solid var(--red);position:sticky;top:0;z-index:40;flex-wrap:wrap;gap:10px}
.top a.logo{display:flex;align-items:center;gap:11px;text-decoration:none;min-width:0}
.top img{height:32px;filter:brightness(0) invert(1)}
.top .tt{font-family:var(--font-d);font-size:19px;letter-spacing:1.5px;color:#fff;line-height:1}
.top .ts{font-family:var(--font-c);font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--muted-light)}
.top-right{display:flex;align-items:center;gap:12px;margin-left:auto}
.who{text-align:right;line-height:1.1}
.who .n{font-family:var(--font-c);font-size:13px;font-weight:600;color:#fff;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .r{font-family:var(--font-c);font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--red-soft)}
.salir{background:transparent;border:1px solid rgba(255,255,255,.25);border-radius:6px;color:rgba(255,255,255,.7);
  font-family:var(--font-c);font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:7px 13px;cursor:pointer}
.salir:hover{color:#fff;border-color:#fff}

/* ===== NAV TABS ===== */
.tabs{background:#fff;border-bottom:1px solid var(--border);padding:0 22px;display:flex;gap:4px;overflow-x:auto;position:sticky;top:57px;z-index:30}
.tab{padding:13px 16px;border:0;background:none;cursor:pointer;font-family:var(--font-c);font-size:14px;font-weight:600;
  letter-spacing:.5px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--navy);border-bottom-color:var(--red)}
.tab:hover{color:var(--navy)}
.tab:focus-visible{outline:2px solid var(--red);outline-offset:-2px}
.tab .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:10px;background:#e6ebf5;
  color:var(--navy-mid);font-family:var(--font-b);font-size:11px;font-weight:700;line-height:18px;text-align:center}
.tab.on .badge{background:var(--red);color:#fff}

main{max-width:1200px;margin:0 auto;padding:22px 22px 80px}

.banner{border-radius:9px;padding:10px 14px;font-size:13px;margin-bottom:16px}
.banner.warn{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412}
.banner.info{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af}
.banner code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:4px;font-size:12px}

/* ===== CONTROLES ===== */
.sel,.inp{padding:9px 11px;border:1px solid var(--border);border-radius:7px;font-size:14px;color:var(--navy);background:#fff;font-family:var(--font-b)}
.sel:focus,.inp:focus{outline:none;border-color:var(--navy-mid)}
.btn{border:none;border-radius:8px;padding:10px 16px;font-family:var(--font-c);font-size:13px;font-weight:700;
  letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--red);color:#fff}.btn-primary:hover{background:#a00000}
.btn-outline{background:#fff;border:1.5px solid var(--border);color:var(--navy)}.btn-outline:hover{border-color:var(--navy-mid)}
.btn-sm{padding:6px 11px;font-size:11px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.sel:focus-visible,.inp:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* ===== CARDS ===== */
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sec-head h1{font-family:var(--font-d);font-size:30px;letter-spacing:1px;line-height:1}
.sec-head .sub{font-family:var(--font-c);font-size:13px;font-weight:500;color:var(--muted);margin-top:2px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.card-h{font-family:var(--font-d);font-size:20px;letter-spacing:.5px;margin-bottom:2px}
.card-hs{font-family:var(--font-c);font-size:12px;color:var(--muted);margin-bottom:14px}

/* ===== DROPZONE ===== */
.drop{border:2px dashed var(--border);border-radius:12px;padding:26px;text-align:center;background:#fff;cursor:pointer;transition:all .15s}
.drop.over{border-color:var(--red);background:#fff5f5}
.drop .ic{font-size:34px}
.drop .t{font-family:var(--font-c);font-weight:600;font-size:15px;margin-top:6px}
.drop .s{font-size:12.5px;color:var(--muted);margin-top:3px}
.filechip{display:inline-flex;align-items:center;gap:8px;background:#eef2fb;border:1px solid var(--border);border-radius:20px;
  padding:5px 12px;font-family:var(--font-c);font-size:12.5px;font-weight:600;color:var(--navy-mid);margin:4px 4px 0 0}
.filechip .ok{color:var(--ok)}.filechip .no{color:var(--bad)}

/* ===== KPIs ===== */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:11px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi.meta{border-left:4px solid var(--navy-mid)}
.kpi.real{border-left:4px solid var(--ok)}
.kpi.cum{border-left:4px solid var(--red)}
.kpi .k{font-family:var(--font-c);font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--font-d);font-size:30px;letter-spacing:.5px;margin-top:4px;line-height:1}
.kpi .v small{font-size:14px;color:var(--muted);font-family:var(--font-c)}

/* ===== TABLAS ===== */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:11px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:720px}
th{background:var(--navy);color:#fff;font-family:var(--font-c);font-weight:600;letter-spacing:.5px;padding:9px 11px;text-align:left;white-space:nowrap;position:sticky;top:0}
th.num,td.num{text-align:right}
td{padding:7px 11px;border-bottom:1px solid #eef0f7;vertical-align:middle}
tbody tr:hover td{background:#f8f9fe}
.mono{font-variant-numeric:tabular-nums}
td .gi{width:100%;max-width:130px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px;
  font-family:var(--font-b);text-align:right;font-variant-numeric:tabular-nums}
td .gi:focus{outline:none;border-color:var(--navy-mid)}
td .gn{width:100%;min-width:150px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:12.5px;font-family:var(--font-b)}
td .gn:focus{outline:none;border-color:var(--navy-mid)}
.der{color:var(--muted);font-variant-numeric:tabular-nums}
.sucn{font-family:var(--font-c);font-weight:600;color:var(--navy)}
.sucn .pfx{color:var(--muted-light);font-weight:700;margin-right:5px}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-family:var(--font-c);font-size:11px;font-weight:700;letter-spacing:.4px}
.pill.ok{background:#eafaf0;color:#127a3a}
.pill.warn{background:#fff7ed;color:#9a3412}
.pill.bad{background:#fef2f2;color:#b91c1c}
.pill.na{background:#f1f4fa;color:var(--muted-light)}
.grp-total{background:#eef2fb;font-family:var(--font-c);font-weight:700;color:var(--navy-mid)}

/* barra de cumplimiento */
.bar{position:relative;height:8px;background:#eef0f7;border-radius:6px;overflow:hidden;min-width:90px}
.bar > i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--ok)}
.bar.warn > i{background:var(--warn)}
.bar.bad > i{background:var(--bad)}

/* ===== ESTADOS ===== */
.state{text-align:center;padding:52px 20px;color:var(--muted)}
.state .big-ic{font-size:40px;margin-bottom:10px}
.state.err{color:var(--bad)}
.spinner{width:26px;height:26px;border:3px solid #e6ebf5;border-top-color:var(--red);border-radius:50%;
  display:inline-block;animation:spin .7s linear infinite;margin-bottom:10px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== HISTÓRICO ===== */
.histrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--border);
  border-radius:10px;background:#fff;margin-bottom:9px}
.histrow .hl{font-family:var(--font-c);font-weight:700;font-size:15px;color:var(--navy)}
.histrow .hs{font-size:12.5px;color:var(--muted)}

/* ===== TOAST ===== */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;
  padding:11px 18px;border-radius:9px;font-size:13.5px;box-shadow:var(--shadow-md);opacity:0;pointer-events:none;transition:all .25s;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:#166534}.toast.err{background:#991b1b}

@media(max-width:640px){ .sec-head h1{font-size:24px} .kpi .v{font-size:24px} }
</style>
<!-- Iconos SVG (reemplazan emojis que Windows 7 / navegadores viejos no dibujan) -->

<!-- SheetJS: leer el Excel PMS Objetivos (client-side, no se sube nada) -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
/* ============================================================
   Objetivos de Venta Semanal — módulo self-contained del Portal.
   La gerencia carga el objetivo de venta de la semana por sucursal
   (subiendo el Excel "PMS Objetivos Semanal Locales" o a mano) y lo
   guarda en Firebase. Cada sucursal ve su objetivo en Indicadores.
   Valores por sucursal: META (el objetivo), MÍNIMO (=META×0.8),
   120 (=META×1.2) y REAL (venta de la semana). Lee la sesión del
   Portal (localStorage), sin login propio.
   ============================================================ */
'use strict';
const $ = id => document.getElementById(id);

/* ---------- Firebase ----------
   Reusa la base recepciones-mateu (ya existe, reglas abiertas), en un nodo
   aparte `objetivos/…` sin tocar el árbol `recepciones/…` ni `barrida/…`.
   Mismo criterio que Barrida: no hace falta crear una base a mano. */
const FIREBASE_DB_URL = 'https://recepciones-mateu-default-rtdb.firebaseio.com';
const ROOT = 'objetivos';

/* factores de escala (0.8 / 1 / 1.2 = MÍNIMO / META / 120) */
const F_MIN = 0.8, F_120 = 1.2;

/* ---------- sesión ---------- */
const SESSION_KEY = 'mateu_portal_session';
function readSession(){ try{ const s=localStorage.getItem(SESSION_KEY); return s?JSON.parse(s):null; }catch(e){ return window.__sess||null; } }
const SESSION = readSession();
if(!SESSION || !SESSION.rol){ location.replace('../'); }
// Lo carga gerencia. Las sucursales ven su objetivo en Indicadores.
const puedeVer = SESSION && (SESSION.rol==='admin' || (SESSION.herramientas||[]).includes('objetivos'));
if(SESSION && SESSION.rol && !puedeVer){ location.replace('../'); }

/* ---------- sucursales (slug del Portal + prefijo del Excel) ----------
   El prefijo NN es el código del Excel PMS ("01-Plaza Italia"…). El slug es
   el del Portal (para que cada sucursal baje solo lo suyo, como Indicadores). */
const STORES = [
  {slug:'plaza',      pfx:'01', nombre:'Plaza Italia'},
  {slug:'kids',       pfx:'02', nombre:'Mateu Kids'},
  {slug:'calle-55',   pfx:'03', nombre:'Outlet Calle 55'},
  {slug:'aurelius-12',pfx:'04', nombre:'Aurelius 12'},
  {slug:'city-bell',  pfx:'06', nombre:'City Bell'},
  {slug:'aurelius-10',pfx:'07', nombre:'Aurelius 10'},
  {slug:'calle-47',   pfx:'08', nombre:'Calle 47'},
  {slug:'adidas',     pfx:'09', nombre:'Adidas Av. 7'},
  {slug:'diagonal',   pfx:'10', nombre:'Diagonal 80'},
  {slug:'ensenada',   pfx:'11', nombre:'Ensenada'},
  {slug:'calle-12',   pfx:'12', nombre:'Calle 12'},
  {slug:'los-hornos', pfx:'13', nombre:'Los Hornos'},
  {slug:'gonnet',     pfx:'14', nombre:'Outlet Gonnet'},
  {slug:'originals',  pfx:'15', nombre:'Adidas Originals'},
  {slug:'berisso',    pfx:'16', nombre:'Berisso'},
  {slug:'aurelius-cb',pfx:'17', nombre:'Aurelius CB'},
  {slug:'aurelius-5', pfx:'18', nombre:'Aurelius 5'},
  {slug:'calle-49',   pfx:'19', nombre:'Calle 49'},
  {slug:'av-44',      pfx:'20', nombre:'Outlet Av. 44'},
  {slug:'adidas-12',  pfx:'21', nombre:'Adidas Calle 12'},
  {slug:'ecommerce',  pfx:'99', nombre:'Ecommerce'},
];
const PREFIJO_SLUG = {}; const SLUG_STORE = {};
STORES.forEach(s=>{ PREFIJO_SLUG[s.pfx]=s.slug; SLUG_STORE[s.slug]=s; });

/* ---------- helpers ---------- */
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const num = x => { const n=Number(String(x==null?'':x).replace(/[^\d.,-]/g,'').replace(/\.(?=\d{3}\b)/g,'').replace(',','.')); return isFinite(n)?n:0; };
const fmtInt = n => (Math.round(n||0)).toLocaleString('es-AR');
const fmtMoney = n => '$'+fmtInt(n);
const r0 = n => Math.round(n||0);
function toast(msg, kind){ const t=$('toast'); t.textContent=msg; t.className='toast show '+(kind||''); setTimeout(()=>{t.className='toast '+(kind||'');},2800); }
function nowISO(){ const d=new Date(); const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }
function lunesDe(date){ const d=new Date(date); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function lunesLabel(iso){ if(!iso) return ''; const [y,m,dd]=iso.split('-'); return dd+'/'+m+'/'+y; }
// cumplimiento: real vs meta -> {pct, clase}
function estadoCumpl(meta, real){
  if(!real || !meta) return {pct:0, cls:'na', label:'—'};
  const pct = real/meta;
  const cls = real>=meta ? 'ok' : real>=meta*F_MIN ? 'warn' : 'bad';
  return {pct, cls, label:Math.round(pct*100)+'%'};
}

/* ---------- Firebase REST ---------- */
function fbUrl(path){ return FIREBASE_DB_URL.replace(/\/+$/,'') + '/' + path.split('/').map(encodeURIComponent).join('/') + '.json'; }
async function fbGet(path){ const r=await fetch(fbUrl(path)); if(!r.ok) throw new Error('Firebase HTTP '+r.status); return r.json(); }
async function fbPut(path, data){ const r=await fetch(fbUrl(path),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}); if(!r.ok) throw new Error('Firebase HTTP '+r.status); return r.json(); }

/* ============================================================
   PARSEO DEL EXCEL
   ============================================================ */
function leerLibro(buf){
  const wb = XLSX.read(buf, {type:'array'});
  return wb.SheetNames.map(name=>({
    name,
    matrix: XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, blankrows:false, defval:''})
  }));
}
// De una hoja (matriz) saca {slug:{meta,real,nota}}. Heurística: en cada fila busca
// el token de sucursal ("NN-…"), toma los números a su derecha (el 1º = objetivo,
// el último = REAL). Las filas de "FINAL AJUSTADO" vienen después y pisan las de FINAL.
function parseHoja(matrix){
  const out = {};
  for(const row of (matrix||[])){
    if(!row || !row.length) continue;
    let storeCol=-1, slug=null;
    for(let c=0;c<row.length;c++){
      const m = String(row[c]==null?'':row[c]).match(/^\s*(\d{1,2})\s*-\s*\S/);
      if(m){ const s=PREFIJO_SLUG[m[1].padStart(2,'0')]; if(s){ storeCol=c; slug=s; } }
    }
    if(slug==null) continue;
    const nums=[]; let nota='';
    for(let c=storeCol+1;c<row.length;c++){
      const raw=String(row[c]==null?'':row[c]).trim();
      if(!raw) continue;
      const v=num(row[c]);
      if(v>1000) nums.push(v);
      else if(isNaN(Number(raw.replace(',','.'))) && raw.length>8 && !nota) nota=raw; // texto largo = comentario
    }
    const cur = out[slug] || (out[slug]={meta:null, real:null, nota:''});
    if(nums.length>=2){ cur.meta=nums[0]; cur.real=nums[nums.length-1]; }
    else if(nums.length===1){ if(cur.meta==null) cur.meta=nums[0]; else cur.real=nums[0]; }
    if(nota) cur.nota=nota;
  }
  return out;
}
// intenta deducir el lunes de la semana desde el nombre de hoja ("SEMANA 3 AGO", "21 SPT"…)
const MESES = {ene:0,feb:1,mar:2,abr:3,may:4,jun:5,jul:6,ago:7,sep:8,spt:8,set:8,oct:9,nov:10,dic:11};
function lunesDesdeHoja(name){
  const m = String(name||'').toLowerCase().match(/(\d{1,2})\s*([a-zé]{3,4})/);
  if(!m) return null;
  const dia=parseInt(m[1],10); const mesKey=m[2].slice(0,3).replace('é','e');
  const mes = MESES[mesKey]; if(mes==null) return null;
  const hoy=new Date(); let anio=hoy.getFullYear();
  // si el mes quedó >6 meses atrás, probablemente es del año próximo (calendario largo)
  const cand=new Date(anio, mes, dia);
  if((cand-hoy)/(1000*60*60*24) < -180) anio++;
  return lunesDe(new Date(anio, mes, dia));
}

async function ingerirArchivo(file){
  const buf = await file.arrayBuffer();
  const hojas = leerLibro(buf);
  state.hojas = hojas;
  state.archivo = {nombre:file.name};
  // Elegir la hoja por defecto. Las hojas de planificación semanal se llaman
  // "SEMANA <día> <mes>" (formato bloque, objetivo semanal limpio); el resto del
  // libro son hojas históricas con otro layout. Preferimos las "SEMANA …": la de
  // esta semana, si no la primera con datos.
  const esSemana = h=>/^\s*semana\b/i.test(h.name);
  let sel = hojas.find(h=>esSemana(h) && lunesDesdeHoja(h.name)===state.semana)
    || hojas.find(h=>esSemana(h) && Object.keys(parseHoja(h.matrix)).length>=10)
    || hojas.find(h=>lunesDesdeHoja(h.name)===state.semana)
    || hojas.find(h=>Object.keys(parseHoja(h.matrix)).length>=3)
    || hojas[0];
  if(sel){ aplicarHoja(sel.name); }
}
function aplicarHoja(name){
  const h = state.hojas.find(x=>x.name===name); if(!h) return;
  state.hojaSel = name;
  state.etiqueta = name;
  const parsed = parseHoja(h.matrix);
  state.filas = filasVacias();
  Object.entries(parsed).forEach(([slug,v])=>{ if(state.filas[slug]) state.filas[slug]={meta:v.meta, real:v.real, nota:v.nota||''}; });
  const ldh = lunesDesdeHoja(name); if(ldh) state.semana = ldh;
}

  const totMeta = rows.reduce((a,r)=>a+r.meta,0);

    +'<th data-sort="suc" style="cursor:pointer">Sucursal'+arrow('suc')+'</th>'
    +'<th class="num" data-sort="meta" style="cursor:pointer">Meta'+arrow('meta')+'</th>'

    +'<th>Avance</th></tr></thead><tbody>';

    const w=Math.min(100, Math.round(r.est.pct*100));

      +'<td><div class="bar '+(r.est.cls==='ok'?'':r.est.cls)+'"><i style="width:'+w+'%"></i></div></td></tr>';
  });
  html+='<tr class="grp-total"><td>TOTAL CADENA</td><td class="num mono">'+fmtMoney(totMeta)+'</td><td></td><td></td>'
    +'<td class="num mono">'+(totReal?fmtMoney(totReal):'—')+'</td><td class="num">'+(totReal?'<span class="pill '+totEst.cls+'">'+totEst.label+'</span>':'—')+'</td><td></td></tr>';

function wire(){
  $('whoName').textContent = SESSION.email||'—';
  $('whoRole').textContent = SESSION.rol||'';

function wireCargar(){
  const drop=$('drop'), input=$('fileInput');
  if(drop){
    drop.onclick=()=>input.click();
    drop.ondragover=e=>{e.preventDefault();drop.classList.add('over');};
    drop.ondragleave=()=>drop.classList.remove('over');
    drop.ondrop=async e=>{ e.preventDefault();drop.classList.remove('over'); await cargarArchivo(e.dataTransfer.files); };
  }
  if(input) input.onchange=async e=>{ await cargarArchivo(e.target.files); input.value=''; };
  const hs=$('hojaSel'); if(hs) hs.onchange=e=>{ aplicarHoja(e.target.value); render(); };
  const sem=$('semInput'); if(sem) sem.onchange=e=>{ state.semana=e.target.value; };
  // edición de la grilla (sin re-render para no perder foco; recalcula derivados)
  const body=$('gridBody');
  if(body){
    body.addEventListener('input', e=>{
      const inp=e.target; if(!inp.classList.contains('gi')&&!inp.classList.contains('gn')) return;
      const tr=inp.closest('tr'); const slug=tr.dataset.slug; const k=inp.dataset.k;
      const f=state.filas[slug]||(state.filas[slug]={meta:null,real:null,nota:''});
      if(k==='nota'){ f.nota=inp.value; return; }
      const v = inp.value.trim()==='' ? null : num(inp.value);
      f[k]=v;
      if(k==='meta'){
        tr.querySelector('[data-der="min"]').textContent = v?fmtMoney(r0(v*F_MIN)):'—';
        tr.querySelector('[data-der="s120"]').textContent = v?fmtMoney(r0(v*F_120)):'—';
      }
    });
  }
  const bg=$('btnGuardar'); if(bg) bg.onclick=guardar;
  const bl=$('btnLimpiar'); if(bl) bl.onclick=()=>{ if(confirm('¿Limpiar todos los montos de la grilla?')){ state.filas=filasVacias(); state.archivo=null; state.hojas=[]; state.hojaSel=''; render(); } };
  const bd=$('btnVerDash'); if(bd) bd.onclick=()=>setTab('dashboard');
}

async function cargarArchivo(fileList){
  const files=[...fileList].filter(f=>/\.xlsx?$/i.test(f.name));
  if(!files.length){ toast('Subí un archivo .xlsx','err'); return; }
  try{
    toast('Leyendo Excel…');
    await ingerirArchivo(files[0]);
    render();
    toast('Excel cargado — revisá la grilla','ok');
  }catch(err){ console.error(err); toast(err.message||'No pude leer el archivo','err'); }
}

async function guardar(){
  const sem = ($('semInput')&&$('semInput').value) || state.semana;
  if(!sem){ toast('Elegí la semana','err'); return; }
  state.semana = sem;
  const porSlug={}; let n=0;
  STORES.forEach(s=>{
    const f=state.filas[s.slug]; if(!f || !(f.meta>0)) return;
    porSlug[s.slug]={
      nombre:s.nombre, pfx:s.pfx,
      meta:r0(f.meta), minimo:r0(f.meta*F_MIN), s120:r0(f.meta*F_120),
      real: f.real!=null?r0(f.real):null,
      nota: f.nota||''
    };
    n++;
  });
  if(!n){ toast('Cargá al menos una sucursal con meta','err'); return; }
  const payload={ meta:{ generado_en:nowISO(), generado_por:SESSION.email||'', semana:sem, etiqueta:state.etiqueta||'', sucursales:n }, porSlug };
  try{
    toast('Guardando…');
    if(!FIREBASE_DB_URL){ toast('Sin base configurada','err'); return; }
    await fbPut(ROOT+'/semanas/'+sem, payload);
    await fbPut(ROOT+'/ultima', sem);
    if(!state.histKeys.includes(sem)) state.histKeys.push(sem);
    state.dashWeek = sem; state.dashData = payload;
    toast('Objetivos guardados y publicados ✓','ok');
    setTab('dashboard');
  }catch(err){ console.error(err); toast('No pude guardar: '+(err.message||''),'err'); }
}

function wireDashboard(){
  const sel=$('dashSel'); if(sel) sel.onchange=e=>{ abrirDash(e.target.value); };
  document.querySelectorAll('th[data-sort]').forEach(th=>th.onclick=()=>{
    const k=th.dataset.sort; if(state.dashSort.k===k) state.dashSort.dir*=-1; else state.dashSort={k, dir:-1}; render();
  });
  // primera carga
  if(!state.dashWeek && state.histKeys.length){ abrirDash(state.histKeys.slice().sort().reverse()[0]); }
}
async function abrirDash(sem){
  state.dashWeek=sem; state.dashData=null; render();
  try{ const d=await fbGet(ROOT+'/semanas/'+sem); state.dashData=d||{porSlug:{}}; }
  catch(e){ state.dashData={porSlug:{}}; toast('No pude leer la semana','err'); }
  if(state.tab==='dashboard') render();
}

function wireHistorico(){
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{ setTab('dashboard'); abrirDash(b.dataset.open); });
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>cargarParaEditar(b.dataset.edit));
}
async function cargarParaEditar(sem){
  try{
    toast('Cargando semana…');
    const d=await fbGet(ROOT+'/semanas/'+sem);
    state.filas=filasVacias();
    if(d&&d.porSlug) Object.entries(d.porSlug).forEach(([slug,v])=>{ if(state.filas[slug]) state.filas[slug]={meta:v.meta, real:v.real, nota:v.nota||''}; });
    state.semana=sem; state.etiqueta=(d&&d.meta&&d.meta.etiqueta)||''; state.archivo=null; state.hojas=[]; state.hojaSel='';
    setTab('cargar');
    toast('Semana cargada para editar','ok');
  }catch(e){ toast('No pude cargar la semana','err'); }
}

  render();
  if(FIREBASE_DB_URL){
    try{
      const semanas = await fbGet(ROOT+'/semanas');
      state.histKeys = semanas ? Object.keys(semanas) : [];
    }catch(e){ /* base vacía o sin red: seguimos en modo carga */ }
  }
  render();
}
init();
</script>
