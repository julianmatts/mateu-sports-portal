<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tareas de Depósito — Mateu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="../../shared/iconos.js" defer></script>
<style>
  :root{
    --navy:#0B1527;--navy-mid:#1a2f55;--red:#CC0000;--off:#f5f7fc;--card:#fff;--border:#dce3f0;
    --muted:#6B7A99;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;
    --font-d:'Bebas Neue',sans-serif;--font-c:'Barlow Condensed',sans-serif;--font-b:'Barlow',sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--off);color:var(--navy);font-family:var(--font-b);min-height:100vh;min-height:100dvh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
  .top{background:var(--navy);border-bottom:3px solid var(--red);display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) 12px calc(20px + env(safe-area-inset-left))}
  .top h1{font-family:var(--font-d);font-size:24px;color:#fff;letter-spacing:1px;margin:0;font-weight:400}
  .top .ts{font-family:var(--font-c);font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#b0bcd4}
  .top .tag{margin-left:auto;font-family:var(--font-c);font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);padding:4px 11px;border-radius:999px}
  main{max-width:960px;margin:0 auto;padding:20px calc(16px + env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
  .sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .sec-head h2{font-family:var(--font-d);font-size:26px;letter-spacing:.5px;margin:0;font-weight:400}
  .sec-head .sub{font-family:var(--font-c);font-size:13px;color:var(--muted)}
  .btn{border:none;border-radius:9px;padding:11px 18px;min-height:44px;font-family:var(--font-c);font-size:14px;font-weight:700;letter-spacing:.5px;cursor:pointer;text-transform:uppercase}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:var(--red);color:#fff}.btn-primary:hover{background:#a00000}
  .btn-outline{background:#fff;border:1.5px solid var(--border);color:var(--navy)}.btn-outline:hover{border-color:var(--navy-mid)}
  .btn-lg{font-size:17px;padding:15px 26px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .inp{padding:11px 13px;border:1px solid var(--border);border-radius:8px;font-size:16px;color:var(--navy);background:#fff;font-family:var(--font-b)}
  .inp:focus{outline:2px solid var(--red);outline-offset:2px}
  .state{text-align:center;padding:50px 20px;color:var(--muted);font-family:var(--font-c);font-size:16px}
  .spin{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--red);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 12px}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* home */
  .home{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:6px}
  @media(max-width:640px){.home{grid-template-columns:1fr}}
  .task{background:#fff;border:1px solid var(--border);border-radius:14px;padding:26px 22px;cursor:pointer;transition:box-shadow .12s,transform .12s;text-align:left}
  .task:hover{box-shadow:0 8px 22px rgba(11,21,39,.12);transform:translateY(-2px)}
  .task .ic{font-size:34px}
  .task .t{font-family:var(--font-d);font-size:26px;letter-spacing:.5px;margin-top:8px}
  .task .d{font-family:var(--font-c);font-size:13px;color:var(--muted);margin-top:2px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;transition:box-shadow .12s,transform .12s}
  .card:hover{box-shadow:0 6px 18px rgba(11,21,39,.10);transform:translateY(-1px)}
  .card .nro{font-family:var(--font-d);font-size:22px;letter-spacing:.5px}
  .card .sub{font-family:var(--font-c);font-size:12px;color:var(--muted);margin-top:2px}
  .card .foot{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
  .pill{font-family:var(--font-c);font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:3px 10px;border-radius:999px}
  .pill.info{background:#e7eefc;color:#1a3a8a}.pill.mut{background:#eef1f7;color:var(--muted)}.pill.ok{background:#e8f5ee;color:#166534}
  .card .n{font-family:var(--font-d);font-size:20px}
  .card .n small{font-family:var(--font-c);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-left:4px}

  .blind{background:#fff4e2;border:1px solid #f4cd93;color:#8a5200;font-family:var(--font-c);font-weight:600;font-size:13px;border-radius:10px;padding:10px 14px;margin-bottom:16px}
  .scanbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .scanbar .inp{flex:1 1 260px;min-width:0;font-size:18px}
  .cam{margin-top:12px;border-radius:10px;overflow:hidden;background:#000;display:none}
  .cam video{width:100%;max-height:300px;display:block}
  .flash{margin-top:14px;border:1px solid var(--border);border-radius:10px;background:#f7f9fd;padding:14px 16px;min-height:60px;display:flex;gap:12px;align-items:center}
  .flash .ic{font-size:24px}.flash .big{font-family:var(--font-c);font-weight:700;font-size:18px}.flash .sub{font-size:13px;color:var(--muted)}
  .flash.ok{background:#e8f5ee;border-color:#bbe3c9}.flash.ok .big{color:#166534}
  .flash.bad{background:#fdecec;border-color:#f4c0c0}.flash.bad .big{color:#b00020}
  .hero{display:flex;align-items:baseline;gap:10px;margin:18px 0 6px}
  .hero .n{font-family:var(--font-d);font-size:56px;color:var(--navy);line-height:1}
  .hero .lbl{font-family:var(--font-c);font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:15px}
  th{font-family:var(--font-c);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:8px;border-bottom:1px solid var(--border)}
  td{padding:9px 8px;border-bottom:1px solid #eef1f7;font-variant-numeric:tabular-nums}
  td.num,th.num{text-align:right}td.talle{font-weight:700}.bad{color:var(--bad)}
  .ctrl-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}
  @media(max-width:760px){.ctrl-grid{grid-template-columns:1fr}}
  .oplist{border:1px solid var(--border);border-radius:12px;padding:8px 14px;background:#fff}
  .row-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
  .opname{display:flex;align-items:center;gap:8px;margin-top:14px}
  .opname label{font-family:var(--font-c);font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
  .opname .inp{flex:1;max-width:260px;font-size:16px}

  /* reposición / checklist */
  .startbox{background:#fff;border:1px solid var(--border);border-radius:14px;padding:34px 24px;text-align:center;margin-top:10px}
  .startbox .big{font-family:var(--font-d);font-size:30px;letter-spacing:.5px}
  .startbox .sub{font-family:var(--font-c);font-size:14px;color:var(--muted);margin:6px 0 20px}
  .summary{background:#fff;border:1px solid var(--border);border-radius:14px;padding:24px;text-align:center;margin-top:10px}
  .summary .chk-ic{font-size:40px;color:var(--ok)}
  .sumrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:16px}
  .sumrow .s{border:1px solid var(--border);border-radius:11px;padding:12px 18px;min-width:120px;background:#f7f9fd}
  .sumrow .s .v{font-family:var(--font-d);font-size:30px;color:var(--navy)}
  .sumrow .s .k{font-family:var(--font-c);font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--navy);color:#fff;padding:12px 20px;border-radius:10px;font-family:var(--font-c);font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
  .toast.show{opacity:1}.toast.bad{background:var(--bad)}.toast.ok{background:var(--ok)}

  /* --- mobile / tablet (celular y tablet, vertical y horizontal · Android + iOS) --- */
  .inp{font-size:16px}                         /* evita el auto-zoom de iOS al enfocar */
  .task,.card{-webkit-tap-highlight-color:transparent}
  .task:active,.card:active{transform:scale(.995)}
  .flash .sub{overflow-wrap:anywhere}
  .sec-head .btn,.row-actions .btn{flex:0 0 auto}
  @media (max-width:520px){
    .top h1{font-size:21px}
    .sec-head h2{font-size:22px}
    .hero .n{font-size:46px}
    .task{padding:22px 18px}
    .btn{padding:12px 16px}
    .row-actions .btn{flex:1 1 auto}          /* botones de acción a ancho completo en el celu */
    .startbox{padding:26px 16px}
  }
  @media (max-width:380px){ .scanbar .inp{flex-basis:100%} }
</style>
</head>
<body>
<header class="top">
  <div><h1 id="topTitle">Tareas de Depósito</h1><div class="ts">Depósito Central · Mateu Sports</div></div>
  <span class="tag" id="topTag">Kiosco</span>
</header>
<main id="view"><div class="state"><div class="spin"></div>Cargando…</div></main>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   KIOSCO DE DEPÓSITO — sin login, aislado del portal. Dos tareas:
   1) Control de Ingreso: control ciego por scan de EAN (nodo ingreso/).
   2) Reposición: checklist de lo que hay que reponer a cada sucursal (nodo
      barrida/), con Comenzar/Finalizar → seguimiento de tiempo y resumen.
   Escribe SOLO ingreso/ y barrida/tareas de recepciones-mateu; no expone el portal.
   ============================================================ */
'use strict';
const $ = id => document.getElementById(id);
const FIREBASE_DB_URL = 'https://recepciones-mateu-default-rtdb.firebaseio.com';
const ROOT_ING = 'ingreso';
const ROOT_BAR = 'barrida';

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const num = x => { const n=Number(x); return isFinite(n)?n:0; };
const fmtInt = n => (Math.round(n||0)).toLocaleString('es-AR');
function fbUrl(path){ return FIREBASE_DB_URL.replace(/\/+$/,'')+'/'+path.split('/').map(encodeURIComponent).join('/')+'.json'; }
function fbKey(nro){ return String(nro||'').trim().replace(/[.#$/\[\]]/g,'~'); }
async function fbGet(path,q){ const r=await fetch(fbUrl(path)+(q?('?'+q):'')); if(!r.ok) throw new Error('Firebase HTTP '+r.status); return r.json(); }
async function fbPut(path,data){ const r=await fetch(fbUrl(path),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}); if(!r.ok) throw new Error('Firebase HTTP '+r.status); return r.json(); }
function nowISO(){ return new Date().toISOString().slice(0,19).replace('T',' '); }
function toast(msg,kind){ const t=$('toast'); t.textContent=msg; t.className='toast show '+(kind||''); setTimeout(()=>{t.className='toast '+(kind||'');},2600); }
const vals = o => o?Object.keys(o).map(k=>o[k]):[];
function fmtDur(ms){ if(!ms||ms<0) return '—'; const s=Math.round(ms/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60; if(h) return h+'h '+m+'m'; if(m) return m+'m '+ss+'s'; return ss+'s'; }
function nombreSuc(slug){ return String(slug||'').split('-').map(w=> !w?w:(w.length<=2?w.toUpperCase():w.charAt(0).toUpperCase()+w.slice(1))).join(' '); }

const state = { task:null, view:'lista', remito:null, suc:null };
const DATA = { remitos:{}, control:{}, pick:{ pickings:{}, operarios:{} } };

/* ============================================================ HOME ============ */
function render(){
  const tt=$('topTitle'), tg=$('topTag');
  if(!state.task){ tt.textContent='Tareas de Depósito'; tg.textContent='Kiosco'; return renderHome(); }
  if(state.task==='ingreso'){ tt.textContent='Control de Ingreso'; tg.textContent='A ciegas'; return (state.view==='control')?renderControl():renderIngLista(); }
  if(state.task==='picking'){ tt.textContent='Picking'; tg.textContent=(state.view==='op'?'Preparando':'Pedidos'); return renderPickView(); }
  if(state.task==='cfinal'){ tt.textContent='Control'; tg.textContent=(state.view==='op'?'Controlando':'Pedidos'); return renderCfView(); }
}
function renderHome(){
  $('view').innerHTML =
    '<div class="sec-head"><div><h2>¿Qué vas a hacer?</h2><div class="sub">Elegí la tarea.</div></div></div>'
    + '<div class="home">'
    + '<button class="task" id="tIng"><div class="ic">📦</div><div class="t">Control de Ingreso</div><div class="d">Controlar un remito que llegó al depósito, escaneando cada unidad.</div></button>'
    + '<button class="task" id="tRep"><div class="ic">📋</div><div class="t">Picking</div><div class="d">Preparar los pedidos asignados: te guía ubicación → producto → cantidad, con scan.</div></button>'
    + '<button class="task" id="tCf"><div class="ic">✅</div><div class="t">Control</div><div class="d">Controlar un pedido ya preparado: re-escaneás y el sistema verifica contra el picking.</div></button>'
    + '</div>';
  $('tIng').onclick=()=>enterTask('ingreso');
  $('tRep').onclick=()=>enterTask('picking');
  $('tCf').onclick=()=>enterTask('cfinal');
}
async function enterTask(task){
  state.task=task; state.view='lista'; state.remito=null; state.suc=null;
  $('view').innerHTML='<div class="state"><div class="spin"></div>Cargando…</div>';
  try{
    if(task==='ingreso') await cargarIngreso();
    else if(task==='picking' || task==='cfinal') await cargarPicking();
    render();
  }catch(e){ $('view').innerHTML='<div class="state">No pude cargar. Revisá la conexión.<br><br><button class="btn btn-outline" onclick="location.reload()">↻ Reintentar</button></div>'; }
}
function backHome(){ state.task=null; render(); }

/* ============================================================ INGRESO ========= */
const ING_ORD_TALLE=['XS','S','M','L','XL','2XL','3XL','XXS'];
const ordTalle=t=>{ const i=ING_ORD_TALLE.indexOf(String(t||'')); return i<0?99:i; };
function ctrlOf(key){ return DATA.control[key]||null; }
function ctrlInit(key){ let C=DATA.control[key]; if(!C){ C={scans:{},unknown:{},operario:'',terminado:false,inicio:nowISO()}; DATA.control[key]=C; } if(!C.scans)C.scans={}; if(!C.unknown)C.unknown={}; return C; }
function scanTot(C){ let t=0; if(!C) return 0; for(const k in (C.scans||{})) t+=num(C.scans[k]); for(const k in (C.unknown||{})) t+=num(C.unknown[k]); return t; }
async function cargarIngreso(){ const [rem,con]=await Promise.all([ fbGet(ROOT_ING+'/remitos'), fbGet(ROOT_ING+'/control') ]); DATA.remitos=rem||{}; DATA.control=con||{}; }

function renderIngLista(){
  const pend = vals(DATA.remitos).filter(R=>{ const key=fbKey(R.nro); const C=ctrlOf(key); return !(C&&C.terminado) && !R.ingresado; })
    .sort((a,b)=>String(b.creado_en||'').localeCompare(String(a.creado_en||'')));
  let h = '<div class="sec-head"><div><h2>Remitos para controlar</h2><div class="sub">Elegí el remito que estás controlando y escaneá cada unidad.</div></div>'
    + '<div style="display:flex;gap:8px"><button class="btn btn-outline" id="reload">↻ Actualizar</button><button class="btn btn-outline" id="home">← Tareas</button></div></div>';
  if(!pend.length){ $('view').innerHTML = h + '<div class="state">No hay remitos pendientes de control. Cuando Ariel o Luis pre-ingresen uno, aparece acá.</div>'; bindIngListaHead(); return; }
  const cards = pend.map(R=>{
    const key=fbKey(R.nro); const C=ctrlOf(key); const sc=scanTot(C);
    const est = sc>0 ? '<span class="pill info">En control</span>' : '<span class="pill mut">Sin empezar</span>';
    return '<div class="card" data-key="'+esc(key)+'"><div class="nro">'+esc(R.nro)+'</div>'
      + '<div class="sub">'+esc(R.proveedor||'ADIDAS')+(R.fecha?(' · '+esc(R.fecha)):'')+(R.bultos?(' · '+esc(String(R.bultos))+' bultos'):'')+'</div>'
      + '<div class="foot">'+est+'<div class="n">'+fmtInt(sc)+'<small>controladas</small></div></div></div>';
  }).join('');
  $('view').innerHTML = h + '<div class="grid">'+cards+'</div>';
  document.querySelectorAll('.card[data-key]').forEach(c=>c.onclick=()=>{ state.view='control'; state.remito=c.getAttribute('data-key'); render(); });
  bindIngListaHead();
}
function bindIngListaHead(){ const r=$('reload'); if(r) r.onclick=async()=>{ r.disabled=true; try{ await cargarIngreso(); render(); toast('Actualizado','ok'); }catch(e){ r.disabled=false; toast('No pude actualizar','bad'); } }; const hm=$('home'); if(hm) hm.onclick=backHome; }

let _key=null;
function renderControl(){
  const key=state.remito; const R=DATA.remitos[key];
  if(!R){ state.view='lista'; return render(); }
  _key=key; const C=ctrlInit(key);
  let h = '<div class="sec-head"><div><h2>'+esc(R.nro)+'</h2><div class="sub">'+esc(R.proveedor||'ADIDAS')+' — escaneá cada unidad. No ves las cantidades esperadas.</div></div>'
    + '<button class="btn btn-outline" id="back">← Volver</button></div>';
  h += '<div class="blind">Control a ciegas: contá y escaneá todo lo que hay en las cajas. El sistema compara después contra el remito.</div>';
  h += '<div class="ctrl-grid"><div>'
    + '<div class="scanbar"><input class="inp" id="scan" inputmode="numeric" autocomplete="off" placeholder="Escaneá o tipeá el EAN + Enter"><button class="btn btn-primary" id="scanBtn">Registrar</button><button class="btn btn-outline" id="camBtn">📷 Cámara</button></div>'
    + '<div class="cam" id="cam"><video id="video" playsinline muted></video></div>'
    + '<div class="flash" id="flash"><span class="ic">📷</span><div><div class="big">Listo para escanear</div><div class="sub">El cursor queda en el campo (lector de mano) o tocá “Registrar”.</div></div></div>'
    + '<div class="hero"><span class="n" id="tot">0</span><span class="lbl">unidades controladas</span></div>'
    + '<div class="opname"><label for="op">Operario</label><input class="inp" id="op" placeholder="Tu nombre (opcional)" value="'+esc(C.operario||'')+'"></div>'
    + '</div><div class="oplist"><table><thead><tr><th>Talle</th><th class="num">Controladas</th></tr></thead><tbody id="opBody"></tbody></table></div></div>';
  h += '<div class="row-actions"><button class="btn btn-primary" id="done">✓ Terminé el control</button></div>';
  $('view').innerHTML = h;
  $('back').onclick=()=>{ stopCam(); state.view='lista'; cargarIngreso().then(render).catch(render); };
  const inp=$('scan'); const doScan=()=>{ registrar(inp.value); inp.value=''; inp.focus(); };
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); doScan(); } });
  $('scanBtn').onclick=doScan; $('camBtn').onclick=toggleCam;
  $('op').onchange=()=>{ const C=ctrlOf(_key); if(C){ C.operario=$('op').value.trim(); saveControl(_key); } };
  $('done').onclick=terminar;
  updateDom(); inp.focus();
}
function registrar(raw){
  const R=DATA.remitos[_key]; if(!R) return;
  const ean=String(raw||'').replace(/\D/g,''); if(!ean) return;
  const C=ctrlInit(_key); const sku=(R.minimap||{})[ean];
  if(sku){ C.scans[sku]=(C.scans[sku]||0)+1; const d=(R.declarado||{})[sku]||{}; flash('ok','✓','Talle '+(d.talle||sku)+' · +1', (d.desc||'')+' · '+ean); }
  else { C.unknown[ean]=(C.unknown[ean]||0)+1; flash('bad','⚠','EAN desconocido', ean+' — no está en este remito'); }
  updateDom(); saveControl(_key);
}
function flash(kind,ic,big,sub){ const f=$('flash'); if(!f) return; f.className='flash '+(kind||''); f.innerHTML='<span class="ic">'+ic+'</span><div><div class="big">'+esc(big)+'</div><div class="sub">'+esc(sub||'')+'</div></div>'; }
function updateDom(){
  const R=DATA.remitos[_key]; const C=ctrlOf(_key); if(!R||!C) return;
  const t=$('tot'); if(t) t.textContent=fmtInt(scanTot(C));
  const body=$('opBody'); if(!body) return;
  const rows=Object.keys(C.scans||{}).map(sku=>{ const d=(R.declarado||{})[sku]||{}; return [d.talle||sku, C.scans[sku]]; });
  rows.sort((a,b)=> ordTalle(a[0])-ordTalle(b[0]) || String(a[0]).localeCompare(String(b[0])));
  let html=rows.map(r=>'<tr><td class="talle">'+esc(r[0])+'</td><td class="num">'+fmtInt(r[1])+'</td></tr>').join('');
  const uk=Object.keys(C.unknown||{}); if(uk.length){ let n=0; uk.forEach(e=>n+=C.unknown[e]); html+='<tr><td class="talle bad">? desconocidos</td><td class="num">'+fmtInt(n)+'</td></tr>'; }
  body.innerHTML = html || '<tr><td colspan="2" style="color:var(--muted)">Todavía no escaneaste nada.</td></tr>';
}
let _saveT=null;
function saveControl(key, now){ const C=DATA.control[key]; if(!C) return; const go=()=>fbPut(ROOT_ING+'/control/'+key,C).catch(()=>{}); clearTimeout(_saveT); if(now) go(); else _saveT=setTimeout(go,700); }
async function terminar(){
  const C=ctrlOf(_key); if(!C||scanTot(C)===0){ toast('No escaneaste nada','bad'); return; }
  if(!confirm('¿Terminaste el control de este remito? Se envía para que Ariel y Luis hagan la conciliación.')) return;
  C.terminado=true; C.terminado_en=nowISO(); if($('op')) C.operario=$('op').value.trim();
  const b=$('done'); if(b) b.disabled=true;
  try{ await fbPut(ROOT_ING+'/control/'+_key,C); stopCam(); toast('Control enviado ✓','ok'); state.view='lista'; await cargarIngreso(); render(); }
  catch(e){ if(b) b.disabled=false; toast('No se pudo enviar: '+e.message,'bad'); }
}

/* cámara (ZXing por CDN, lazy) — compartida por las dos tareas */
let _zx=null,_zxCtl=null;
function ensureZXing(){ return new Promise((res,rej)=>{ if(window.ZXing) return res(); const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js'; s.onload=()=>res(); s.onerror=()=>rej(new Error('no pude cargar el lector de cámara')); document.head.appendChild(s); }); }
async function toggleCam(){
  const box=$('cam'); if(!box) return;
  if(_zxCtl){ stopCam(); return; }
  try{ await ensureZXing(); box.style.display='block'; const reader=new ZXing.BrowserMultiFormatReader(); _zx=reader;
    _zxCtl=await reader.decodeFromVideoDevice(undefined, $('video'), (result)=>{ if(result){ registrar(result.getText()); } });
    const b=$('camBtn'); if(b) b.textContent='📷 Cerrar cámara';
  }catch(e){ toast(e.message,'bad'); box.style.display='none'; }
}
function stopCam(){ try{ if(_zxCtl&&_zxCtl.stop) _zxCtl.stop(); }catch(e){} try{ if(_zx&&_zx.reset) _zx.reset(); }catch(e){} _zxCtl=null; _zx=null; const box=$('cam'); if(box) box.style.display='none'; const b=$('camBtn'); if(b) b.textContent='📷 Cámara'; }

/* ============================================================ PICKING ========= */
/* El kiosco EJECUTA los picks creados en el módulo picking/. Datos en
   recepciones-mateu/picking/. Valida el scan contra el EAN horneado en cada
   variante (sin bajar el maestro); si no hay EAN (calzado/otras marcas) el
   operario confirma manual. */
DATA.pick = { pickings:{}, operarios:{} };
async function cargarPicking(){
  const [pk,ope]=await Promise.all([ fbGet('picking/pickings'), fbGet('picking/operarios') ]);
  DATA.pick={ pickings:pk||{}, operarios:ope||{} };
}
function pkK(nro){ return String(nro).replace(/[.#$/\[\]]/g,'~'); }
function pkGet(){ return DATA.pick.pickings[pkK(state.pickNro)]||null; }
async function pkSaveItem(nro,iid,item){ try{ await fbPut('picking/pickings/'+pkK(nro)+'/items/'+iid, item); }catch(e){} }
async function pkSaveField(nro,field,val){ try{ await fbPut('picking/pickings/'+pkK(nro)+'/'+field, val); }catch(e){} }
function pkEvento(ev){ const k=nowISO().replace(/\D/g,'')+'_'+Math.floor((performance.now()*7)%100000); fbPut('picking/eventos/'+k, Object.assign({ts:nowISO()},ev)).catch(()=>{}); }
function pkResumen(P){ let req=0,pk=0,lines=0,falt=0; Object.keys(P.items||{}).forEach(iid=>{ (P.items[iid].talles||[]).forEach(t=>{ lines++; req+=num(t.req); pk+=num(t.picked); if(t.faltante) falt+=Math.max(0,num(t.req)-num(t.picked)); }); }); return {req,pk,lines,falt}; }
function pkLines(P){ const out=[]; Object.keys(P.items||{}).map(iid=>({iid,...P.items[iid]})).sort((a,b)=>num(a.sequence)-num(b.sequence))
  .forEach(it=>{ (it.talles||[]).forEach((t,ti)=>{ out.push({iid:it.iid,ti,codigo:it.codigo,desc:it.desc,marca:it.marca,zona:it.zonaNombre||'Sin zona',talle:t.t,ean:t.ean||'',req:num(t.req),picked:num(t.picked),faltante:t.faltante||null}); }); }); return out; }
function pkNext(P){ return pkLines(P).find(l=>!l.faltante && l.picked<l.req)||null; }
function pkZonas(P){ return new Set(pkLines(P).map(l=>l.zona)).size; }

/* beep (WebAudio) */
let _ac=null; function beep(ok){ try{ _ac=_ac||new (window.AudioContext||window.webkitAudioContext)(); const o=_ac.createOscillator(),g=_ac.createGain(); o.connect(g); g.connect(_ac.destination); o.frequency.value=ok?880:200; o.type=ok?'sine':'square'; g.gain.value=.08; o.start(); setTimeout(()=>{o.stop();},ok?110:240); }catch(e){} }

function renderPickView(){ pkInjectCss();
  if(state.view==='op') return renderPickOperativo();
  if(state.view==='fin') return renderPickFin();
  if(state.view==='sum') return renderPickSummary();
  return renderPickLista();
}
function renderPickLista(){
  const exec={PENDIENTE:1,'EN PREPARACIÓN':1,'PAUSADO':1};
  const list=Object.keys(DATA.pick.pickings).map(k=>DATA.pick.pickings[k]).filter(P=>exec[P.estado])
    .sort((a,b)=>{ const pr={URGENTE:0,ALTA:1,NORMAL:2}; return (pr[a.prioridad]??2)-(pr[b.prioridad]??2) || cmp(a.created_at||'',b.created_at||''); });
  let h='<div class="sec-head"><div><h2>Pedidos para preparar</h2><div class="sub">Elegí un picking. Los urgentes van primero.</div></div>'
    +'<div style="display:flex;gap:8px"><button class="btn btn-outline" id="reloadP">↻ Actualizar</button><button class="btn btn-outline" id="home">← Tareas</button></div></div>';
  if(!list.length){ $('view').innerHTML=h+'<div class="state">No hay pickings pendientes. El encargado los crea desde el módulo Picking.</div>'; bindPHead(); return; }
  const cards=list.map(P=>{ const r=pkResumen(P); const est=P.estado;
    const pill=est==='PENDIENTE'?'<span class="pill mut">Pendiente</span>':(est==='PAUSADO'?'<span class="pill info">Pausado</span>':'<span class="pill info">En preparación</span>');
    const prio=(P.prioridad&&P.prioridad!=='NORMAL')?' · <b style="color:var(--red)">'+esc(P.prioridad)+'</b>':'';
    return '<div class="card" data-nro="'+esc(P.nro)+'"><div class="nro">PICK #'+esc(P.nro)+'</div>'
      +'<div class="sub">'+esc(nombreSuc(P.destino))+prio+'</div>'
      +'<div class="foot">'+pill+'<div class="n">'+fmtInt(r.req)+'<small>unidades</small></div></div></div>';
  }).join('');
  $('view').innerHTML=h+'<div class="grid">'+cards+'</div>';
  document.querySelectorAll('.card[data-nro]').forEach(c=>c.onclick=()=>{ state.pickNro=c.getAttribute('data-nro'); state.view='sum'; render(); });
  bindPHead();
}
function bindPHead(){ const r=$('reloadP'); if(r) r.onclick=async()=>{ r.disabled=true; try{ await cargarPicking(); render(); toast('Actualizado','ok'); }catch(e){ r.disabled=false; toast('No pude actualizar','bad'); } }; const hm=$('home'); if(hm) hm.onclick=backHome; }

  const P=pkGet(); if(!P){ state.view='lista'; return render(); }
  const line=pkNext(P);
  if(!line){ state.view='fin'; return render(); }
  const r=pkResumen(P); const rest=line.req-line.picked; const pct=r.req?Math.round(r.pk/r.req*100):0;
  let dots=''; for(let i=0;i<line.req;i++) dots+='<span class="dot'+(i<line.picked?' on':'')+'"></span>';
  let h='<div class="pk-op">'
    +'<div class="pk-top"><div class="pk-top-row"><span class="pk-id">PICK #'+esc(P.nro)+'</span>'
    +'<span class="pk-dest2">'+esc(nombreSuc(P.destino))+'</span><button class="btn btn-outline btn-xs" id="pausar">⏸ Pausar</button></div>'
    +'<div class="pk-progbar"><span id="pkPb" style="width:'+pct+'%"></span></div>'
    +'<div class="pk-progtxt" id="pkPt">'+fmtInt(r.pk)+' / '+fmtInt(r.req)+' unidades</div></div>'
    +'<div class="pk-zona"><div class="lbl">Ir a</div><div class="z">'+esc(line.zona)+'</div></div>'
    +'<div class="pk-prod" id="pkProd"><div class="desc">'+esc(line.desc||line.codigo)+'</div>'
    +'<div class="cod">'+esc(line.codigo)+(line.marca?(' · '+esc(line.marca)):'')+'</div>'
    +'<div class="talle"><small>Talle</small>'+esc(line.talle)+'</div>'
    +'<div class="pk-dots" id="pkDots">'+dots+'</div>'
    +'<div class="pk-qty" id="pkQty">Retirar <b>'+fmtInt(rest)+'</b><small>unidad'+(rest===1?'':'es')+'</small></div>'
    +'<div class="pk-fb" id="pkFb">'+(line.ean?'Escaneá cada unidad':'Sin código — contá y tocá +1')+'</div></div>'
    +'<div class="pk-scan"><input class="inp" id="pscan" inputmode="numeric" autocomplete="off" placeholder="Escaneá el producto…"><button class="btn btn-outline" id="pmanual">+1 manual</button></div>'
    +'<div class="pk-bottom"><button class="btn btn-outline" id="nostock">No encuentro stock</button></div>'
    +'</div>';
  $('view').innerHTML=h;
  const inp=$('pscan');
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); const v=inp.value; inp.value=''; pkScan(v); setTimeout(()=>{ const i=$('pscan'); if(i) i.focus(); },0); } });
  $('pmanual').onclick=()=>{ pkFeedback(true,'✓ +1'); pkContar(1,'manual'); };
  $('pausar').onclick=pkPausar;
  $('nostock').onclick=pkNoStock;
  inp.focus();
}
function pkFeedback(ok,msg){
  const prod=$('pkProd'); if(prod){ prod.classList.remove('ok','bad'); void prod.offsetWidth; prod.classList.add(ok?'ok':'bad'); setTimeout(()=>{ const p=$('pkProd'); if(p) p.classList.remove('ok','bad'); },500); }
  const fb=$('pkFb'); if(fb){ fb.className='pk-fb '+(ok?'ok':'bad'); fb.textContent=msg; }
  beep(ok);
}
function pkScan(raw){
  const P=pkGet(); const line=pkNext(P); if(!line) return;
  const ean=String(raw||'').replace(/\D/g,''); if(!ean) return;
  if(line.ean){
    if(ean===line.ean){ pkFeedback(true,'✓ Correcto'); pkContar(1,'scan'); }
    else { pkFeedback(false,'✗ Incorrecto — se espera talle '+line.talle); pkEvento({event_type:'sku_error',picking_id:P.nro,operator_id:P.operario,ean:ean,value:{esperado:line.ean}}); }
  } else { pkFeedback(true,'✓ +1 (sin validación de código)'); pkContar(1,'scan'); }
}
function pkContar(n,via){
  const P=pkGet(); const line=pkNext(P); if(!line) return;
  const item=P.items[line.iid]; const t=item.talles[line.ti];
  t.picked=Math.min(num(t.req), num(t.picked)+n);
  item.picked_qty=(item.talles||[]).reduce((s,x)=>s+num(x.picked),0);
  pkSaveItem(P.nro,line.iid,item); // backend fuente de verdad; no bloquea el escaneo
  pkEvento({event_type:'unit_picked',picking_id:P.nro,operator_id:P.operario,sku_id:line.codigo,ean:line.ean||null,value:{talle:line.talle,via:via}});
  if(t.picked>=num(t.req)) render();      // línea completa → avanza / o finaliza
  else pkUpdateOpDom();                    // en el lugar (sin recargar → no pierde foco)
}
function pkUpdateOpDom(){
  const P=pkGet(); const line=pkNext(P); if(!line) return;
  const r=pkResumen(P); const rest=line.req-line.picked; const pct=r.req?Math.round(r.pk/r.req*100):0;
  const dots=$('pkDots'); if(dots){ let s=''; for(let i=0;i<line.req;i++) s+='<span class="dot'+(i<line.picked?' on':'')+'"></span>'; dots.innerHTML=s; }
  const q=$('pkQty'); if(q) q.innerHTML='Retirar <b>'+fmtInt(rest)+'</b><small>unidad'+(rest===1?'':'es')+'</small>';
  const pb=$('pkPb'); if(pb) pb.style.width=pct+'%';
  const pt=$('pkPt'); if(pt) pt.textContent=fmtInt(r.pk)+' / '+fmtInt(r.req)+' unidades';
  const i=$('pscan'); if(i) i.focus();
}
function pkPausar(){ const P=pkGet(); P.estado='PAUSADO'; P.paused_at=nowISO(); pkSaveField(P.nro,'estado','PAUSADO'); pkSaveField(P.nro,'paused_at',P.paused_at); pkEvento({event_type:'picking_paused',picking_id:P.nro,operator_id:P.operario}); toast('Picking pausado — podés retomarlo después','ok'); state.view='lista'; render(); }
function pkNoStock(){
  const P=pkGet(); const line=pkNext(P); if(!line) return;
  const opts=['SIN STOCK EN UBICACIÓN','MENOS CANTIDAD QUE LA INDICADA','PRODUCTO INCORRECTO EN UBICACIÓN','UBICACIÓN VACÍA','OTRO'];
  $('view').insertAdjacentHTML('beforeend','<div class="cam" style="display:none"></div>');
  const html='<div style="position:fixed;inset:0;background:rgba(11,21,39,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:60" id="nsOv">'
    +'<div style="background:#fff;border-radius:14px;max-width:460px;width:100%;padding:20px">'
    +'<div style="font-family:var(--font-d);font-size:24px">No encuentro stock</div>'
    +'<div class="sub" style="font-family:var(--font-c);color:var(--muted);margin-bottom:6px">'+esc(line.desc||line.codigo)+' · Talle '+esc(line.talle)+' · faltan '+(line.req-line.picked)+'</div>'
    +opts.map((o,i)=>'<button class="btn btn-outline" data-ns="'+i+'" style="width:100%;justify-content:flex-start;margin-top:8px;text-align:left">'+esc(o)+'</button>').join('')
    +'<div class="row-actions" style="margin-top:14px"><button class="btn btn-outline" id="nsCancel">Cancelar</button></div></div></div>';
  document.body.insertAdjacentHTML('beforeend',html);
  const close=()=>{ const o=$('nsOv'); if(o) o.remove(); };
  $('nsCancel').onclick=close;
  document.querySelectorAll('[data-ns]').forEach(b=>b.onclick=async()=>{
    const motivo=opts[+b.getAttribute('data-ns')]; const item=P.items[line.iid]; const t=item.talles[line.ti];
    t.faltante={motivo, cant:Math.max(0,num(t.req)-num(t.picked))};
    item.picked_qty=(item.talles||[]).reduce((s,x)=>s+num(x.picked),0);
    P.con_diferencias=true;
    await pkSaveItem(P.nro,line.iid,item); await pkSaveField(P.nro,'con_diferencias',true);
    pkEvento({event_type:'shortage_reported',picking_id:P.nro,operator_id:P.operario,sku_id:line.codigo,value:{talle:line.talle,motivo,faltante:t.faltante.cant}});
    close(); render();
  });
}
function renderPickFin(){
  const P=pkGet(); if(!P){ state.view='lista'; return render(); }
  const r=pkResumen(P); const enc=r.pk, sol=r.req, falt=sol-enc;
  const dur=P.started_ms?fmtDur(Date.now()-P.started_ms):'—';
  $('view').innerHTML='<div class="sec-head"><div><h2>PICK #'+esc(P.nro)+'</h2><div class="sub">'+esc(nombreSuc(P.destino))+'</div></div></div>'
    +'<div class="summary"><div class="chk-ic">✓</div><div style="font-family:var(--font-d);font-size:26px;margin-top:6px">Picking completado</div>'
    +'<div class="sub" style="font-family:var(--font-c);color:var(--muted)">'+(P.operario?('Operario: '+esc(P.operario)):'')+'</div>'
    +'<div class="sumrow"><div class="s"><div class="v">'+fmtInt(sol)+'</div><div class="k">Solicitadas</div></div>'
    +'<div class="s"><div class="v">'+fmtInt(enc)+'</div><div class="k">Encontradas</div></div>'
    +'<div class="s"><div class="v" style="color:'+(falt>0?'var(--bad)':'var(--ok)')+'">'+fmtInt(falt)+'</div><div class="k">Faltantes</div></div>'
    +'<div class="s"><div class="v">'+dur+'</div><div class="k">Tiempo</div></div></div>'
    +(falt>0?'<div class="blind" style="margin-top:14px">Quedan '+falt+' unidades sin encontrar — se registran como diferencia para el control.</div>':'')
    +'<div class="row-actions" style="justify-content:center;margin-top:16px"><button class="btn btn-primary btn-lg" id="enviar">Enviar a control</button></div></div>';
  $('enviar').onclick=async()=>{
    const b=$('enviar'); b.disabled=true;
    P.estado='LISTO PARA CONTROL'; P.completed_at=nowISO(); P.con_diferencias=falt>0;
    await Promise.all([ pkSaveField(P.nro,'estado','LISTO PARA CONTROL'), pkSaveField(P.nro,'completed_at',P.completed_at), pkSaveField(P.nro,'con_diferencias',falt>0) ]);
    pkEvento({event_type:'picking_completed',picking_id:P.nro,operator_id:P.operario,value:{solicitadas:sol,encontradas:enc,faltantes:falt}});
    toast('Enviado a control','ok'); state.view='lista'; await cargarPicking(); render();
  };
}

/* ============================================================ CONTROL FINAL === */
/* Segunda etapa: otra persona re-escanea lo preparado y se cruza pedido→picking→
   control. Reusa los datos de picking/ (DATA.pick, pkGet/pkSaveItem/pkSaveField/
   pkEvento/pkFeedback) y la estética .pk-*. Prefijo cf (control final). */
function cfLines(P){ const out=[]; Object.keys(P.items||{}).map(iid=>({iid,...P.items[iid]})).sort((a,b)=>num(a.sequence)-num(b.sequence))
  .forEach(it=>{ (it.talles||[]).forEach((t,ti)=>{ if(num(t.picked)>0) out.push({iid:it.iid,ti,codigo:it.codigo,desc:it.desc,marca:it.marca,zona:it.zonaNombre||'Sin zona',talle:t.t,ean:t.ean||'',req:num(t.req),picked:num(t.picked),controlled:num(t.controlled)}); }); }); return out; }
function cfNext(P){ return cfLines(P).find(l=>l.controlled<l.picked)||null; }
function cfResumen(P){ let picked=0,ctrl=0,lines=0; cfLines(P).forEach(l=>{lines++;picked+=l.picked;ctrl+=l.controlled;}); return {picked,ctrl,lines}; }

function renderCfView(){ pkInjectCss();
  if(state.view==='op') return renderCfOperativo();
  if(state.view==='fin') return renderCfFin();
  if(state.view==='sum') return renderCfSummary();
  return renderCfLista();
}
function renderCfLista(){
  const list=Object.keys(DATA.pick.pickings).map(k=>DATA.pick.pickings[k]).filter(P=>P.estado==='LISTO PARA CONTROL')
    .sort((a,b)=>cmp(a.completed_at||'',b.completed_at||''));
  let h='<div class="sec-head"><div><h2>Pedidos para controlar</h2><div class="sub">Pickings ya preparados. Idealmente controla otra persona.</div></div>'
    +'<div style="display:flex;gap:8px"><button class="btn btn-outline" id="reloadC">↻ Actualizar</button><button class="btn btn-outline" id="home">← Tareas</button></div></div>';
  if(!list.length){ $('view').innerHTML=h+'<div class="state">No hay pickings esperando control.</div>'; bindCfHead(); return; }
  const cards=list.map(P=>{ const r=cfResumen(P);
    return '<div class="card" data-nro="'+esc(P.nro)+'"><div class="nro">PICK #'+esc(P.nro)+'</div>'
      +'<div class="sub">'+esc(nombreSuc(P.destino))+(P.operario?(' · pickeó '+esc(P.operario)):'')+(P.con_diferencias?' · <b style="color:var(--warn)">con faltantes</b>':'')+'</div>'
      +'<div class="foot"><span class="pill info">Para control</span><div class="n">'+fmtInt(r.picked)+'<small>preparadas</small></div></div></div>'; }).join('');
  $('view').innerHTML=h+'<div class="grid">'+cards+'</div>';
  document.querySelectorAll('.card[data-nro]').forEach(c=>c.onclick=()=>{ state.pickNro=c.getAttribute('data-nro'); state.view='sum'; render(); });
  bindCfHead();
}
function bindCfHead(){ const r=$('reloadC'); if(r) r.onclick=async()=>{ r.disabled=true; try{ await cargarPicking(); render(); toast('Actualizado','ok'); }catch(e){ r.disabled=false; toast('No pude actualizar','bad'); } }; const hm=$('home'); if(hm) hm.onclick=backHome; }

function renderCfSummary(){
  const P=pkGet(); if(!P){ state.view='lista'; return render(); }
  const r=cfResumen(P);
  const activos=Object.keys(DATA.pick.operarios).map(id=>DATA.pick.operarios[id]).filter(o=>o.activo!==false).sort((a,b)=>cmp(a.nombre,b.nombre));
  let h='<div class="sec-head"><div><h2>Control PICK #'+esc(P.nro)+'</h2><div class="sub">'+esc(nombreSuc(P.destino))+'</div></div><button class="btn btn-outline" id="backC">← Volver</button></div>';
  h+='<div class="startbox"><div class="big">'+esc(nombreSuc(P.destino))+'</div>'
    +'<div class="sub" style="font-family:var(--font-c);color:var(--muted)">Volvé a escanear lo preparado para verificarlo contra el picking.</div>'
    +'<div class="sumrow" style="margin:14px 0"><div class="s"><div class="v">'+fmtInt(r.picked)+'</div><div class="k">Preparadas</div></div>'
    +'<div class="s"><div class="v">'+fmtInt(r.lines)+'</div><div class="k">SKUs</div></div></div>'
    +'<div class="opname" style="justify-content:center"><label for="opC">Controla</label><select class="inp" id="opC" style="max-width:260px"><option value="">Elegí tu nombre…</option>'
    + activos.map(o=>'<option>'+esc(o.nombre)+'</option>').join('')+'</select></div>'
    + (P.operario?'<div class="sub" style="font-family:var(--font-c);color:var(--muted);font-size:12px">Este pick lo preparó '+esc(P.operario)+' — mejor que controle otra persona.</div>':'')
    +'<div style="margin-top:16px"><button class="btn btn-primary btn-lg" id="iniciarC">▶ Iniciar control</button></div></div>';
  $('view').innerHTML=h;
  $('backC').onclick=()=>{ state.view='lista'; render(); };
  $('iniciarC').onclick=async()=>{ const op=$('opC').value; if(!op){ toast('Elegí tu nombre','bad'); return; }
    P.controlado_por=op; P.control_started_at=nowISO(); P.control_started_ms=Date.now();
    await Promise.all([ pkSaveField(P.nro,'controlado_por',op), pkSaveField(P.nro,'control_started_at',P.control_started_at), pkSaveField(P.nro,'control_started_ms',P.control_started_ms) ]);
    pkEvento({event_type:'control_started',picking_id:P.nro,operator_id:op});
    state.view='op'; render();
  };
}

function renderCfOperativo(){
  const P=pkGet(); if(!P){ state.view='lista'; return render(); }
  const line=cfNext(P);
  if(!line){ state.view='fin'; return render(); }
  const r=cfResumen(P); const rest=line.picked-line.controlled; const pct=r.picked?Math.round(r.ctrl/r.picked*100):0;
  let dots=''; for(let i=0;i<line.picked;i++) dots+='<span class="dot'+(i<line.controlled?' on':'')+'"></span>';
  let h='<div class="pk-op">'
    +'<div class="pk-top"><div class="pk-top-row"><span class="pk-id">CONTROL #'+esc(P.nro)+'</span>'
    +'<span class="pk-dest2">'+esc(nombreSuc(P.destino))+'</span><button class="btn btn-outline btn-xs" id="salirC">← Salir</button></div>'
    +'<div class="pk-progbar"><span id="pkPb" style="width:'+pct+'%"></span></div>'
    +'<div class="pk-progtxt" id="pkPt">'+fmtInt(r.ctrl)+' / '+fmtInt(r.picked)+' controladas</div></div>'
    +'<div class="pk-zona"><div class="lbl">Verificar</div><div class="z">'+esc(line.zona)+'</div></div>'
    +'<div class="pk-prod" id="pkProd"><div class="desc">'+esc(line.desc||line.codigo)+'</div>'
    +'<div class="cod">'+esc(line.codigo)+(line.marca?(' · '+esc(line.marca)):'')+'</div>'
    +'<div class="talle"><small>Talle</small>'+esc(line.talle)+'</div>'
    +'<div class="pk-dots" id="pkDots">'+dots+'</div>'
    +'<div class="pk-qty" id="pkQty">Controlar <b>'+fmtInt(rest)+'</b><small>de '+fmtInt(line.picked)+' preparada'+(line.picked===1?'':'s')+'</small></div>'
    +'<div class="pk-fb" id="pkFb">'+(line.ean?'Escaneá cada unidad':'Sin código — contá y tocá +1')+'</div></div>'
    +'<div class="pk-scan"><input class="inp" id="cscan" inputmode="numeric" autocomplete="off" placeholder="Escaneá el producto…"><button class="btn btn-outline" id="cmanual">+1 manual</button></div>'
    +'<div class="pk-bottom"><button class="btn btn-outline" id="cfin">Terminar y ver resultado</button></div>'
    +'</div>';
  $('view').innerHTML=h;
  const inp=$('cscan');
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); const v=inp.value; inp.value=''; cfScan(v); setTimeout(()=>{ const i=$('cscan'); if(i) i.focus(); },0); } });
  $('cmanual').onclick=()=>{ pkFeedback(true,'✓ +1'); cfContar(1,'manual'); };
  $('salirC').onclick=()=>{ state.view='lista'; render(); };
  $('cfin').onclick=()=>{ state.view='fin'; render(); };
  inp.focus();
}
function cfScan(raw){
  const P=pkGet(); const line=cfNext(P); if(!line) return;
  const ean=String(raw||'').replace(/\D/g,''); if(!ean) return;
  if(line.ean){
    if(ean===line.ean){ pkFeedback(true,'✓ Correcto'); cfContar(1,'scan'); }
    else { pkFeedback(false,'✗ Incorrecto — se espera talle '+line.talle); pkEvento({event_type:'control_error',picking_id:P.nro,operator_id:P.controlado_por,ean:ean,value:{esperado:line.ean}}); }
  } else { pkFeedback(true,'✓ +1 (sin validación de código)'); cfContar(1,'scan'); }
}
function cfContar(n,via){
  const P=pkGet(); const line=cfNext(P); if(!line) return;
  const item=P.items[line.iid]; const t=item.talles[line.ti];
  t.controlled=Math.min(num(t.picked), num(t.controlled)+n);
  item.controlled_qty=(item.talles||[]).reduce((s,x)=>s+num(x.controlled),0);
  pkSaveItem(P.nro,line.iid,item);
  pkEvento({event_type:'control_scan',picking_id:P.nro,operator_id:P.controlado_por,sku_id:line.codigo,ean:line.ean||null,value:{talle:line.talle,via:via}});
  if(t.controlled>=num(t.picked)) render(); else cfUpdateOpDom();
}
function cfUpdateOpDom(){
  const P=pkGet(); const line=cfNext(P); if(!line) return;
  const r=cfResumen(P); const rest=line.picked-line.controlled; const pct=r.picked?Math.round(r.ctrl/r.picked*100):0;
  const dots=$('pkDots'); if(dots){ let s=''; for(let i=0;i<line.picked;i++) s+='<span class="dot'+(i<line.controlled?' on':'')+'"></span>'; dots.innerHTML=s; }
  const q=$('pkQty'); if(q) q.innerHTML='Controlar <b>'+fmtInt(rest)+'</b><small>de '+fmtInt(line.picked)+' preparada'+(line.picked===1?'':'s')+'</small>';
  const pb=$('pkPb'); if(pb) pb.style.width=pct+'%';
  const pt=$('pkPt'); if(pt) pt.textContent=fmtInt(r.ctrl)+' / '+fmtInt(r.picked)+' controladas';
  const i=$('cscan'); if(i) i.focus();
}
function renderCfFin(){
  const P=pkGet(); if(!P){ state.view='lista'; return render(); }
  const rows=cfLines(P).map(l=>Object.assign(l,{dif:l.picked-l.controlled}));
  const conDif=rows.filter(r=>r.dif!==0);
  const dur=P.control_started_ms?fmtDur(Date.now()-P.control_started_ms):'—';
  let h='<div class="sec-head"><div><h2>Control PICK #'+esc(P.nro)+'</h2><div class="sub">'+esc(nombreSuc(P.destino))+'</div></div><button class="btn btn-outline" id="volverC">← Seguir</button></div>';
  if(!conDif.length){
    h+='<div class="summary"><div class="chk-ic">✓</div><div style="font-family:var(--font-d);font-size:26px;margin-top:6px">Control correcto</div>'
      +'<div class="sub" style="font-family:var(--font-c);color:var(--muted)">Lo controlado coincide con lo preparado'+(P.controlado_por?(' · '+esc(P.controlado_por)):'')+' · '+dur+'</div>'
      +'<div class="row-actions" style="justify-content:center;margin-top:16px"><button class="btn btn-primary btn-lg" id="cerrar">Cerrar picking</button></div></div>';
  } else {
    h+='<div class="blind" style="margin-bottom:12px">Se detectaron <b>'+conDif.length+'</b> diferencia(s) entre lo preparado y lo controlado. Registrá el motivo para poder cerrar.</div>'
      +'<div class="oplist"><table><thead><tr><th>Talle</th><th class="num">Pedido</th><th class="num">Pickeado</th><th class="num">Controlado</th><th class="num">Dif.</th></tr></thead><tbody>'
      + rows.map(r=>'<tr'+(r.dif!==0?' style="background:#fdecec"':'')+'><td class="talle">'+esc(r.talle)+' <small style="color:var(--muted);font-weight:400">'+esc(r.codigo)+'</small></td><td class="num">'+fmtInt(r.req)+'</td><td class="num">'+fmtInt(r.picked)+'</td><td class="num">'+fmtInt(r.controlled)+'</td><td class="num'+(r.dif!==0?' bad':'')+'">'+(r.dif>0?'+':'')+(r.dif||0)+'</td></tr>').join('')
      +'</tbody></table></div>'
      +'<div class="opname" style="margin-top:12px"><label for="cexc">Motivo</label><input class="inp" id="cexc" style="flex:1;max-width:none" placeholder="Ej: faltaba 1 en la caja"></div>'
      +'<div class="row-actions" style="margin-top:12px"><button class="btn btn-primary" id="cerrarDif">Registrar excepción y cerrar</button></div>';
  }
  $('view').innerHTML=h;
  $('volverC').onclick=()=>{ state.view='op'; render(); };
  if($('cerrar')) $('cerrar').onclick=()=>cfCerrar(P,false,'');
  if($('cerrarDif')) $('cerrarDif').onclick=()=>{ const m=$('cexc').value.trim(); if(!m){ toast('Poné el motivo de la diferencia','bad'); return; } cfCerrar(P,true,m); };
}
async function cfCerrar(P,conDif,motivo){
  P.estado='FINALIZADO'; P.control_completed_at=nowISO(); P.control_ok=!conDif;
  const saves=[ pkSaveField(P.nro,'estado','FINALIZADO'), pkSaveField(P.nro,'control_completed_at',P.control_completed_at), pkSaveField(P.nro,'control_ok',!conDif) ];
  if(conDif){ P.con_diferencias=true; P.control_excepcion=motivo; saves.push(pkSaveField(P.nro,'con_diferencias',true), pkSaveField(P.nro,'control_excepcion',motivo)); }
  await Promise.all(saves);
  pkEvento({event_type:'control_completed',picking_id:P.nro,operator_id:P.controlado_por,value:{con_diferencias:conDif,motivo:motivo||''}});
  toast(conDif?'Cerrado con diferencias':'Control correcto — cerrado','ok'); state.view='lista'; await cargarPicking(); render();
}

/* ============================================================ init ============ */
render();
</script>
</body>
</html>
