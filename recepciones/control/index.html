<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tareas de Depósito — Mateu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="../../shared/marca.js"></script>
<script src="../../shared/iconos.js" defer></script>
<!-- Plano del depósito: mapa que resalta dónde está cada ítem durante el picking -->
<script src="../../picking/plano-deposito.js"></script>
<script src="../../picking/plano-mapa.js"></script>
<style>
  :root{
    --navy:#0B1527;--navy-mid:#1a2f55;--red:#CC0000;--off:#f5f7fc;--card:#fff;--border:#dce3f0;
    --muted:#6B7A99;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;
    --font-d:'Bebas Neue',sans-serif;--font-c:'Barlow Condensed',sans-serif;--font-b:'Barlow',sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--off);color:var(--navy);font-family:var(--font-b);min-height:100vh;min-height:100dvh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
  .top{background:var(--navy);border-bottom:3px solid var(--red);display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) 12px calc(20px + env(safe-area-inset-left))}
  .top h1{font-family:var(--font-d);font-size:24px;color:#fff;letter-spacing:1px;margin:0;font-weight:400}
  .top .ts{font-family:var(--font-c);font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#b0bcd4}
  .top .tag{font-family:var(--font-c);font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);padding:4px 11px;border-radius:999px}
  .sync-dot{width:11px;height:11px;border-radius:50%;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.15)}
  .sync-dot.ok{background:#3ddc84}
  .sync-dot.busy{background:#f2c078;animation:syncpulse 1s ease-in-out infinite}
  @keyframes syncpulse{0%,100%{opacity:.35}50%{opacity:1}}
  main{max-width:960px;margin:0 auto;padding:20px calc(16px + env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
  .sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .sec-head h2{font-family:var(--font-d);font-size:26px;letter-spacing:.5px;margin:0;font-weight:400}
  .sec-head .sub{font-family:var(--font-c);font-size:13px;color:var(--muted)}
  .btn{border:none;border-radius:9px;padding:11px 18px;min-height:44px;font-family:var(--font-c);font-size:14px;font-weight:700;letter-spacing:.5px;cursor:pointer;text-transform:uppercase}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:var(--red);color:#fff}.btn-primary:hover{background:#a00000}
  .btn-outline{background:#fff;border:1.5px solid var(--border);color:var(--navy)}.btn-outline:hover{border-color:var(--navy-mid)}
  .btn-lg{font-size:17px;padding:15px 26px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .inp{padding:11px 13px;border:1px solid var(--border);border-radius:8px;font-size:16px;color:var(--navy);background:#fff;font-family:var(--font-b)}
  .inp:focus{outline:2px solid var(--red);outline-offset:2px}
  .state{text-align:center;padding:50px 20px;color:var(--muted);font-family:var(--font-c);font-size:16px}
  .spin{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--red);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 12px}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* home */
  .home{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:6px}
  @media(max-width:640px){.home{grid-template-columns:1fr}}
  .task{background:#fff;border:1px solid var(--border);border-radius:14px;padding:26px 22px;cursor:pointer;transition:box-shadow .12s,transform .12s;text-align:left}
  .task:hover{box-shadow:0 8px 22px rgba(11,21,39,.12);transform:translateY(-2px)}
  .task .ic{font-size:34px}
  .task .t{font-family:var(--font-d);font-size:26px;letter-spacing:.5px;margin-top:8px}
  .task .d{font-family:var(--font-c);font-size:13px;color:var(--muted);margin-top:2px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;transition:box-shadow .12s,transform .12s}
  .card:hover{box-shadow:0 6px 18px rgba(11,21,39,.10);transform:translateY(-1px)}
  .card .nro{font-family:var(--font-d);font-size:22px;letter-spacing:.5px}
  .card .sub{font-family:var(--font-c);font-size:12px;color:var(--muted);margin-top:2px}
  .card .foot{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
  .pill{font-family:var(--font-c);font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:3px 10px;border-radius:999px}
  .pill.info{background:#e7eefc;color:#1a3a8a}.pill.mut{background:#eef1f7;color:var(--muted)}.pill.ok{background:#e8f5ee;color:#166534}
  .card .n{font-family:var(--font-d);font-size:20px}
  .card .n small{font-family:var(--font-c);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-left:4px}

  .blind{background:#fff4e2;border:1px solid #f4cd93;color:#8a5200;font-family:var(--font-c);font-weight:600;font-size:13px;border-radius:10px;padding:10px 14px;margin-bottom:16px}
  .scanbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .scanbar .inp{flex:1 1 260px;min-width:0;font-size:18px}
  .cam{margin-top:12px;border-radius:10px;overflow:hidden;background:#000;display:none}
  .cam video{width:100%;max-height:300px;display:block}
  .flash{margin-top:14px;border:1px solid var(--border);border-radius:10px;background:#f7f9fd;padding:14px 16px;min-height:60px;display:flex;gap:12px;align-items:center}
  .flash .ic{font-size:24px}.flash .big{font-family:var(--font-c);font-weight:700;font-size:18px}.flash .sub{font-size:13px;color:var(--muted)}
  .flash.ok{background:#e8f5ee;border-color:#bbe3c9}.flash.ok .big{color:#166534}
  .flash.bad{background:#fdecec;border-color:#f4c0c0}.flash.bad .big{color:#b00020}
  .hero{display:flex;align-items:baseline;gap:10px;margin:18px 0 6px}
  .hero .n{font-family:var(--font-d);font-size:56px;color:var(--navy);line-height:1}
  .hero .lbl{font-family:var(--font-c);font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:15px}
  th{font-family:var(--font-c);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:8px;border-bottom:1px solid var(--border)}
  td{padding:9px 8px;border-bottom:1px solid #eef1f7;font-variant-numeric:tabular-nums}
  td.num,th.num{text-align:right}td.talle{font-weight:700}.bad{color:var(--bad)}
  .ctrl-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}
  @media(max-width:760px){.ctrl-grid{grid-template-columns:1fr}}
  .oplist{border:1px solid var(--border);border-radius:12px;padding:8px 14px;background:#fff}
  .row-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
  .opname{display:flex;align-items:center;gap:8px;margin-top:14px}
  .opname label{font-family:var(--font-c);font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
  .opname .inp{flex:1;max-width:260px;font-size:16px}

  /* reposición / checklist */
  .startbox{background:#fff;border:1px solid var(--border);border-radius:14px;padding:34px 24px;text-align:center;margin-top:10px}
  .startbox .big{font-family:var(--font-d);font-size:30px;letter-spacing:.5px}
  .startbox .sub{font-family:var(--font-c);font-size:14px;color:var(--muted);margin:6px 0 20px}
  .summary{background:#fff;border:1px solid var(--border);border-radius:14px;padding:24px;text-align:center;margin-top:10px}
  .summary .chk-ic{font-size:40px;color:var(--ok)}
  .sumrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:16px}
  .sumrow .s{border:1px solid var(--border);border-radius:11px;padding:12px 18px;min-width:120px;background:#f7f9fd}
  .sumrow .s .v{font-family:var(--font-d);font-size:30px;color:var(--navy)}
  .sumrow .s .k{font-family:var(--font-c);font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--navy);color:#fff;padding:12px 20px;border-radius:10px;font-family:var(--font-c);font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
  .toast.show{opacity:1}.toast.bad{background:var(--bad)}.toast.ok{background:var(--ok)}

  /* --- mobile / tablet (celular y tablet, vertical y horizontal · Android + iOS) --- */
  .inp{font-size:16px}                         /* evita el auto-zoom de iOS al enfocar */
  .task,.card{-webkit-tap-highlight-color:transparent}
  .task:active,.card:active{transform:scale(.995)}
  .flash .sub{overflow-wrap:anywhere}
  .sec-head .btn,.row-actions .btn{flex:0 0 auto}
  @media (max-width:520px){
    .top h1{font-size:21px}
    .sec-head h2{font-size:22px}
    .hero .n{font-size:46px}
    .task{padding:22px 18px}
    .btn{padding:12px 16px}
    .row-actions .btn{flex:1 1 auto}          /* botones de acción a ancho completo en el celu */
    .startbox{padding:26px 16px}
  }
  @media (max-width:380px){ .scanbar .inp{flex-basis:100%} }
</style>
</head>
<body>
<header class="top">
  <div><h1 id="topTitle">Tareas de Depósito</h1><div class="ts">Depósito Central · Mateu Sports</div></div>
  <div style="display:flex;align-items:center;gap:10px"><span class="sync-dot ok" id="syncDot" title="Todo guardado"></span><span class="tag" id="topTag">Kiosco</span></div>
</header>
<main id="view"><div class="state"><div class="spin"></div>Cargando…</div></main>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   KIOSCO DE DEPÓSITO — sin login, aislado del portal. Dos tareas:
   1) Control de Ingreso: control ciego por scan de EAN (nodo ingreso/).
   2) Reposición: checklist de lo que hay que reponer a cada sucursal (nodo
      barrida/), con Comenzar/Finalizar → seguimiento de tiempo y resumen.
   Escribe SOLO ingreso/ y barrida/tareas de recepciones-mateu; no expone el portal.
   ============================================================ */
'use strict';
const $ = id => document.getElementById(id);
const FIREBASE_DB_URL = 'https://recepciones-mateu-default-rtdb.firebaseio.com';
const MENSAJES_DB_URL = 'https://mensajes-mateu-default-rtdb.firebaseio.com';   // Bandeja de avisos del Portal
const ROOT_ING = 'ingreso';
/* aviso al tablero del Portal (best-effort; no bloquea) */
function postAviso(texto){ try{ fetch(MENSAJES_DB_URL+'/avisos.json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({de:(typeof SESSION!=='undefined'&&SESSION&&SESSION.email)||'deposito@mateu.com.ar',texto:texto,ts:Date.now()})}).catch(function(){}); }catch(e){} }
const ROOT_BAR = 'barrida';

/* ---- Sesión del Portal (login blando). El kiosco vive bajo una cuenta de rol
   'deposito-tablet' (mail no real), igual que el puesto de consulta del Buscador.
   Sin sesión válida rebota al Portal; admin/deposito también pueden abrirlo. ---- */
const SESSION_KEY = 'mateu_portal_session';
const PORTAL_USUARIOS_URL = 'https://discontinuos-mateu-default-rtdb.firebaseio.com/usuarios.json';
function readSession(){ try{ return JSON.parse(localStorage.getItem(SESSION_KEY)||'null'); }catch(e){ return null; } }
const SESSION = readSession();
const ROLES_KIOSCO = ['deposito-tablet','admin','deposito'];
function sesionValida(){ return !!(SESSION && SESSION.email && ROLES_KIOSCO.indexOf(SESSION.rol)>=0); }
// Cerrar la sesión del kiosco: la cuenta 'deposito-tablet' pide el PIN (que un
// operario o cliente no desloguee la tablet); admin/deposito salen directo.
async function salirKiosco(){
  if(SESSION && SESSION.rol!=='deposito-tablet'){ location.href='../../'; return; }
  const pin = prompt('Para cerrar la sesión del kiosco, ingresá el PIN de la cuenta:');
  if(pin===null || !String(pin).trim()) return;
  try{
    const us = await (await fetch(PORTAL_USUARIOS_URL)).json();
    const mail = (SESSION.email||'').toLowerCase();
    const yo = Object.values(us||{}).find(u=>u && u.email && u.email.toLowerCase()===mail);
    if(!yo || String(yo.pin)!==String(pin).trim()){ toast('PIN incorrecto.','bad'); return; }
    try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
    location.href='../../';
  }catch(e){ toast('No se pudo verificar el PIN. Revisá la conexión.','bad'); }
}

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const num = x => { const n=Number(x); return isFinite(n)?n:0; };
const fmtInt = n => (Math.round(n||0)).toLocaleString('es-AR');
const cmp = (a,b)=>String(a==null?'':a).localeCompare(String(b==null?'':b),'es');
function fbUrl(path){ return FIREBASE_DB_URL.replace(/\/+$/,'')+'/'+path.split('/').map(encodeURIComponent).join('/')+'.json'; }
function fbKey(nro){ return String(nro||'').trim().replace(/[.#$/\[\]]/g,'~'); }
async function fbGet(path,q){ const r=await fetch(fbUrl(path)+(q?('?'+q):'')); if(!r.ok) throw new Error('Firebase HTTP '+r.status); return r.json(); }
async function fbPut(path,data){ const r=await fetch(fbUrl(path),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}); if(!r.ok) throw new Error('Firebase HTTP '+r.status); return r.json(); }
function nowISO(){ return new Date().toISOString().slice(0,19).replace('T',' '); }
function toast(msg,kind){ const t=$('toast'); t.textContent=msg; t.className='toast show '+(kind||''); setTimeout(()=>{t.className='toast '+(kind||'');},2600); }

/* ---- cola de guardado DURABLE: si se corta el wifi, no se pierde progreso ----
   Los guardados por unidad se encolan (persistidos en localStorage) y se reintentan
   hasta que salen. Un puntito en el header muestra el estado. */
var SAVEQ_KEY='pk_saveq';
var saveQueue=[]; var savingNow=false;
try{ saveQueue=JSON.parse(localStorage.getItem(SAVEQ_KEY)||'[]')||[]; }catch(e){ saveQueue=[]; }
function saveqPersist(){ try{ localStorage.setItem(SAVEQ_KEY, JSON.stringify(saveQueue)); }catch(e){} }
function saveqStatus(){ const el=$('syncDot'); if(!el) return; const pend=saveQueue.length; el.className='sync-dot '+(savingNow||pend?'busy':'ok'); el.title=(savingNow||pend)?('Guardando… '+pend+' pendiente'+(pend===1?'':'s')):'Todo guardado'; }
function enqueueSave(path,data){
  var start=savingNow?1:0; // no tocar el que se está enviando
  for(var i=start;i<saveQueue.length;i++){ if(saveQueue[i].p===path){ saveQueue[i].d=data; saveqPersist(); saveqStatus(); procesarCola(); return; } }
  saveQueue.push({p:path,d:data}); saveqPersist(); saveqStatus(); procesarCola();
}
function procesarCola(){
  if(savingNow){ return; } if(!saveQueue.length){ saveqStatus(); return; }
  savingNow=true; saveqStatus();
  const job=saveQueue[0];
  fbPut(job.p, job.d).then(function(){ saveQueue.shift(); saveqPersist(); savingNow=false; saveqStatus(); if(saveQueue.length) procesarCola(); })
    .catch(function(){ savingNow=false; saveqStatus(); setTimeout(procesarCola, 3000); });
}
// guardar YA (transiciones): intenta directo y, si falla, cae a la cola
async function saveNow(path,data){ try{ await fbPut(path,data); return true; }catch(e){ enqueueSave(path,data); return false; } }
window.addEventListener('online', procesarCola);
window.addEventListener('beforeunload', function(e){ if(saveQueue.length){ e.preventDefault(); e.returnValue=''; } });
const vals = o => o?Object.keys(o).map(k=>o[k]):[];
function fmtDur(ms){ if(!ms||ms<0) return '—'; const s=Math.round(ms/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60; if(h) return h+'h '+m+'m'; if(m) return m+'m '+ss+'s'; return ss+'s'; }
function nombreSuc(slug){ return String(slug||'').split('-').map(w=> !w?w:(w.length<=2?w.toUpperCase():w.charAt(0).toUpperCase()+w.slice(1))).join(' '); }

const state = { task:null, view:'lista', remito:null, suc:null };
const DATA = { remitos:{}, control:{}, pick:{ pickings:{}, operarios:{} } };

/* ============================================================ HOME ============ */
function render(){
  const tt=$('topTitle'), tg=$('topTag');
  if(!state.task){ tt.textContent='Tareas de Depósito'; tg.textContent='Kiosco'; return renderHome(); }
  if(state.task==='ingreso'){ tt.textContent='Control de Ingreso'; tg.textContent='A ciegas'; return (state.view==='control')?renderControl():renderIngLista(); }
  if(state.task==='picking'){ tt.textContent='Picking'; tg.textContent=(state.view==='op'?'Preparando':'Pedidos'); return renderPickView(); }
  if(state.task==='cfinal'){ tt.textContent='Control'; tg.textContent=(state.view==='op'?'Controlando':'Pedidos'); return renderCfView(); }
}
function renderHome(){
  $('view').innerHTML =
    '<div class="sec-head"><div><h2>¿Qué vas a hacer?</h2><div class="sub">Elegí la tarea.</div></div></div>'
    + '<div class="home">'
    + '<button class="task" id="tIng"><div class="ic">📦</div><div class="t">Control de Ingreso</div><div class="d">Controlar un remito que llegó al depósito, escaneando cada unidad.</div></button>'
    + '<button class="task" id="tRep"><div class="ic">📋</div><div class="t">Picking</div><div class="d">Preparar los pedidos asignados: te guía ubicación → producto → cantidad, con scan.</div></button>'
    + '<button class="task" id="tCf"><div class="ic">✅</div><div class="t">Control</div><div class="d">Controlar un pedido ya preparado: re-escaneás y el sistema verifica contra el picking.</div></button>'
    + '</div>'
    + '<div style="text-align:center;margin-top:26px"><button class="btn btn-outline btn-sm" id="btnSalirKio">🔒 Cerrar sesión del kiosco</button></div>';
  $('tIng').onclick=()=>enterTask('ingreso');
  $('tRep').onclick=()=>enterTask('picking');
  $('tCf').onclick=()=>enterTask('cfinal');
  $('btnSalirKio').onclick=salirKiosco;
}
async function enterTask(task){
  state.task=task; state.view='lista'; state.remito=null; state.suc=null;
  $('view').innerHTML='<div class="state"><div class="spin"></div>Cargando…</div>';
  try{
    if(task==='ingreso') await cargarIngreso();
    else if(task==='picking' || task==='cfinal') await cargarPicking();
    render();
  }catch(e){ $('view').innerHTML='<div class="state">No pude cargar. Revisá la conexión.<br><br><button class="btn btn-outline" onclick="location.reload()">↻ Reintentar</button></div>'; }
}
function backHome(){ state.task=null; render(); }

/* ============================================================ INGRESO ========= */
const ING_ORD_TALLE=['XS','S','M','L','XL','2XL','3XL','XXS'];
const ordTalle=t=>{ const i=ING_ORD_TALLE.indexOf(String(t||'')); return i<0?99:i; };
function ctrlOf(key){ return DATA.control[key]||null; }
function ctrlInit(key){ let C=DATA.control[key]; if(!C){ C={scans:{},unknown:{},operario:'',terminado:false,inicio:nowISO()}; DATA.control[key]=C; } if(!C.scans)C.scans={}; if(!C.unknown)C.unknown={}; return C; }
function scanTot(C){ let t=0; if(!C) return 0; for(const k in (C.scans||{})) t+=num(C.scans[k]); for(const k in (C.unknown||{})) t+=num(C.unknown[k]); return t; }
async function cargarIngreso(){ const [rem,con,ope]=await Promise.all([ fbGet(ROOT_ING+'/remitos'), fbGet(ROOT_ING+'/control'), fbGet('picking/operarios').catch(()=>null) ]); DATA.remitos=rem||{}; DATA.control=con||{}; DATA.ingOperarios=ope||{}; }

function renderIngLista(){
  const pend = vals(DATA.remitos).filter(R=>{ const key=fbKey(R.nro); const C=ctrlOf(key); return !(C&&C.terminado) && !R.ingresado; })
    .sort((a,b)=>String(b.creado_en||'').localeCompare(String(a.creado_en||'')));
  let h = '<div class="sec-head"><div><h2>Remitos para controlar</h2><div class="sub">Elegí el remito que estás controlando y escaneá cada unidad.</div></div>'
    + '<div style="display:flex;gap:8px"><button class="btn btn-outline" id="reload">↻ Actualizar</button><button class="btn btn-outline" id="home">← Tareas</button></div></div>';
  if(!pend.length){ $('view').innerHTML = h + '<div class="state">No hay remitos pendientes de control. Cuando Ariel o Luis pre-ingresen uno, aparece acá.</div>'; bindIngListaHead(); return; }
  const cards = pend.map(R=>{
    const key=fbKey(R.nro); const C=ctrlOf(key); const sc=scanTot(C);
    const est = sc>0 ? '<span class="pill info">En control</span>' : '<span class="pill mut">Sin empezar</span>';
    return '<div class="card" data-key="'+esc(key)+'"><div class="nro">'+esc(R.nro)+'</div>'
      + '<div class="sub">'+esc(R.proveedor||'ADIDAS')+(R.fecha?(' · '+esc(R.fecha)):'')+(R.bultos?(' · '+esc(String(R.bultos))+' bultos'):'')+'</div>'
      + '<div class="foot">'+est+'<div class="n">'+fmtInt(sc)+'<small>controladas</small></div></div></div>';
  }).join('');
  $('view').innerHTML = h + '<div class="grid">'+cards+'</div>';

// reloj del control de ingreso: corre desde la primera unidad escaneada
let _ingTick=null;
function ingReloj(){ const pinta=()=>{ const el=$('ingClock'), C=ctrlOf(_key); if(!el){ clearInterval(_ingTick); _ingTick=null; return; } if(!C||!C.iniciado_ms){ el.textContent=''; return; }
    const s=Math.max(0,Math.floor((Date.now()-C.iniciado_ms)/1000)), hh=Math.floor(s/3600), mm=Math.floor(s%3600/60), ss=s%60; el.textContent='⏱ '+(hh?hh+':':'')+String(mm).padStart(hh?2:1,'0')+':'+String(ss).padStart(2,'0'); };
  clearInterval(_ingTick); pinta(); _ingTick=setInterval(pinta,1000); }
function registrar(raw){
  const R=DATA.remitos[_key]; if(!R) return;
  const ean=String(raw||'').replace(/\D/g,''); if(!ean) return;
  // el operario sale del padrón y es obligatorio: el control entra al dashboard con su nombre y su tiempo
  const opSel=$('op')?$('op').value.trim():''; if(!opSel){ flash('bad','⚠','Elegí tu nombre','Antes de escanear, elegí quién está controlando.'); toast('Elegí tu nombre','bad'); return; }
  const C=ctrlInit(_key); C.operario=opSel; if(!C.iniciado_ms){ C.iniciado_ms=Date.now(); C.iniciado_en=nowISO(); }
  const sku=(R.minimap||{})[ean];
  if(sku){ C.scans[sku]=(C.scans[sku]||0)+1; const d=(R.declarado||{})[sku]||{}; flash('ok','✓','Talle '+(d.talle||sku)+' · +1', (d.desc||'')+' · '+ean); }
  else { C.unknown[ean]=(C.unknown[ean]||0)+1; flash('bad','⚠','EAN desconocido', ean+' — no está en este remito'); }

}
function flash(kind,ic,big,sub){ const f=$('flash'); if(!f) return; f.className='flash '+(kind||''); f.innerHTML='<span class="ic">'+ic+'</span><div><div class="big">'+esc(big)+'</div><div class="sub">'+esc(sub||'')+'</div></div>'; }
function updateDom(){
  const R=DATA.remitos[_key]; const C=ctrlOf(_key); if(!R||!C) return;
  const t=$('tot'); if(t) t.textContent=fmtInt(scanTot(C));

  rows.sort((a,b)=> ordTalle(a[0])-ordTalle(b[0]) || String(a[0]).localeCompare(String(b[0])));
  let html=rows.map(r=>'<tr><td class="talle">'+esc(r[0])+'</td><td class="num">'+fmtInt(r[1])+'</td></tr>').join('');
  const uk=Object.keys(C.unknown||{}); if(uk.length){ let n=0; uk.forEach(e=>n+=C.unknown[e]); html+='<tr><td class="talle bad">? desconocidos</td><td class="num">'+fmtInt(n)+'</td></tr>'; }
  body.innerHTML = html || '<tr><td colspan="2" style="color:var(--muted)">Todavía no escaneaste nada.</td></tr>';

function saveControl(key, now){ const C=DATA.control[key]; if(!C) return; const go=()=>fbPut(ROOT_ING+'/control/'+key,C).catch(()=>{}); clearTimeout(_saveT); if(now) go(); else _saveT=setTimeout(go,700); }
async function terminar(){

let _zx=null,_zxCtl=null;
function ensureZXing(){ return new Promise((res,rej)=>{ if(window.ZXing) return res(); const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js'; s.onload=()=>res(); s.onerror=()=>rej(new Error('no pude cargar el lector de cámara')); document.head.appendChild(s); }); }
async function toggleCam(){

  try{ await ensureZXing(); box.style.display='block'; const reader=new ZXing.BrowserMultiFormatReader(); _zx=reader;
    _zxCtl=await reader.decodeFromVideoDevice(undefined, $('video'), (result)=>{ if(result){ registrar(result.getText()); } });

}
function stopCam(){ try{ if(_zxCtl&&_zxCtl.stop) _zxCtl.stop(); }catch(e){} try{ if(_zx&&_zx.reset) _zx.reset(); }catch(e){} _zxCtl=null; _zx=null; const box=$('cam'); if(box) box.style.display='none'; const b=$('camBtn'); if(b) b.textContent='📷 Cámara'; }

/* El kiosco EJECUTA las tareas creadas en el módulo picking/. Datos en
   recepciones-mateu/picking/. Cada unidad se valida leyendo su etiqueta (ver «ESCANEO FORZADO»). */
DATA.pick = { pickings:{}, operarios:{}, eanVar:{} };
async function cargarPicking(){
  const [pk,ope,ev]=await Promise.all([ fbGet('picking/pickings'), fbGet('picking/operarios'), fbGet('picking/eanVar').catch(()=>null) ]);
  DATA.pick={ pickings:pk||{}, operarios:ope||{}, eanVar:ev||{} };
}
/* Tareas por remito (Reparto inicial) o por marca·rubro (Barrida de reserva), 20/09/2026: el pick
   ya no es por sucursal; cada talle trae `dest=[{s:slug,u}]` y la pantalla dice a qué sucursal va
   la unidad que se está preparando. Los picks viejos (con `destino`) siguen andando. */
const PK_TIPO={ reparto:'Reparto inicial', barrida:'Barrida de reserva' };
function pkTitulo(P){ return P.titulo || nombreSuc(P.destino); }
function pkTipoTxt(P){ return PK_TIPO[P.tipo]||'Pedido de sucursal'; }
// a qué sucursal va la PRÓXIMA unidad de la línea (se llenan los destinos en orden)
function pkDestActual(line){ let acc=0; const ds=line.dest||[]; for(let i=0;i<ds.length;i++){ acc+=num(ds[i].u); if(line.picked<acc) return i; } return -1; }
function pkK(nro){ return String(nro).replace(/[.#$/\[\]]/g,'~'); }
function pkGet(){ return DATA.pick.pickings[pkK(state.pickNro)]||null; }
function pkSaveItem(nro,iid,item){ enqueueSave('picking/pickings/'+pkK(nro)+'/items/'+iid, item); }         // por unidad: durable, no bloquea el scan
async function pkSaveField(nro,field,val){ return saveNow('picking/pickings/'+pkK(nro)+'/'+field, val); }        // transiciones: guarda ya (con fallback a cola)
function pkEvento(ev){ const k=nowISO().replace(/\D/g,'')+'_'+Math.floor((performance.now()*7)%100000); enqueueSave('picking/eventos/'+k, Object.assign({ts:nowISO()},ev)); }
function pkResumen(P){ let req=0,pk=0,lines=0,falt=0,exc=0; Object.keys(P.items||{}).forEach(iid=>{ (P.items[iid].talles||[]).forEach(t=>{ lines++; req+=num(t.req); pk+=num(t.picked); exc+=num(t.exc); if(t.faltante) falt+=Math.max(0,num(t.req)-num(t.picked)); }); }); return {req,pk,lines,falt,exc}; }
function pkLines(P){ const out=[]; Object.keys(P.items||{}).map(iid=>({iid,...P.items[iid]})).sort((a,b)=>num(a.sequence)-num(b.sequence))
  .forEach(it=>{ (it.talles||[]).forEach((t,ti)=>{ out.push({iid:it.iid,ti,codigo:it.codigo,desc:it.desc,marca:it.marca,zona:it.zonaNombre||'Sin zona',talle:t.t,ean:t.ean||'',req:num(t.req),picked:num(t.picked),faltante:t.faltante||null,dest:t.dest||null}); }); }); return out; }
function pkNext(P){ return pkLines(P).find(l=>!l.faltante && l.picked<l.req)||null; }
function pkZonas(P){ return new Set(pkLines(P).map(l=>l.zona)).size; }

/* ============ ESCANEO FORZADO (20/09/2026, pedido de Juli) ============
   Cada unidad se confirma LEYENDO la etiqueta (lector de mano o cámara de la tablet): ya no hay
   «+1 manual». Una etiqueta vale si es: (1) el EAN horneado en la tarea (maestro Adidas); (2) un EAN
   ya aprendido para ese artículo·talle (`picking/eanVar/<cod>/<talle>/<gtin>`); (3) un EAN del mapa
   compartido del Buscador de Artículos (`ubicaciones-mateu/ean/<gtin13>`) que apunte al mismo
   código — si el mapa no trae el talle, o la etiqueta no está en ningún lado, se pregunta UNA vez
   «¿es este artículo y talle?» y queda aprendida; (4) la etiqueta del proveedor con el código (con
   o sin las 3 letras de marca) y el talle pegado. Lo único sin leer es la EXCEPCIÓN con motivo
   (sin etiqueta / ilegible / lector roto), que queda registrada por unidad. */
const EAN_MAPA='https://ubicaciones-mateu-default-rtdb.firebaseio.com/ean';
function gtin13(raw){ let d=String(raw||'').replace(/\D/g,''); if(d.length===12) d='0'+d; else if(d.length===14&&d.charAt(0)==='0') d=d.slice(1); return d; }
function mismoEan(a,b){ a=gtin13(a); b=gtin13(b); if(!a||!b) return false; return a===b || (a.length>=11&&b.length>=11&&a.slice(-11)===b.slice(-11)); }
function codNorm(s){ return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }
function talleNorm(t){ t=String(t||'').toUpperCase().trim().replace(',','.'); if(/^\d+-$/.test(t)) t=t.slice(0,-1)+'.5'; return t.replace(/\.0$/,''); }
function evKey(s){ return String(s||'').trim().replace(/[.#$/\[\]]/g,'~')||'_'; }
// EAN ya aprendido para ese artículo: devuelve la CLAVE de talle donde está guardado (o null)
function eanAprendido(codigo,g){ const c=DATA.pick.eanVar[evKey(codigo)]; if(!c) return null;
  const ks=Object.keys(c); for(let i=0;i<ks.length;i++){ if(Object.keys(c[ks[i]]||{}).some(e=>mismoEan(e,g))) return ks[i]; } return null; }
const _eanMapa={};
async function eanMapa(g){ if(_eanMapa[g]!==undefined) return _eanMapa[g];
  const get=async u=>{ const c=new AbortController(); const tm=setTimeout(()=>c.abort(),7000); try{ const r=await fetch(u,{signal:c.signal}); if(!r.ok) throw new Error('http'); return await r.json(); } finally{ clearTimeout(tm); } };
  let v=await get(EAN_MAPA+'/'+g+'.json');
  if(!v && g.length>=11){ const k=await get(EAN_MAPA+'/suf/'+g.slice(-11)+'.json'); if(k && typeof k==='string') v=await get(EAN_MAPA+'/'+encodeURIComponent(k)+'.json'); }
  _eanMapa[g]=v||null; return _eanMapa[g]; }
// etiqueta de proveedor (texto): 'ok' artículo+talle · 'art' solo el artículo · 'talle' otro talle · null no es
function etiquetaTexto(raw,line){ const q=codNorm(raw), c=codNorm(line.codigo), t=codNorm(talleNorm(line.talle)); if(q.length<4) return null;
  const bases=[c]; if(c.length>7) bases.push(c.slice(3));
  for(let i=0;i<bases.length;i++){ const b=bases[i]; if(q.indexOf(b)!==0) continue; const resto=q.slice(b.length);
    if(!resto) return 'art'; if(resto===t || (resto.length<=t.length+5 && resto.slice(-t.length)===t)) return 'ok'; return 'talle'; }
  return null; }
// valida una lectura contra la línea que toca → {ok:true|false, msg} | {preguntar:{g, enMapa}} | null
async function pkValidar(raw, line, P){
  const txt=String(raw||'').trim(); if(!txt) return null;
  const soloNum=/^[\d\s\-]+$/.test(txt) && txt.replace(/\D/g,'').length>=8;
  // primero la etiqueta del proveedor: hay códigos de artículo que son todos números (Atomik) y parecerían un EAN
  const e=etiquetaTexto(txt,line);
  if(e==='ok') return {ok:true,msg:'✓ Correcto'}; if(e==='art') return {ok:true,msg:'✓ Artículo correcto'};
  if(e==='talle') return {ok:false,msg:'✗ Es el artículo pero OTRO talle — va talle '+line.talle};
  if(!soloNum) return {ok:false,msg:'✗ Esa etiqueta no es de este artículo'};
  const g=gtin13(txt);
  if(line.ean && mismoEan(line.ean,g)) return {ok:true,msg:'✓ Correcto'};
  const otra=pkLines(P).find(l=>l.ean && mismoEan(l.ean,g));
  if(otra) return {ok:false,msg:'✗ Ese es '+(otra.codigo===line.codigo?'':'otro artículo: '+(otra.desc||otra.codigo)+' · ')+'talle '+otra.talle+' — ahora va talle '+line.talle};
  const tk=eanAprendido(line.codigo,g);
  if(tk!=null){ if(tk===evKey(talleNorm(line.talle))) return {ok:true,msg:'✓ Correcto'}; return {ok:false,msg:'✗ Esa etiqueta es del talle '+tk.replace(/~/g,'.')+' — va talle '+line.talle}; }
  if(line.ean) return {ok:false,msg:'✗ Incorrecto — se espera talle '+line.talle};     // la variante tiene EAN conocido y no es ese
  let v; try{ v=await eanMapa(g); }catch(e){ return {ok:false,msg:'Sin conexión: no pude validar la etiqueta. Probá de nuevo.'}; }
  if(v && v.codigo){
    if(codNorm(v.codigo)!==codNorm(line.codigo)) return {ok:false,msg:'✗ Es otro artículo: '+(v.descripcion||v.codigo)};
    if(v.t){ return talleNorm(v.t)===talleNorm(line.talle) ? {ok:true,msg:'✓ Correcto'} : {ok:false,msg:'✗ Esa etiqueta es del talle '+v.t+' — va talle '+line.talle}; }
    return {preguntar:{g:g,enMapa:true}}; }
  return {preguntar:{g:g,enMapa:false}};
}
function pkAprender(line,g,P,quien){ const ck=evKey(line.codigo), tk=evKey(talleNorm(line.talle));
  const c=DATA.pick.eanVar[ck]||(DATA.pick.eanVar[ck]={}); (c[tk]=c[tk]||{})[g]={por:quien||'',ts:Date.now(),pick:P.nro};
  enqueueSave('picking/eanVar/'+ck+'/'+tk+'/'+g, c[tk][g]); }

    else { pkFeedback(false,r.msg); pkEvento({event_type:'sku_error',picking_id:P.nro,operator_id:P.operario,ean:String(raw).trim().slice(0,40),value:{esperado:line.ean||(line.codigo+' '+line.talle),msg:r.msg}}); }
  } finally { _pkBusy=false; const i=$('pscan'); if(i) i.focus(); }
}
function pkContar(n,via){
  const P=pkGet(); const line=pkNext(P); if(!line) return;
  const item=P.items[line.iid]; const t=item.talles[line.ti];
  t.picked=Math.min(num(t.req), num(t.picked)+n);
  item.picked_qty=(item.talles||[]).reduce((s,x)=>s+num(x.picked),0);
  pkSaveItem(P.nro,line.iid,item); // backend fuente de verdad; no bloquea el escaneo
  pkEvento({event_type:'unit_picked',picking_id:P.nro,operator_id:P.operario,sku_id:line.codigo,ean:line.ean||null,value:{talle:line.talle,via:via}});
  if(t.picked>=num(t.req)) render();      // línea completa → avanza / o finaliza
  else pkUpdateOpDom();                    // en el lugar (sin recargar → no pierde foco)
}
function pkUpdateOpDom(){
  const P=pkGet(); const line=pkNext(P); if(!line) return;
  const r=pkResumen(P); const rest=line.req-line.picked; const pct=r.req?Math.round(r.pk/r.req*100):0;
  const dots=$('pkDots'); if(dots){ let s=''; for(let i=0;i<line.req;i++) s+='<span class="dot'+(i<line.picked?' on':'')+'"></span>'; dots.innerHTML=s; }
  const q=$('pkQty'); if(q) q.innerHTML='Retirar <b>'+fmtInt(rest)+'</b><small>unidad'+(rest===1?'':'es')+'</small>';
  const pb=$('pkPb'); if(pb) pb.style.width=pct+'%';
  const pt=$('pkPt'); if(pt) pt.textContent=fmtInt(r.pk)+' / '+fmtInt(r.req)+' unidades';
  const pd=$('pkDest'); if(pd) pd.innerHTML=pkDestHtml(line);
  const i=$('pscan'); if(i) i.focus();
}

/* Segunda etapa: otra persona re-escanea lo preparado y se cruza pedido→picking→
   control. Reusa los datos de picking/ (DATA.pick, pkGet/pkSaveItem/pkSaveField/
   pkEvento/pkFeedback) y la estética .pk-*. Prefijo cf (control final). */
function cfLines(P){ const out=[]; Object.keys(P.items||{}).map(iid=>({iid,...P.items[iid]})).sort((a,b)=>num(a.sequence)-num(b.sequence))
  .forEach(it=>{ (it.talles||[]).forEach((t,ti)=>{ if(num(t.picked)>0) out.push({iid:it.iid,ti,codigo:it.codigo,desc:it.desc,marca:it.marca,zona:it.zonaNombre||'Sin zona',talle:t.t,ean:t.ean||'',req:num(t.req),picked:num(t.picked),controlled:num(t.controlled)}); }); }); return out; }
function cfNext(P){ return cfLines(P).find(l=>l.controlled<l.picked)||null; }
function cfResumen(P){ let picked=0,ctrl=0,lines=0; cfLines(P).forEach(l=>{lines++;picked+=l.picked;ctrl+=l.controlled;}); return {picked,ctrl,lines}; }

async function cfScan(raw){
  if(_pkBusy) return; const P=pkGet(); const line=cfNext(P); if(!line) return;
  _pkBusy=true;
  try{
    const r=await pkValidar(raw,line,P); if(!r) return;
    const sigue=cfNext(pkGet()); if(!sigue || sigue.iid!==line.iid || sigue.ti!==line.ti) return;
    if(r.preguntar){ beep(false);
      const si=await pkPreguntar(line,r.preguntar);
      if(si){ pkAprender(line,r.preguntar.g,P,P.controlado_por); pkFeedback(true,'✓ Etiqueta guardada · +1'); cfContar(1,'scan'); }
      else pkFeedback(false,'✗ No era — se espera talle '+line.talle);
      return; }
    if(r.ok){ pkFeedback(true,r.msg); cfContar(1,'scan'); }
    else { pkFeedback(false,r.msg); pkEvento({event_type:'control_error',picking_id:P.nro,operator_id:P.controlado_por,ean:String(raw).trim().slice(0,40),value:{esperado:line.ean||(line.codigo+' '+line.talle),msg:r.msg}}); }
  } finally { _pkBusy=false; const i=$('cscan'); if(i) i.focus(); }
}
function cfContar(n,via){
  const P=pkGet(); const line=cfNext(P); if(!line) return;
  const item=P.items[line.iid]; const t=item.talles[line.ti];
  t.controlled=Math.min(num(t.picked), num(t.controlled)+n);
  item.controlled_qty=(item.talles||[]).reduce((s,x)=>s+num(x.controlled),0);
  pkSaveItem(P.nro,line.iid,item);
  pkEvento({event_type:'control_scan',picking_id:P.nro,operator_id:P.controlado_por,sku_id:line.codigo,ean:line.ean||null,value:{talle:line.talle,via:via}});
  if(t.controlled>=num(t.picked)) render(); else cfUpdateOpDom();
}
function cfUpdateOpDom(){
  const P=pkGet(); const line=cfNext(P); if(!line) return;
  const r=cfResumen(P); const rest=line.picked-line.controlled; const pct=r.picked?Math.round(r.ctrl/r.picked*100):0;
  const dots=$('pkDots'); if(dots){ let s=''; for(let i=0;i<line.picked;i++) s+='<span class="dot'+(i<line.controlled?' on':'')+'"></span>'; dots.innerHTML=s; }
  const q=$('pkQty'); if(q) q.innerHTML='Controlar <b>'+fmtInt(rest)+'</b><small>de '+fmtInt(line.picked)+' preparada'+(line.picked===1?'':'s')+'</small>';
  const pb=$('pkPb'); if(pb) pb.style.width=pct+'%';
  const pt=$('pkPt'); if(pt) pt.textContent=fmtInt(r.ctrl)+' / '+fmtInt(r.picked)+' controladas';
  const i=$('cscan'); if(i) i.focus();
}

  }
  $('view').innerHTML=h;

}
async function cfCerrar(P,conDif,motivo){
  P.estado='FINALIZADO'; P.control_completed_at=nowISO(); P.control_ok=!conDif;
  const saves=[ pkSaveField(P.nro,'estado','FINALIZADO'), pkSaveField(P.nro,'control_completed_at',P.control_completed_at), pkSaveField(P.nro,'control_ok',!conDif) ];
  if(conDif){ P.con_diferencias=true; P.control_excepcion=motivo; saves.push(pkSaveField(P.nro,'con_diferencias',true), pkSaveField(P.nro,'control_excepcion',motivo)); }
  await Promise.all(saves);
  pkEvento({event_type:'control_completed',picking_id:P.nro,operator_id:P.controlado_por,value:{con_diferencias:conDif,motivo:motivo||''}});
  if(conDif) postAviso('⚠️ Control del PICK #'+P.nro+' ('+pkTitulo(P)+') cerrado CON DIFERENCIAS — '+motivo+(P.controlado_por?(' (controló '+P.controlado_por+')'):'')+'.');
  toast(conDif?'Cerrado con diferencias':'Control correcto — cerrado','ok'); state.view='lista'; try{ await cargarPicking(); }catch(e){} render();
}

/* ============================================================ TUTORIAL ======== */
/* Propio del kiosco: el tutorial estándar (shared/tutorial.js) no corre sin sesión,
   y la tablet no tiene login. Botón «?» + recorrido, se abre solo la 1ª vez. */
function kioTutorial(){
  if($('ktutFab')) return;
  var PASOS=[
    {ic:'👋',t:'Tu estación',d:'Esta tablet es tu estación de depósito. No hace falta usuario ni contraseña: tocás una tarea y arrancás. Con «← Tareas» volvés al menú cuando quieras.'},
    {ic:'🔫',t:'El escáner',d:'Con la lectora: apuntás y disparás. El cursor queda solo en el campo, no toques nada. Verde + beep = correcto; rojo = incorrecto. Sin lectora, tocá «📷 Cámara» y apuntá la tablet a la etiqueta. Cada unidad se confirma leyendo su etiqueta: si es una etiqueta nueva te pregunta una sola vez si es ese artículo y talle. Si de verdad no se puede leer, «No puedo escanearla» pide el motivo y queda registrado.'},
    {ic:'📦',t:'Control de Ingreso',d:'Cuando llega un remito: lo elegís de la lista y escaneás cada unidad a ciegas (no ves las cantidades esperadas, para no redondear). Al terminar tocás «Terminé» y el encargado hace la conciliación.'},
    {ic:'📋',t:'Picking',d:'Elegís un pedido y tu nombre, y tocás «Iniciar». La pantalla te va guiando: la ZONA a la que ir, el producto, el talle y cuántas retirar. Escaneás cada unidad. Si no encontrás stock, tocás «No encuentro stock». Al final, «Enviar a control».'},
    {ic:'✅',t:'Control',d:'Controlás un pedido que ya se preparó (mejor si lo armó otra persona): re-escaneás todo y el sistema verifica contra lo que se pickeó. Si hay diferencias, ponés el motivo para poder cerrar.'}
  ];
  var VISTO='mtu_visto_kiosco';
  var css='.ktut-fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:46px;height:46px;border-radius:50%;background:var(--navy);color:#fff;border:2px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.28);font-family:var(--font-d);font-size:24px;cursor:pointer;z-index:70;line-height:1}'
    +'.ktut-scrim{position:fixed;inset:0;background:rgba(11,21,39,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:80}'
    +'.ktut-scrim.open{display:flex}'
    +'.ktut-card{background:#fff;border-radius:16px;max-width:440px;width:100%;overflow:hidden}'
    +'.ktut-head{background:var(--navy);color:#fff;padding:15px 18px;display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--red)}'
    +'.ktut-head .hic{font-size:26px}.ktut-head .k{font-family:var(--font-c);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#b0bcd4}.ktut-head .n{font-family:var(--font-d);font-size:22px;letter-spacing:.5px}'
    +'.ktut-x{margin-left:auto;background:none;border:none;color:#fff;font-size:26px;cursor:pointer;line-height:1}'
    +'.ktut-body{padding:24px 20px;text-align:center;min-height:170px}'
    +'.ktut-bic{font-size:42px}.ktut-bt{font-family:var(--font-d);font-size:26px;margin:8px 0 8px;color:var(--navy);letter-spacing:.5px}.ktut-bd{font-family:var(--font-b);font-size:15px;color:#31384a;line-height:1.55;margin:0}'
    +'.ktut-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-top:1px solid var(--border)}'
    +'.ktut-dots{display:flex;gap:7px}.ktut-dot{width:9px;height:9px;border-radius:50%;background:#d7dce6;border:none;cursor:pointer;padding:0}.ktut-dot.on{background:var(--red)}'
    +'.ktut-btn{background:#fff;border:1.5px solid var(--border);border-radius:9px;padding:10px 15px;font-family:var(--font-c);font-weight:700;text-transform:uppercase;letter-spacing:.5px;font-size:12px;cursor:pointer;color:var(--navy)}.ktut-btn.pri{background:var(--red);color:#fff;border-color:var(--red)}.ktut-btn:disabled{opacity:.4}';
  document.head.insertAdjacentHTML('beforeend','<style>'+css+'</style>');
  var fab=document.createElement('button'); fab.id='ktutFab'; fab.className='ktut-fab'; fab.type='button'; fab.title='Cómo usar la tablet'; fab.textContent='?'; document.body.appendChild(fab);
  var scrim=document.createElement('div'); scrim.className='ktut-scrim'; scrim.setAttribute('role','dialog'); scrim.setAttribute('aria-modal','true');
  scrim.innerHTML='<div class="ktut-card"><div class="ktut-head"><span class="hic">📱</span><div><div class="k">Cómo se usa</div><div class="n">Tablet del depósito</div></div><button class="ktut-x" title="Cerrar">×</button></div>'
    +'<div class="ktut-body"><div class="ktut-bic"></div><div class="ktut-bt"></div><p class="ktut-bd"></p></div>'
    +'<div class="ktut-foot"><button class="ktut-btn" data-p="prev">‹ Anterior</button><div class="ktut-dots"></div><button class="ktut-btn pri" data-p="next">Siguiente ›</button></div></div>';
  document.body.appendChild(scrim);
  var i=0;
  var elIc=scrim.querySelector('.ktut-bic'),elT=scrim.querySelector('.ktut-bt'),elD=scrim.querySelector('.ktut-bd'),elDots=scrim.querySelector('.ktut-dots'),bp=scrim.querySelector('[data-p="prev"]'),bn=scrim.querySelector('[data-p="next"]');
  elDots.innerHTML=PASOS.map(function(_,k){ return '<button class="ktut-dot" type="button" data-k="'+k+'" aria-label="Paso '+(k+1)+'"></button>'; }).join('');
  function pintar(){ var p=PASOS[i]; elIc.textContent=p.ic; elT.textContent=p.t; elD.textContent=p.d; var d=elDots.children; for(var k=0;k<d.length;k++) d[k].classList.toggle('on',k===i); bp.disabled=(i===0); bn.textContent=(i===PASOS.length-1)?'¡Listo!':'Siguiente ›'; }
  function abrir(){ i=0; pintar(); scrim.classList.add('open'); try{ localStorage.setItem(VISTO,'1'); }catch(e){} }
  function cerrar(){ scrim.classList.remove('open'); }
  fab.onclick=abrir; scrim.querySelector('.ktut-x').onclick=cerrar; scrim.addEventListener('click',function(e){ if(e.target===scrim) cerrar(); });
  bp.onclick=function(){ if(i>0){ i--; pintar(); } }; bn.onclick=function(){ if(i<PASOS.length-1){ i++; pintar(); } else cerrar(); };
  elDots.addEventListener('click',function(e){ var b=e.target.closest('.ktut-dot'); if(b){ i=+b.getAttribute('data-k'); pintar(); } });
  var visto=null; try{ visto=localStorage.getItem(VISTO); }catch(e){}
  if(!visto) setTimeout(abrir,800);
}

/* ============================================================ init ============ */
if(!sesionValida()){
  // Sin cuenta de kiosco (ni admin/depósito): al Portal a loguearse.
  location.replace('../../');
}else{
  render();
  kioTutorial();
  saveqStatus(); procesarCola();   // reanuda guardados pendientes de una sesión anterior
}
</script>
</body>
