<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B1527">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Control de Recepciones — Mateu Sports</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B1527;--navy-mid:#1a2f55;--navy-soft:#13203a;
  --red:#CC0000;--red-soft:#ff3b3b;
  --white:#fff;--off:#f5f7fc;--muted:#6B7A99;--muted-light:#b0bcd4;
  --card:#fff;--border:#dce3f0;
  --ok:#16a34a;--warn:#d97706;--bad:#dc2626;--exc:#7c3aed;
  --font-d:'Bebas Neue',sans-serif;--font-c:'Barlow Condensed',sans-serif;--font-b:'Barlow',sans-serif;
  --shadow:0 1px 4px rgba(11,21,39,.08);--shadow-md:0 8px 30px rgba(11,21,39,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--off);color:var(--navy);font-family:var(--font-b);min-height:100vh}
img,svg{max-width:100%}

/* ===== HEADER ===== */
.top{background:var(--navy);padding:12px 22px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:3px solid var(--red);position:sticky;top:0;z-index:40;flex-wrap:wrap;gap:10px}
/* Isla dinámica: en la app instalada el header sube bajo la barra de estado */
@media(display-mode:standalone){ .top{ padding-top: calc(12px + env(safe-area-inset-top)) } }
.top a.logo{display:flex;align-items:center;gap:11px;text-decoration:none;min-width:0}
.top img{height:32px;filter:brightness(0) invert(1)}
.top .tt{font-family:var(--font-d);font-size:19px;letter-spacing:1.5px;color:#fff;line-height:1}
.top .ts{font-family:var(--font-c);font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--muted-light)}
.top-right{display:flex;align-items:center;gap:12px;margin-left:auto}
.who{text-align:right;line-height:1.1}
.who .n{font-family:var(--font-c);font-size:13px;font-weight:600;color:#fff;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .r{font-family:var(--font-c);font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--red-soft)}
.salir{background:transparent;border:1px solid rgba(255,255,255,.25);border-radius:6px;color:rgba(255,255,255,.7);
  font-family:var(--font-c);font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:7px 13px;cursor:pointer}
.salir:hover{color:#fff;border-color:#fff}

/* ===== NAV TABS ===== */
.tabs{background:#fff;border-bottom:1px solid var(--border);padding:0 22px;display:flex;gap:4px;overflow-x:auto;position:sticky;top:var(--msh-h,67px);z-index:30}
.tab{padding:13px 16px;border:0;background:none;cursor:pointer;font-family:var(--font-c);font-size:14px;font-weight:600;
  letter-spacing:.5px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--navy);border-bottom-color:var(--red)}
.tab:hover{color:var(--navy)}
.tab:focus-visible{outline:2px solid var(--red);outline-offset:-2px}

/* ===== FILTROS ===== */
.filtros{background:#fff;border-bottom:1px solid var(--border);padding:11px 22px;display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;position:sticky;top:calc(var(--msh-h,67px) + 44px);z-index:20}
.fgrp{display:flex;flex-direction:column;gap:4px;min-width:120px}
.fgrp label{font-family:var(--font-c);font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}

main{max-width:1180px;margin:0 auto;padding:22px 22px 80px}

.demo-banner{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:9px;padding:9px 14px;
  font-size:13px;margin-bottom:16px;display:none}
.demo-banner.show{display:block}
.demo-banner code{background:#fde9d3;padding:1px 5px;border-radius:4px;font-size:12px}

/* ===== CONTROLES ===== */
.sel,.inp{padding:9px 11px;border:1px solid var(--border);border-radius:7px;font-size:14px;color:var(--navy);background:#fff;font-family:var(--font-b)}
.sel:focus,.inp:focus{outline:none;border-color:var(--navy-mid)}
.btn{border:none;border-radius:8px;padding:10px 16px;font-family:var(--font-c);font-size:13px;font-weight:700;
  letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--red);color:#fff}.btn-primary:hover{background:#a00000}
.btn-outline{background:#fff;border:1.5px solid var(--border);color:var(--navy)}.btn-outline:hover{border-color:var(--navy-mid)}
.btn-sm{padding:6px 11px;font-size:11px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.sel:focus-visible,.inp:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* ===== CARDS / TIPO ===== */
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sec-head h1{font-family:var(--font-d);font-size:30px;letter-spacing:1px;line-height:1}
.sec-head .sub{font-family:var(--font-c);font-size:13px;font-weight:500;color:var(--muted);margin-top:2px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.card-h{font-family:var(--font-d);font-size:20px;letter-spacing:.5px;margin-bottom:2px}
.card-hs{font-family:var(--font-c);font-size:12px;color:var(--muted);margin-bottom:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}

/* ===== KPIs ===== */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:11px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi .k{font-family:var(--font-c);font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--font-d);font-size:32px;letter-spacing:.5px;margin-top:4px;line-height:1}
.kpi .v small{font-size:14px;color:var(--muted);font-family:var(--font-c)}

/* ===== BARRAS ===== */
.barlist{display:flex;flex-direction:column;gap:9px}
.barrow{display:grid;grid-template-columns:130px 1fr auto;gap:10px;align-items:center;font-family:var(--font-c);font-size:13.5px}
.barrow .lb{color:var(--navy-mid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:9px;border-radius:5px;background:#e6ebf5;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--red);border-radius:5px}
.barrow .vv{font-family:var(--font-d);font-size:16px;letter-spacing:.5px;text-align:right;min-width:48px;color:var(--navy)}

/* ===== TABLAS ===== */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:11px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
th{background:var(--navy);color:#fff;font-family:var(--font-c);font-weight:600;letter-spacing:.5px;padding:9px 11px;text-align:left;white-space:nowrap;position:sticky;top:0}
th.num,td.num{text-align:right}
td{padding:8px 11px;border-bottom:1px solid #eef0f7;vertical-align:middle}
tbody tr:hover td{background:#f8f9fe}
tfoot th{background:#eef2fb;color:var(--navy-mid);position:static}
.mono{font-variant-numeric:tabular-nums}
.big{font-family:var(--font-d);font-size:16px;letter-spacing:.5px}

/* ===== BADGES / ESTADOS ===== */
.badge{display:inline-block;font-family:var(--font-c);font-weight:700;font-size:11px;letter-spacing:.8px;
  text-transform:uppercase;padding:3px 9px;border-radius:20px}
.b-pendiente{background:#eef1f7;color:#64748b}
.b-parcial{background:#fef3c7;color:#92620e}
.b-completo{background:#dcfce7;color:#15803d}
.b-excedido{background:#ede9fe;color:#6d28d9}
.chip{display:inline-block;background:#f1f5fd;border:1px solid var(--border);border-radius:6px;padding:2px 8px;font-size:12px;color:var(--navy-mid);margin:0 3px 3px 0}
.lnk-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;padding:0 2px;line-height:1}
.lnk-del:hover{color:var(--bad)}
.lnk-del:focus-visible{outline:2px solid var(--red);outline-offset:1px}
.ped-card{background:#fff;border:1px solid var(--border);border-radius:11px;margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden}
.ped-head{display:flex;align-items:center;gap:12px;padding:11px 15px;cursor:pointer}
.ped-head:hover{background:#f8f9fe}
.ped-dot{width:11px;height:11px;border-radius:50%;flex:none}
.ped-title{flex:1;min-width:0}
.ped-oc{font-family:var(--font-c);font-weight:700;font-size:15px;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ped-sub{font-family:var(--font-c);font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ped-tot{text-align:right;flex:none}
.ped-tot .big{font-family:var(--font-d);font-size:20px;letter-spacing:.5px;line-height:1}
.ped-chev{color:var(--muted);font-size:13px;width:12px;flex:none}
.ped-detail{border-top:1px solid var(--border);padding:10px 14px;background:#fbfcfe}
.barrow.drill{cursor:pointer;border-radius:6px;padding:2px 5px;margin:0 -5px}
.barrow.drill:hover{background:#f1f5fd}
.barrow.drill .lb{color:var(--red);font-weight:600}
.rep-badge{display:inline-flex;align-items:center;gap:3px;font-family:var(--font-c);font-weight:700;font-size:11px;letter-spacing:.5px;text-transform:uppercase;padding:6px 11px;border-radius:20px;border:none;line-height:1}
.rep-pend{background:#fef3c7;color:#92620e;cursor:pointer}
.rep-pend:hover{background:#fde68a}
.rep-done{background:#dcfce7;color:#15803d}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{background:#13233f}

.prog{height:8px;border-radius:4px;background:#e6ebf5;overflow:hidden;min-width:90px}
.prog>span{display:block;height:100%;border-radius:4px;background:var(--ok)}
.prog.p-parcial>span{background:var(--warn)}
.prog.p-pendiente>span{background:#94a3b8}
.prog.p-excedido>span{background:var(--exc)}

/* ===== ESTADOS ===== */
.state{text-align:center;padding:44px 20px;color:var(--muted);font-family:var(--font-c)}
.state .big-ic{font-size:34px;margin-bottom:8px}
.state.err{color:var(--bad)}
.spinner{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--red);border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}*{transition:none!important}}

/* ===== MODAL ===== */
.overlay{position:fixed;inset:0;background:rgba(11,21,39,.5);display:none;align-items:flex-start;justify-content:center;z-index:60;padding:24px 14px;overflow:auto}
.overlay.show{display:flex}
.modal{background:#fff;border:1px solid var(--border);border-radius:14px;max-width:820px;width:100%;padding:20px;margin:auto;box-shadow:var(--shadow-md)}
.modal h2{font-family:var(--font-d);font-size:24px;letter-spacing:1px;margin-bottom:2px}
.modal .msub{font-family:var(--font-c);font-size:12.5px;color:var(--muted);margin-bottom:14px}
.modal .close{float:right;background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1}
.field{margin-bottom:12px}
.field label{display:block;font-family:var(--font-c);font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.field .inp,.field .sel{width:100%}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
textarea.code{width:100%;min-height:150px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:#f8f9fe;
  color:#1e293b;border:1px solid var(--border);border-radius:8px;padding:10px;resize:vertical}
.warn{background:#fef3c7;border:1px solid #fcd34d;color:#92620e;border-radius:8px;padding:9px 12px;font-size:12.5px;margin-bottom:10px}
.hint{background:#f1f5fd;border:1px solid var(--border);color:var(--navy-mid);border-radius:8px;padding:9px 12px;font-size:12.5px;margin-bottom:10px}
.accordion summary{cursor:pointer;color:var(--muted);font-family:var(--font-c);font-weight:700;letter-spacing:.5px;font-size:13px;padding:6px 0}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}

/* ===== TOAST ===== */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);
  color:#fff;padding:12px 18px;border-radius:9px;font-family:var(--font-c);font-size:14px;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;z-index:80;max-width:90vw;box-shadow:var(--shadow-md)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:#14532d}.toast.bad{background:#7f1d1d}

.toggle-uv{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.toggle-uv button{background:#fff;border:none;color:var(--muted);padding:8px 14px;font-family:var(--font-c);font-weight:700;
  letter-spacing:.5px;cursor:pointer;font-size:12px}
.toggle-uv button.on{background:var(--red);color:#fff}

/* ===== MÓVIL: teléfonos ~360-560px =====
   El desktop queda intacto; acá se compacta header, se apilan filtros y se
   evita el solapamiento de las barras sticky (el header envuelve y crece). */
@media(max-width:560px){
  /* Header compacto: menos padding, título más chico, nombre más corto */
  .top{padding:9px 14px;gap:8px}
  .top img{height:26px}
  .top .tt{font-size:16px;letter-spacing:1px}
  .top .ts{font-size:9px;letter-spacing:1.5px}
  .who .n{max-width:120px;font-size:12px}
  .salir{padding:6px 10px;font-size:10px}

  /* En móvil el header envuelve (2 líneas) y su alto ya no es 57px: si tabs y
     filtros siguen sticky en offsets fijos se solapan. Los volvemos estáticos
     (el header sí queda sticky arriba). */
  .tabs{position:static;top:auto;padding:0 10px}
  .filtros{position:static;top:auto;padding:10px 14px;gap:8px}
  .tab{padding:12px 12px;font-size:13px}

  /* Filtros en 2 columnas, controles full-width y tappables (~42px) */
  main{padding:16px 14px 72px}
  .filtros .fgrp{min-width:0;flex:1 1 calc(50% - 4px)}
  .filtros .sel,.filtros .inp{width:100%;min-height:42px}
  .filtros .btn{width:100%;min-height:40px}

  .sec-head h1{font-size:24px}
  .barrow{grid-template-columns:88px 1fr auto}
  /* KPIs y grillas a 1-2 columnas */
  .kpis{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
  .kpi .v{font-size:28px}
  .grid2{grid-template-columns:1fr}
  .card{padding:14px}
  /* Modales: usar todo el ancho y scroll interno */
  .overlay{padding:14px 8px}
  .modal{padding:16px}
  .formgrid{grid-template-columns:1fr}
}
</style>
<!-- Iconos SVG (reemplazan emojis que Windows 7 / navegadores viejos no dibujan) -->
<script src="../shared/iconos.js" defer></script>
<!-- Header unificado del shell: barra Menú + logo + calendario retail + drawer -->
<script src="../shared/header.js" defer></script>
<script src="../shared/tutorial.js" defer></script>
</head>
<body>

<!-- Header unificado del shell (shared/header.js). Los nodos de abajo quedan
     ocultos: el JS del módulo los sigue escribiendo (whoName/whoRole/salir). -->
<div hidden aria-hidden="true"><span id="whoName"></span><span id="whoRole"></span><button id="salir"></button></div>

<nav class="tabs" id="tabs">
  <button class="tab on" data-tab="panel">Panel</button>
  <button class="tab" data-tab="remitos">Remitos de ingreso</button>
  <button class="tab" data-tab="pedidos">Pedidos de compra</button>
  <button class="tab" data-tab="control">Ingresos vs pedido</button>
  <button class="tab" data-tab="repartos">Repartos</button>
  <button class="tab" data-tab="ingreso">Ingreso de Mercadería</button>
</nav>

<div class="filtros" id="filtros">
  <div class="fgrp"><label for="fMes">Mes</label><select class="sel" id="fMes"><option value="">Todos</option></select></div>
  <div class="fgrp"><label for="fMarca">Marca</label><select class="sel" id="fMarca"><option value="">Todas</option></select></div>
  <div class="fgrp"><label for="fRubro">Rubro</label><select class="sel" id="fRubro"><option value="">Todos</option></select></div>
  <div class="fgrp"><label for="fDisc">Disciplina</label><select class="sel" id="fDisc"><option value="">Todas</option></select></div>
  <div class="fgrp"><label for="fTipo">Tipo</label><select class="sel" id="fTipo"><option value="">Todos</option></select></div>
  <div class="fgrp"><label for="fProv">Proveedor</label><select class="sel" id="fProv"><option value="">Todos</option></select></div>
  <div class="fgrp"><label for="fRep">Reparto</label><select class="sel" id="fRep"><option value="">Todos</option><option value="pendiente">Pendiente</option><option value="hecho">Hecho</option><option value="sin">Sin reparto</option></select></div>
  <div class="fgrp" style="flex:1;min-width:190px"><label for="fQ">Buscar</label><input class="inp" id="fQ" placeholder="remito, artículo, código, proveedor…" style="width:100%"></div>
  <div class="fgrp" style="min-width:auto"><label>&nbsp;</label><button class="btn btn-outline btn-sm" id="fReset">Limpiar</button></div>
  <div class="fgrp" style="min-width:auto;margin-left:auto"><label>&nbsp;</label><button class="btn btn-outline btn-sm" id="fHist" title="Historial de cargas">🕘 Historial</button><button class="btn btn-outline btn-sm" id="fReload" title="Traer los últimos datos de la base">↻ Recargar</button></div>
</div>

<main>
  <div class="demo-banner" id="demoBanner">🔧 <b>Modo demo</b> — falta pegar la URL de la base <code>recepciones-mateu</code> (constante <code>FIREBASE_DB_URL</code>). Se muestran datos de prueba y lo que cargues no se guarda.</div>
  <div id="view"><div class="state"><div class="spinner"></div>Cargando…</div></div>
</main>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<!-- SheetJS por CDN (convención del portal: libs externas por <script src>) -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="../import.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<!-- Datos de prueba para el modo demo (mientras no esté pegada FIREBASE_DB_URL) -->
<script src="./mock-data.js" onerror="window.RECEP_MOCK=null"></script>
<!-- Modelos de pedido por marca (mapeo de columnas aprendido del último pedido
     de cada carpeta). Se regenera con scripts/gen-modelos-oc.js -->
<script src="./modelos-oc.js" onerror="window.OC_MODELOS_SEED=null"></script>
<script>
/* ============================================================
   Control de Recepciones — módulo self-contained del Portal.
   Lee la sesión del Portal (localStorage), sin login propio.
   Datos en Firebase (Realtime Database vía REST), como el resto del portal.
   Sin URL configurada (FIREBASE_DB_URL) corre en MODO DEMO con datos de prueba
   en memoria (no persiste). El control ingresos-vs-pedido se calcula en el
   cliente. import.js parsea el Excel en el navegador (SheetJS por CDN).
   ============================================================ */
'use strict';
const $ = id => document.getElementById(id);

/* ---------- Firebase: pegar la URL de la base cuando Juli la cree ----------
   Ej: 'https://recepciones-mateu-default-rtdb.firebaseio.com'
   Vacío => modo demo. */
const FIREBASE_DB_URL = 'https://recepciones-mateu-default-rtdb.firebaseio.com';
const DEMO = !FIREBASE_DB_URL;
const ROOT = 'recepciones';   // rama raíz en la base
const ROOT_ING = 'ingreso';   // rama aparte para el circuito físico (no toca recepciones/…)

/* ---------- sesión ---------- */
const SESSION_KEY = 'mateu_portal_session';
function readSession(){ try{ const s=localStorage.getItem(SESSION_KEY); return s?JSON.parse(s):null; }catch(e){ return window.__sess||null; } }
const SESSION = readSession();
if(!SESSION || !SESSION.rol){ location.replace('../'); }
const puedeVer = SESSION && (SESSION.rol==='admin' || (SESSION.herramientas||[]).includes('recepciones'));
if(SESSION && SESSION.rol && !puedeVer){ location.replace('../'); }

/* ---------- helpers ---------- */
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const num = x => { const n=Number(x); return isFinite(n)?n:0; };
const fmtInt = n => (Math.round(n||0)).toLocaleString('es-AR');
const fmtMoney = n => '$'+(Math.round(n||0)).toLocaleString('es-AR');

/* ---------- Firebase REST ---------- */
function fbUrl(path){ return FIREBASE_DB_URL.replace(/\/+$/,'') + '/' + path.split('/').map(encodeURIComponent).join('/') + '.json'; }
// nro -> key válida de Firebase (sin . # $ / [ ])
function fbKey(nro){ return String(nro||'').trim().replace(/[.#$/\[\]]/g,'~'); }
async function fbGet(path){ const r=await fetch(fbUrl(path)); if(!r.ok) throw new Error('Firebase HTTP '+r.status); return r.json(); }
async function fbPut(path, data){ const r=await fetch(fbUrl(path),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}); if(!r.ok) throw new Error('Firebase HTTP '+r.status); return r.json(); }
async function fbDelete(path){ const r=await fetch(fbUrl(path),{method:'DELETE'}); if(!r.ok) throw new Error('Firebase HTTP '+r.status); return true; }
function nowISO(){ return new Date().toISOString().slice(0,19).replace('T',' '); }

/* semana ISO 8601 -> 'Sem NN' desde 'YYYY-MM-DD' */
function semanaISO(fecha){
  if(!fecha) return '';
  const p=String(fecha).split('-'); if(p.length<3) return '';
  const d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));
  const day=(d.getUTCDay()+6)%7;                 // lun=0..dom=6
  d.setUTCDate(d.getUTCDate()-day+3);            // jueves de esa semana
  const jueves=d.getTime();
  d.setUTCMonth(0,1);
  if(d.getUTCDay()!==4) d.setUTCMonth(0,1+((4-d.getUTCDay())+7)%7);
  const semana=1+Math.round((jueves-d.getTime())/(7*864e5));
  return 'Sem '+String(semana).padStart(2,'0');
}

const DATA = { pedidos:{}, remitos:{}, repartos:{}, ingreso:{ remitos:{}, control:{} } };   // keyed por fbKey(nro)
const state = { tab:'panel', filtros:{ mes:'', marca:'', rubro:'', disciplina:'', tipo:'', proveedor:'', reparto:'', q:'' }, dims:null, uv:'u', ing:{ view:'lista', remito:null } };
const vals = o => o ? Object.keys(o).map(k=>o[k]) : [];

async function cargarTodo(){
  if(DEMO){ const m = window.RECEP_MOCK || {pedidos:{},remitos:{}}; DATA.pedidos=JSON.parse(JSON.stringify(m.pedidos||{})); DATA.remitos=JSON.parse(JSON.stringify(m.remitos||{})); DATA.repartos={}; DATA.ingreso={remitos:{},control:{}}; return; }
  const [ped, rem, rep, iRem, iCon] = await Promise.all([ fbGet(ROOT+'/pedidos'), fbGet(ROOT+'/remitos'), fbGet(ROOT+'/repartos'), fbGet(ROOT_ING+'/remitos'), fbGet(ROOT_ING+'/control') ]);

async function guardarPedido(doc){
  const key = fbKey(doc.nro);
  if(DATA.pedidos[key]) throw new Error('Ya existe un pedido con nº '+doc.nro+'.');
  const rec = { nro:doc.nro, fecha:doc.fecha, comprador:doc.comprador||'', proveedor:doc.proveedor||'', marca:doc.marca||'', moneda:doc.moneda||'ARS', creado_en:nowISO(), lineas:doc.lineas||[] };
  if(!DEMO) await fbPut(ROOT+'/pedidos/'+key, rec);
  DATA.pedidos[key] = rec;
}
async function guardarRemito(doc){
  const key = fbKey(doc.nro);
  if(DATA.remitos[key]) throw new Error('Ya existe un remito con nº '+doc.nro+'.');
  const rec = { nro:doc.nro, fecha:doc.fecha, proveedor:doc.proveedor||'', marca:doc.marca||'', pedido_nro:doc.pedido_nro||'', semana:semanaISO(doc.fecha), creado_en:nowISO(), lineas:doc.lineas||[] };
  if(!DEMO) await fbPut(ROOT+'/remitos/'+key, rec);
  DATA.remitos[key] = rec;
}
async function borrarPedido(nro){ const key=fbKey(nro); if(!DEMO) await fbDelete(ROOT+'/pedidos/'+key); delete DATA.pedidos[key]; }
async function borrarRemito(nro){ const key=fbKey(nro); if(!DEMO) await fbDelete(ROOT+'/remitos/'+key); delete DATA.remitos[key]; }

const MES_NOMBRES=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
function mesKey(fecha){ return String(fecha||'').slice(0,7); }
function mesLabel(x){ const p=String(x||'').split('-'); return (p.length>=2 && MES_NOMBRES[+p[1]-1]) ? MES_NOMBRES[+p[1]-1]+' '+p[0] : ''; }

/* ---------- dimensiones (cliente) ---------- */
function computeDims(){
  const marcas=new Set(),rubros=new Set(),disc=new Set(),tipos=new Set(),meses=new Set(),provs=new Set();
  vals(DATA.pedidos).forEach(p=>{ if(p.marca)marcas.add(p.marca); if(p.proveedor)provs.add(p.proveedor); if(p.fecha)meses.add(mesKey(p.fecha)); (p.lineas||[]).forEach(l=>{ if(l.rubro)rubros.add(l.rubro); if(l.disciplina)disc.add(l.disciplina); if(l.tipo)tipos.add(l.tipo); }); });
  vals(DATA.remitos).forEach(r=>{ if(r.marca)marcas.add(r.marca); if(r.proveedor)provs.add(r.proveedor); if(r.fecha)meses.add(mesKey(r.fecha)); (r.lineas||[]).forEach(l=>{ if(l.rubro)rubros.add(l.rubro); if(l.disciplina)disc.add(l.disciplina); if(l.tipo)tipos.add(l.tipo); }); });
  return { marcas:[...marcas].sort(cmp), rubros:[...rubros].sort(cmp), disciplinas:[...disc].sort(cmp), tipos:[...tipos].sort(cmp), meses:[...meses].sort(cmp), proveedores:[...provs].sort(cmp) };
}

/* ---------- control ingresos vs pedido (cliente, = vista v_control) ---------- */
function computeControl(f){
  const key=(marca,l)=>[marca||'',l.rubro||'',l.disciplina||'',l.tipo||''].join('|');
  const ped={};
  vals(DATA.pedidos).forEach(p=>{ if(f.mes && mesKey(p.fecha)!==f.mes) return; (p.lineas||[]).forEach(l=>{ const k=key(p.marca,l); const a=ped[k]||(ped[k]={marca:p.marca||'',rubro:l.rubro||'',disciplina:l.disciplina||'',tipo:l.tipo||'',cant_pedida:0,importe_pedido:0}); a.cant_pedida+=num(l.cantidad); a.importe_pedido+=num(l.cantidad)*num(l.costo_unitario); }); });
  const rec={};
  vals(DATA.remitos).forEach(r=>{ if(f.mes && mesKey(r.fecha)!==f.mes) return; (r.lineas||[]).forEach(l=>{ const k=key(r.marca,l); const a=rec[k]||(rec[k]={c:0,i:0}); a.c+=num(l.cantidad); a.i+=num(l.cantidad)*num(l.costo_unitario); }); });
  let rows = Object.keys(ped).map(k=>{
    const p=ped[k]; const rr=rec[k]||{c:0,i:0};
    const cant_recibida=rr.c, importe_recibido=rr.i;
    const cant_pendiente=p.cant_pedida-cant_recibida, importe_pendiente=p.importe_pedido-importe_recibido;
    const pct=p.cant_pedida>0?Math.round(cant_recibida/p.cant_pedida*1000)/10:(cant_recibida>0?100:0);
    const estado=cant_recibida<=0?'pendiente':(cant_recibida<p.cant_pedida?'parcial':(cant_recibida>p.cant_pedida?'excedido':'completo'));
    return Object.assign({},p,{cant_recibida,importe_recibido,cant_pendiente,importe_pendiente,pct,estado});
  });
  rows = rows.filter(c=>(!f.marca||c.marca===f.marca)&&(!f.rubro||c.rubro===f.rubro)&&(!f.disciplina||c.disciplina===f.disciplina)&&(!f.tipo||c.tipo===f.tipo));
  rows.sort((a,b)=>cmp(a.marca,b.marca)||cmp(a.rubro,b.rubro)||cmp(a.disciplina,b.disciplina)||cmp(a.tipo,b.tipo));
  return rows;
}

/* ---------- filtro de líneas ---------- */
function lineaPasa(l){ const f=state.filtros; if(f.rubro&&l.rubro!==f.rubro)return false; if(f.disciplina&&l.disciplina!==f.disciplina)return false; if(f.tipo&&l.tipo!==f.tipo)return false; return true; }
function matchQ(D, q){ if(!q) return true; q=q.toLowerCase(); if((((D.nro||'')+' '+(D.marca||'')+' '+(D.proveedor||'')+' '+(D.pedido_nro||'')+' '+(D.comprador||'')).toLowerCase()).indexOf(q)>-1) return true; return (D.lineas||[]).some(l=>(((l.modelo||'')+' '+(l.descripcion||'')+' '+(l.rubro||'')+' '+(l.disciplina||'')+' '+(l.tipo||'')).toLowerCase()).indexOf(q)>-1); }
function remitosFiltrados(){ const f=state.filtros; return vals(DATA.remitos).filter(r=>(!f.marca||r.marca===f.marca)&&(!f.mes||mesKey(r.fecha)===f.mes)&&(!f.proveedor||r.proveedor===f.proveedor)&&repartoPasa(r,f.reparto)&&matchQ(r,f.q)).sort((a,b)=>cmp(b.fecha,a.fecha)); }
function pedidosFiltrados(){ const f=state.filtros; return vals(DATA.pedidos).filter(p=>(!f.marca||p.marca===f.marca)&&(!f.proveedor||p.proveedor===f.proveedor)&&matchQ(p,f.q)).sort((a,b)=>cmp(b.fecha,a.fecha)); }

/* ---------- PANEL ---------- */
function renderPanel(){
  const rem = remitosFiltrados();
  let unidades=0, importe=0, remitosCount=0; const porMes={}, porMarca={}, porRubro={}, marcasAct={};
  rem.forEach(R=>{ const lins=(R.lineas||[]).filter(lineaPasa); if(!lins.length) return; remitosCount++; marcasAct[R.marca||'—']=1;
    lins.forEach(l=>{ const c=num(l.cantidad); importe+=c*num(l.costo_unitario); unidades+=c; porMes[mesKey(R.fecha)]=(porMes[mesKey(R.fecha)]||0)+c; porMarca[R.marca||'—']=(porMarca[R.marca||'—']||0)+c; porRubro[l.rubro||'—']=(porRubro[l.rubro||'—']||0)+c; }); });
  const ctrl=computeControl(state.filtros); let ped=0,rec=0; ctrl.forEach(c=>{ped+=c.cant_pedida;rec+=c.cant_recibida;});
  const cumpl = ped>0?Math.round(rec/ped*100):(rec>0?100:0);

  let html = seccionHead('Panel','Resumen de ingresos del depósito central');
  if(!remitosCount && !ctrl.length){ $('view').innerHTML=html+stateEmpty('Todavía no hay ingresos ni pedidos cargados. Importá un Excel o cargá uno manual.'); return; }
  html += '<div class="kpis">'
    + kpi('Unidades ingresadas', fmtInt(unidades))
    + kpi('Ingresado $', fmtMoney(importe))
    + kpi('Remitos', fmtInt(remitosCount))
    + kpi('Marcas activas', fmtInt(Object.keys(marcasAct).length))
    + kpi('Cumplimiento OC', cumpl+'<small>%</small>') + '</div>';
  html += alertasCard(ctrl);
  html += '<div class="grid2">'
    + cardMeses(porMes)
    + cardBars('Participación por marca','Unidades por marca · click para ver el detalle', porMarca, false, null, 'marca') + '</div>';
  html += cardBars('Desglose por rubro','Unidades ingresadas por rubro', porRubro, false);
  $('view').innerHTML = html;
  document.querySelectorAll('#view [data-drill]').forEach(el=>el.onclick=()=>openMarcaDetalle(el.getAttribute('data-drill')));
}
function kpi(k,v){ return '<div class="kpi"><div class="k">'+esc(k)+'</div><div class="v">'+v+'</div></div>'; }
function cardBars(title, sub, obj, keepOrder, labelFn, drillKey){
  let entries=Object.keys(obj).map(k=>[k,obj[k]]);
  if(!entries.length) return '<div class="card"><div class="card-h">'+esc(title)+'</div><div class="card-hs">'+esc(sub)+'</div>'+stateEmpty('Sin datos.')+'</div>';
  if(keepOrder) entries.sort((a,b)=>cmp(a[0],b[0])); else entries.sort((a,b)=>b[1]-a[1]);
  const max=Math.max.apply(null, entries.map(e=>e[1]))||1;
  const rows=entries.map(([k,v])=>{ const lbl=labelFn?labelFn(k):k; return '<div class="barrow'+(drillKey?' drill':'')+'"'+(drillKey?' data-drill="'+esc(k)+'"':'')+'><span class="lb" title="'+esc(lbl)+'">'+esc(lbl)+'</span><span class="bar"><span style="width:'+Math.max(2,Math.round(v/max*100))+'%"></span></span><span class="vv">'+fmtInt(v)+'</span></div>'; }).join('');
  return '<div class="card"><div class="card-h">'+esc(title)+'</div><div class="card-hs">'+esc(sub)+'</div><div class="barlist">'+rows+'</div></div>';
}

/* ---------- CONTROL ---------- */
function renderControl(){
  const filas = computeControl(state.filtros);
  const SC=state.ctrlSort||{col:null,dir:1}; const _Vs=state.uv==='v';
  if(SC.col){ const g=c=>({marca:c.marca,rubro:c.rubro,disciplina:c.disciplina,tipo:c.tipo,ped:_Vs?c.importe_pedido:c.cant_pedida,rec:_Vs?c.importe_recibido:c.cant_recibida,pen:_Vs?c.importe_pendiente:c.cant_pendiente,pct:c.pct,estado:c.estado})[SC.col]; filas.sort((a,b)=>{ const av=g(a),bv=g(b); const rr=(typeof av==='number')?(av-bv):cmp(String(av),String(bv)); return rr*(SC.dir||1); }); }
  const sarr=c=>SC.col===c?(SC.dir>0?' ▲':' ▼'):'';
  let html = seccionHead('Ingresos vs pedido','Pedido total vs ingresado, por marca y categoría (agregado, no por nº de OC)',
    '<div class="toggle-uv"><button id="uvU" class="'+(state.uv==='u'?'on':'')+'">Unidades</button><button id="uvV" class="'+(state.uv==='v'?'on':'')+'">Pesos $</button></div>'
    + '<button class="btn btn-outline btn-sm" id="btnExpCtrl">⇩ Exportar</button>');
  if(!filas.length){ $('view').innerHTML=html+stateEmpty('No hay pedidos cargados para controlar. Importá una OC en “Pedidos de compra”.'); bindUV(); return; }
  // resumen de estados
  const cuenta={pendiente:0,parcial:0,completo:0,excedido:0}; filas.forEach(c=>cuenta[c.estado]++);
  html += '<div style="margin-bottom:14px;display:flex;gap:8px;flex-wrap:wrap">'
    + ['completo','parcial','pendiente','excedido'].map(e=> cuenta[e]?('<span class="badge b-'+e+'" style="font-size:12px;padding:5px 11px">'+cuenta[e]+' '+e+(cuenta[e]>1?'s':'')+'</span>'):'').join('')
    + '</div>';
  const V=state.uv==='v'; let tp=0,tr=0,tpe=0; const fmt=V?fmtMoney:fmtInt;
  const rows=filas.map(c=>{ const ped=V?c.importe_pedido:c.cant_pedida, rec=V?c.importe_recibido:c.cant_recibida, pen=V?c.importe_pendiente:c.cant_pendiente; tp+=ped;tr+=rec;tpe+=pen;
    const pct=Math.max(0,Math.min(100,c.pct));
    return '<tr><td>'+esc(c.marca||'')+'</td><td>'+esc(c.rubro||'')+'</td><td>'+esc(c.disciplina||'')+'</td><td>'+esc(c.tipo||'')+'</td><td class="num big">'+fmt(ped)+'</td><td class="num big">'+fmt(rec)+'</td><td class="num mono" style="color:'+(pen>0.001?'#b91c1c':(pen<-0.001?'#6d28d9':'var(--muted)'))+'">'+fmt(pen)+'</td><td><div style="display:flex;align-items:center;gap:8px"><div class="prog p-'+esc(c.estado)+'"><span style="width:'+pct+'%"></span></div><span class="mono" style="min-width:42px">'+c.pct+'%</span></div></td><td><span class="badge b-'+esc(c.estado)+'">'+esc(c.estado)+'</span></td></tr>';
  }).join('');
  html += '<div class="tbl-wrap"><table><thead><tr><th class="sortable" data-sort="marca">Marca'+sarr('marca')+'</th><th class="sortable" data-sort="rubro">Rubro'+sarr('rubro')+'</th><th class="sortable" data-sort="disciplina">Disciplina'+sarr('disciplina')+'</th><th class="sortable" data-sort="tipo">Tipo'+sarr('tipo')+'</th><th class="num sortable" data-sort="ped">Pedido'+sarr('ped')+'</th><th class="num sortable" data-sort="rec">Recibido'+sarr('rec')+'</th><th class="num sortable" data-sort="pen">Pendiente'+sarr('pen')+'</th><th class="sortable" data-sort="pct">Avance'+sarr('pct')+'</th><th class="sortable" data-sort="estado">Estado'+sarr('estado')+'</th></tr></thead><tbody>'+rows+'</tbody><tfoot><tr><th colspan="4" style="text-align:right">Totales</th><th class="num big">'+fmt(tp)+'</th><th class="num big">'+fmt(tr)+'</th><th class="num big">'+fmt(tpe)+'</th><th colspan="2"></th></tr></tfoot></table></div>';
  $('view').innerHTML = html; bindUV();
  document.querySelectorAll('#view th.sortable').forEach(th=>th.onclick=()=>{ const c=th.getAttribute('data-sort'); state.ctrlSort={col:c, dir:(SC.col===c?-(SC.dir||1):1)}; renderControl(); });

/* eliminar documentos (con confirmación) */

  document.querySelectorAll('[data-del-pedido]').forEach(b=>b.onclick=async(e)=>{ if(e)e.stopPropagation();

/* exportar a Excel la vista actual (SheetJS ya cargado) */
function exportar(tipo, rows){
  if(!rows || !rows.length){ toast('No hay filas para exportar'); return; }
  try{
    const ws=XLSX.utils.json_to_sheet(rows);
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, tipo);
    XLSX.writeFile(wb, 'recepciones-'+tipo+'-'+new Date().toISOString().slice(0,10)+'.xlsx');
    toast('Excel exportado','ok');
  }catch(e){ toast('No se pudo exportar: '+e.message,'bad'); }
}

function loadMapping(){

async function onImpFile(e){
  const file=e.target.files[0]; if(!file) return; impCtx.archivo=file.name; impCtx.rawBuffer=await file.arrayBuffer();
  if(impCtx.tipoDoc==='ingreso' && !impCtx.mapping) loadMappingIngreso();
  if(!impCtx.mapping){ $('impPreview').innerHTML='<div class="warn">Elegí primero la marca para cargar su mapeo.</div>'; return; }

function loadMappingIngreso(){

}
function reprocesar(){ try{ impCtx.mapping=JSON.parse($('mapJson').value); }catch(e){ toast('El JSON del mapeo no es válido','bad'); return; } if(impCtx.rawBuffer) parseAndPreview(); else toast('Elegí un archivo primero'); }
function parseAndPreview(){
  const R=window.RecepImport;
  try{ const res=R.importFile(impCtx.rawBuffer, impCtx.mapping, {}); impCtx.docs=res.docs; impCtx.warnings=res.warnings; impCtx.headers=res.headers; renderPreview(); }
  catch(e){ $('impPreview').innerHTML='<div class="warn">No se pudo leer el Excel: '+esc(e.message)+'</div>'; $('btnImpConfirm').disabled=true; }
}
function renderPreview(){
  const docs=impCtx.docs||[]; let totLineas=docs.reduce((a,d)=>a+d.lineas.length,0); let html='';
  (impCtx.warnings||[]).forEach(w=> html+='<div class="warn">'+esc(w)+'</div>');

  if(!docs.length){ html+='<div class="warn">No se detectaron filas. Revisá <b>headerRow</b> y la hoja en el mapeo.</div>'; $('impPreview').innerHTML=html; $('btnImpConfirm').disabled=true; return; }
  html+='<div class="card-hs" style="margin-top:6px">'+docs.length+' documento(s), '+totLineas+' línea(s). Vista previa de cómo quedó mapeado:</div>';

    html+='<div class="tbl-wrap"><table style="min-width:500px"><thead><tr><th>Rubro</th><th>Disciplina</th><th>Tipo</th><th class="num">Cant.</th><th class="num">Costo U.</th></tr></thead><tbody>'+d.lineas.slice(0,8).map(l=>'<tr><td>'+esc(l.rubro)+'</td><td>'+esc(l.disciplina)+'</td><td>'+esc(l.tipo)+'</td><td class="num">'+fmtInt(l.cantidad)+'</td><td class="num mono">'+fmtMoney(l.costo_unitario)+'</td></tr>').join('')+(d.lineas.length>8?'<tr><td colspan="5" style="color:var(--muted)">… +'+(d.lineas.length-8)+' líneas</td></tr>':'')+'</tbody></table></div>'; });
  if(docs.length>20) html+='<div class="card-hs">… y '+(docs.length-20)+' documentos más.</div>';
  const problemas=[]; docs.forEach(d=>{ if(!d.nro||d.nro==='(sin-nro)') problemas.push('Hay documentos sin nº.'); if(!d.fecha) problemas.push('Hay documentos sin fecha.'); });
  if(problemas.length) html+='<div class="warn">'+esc([...new Set(problemas)].join(' '))+' Corregí el mapeo antes de guardar.</div>';
  $('impPreview').innerHTML=html; $('btnImpConfirm').disabled = !!problemas.length;
}
async function confirmImport(){
  const docs=impCtx.docs||[]; if(!docs.length) return;
  const btn=$('btnImpConfirm'); btn.disabled=true; btn.textContent='Guardando…';
  let okN=0, errN=0, errMsgs=[];
  for(const d of docs){
    try{
      if(impCtx.tipoDoc==='pedido') await guardarPedido({ nro:d.nro, fecha:d.fecha, comprador:d.comprador, proveedor:d.proveedor, marca:d.marca||impCtx.marca, moneda:d.moneda||'ARS', lineas:d.lineas });
      else await guardarRemito({ nro:d.nro, fecha:d.fecha, proveedor:d.proveedor, marca:d.marca||impCtx.marca, pedido_nro:d.pedido_nro||'', lineas:d.lineas });
      okN++;
    }catch(e){ errN++; errMsgs.push(d.nro+': '+e.message); }
  }
  btn.textContent='Confirmar y guardar'; btn.disabled=false;
  if(errN && !okN){ toast('No se guardó nada. '+errMsgs[0],'bad'); return; }
  closeModal(); refreshDims(); render(); toast(okN+' guardado(s)'+(errN?(' · '+errN+' con error'):''), errN?'':'ok');
  if(errN) console.warn('Errores de import:', errMsgs);
}

/* ============================================================
   CONVERSOR de OC de marca -> OC unificada Mateu Sports
   Importa la planilla que manda CUALQUIER marca y la convierte al modelo
   unificado Mateu (detalle por artículo con curva de talles), permite descargar
   el Excel/PDF y guardar la OC al sistema (alimenta Pedidos y el control).

   Cómo funciona: un motor genérico elige la hoja, encuentra la fila de
   encabezados y mapea las columnas por nombre (con "pistas" por marca). Si algo
   sale mal, el usuario reasigna las columnas a mano desde el mismo modal — así
   entra una marca nueva sin tocar el código. Nike tiene además su lector propio
   (hoja "Resumen Pedido"), que se usa primero y cae al genérico si no aplica.
   El envío por mail se suma más adelante reusando functions/enviar-oc.js.
   ============================================================ */
const OC_DISC_MAP = { 'RUNNING':'RUNNING','FOOTBALL/SOCCER':'FUTBOL 11','NIKE BASKETBALL':'BASQUET','BASKETBALL':'BASQUET','MEN TRAINING':'TRAINING','SPORTSWEAR':'CASUAL','TENNIS':'TENIS','PADEL':'PADEL','JORDAN BRAND':'JORDAN','YOUNG ATHLETES':'CASUAL','ORIGINALS':'CASUAL','NOT SPORTS SPECIFIC':'CASUAL','FIELD HOCKEY':'HOCKEY','OUTDOOR':'OUTDOOR','MOTORSPORT':'CASUAL','SWIM':'NATACION' };
const OC_TIPO_MAP = { 'MEN':'CALZADO ADULTO','WOMEN':'CALZADO ADULTO','UNISEX':'CALZADO ADULTO','KIDS':'CALZADO NIÑO' };
const OC_MESES = { enero:1,febrero:2,marzo:3,abril:4,mayo:5,junio:6,julio:7,agosto:8,septiembre:9,setiembre:9,octubre:10,noviembre:11,diciembre:12 };

/* Marcas del conversor. Se completa con las marcas que ya están en los datos. */
const OC_MARCAS = ['Nike','adidas','Puma','Under Armour','Asics','New Balance','Fila','Topper','Umbro','Champion','Columbia','Wilson','Mizuno','Reef','Vans','Converse','Penalty','Olympikus','Diadora','Joma','Head','Babolat','Dunlop','Gantos','Malik','No Brand'];

function ocFromFilename(name, marcaDefault){
  const base=name.replace(/\.[^.]+$/,''); const low=base.toLowerCase(); let mes=0,anio=0;
  for(const k in OC_MESES){ if(low.includes(k)){ mes=OC_MESES[k]; const m=low.slice(low.indexOf(k)).match(/(\d{2,4})/); if(m) anio=m[1].length===2?2000+ +m[1]:+m[1]; break; } }
  let fecha=(mes&&anio)?anio+'-'+String(mes).padStart(2,'0')+'-01':'';
  if(!fecha){ // dd-mm-yy / dd.mm.yyyy en el nombre (ej. "… 18-08-26 …")
    const m=low.match(/\b(\d{1,2})[-.\/](\d{1,2})[-.\/](\d{2,4})\b/);
    if(m && +m[2]>=1 && +m[2]<=12){ const y=m[3].length===2?2000+ +m[3]:+m[3]; fecha=y+'-'+String(+m[2]).padStart(2,'0')+'-'+String(+m[1]).padStart(2,'0'); }
  }
  const marca=/adidas/i.test(low)?'adidas':(/nike/i.test(low)?'Nike':(marcaDefault||base.split(/\s+/)[0]));
  const nro=base.replace(/^\s*copia de\s*/i,'').replace(/\s+/g,' ').trim();
  return { nro, fecha, marca };
}

/* ---------- motor genérico: normalización, números y alias de columnas ---- */
const ocNorm = s => String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
/* número tolerante: acepta "48298,27" (coma decimal) y "1.234,56"; NaN si no es número */
function ocNum(v){
  if(v==null||v==='') return NaN;
  if(typeof v==='number') return isFinite(v)?v:NaN;
  let s=String(v).trim().replace(/[\s$]/g,'');
  if(!/^-?[\d.,]+$/.test(s)) return NaN;
  if(s.indexOf(',')>-1 && s.indexOf('.')>-1) s = s.lastIndexOf(',')>s.lastIndexOf('.') ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,'');
  else if(s.indexOf(',')>-1) s=s.replace(',','.');
  const n=parseFloat(s); return isFinite(n)?n:NaN;
}
const ocN = v => { const n=ocNum(v); return isFinite(n)?n:0; };

const OC_ALIAS = {
  cod:   ['material','modelo','codigo','codigo articulo','cod articulo','codigo art','cod articulo','sku','style','style name','style number','article number','product code','referencia interna','referencia','articulo','articulo emp','articulo n','art','item','cod'],
  desc:  ['descripcion','material description','descripcion nike','descripcion articulo','descripcion de producto','articulo descripcion','description','colorway description','model name','nombre del articulo','nombre articulo','producto','nombre','detalle'],
  cant:  ['confirmado','unidades confirmadas','confirmadas','total unidades','cantidad pedida','cantidad pedido','cantidad ok cliente','cantidad de curvas','cant curvas','cant curv','pedido x curva','pedido curvas','pedido mod','st pedido','cantidades ingreso','order quantity','grand total','total general','unidades','cantidad','quantity','qty','cant','curvas','pedido','total'],
  costo: ['whs price','wholesale price','wsl price','precio whsl','zlst price','precio b2b','precio fab','precio mayorista','precio may sin iva','costo s iva','costo unitario','precio unitario','precio lista','precio conf','precio tarifa','precio venta','precio publico','precio minorista','retail price','unit price','costo','precio','price'],
  disc:  ['sport description','disciplina','categoria','category','deporte','division'],
  rubro: ['product group','rubro','grupo producto','tipo de producto','product type','categoria producto'],
  gen:   ['target grp','genero','gender','publico'],
  talle: ['talle','size','talles','sizes'],
  emp:   ['banner','empresa','sold to name','ship to name 2','grupo cliente','razon social']
};
/* columnas que NUNCA son unidades / nunca son costo (evita confundir importe con unidades) */
const OC_NO_CANT  = /precio|costo|importe|valor|price|net value|descuento|iva/;
const OC_NO_COSTO = /cantidad|unidades|\bcant\b|\bqty\b|curva|confirmado|pedido/;
/* Pistas por marca: qué columna manda para cada campo (gana sobre los alias) */
const OC_HINTS = {
  'adidas': { cant:['confirmado'], costo:['whs price','zlst price'], cod:['material'], desc:['descripcion','material description'], disc:['sport description'], rubro:['product group'], gen:['target grp'], emp:['banner'] },
  'Nike':   { cant:['total unidades'], costo:['precio whsl'], cod:['material nike'], desc:['descripcion nike'], disc:['categoria'], gen:['genero'] }
};

/* Product group / rubro de la marca -> rubro Mateu */
const OC_RUBRO_PAT = [
  [/shoe|calzado|footwear|sandal|slipper|ftw|botin|zapat|sneaker|cleat/,'CALZADO'],
  [/t shirt|tshirt|remera|short|top|tight|jacket|campera|suit|pant|jersey|bra|shirt|sweat|polo|skirt|dress|apparel|indument|clothing|buzo|calza|malla|app\b/,'INDUMENTARIA'],
  [/accessor|hardware|ball|pelota|bag|bolso|mochila|sock|media|headwear|gorr|cap\b|guante|glove|acces|hw\b/,'ACCESORIOS']
];
function ocRubro(txt, disc, desc){
  const s=ocNorm(txt)+' '+ocNorm(disc)+' '+ocNorm(desc);
  for(const [re,r] of OC_RUBRO_PAT) if(re.test(s)) return r;
  return String(txt||'').trim().toUpperCase();
}
const OC_GEN_MAP = { 'ME':'HOMBRE','MEN':'HOMBRE','M':'HOMBRE','WO':'MUJER','WOMEN':'MUJER','W':'MUJER','UN':'UNISEX','UNISEX':'UNISEX','KI':'NIÑO','KIDS':'NIÑO','BO':'NIÑO','GI':'NIÑA','IN':'BEBE','YT':'JUVENIL','JR':'NIÑO' };
function ocGenero(g){ const k=String(g||'').trim().toUpperCase(); return OC_GEN_MAP[k]||k; }
function ocTipo(rubro, genero){
  if(!rubro) return '';
  const chico=/NIÑ|BEBE|JUVENIL|KID/.test(genero||'');
  return rubro+(chico?' NIÑO':' ADULTO');
}

/* ---------- detección de hoja / encabezados / columnas ------------------- */
const OC_TALLE_TXT = /^(xxxs|xxs|xs|s|m|l|xl|xxl|xxxl|[2-6]xl|unico)$/;
function ocEsTalle(h){
  const n=ocNorm(h); if(!n) return false;
  if(OC_TALLE_TXT.test(n)) return true;
  const m=n.match(/^t?(\d{1,2})( 5)?$/); if(m){ const v=+m[1]; return v>=1 && v<=60; }
  return false;
}
function ocTalleCols(H, usadas){
  const out=[]; H.forEach((h,j)=>{ if((usadas||[]).indexOf(j)>-1) return; if(ocEsTalle(h)) out.push([j,String(h).trim()]); });
  return out;
}
/* Familia = la línea de producto, para que las variantes queden juntas:
   "SAMBA OG" y "SAMBA CLASSIC" → SAMBA · "W 3S TR TS" e "I 3S T-SET" → 3S.
   Se saltean los prefijos de género/edad de una letra (W/M/I/J/K…). */
const OC_FAM_SKIP = /^(w|m|i|j|k|u|y|b|g|jr|yt|inf|kid|kids|men|women|unisex|the|de|la|el)$/;
function ocFamilia(desc){
  const toks=String(desc||'').toUpperCase().replace(/[^A-Z0-9ÁÉÍÓÚÜÑ.\- ]/g,' ').split(/\s+/).filter(Boolean);
  for(const t of toks){ if(t.length>1 && !OC_FAM_SKIP.test(t.toLowerCase())) return t; }
  return toks[0]||'';
}
/* orden predeterminado de la OC: rubro → familia → modelo */
function ocOrdenarArts(arts){
  return (arts||[]).slice().sort((a,b)=>
    cmp(a.rubro||'ZZZ', b.rubro||'ZZZ') || cmp(a.familia||'', b.familia||'') ||
    cmp(a.descripcion||'', b.descripcion||'') || cmp(a.modelo||'', b.modelo||''));
}
/* "4, 4-, 5, 5-, 6" = curva (varios talles en una celda) · "9,5" = un talle */
function ocEsCurva(s){
  const p=String(s).split(/\s*[,;|\/]\s*/).filter(x=>x!=='');
  return p.length>1 && !/^\d+[.,]5$/.test(String(s).trim());
}
const ocCurvaLista = s => String(s||'').split(/\s*[,;|\/]\s*/).map(x=>x.trim()).filter(Boolean);
function ocUnirCurva(a, b){
  const out=ocCurvaLista(a); ocCurvaLista(b).forEach(t=>{ if(out.indexOf(t)<0) out.push(t); });
  return out.join(', ');
}
function ocCandidatos(nh, campo, prefer){
  const al=(prefer||[]).concat(OC_ALIAS[campo]||[]); const out=[];
  al.forEach(a=>{ nh.forEach((h,j)=>{ if(h===a && out.indexOf(j)<0) out.push(j); }); });
  al.forEach(a=>{ nh.forEach((h,j)=>{ if(h && h.indexOf(a)>-1 && out.indexOf(j)<0) out.push(j); }); });
  return out;
}
/* perfil numérico de una columna: sirve para elegir entre columnas homónimas
   (adidas trae un "Confirmado" numérico y otro de texto) y para no confundir
   una columna de importe con una de unidades (unidades ≈ enteros positivos) */
function ocPerfil(rows, j){
  let ok=0, tot=0, ent=0, pos=0, suma=0;
  for(let i=0;i<Math.min(rows.length,400);i++){
    const v=(rows[i]||[])[j]; if(v===''||v==null) continue; tot++;
    const n=ocNum(v); if(!isFinite(n)) continue;
    ok++; if(Math.abs(n-Math.round(n))<1e-9) ent++; if(n>0){ pos++; suma+=n; }
  }
  return { num: tot?ok/tot:0, ent: ok?ent/ok:0, pos, suma };
}
function ocElegir(nh, rows, campo, prefer, numerica){
  const cand=ocCandidatos(nh, campo, prefer);
  if(!cand.length) return -1;
  if(!numerica) return cand[0];
  const forz=(prefer||[]).length ? cand.filter(j=>(prefer||[]).indexOf(nh[j])>-1) : [];
  const lista=forz.length?forz:cand;
  const veto = campo==='cant' ? OC_NO_CANT : (campo==='costo' ? OC_NO_COSTO : null);
  let fallback=-1;
  for(const j of lista){
    if(veto && veto.test(nh[j]) && !forz.length) continue;
    const p=ocPerfil(rows,j);
    if(p.num<0.6 || !p.pos) continue;
    if(campo==='cant' && p.ent<0.7 && !forz.length){ if(fallback<0) fallback=j; continue; }  // importes: decimales
    return j;
  }
  return fallback>=0?fallback:(lista[0]!=null?lista[0]:-1);
}
/* Modelo de pedido de la marca: el mapeo que ya funcionó una vez (hoja +
   nombres de columna). Sale de modelos-oc.js (semilla, aprendida del último
   pedido guardado de cada marca) y de Firebase (lo que Juli guarda desde el
   modal). Se prioriza por nombre de columna, así aguanta que cambien de lugar. */
function ocModelo(marca){
  const k=ocNorm(marca); if(!k) return null;
  const fb=(window.OC_MODELOS||{})[k], seed=(window.OC_MODELOS_SEED||{})[k];
  return fb||seed||null;
}
function ocPrefer(marca, campo){
  const mod=ocModelo(marca), hint=OC_HINTS[marca]||OC_HINTS[ocNorm(marca)]||{}, out=[];
  if(mod && mod.cols && mod.cols[campo]) out.push(ocNorm(mod.cols[campo]));
  (hint[campo]||[]).forEach(x=>{ if(out.indexOf(x)<0) out.push(x); });
  return out;
}
function ocDetectarCols(headers, rows, marca){
  const nh=headers.map(ocNorm), c={};
  c.cod   = ocElegir(nh, rows, 'cod',   ocPrefer(marca,'cod'));
  c.desc  = ocElegir(nh, rows, 'desc',  ocPrefer(marca,'desc'));
  c.cant  = ocElegir(nh, rows, 'cant',  ocPrefer(marca,'cant'), true);
  c.costo = ocElegir(nh, rows, 'costo', ocPrefer(marca,'costo'), true);
  c.disc  = ocElegir(nh, rows, 'disc',  ocPrefer(marca,'disc'));
  c.rubro = ocElegir(nh, rows, 'rubro', ocPrefer(marca,'rubro'));
  c.gen   = ocElegir(nh, rows, 'gen',   ocPrefer(marca,'gen'));
  c.talle = ocElegir(nh, rows, 'talle', ocPrefer(marca,'talle'));
  c.emp   = ocElegir(nh, rows, 'emp',   ocPrefer(marca,'emp'));
  if(c.desc===c.cod) c.desc=-1;
  if(c.costo===c.cant) c.costo=-1;
  return c;
}
function ocPreparar(t, marca){
  t.cols = t.cols || ocDetectarCols(t.headers, t.rows, marca);
  t.talleCols = ocTalleCols(t.headers, [t.cols.cod,t.cols.desc,t.cols.cant,t.cols.costo,t.cols.disc,t.cols.rubro,t.cols.gen,t.cols.emp]);
  t.empresas = [];
  if(t.cols.emp>=0){ const set={}; t.rows.forEach(r=>{ const v=String((r||[])[t.cols.emp]||'').trim(); if(v) set[v]=1; }); t.empresas=Object.keys(set).sort(cmp); }
  if(t.empresas.length>12) { t.cols.emp=-1; t.empresas=[]; }   // no es un banner, es otra cosa
  t.empresa='';
  const mod=ocModelo(marca);
  if(t.rubroDefault==null) t.rubroDefault=(mod&&mod.rubro)||'';   // rubro cuando la planilla no lo trae
  return t;
}
/* Elige hoja + fila de encabezados. Primero puntúa por columnas mapeadas y
   después — lo que de verdad decide — por cuántos artículos con unidades sale:
   una lista de precios sin pedido puntúa parecido pero no produce artículos. */
function ocLeerTabla(wb, marca){
  const mod=ocModelo(marca), hojaMod=mod&&mod.hoja?ocNorm(mod.hoja):'';
  const cands=[];
  wb.SheetNames.forEach(nm=>{
    const raw=XLSX.utils.sheet_to_json(wb.Sheets[nm],{header:1,defval:'',blankrows:false});
    if(raw.length<2) return;
    for(let i=0;i<Math.min(raw.length-1,25);i++){
      const H=(raw[i]||[]).map(x=>String(x==null?'':x).trim());
      if(H.filter(x=>x!=='').length<3) continue;
      const rows=raw.slice(i+1);
      const c=ocDetectarCols(H, rows, marca); let s=0;
      ['cod','desc','cant','costo'].forEach(f=>{ if(c[f]>=0) s++; });
      if(ocTalleCols(H,[c.cod,c.desc,c.cant,c.costo]).length) s++;
      if(s<2 || (c.cod<0 && c.desc<0)) continue;
      if(hojaMod && ocNorm(nm)===hojaMod) s+=3;
      cands.push({ hoja:nm, headers:H, rows, hdrRow:i+1, cols:c, score:s });
    }
  });
  if(!cands.length) throw new Error('No pude encontrar la tabla de artículos en la planilla. Abrí "⚙ Cambiar columnas" para asignarlas a mano o revisá que la hoja tenga una fila de encabezados.');
  /* manda el mapeo (columnas bien nombradas); que produzca artículos es el
     desempate: descarta hojas de lista de precios sin pedido, pero no deja que
     una fila del medio de la planilla le gane a la fila de encabezados real */
  cands.sort((a,b)=> b.score-a.score || b.rows.length-a.rows.length);
  let best=null;
  for(const c of cands.slice(0,14)){
    ocPreparar(c, marca);
    let arts=[]; try{ arts=ocArmarArts(c); }catch(e){ arts=[]; }
    if(!best) best=c;
    if(arts.length){ best=c; break; }
  }
  return best;
}
/* arma el detalle por artículo a partir de la tabla + el mapeo de columnas */
function ocArmarArts(t){
  const c=t.cols, arts={}, orden=[];
  (t.rows||[]).forEach(r=>{
    if(!r) return;
    if(t.empresa && c.emp>=0 && String(r[c.emp]||'').trim()!==t.empresa) return;
    const cod  = c.cod>=0  ? String(r[c.cod]==null?'':r[c.cod]).trim()  : '';
    const desc = c.desc>=0 ? String(r[c.desc]==null?'':r[c.desc]).trim() : '';
    if(!cod && !desc) return;
    if(/^total/i.test(cod) || /^total/i.test(desc)) return;
    const talles=[]; let cant=0, curva='';
    if(c.talle>=0){
      cant = c.cant>=0 ? ocN(r[c.cant]) : 0;
      const tl=String(r[c.talle]==null?'':r[c.talle]).trim();
      /* la celda puede traer UN talle (una fila por talle) o la CURVA entera
         ("4, 4-, 5, 5-, 6…", como el confirmado de franquicias de adidas): en ese
         caso la marca no abre las unidades por talle, así que se guarda la curva
         como referencia y el confirmado queda a nivel artículo */
      if(cant>0 && tl){ if(ocEsCurva(tl)) curva=tl; else talles.push({talle:tl, cant}); }
    } else if(t.talleCols.length){                   // una columna por talle
      t.talleCols.forEach(([j,lbl])=>{ const q=ocN(r[j]); if(q>0) talles.push({talle:lbl,cant:q}); });
      cant = talles.reduce((a,x)=>a+x.cant,0);
      if(!cant && c.cant>=0) cant=ocN(r[c.cant]);
    } else {
      cant = c.cant>=0 ? ocN(r[c.cant]) : 0;
    }
    if(cant<=0) return;                              // sin unidades confirmadas → fuera
    const costo = c.costo>=0 ? ocN(r[c.costo]) : 0;
    const disc  = c.disc>=0  ? String(r[c.disc]||'').trim().toUpperCase() : '';
    const key = (cod||desc)+'|'+Math.round(costo);
    let a=arts[key];
    if(!a){
      const rubro=ocRubro(c.rubro>=0?r[c.rubro]:'', disc, desc) || t.rubroDefault || '';
      const genero=ocGenero(c.gen>=0?r[c.gen]:'');
      a=arts[key]={ modelo:cod, descripcion:desc, genero, rubro,
        disciplina:OC_DISC_MAP[disc]||disc||'SIN DISCIPLINA', tipo:ocTipo(rubro,genero)||OC_TIPO_MAP[genero]||'',
        talles:[], curva:'', cantidad:0, costo_unitario:costo };
      orden.push(key);
    }
    a.cantidad+=cant;
    talles.forEach(x=>{ const e=a.talles.filter(y=>y.talle===x.talle)[0]; if(e) e.cant+=x.cant; else a.talles.push({talle:x.talle,cant:x.cant}); });
    if(curva) a.curva=ocUnirCurva(a.curva, curva);
  });
  return orden.map(k=>arts[k]);
}

/* Lector propio de Nike — hoja "Resumen Pedido" (modelo x talles) */
function convNike(wb){
  const sheet = wb.SheetNames.includes('Resumen Pedido')?'Resumen Pedido':wb.SheetNames[0];
  const raw = XLSX.utils.sheet_to_json(wb.Sheets[sheet],{header:1,defval:''});
  const H=raw[1]||[]; const col=n=>H.indexOf(n);
  const iMat=col('Material Nike'), iDesc=col('Descripcion Nike'), iCat=col('Categoria'), iGen=col('Genero'), iPw=col('Precio Whsl'), iTot=col('Total Unidades');
  if(iTot<0) throw new Error('No parece un Excel de OC Nike (falta "Total Unidades" en la hoja "Resumen Pedido").');
  const talleCols=[]; for(let j=iPw+1;j<iTot;j++){ if(H[j]!=='' && H[j]!=null) talleCols.push([j,String(H[j])]); }
  const arts=[];
  for(let i=2;i<raw.length;i++){ const r=raw[i]; const tot=num(r[iTot]); if(tot<=0) continue;
    if(/^total/i.test(String(r[iMat]||'').trim())) continue;
    const cat=String(r[iCat]||'').trim().toUpperCase(), gen=String(r[iGen]||'').trim().toUpperCase();
    const talles=[]; talleCols.forEach(([j,lbl])=>{ const q=num(r[j]); if(q>0) talles.push({talle:lbl,cant:q}); });
    arts.push({ modelo:String(r[iMat]||'').trim(), descripcion:String(r[iDesc]||'').trim(), genero:gen,
      rubro:'CALZADO', disciplina:OC_DISC_MAP[cat]||cat||'SIN DISCIPLINA', tipo:OC_TIPO_MAP[gen]||'CALZADO ADULTO',
      talles, cantidad:tot, costo_unitario:num(r[iPw]) });
  }
  return arts;
}
const OC_CONVERTERS = { 'Nike': convNike };   // lectores propios; el resto va por el motor genérico

/* convCtx = la OC unificada · ocCtx = la tabla cruda + mapeo (para re-armar) */
let convCtx=null, ocCtx=null, ocMapOpen=false;
function ocTotales(oc){
  let unid=0, imp=0;
  (oc.articulos||[]).forEach(a=>{ if(a.familia==null) a.familia=ocFamilia(a.descripcion); unid+=a.cantidad; imp+=a.cantidad*a.costo_unitario; });
  oc.total_unidades=unid; oc.total_importe=imp; return oc;
}
function convertirOC(marca, wb, filename){
  const meta = ocFromFilename(filename, marca);
  let arts=null, motor='';
  if(OC_CONVERTERS[marca]){ try{ arts=OC_CONVERTERS[marca](wb); motor=marca; ocCtx=null; }catch(e){ arts=null; } }
  if(!arts || !arts.length){
    ocCtx = ocLeerTabla(wb, marca);
    arts = ocArmarArts(ocCtx);
    motor = 'auto';
  }
  if(!arts.length) throw new Error('No se detectaron artículos con unidades en la planilla.');
  return ocTotales({ nro:meta.nro, fecha:meta.fecha, marca, proveedor:marca+' Argentina', comprador:'', moneda:'ARS', motor, articulos:arts });
}
function ocRearmar(){
  if(!ocCtx) return;
  convCtx.articulos = ocArmarArts(ocCtx);
  ocTotales(convCtx);
  renderConvPreview();
}

function openConvertir(){
  convCtx=null; ocCtx=null; ocMapOpen=false; ocCargarModelos();
  const dataM=(state.dims&&state.dims.marcas)||[];
  const marcas=OC_MARCAS.slice();
  dataM.forEach(m=>{ if(m && !marcas.some(x=>ocNorm(x)===ocNorm(m))) marcas.push(m); });
  marcas.sort(cmp);
  openModal(
    '<button class="close" onclick="closeModal()">×</button><h2>Convertir OC de marca</h2>'
    +'<div class="msub">Importá la planilla que manda la marca y la convertimos al modelo unificado Mateu Sports (detalle por artículo con curva de talles). Detectamos las columnas solas — si no acierta, las reasignás a mano. Después descargás el Excel/PDF o la guardás al sistema.</div>'
    +'<div class="field"><label>Marca</label><select class="sel" id="convMarca">'+marcas.map(m=>'<option'+(m==='adidas'?' selected':'')+'>'+esc(m)+'</option>').join('')+'<option value="__otra">Otra marca…</option></select></div>'
    +'<div class="field" id="convOtraWrap" style="display:none"><label>Nombre de la marca</label><input class="inp" id="convOtra" placeholder="Ej. Sergio Tacchini" style="width:100%"></div>'

/* el logo del shell es WebP y jsPDF solo come PNG/JPG → lo pasamos por canvas */
async function ocLogoPNG(){
  try{
    const img=document.querySelector('.msh-logo img, .msh-header img, header img') || document.querySelector('img[src^="data:image"]');
    if(!img || !img.src) return null;
    const el=new Image(); el.crossOrigin='anonymous'; el.src=img.src;
    if(el.decode) await el.decode(); else await new Promise(r=>{ el.onload=r; el.onerror=r; });
    const w=el.naturalWidth||el.width, h=el.naturalHeight||el.height; if(!w||!h) return null;
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    c.getContext('2d').drawImage(el,0,0);
    return { data:c.toDataURL('image/png'), w, h };
  }catch(e){ return null; }
}

/* ============================================================
   IMPORTACIÓN MASIVA de ingresos — reporte "Estadistica de remitos"
   El depósito sube el Excel matriz por mes; se reforma en el navegador (una fila
   por artículo-en-remito, con cantidad/valorizado por mes), se previsualiza y se
   SUMA a lo ya cargado (PATCH/merge en Firebase; no pisa lo existente).
   Para un remito suelto está el "Alta manual".
   ============================================================ */
function convEstadistica(wb){
  const sheet = wb.SheetNames[0];
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheet], {defval:''});
  if(!rows.length) throw new Error('El Excel no tiene filas.');
  const MESES = Object.keys(rows[0]).map(h=>{ const m=h.match(/^(\d{2})-(\d{2}) Cantidad$/); return m?h.replace(/ Cantidad$/,''):null; }).filter(Boolean);
  if(!MESES.length) throw new Error('No parece el reporte "Estadistica de remitos" (faltan columnas "MM-YY Cantidad").');
  const marcasPorRemito = {};
  rows.forEach(r=>{ const n=r['Nro.remito']; if(n){ (marcasPorRemito[n]=marcasPorRemito[n]||new Set()).add(r['Marca']); } });
  const docs = {};
  rows.forEach(r=>{
    const nro=r['Nro.remito']; if(!nro) return;
    const marca=String(r['Marca']||'Desconocida').trim();
    const mes=MESES.find(m=>num(r[m+' Cantidad'])>0); if(!mes) return;
    const cant=num(r[mes+' Cantidad']), val=num(r[mes+' Valorizado']);
    const multi=(marcasPorRemito[nro]||new Set()).size>1;
    const docNro = multi ? (nro+' · '+marca) : nro;
    const key = fbKey(docNro);
    let d = docs[key];
    if(!d){ const parts=mes.split('-'); const fecha='20'+parts[1]+'-'+parts[0]+'-01'; d = docs[key] = { nro:docNro, fecha, proveedor:String(r['Proveedor']||'').trim(), marca, pedido_nro:'', semana:semanaISO(fecha), creado_en:nowISO(), origen:'import-estadistica', _lin:{} }; }
    const cod=String(r['Código barras']||'').trim(), art=String(r['Artículo']||'').trim();
    const lk = cod+'|'+art+'|'+(r['Rubro']||'')+'|'+(r['Disciplina']||'')+'|'+(r['Grupo 1']||'');
    const L = d._lin[lk] || (d._lin[lk]={ modelo:cod, descripcion:art, rubro:String(r['Rubro']||'').trim(), disciplina:String(r['Disciplina']||'').trim(), tipo:String(r['Grupo 1']||'').trim(), _c:0, _v:0 });
    L._c+=cant; L._v+=val;
  });
  const out = Object.keys(docs).map(k=>docs[k]);
  out.forEach(d=>{ d.lineas=Object.keys(d._lin).map(k=>{ const L=d._lin[k]; return { modelo:L.modelo, descripcion:L.descripcion, rubro:L.rubro, disciplina:L.disciplina, tipo:L.tipo, cantidad:L._c, costo_unitario: L._c>0?L._v/L._c:0 }; }); delete d._lin; });
  return out;
}

/* ============================================================
   INGRESO DE MERCADERÍA — recepción física del depósito central.
   Pre-ingreso (declarado) + control CIEGO por scan de EAN + conciliación.
   Datos en Firebase, nodo aparte `ingreso/` (no toca recepciones/…).
   El EAN se resuelve contra el maestro de Adidas (maestro-adidas.json):
   scan EAN → SKU (material+talle) → cruce vs. declarado → faltantes/sobrantes.
   ============================================================ */

/* ---- maestro EAN de Adidas (lazy: ~1,5 MB gzip, se baja una sola vez) ---- */
let MAESTRO=null, _maestroP=null, _sku2ean=null;
function loadMaestro(){
  if(MAESTRO) return Promise.resolve(MAESTRO);
  if(_maestroP) return _maestroP;
  _maestroP = fetch('./maestro-adidas.json').then(r=>{ if(!r.ok) throw new Error('No pude cargar el maestro de Adidas ('+r.status+')'); return r.json(); }).then(j=>{ MAESTRO=j; return j; });
  return _maestroP;
}
function eanInfo(ean){ // EAN -> {sku,material,talle,desc} | null
  if(!MAESTRO) return null;
  const v = MAESTRO.ean[String(ean||'').replace(/\D/g,'')];
  if(!v) return null;
  const i=v.indexOf('\t'); const material=v.slice(0,i), talle=v.slice(i+1);
  return { material, talle, sku:material+talle, desc:(MAESTRO.desc&&MAESTRO.desc[material])||'' };
}
function skuInfo(sku){ // SKU (material+talle) -> {ean,material,talle,desc} | null
  if(!MAESTRO) return null;
  if(!_sku2ean){ _sku2ean={}; const em=MAESTRO.ean; for(const e in em){ _sku2ean[em[e].replace('\t','')]=e; } }
  const ean=_sku2ean[String(sku||'').trim().toUpperCase()]; if(!ean) return null;
  const info=eanInfo(ean); return info?Object.assign(info,{ean:ean}):null;
}

function ingDeclTot(R){ let t=0; const d=R.declarado||{}; for(const s in d) t+=num(d[s].cant); return t; }
function ingScanTot(C){ let t=0; if(!C) return 0; for(const k in (C.scans||{})) t+=num(C.scans[k]); for(const k in (C.unknown||{})) t+=num(C.unknown[k]); return t; }

/* ---- OCR del packing list (foto/scan) → detalle, con auto-corrección de códigos ----
   Tesseract por CDN (lazy). Como TODO SKU tiene que existir en el maestro de Adidas,
   corregimos lo que el OCR lee mal enganchándolo al SKU válido más parecido. Siempre
   cae en el textarea para que Ariel/Luis revisen antes de guardar. */
function ensureTesseract(){ return new Promise((res,rej)=>{ if(window.Tesseract) return res(); const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'; s.onload=()=>res(); s.onerror=()=>rej(new Error('no pude cargar el OCR')); document.head.appendChild(s); }); }
/* confusiones típicas de OCR (letra ↔ dígito parecido) */
const ING_CONF = { '0':['O','D','Q'],'O':['0'],'D':['0'],'Q':['0'],'1':['I','L'],'I':['1'],'L':['1'],'5':['S'],'S':['5'],'8':['B'],'B':['8'],'2':['Z'],'Z':['2'],'6':['G'],'G':['6'],'7':['T'],'T':['7'],'9':['Q'] };
/* descripción del packing list (OCR) por material — para mostrar el texto TAL CUAL
   viene en el packing (ej. "ONICLA/NEGRO"), no la del maestro (ej. "CLONIX/BLACK"). */
let ING_OCR_DESC = {};
function ingSkuVariants(s){
  let combos=[s];
  for(let i=0;i<s.length;i++){
    const alts=ING_CONF[s[i]]; if(!alts) continue;
    const opts=[s[i]].concat(alts); const next=[];
    for(const base of combos){ for(const o of opts){ next.push(base.slice(0,i)+o+base.slice(i+1)); if(next.length>600) break; } if(next.length>600) break; }
    combos=next; if(combos.length>600) break;
  }
  return combos;
}
function ingCorregirSku(raw){
  const s=String(raw||'').toUpperCase().replace(/[^A-Z0-9-]/g,'');
  if(!s) return {sku:s, conf:'revisar'};
  if(skuInfo(s)) return {sku:s, conf:'ok'};
  for(const v of ingSkuVariants(s)){ if(v!==s && skuInfo(v)) return {sku:v, conf:'corregido'}; }
  return {sku:s, conf:'revisar'};
}
function ingParsePacking(text){
  const out=[]; let pedido='', bultos='', totalCant=null;
  const lines=String(text||'').split(/\r?\n/);
  for(const raw of lines){
    const ln=raw.trim(); if(!ln) continue;
    const mp=ln.match(/pedido\D*(\d{6,})/i); if(mp) pedido=mp[1];
    const mt=ln.match(/totales?\D+(\d{1,4})\D+(\d{1,4})\D+(\d{1,5})/i); // Totales <bultos> <skus> <cant>
    if(mt){ if(!bultos) bultos=mt[1]; totalCant=parseInt(mt[3],10); }
    const toks=ln.split(/\s+/); const last=toks[toks.length-1];
    if(!/^\d{1,4}$/.test(last)) continue;
    const qty=parseInt(last,10); if(!qty) continue;
    let sku=null, si=-1;
    for(let i=0;i<toks.length;i++){ const c=toks[i].toUpperCase(); if(c==='NOECOM'||c==='NOCOM'||c==='ECOM') continue; if(/[A-Z]/.test(c)&&/[0-9]/.test(c)&&c.length>=6&&c.length<=11&&/^[A-Z0-9-]+$/.test(c)){ sku=c; si=i; break; } }
    if(!sku) continue;
    const desc=toks.slice(si+1, toks.length-1).join(' ').trim(); // texto del packing tal cual (entre el SKU y la cantidad)
    out.push({sku:sku, qty:qty, desc:desc});
  }
  return {pedido:pedido, bultos:bultos, totalCant:totalCant, lines:out};
}
async function ingOcrFile(file){
  const st=$('inOcr'); if(st) st.textContent='Leyendo la imagen… (puede tardar unos segundos la primera vez)';
  try{
    await Promise.all([ ensureTesseract(), loadMaestro() ]);
    const { data } = await Tesseract.recognize(file, 'eng', { logger:m=>{ if(m.status==='recognizing text' && st) st.textContent='Reconociendo texto… '+Math.round((m.progress||0)*100)+'%'; } });
    const p = ingParsePacking(data && data.text || '');
    const agg={}; let okc=0, corr=0, dud=0; ING_OCR_DESC={};
    p.lines.forEach(l=>{ const c=ingCorregirSku(l.sku); if(c.conf==='ok')okc++; else if(c.conf==='corregido')corr++; else dud++; agg[c.sku]=(agg[c.sku]||0)+l.qty; if(l.desc){ const inf=skuInfo(c.sku); const mat=inf?inf.material:c.sku; if(!ING_OCR_DESC[mat]) ING_OCR_DESC[mat]=l.desc; } });
    const skus=Object.keys(agg);
    if(!skus.length){ if(st) st.innerHTML='No pude detectar líneas. Probá con una foto más derecha y nítida, o cargá el detalle a mano.'; toast('OCR sin resultados','bad'); return; }
    $('inDet').value = skus.map(s=>s+' '+agg[s]).join('\n');
    if(p.pedido && !$('inPed').value) $('inPed').value=p.pedido;
    if(p.bultos && !$('inBul').value) $('inBul').value=p.bultos;
    let sumq=0; skus.forEach(s=>sumq+=agg[s]);
    let msg='Detecté <b>'+skus.length+'</b> SKU · '+okc+' ok, '+corr+' corregidos, '+dud+' a revisar. Revisá el detalle y tocá “Resolver detalle”.';
    if(p.totalCant!=null && p.totalCant!==sumq) msg+=' <b class="bad">⚠ El total leído ('+sumq+' u) no coincide con el “Totales” del packing ('+p.totalCant+' u) — revisá.</b>';
    if(st) st.innerHTML=msg;
    toast(dud>0?('OCR listo — '+dud+' SKU a revisar'):'OCR listo — revisá el detalle', dud>0?'':'ok');
  }catch(e){ if(st) st.textContent='Error leyendo la imagen: '+e.message; toast('OCR: '+e.message,'bad'); }
}
