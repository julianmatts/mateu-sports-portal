# wrangler.toml — Portal Mateu Sports (Cloudflare Pages)
#
# El portal se publica en Cloudflare Pages y deploya solo con cada push a main.
# Cloudflare Pages LEE este archivo en el deploy y aplica los bindings de acá
# (la pantalla Settings → Bindings del panel quedaba trabada al guardar, así que
# el binding de R2 se declara acá, que es la vía soportada y estable).

name = "mateu-sports-portal"
pages_build_output_dir = "."
compatibility_date = "2024-11-01"

# --- Bucket R2 de archivos de RRHH (fotos + documentos por persona) ---
# Bucket creado en la cuenta (R2 → mateu-legajos). El módulo rrhh/ lo usa vía la
# Pages Function functions/api/rrhh/[[path]].js (env.LEGAJOS).
[[r2_buckets]]
binding = "LEGAJOS"
bucket_name = "mateu-legajos"

# --- Base D1 del módulo Control de Recepciones (PENDIENTE) ---
# Comentado a propósito: la base todavía no está creada y el database_id es un
# placeholder inválido que haría fallar el deploy si Pages lo procesa. Cuando se
# cree la base D1 real, pegar su database_id y descomentar este bloque.
# [[d1_databases]]
# binding = "DB"
# database_name = "mateu_recepciones"
# database_id = "<pendiente-pegar-database_id>"
