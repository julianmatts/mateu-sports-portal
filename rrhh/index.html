<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Recursos Humanos · Mateu Sports</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B1527;--navy-mid:#1a2f55;--navy-soft:#13203a;
  --red:#CC0000;--red-soft:#ff3b3b;
  --white:#fff;--off:#f5f7fc;--muted:#6B7A99;--muted-light:#b0bcd4;
  --card:#fff;--border:#dce3f0;
  --ok:#16a34a;--warn:#d97706;--bad:#dc2626;--exc:#7c3aed;--info:#2563eb;
  --font-d:'Bebas Neue',sans-serif;--font-c:'Barlow Condensed',sans-serif;--font-b:'Barlow',sans-serif;
  --shadow:0 1px 4px rgba(11,21,39,.08);--shadow-md:0 8px 30px rgba(11,21,39,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--off);color:var(--navy);font-family:var(--font-b);min-height:100vh}
img,svg{max-width:100%}

/* ===== HEADER ===== */
.top{background:var(--navy);padding:12px 22px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:3px solid var(--red);position:sticky;top:0;z-index:40;flex-wrap:wrap;gap:10px}
.top a.logo{display:flex;align-items:center;gap:11px;text-decoration:none;min-width:0}
.top img{height:32px;filter:brightness(0) invert(1)}
.top .tt{font-family:var(--font-d);font-size:19px;letter-spacing:1.5px;color:#fff;line-height:1}
.top .ts{font-family:var(--font-c);font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--muted-light)}
.top-right{display:flex;align-items:center;gap:12px;margin-left:auto}
.who{text-align:right;line-height:1.1}
.who .n{font-family:var(--font-c);font-size:13px;font-weight:600;color:#fff;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .r{font-family:var(--font-c);font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--red-soft)}
.salir{background:transparent;border:1px solid rgba(255,255,255,.25);border-radius:6px;color:rgba(255,255,255,.7);
  font-family:var(--font-c);font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:7px 13px;cursor:pointer}
.salir:hover{color:#fff;border-color:#fff}

/* ===== NAV TABS ===== */
.tabs{background:#fff;border-bottom:1px solid var(--border);padding:0 22px;display:flex;gap:6px;overflow-x:auto;position:sticky;top:var(--msh-h,67px);z-index:30}
/* Pestañas centradas (pedido de Juli 04/09/2026). Se centra con márgenes auto en los extremos y no con
   justify-content:center: así, si en una pantalla angosta no entran, el scroll horizontal arranca desde
   la primera en vez de recortarla por la izquierda. */
.tab:first-child{margin-left:auto}
.tab:last-child{margin-right:auto}
.tab{padding:15px 20px;border:0;background:none;cursor:pointer;font-family:var(--font-c);font-size:16px;font-weight:600;
  letter-spacing:.5px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--navy);border-bottom-color:var(--red)}
.tab:hover{color:var(--navy)}
.tab:focus-visible{outline:2px solid var(--red);outline-offset:-2px}
.tab .badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:7px;border-radius:10px;background:#e6ebf5;
  color:var(--navy-mid);font-family:var(--font-b);font-size:12px;font-weight:700;line-height:20px;text-align:center}
.tab.on .badge{background:var(--red);color:#fff}

main{max-width:1200px;margin:0 auto;padding:22px 22px 90px}

.banner{border-radius:9px;padding:10px 14px;font-size:13px;margin-bottom:16px}
.banner.warn{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412}
.banner.info{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af}
.banner code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:4px;font-size:12px}
/* Cierre semanal del Calendario: tarjeta con avance + sucursales agrupadas por estado (04/09/2026) */
.calsem{background:#fff;border:1px solid var(--border);border-left:4px solid var(--warn);border-radius:10px;padding:14px 16px;margin-bottom:16px}
.calsem.ok{border-left-color:var(--ok)}
.calsem-top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.calsem-top .lbl{font-family:var(--font-c);font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.calsem-top .tit{font-family:var(--font-d);font-size:22px;letter-spacing:.5px;color:var(--navy);line-height:1.05}
.calsem-num{display:flex;align-items:baseline;gap:6px;margin-left:auto}
.calsem-num b{font-family:var(--font-d);font-size:34px;line-height:1;color:var(--warn)}
.calsem.ok .calsem-num b{color:var(--ok)}
.calsem-num span{font-family:var(--font-c);font-size:13px;font-weight:600;color:var(--muted)}
.calsem-bar{height:6px;border-radius:3px;background:#edf0f7;margin:10px 0 12px;overflow:hidden}
.calsem-bar i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .4s}
.calsem-grp{display:flex;align-items:flex-start;gap:10px;margin-top:8px}
.calsem-grp .g{flex:0 0 190px;font-family:var(--font-c);font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding-top:4px;display:flex;align-items:center;gap:6px}
.calsem-grp .g i{display:inline-block;width:9px;height:9px;border-radius:50%}
.calsem-grp.ok .g{color:var(--ok)}.calsem-grp.ok .g i{background:var(--ok)}
.calsem-grp.mid .g{color:var(--warn)}.calsem-grp.mid .g i{background:var(--warn)}
.calsem-grp.bad .g{color:var(--bad)}.calsem-grp.bad .g i{background:var(--bad)}
.calsem-grp .chips{display:flex;flex-wrap:wrap;gap:6px}
.calsem-chip{border:1px solid var(--border);background:#f7f9fd;border-radius:999px;padding:3px 10px;font-family:var(--font-b);font-size:12.5px;color:var(--navy);cursor:pointer;line-height:1.4}
.calsem-chip:hover{border-color:var(--navy);background:#fff}
.calsem-grp.bad .calsem-chip{background:#fef2f2;border-color:#fecaca}
.calsem-grp.mid .calsem-chip{background:#fffbeb;border-color:#fde68a}
.calsem-grp.ok .calsem-chip{background:#f0fdf4;border-color:#bbf7d0}
.calsem-foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px dashed var(--border);font-size:12.5px;color:var(--muted)}
.calsem-foot .btn{margin-left:auto}
@media(max-width:640px){.calsem-grp{flex-direction:column;gap:6px}.calsem-grp .g{flex:none}.calsem-num{margin-left:0}}

/* ===== CONTROLES ===== */
.sel,.inp{padding:9px 11px;border:1px solid var(--border);border-radius:7px;font-size:14px;color:var(--navy);background:#fff;font-family:var(--font-b);width:100%}
.sel:focus,.inp:focus{outline:none;border-color:var(--navy-mid)}
.btn{border:none;border-radius:8px;padding:10px 16px;font-family:var(--font-c);font-size:13px;font-weight:700;
  letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:7px}
.btn-primary{background:var(--red);color:#fff}.btn-primary:hover{background:#a00000}
.btn-navy{background:var(--navy);color:#fff}.btn-navy:hover{background:var(--navy-mid)}
.btn-outline{background:#fff;border:1.5px solid var(--border);color:var(--navy)}.btn-outline:hover{border-color:var(--navy-mid)}
.btn-sm{padding:6px 11px;font-size:11px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.sel:focus-visible,.inp:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* ===== TOOLBAR ===== */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar .grow{flex:1;min-width:180px}
.toolbar .field{display:flex;flex-direction:column;gap:3px}
.toolbar .field label{font-family:var(--font-c);font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.toolbar .field .sel,.toolbar .field .inp{min-width:150px;width:auto}

/* ===== SEC HEAD ===== */
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sec-head h1{font-family:var(--font-d);font-size:30px;letter-spacing:1px;line-height:1}
.sec-head .sub{font-family:var(--font-c);font-size:13px;font-weight:500;color:var(--muted);margin-top:2px}

/* ===== CARDS ===== */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.card-h{font-family:var(--font-d);font-size:20px;letter-spacing:.5px;margin-bottom:2px}
.card-hs{font-family:var(--font-c);font-size:12px;color:var(--muted);margin-bottom:14px}

/* ===== KPIs ===== */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:11px;padding:14px 16px;box-shadow:var(--shadow);border-left:4px solid var(--navy-mid)}
.kpi.ok{border-left-color:var(--ok)}.kpi.warn{border-left-color:var(--warn)}.kpi.bad{border-left-color:var(--bad)}.kpi.info{border-left-color:var(--info)}
.kpi .k{font-family:var(--font-c);font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--font-d);font-size:32px;letter-spacing:.5px;margin-top:4px;line-height:1}
.kpi .v small{font-size:14px;color:var(--muted);font-family:var(--font-c)}
.kpi .s{font-family:var(--font-c);font-size:11.5px;color:var(--muted);margin-top:3px}

/* ===== TABLA ===== */
.tblwrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:#fff;box-shadow:var(--shadow)}
table.grid{border-collapse:collapse;width:100%;font-size:13.5px;min-width:640px}
table.grid th{background:var(--navy);color:#fff;font-family:var(--font-c);font-weight:600;letter-spacing:.5px;
  text-align:left;padding:10px 12px;position:sticky;top:0;white-space:nowrap;font-size:12px;text-transform:uppercase}
table.grid td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
table.grid tbody tr:hover{background:#f7f9fd}
table.grid tbody tr.clk{cursor:pointer}
table.grid td.num,table.grid th.num{text-align:right;font-variant-numeric:tabular-nums}
table.grid .nm{font-weight:600}
table.grid .sub{font-family:var(--font-c);font-size:12px;color:var(--muted)}

/* ===== CHIPS / TAGS ===== */
.tag{display:inline-block;font-family:var(--font-c);font-size:11px;font-weight:600;letter-spacing:.5px;
  padding:2px 8px;border-radius:20px;white-space:nowrap}
.tag.ft{background:#e8f0ff;color:#1e40af}.tag.pt{background:#fef3e2;color:#9a3412}
.tag.activo{background:#e7f6ec;color:#166534}.tag.baja{background:#fdecec;color:#991b1b}
.tag.g-Ventas{background:#fdecec;color:#991b1b}.tag.g-Caja{background:#e8eefc;color:#1e3a8a}
.tag.g-Jefatura{background:#eef1f7;color:#334155}.tag.g-Refuerzos{background:#f1f5f9;color:#475569}
.tag.pend{background:#fef3e2;color:#9a3412}.tag.aprob{background:#e7f6ec;color:#166534}.tag.rech{background:#fdecec;color:#991b1b}
.tag.vac{background:#e0f2fe;color:#075985}.tag.enf{background:#fef9c3;color:#854d0e}.tag.lic{background:#ede9fe;color:#5b21b6}
.tag.falta{background:#fdecec;color:#991b1b}.tag.otro{background:#f1f5f9;color:#475569}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;display:inline-flex;align-items:center;
  justify-content:center;font-family:var(--font-c);font-weight:700;font-size:13px;flex-shrink:0}
.person{display:flex;align-items:center;gap:10px}

/* ===== EMPTY ===== */
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .ic{font-size:44px;opacity:.5}
.empty .t{font-family:var(--font-c);font-size:16px;font-weight:600;margin-top:8px;color:var(--navy)}
.empty .s{font-size:13px;margin-top:4px}
.state{display:flex;align-items:center;justify-content:center;gap:12px;padding:60px 20px;color:var(--muted);font-family:var(--font-c)}
.spinner{width:22px;height:22px;border:3px solid var(--border);border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== MODAL ===== */
.modal-bg{position:fixed;inset:0;background:rgba(11,21,39,.5);display:none;align-items:flex-start;justify-content:center;
  z-index:60;padding:30px 16px;overflow-y:auto}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:640px;box-shadow:var(--shadow-md);margin:auto}
.modal-h{background:var(--navy);color:#fff;padding:16px 20px;border-radius:16px 16px 0 0;border-bottom:3px solid var(--red);
  display:flex;align-items:center;justify-content:space-between}
.modal-h .t{font-family:var(--font-d);font-size:22px;letter-spacing:.5px}
.modal-h .x{background:none;border:none;color:#fff;font-size:24px;cursor:pointer;line-height:1;opacity:.8}
.modal-h .x:hover{opacity:1}
.modal-b{padding:20px}
.modal-f{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.frow{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:12px}
.frow.one{grid-template-columns:1fr}
.f label{display:block;font-family:var(--font-c);font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.f{min-width:0}
.hintline{font-family:var(--font-c);font-size:12px;color:var(--muted);margin:-4px 0 10px}

/* ===== DETALLE LEGAJO ===== */
.dl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:8px}
.dl-item{background:var(--off);border:1px solid var(--border);border-radius:9px;padding:10px 12px}
.dl-item .l{font-family:var(--font-c);font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.dl-item .v{font-size:14px;font-weight:600;margin-top:2px}
.dl-head{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.dl-head .avatar{width:52px;height:52px;font-size:20px}
.dl-head .n{font-family:var(--font-d);font-size:26px;letter-spacing:.5px;line-height:1}
.dl-head .r{font-family:var(--font-c);font-size:13px;color:var(--muted)}
.mini-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* ===== BARRAS ROTACIÓN ===== */
.chart{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:10px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.chart .bars{display:flex;align-items:flex-end;gap:2px;height:120px;width:100%;justify-content:center}
.chart .bar{width:9px;border-radius:3px 3px 0 0}
.chart .bar.alta{background:var(--ok)}.chart .bar.baja{background:var(--bad)}
.chart .lbl{font-family:var(--font-c);font-size:10px;color:var(--muted);white-space:nowrap}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--font-c);font-size:12px;color:var(--muted);margin-top:8px}
.legend .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--navy);color:#fff;
  padding:12px 20px;border-radius:10px;font-family:var(--font-c);font-weight:600;box-shadow:var(--shadow-md);z-index:70;
  opacity:0;transition:all .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.err{background:var(--bad)}.toast.ok{background:var(--ok)}

.rowact{display:flex;gap:6px;flex-wrap:wrap}
.iconbtn{background:none;border:1px solid var(--border);border-radius:7px;padding:5px 9px;cursor:pointer;font-size:13px;color:var(--navy-mid)}
.iconbtn:hover{border-color:var(--navy-mid);background:#f7f9fd}
.iconbtn.danger:hover{border-color:var(--bad);color:var(--bad)}

/* ===== MENÚ DESPLEGABLE (botón "+ Cargar") ===== */
.ddwrap{position:relative;display:inline-block}
.ddmenu{display:none;position:absolute;right:0;top:calc(100% + 6px);z-index:50;background:#fff;border:1px solid var(--border);
  border-radius:10px;box-shadow:var(--shadow-md);min-width:280px;overflow:hidden}
.ddmenu.on{display:block}
.ddmenu button{display:block;width:100%;text-align:left;background:none;border:0;padding:11px 14px;cursor:pointer;
  font-family:var(--font-b);font-size:14px;color:var(--navy);border-bottom:1px solid var(--border)}
.ddmenu button:last-child{border-bottom:0}
.ddmenu button:hover{background:#f7f9fd}
.ddmenu button span{display:block;font-family:var(--font-c);font-size:11.5px;color:var(--muted);margin-top:1px}

/* ===== CALENDARIO DE NOVEDADES =====
   Réplica del Excel que hoy mandan los encargados: una grilla del mes,
   lunes a domingo, con texto libre por día. */
.calbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.calnav{display:flex;align-items:center;gap:8px}
.calnav .mes{font-family:var(--font-d);font-size:26px;letter-spacing:.5px;min-width:210px;text-align:center;line-height:1}
.calnav button{background:#fff;border:1.5px solid var(--border);border-radius:8px;width:34px;height:34px;cursor:pointer;
  font-size:16px;color:var(--navy);line-height:1}
.calnav button:hover{border-color:var(--navy-mid)}
.calstate{font-family:var(--font-c);font-size:12px;color:var(--muted);min-width:90px}
.calstate.ok{color:var(--ok)}
.calwrap{overflow-x:auto}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;min-width:940px;background:var(--card);
  border:1px solid var(--border);border-radius:12px;padding:10px;box-shadow:var(--shadow)}
.calgrid .ch{font-family:var(--font-c);font-size:11px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;
  color:#fff;background:var(--navy);border-radius:6px;padding:8px;text-align:center}
.cald{border:1px solid var(--border);border-radius:8px;min-height:124px;padding:6px 8px;display:flex;flex-direction:column;gap:4px;background:#fff}
.cald.off{background:#f7f9fd;border-style:dashed}
.cald.hoy{border-color:var(--red);box-shadow:0 0 0 2px rgba(204,0,0,.12)}
.cald .n{font-family:var(--font-d);font-size:21px;line-height:1;color:var(--navy)}
.cald.fin .n{color:var(--muted)}
.cald .fer{font-family:var(--font-c);font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  color:#9a3412;background:#fff7ed;border:1px solid #fed7aa;border-radius:5px;padding:1px 6px;align-self:flex-start}
.cald textarea{flex:1;border:0;outline:0;resize:none;font-family:var(--font-b);font-size:12.5px;line-height:1.38;
  color:var(--navy);background:transparent;width:100%;min-height:62px;padding:0}
.cald textarea::placeholder{color:#c9d1e0}
.cald textarea:focus{background:#fbfcff}
.cald .ro{flex:1;font-size:12.5px;line-height:1.38;white-space:pre-wrap;min-height:62px}
.calfoot{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:12px;
  font-family:var(--font-c);color:var(--muted);font-size:13px}
.calfoot .m{font-family:var(--font-d);font-size:22px;color:var(--navy);letter-spacing:.5px}
@media print{
  .tabs,.toolbar,.calbar,.banner,.top,#toast,.msh-header,.msh-subbar{display:none!important}
  main{max-width:none;padding:0}
  .calwrap{overflow:visible}
  .calgrid{border:0;box-shadow:none;gap:3px;min-width:0}
  .cald{min-height:92px;break-inside:avoid}
  .cald textarea,.cald .ro{min-height:46px;font-size:11px}
  .sec-head h1{font-size:22px}
  @page{size:A4 landscape;margin:9mm}
}

@media(max-width:560px){ .frow{grid-template-columns:1fr} .sec-head h1{font-size:26px} }
</style>
<!-- Iconos SVG (reemplazan emojis que Windows 7 / navegadores viejos no dibujan) -->
<script src="../shared/iconos.js" defer></script>
<!-- Academia de Ventas: resumen de capacitación (se inyecta solo; ver capacitaciones/resumen-widget.js) -->
<script src="../capacitaciones/resumen-widget.js" defer></script>
<!-- Header unificado del shell: barra Menú + logo + calendario retail + drawer -->
<script src="../shared/header.js" defer></script>

<script>
/* ============================================================
   RRHH — módulo self-contained del Portal Mateu Sports.
   Cuatro áreas: Legajos, Ausentismo/Licencias, Novedades de
   nómina y Rotación. Lee la sesión del Portal (localStorage),
   sin login propio. Datos en Firebase por REST (nodo rrhh/).
   Lo usa gerencia / RRHH (rol admin o herramienta 'rrhh').
   ============================================================ */
'use strict';
const $ = id => document.getElementById(id);

/* ---------- Firebase ----------
   Reusa la base del Portal (discontinuos-mateu, ya existe con reglas abiertas
   y ahí viven los usuarios). Los datos de RRHH viven en un nodo aparte `rrhh/…`.
   Si Juli crea una base propia `rrhh-mateu`, pegar acá su URL y migra solo.
   Vacío => modo demo (no persiste). */
const FIREBASE_DB_URL = 'https://discontinuos-mateu-default-rtdb.firebaseio.com';
const ROOT = 'rrhh';

/* ---------- sesión ---------- */
const SESSION_KEY = 'mateu_portal_session';
function readSession(){ try{ const s=localStorage.getItem(SESSION_KEY); return s?JSON.parse(s):null; }catch(e){ return window.__sess||null; } }
const SESSION = readSession();
if(!SESSION || !SESSION.rol){ location.replace('../'); }
// RRHH la maneja gerencia. Admin o quien tenga la herramienta 'rrhh'. Los
// supervisores ven solo sus sucursales (session.sucursales), como Evaluaciones.
const esAdmin = SESSION && SESSION.rol==='admin';
const esSuper = SESSION && SESSION.rol==='supervisor';
const tieneTool = SESSION && (SESSION.herramientas||[]).includes('rrhh');
const puedeVer = esAdmin || tieneTool || esSuper;
if(SESSION && SESSION.rol && !puedeVer){ location.replace('../'); }
// Alcance de sucursales (slugs). Admin/tool => todas (null). Supervisor => las suyas.
const SCOPE = (esSuper && Array.isArray(SESSION.sucursales) && SESSION.sucursales.length) ? SESSION.sucursales : null;

/* ---------- sucursales (slug -> nombre visible) ---------- */
const SUCS = {
  'plaza':'MS Plaza Italia','kids':'Mateu Kids','calle-47':'MS Calle 47','calle-49':'MS Calle 49',
  'calle-12':'MS Calle 12','city-bell':'MS City Bell','los-hornos':'MS Los Hornos','berisso':'MS Berisso',
  'ensenada':'MS Ensenada','adidas':'Adidas Av. 7','adidas-12':'Adidas Calle 12','originals':'Adidas Originals',
  'aurelius-12':'Aurelius Calle 12','aurelius-5':'Aurelius Calle 5','aurelius-cb':'Aurelius City Bell',
  'gonnet':'Outlet Gonnet','av-44':'Outlet Av. 44','calle-55':'Outlet Calle 55','aurelius-10':'Aurelius Calle 10',
  'ecommerce':'Ecommerce','diagonal':'Diagonal 80','deposito':'Depósito Central',
  'administracion':'Administración','externos':'Externos',
};
// nombre de sucursal en los datos de Indicadores (con prefijo NN-) -> slug
const DATA_SUC = {
  '12-MS Calle 12':'calle-12','06-MS City Bell':'city-bell','08-MS Calle 47':'calle-47','19-MS Calle 49':'calle-49',
  '13-MS Los Hornos':'los-hornos','01-MS Plaza Italia':'plaza','16-MS Berisso':'berisso','11-MS Ensenada':'ensenada',
  '02-Mateu Kids':'kids','04-Aurelius Calle 12':'aurelius-12','18-Aurelius Calle 5':'aurelius-5','17-Aurelius City Bell':'aurelius-cb',
  '21-Adidas Calle 12':'adidas-12','09-Adidas Av. 7':'adidas','15-Adidas Originals':'originals','99-Ecommerce':'ecommerce',
  '14-Outlet Gonnet':'gonnet','20-Outlet Av. 44':'av-44','03-Outlet Calle 55':'calle-55','07-Aurelius Calle 10':'aurelius-10',
};
function sucLabel(slug){ return SUCS[slug] || slug || '—'; }
function sucsVisibles(){
  const all = Object.keys(SUCS);
  return SCOPE ? all.filter(s=>SCOPE.includes(s)) : all;
}
function enAlcance(slug){ return !SCOPE || SCOPE.includes(slug); }

/* ---------- catálogos ---------- */
const PUESTOS = ['Encargado/a','Subencargado/a','Vendedor/a','Cajero/a','Depósito','Administrativo/a','Gerencia','Otro'];
const REGIMENES = ['Full Time','Part Time'];
const TIPOS_AUS = {
  vacaciones:{label:'Vacaciones',cls:'vac',goce:true},
  enfermedad:{label:'Enfermedad / ART',cls:'enf',goce:true},
  licencia:{label:'Licencia especial',cls:'lic',goce:true},
  falta:{label:'Falta injustificada',cls:'falta',goce:false},
  suspension:{label:'Suspensión',cls:'otro',goce:false},
  otro:{label:'Otro',cls:'otro',goce:true},
};
// Compensatorios: días que la empresa le debe a la persona por haber trabajado
// de más (feriado, domingo, inventario…). Se cargan acá y se descuentan cuando
// se aprueba la solicitud del encargado.
const MOTIVOS_COMP = ['Feriado trabajado','Domingo trabajado','Inventario / recuento','Evento / apertura','Cobertura de otra sucursal','Cambio de franco','Otro'];
const MOTIVOS_BAJA = ['Renuncia','Despido','Fin de contrato','Acuerdo (art. 241)','Jubilación','Abandono','Otro'];
const TIPOS_NOV = {
  horas_extra:{label:'Horas extra',unidad:'hs'},
  adelanto:{label:'Adelanto de sueldo',unidad:'$'},
  comision:{label:'Comisión',unidad:'$'},
  premio:{label:'Premio / bono',unidad:'$'},
  presentismo:{label:'Presentismo',unidad:'$'},
  descuento:{label:'Descuento',unidad:'$'},
  ausencia:{label:'Ausencia (informativa)',unidad:'días'},
  comp_pago:{label:'Compensatorio / horas cobradas',unidad:'$'},
  otro:{label:'Otro',unidad:'$'},
};

/* ---------- helpers ---------- */
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const num = x => { const n=Number(String(x==null?'':x).replace(/[^\d.,-]/g,'').replace(/\.(?=\d{3}\b)/g,'').replace(',','.')); return isFinite(n)?n:0; };
const fmtInt = n => (Math.round(n||0)).toLocaleString('es-AR');
const fmtM = n => '$'+(Math.round(n||0)).toLocaleString('es-AR');
const cmp = (a,b)=>String(a).localeCompare(String(b),'es');
function toast(msg, kind){ const t=$('toast'); t.textContent=msg; t.className='toast show '+(kind||''); setTimeout(()=>{t.className='toast '+(kind||'');},2600); }
function titleCase(s){ return (s||'').toString().toLowerCase().replace(/(^|[\s'’.\-])([a-záéíóúñü])/g,(m,p,c)=>p+c.toUpperCase()); }
function iniciales(nombre){ const p=(nombre||'').trim().split(/\s+/); return ((p[0]||'')[0]||'')+((p[1]||'')[0]||''); }
function hoyISO(){ const d=new Date(); const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function nowISO(){ const d=new Date(); const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes()); }
function fechaLabel(iso){ if(!iso) return '—'; const s=String(iso).slice(0,10).split('-'); return s.length===3? s[2]+'/'+s[1]+'/'+s[0] : iso; }
function periodoActual(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function periodoLabel(p){ const [y,m]=p.split('-'); const nm=['','Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre']; return (nm[+m]||m)+' '+y; }
// días inclusivos entre dos fechas ISO (naive, sin husos)
function diasEntre(a,b){ if(!a||!b) return 0; const d1=new Date(a+'T00:00'),d2=new Date(b+'T00:00'); const n=Math.round((d2-d1)/86400000)+1; return n>0?n:0; }
// antigüedad en años (con decimales) desde ingreso hasta hoy o baja
function antiguedadAnios(leg){ if(!leg.ingreso) return 0; const fin=leg.estado==='baja'&&leg.baja_fecha? leg.baja_fecha : hoyISO(); return Math.max(0,(new Date(fin)-new Date(leg.ingreso))/(365.25*86400000)); }
function antiguedadLabel(leg){ const a=antiguedadAnios(leg); if(!leg.ingreso) return '—'; if(a<1){ const m=Math.round(a*12); return m+' mes'+(m===1?'':'es'); } const y=Math.floor(a), m=Math.round((a-y)*12); return y+' año'+(y===1?'':'s')+(m?(' '+m+'m'):''); }
// vacaciones por ley (LCT Arg.) según antigüedad
function vacacionesLey(leg){ const a=antiguedadAnios(leg); if(a<0.5) return 0; if(a<5) return 14; if(a<10) return 21; if(a<20) return 28; return 35; }
function vacacionesBase(leg){ return (leg.vacaciones_base!=null && leg.vacaciones_base!=='') ? Number(leg.vacaciones_base) : vacacionesLey(leg); }

/* ---------- Firebase REST ---------- */
function fbUrl(path){ return FIREBASE_DB_URL.replace(/\/+$/,'') + '/' + path.split('/').map(encodeURIComponent).join('/') + '.json'; }
async function fbGet(path){ const r=await fetch(fbUrl(path)); if(!r.ok) throw new Error('Firebase HTTP '+r.status); return r.json(); }
async function fbPut(path, data){ const r=await fetch(fbUrl(path),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}); if(!r.ok) throw new Error('Firebase HTTP '+r.status); return r.json(); }
async function fbPost(path, data){ const r=await fetch(fbUrl(path),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}); if(!r.ok) throw new Error('Firebase HTTP '+r.status); return r.json(); }
async function fbPatch(path, data){ const r=await fetch(fbUrl(path),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}); if(!r.ok) throw new Error('Firebase HTTP '+r.status); return r.json(); }
async function fbDelete(path){ const r=await fetch(fbUrl(path),{method:'DELETE'}); if(!r.ok) throw new Error('Firebase HTTP '+r.status); return r.json(); }

/* ============================================================
   ESTADO
   ============================================================ */
const HAS_DB = !!FIREBASE_DB_URL;
let LEGAJOS = {};     // id -> legajo
let AUSENCIAS = {};   // id -> ausencia
let NOVEDADES = {};   // id -> novedad (del período seleccionado)
let SANCIONES = {};   // id -> sanción disciplinaria
// Compensatorios (agrupados por slug de sucursal, para que cada sucursal baje
// solo lo suyo desde Mi Sucursal — misma seguridad blanda que Objetivos/Barrida).
let COMPS = {};       // slug -> legajoId -> {nombre,puesto,movs:{id:{d,f,m,por,en,sol}}}
let SOLIC = {};       // slug -> solicitudId -> solicitud del encargado
// Calendario de novedades del mes por sucursal (el Excel que hoy mandan los
// encargados). Agrupado por slug, como el resto.
let CALEND = {};      // slug -> 'YYYY-MM' -> {dias:{'1':'texto',…}, actualizado, por}
let FERIADOS = null;  // 'YYYY-MM-DD' -> título (del calendario retail del shell)
// Confirmación semanal del calendario: el encargado cierra la semana desde Mi
// Sucursal ('cargada' o 'sin' novedades). Sin esto se juntaba todo a fin de mes.
let CALSEM = {};      // slug -> lunesISO -> {estado:'cargada'|'sin', dias, por, en}
let CONFIG = {};      // rrhh/config: valorHora {general, horasDia, porLegajo}
let state = { tab:'legajos', qLeg:'', fSuc:'', fEstado:'activo', fPuesto:'',
              qAus:'', aSuc:'', aTipo:'', aEstado:'', qSan:'', snSuc:'', snTipo:'', novPeriodo:periodoActual(),
              cSuc:'', cEstado:'pendiente', cVer:'con',
              calSuc:'', calMes:periodoActual() };

/* ============================================================
   INIT
   ============================================================ */
async function init(){
  $('whoName').textContent = SESSION.email || '—';
  $('whoRole').textContent = esAdmin?'Administrador':esSuper?'Supervisor':'RRHH';
  $('salir').onclick = ()=>{ try{ localStorage.removeItem(SESSION_KEY); }catch(e){} location.replace('../'); };
  $('modalX').onclick = closeModal;
  $('modalBg').addEventListener('click', e=>{ if(e.target===$('modalBg')) closeModal(); });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });
  document.querySelectorAll('.tab').forEach(b=> b.onclick=()=>{ state.tab=b.dataset.tab; syncTabs(); render(); });

  if(!HAS_DB){
    $('cfgBanner').style.display='block';
    $('cfgBanner').innerHTML='⚙️ <b>Sin base configurada.</b> Pegá la URL de Firebase en <code>FIREBASE_DB_URL</code> para guardar los datos. Podés explorar en modo demo, pero no persiste.';
  }
  cargarFeriados();
  await recargar();
  render();
}
/* Feriados del calendario retail del shell (shared/data/calendario-<año>.json).
   Solo para marcarlos en la grilla; si falla, el calendario funciona igual. */
async function cargarFeriados(){
  try{
    const anios=[...new Set([new Date().getFullYear(), Number(state.calMes.slice(0,4))])];
    const mapa={};
    for(const y of anios){
      const j = await fetch('../shared/data/calendario-'+y+'.json').then(r=>r.ok?r.json():null).catch(()=>null);
      (j&&j.eventos||[]).filter(e=>e.tipo==='feriado').forEach(ev=>{
        const push=(d,t)=>{ const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); mapa[k]=t; };
        if(ev.regla){
          const pri=new Date(y, ev.regla.mes-1, 1);
          const num=1+((ev.regla.dia-pri.getDay()+7)%7)+(ev.regla.semana-1)*7;
          if(num<=new Date(y, ev.regla.mes, 0).getDate()) push(new Date(y, ev.regla.mes-1, num), ev.titulo);
        }else if(ev.fecha_inicio && ev.fecha_fin){
          const a=ev.fecha_inicio.split('-').map(Number), b=ev.fecha_fin.split('-').map(Number);
          for(let d=new Date(a[0],a[1]-1,a[2]); d<=new Date(b[0],b[1]-1,b[2]); d.setDate(d.getDate()+1)) push(new Date(d), ev.titulo);
        }else if(ev.fecha){
          const a=ev.fecha.split('-').map(Number); push(new Date(a[0],a[1]-1,a[2]), ev.titulo);
        }
      });
    }
    FERIADOS=mapa;
    if(state.tab==='calendario') render();
  }catch(e){ FERIADOS={}; }
}
async function recargar(){
  try{
    const [leg, aus, san, comp, sol, cal, cfg, csem] = await Promise.all([
      fbGet(ROOT+'/legajos'), fbGet(ROOT+'/ausencias'), fbGet(ROOT+'/sanciones'),
      fbGet(ROOT+'/compensatorios'), fbGet(ROOT+'/solicitudes_comp'),
      fbGet(ROOT+'/calendario'), fbGet(ROOT+'/config'), fbGet(ROOT+'/calSemanas') ]);
    LEGAJOS = leg || {};
    AUSENCIAS = aus || {};
    SANCIONES = san || {};
    COMPS = comp || {};
    SOLIC = sol || {};
    CALEND = cal || {};
    CONFIG = cfg || {};
    CALSEM = csem || {};
    // filtro de alcance para supervisores
    if(SCOPE){
      const f={}; Object.entries(LEGAJOS).forEach(([k,v])=>{ if(enAlcance(v.sucursal)) f[k]=v; }); LEGAJOS=f;
      const c={}; Object.entries(COMPS).forEach(([k,v])=>{ if(enAlcance(k)) c[k]=v; }); COMPS=c;
      const t={}; Object.entries(SOLIC).forEach(([k,v])=>{ if(enAlcance(k)) t[k]=v; }); SOLIC=t;
      const g={}; Object.entries(CALEND).forEach(([k,v])=>{ if(enAlcance(k)) g[k]=v; }); CALEND=g;
      const w={}; Object.entries(CALSEM).forEach(([k,v])=>{ if(enAlcance(k)) w[k]=v; }); CALSEM=w;
    }
    await cargarNovedades();
  }catch(e){ console.error(e); toast('No se pudo leer Firebase','err'); }
}
async function cargarNovedades(){
  try{ const n = await fbGet(ROOT+'/novedades/'+state.novPeriodo); NOVEDADES = n || {}; }
  catch(e){ NOVEDADES = {}; }
}
function syncTabs(){ document.querySelectorAll('.tab').forEach(b=> b.classList.toggle('on', b.dataset.tab===state.tab)); }
function refrescarBadges(){
  const legs = Object.values(LEGAJOS).filter(l=>l.estado!=='baja');
  $('bLeg').textContent = legs.length;
  const pend = Object.values(AUSENCIAS).filter(a=>a.estado==='pendiente').length;
  const hoy = ausentesHoy().length;
  $('bAus').textContent = pend || hoy || Object.values(AUSENCIAS).length;
  $('bComp').textContent = solicitudes().filter(s=>(s.estado||'pendiente')==='pendiente').length;
  const bs=$('bSan'); if(bs) bs.textContent = Object.keys(SANCIONES).length;
}

/* ============================================================
   RENDER (router)
   ============================================================ */
function render(){
  refrescarBadges();
  const v=$('view');
  if(state.tab==='legajos') v.innerHTML = viewLegajos();
  else if(state.tab==='ausencias') v.innerHTML = viewAusencias();
  else if(state.tab==='comp') v.innerHTML = viewComp();
  else if(state.tab==='calendario') v.innerHTML = viewCalendario();
  else if(state.tab==='sanciones') v.innerHTML = viewSanciones();
  else if(state.tab==='novedades') v.innerHTML = viewNovedades();
  else if(state.tab==='rotacion') v.innerHTML = viewRotacion();
  wire();
}

/* ---------- listas base ---------- */
function legajosOrden(){
  return Object.entries(LEGAJOS).map(([id,l])=>({id,...l}))
    .sort((a,b)=> cmp(a.nombre||'', b.nombre||''));
}
function ausenciasOrden(){
  return Object.entries(AUSENCIAS).map(([id,a])=>({id,...a}))
    .sort((a,b)=> cmp(b.desde||'', a.desde||''));
}
function novedadesOrden(){
  return Object.entries(NOVEDADES).map(([id,n])=>({id,...n}))
    .sort((a,b)=> cmp((LEGAJOS[a.legajoId]||{}).nombre||'', (LEGAJOS[b.legajoId]||{}).nombre||''));
}
function sancionesOrden(){
  return Object.entries(SANCIONES).map(([id,s])=>({id,...s}))
    .sort((a,b)=> cmp(b.fecha||'', a.fecha||''));
}
const TIPOS_SAN = {
  llamado:{label:'Llamado de atención', cls:'otro'},
  apercibimiento:{label:'Apercibimiento', cls:'lic'},
  suspension:{label:'Suspensión', cls:'falta'},
  acta:{label:'Acta / notificación', cls:'vac'},
  otro:{label:'Otro', cls:'otro'},
};

/* ============================================================
   TAB 1 — LEGAJOS
   ============================================================ */
function viewLegajos(){
  const todos = legajosOrden();
  const q = state.qLeg.trim().toLowerCase();
  let list = todos.filter(l=>{
    if(state.fEstado && (l.estado||'activo')!==state.fEstado) return false;
    if(state.fSuc && l.sucursal!==state.fSuc) return false;
    if(state.fPuesto && l.puesto!==state.fPuesto) return false;
    if(q){ const hay=(l.nombre+' '+(l.dni||'')+' '+(l.puesto||'')+' '+sucLabel(l.sucursal)).toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  });
  const activos = todos.filter(l=>(l.estado||'activo')!=='baja');
  const ft = activos.filter(l=>l.regimen==='Full Time').length;
  const pt = activos.filter(l=>l.regimen==='Part Time').length;

  const kpis = `<div class="kpis">
    <div class="kpi info"><div class="k">Dotación activa</div><div class="v">${activos.length}</div><div class="s">${ft} full time · ${pt} part time</div></div>
    <div class="kpi"><div class="k">Sucursales con gente</div><div class="v">${new Set(activos.map(l=>l.sucursal)).size}</div></div>
    <div class="kpi ok"><div class="k">Antigüedad promedio</div><div class="v">${promedioAntiguedad(activos)}</div></div>
    <div class="kpi warn"><div class="k">Bajas (12 meses)</div><div class="v">${bajasUltimos12().length}</div></div>
    <div class="kpi bad"><div class="k">Compensatorios y horas</div><div class="v" style="font-size:26px">${fmtDias(compTotalDeuda())} · ${fmtHs(hsTotalDeuda())}</div><div class="s">${compConSaldo().length} persona${compConSaldo().length===1?'':'s'} · ${solicitudes().filter(s=>(s.estado||'pendiente')==='pendiente').length} solicitud${solicitudes().filter(s=>(s.estado||'pendiente')==='pendiente').length===1?'':'es'} sin responder</div></div>
  </div>`;

  const opsSuc = ['<option value="">Todas las sucursales</option>'].concat(sucsVisibles().sort((a,b)=>cmp(sucLabel(a),sucLabel(b))).map(s=>`<option value="${s}" ${state.fSuc===s?'selected':''}>${esc(sucLabel(s))}</option>`)).join('');
  const opsPue = ['<option value="">Todos los puestos</option>'].concat(PUESTOS.map(p=>`<option value="${esc(p)}" ${state.fPuesto===p?'selected':''}>${esc(p)}</option>`)).join('');

  const toolbar = `<div class="toolbar">
    <div class="grow"><input class="inp" id="qLeg" placeholder="Buscar por nombre, DNI, puesto…" value="${esc(state.qLeg)}"></div>
    <select class="sel" id="fSuc" style="width:auto">${opsSuc}</select>
    <select class="sel" id="fPuesto" style="width:auto">${opsPue}</select>

/* ============================================================
   TAB 3 — COMPENSATORIOS
   Días que la empresa le debe a cada persona por haber trabajado
   de más (feriado, domingo, inventario, horas extra…). Dos piezas:
     · el SALDO de cada uno = suma de sus movimientos (+ ganados,
       − tomados);
     · las SOLICITUDES que mandan los encargados desde Mi Sucursal.
       RRHH o el supervisor las aprueban (descuenta el saldo) o las
       rechazan, con la opción de SUGERIR otro día para compensar.
   Todo va agrupado por slug de sucursal para que cada sucursal baje
   solo lo suyo (misma seguridad blanda que Objetivos / Barrida).
   ============================================================ */
const fmtDias = n => { const v=Math.round((Number(n)||0)*100)/100; return (v%1===0? String(v) : String(v).replace('.',','))+' d'; };
const fmtHs   = n => { const v=Math.round((Number(n)||0)*100)/100; return (v%1===0? String(v) : String(v).replace('.',','))+' hs'; };
const fmtCant = (n,k) => k==='hs' ? fmtHs(n) : fmtDias(n);
// Los dos conceptos que se le deben a la gente. Se guardan en la MISMA ficha
// (`movs`), separados por la clave `k`: sin `k` = compensatorio (los que ya
// estaban cargados antes de separar horas extra).
const CONCEPTOS = {
  comp:{label:'Compensatorio', corto:'Compensatorio', unidad:'días', ic:'📆'},
  hs:  {label:'Horas extra',   corto:'Horas extra',   unidad:'horas', ic:'⏱'},
};
const MOTIVOS_HS = ['Apertura / cierre','Inventario / recuento','Cobertura de franco','Descarga de mercadería','Evento / promoción','Refuerzo de temporada','Otro'];

/* --- lectura --- */
// Dónde vive la ficha de una persona. La `sucursal` del legajo puede haber
// quedado vieja (p.ej. la gente que pasó a Diagonal 80), así que manda el slug
// donde ya hay ficha; si no hay, el del legajo.
function compSlugDe(legId, fallback){
  if(fallback && COMPS[fallback] && COMPS[fallback][legId]) return fallback;
  const hit = Object.keys(COMPS).find(sl=>COMPS[sl] && COMPS[sl][legId]);
  return hit || fallback || null;
}
function compPersona(slug, legId){ return ((COMPS[slug]||{})[legId]) || null; }
function movKind(m){ return m && m.k==='hs' ? 'hs' : 'comp'; }
function compMovs(slug, legId, kind){
  const c=compPersona(slug,legId);
  let l = Object.entries((c&&c.movs)||{}).map(([id,m])=>({id,...m}));
  if(kind) l = l.filter(m=>movKind(m)===kind);
  return l.sort((a,b)=>cmp(b.f||'',a.f||''));
}
const _suma = l => l.reduce((s,m)=>s+(Number(m.d)||0),0);
function compSaldo(slug, legId){ return _suma(compMovs(slug,legId,'comp')); }   // días
function hsSaldo(slug, legId){ return _suma(compMovs(slug,legId,'hs')); }       // horas
function saldoDe(slug, legId, kind){ return kind==='hs' ? hsSaldo(slug,legId) : compSaldo(slug,legId); }
function compGanados(slug, legId, kind){ return compMovs(slug,legId,kind||'comp').filter(m=>Number(m.d)>0).reduce((s,m)=>s+Number(m.d),0); }
function compUsados(slug, legId, kind){ return -compMovs(slug,legId,kind||'comp').filter(m=>Number(m.d)<0).reduce((s,m)=>s+Number(m.d),0); }

// solicitudes de todas las sucursales del alcance, la más nueva primero
const solKind = x => x && x.k==='hs' ? 'hs' : 'comp';
const solCant = x => Number(x && (x.cant!=null? x.cant : x.dias)) || 0;
const solModo = x => x && x.modo==='cobrar' ? 'cobrar' : 'tomar';
function solicitudes(){
  const out=[];
  Object.entries(SOLIC||{}).forEach(([slug,m])=>Object.entries(m||{}).forEach(([id,x])=>{ if(x) out.push({slug,id,...x}); }));
  return out.sort((a,b)=> cmp(b.en||'', a.en||''));
}
function compEnTramite(slug, legId, kind){
  return solicitudes().filter(x=>x.slug===slug && x.legajoId===legId && (x.estado||'pendiente')==='pendiente'
      && (!kind || solKind(x)===kind))
    .reduce((s,x)=>s+solCant(x),0);
}

/* --- valorizado: el valor de la hora lo carga RRHH ---
   `rrhh/config/valorHora` = {general, horasDia, porLegajo:{legajoId:valor}}.
   El importe de un pago se HORNEA en el movimiento (`vh` e `imp`), así el
   histórico no cambia cuando después se actualiza el valor. */
function valorHora(legId){
  const c=(CONFIG&&CONFIG.valorHora)||{};
  const pl=(c.porLegajo||{})[legId];
  const v = (pl!=null && pl!=='') ? Number(pl) : Number(c.general||0);
  return isFinite(v)? v : 0;
}
function horasPorDia(){ const v=Number(((CONFIG&&CONFIG.valorHora)||{}).horasDia); return v>0? v : 8; }
function hayValorHora(){ return valorHora('__x__')>0 || Object.keys(((CONFIG&&CONFIG.valorHora)||{}).porLegajo||{}).length>0; }
// cuánto sale pagar `cant` de `kind` a esa persona
function valorizar(legId, cant, kind){
  const vh=valorHora(legId); if(!vh) return 0;
  const horas = kind==='hs' ? cant : cant*horasPorDia();
  return horas*vh;
}
function valorizadoPersona(slug, legId){
  return valorizar(legId, Math.max(0,compSaldo(slug,legId)), 'comp')
       + valorizar(legId, Math.max(0,hsSaldo(slug,legId)), 'hs');
}

// personas (de los legajos visibles) con algo a favor o una solicitud abierta
function compConSaldo(){
  return legajosOrden().filter(l=>(l.estado||'activo')!=='baja')
    .map(l=>{ const sl=compSlugDe(l.id, l.sucursal);
      return {...l, cslug:sl, saldo:compSaldo(sl,l.id), hs:hsSaldo(sl,l.id),
              tram:compEnTramite(sl,l.id,'comp'), tramHs:compEnTramite(sl,l.id,'hs')}; })
    .filter(p=>p.saldo!==0 || p.hs!==0 || p.tram>0 || p.tramHs>0);
}
function compTotalDeuda(){ return compConSaldo().reduce((s,p)=>s+Math.max(0,p.saldo),0); }
function hsTotalDeuda(){ return compConSaldo().reduce((s,p)=>s+Math.max(0,p.hs),0); }
function valorizadoTotal(){ return compConSaldo().reduce((s,p)=>s+valorizadoPersona(p.cslug,p.id),0); }

// celda de la nómina (pestaña Legajos): compensatorio + horas extra
function compCelda(l){
  const sl=compSlugDe(l.id, l.sucursal);
  const d=compSaldo(sl,l.id), h=hsSaldo(sl,l.id);
  const tram=compEnTramite(sl,l.id);
  if(!d && !h && !tram) return '<span class="sub">—</span>';
  const partes=[];
  if(d) partes.push(`<b style="color:${d>0?'var(--bad)':'var(--muted)'}">${fmtDias(d)}</b>`);
  if(h) partes.push(`<b style="color:${h>0?'var(--warn)':'var(--muted)'}">${fmtHs(h)}</b>`);
  return (partes.join(' <span class="sub">·</span> ') || '<span class="sub">0</span>')
    + (tram? `<div class="sub">${fmtDias(tram)} en trámite</div>` : '');
}

// tipo de movimiento: alta (a favor) · uso (tomado) · pago (cobrado) · ajuste
function movTipo(m){ return m.t || (Number(m.d)<0 ? 'uso' : 'alta'); }
function movTipoTag(m){
  const t=movTipo(m);
  return t==='uso'   ? '<span class="tag rech">Tomado</span>'
       : t==='pago'  ? '<span class="tag vac">Cobrado</span>'
       : t==='ajuste'? '<span class="tag otro">Ajuste</span>'
       : '<span class="tag aprob">A favor</span>';
}
function movKindTag(m){
  const k=movKind(m);
  return `<span class="tag ${k==='hs'?'pt':'ft'}">${CONCEPTOS[k].corto}</span>`;
}
function movRango(m){
  if(!m.desde) return '';
  return fechaLabel(m.desde)+(m.hasta&&m.hasta!==m.desde? ' → '+fechaLabel(m.hasta):'');
}
function estadoCompTag(e){
  e = e||'pendiente';
  return e==='pendiente' ? '<span class="tag pend">Pendiente</span>'
       : e==='aprobada'  ? '<span class="tag aprob">Aprobada</span>'
       : '<span class="tag rech">Rechazada</span>';
}
// "1 d de compensatorio" / "3 hs extra a cobrar"
function solPideTxt(x){
  const k=solKind(x);
  return fmtCant(solCant(x),k)+' de '+CONCEPTOS[k].label.toLowerCase()
    + (solModo(x)==='cobrar' ? ' <b style="color:var(--exc)">a cobrar</b>' : '');
}

      <td><div class="person"><span class="avatar">${esc(iniciales(p.nombre))}</span>

        <button class="iconbtn" data-cmovs="${p.cslug||p.sucursal}|${p.id}" title="Ver movimientos">🕘</button>
      </div></td>

    salBody = `<div class="tblwrap"><table class="grid"><thead><tr>
      <th>Persona</th><th>Sucursal</th><th class="num">Compensatorio</th><th class="num">Horas extra</th><th class="num">En trámite</th><th class="num">Valorizado</th><th></th>
      </tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  const avisoVH = (CONFIG&&CONFIG.valorHora&&CONFIG.valorHora.general) ? '' :
    `<div class="banner warn">💲 Todavía no cargaste el <b>valor de la hora</b>: sin eso no se puede valorizar lo que se paga en plata. Cargalo con <b>Valor de la hora</b>.</div>`;

  return `<div class="sec-head"><div><h1>Compensatorios y horas</h1><div class="sub">Días de compensatorio y horas extra que la empresa le debe a cada persona: se compensan con tiempo o se cobran en plata.</div></div></div>

}

/* --- historial de usos y pagos: cuándo se tomó o se cobró cada cosa ---
   No se pierde aunque la solicitud se borre: vive en el movimiento. --- */
function usosLista(){
  const out=[];
  Object.entries(COMPS||{}).forEach(([slug,gente])=>Object.entries(gente||{}).forEach(([legId,pers])=>{
    Object.entries((pers&&pers.movs)||{}).forEach(([id,m])=>{
      const t=movTipo(m);
      if(m && (t==='uso'||t==='pago')) out.push({slug, legId, id, nombre:(LEGAJOS[legId]||{}).nombre || pers.nombre || '—', ...m});
    });
  }));
  return out.sort((a,b)=> cmp(b.f||'', a.f||''));
}
function histUsoHtml(){
  const usos = usosLista().filter(u=>!state.cSuc || u.slug===state.cSuc);
  const tomados = usos.filter(u=>movTipo(u)==='uso'), pagos = usos.filter(u=>movTipo(u)==='pago');
  const plata = pagos.reduce((s,u)=>s+(Number(u.imp)||0),0);
  if(!usos.length) return `<div class="card-h" style="margin:22px 0 8px">Historial de compensatorios y horas</div>
    <div class="hintline">Todavía no se tomó ni se cobró nada${state.cSuc?' en '+esc(sucLabel(state.cSuc)):''}. Cuando se apruebe una solicitud, queda registrado acá.</div>`;
  const filas = usos.map(u=>{
    const k=movKind(u), cant=Math.abs(Number(u.d)||0);
    return `<tr>
      <td><div class="person"><span class="avatar">${esc(iniciales(u.nombre))}</span>
        <div><div class="nm">${esc(u.nombre)}</div><div class="sub">${esc(sucLabel(u.slug))}</div></div></div></td>
      <td>${movKindTag(u)} ${movTipoTag(u)}</td>
      <td>${movRango(u) || fechaLabel(u.f)}</td>
      <td class="num">${fmtCant(cant,k)}</td>
      <td class="num">${u.imp? fmtM(u.imp) : '<span class="sub">—</span>'}${u.vh?`<div class="sub">${fmtM(u.vh)}/h</div>`:''}</td>
      <td class="sub">${esc(u.m||'')}</td>
      <td class="sub">${esc(u.por||'')}<div class="sub">${esc(String(u.en||'').replace('T',' ').slice(0,16))}</div></td>
    </tr>`;}).join('');
  return `<div class="card-h" style="margin:22px 0 8px">Historial de compensatorios y horas</div>
    <div class="card-hs">${tomados.length} tomado${tomados.length===1?'':'s'} · ${pagos.length} cobrado${pagos.length===1?'':'s'}${plata?' ('+fmtM(plata)+')':''}${state.cSuc?' · '+esc(sucLabel(state.cSuc)):''}. Queda registrado aunque después se borre la solicitud.</div>
    <div class="tblwrap"><table class="grid"><thead><tr>
      <th>Persona</th><th>Concepto</th><th>Día</th><th class="num">Cantidad</th><th class="num">Importe</th><th>Detalle</th><th>Cargó</th>
      </tr></thead><tbody>${filas}</tbody></table></div>`;
}

/* --- escribir un movimiento --- */
async function guardarMovComp(slug, legId, mov){
  const l = LEGAJOS[legId] || {};
  slug = compSlugDe(legId, slug || l.sucursal);
  const id = 'm'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  COMPS[slug] = COMPS[slug] || {};
  COMPS[slug][legId] = COMPS[slug][legId] || {nombre:l.nombre||'', puesto:l.puesto||'', movs:{}};
  COMPS[slug][legId].movs = COMPS[slug][legId].movs || {};
  COMPS[slug][legId].movs[id] = mov;
  if(HAS_DB){
    const base = ROOT+'/compensatorios/'+slug+'/'+legId;
    await fbPatch(base, {nombre:l.nombre||'', puesto:l.puesto||''});
    await fbPut(base+'/movs/'+id, mov);
  }
  return id;
}
async function borrarMovComp(slug, legId, movId){
  if(!confirm('¿Borrar este movimiento? El saldo se recalcula.')) return;
  try{
    if(HAS_DB) await fbDelete(ROOT+'/compensatorios/'+slug+'/'+legId+'/movs/'+movId);
    const c = compPersona(slug, legId); if(c && c.movs) delete c.movs[movId];
    render(); verMovsComp(slug, legId); toast('Movimiento borrado','ok');
  }catch(e){ toast('No se pudo borrar','err'); }
}

    </div>
    <div class="card-h" style="font-size:16px;margin-top:14px">Excepciones por persona</div>

    <div id="vhExc">${exc.length? exc.map(([id,v])=>`<div class="frow" data-exc="${esc(id)}" style="align-items:end">
        <div class="f"><label>${esc((LEGAJOS[id]||{}).nombre||id)}</label><input class="inp vh-v" data-id="${esc(id)}" inputmode="decimal" value="${esc(v)}"></div>
        <div class="f"><label>&nbsp;</label><button class="btn btn-outline" data-excdel="${esc(id)}">Quitar</button></div>
      </div>`).join('') : '<div class="hintline">Sin excepciones: todos usan el valor general.</div>'}</div>
    <div class="frow" style="align-items:end;margin-top:8px">
      <div class="f"><label>Agregar excepción</label><select class="sel" id="vhLeg"><option value="">— Elegí a la persona —</option>${legajoSelectOptions('')}</select></div>
      <div class="f"><label>Valor de la hora ($)</label><input class="inp" id="vhVal" inputmode="decimal"></div>
    </div>
    <div style="margin-top:6px"><button class="btn btn-outline btn-sm" id="vhAdd">+ Agregar excepción</button></div>`;
  openModal('Valor de la hora', body, `<button class="btn btn-outline" id="mCancel">Cancelar</button><button class="btn btn-primary" id="mSave">Guardar</button>`);
  $('mCancel').onclick=closeModal;
  const wire=()=>{ document.querySelectorAll('[data-excdel]').forEach(b=> b.onclick=()=>{ const w=b.closest('[data-exc]'); if(w) w.remove(); }); };
  wire();
  $('vhAdd').onclick=()=>{
    const id=$('vhLeg').value, v=num($('vhVal').value);
    if(!id){ toast('Elegí a la persona','err'); return; }
    if(!(v>0)){ toast('Cargá el valor','err'); return; }
    const cont=$('vhExc');
    if(cont.querySelector('.hintline')) cont.innerHTML='';
    if(cont.querySelector(`[data-exc="${id}"]`)){ toast('Ya tiene una excepción','err'); return; }
    cont.insertAdjacentHTML('beforeend', `<div class="frow" data-exc="${esc(id)}" style="align-items:end">
      <div class="f"><label>${esc((LEGAJOS[id]||{}).nombre||id)}</label><input class="inp vh-v" data-id="${esc(id)}" inputmode="decimal" value="${esc(v)}"></div>
      <div class="f"><label>&nbsp;</label><button class="btn btn-outline" data-excdel="${esc(id)}">Quitar</button></div></div>`);
    $('vhLeg').value=''; $('vhVal').value=''; wire();
  };
  $('mSave').onclick=async()=>{
    const porLegajo={};
    document.querySelectorAll('#vhExc .vh-v').forEach(i=>{ const v=num(i.value); if(v>0) porLegajo[i.dataset.id]=v; });
    const data={ general:num($('vhGen').value), horasDia:Number($('vhDia').value)||8, porLegajo,
                 actualizado:nowISO(), por:(SESSION.email||'') };
    try{
      if(HAS_DB) await fbPut(ROOT+'/config/valorHora', data);
      CONFIG.valorHora=data; closeModal(); render(); toast('Valor de la hora guardado','ok');
    }catch(e){ console.error(e); toast('No se pudo guardar','err'); }
  };
}

/* --- cargar un movimiento a mano ---
   Concepto (compensatorio en días / horas extra en horas) × movimiento
   (a favor / tomado / cobrado). El circuito normal descuenta al aprobar la
   solicitud del encargado, pero RRHH tiene que poder registrar lo que ya pasó. --- */
function formCompCarga(legajoPre, kindPre, tipoPre){
  const k0 = kindPre==='hs' ? 'hs' : 'comp';
  const t0 = ['uso','pago'].includes(tipoPre) ? tipoPre : 'alta';
  const body = `
    <div class="hintline" id="cHint"></div>
    <div class="frow one"><div class="f"><label>Persona *</label><select class="sel" id="cLeg"><option value="">— Elegí a la persona —</option>${legajoSelectOptions(legajoPre||'')}</select></div></div>
    <div class="frow">
      <div class="f"><label>Concepto</label><select class="sel" id="cKind">
        <option value="comp" ${k0==='comp'?'selected':''}>📆 Compensatorio (días)</option>
        <option value="hs" ${k0==='hs'?'selected':''}>⏱ Horas extra (horas)</option>
      </select></div>
      <div class="f"><label>Movimiento</label><select class="sel" id="cTipo">
        <option value="alta" ${t0==='alta'?'selected':''}>➕ A favor (trabajó de más)</option>
        <option value="uso" ${t0==='uso'?'selected':''}>➖ Compensado con tiempo</option>
        <option value="pago" ${t0==='pago'?'selected':''}>💲 Cobrado en plata</option>
      </select></div>
    </div>
    <div class="frow">
      <div class="f"><label id="cLblCant">Días *</label><input class="inp" id="cDias" type="number" min="0.5" step="0.5" value="1"></div>
      <div class="f"><label id="cLblF">Fecha en que se generó</label><input class="inp" id="cFecha" type="date" value="${hoyISO()}"></div>
    </div>
    <div class="frow" id="cHastaRow" style="display:none">
      <div class="f"><label>Hasta</label><input class="inp" id="cHasta" type="date" value="${hoyISO()}"></div>
      <div class="f"></div>
    </div>
    <div class="frow" id="cPagoRow" style="display:none">
      <div class="f"><label>Valor de la hora ($)</label><input class="inp" id="cVh" inputmode="decimal"></div>
      <div class="f"><label>Importe a pagar</label><input class="inp" id="cImp" readonly style="background:#f7f9fd;font-weight:700"></div>
    </div>
    <div class="frow one" id="cNovRow" style="display:none"><div class="f"><label style="cursor:pointer">
      <input type="checkbox" id="cNov" checked style="width:auto;margin-right:6px">Pasarlo a <b>Novedades de nómina</b> de <span id="cNovMes"></span></label></div></div>
    <div class="frow">
      <div class="f" id="cMotivoBox"><label>Motivo</label><select class="sel" id="cMotivo"></select></div>
      <div class="f"><label id="cLblDet">Detalle</label><input class="inp" id="cDet" placeholder="Ej: feriado 17/08, turno completo"></div>
    </div>
    <div id="cSaldoBox"></div>`;
  openModal('Cargar compensatorio u horas', body, `<button class="btn btn-outline" id="mCancel">Cancelar</button><button class="btn btn-primary" id="mSave">Cargar</button>`);
  $('mCancel').onclick=closeModal;

  const kind = ()=> $('cKind').value==='hs' ? 'hs' : 'comp';
  const tipo = ()=> $('cTipo').value;
  const sync = ()=>{
    const k=kind(), t=tipo(), esDias=k==='comp';
    $('cHint').innerHTML = t==='alta'
      ? (esDias ? 'Cargá los <b>días que quedan a favor</b> de la persona por haber trabajado de más. Después el encargado los pide desde su sucursal.'
                : 'Cargá las <b>horas extra</b> que hizo. Se pueden compensar con tiempo o cobrar en plata.')
      : t==='uso'
      ? (esDias ? 'Registrá un compensatorio que la persona <b>ya se tomó</b>: se descuenta del saldo y queda en el historial con la fecha del día usado.'
                : 'Registrá las horas que la persona <b>ya se tomó</b> a cuenta de sus horas extra.')
      : 'Registrá que la persona <b>lo cobró en plata</b>: se descuenta del saldo y queda el importe en el historial.';
    $('cLblCant').textContent = (esDias?'Días':'Horas') + (t==='alta'?' a favor':t==='uso'?' compensados':' a cobrar') + ' *';
    $('cLblF').textContent = t==='alta' ? 'Fecha en que se generó' : t==='uso' ? (esDias?'Fecha en que se usó':'Día en que se compensó') : 'Fecha del pago';
    $('cHastaRow').style.display = (t==='uso' && esDias) ? '' : 'none';
    $('cPagoRow').style.display = t==='pago' ? '' : 'none';
    $('cNovRow').style.display  = t==='pago' ? '' : 'none';
    $('cMotivoBox').style.display = t==='alta' ? '' : 'none';
    $('cLblDet').textContent = t==='alta' ? 'Detalle' : 'Observaciones';
    $('cDet').placeholder = t==='alta' ? (esDias?'Ej: feriado 17/08, turno completo':'Ej: descarga de camión, 2 hs después del cierre') : 'Ej: lo cobró con la quincena';
    $('mSave').textContent = t==='alta' ? 'Cargar' : t==='uso' ? 'Registrar lo compensado' : 'Registrar el pago';
    const mots = esDias ? MOTIVOS_COMP : MOTIVOS_HS;
    $('cMotivo').innerHTML = selOptions(mots, mots[0]);
    $('cNovMes').textContent = periodoLabel(($('cFecha').value||hoyISO()).slice(0,7));
    if($('cHasta').value < $('cFecha').value) $('cHasta').value=$('cFecha').value;
    pintarPago(); pintarSaldo();
  };
  const pintarPago = ()=>{
    if(tipo()!=='pago') return;
    const legId=$('cLeg').value;
    if(legId && !$('cVh').value) $('cVh').value = valorHora(legId) || '';
    const vh=num($('cVh').value), cant=Number($('cDias').value)||0;
    const horas = kind()==='hs' ? cant : cant*horasPorDia();
    $('cImp').value = vh? fmtM(horas*vh) : '—';
  };
  const pintarSaldo = ()=>{
    const legId=$('cLeg').value, box=$('cSaldoBox');
    if(!legId){ box.innerHTML=''; return; }
    const l=LEGAJOS[legId]||{}, sl=compSlugDe(legId, l.sucursal), k=kind();
    const saldo=saldoDe(sl, legId, k), cant=Number($('cDias').value)||0;
    const fin = tipo()==='alta' ? saldo+cant : saldo-cant;
    box.innerHTML = `<div class="hintline">${CONCEPTOS[k].label} de <b>${esc(l.nombre||'')}</b>: <b>${fmtCant(saldo,k)}</b> → queda en <b style="color:${fin<0?'var(--bad)':'var(--ok)'}">${fmtCant(fin,k)}</b>.`
      + (fin<0? ' ⚠️ Queda en negativo.' : '') + `</div>`;
  };
  const syncDias = ()=>{
    if(tipo()==='uso' && kind()==='comp'){
      const d=diasEntre($('cFecha').value, $('cHasta').value);
      if(d) $('cDias').value=d;
    }
    $('cNovMes').textContent = periodoLabel(($('cFecha').value||hoyISO()).slice(0,7));
    pintarPago(); pintarSaldo();
  };
  $('cKind').onchange=sync; $('cTipo').onchange=sync;
  $('cLeg').onchange=()=>{ $('cVh').value=''; pintarPago(); pintarSaldo(); };
  $('cDias').oninput=()=>{ pintarPago(); pintarSaldo(); };
  $('cVh').oninput=pintarPago;
  $('cFecha').onchange=()=>{ if($('cHasta').value<$('cFecha').value) $('cHasta').value=$('cFecha').value; syncDias(); };
  $('cHasta').onchange=syncDias;
  sync();

  $('mSave').onclick=async()=>{
    const legId=$('cLeg').value;
    if(!legId){ toast('Elegí a la persona','err'); return; }
    const cant=Number($('cDias').value);
    if(!(cant>0)){ toast('La cantidad tiene que ser mayor a cero','err'); return; }
    const l=LEGAJOS[legId], det=$('cDet').value.trim(), k=kind(), t=tipo();
    const slugDest = compSlugDe(legId, l.sucursal);
    const desde=$('cFecha').value||hoyISO(), hasta=$('cHasta').value||desde;
    if(t==='uso' && k==='comp' && hasta<desde){ toast('La fecha "hasta" es anterior a "desde"','err'); return; }
    const saldo=saldoDe(slugDest, legId, k);
    if(t!=='alta' && cant>saldo && !confirm('El saldo de '+(l.nombre||'')+' es '+fmtCant(saldo,k)+' y estás descontando '+fmtCant(cant,k)+'. Va a quedar en negativo. ¿Registrar igual?')) return;
    const rango = fechaLabel(desde)+(t==='uso'&&k==='comp'&&hasta!==desde? ' → '+fechaLabel(hasta):'');
    const motivo = t==='alta' ? $('cMotivo').value : '';
    let mov;
    if(t==='alta'){
      mov={ d:cant, k, f:desde, t:'alta', m:motivo+(det? ' — '+det : ''), por:(SESSION.email||''), en:nowISO() };
    }else if(t==='uso'){
      mov={ d:-cant, k, f:desde, t:'uso', desde, hasta:(k==='comp'?hasta:desde),
            m:(k==='comp'?'Compensatorio tomado':'Horas compensadas')+' ('+rango+')'+(det? ' — '+det : ''),
            por:(SESSION.email||''), en:nowISO() };
    }else{
      const vh=num($('cVh').value);
      if(!(vh>0)){ toast('Cargá el valor de la hora para calcular el importe','err'); return; }
      const horas = k==='hs' ? cant : cant*horasPorDia();
      mov={ d:-cant, k, f:desde, t:'pago', vh, imp:horas*vh, periodo:desde.slice(0,7),
            m:(k==='comp'?'Compensatorio cobrado':'Horas extra cobradas')+' ('+fmtCant(cant,k)+' × '+fmtM(vh)+'/h)'+(det? ' — '+det : ''),
            por:(SESSION.email||''), en:nowISO() };
    }
    try{
      await guardarMovComp(slugDest, legId, mov);
      if(t==='pago' && $('cNov').checked) await novedadDePago(legId, mov).catch(()=>{});
      closeModal(); render();
      toast(t==='alta'?'Cargado':t==='uso'?'Compensación registrada':'Pago registrado','ok');
      const saldoFin=saldoDe(slugDest, legId, k);
      avisarSucursal(slugDest,
        t==='alta' ? (k==='hs'?'⏱ Horas extra cargadas: ':'🕘 Compensatorio cargado: ')+(l.nombre||'')+' suma '+fmtCant(cant,k)+' ('+motivo+'). Saldo: '+fmtCant(saldoFin,k)+'.'
        : t==='uso' ? '🕘 '+(k==='hs'?'Horas compensadas':'Compensatorio tomado')+': '+(l.nombre||'')+' — '+rango+' ('+fmtCant(cant,k)+'). Saldo restante: '+fmtCant(saldoFin,k)+'.'
        : '💲 '+(k==='hs'?'Horas extra cobradas':'Compensatorio cobrado')+': '+(l.nombre||'')+' — '+fmtCant(cant,k)+'. Saldo restante: '+fmtCant(saldoFin,k)+'.');
    }catch(e){ console.error(e); toast('No se pudo guardar','err'); }
  };
}

// pasa un pago a las Novedades de nómina del período (para el estudio contable)
async function novedadDePago(legId, mov){
  const per = mov.periodo || String(mov.f||hoyISO()).slice(0,7);

  const data = { legajoId:legId, tipo:'comp_pago', valor:String(Math.round(mov.imp||0)),

/* --- Importar el Excel de compensatorios pendientes -----------------------
   Formato del Excel de Juli (Compensatorios.xlsx): UNA hoja con bloques por
   sucursal. La fila de encabezado es «Legajo | <1ª sucursal> | Total»; abajo
   una fila por persona (nro de legajo · nombre · días pendientes) y una fila
   de subtotal; el nombre de la sucursal siguiente viene en la columna del
   nombre con el legajo vacío.
   El cruce es por NRO DE LEGAJO (`legajo_nro`), que es exacto — los nombres
   del Excel vienen recortados ("Casao Kevin" vs "Casao Kevin Armando").
   El Excel trae el SALDO pendiente, no los movimientos: se publica como un
   movimiento de AJUSTE por la diferencia, así queda el rastro de quién lo
   cargó y cuándo, y no se pisa lo que ya se hubiera tomado en el portal.
   ------------------------------------------------------------------------ */
const COMP_ALIAS_SUC = {'diag 80':'diagonal','diagonal':'diagonal','adidas':'adidas','aurelius':'aurelius-10','ecommerce':'ecommerce','e commerce':'ecommerce'};
function compSlugDivisor(txt){ const n=ruNormDiv(txt); return COMP_ALIAS_SUC[n] || RU_DIVISOR[n] || null; }
let COMP_IMP = null;   // plan previsualizado

function parseCompExcel(wb){
  const ws = wb.Sheets[wb.SheetNames[0]];
  const M = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:''});
  // fila de encabezado: la que tiene la celda "Legajo"
  let hr=-1, cL=-1, cT=-1;
  for(let i=0;i<Math.min(M.length,30) && hr<0;i++){
    (M[i]||[]).forEach((v,j)=>{ if(hr<0 && /^legajo/i.test(ruClean(v))){ hr=i; cL=j; } });
  }
  if(hr<0) throw new Error('No encontré la columna «Legajo». ¿Es el Excel de compensatorios?');
  (M[hr]||[]).forEach((v,j)=>{ if(/^total/i.test(ruClean(v))) cT=j; });
  const cN = cL+1;
  if(cT<0) cT = cL+2;
  const filas=[], sinSuc=new Set();
  let sucTxt = ruClean(M[hr][cN]) || '';        // la 1ª sucursal viene en el encabezado
  let slug = compSlugDivisor(sucTxt);
  if(!slug && sucTxt) sinSuc.add(sucTxt);
  for(let i=hr+1;i<M.length;i++){
    const row = M[i]||[];
    const nro = ruClean(row[cL]).replace(/\.0+$/,'');
    const nom = ruClean(row[cN]);
    if(nro && /^\d+$/.test(nro)){
      filas.push({sucTxt, slug, nro, nombre:ruCap(nom), dias:Number(String(row[cT]).replace(',','.'))||0});
    }else if(nom && !/^[\d.,]+$/.test(nom)){    // texto sin legajo = cabecera del bloque siguiente
      sucTxt = nom; slug = compSlugDivisor(sucTxt);
      if(!slug) sinSuc.add(sucTxt);
    }
    // fila con número y sin legajo = subtotal del bloque: se ignora
  }
  return {filas, sinSuc:[...sinSuc]};
}

// arma el plan: qué se ajusta, quién no matchea y quién cambió de sucursal
function planImportComp(parsed, fecha){
  const porNro={};
  Object.entries(LEGAJOS).forEach(([id,l])=>{
    const n=ruClean(l.legajo_nro); if(n) (porNro[n]=porNro[n]||[]).push({id,...l});
  });
  const ajustes=[], iguales=[], sinLegajo=[], mudanzas=[], sucFix=[];
  parsed.filas.forEach(f=>{
    const cand = porNro[f.nro]||[];
    if(!cand.length || !f.slug){ sinLegajo.push(f); return; }
    const l = cand[0];
    // el Excel es la foto actual de dónde trabaja cada uno: los legajos vienen del
    // Registro Único y su `sucursal` se queda vieja con cada movimiento de gente
    if(l.sucursal !== f.slug) sucFix.push({legajoId:l.id, nombre:l.nombre, de:l.sucursal||null, a:f.slug});
    const actual = compSlugDe(l.id, l.sucursal);
    const destino = f.slug;
    const saldo = actual? compSaldo(actual, l.id) : 0;
    const delta = f.dias - saldo;
    const mueve = actual && actual!==destino && COMPS[actual] && COMPS[actual][l.id];
    if(mueve) mudanzas.push({...f, legajoId:l.id, nombre:l.nombre, de:actual, a:destino});
    if(!delta && !mueve){ iguales.push({...f, legajoId:l.id, nombre:l.nombre}); return; }
    ajustes.push({...f, legajoId:l.id, nombre:l.nombre, puesto:l.puesto||'', origen:actual, destino, saldo, delta, mueve});
  });
  return {ajustes, iguales, sinLegajo, mudanzas, sucFix, sinSuc:parsed.sinSuc, fecha};
}

function abrirImportComp(){
  openModal('Importar compensatorios',
    `<div class="hintline">Subí el Excel con los <b>compensatorios pendientes</b> de toda la cadena (bloques por sucursal, con el <b>nro de legajo</b>, el nombre y los días). El portal lo cruza por nro de legajo y deja el saldo de cada persona igual al del Excel.</div>
     <div class="frow">
       <div class="f"><label>Archivo (.xlsx)</label><input class="inp" type="file" id="ciFile" accept=".xlsx,.xls"></div>
       <div class="f"><label>Fecha del ajuste</label><input class="inp" id="ciFecha" type="date" value="${hoyISO()}"></div>
     </div>
     <div id="ciPrev"></div>`,
    `<button class="btn btn-outline" id="mCancel">Cancelar</button><button class="btn btn-primary" id="mSave" disabled>Publicar</button>`);
  $('mCancel').onclick=closeModal;
  $('ciFile').onchange=e=>{ const f=e.target.files[0]; if(f) previewImportComp(f); };
  $('ciFecha').onchange=()=>{ const f=$('ciFile').files[0]; if(f) previewImportComp(f); };
}

async function previewImportComp(file){
  $('ciPrev').innerHTML='<div class="state"><div class="spinner"></div>Leyendo el Excel…</div>';
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(new Uint8Array(buf), {type:'array'});
    const parsed = parseCompExcel(wb);
    COMP_IMP = planImportComp(parsed, $('ciFecha').value||hoyISO());
  }catch(err){
    console.error(err);
    $('ciPrev').innerHTML='<div class="banner warn" style="margin-top:12px">No se pudo leer el archivo: '+esc(err.message||err)+'</div>';
    $('mSave').disabled=true; return;
  }
  const P=COMP_IMP;
  const conDias = P.ajustes.filter(a=>a.dias>0).length;
  const totalDias = P.ajustes.reduce((s,a)=>s+a.dias,0) + P.iguales.reduce((s,a)=>s+a.dias,0);

async function publicarImportComp(){
  const P=COMP_IMP; if(!P || !(P.ajustes.length || P.sucFix.length)) return;
  const fixSuc = !!($('ciFixSuc') && $('ciFixSuc').checked) && P.sucFix.length;
  if(!confirm('Se actualiza el saldo de '+P.ajustes.length+' persona(s) con los días del Excel'
      + (fixSuc? ', y la sucursal del legajo de '+P.sucFix.length+'.' : '.')+'\n\n¿Publicar?')) return;
  const btn=$('mSave'); btn.disabled=true; btn.textContent='Publicando…';
  const stamp = Date.now().toString(36);
  const patch = {};
  P.ajustes.forEach((a,i)=>{
    // la ficha se muda de sucursal: se reescribe entera en el destino y se borra la vieja
    if(a.mueve){
      const vieja = COMPS[a.origen][a.legajoId] || {};
      patch[a.origen+'/'+a.legajoId] = null;
      patch[a.destino+'/'+a.legajoId] = {nombre:a.nombre, puesto:a.puesto, movs:{...(vieja.movs||{})}};
    }else{
      patch[a.destino+'/'+a.legajoId+'/nombre'] = a.nombre;
      patch[a.destino+'/'+a.legajoId+'/puesto'] = a.puesto;
    }
    if(a.delta){
      const mid = 'imp'+stamp+i.toString(36);
      patch[a.destino+'/'+a.legajoId+'/movs/'+mid] = {
        d:a.delta, f:P.fecha, t:'ajuste',
        m:(a.saldo? 'Ajuste al saldo del Excel de compensatorios ('+fmtDias(a.saldo)+' → '+fmtDias(a.dias)+')'
                  : 'Saldo pendiente según el Excel de compensatorios'),
        por:(SESSION.email||''), en:nowISO(), imp:P.fecha };
    }
  });
  try{
    if(HAS_DB && Object.keys(patch).length) await fbPatch(ROOT+'/compensatorios', patch);
    if(fixSuc){
      const legPatch={};
      P.sucFix.forEach(x=>{ legPatch[x.legajoId+'/sucursal']=x.a; legPatch[x.legajoId+'/actualizado']=nowISO(); });
      if(HAS_DB) await fbPatch(ROOT+'/legajos', legPatch);
      P.sucFix.forEach(x=>{ if(LEGAJOS[x.legajoId]){ LEGAJOS[x.legajoId].sucursal=x.a; LEGAJOS[x.legajoId].actualizado=nowISO(); } });
    }
    // reflejar en memoria
    P.ajustes.forEach((a,i)=>{
      if(a.mueve){
        const vieja = COMPS[a.origen][a.legajoId] || {};
        delete COMPS[a.origen][a.legajoId];
        COMPS[a.destino]=COMPS[a.destino]||{};
        COMPS[a.destino][a.legajoId]={nombre:a.nombre, puesto:a.puesto, movs:{...(vieja.movs||{})}};
      }else{
        COMPS[a.destino]=COMPS[a.destino]||{};
        COMPS[a.destino][a.legajoId]=COMPS[a.destino][a.legajoId]||{nombre:a.nombre, puesto:a.puesto, movs:{}};
        COMPS[a.destino][a.legajoId].nombre=a.nombre; COMPS[a.destino][a.legajoId].puesto=a.puesto;
      }
      if(a.delta){
        const c=COMPS[a.destino][a.legajoId]; c.movs=c.movs||{};
        c.movs['imp'+stamp+i.toString(36)]={d:a.delta, f:P.fecha, t:'ajuste',
          m:(a.saldo? 'Ajuste al saldo del Excel de compensatorios ('+fmtDias(a.saldo)+' → '+fmtDias(a.dias)+')'
                    : 'Saldo pendiente según el Excel de compensatorios'),
          por:(SESSION.email||''), en:nowISO(), imp:P.fecha};
      }
    });
    COMP_IMP=null; closeModal(); render();
    toast('Compensatorios importados'+(fixSuc?' · '+P.sucFix.length+' legajos con la sucursal corregida':''),'ok');
  }catch(e){
    console.error(e); btn.disabled=false; btn.textContent='Publicar';
    toast('No se pudo publicar: '+(e.message||e),'err');
  }
}

/* --- aviso por la Bandeja del Portal (mensajes-mateu/directos) ---
   Best-effort: si falla, la respuesta ya quedó guardada igual. --- */
const MENSAJES_DB_URL = 'https://mensajes-mateu-default-rtdb.firebaseio.com';
function mailKey(e){ return (e||'').toLowerCase().trim().replace(/\./g,','); }
function convKey(a,b){ return [mailKey(a),mailKey(b)].sort().join('__'); }
let _usuariosPortal = null;
function usuariosPortal(){ if(!_usuariosPortal) _usuariosPortal = fbGet('usuarios').catch(()=>null); return _usuariosPortal; }
async function mailsDeSlug(slug){
  const us = await usuariosPortal(); const out=[];
  Object.values(us||{}).forEach(u=>{ if(u && u.email && ((u.rol==='sucursal'&&u.sucursal===slug)||(u.rol==='outlet'&&u.outlet_id===slug))) out.push(u.email); });
  return out;
}
async function enviarDirectos(destinos, texto){
  const de=(SESSION&&SESSION.email)||''; if(!de) return;
  const ts=Date.now();
  const unicos=[...new Set(destinos.map(x=>(x||'').toLowerCase().trim()).filter(x=>x && x!==de.toLowerCase()))];
  await Promise.all(unicos.map(a=>fetch(MENSAJES_DB_URL+'/directos/'+convKey(de,a)+'.json',
    {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({de,texto,ts})}).catch(()=>null)));
}
async function avisarSucursal(slug, texto, extra){
  try{
    const mails = await mailsDeSlug(slug);
    await enviarDirectos([...mails, ...(extra?[extra]:[])], texto);
  }catch(e){ /* el aviso es best-effort */ }
}

/* ============================================================
   TAB 4 — CALENDARIO DE NOVEDADES
   El Excel que hoy mandan los encargados mes a mes ("Calendario
   08-2026.xls"): una grilla LUNES→DOMINGO con texto libre por día
   (ausencias, horas extra, vacaciones, compensatorios, feriados,
   reincorporaciones). Acá vive el mismo formato, en grande, con la
   sucursal y el mes en el pie igual que el Excel. Lo carga el
   encargado desde Mi Sucursal y RRHH lo ve/edita/exporta acá.
   ============================================================ */
const CAL_DOW = ['LUNES','MARTES','MIÉRCOLES','JUEVES','VIERNES','SÁBADO','DOMINGO'];
function calMesLabel(p){ return periodoLabel(p); }
function calShift(p, n){
  const [y,m]=p.split('-').map(Number);
  const d=new Date(y, m-1+n, 1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
// celdas de la grilla: los huecos del principio y del final quedan vacíos
function calCeldas(periodo){
  const [y,m]=periodo.split('-').map(Number);
  const primero=new Date(y,m-1,1), dias=new Date(y,m,0).getDate();
  const off=(primero.getDay()+6)%7;             // lunes = 0
  const out=[];
  for(let i=0;i<off;i++) out.push(null);
  for(let d=1; d<=dias; d++) out.push(d);
  while(out.length%7) out.push(null);
  return out;
}
/* --- semanas (lunes a domingo) --- */
const calZ = n => String(n).padStart(2,'0');
const calISO = d => d.getFullYear()+'-'+calZ(d.getMonth()+1)+'-'+calZ(d.getDate());
function calLunesDe(f){ const x=new Date(f); x.setHours(0,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
function calSemActual(){ return calISO(calLunesDe(new Date())); }
function calSemDias(sem){ const p=sem.split('-').map(Number); const o=[];
  for(let i=0;i<7;i++) o.push(calISO(new Date(p[0],p[1]-1,p[2]+i))); return o; }
function calSemLbl(sem){ const d=calSemDias(sem); const c=x=>x.slice(8,10)+'/'+x.slice(5,7); return c(d[0])+' al '+c(d[6]); }
// sucursales que tienen que cargar novedades (las de salón; no depósito/admin/externos)
function calSucsOperativas(){ return sucsVisibles().filter(x=>!['administracion','externos','deposito'].includes(x)); }
function calConfSem(slug, sem){ return ((CALSEM[slug]||{})[sem]) || null; }
// días con texto de esa semana (los días viven en el nodo del mes)
function calDiasSemana(slug, sem){
  return calSemDias(sem).filter(iso=>{
    const t=((calDatos(slug, iso.slice(0,7)).dias)||{})[String(Number(iso.slice(8,10)))];
    return String(t||'').trim();
  }).length;
}
function calDatos(slug, periodo){ return ((CALEND[slug]||{})[periodo]) || {}; }
function calTexto(slug, periodo, dia){ return ((calDatos(slug,periodo).dias)||{})[String(dia)] || ''; }
function calCargado(slug, periodo){
  const d=(calDatos(slug,periodo).dias)||{};
  return Object.values(d).filter(t=>String(t).trim()).length;
}
function calFeriado(periodo, dia){
  if(!FERIADOS) return '';
  return FERIADOS[periodo+'-'+String(dia).padStart(2,'0')] || '';
}

// La grilla, compartida por la pestaña y la impresión. `edit` = celdas editables.
function calGridHtml(slug, periodo, edit){
  const hoy=hoyISO();
  let html='<div class="calwrap"><div class="calgrid" id="calGrid">'
    + CAL_DOW.map(d=>`<div class="ch">${d}</div>`).join('');
  calCeldas(periodo).forEach((d,i)=>{
    if(d===null){ html+='<div class="cald off"></div>'; return; }
    const iso=periodo+'-'+String(d).padStart(2,'0');
    const fer=calFeriado(periodo,d);
    const txt=calTexto(slug,periodo,d);
    const fin=(i%7)>=5;
    html+=`<div class="cald${fin?' fin':''}${iso===hoy?' hoy':''}">`
      + `<div style="display:flex;align-items:baseline;gap:6px;flex-wrap:wrap"><span class="n">${d}</span>`
      + (fer?`<span class="fer" title="${esc(fer)}">${esc(fer)}</span>`:'') + `</div>`
      + (edit
          ? `<textarea data-cd="${d}" placeholder="—" spellcheck="false">${esc(txt)}</textarea>`
          : `<div class="ro">${esc(txt)}</div>`)
      + `</div>`;
  });
  return html+'</div></div>';
}

    </div>

    <div style="flex:1"></div>

        <button type="button" data-sc="todas">⇩ Todas las sucursales <span>una hoja por sucursal + resumen del cierre semanal</span></button>

  const pct=ops.length?Math.round(confOk.length*100/ops.length):0;
  const resumen=`<div class="calsem ${sinConf.length?'':'ok'}">
    <div class="calsem-top">
      <div><div class="lbl">Cierre semanal</div><div class="tit">Semana del ${esc(calSemLbl(sem))}</div></div>
      <div class="calsem-num"><b>${confOk.length}</b><span>de ${ops.length} sucursales confirmaron</span></div>
    </div>
    <div class="calsem-bar"><i style="width:${pct}%"></i></div>
    ${sinConf.length
      ? grupo('bad','Sin cargar nada',sinNada)+grupo('mid','Cargaron, falta confirmar',cargoSinConf)+grupo('ok','Confirmada',confOk)

    <div class="calsem-foot">
      <span>${esc(calMesLabel(per))}: <b>${cargadas.length}</b> de ${vis.length} sucursales con algo cargado.</span>

  return `<div class="sec-head"><div><h1>Calendario de novedades</h1>
