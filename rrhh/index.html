<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recursos Humanos · Mateu Sports</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B1527;--navy-mid:#1a2f55;--navy-soft:#13203a;
  --red:#CC0000;--red-soft:#ff3b3b;
  --white:#fff;--off:#f5f7fc;--muted:#6B7A99;--muted-light:#b0bcd4;
  --card:#fff;--border:#dce3f0;
  --ok:#16a34a;--warn:#d97706;--bad:#dc2626;--exc:#7c3aed;--info:#2563eb;
  --font-d:'Bebas Neue',sans-serif;--font-c:'Barlow Condensed',sans-serif;--font-b:'Barlow',sans-serif;
  --shadow:0 1px 4px rgba(11,21,39,.08);--shadow-md:0 8px 30px rgba(11,21,39,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--off);color:var(--navy);font-family:var(--font-b);min-height:100vh}
img,svg{max-width:100%}

/* ===== HEADER ===== */
.top{background:var(--navy);padding:12px 22px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:3px solid var(--red);position:sticky;top:0;z-index:40;flex-wrap:wrap;gap:10px}
.top a.logo{display:flex;align-items:center;gap:11px;text-decoration:none;min-width:0}
.top img{height:32px;filter:brightness(0) invert(1)}
.top .tt{font-family:var(--font-d);font-size:19px;letter-spacing:1.5px;color:#fff;line-height:1}
.top .ts{font-family:var(--font-c);font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--muted-light)}
.top-right{display:flex;align-items:center;gap:12px;margin-left:auto}
.who{text-align:right;line-height:1.1}
.who .n{font-family:var(--font-c);font-size:13px;font-weight:600;color:#fff;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .r{font-family:var(--font-c);font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--red-soft)}
.salir{background:transparent;border:1px solid rgba(255,255,255,.25);border-radius:6px;color:rgba(255,255,255,.7);
  font-family:var(--font-c);font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:7px 13px;cursor:pointer}
.salir:hover{color:#fff;border-color:#fff}

/* ===== NAV TABS ===== */
.tabs{background:#fff;border-bottom:1px solid var(--border);padding:0 22px;display:flex;gap:4px;overflow-x:auto;position:sticky;top:57px;z-index:30}
.tab{padding:13px 16px;border:0;background:none;cursor:pointer;font-family:var(--font-c);font-size:14px;font-weight:600;
  letter-spacing:.5px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--navy);border-bottom-color:var(--red)}
.tab:hover{color:var(--navy)}
.tab:focus-visible{outline:2px solid var(--red);outline-offset:-2px}
.tab .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:10px;background:#e6ebf5;
  color:var(--navy-mid);font-family:var(--font-b);font-size:11px;font-weight:700;line-height:18px;text-align:center}
.tab.on .badge{background:var(--red);color:#fff}

main{max-width:1200px;margin:0 auto;padding:22px 22px 90px}

.banner{border-radius:9px;padding:10px 14px;font-size:13px;margin-bottom:16px}
.banner.warn{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412}
.banner.info{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af}
.banner code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:4px;font-size:12px}

/* ===== CONTROLES ===== */
.sel,.inp{padding:9px 11px;border:1px solid var(--border);border-radius:7px;font-size:14px;color:var(--navy);background:#fff;font-family:var(--font-b);width:100%}
.sel:focus,.inp:focus{outline:none;border-color:var(--navy-mid)}
.btn{border:none;border-radius:8px;padding:10px 16px;font-family:var(--font-c);font-size:13px;font-weight:700;
  letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:7px}
.btn-primary{background:var(--red);color:#fff}.btn-primary:hover{background:#a00000}
.btn-navy{background:var(--navy);color:#fff}.btn-navy:hover{background:var(--navy-mid)}
.btn-outline{background:#fff;border:1.5px solid var(--border);color:var(--navy)}.btn-outline:hover{border-color:var(--navy-mid)}
.btn-sm{padding:6px 11px;font-size:11px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.sel:focus-visible,.inp:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* ===== TOOLBAR ===== */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar .grow{flex:1;min-width:180px}
.toolbar .field{display:flex;flex-direction:column;gap:3px}
.toolbar .field label{font-family:var(--font-c);font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.toolbar .field .sel,.toolbar .field .inp{min-width:150px;width:auto}

/* ===== SEC HEAD ===== */
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sec-head h1{font-family:var(--font-d);font-size:30px;letter-spacing:1px;line-height:1}
.sec-head .sub{font-family:var(--font-c);font-size:13px;font-weight:500;color:var(--muted);margin-top:2px}

/* ===== CARDS ===== */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.card-h{font-family:var(--font-d);font-size:20px;letter-spacing:.5px;margin-bottom:2px}
.card-hs{font-family:var(--font-c);font-size:12px;color:var(--muted);margin-bottom:14px}

/* ===== KPIs ===== */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:11px;padding:14px 16px;box-shadow:var(--shadow);border-left:4px solid var(--navy-mid)}
.kpi.ok{border-left-color:var(--ok)}.kpi.warn{border-left-color:var(--warn)}.kpi.bad{border-left-color:var(--bad)}.kpi.info{border-left-color:var(--info)}
.kpi .k{font-family:var(--font-c);font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--font-d);font-size:32px;letter-spacing:.5px;margin-top:4px;line-height:1}
.kpi .v small{font-size:14px;color:var(--muted);font-family:var(--font-c)}
.kpi .s{font-family:var(--font-c);font-size:11.5px;color:var(--muted);margin-top:3px}

/* ===== TABLA ===== */
.tblwrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:#fff;box-shadow:var(--shadow)}
table.grid{border-collapse:collapse;width:100%;font-size:13.5px;min-width:640px}
table.grid th{background:var(--navy);color:#fff;font-family:var(--font-c);font-weight:600;letter-spacing:.5px;
  text-align:left;padding:10px 12px;position:sticky;top:0;white-space:nowrap;font-size:12px;text-transform:uppercase}
table.grid td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
table.grid tbody tr:hover{background:#f7f9fd}
table.grid tbody tr.clk{cursor:pointer}
table.grid td.num,table.grid th.num{text-align:right;font-variant-numeric:tabular-nums}
table.grid .nm{font-weight:600}
table.grid .sub{font-family:var(--font-c);font-size:12px;color:var(--muted)}

/* ===== CHIPS / TAGS ===== */
.tag{display:inline-block;font-family:var(--font-c);font-size:11px;font-weight:600;letter-spacing:.5px;
  padding:2px 8px;border-radius:20px;white-space:nowrap}
.tag.ft{background:#e8f0ff;color:#1e40af}.tag.pt{background:#fef3e2;color:#9a3412}
.tag.activo{background:#e7f6ec;color:#166534}.tag.baja{background:#fdecec;color:#991b1b}
.tag.g-Ventas{background:#fdecec;color:#991b1b}.tag.g-Caja{background:#e8eefc;color:#1e3a8a}
.tag.g-Jefatura{background:#eef1f7;color:#334155}.tag.g-Refuerzos{background:#f1f5f9;color:#475569}
.tag.pend{background:#fef3e2;color:#9a3412}.tag.aprob{background:#e7f6ec;color:#166534}.tag.rech{background:#fdecec;color:#991b1b}
.tag.vac{background:#e0f2fe;color:#075985}.tag.enf{background:#fef9c3;color:#854d0e}.tag.lic{background:#ede9fe;color:#5b21b6}
.tag.falta{background:#fdecec;color:#991b1b}.tag.otro{background:#f1f5f9;color:#475569}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;display:inline-flex;align-items:center;
  justify-content:center;font-family:var(--font-c);font-weight:700;font-size:13px;flex-shrink:0}
.person{display:flex;align-items:center;gap:10px}

/* ===== EMPTY ===== */
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .ic{font-size:44px;opacity:.5}
.empty .t{font-family:var(--font-c);font-size:16px;font-weight:600;margin-top:8px;color:var(--navy)}
.empty .s{font-size:13px;margin-top:4px}
.state{display:flex;align-items:center;justify-content:center;gap:12px;padding:60px 20px;color:var(--muted);font-family:var(--font-c)}
.spinner{width:22px;height:22px;border:3px solid var(--border);border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== MODAL ===== */
.modal-bg{position:fixed;inset:0;background:rgba(11,21,39,.5);display:none;align-items:flex-start;justify-content:center;
  z-index:60;padding:30px 16px;overflow-y:auto}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:640px;box-shadow:var(--shadow-md);margin:auto}
.modal-h{background:var(--navy);color:#fff;padding:16px 20px;border-radius:16px 16px 0 0;border-bottom:3px solid var(--red);
  display:flex;align-items:center;justify-content:space-between}
.modal-h .t{font-family:var(--font-d);font-size:22px;letter-spacing:.5px}
.modal-h .x{background:none;border:none;color:#fff;font-size:24px;cursor:pointer;line-height:1;opacity:.8}
.modal-h .x:hover{opacity:1}
.modal-b{padding:20px}
.modal-f{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.frow{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:12px}
.frow.one{grid-template-columns:1fr}
.f label{display:block;font-family:var(--font-c);font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.f{min-width:0}
.hintline{font-family:var(--font-c);font-size:12px;color:var(--muted);margin:-4px 0 10px}

/* ===== DETALLE LEGAJO ===== */
.dl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:8px}
.dl-item{background:var(--off);border:1px solid var(--border);border-radius:9px;padding:10px 12px}
.dl-item .l{font-family:var(--font-c);font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.dl-item .v{font-size:14px;font-weight:600;margin-top:2px}
.dl-head{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.dl-head .avatar{width:52px;height:52px;font-size:20px}
.dl-head .n{font-family:var(--font-d);font-size:26px;letter-spacing:.5px;line-height:1}
.dl-head .r{font-family:var(--font-c);font-size:13px;color:var(--muted)}
.mini-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* ===== BARRAS ROTACIÓN ===== */
.chart{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:10px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.chart .bars{display:flex;align-items:flex-end;gap:2px;height:120px;width:100%;justify-content:center}
.chart .bar{width:9px;border-radius:3px 3px 0 0}
.chart .bar.alta{background:var(--ok)}.chart .bar.baja{background:var(--bad)}
.chart .lbl{font-family:var(--font-c);font-size:10px;color:var(--muted);white-space:nowrap}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--font-c);font-size:12px;color:var(--muted);margin-top:8px}
.legend .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--navy);color:#fff;
  padding:12px 20px;border-radius:10px;font-family:var(--font-c);font-weight:600;box-shadow:var(--shadow-md);z-index:70;
  opacity:0;transition:all .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.err{background:var(--bad)}.toast.ok{background:var(--ok)}

.rowact{display:flex;gap:6px;flex-wrap:wrap}
.iconbtn{background:none;border:1px solid var(--border);border-radius:7px;padding:5px 9px;cursor:pointer;font-size:13px;color:var(--navy-mid)}
.iconbtn:hover{border-color:var(--navy-mid);background:#f7f9fd}
.iconbtn.danger:hover{border-color:var(--bad);color:var(--bad)}

@media(max-width:560px){ .frow{grid-template-columns:1fr} .sec-head h1{font-size:26px} }
</style>
</head>

<!-- ExcelJS para exportar la nómina con estilo (como el OC de Managment) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script>
/* ============================================================
   RRHH — módulo self-contained del Portal Mateu Sports.
   Cuatro áreas: Legajos, Ausentismo/Licencias, Novedades de
   nómina y Rotación. Lee la sesión del Portal (localStorage),
   sin login propio. Datos en Firebase por REST (nodo rrhh/).
   Lo usa gerencia / RRHH (rol admin o herramienta 'rrhh').
   ============================================================ */
'use strict';
const $ = id => document.getElementById(id);

/* ---------- Firebase ----------
   Reusa la base del Portal (discontinuos-mateu, ya existe con reglas abiertas
   y ahí viven los usuarios). Los datos de RRHH viven en un nodo aparte `rrhh/…`.
   Si Juli crea una base propia `rrhh-mateu`, pegar acá su URL y migra solo.
   Vacío => modo demo (no persiste). */
const FIREBASE_DB_URL = 'https://discontinuos-mateu-default-rtdb.firebaseio.com';
const ROOT = 'rrhh';

/* ---------- sesión ---------- */
const SESSION_KEY = 'mateu_portal_session';
function readSession(){ try{ const s=localStorage.getItem(SESSION_KEY); return s?JSON.parse(s):null; }catch(e){ return window.__sess||null; } }
const SESSION = readSession();
if(!SESSION || !SESSION.rol){ location.replace('../'); }
// RRHH la maneja gerencia. Admin o quien tenga la herramienta 'rrhh'. Los
// supervisores ven solo sus sucursales (session.sucursales), como Evaluaciones.
const esAdmin = SESSION && SESSION.rol==='admin';
const esSuper = SESSION && SESSION.rol==='supervisor';
const tieneTool = SESSION && (SESSION.herramientas||[]).includes('rrhh');
const puedeVer = esAdmin || tieneTool || esSuper;
if(SESSION && SESSION.rol && !puedeVer){ location.replace('../'); }
// Alcance de sucursales (slugs). Admin/tool => todas (null). Supervisor => las suyas.
const SCOPE = (esSuper && Array.isArray(SESSION.sucursales) && SESSION.sucursales.length) ? SESSION.sucursales : null;

/* ---------- sucursales (slug -> nombre visible) ---------- */
const SUCS = {
  'plaza':'MS Plaza Italia','kids':'Mateu Kids','calle-47':'MS Calle 47','calle-49':'MS Calle 49',
  'calle-12':'MS Calle 12','city-bell':'MS City Bell','los-hornos':'MS Los Hornos','berisso':'MS Berisso',
  'ensenada':'MS Ensenada','adidas':'Adidas Av. 7','adidas-12':'Adidas Calle 12','originals':'Adidas Originals',
  'aurelius-12':'Aurelius Calle 12','aurelius-5':'Aurelius Calle 5','aurelius-cb':'Aurelius City Bell',
  'gonnet':'Outlet Gonnet','av-44':'Outlet Av. 44','calle-55':'Outlet Calle 55','aurelius-10':'Aurelius Calle 10',
  'ecommerce':'Ecommerce','diagonal':'Diagonal 80','deposito':'Depósito Central',
};
// nombre de sucursal en los datos de Indicadores (con prefijo NN-) -> slug
const DATA_SUC = {
  '12-MS Calle 12':'calle-12','06-MS City Bell':'city-bell','08-MS Calle 47':'calle-47','19-MS Calle 49':'calle-49',
  '13-MS Los Hornos':'los-hornos','01-MS Plaza Italia':'plaza','16-MS Berisso':'berisso','11-MS Ensenada':'ensenada',
  '02-Mateu Kids':'kids','04-Aurelius Calle 12':'aurelius-12','18-Aurelius Calle 5':'aurelius-5','17-Aurelius City Bell':'aurelius-cb',
  '21-Adidas Calle 12':'adidas-12','09-Adidas Av. 7':'adidas','15-Adidas Originals':'originals','99-Ecommerce':'ecommerce',
  '14-Outlet Gonnet':'gonnet','20-Outlet Av. 44':'av-44','03-Outlet Calle 55':'calle-55','07-Aurelius Calle 10':'aurelius-10',
};
function sucLabel(slug){ return SUCS[slug] || slug || '—'; }
function sucsVisibles(){
  const all = Object.keys(SUCS);
  return SCOPE ? all.filter(s=>SCOPE.includes(s)) : all;
}
function enAlcance(slug){ return !SCOPE || SCOPE.includes(slug); }

/* ---------- catálogos ---------- */
const PUESTOS = ['Encargado/a','Subencargado/a','Vendedor/a','Cajero/a','Depósito','Administrativo/a','Gerencia','Otro'];
const REGIMENES = ['Full Time','Part Time'];
const TIPOS_AUS = {
  vacaciones:{label:'Vacaciones',cls:'vac',goce:true},
  enfermedad:{label:'Enfermedad / ART',cls:'enf',goce:true},
  licencia:{label:'Licencia especial',cls:'lic',goce:true},
  falta:{label:'Falta injustificada',cls:'falta',goce:false},
  suspension:{label:'Suspensión',cls:'otro',goce:false},
  otro:{label:'Otro',cls:'otro',goce:true},
};
const MOTIVOS_BAJA = ['Renuncia','Despido','Fin de contrato','Acuerdo (art. 241)','Jubilación','Abandono','Otro'];
const TIPOS_NOV = {
  horas_extra:{label:'Horas extra',unidad:'hs'},
  adelanto:{label:'Adelanto de sueldo',unidad:'$'},
  comision:{label:'Comisión',unidad:'$'},
  premio:{label:'Premio / bono',unidad:'$'},
  presentismo:{label:'Presentismo',unidad:'$'},
  descuento:{label:'Descuento',unidad:'$'},
  ausencia:{label:'Ausencia (informativa)',unidad:'días'},

};

/* ---------- helpers ---------- */
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const num = x => { const n=Number(String(x==null?'':x).replace(/[^\d.,-]/g,'').replace(/\.(?=\d{3}\b)/g,'').replace(',','.')); return isFinite(n)?n:0; };
const fmtInt = n => (Math.round(n||0)).toLocaleString('es-AR');
const fmtM = n => '$'+(Math.round(n||0)).toLocaleString('es-AR');
const cmp = (a,b)=>String(a).localeCompare(String(b),'es');
function toast(msg, kind){ const t=$('toast'); t.textContent=msg; t.className='toast show '+(kind||''); setTimeout(()=>{t.className='toast '+(kind||'');},2600); }
function titleCase(s){ return (s||'').toString().toLowerCase().replace(/(^|[\s'’.\-])([a-záéíóúñü])/g,(m,p,c)=>p+c.toUpperCase()); }
function iniciales(nombre){ const p=(nombre||'').trim().split(/\s+/); return ((p[0]||'')[0]||'')+((p[1]||'')[0]||''); }
function hoyISO(){ const d=new Date(); const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function nowISO(){ const d=new Date(); const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes()); }
function fechaLabel(iso){ if(!iso) return '—'; const s=String(iso).slice(0,10).split('-'); return s.length===3? s[2]+'/'+s[1]+'/'+s[0] : iso; }
function periodoActual(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function periodoLabel(p){ const [y,m]=p.split('-'); const nm=['','Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre']; return (nm[+m]||m)+' '+y; }
// días inclusivos entre dos fechas ISO (naive, sin husos)
function diasEntre(a,b){ if(!a||!b) return 0; const d1=new Date(a+'T00:00'),d2=new Date(b+'T00:00'); const n=Math.round((d2-d1)/86400000)+1; return n>0?n:0; }
// antigüedad en años (con decimales) desde ingreso hasta hoy o baja
function antiguedadAnios(leg){ if(!leg.ingreso) return 0; const fin=leg.estado==='baja'&&leg.baja_fecha? leg.baja_fecha : hoyISO(); return Math.max(0,(new Date(fin)-new Date(leg.ingreso))/(365.25*86400000)); }
function antiguedadLabel(leg){ const a=antiguedadAnios(leg); if(!leg.ingreso) return '—'; if(a<1){ const m=Math.round(a*12); return m+' mes'+(m===1?'':'es'); } const y=Math.floor(a), m=Math.round((a-y)*12); return y+' año'+(y===1?'':'s')+(m?(' '+m+'m'):''); }
// vacaciones por ley (LCT Arg.) según antigüedad
function vacacionesLey(leg){ const a=antiguedadAnios(leg); if(a<0.5) return 0; if(a<5) return 14; if(a<10) return 21; if(a<20) return 28; return 35; }
function vacacionesBase(leg){ return (leg.vacaciones_base!=null && leg.vacaciones_base!=='') ? Number(leg.vacaciones_base) : vacacionesLey(leg); }

/* ---------- Firebase REST ---------- */
function fbUrl(path){ return FIREBASE_DB_URL.replace(/\/+$/,'') + '/' + path.split('/').map(encodeURIComponent).join('/') + '.json'; }
async function fbGet(path){ const r=await fetch(fbUrl(path)); if(!r.ok) throw new Error('Firebase HTTP '+r.status); return r.json(); }
async function fbPut(path, data){ const r=await fetch(fbUrl(path),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}); if(!r.ok) throw new Error('Firebase HTTP '+r.status); return r.json(); }
async function fbPost(path, data){ const r=await fetch(fbUrl(path),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}); if(!r.ok) throw new Error('Firebase HTTP '+r.status); return r.json(); }
async function fbDelete(path){ const r=await fetch(fbUrl(path),{method:'DELETE'}); if(!r.ok) throw new Error('Firebase HTTP '+r.status); return r.json(); }

/* ============================================================
   ESTADO
   ============================================================ */
const HAS_DB = !!FIREBASE_DB_URL;
let LEGAJOS = {};     // id -> legajo
let AUSENCIAS = {};   // id -> ausencia
let NOVEDADES = {};   // id -> novedad (del período seleccionado)
let state = { tab:'legajos', qLeg:'', fSuc:'', fEstado:'activo', fPuesto:'',
              qAus:'', aSuc:'', aTipo:'', aEstado:'', novPeriodo:periodoActual() };

/* ============================================================
   INIT
   ============================================================ */
async function init(){
  $('whoName').textContent = SESSION.email || '—';
  $('whoRole').textContent = esAdmin?'Administrador':esSuper?'Supervisor':'RRHH';
  $('salir').onclick = ()=>{ try{ localStorage.removeItem(SESSION_KEY); }catch(e){} location.replace('../'); };
  $('modalX').onclick = closeModal;
  $('modalBg').addEventListener('click', e=>{ if(e.target===$('modalBg')) closeModal(); });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });
  document.querySelectorAll('.tab').forEach(b=> b.onclick=()=>{ state.tab=b.dataset.tab; syncTabs(); render(); });

  if(!HAS_DB){
    $('cfgBanner').style.display='block';
    $('cfgBanner').innerHTML='⚙️ <b>Sin base configurada.</b> Pegá la URL de Firebase en <code>FIREBASE_DB_URL</code> para guardar los datos. Podés explorar en modo demo, pero no persiste.';
  }
  await recargar();
  render();
}
async function recargar(){
  try{
    const [leg, aus] = await Promise.all([ fbGet(ROOT+'/legajos'), fbGet(ROOT+'/ausencias') ]);
    LEGAJOS = leg || {};
    AUSENCIAS = aus || {};
    // filtro de alcance para supervisores
    if(SCOPE){
      const f={}; Object.entries(LEGAJOS).forEach(([k,v])=>{ if(enAlcance(v.sucursal)) f[k]=v; }); LEGAJOS=f;
    }
    await cargarNovedades();
  }catch(e){ console.error(e); toast('No se pudo leer Firebase','err'); }
}
async function cargarNovedades(){
  try{ const n = await fbGet(ROOT+'/novedades/'+state.novPeriodo); NOVEDADES = n || {}; }
  catch(e){ NOVEDADES = {}; }
}
function syncTabs(){ document.querySelectorAll('.tab').forEach(b=> b.classList.toggle('on', b.dataset.tab===state.tab)); }
function refrescarBadges(){
  const legs = Object.values(LEGAJOS).filter(l=>l.estado!=='baja');
  $('bLeg').textContent = legs.length;
  const pend = Object.values(AUSENCIAS).filter(a=>a.estado==='pendiente').length;
  const hoy = ausentesHoy().length;
  $('bAus').textContent = pend || hoy || Object.values(AUSENCIAS).length;
}

/* ============================================================
   RENDER (router)
   ============================================================ */
function render(){
  refrescarBadges();
  const v=$('view');
  if(state.tab==='legajos') v.innerHTML = viewLegajos();
  else if(state.tab==='ausencias') v.innerHTML = viewAusencias();
  else if(state.tab==='novedades') v.innerHTML = viewNovedades();
  else if(state.tab==='rotacion') v.innerHTML = viewRotacion();
  wire();
}

/* ---------- listas base ---------- */
function legajosOrden(){
  return Object.entries(LEGAJOS).map(([id,l])=>({id,...l}))
    .sort((a,b)=> cmp(a.nombre||'', b.nombre||''));
}
function ausenciasOrden(){
  return Object.entries(AUSENCIAS).map(([id,a])=>({id,...a}))
    .sort((a,b)=> cmp(b.desde||'', a.desde||''));
}
function novedadesOrden(){
  return Object.entries(NOVEDADES).map(([id,n])=>({id,...n}))
    .sort((a,b)=> cmp((LEGAJOS[a.legajoId]||{}).nombre||'', (LEGAJOS[b.legajoId]||{}).nombre||''));
}

/* ============================================================
   TAB 1 — LEGAJOS
   ============================================================ */
function viewLegajos(){
  const todos = legajosOrden();
  const q = state.qLeg.trim().toLowerCase();
  let list = todos.filter(l=>{
    if(state.fEstado && (l.estado||'activo')!==state.fEstado) return false;
    if(state.fSuc && l.sucursal!==state.fSuc) return false;
    if(state.fPuesto && l.puesto!==state.fPuesto) return false;
    if(q){ const hay=(l.nombre+' '+(l.dni||'')+' '+(l.puesto||'')+' '+sucLabel(l.sucursal)).toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  });
  const activos = todos.filter(l=>(l.estado||'activo')!=='baja');
  const ft = activos.filter(l=>l.regimen==='Full Time').length;
  const pt = activos.filter(l=>l.regimen==='Part Time').length;

  const kpis = `<div class="kpis">
    <div class="kpi info"><div class="k">Dotación activa</div><div class="v">${activos.length}</div><div class="s">${ft} full time · ${pt} part time</div></div>
    <div class="kpi"><div class="k">Sucursales con gente</div><div class="v">${new Set(activos.map(l=>l.sucursal)).size}</div></div>
    <div class="kpi ok"><div class="k">Antigüedad promedio</div><div class="v">${promedioAntiguedad(activos)}</div></div>
    <div class="kpi warn"><div class="k">Bajas (12 meses)</div><div class="v">${bajasUltimos12().length}</div></div>
  </div>`;

  const opsSuc = ['<option value="">Todas las sucursales</option>'].concat(sucsVisibles().sort((a,b)=>cmp(sucLabel(a),sucLabel(b))).map(s=>`<option value="${s}" ${state.fSuc===s?'selected':''}>${esc(sucLabel(s))}</option>`)).join('');
  const opsPue = ['<option value="">Todos los puestos</option>'].concat(PUESTOS.map(p=>`<option value="${esc(p)}" ${state.fPuesto===p?'selected':''}>${esc(p)}</option>`)).join('');

  const toolbar = `<div class="toolbar">
    <div class="grow"><input class="inp" id="qLeg" placeholder="Buscar por nombre, DNI, puesto…" value="${esc(state.qLeg)}"></div>
    <select class="sel" id="fSuc" style="width:auto">${opsSuc}</select>
    <select class="sel" id="fPuesto" style="width:auto">${opsPue}</select>
    <select class="sel" id="fEstado" style="width:auto">
      <option value="activo" ${state.fEstado==='activo'?'selected':''}>Solo activos</option>
      <option value="baja" ${state.fEstado==='baja'?'selected':''}>Solo bajas</option>
      <option value="" ${state.fEstado===''?'selected':''}>Todos</option>
    </select>
    <button class="btn btn-primary btn-sm" id="btnNuevo">+ Legajo</button>
    <button class="btn btn-outline btn-sm" id="btnImportar" title="Traer la dotación registrada en Indicadores">⇩ Importar dotación</button>
  </div>`;

  let body;
  if(!todos.length){
    body = `<div class="empty"><div class="ic">👤</div><div class="t">Todavía no hay legajos</div>
      <div class="s">Cargá el primero con <b>+ Legajo</b> o traé la dotación de Indicadores con <b>⇩ Importar dotación</b>.</div></div>`;
  } else if(!list.length){
    body = `<div class="empty"><div class="ic">🔍</div><div class="t">Sin resultados</div><div class="s">Probá otro filtro o búsqueda.</div></div>`;
  } else {
    const rows = list.map(l=>{
      const est=(l.estado||'activo');
      return `<tr class="clk" data-leg="${l.id}">
        <td><div class="person"><span class="avatar">${esc(iniciales(l.nombre))}</span>
          <div><div class="nm">${esc(l.nombre||'—')}</div><div class="sub">${esc(l.puesto||'—')}${l.dni?' · DNI '+esc(l.dni):''}</div></div></div></td>
        <td>${esc(sucLabel(l.sucursal))}</td>
        <td>${l.regimen?`<span class="tag ${l.regimen==='Full Time'?'ft':'pt'}">${esc(l.regimen)}</span>`:'—'}</td>
        <td>${fechaLabel(l.ingreso)}</td>
        <td>${antiguedadLabel(l)}</td>
        <td>${est==='baja'?'<span class="tag baja">Baja</span>':'<span class="tag activo">Activo</span>'}</td>
        <td><div class="rowact">
          <button class="iconbtn" data-edit="${l.id}" title="Editar">✎</button>
          ${est==='baja'?`<button class="iconbtn" data-reactivar="${l.id}" title="Reactivar">↩</button>`:`<button class="iconbtn danger" data-baja="${l.id}" title="Registrar baja">⏻</button>`}
        </div></td>
      </tr>`;
    }).join('');
    body = `<div class="tblwrap"><table class="grid"><thead><tr>
      <th>Persona</th><th>Sucursal</th><th>Régimen</th><th>Ingreso</th><th>Antigüedad</th><th>Estado</th><th></th>
      </tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  return `<div class="sec-head"><div><h1>Legajos</h1><div class="sub">Ficha de cada persona: datos, contrato, sucursal y antigüedad.</div></div></div>${kpis}${toolbar}${body}`;
}

function promedioAntiguedad(list){
  const con=list.filter(l=>l.ingreso); if(!con.length) return '—';
  const a=con.reduce((s,l)=>s+antiguedadAnios(l),0)/con.length;
  if(a<1) return Math.round(a*12)+' m';
  return a.toFixed(1)+' años';
}

/* ============================================================
   TAB 2 — AUSENTISMO / LICENCIAS
   ============================================================ */
function ausentesHoy(){
  const h=hoyISO();
  return Object.entries(AUSENCIAS).map(([id,a])=>({id,...a}))
    .filter(a=>a.estado!=='rechazada' && a.desde && a.hasta && a.desde<=h && a.hasta>=h);
}
function viewAusencias(){
  const list = ausenciasOrden().filter(a=>{
    if(state.aSuc){ const l=LEGAJOS[a.legajoId]; if(!l||l.sucursal!==state.aSuc) return false; }
    if(state.aTipo && a.tipo!==state.aTipo) return false;
    if(state.aEstado && (a.estado||'aprobada')!==state.aEstado) return false;
    if(state.qAus){ const l=LEGAJOS[a.legajoId]||{}; const hay=((l.nombre||'')+' '+sucLabel(l.sucursal)).toLowerCase(); if(!hay.includes(state.qAus.toLowerCase())) return false; }
    return true;
  });
  const hoy = ausentesHoy();
  const pend = Object.values(AUSENCIAS).filter(a=>a.estado==='pendiente').length;
  const enVac = hoy.filter(a=>a.tipo==='vacaciones').length;

  const kpis = `<div class="kpis">
    <div class="kpi bad"><div class="k">Ausentes hoy</div><div class="v">${hoy.length}</div><div class="s">${fechaLabel(hoyISO())}</div></div>
    <div class="kpi info"><div class="k">De vacaciones hoy</div><div class="v">${enVac}</div></div>
    <div class="kpi warn"><div class="k">Solicitudes pendientes</div><div class="v">${pend}</div></div>
    <div class="kpi"><div class="k">Registros (total)</div><div class="v">${Object.keys(AUSENCIAS).length}</div></div>
  </div>`;

  const opsSuc = ['<option value="">Todas las sucursales</option>'].concat(sucsVisibles().sort((a,b)=>cmp(sucLabel(a),sucLabel(b))).map(s=>`<option value="${s}" ${state.aSuc===s?'selected':''}>${esc(sucLabel(s))}</option>`)).join('');
  const opsTipo = ['<option value="">Todos los tipos</option>'].concat(Object.entries(TIPOS_AUS).map(([k,v])=>`<option value="${k}" ${state.aTipo===k?'selected':''}>${esc(v.label)}</option>`)).join('');

  const toolbar = `<div class="toolbar">
    <div class="grow"><input class="inp" id="qAus" placeholder="Buscar por persona o sucursal…" value="${esc(state.qAus)}"></div>
    <select class="sel" id="aSuc" style="width:auto">${opsSuc}</select>
    <select class="sel" id="aTipo" style="width:auto">${opsTipo}</select>
    <select class="sel" id="aEstado" style="width:auto">
      <option value="" ${state.aEstado===''?'selected':''}>Todos los estados</option>
      <option value="pendiente" ${state.aEstado==='pendiente'?'selected':''}>Pendientes</option>
      <option value="aprobada" ${state.aEstado==='aprobada'?'selected':''}>Aprobadas</option>
      <option value="rechazada" ${state.aEstado==='rechazada'?'selected':''}>Rechazadas</option>
    </select>
    <button class="btn btn-primary btn-sm" id="btnNuevaAus">+ Ausencia / Licencia</button>
  </div>`;

  let body;
  if(!list.length){
    body = `<div class="empty"><div class="ic">📆</div><div class="t">Sin ausencias cargadas</div>
      <div class="s">Registrá una falta, licencia o vacaciones con <b>+ Ausencia / Licencia</b>.</div></div>`;
  } else {
    const h=hoyISO();
    const rows = list.map(a=>{
      const l=LEGAJOS[a.legajoId]||{}; const t=TIPOS_AUS[a.tipo]||TIPOS_AUS.otro;
      const est=(a.estado||'aprobada');
      const activa = a.desde<=h && a.hasta>=h && est!=='rechazada';
      return `<tr>
        <td><div class="person"><span class="avatar">${esc(iniciales(l.nombre))}</span>
          <div><div class="nm">${esc(l.nombre||'—')}</div><div class="sub">${esc(sucLabel(l.sucursal))}</div></div></div></td>
        <td><span class="tag ${t.cls}">${esc(t.label)}</span>${activa?' <span class="tag bad" style="background:#fdecec;color:#991b1b">en curso</span>':''}</td>
        <td>${fechaLabel(a.desde)} → ${fechaLabel(a.hasta)}</td>
        <td class="num">${fmtInt(a.dias||diasEntre(a.desde,a.hasta))}</td>
        <td>${a.goce?'<span class="sub">Con goce</span>':'<span class="sub" style="color:var(--bad)">Sin goce</span>'}</td>

  return `<div class="sec-head"><div><h1>Ausentismo y Licencias</h1><div class="sub">Faltas, licencias especiales y vacaciones por sucursal.</div></div></div>${kpis}${toolbar}${body}${list.length?nota:''}`;
}

/* ============================================================
   TAB 3 — NOVEDADES DE NÓMINA
   ============================================================ */
function viewNovedades(){
  const list = novedadesOrden();
  // opciones de período: últimos 12 meses
  const ops=[]; const d=new Date();
  for(let i=0;i<12;i++){ const y=d.getFullYear(), m=d.getMonth()+1-i; const dt=new Date(y, m-1, 1); const p=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0'); ops.push(p); }
  const opsHtml = ops.map(p=>`<option value="${p}" ${state.novPeriodo===p?'selected':''}>${esc(periodoLabel(p))}</option>`).join('');

  const totalMonto = list.filter(n=>(TIPOS_NOV[n.tipo]||{}).unidad==='$').reduce((s,n)=>s+num(n.valor),0);

  const kpis = `<div class="kpis">
    <div class="kpi info"><div class="k">Novedades del mes</div><div class="v">${list.length}</div><div class="s">${esc(periodoLabel(state.novPeriodo))}</div></div>
    <div class="kpi"><div class="k">Personas con novedades</div><div class="v">${new Set(list.map(n=>n.legajoId)).size}</div></div>
    <div class="kpi warn"><div class="k">Monto en $ (neto)</div><div class="v" style="font-size:24px">${fmtM(totalMonto)}</div></div>
  </div>`;

  const toolbar = `<div class="toolbar">
    <div class="field"><label>Período</label><select class="sel" id="novPeriodo">${opsHtml}</select></div>
    <div style="flex:1"></div>
    <button class="btn btn-primary btn-sm" id="btnNuevaNov">+ Novedad</button>
    <button class="btn btn-navy btn-sm" id="btnExportNov" ${list.length?'':'disabled'}>⇩ Excel para el estudio</button>
  </div>`;

  let body;
  if(!list.length){
    body = `<div class="empty"><div class="ic">🧾</div><div class="t">Sin novedades en ${esc(periodoLabel(state.novPeriodo))}</div>
      <div class="s">Cargá horas extra, adelantos, comisiones o descuentos con <b>+ Novedad</b>. Al cierre exportás el Excel para el estudio contable.</div></div>`;
  } else {
    const rows = list.map(n=>{
      const l=LEGAJOS[n.legajoId]||{}; const t=TIPOS_NOV[n.tipo]||TIPOS_NOV.otro;
      const val = t.unidad==='$' ? fmtM(num(n.valor)) : (fmtInt(num(n.valor))+' '+t.unidad);
      return `<tr>
        <td><div class="person"><span class="avatar">${esc(iniciales(l.nombre))}</span>
          <div><div class="nm">${esc(l.nombre||'—')}</div><div class="sub">${esc(sucLabel(l.sucursal))}</div></div></div></td>
        <td>${esc(t.label)}</td>
        <td class="num">${val}</td>
        <td class="sub">${esc(n.detalle||'')}</td>
        <td><div class="rowact">
          <button class="iconbtn" data-editnov="${n.id}" title="Editar">✎</button>
          <button class="iconbtn danger" data-delnov="${n.id}" title="Eliminar">🗑</button>
        </div></td>
      </tr>`;
    }).join('');
    body = `<div class="tblwrap"><table class="grid"><thead><tr>
      <th>Persona</th><th>Concepto</th><th class="num">Valor</th><th>Detalle</th><th></th>
      </tr></thead><tbody>${rows}</tbody></table></div>`;
  }

/* ============================================================
   TAB 4 — ROTACIÓN
   ============================================================ */
function bajasUltimos12(){
  const desde=new Date(); desde.setMonth(desde.getMonth()-12);
  return Object.values(LEGAJOS).filter(l=>l.estado==='baja' && l.baja_fecha && new Date(l.baja_fecha)>=desde);
}
function altasUltimos12(){
  const desde=new Date(); desde.setMonth(desde.getMonth()-12);
  return Object.values(LEGAJOS).filter(l=>l.ingreso && new Date(l.ingreso)>=desde);
}
// headcount activo a una fecha (fin de mes)
function headcountA(fechaISO){
  return Object.values(LEGAJOS).filter(l=>{
    if(!l.ingreso || l.ingreso>fechaISO) return false;
    if(l.estado==='baja' && l.baja_fecha && l.baja_fecha<=fechaISO) return false;
    return true;
  }).length;
}
function finDeMes(y,m){ const d=new Date(y,m,0); const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function viewRotacion(){
  const activos = Object.values(LEGAJOS).filter(l=>(l.estado||'activo')!=='baja');
  const altas = altasUltimos12(), bajas = bajasUltimos12();
  const hcAvg = (headcountA(finDeMes(new Date().getFullYear(), new Date().getMonth()+1)) + headcountA(finDeMesHace(12)))/2 || 1;
  const rot = ((altas.length+bajas.length)/2)/hcAvg*100;

  const kpis = `<div class="kpis">
    <div class="kpi info"><div class="k">Dotación actual</div><div class="v">${activos.length}</div></div>
    <div class="kpi ok"><div class="k">Altas (12 meses)</div><div class="v">${altas.length}</div></div>
    <div class="kpi bad"><div class="k">Bajas (12 meses)</div><div class="v">${bajas.length}</div></div>
    <div class="kpi warn"><div class="k">Índice de rotación</div><div class="v">${rot.toFixed(1)}<small>%</small></div><div class="s">anualizado</div></div>
  </div>`;

  // serie mensual de altas/bajas (12 meses)
  const meses=[]; const now=new Date();
  for(let i=11;i>=0;i--){ const dt=new Date(now.getFullYear(), now.getMonth()-i, 1); meses.push({y:dt.getFullYear(), m:dt.getMonth()+1}); }
  const serie = meses.map(({y,m})=>{
    const ini=y+'-'+String(m).padStart(2,'0')+'-01', fin=finDeMes(y,m);
    const a=Object.values(LEGAJOS).filter(l=>l.ingreso && l.ingreso>=ini && l.ingreso<=fin).length;
    const b=Object.values(LEGAJOS).filter(l=>l.estado==='baja' && l.baja_fecha && l.baja_fecha>=ini && l.baja_fecha<=fin).length;
    return {y,m,a,b};
  });
  const maxV = Math.max(1, ...serie.map(s=>Math.max(s.a,s.b)));
  const nm=['','Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const chart = `<div class="card"><div class="card-h">Altas y bajas por mes</div><div class="card-hs">Últimos 12 meses</div>
    <div class="chart">${serie.map(s=>`<div class="col"><div class="bars">
      <div class="bar alta" style="height:${Math.round(s.a/maxV*120)}px" title="${s.a} altas"></div>
      <div class="bar baja" style="height:${Math.round(s.b/maxV*120)}px" title="${s.b} bajas"></div>
    </div><div class="lbl">${nm[s.m]}</div></div>`).join('')}</div>
    <div class="legend"><span><span class="dot" style="background:var(--ok)"></span>Altas</span><span><span class="dot" style="background:var(--bad)"></span>Bajas</span></div>
  </div>`;

  // tabla por sucursal
  const porSuc={};
  Object.values(LEGAJOS).forEach(l=>{ const s=l.sucursal||'—'; (porSuc[s]=porSuc[s]||[]).push(l); });
  const desde12=new Date(); desde12.setMonth(desde12.getMonth()-12);
  const filas = Object.entries(porSuc).map(([s,arr])=>{
    const act=arr.filter(l=>(l.estado||'activo')!=='baja');
    const a=arr.filter(l=>l.ingreso && new Date(l.ingreso)>=desde12).length;
    const b=arr.filter(l=>l.estado==='baja' && l.baja_fecha && new Date(l.baja_fecha)>=desde12).length;
    const ants=act.filter(l=>l.ingreso).map(l=>antiguedadAnios(l));
    const antProm=ants.length? (ants.reduce((x,y)=>x+y,0)/ants.length):0;
    const rotS = act.length? ((a+b)/2)/act.length*100 : 0;
    return {s,hc:act.length,a,b,antProm,rotS};
  }).filter(f=>f.hc||f.a||f.b).sort((x,y)=>y.rotS-x.rotS);

  let tabla;
  if(!filas.length){
    tabla = `<div class="empty"><div class="ic">📊</div><div class="t">Sin datos de rotación</div><div class="s">Cargá legajos con fecha de ingreso (y baja cuando corresponda) para ver la rotación.</div></div>`;
  } else {
    const rows = filas.map(f=>`<tr>
      <td class="nm">${esc(sucLabel(f.s))}</td>
      <td class="num">${f.hc}</td>
      <td class="num" style="color:var(--ok)">${f.a}</td>
      <td class="num" style="color:var(--bad)">${f.b}</td>
      <td class="num">${f.antProm? (f.antProm<1? Math.round(f.antProm*12)+' m' : f.antProm.toFixed(1)+' a'):'—'}</td>
      <td class="num"><b>${f.rotS.toFixed(0)}%</b></td>
    </tr>`).join('');
    tabla = `<div class="tblwrap"><table class="grid"><thead><tr>
      <th>Sucursal</th><th class="num">Dotación</th><th class="num">Altas 12m</th><th class="num">Bajas 12m</th><th class="num">Antig. prom.</th><th class="num">Rotación</th>
      </tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  // motivos de baja
  const mot={}; bajas.forEach(l=>{ const m=l.baja_motivo||'Otro'; mot[m]=(mot[m]||0)+1; });
  const motArr=Object.entries(mot).sort((a,b)=>b[1]-a[1]);
  const motivos = motArr.length? `<div class="card"><div class="card-h">Motivos de baja</div><div class="card-hs">Últimos 12 meses</div>
    ${motArr.map(([m,c])=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border)"><span>${esc(m)}</span><b>${c}</b></div>`).join('')}</div>` : '';

  return `<div class="sec-head"><div><h1>Rotación</h1><div class="sub">Altas, bajas e índice de rotación por sucursal.</div></div></div>${kpis}${chart}
    <div class="card" style="padding:0;overflow:hidden;border:none;box-shadow:none;margin-bottom:16px"><div style="padding:0 2px 8px"><b style="font-family:var(--font-d);font-size:20px;letter-spacing:.5px">Rotación por sucursal</b></div>${tabla}</div>${motivos}`;
}
function finDeMesHace(nMeses){ const d=new Date(); d.setMonth(d.getMonth()-nMeses+1); return finDeMes(d.getFullYear(), d.getMonth()+1); }

/* ============================================================
   WIRE (eventos tras cada render)
   ============================================================ */
function wire(){
  // ---- Legajos ----
  const qLeg=$('qLeg'); if(qLeg) qLeg.oninput=debounce(()=>{ state.qLeg=qLeg.value; render(); },200);
  bindSel('fSuc','fSuc'); bindSel('fPuesto','fPuesto'); bindSel('fEstado','fEstado');
  if($('btnNuevo')) $('btnNuevo').onclick=()=>formLegajo(null);
  if($('btnImportar')) $('btnImportar').onclick=importarDotacion;
  document.querySelectorAll('[data-leg]').forEach(tr=> tr.onclick=e=>{ if(e.target.closest('.rowact')) return; detalleLegajo(tr.dataset.leg); });
  document.querySelectorAll('[data-edit]').forEach(b=> b.onclick=e=>{ e.stopPropagation(); formLegajo(b.dataset.edit); });
  document.querySelectorAll('[data-baja]').forEach(b=> b.onclick=e=>{ e.stopPropagation(); formBaja(b.dataset.baja); });
  document.querySelectorAll('[data-reactivar]').forEach(b=> b.onclick=e=>{ e.stopPropagation(); reactivar(b.dataset.reactivar); });

  // ---- Ausencias ----
  const qAus=$('qAus'); if(qAus) qAus.oninput=debounce(()=>{ state.qAus=qAus.value; render(); },200);
  bindSel('aSuc','aSuc'); bindSel('aTipo','aTipo'); bindSel('aEstado','aEstado');
  if($('btnNuevaAus')) $('btnNuevaAus').onclick=()=>formAusencia(null);
  document.querySelectorAll('[data-editaus]').forEach(b=> b.onclick=()=>formAusencia(b.dataset.editaus));
  document.querySelectorAll('[data-delaus]').forEach(b=> b.onclick=()=>borrarAusencia(b.dataset.delaus));
  document.querySelectorAll('[data-aprob]').forEach(b=> b.onclick=()=>setEstadoAus(b.dataset.aprob,'aprobada'));
  document.querySelectorAll('[data-rech]').forEach(b=> b.onclick=()=>setEstadoAus(b.dataset.rech,'rechazada'));

  // ---- Novedades ----
  const nP=$('novPeriodo'); if(nP) nP.onchange=async()=>{ state.novPeriodo=nP.value; await cargarNovedades(); render(); };
  if($('btnNuevaNov')) $('btnNuevaNov').onclick=()=>formNovedad(null);
  if($('btnExportNov')) $('btnExportNov').onclick=exportarNovedades;
  document.querySelectorAll('[data-editnov]').forEach(b=> b.onclick=()=>formNovedad(b.dataset.editnov));
  document.querySelectorAll('[data-delnov]').forEach(b=> b.onclick=()=>borrarNovedad(b.dataset.delnov));
}
function bindSel(id, key){ const el=$(id); if(el) el.onchange=()=>{ state[key]=el.value; render(); }; }
function debounce(fn,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }

function openModal(title, bodyHtml, footHtml){

  $('modalBg').classList.add('on');
}
function closeModal(){ $('modalBg').classList.remove('on'); }
function selOptions(arr, sel){ return arr.map(o=>{ const val=Array.isArray(o)?o[0]:o, lab=Array.isArray(o)?o[1]:o; return `<option value="${esc(val)}" ${String(sel)===String(val)?'selected':''}>${esc(lab)}</option>`; }).join(''); }
function sucSelectOptions(sel){ return sucsVisibles().sort((a,b)=>cmp(sucLabel(a),sucLabel(b))).map(s=>`<option value="${s}" ${sel===s?'selected':''}>${esc(sucLabel(s))}</option>`).join(''); }

async function guardarLegajo(id, data){

    LEGAJOS[id]=data; closeModal(); render(); toast('Legajo guardado','ok');
  }catch(e){ console.error(e); toast('No se pudo guardar','err'); }
}

  const l=LEGAJOS[id]; if(!l) return;

  const saldo=base-tomadas;
  const ausList=Object.entries(AUSENCIAS).map(([k,a])=>({id:k,...a})).filter(a=>a.legajoId===id).sort((a,b)=>cmp(b.desde||'',a.desde||''));

    ['Régimen', l.regimen||'—'],['Categoría', l.categoria||'—'],['Ingreso', fechaLabel(l.ingreso)],['Antigüedad', antiguedadLabel(l)],
    ['Teléfono', l.telefono||'—'],['Email', l.email||'—'],['Nacimiento', fechaLabel(l.nacimiento)],['Dirección', l.direccion||'—'],
  ];

    </tbody></table></div>` : '<div class="hintline" style="margin-top:12px">Sin ausencias registradas.</div>';

  const body=`

    </div>
    <div class="frow one"><div class="f"><label>Motivo / observaciones</label><input class="inp" id="aMotivo" value="${esc(a.motivo||'')}"></div></div>`;
  openModal(id?'Editar ausencia':'Nueva ausencia / licencia', body, `<button class="btn btn-outline" id="mCancel">Cancelar</button><button class="btn btn-primary" id="mSave">${id?'Guardar':'Registrar'}</button>`);
  const recalc=()=>{ const d=diasEntre($('aDesde').value,$('aHasta').value); $('aDiasCalc').textContent=d?('(calculado: '+d+')'):''; };
  $('aDesde').onchange=recalc; $('aHasta').onchange=recalc; recalc();
  $('aTipoF').onchange=()=>{ const t=TIPOS_AUS[$('aTipoF').value]; if(t) $('aGoce').value=t.goce?'si':'no'; };
  $('mCancel').onclick=closeModal;
  $('mSave').onclick=async()=>{
    if(!$('aLeg').value){ toast('Elegí a la persona','err'); return; }
    if(!$('aDesde').value || !$('aHasta').value){ toast('Completá las fechas','err'); return; }
    if($('aHasta').value < $('aDesde').value){ toast('La fecha "hasta" es anterior a "desde"','err'); return; }
    const data={
      legajoId:$('aLeg').value, tipo:$('aTipoF').value, estado:$('aEstadoF').value,
      desde:$('aDesde').value, hasta:$('aHasta').value,
      dias: $('aDias').value!==''? Number($('aDias').value) : diasEntre($('aDesde').value,$('aHasta').value),
      goce: $('aGoce').value==='si', motivo:$('aMotivo').value.trim(), actualizado:nowISO(),
    };
    if(!id) data.creado=nowISO();
    await guardarAusencia(id, data);
  };
}
async function guardarAusencia(id, data){
  try{
    if(HAS_DB){ if(id){ await fbPut(ROOT+'/ausencias/'+id, data); } else { const r=await fbPost(ROOT+'/ausencias', data); id=r.name; } }
    else { id=id||('local-'+Object.keys(AUSENCIAS).length); }
    AUSENCIAS[id]=data; closeModal(); render(); toast('Ausencia guardada','ok');
  }catch(e){ console.error(e); toast('No se pudo guardar','err'); }
}
async function setEstadoAus(id, estado){
  const a=AUSENCIAS[id]; if(!a) return;
  const data={...a, estado, actualizado:nowISO()};
  try{ if(HAS_DB) await fbPut(ROOT+'/ausencias/'+id, data); AUSENCIAS[id]=data; render(); toast(estado==='aprobada'?'Aprobada':'Rechazada','ok'); }
  catch(e){ toast('No se pudo actualizar','err'); }
}
async function borrarAusencia(id){
  if(!confirm('¿Eliminar esta ausencia?')) return;
  try{ if(HAS_DB) await fbDelete(ROOT+'/ausencias/'+id); delete AUSENCIAS[id]; render(); toast('Eliminada','ok'); }
  catch(e){ toast('No se pudo eliminar','err'); }
}

/* ---------- Form Novedad ---------- */
function formNovedad(id, legajoPre){

  const body=`
    <div class="hintline">Período: <b>${esc(periodoLabel(state.novPeriodo))}</b></div>
    <div class="frow one"><div class="f"><label>Persona *</label><select class="sel" id="nLeg"><option value="">— Elegí a la persona —</option>${legajoSelectOptions(n.legajoId)}</select></div></div>
    <div class="frow">
      <div class="f"><label>Concepto</label><select class="sel" id="nTipo">${selOptions(Object.entries(TIPOS_NOV).map(([k,v])=>[k,v.label]), n.tipo)}</select></div>
      <div class="f"><label>Valor <span id="nUnidad" class="sub"></span></label><input class="inp" id="nValor" inputmode="decimal" value="${esc(n.valor||'')}"></div>
    </div>
    <div class="frow one"><div class="f"><label>Detalle</label><input class="inp" id="nDetalle" value="${esc(n.detalle||'')}" placeholder="Ej: 6 hs sábado, adelanto quincena…"></div></div>`;
  openModal(id?'Editar novedad':'Nueva novedad', body, `<button class="btn btn-outline" id="mCancel">Cancelar</button><button class="btn btn-primary" id="mSave">${id?'Guardar':'Agregar'}</button>`);
  const upU=()=>{ const t=TIPOS_NOV[$('nTipo').value]; $('nUnidad').textContent=t?('('+t.unidad+')'):''; };
  $('nTipo').onchange=upU; upU();
  $('mCancel').onclick=closeModal;
  $('mSave').onclick=async()=>{
    if(!$('nLeg').value){ toast('Elegí a la persona','err'); return; }

async function guardarNovedad(id, data){

    const path=ROOT+'/novedades/'+state.novPeriodo;

    else { id=id||('local-'+Object.keys(NOVEDADES).length); }
    NOVEDADES[id]=data; closeModal(); render(); toast('Novedad guardada','ok');
  }catch(e){ console.error(e); toast('No se pudo guardar','err'); }
}
async function borrarNovedad(id){
  if(!confirm('¿Eliminar esta novedad?')) return;
  try{ if(HAS_DB) await fbDelete(ROOT+'/novedades/'+state.novPeriodo+'/'+id); delete NOVEDADES[id]; render(); toast('Eliminada','ok'); }
  catch(e){ toast('No se pudo eliminar','err'); }
}

/* ============================================================
   IMPORTAR DOTACIÓN desde Indicadores
   ============================================================ */
async function importarDotacion(){
  openModal('Importar dotación', `<div class="state"><div class="spinner"></div>Leyendo el último período de Indicadores…</div>`, '');
  try{
    const periodos = await fetch('../data/indicadores/periodos.json').then(r=>r.json());
    const per = (periodos.periodos||[]).map(p=>p.id).sort().reverse()[0];
    if(!per) throw new Error('sin períodos');
    const cadena = await fetch('../data/indicadores/'+per+'/cadena.json').then(r=>r.json());
    const sucsData = (cadena.sucursales||[]).map(s=>s.sucursal).filter(n=>DATA_SUC[n]);
    // traer cada archivo de sucursal
    const nuevos=[];
    for(const nombre of sucsData){
      const slug=DATA_SUC[nombre];
      if(!enAlcance(slug)) continue;
      const archivo=nombre.replace(/\./g,'').replace(/\s+/g,'-');
      let det; try{ det=await fetch('../data/indicadores/'+per+'/'+archivo+'.json').then(r=>r.json()); }catch(e){ continue; }
      (det.vendedores||[]).forEach(v=>{
        if(v.cubre) return; // coberturas: cada quien en su sucursal fija
        if(v.grupo==='Gerencia / otros' && /sin rol/i.test(v.sector||'')) return;
        const nombrePersona = titleCase(v.vendedor);
        nuevos.push({ nombre:nombrePersona, sucursal:slug, puesto:puestoDe(v), regimen:/part time|refuerzo|días|dias/i.test(v.sector||'')?'Part Time':'Full Time' });
      });
    }
    // deduplicar contra legajos existentes por nombre+sucursal
    const existentes=new Set(Object.values(LEGAJOS).map(l=>(l.nombre||'').toLowerCase()+'|'+l.sucursal));
    const aAgregar=nuevos.filter(n=>!existentes.has((n.nombre||'').toLowerCase()+'|'+n.sucursal));
    if(!aAgregar.length){ openModal('Importar dotación', `<div class="empty"><div class="ic">✅</div><div class="t">Todo al día</div><div class="s">No hay personas nuevas en Indicadores (${esc(per)}) que no estén ya en los legajos.</div></div>`, `<button class="btn btn-primary" id="mCancel">Cerrar</button>`); $('mCancel').onclick=closeModal; return; }
    const preview=aAgregar.slice(0,60).map(n=>`<tr><td class="nm">${esc(n.nombre)}</td><td>${esc(sucLabel(n.sucursal))}</td><td>${esc(n.puesto)}</td><td><span class="tag ${n.regimen==='Full Time'?'ft':'pt'}">${esc(n.regimen)}</span></td></tr>`).join('');
    const body=`<div class="hintline">Encontré <b>${aAgregar.length}</b> persona(s) en Indicadores (${esc(per)}) que no están en los legajos. Se crean como <b>activos</b>, sin fecha de ingreso (la completás después). Los que ya existen no se tocan.</div>
      <div class="tblwrap"><table class="grid"><thead><tr><th>Nombre</th><th>Sucursal</th><th>Puesto</th><th>Régimen</th></tr></thead><tbody>${preview}</tbody></table></div>
      ${aAgregar.length>60?`<div class="hintline" style="margin-top:8px">…y ${aAgregar.length-60} más.</div>`:''}`;
    openModal('Importar dotación', body, `<button class="btn btn-outline" id="mCancel">Cancelar</button><button class="btn btn-primary" id="mImport">Crear ${aAgregar.length} legajo(s)</button>`);
    $('mCancel').onclick=closeModal;
    $('mImport').onclick=async()=>{
      $('mImport').disabled=true; $('mImport').textContent='Creando…';
      for(const n of aAgregar){
        const data={ nombre:n.nombre, sucursal:n.sucursal, puesto:n.puesto, regimen:n.regimen, estado:'activo', ingreso:null, creado:nowISO(), actualizado:nowISO(), origen:'indicadores:'+per };
        try{ if(HAS_DB){ const r=await fbPost(ROOT+'/legajos', data); LEGAJOS[r.name]=data; } else { LEGAJOS['local-'+Object.keys(LEGAJOS).length]=data; } }catch(e){ console.error(e); }
      }
      closeModal(); render(); toast(aAgregar.length+' legajo(s) importados','ok');
    };
  }catch(e){
    console.error(e);
    openModal('Importar dotación', `<div class="empty"><div class="ic">⚠️</div><div class="t">No se pudo leer Indicadores</div><div class="s">Revisá que existan los datos en <code>data/indicadores/</code>.</div></div>`, `<button class="btn btn-primary" id="mCancel">Cerrar</button>`);
    $('mCancel').onclick=closeModal;
  }
}
function puestoDe(v){
  if(v.grupo==='Jefatura') return /sub/i.test(v.sector||'')?'Subencargado/a':'Encargado/a';
  if(v.grupo==='Ventas') return 'Vendedor/a';
  if(v.grupo==='Caja') return 'Cajero/a';
  if(v.grupo==='Refuerzos') return 'Depósito';
  return 'Otro';
}

/* ============================================================
   EXPORTAR NÓMINA (ExcelJS, estilo del OC de Managment)
   ============================================================ */
async function exportarNovedades(){
  if(typeof ExcelJS==='undefined'){ toast('Excel no disponible','err'); return; }
  const list=novedadesOrden();
  if(!list.length){ toast('No hay novedades para exportar','err'); return; }
  try{
    const wb=new ExcelJS.Workbook(); wb.creator='Mateu Sports — RRHH';
    const ws=wb.addWorksheet('Novedades', {views:[{state:'frozen', ySplit:3}]});
    ws.columns=[
      {key:'suc',width:22},{key:'nombre',width:28},{key:'dni',width:14},
      {key:'concepto',width:20},{key:'valor',width:14},{key:'detalle',width:34},
    ];
    // membrete
    ws.mergeCells('A1:F1');
    const t=ws.getCell('A1'); t.value='MATEU SPORTS · Novedades de nómina — '+periodoLabel(state.novPeriodo);
    t.font={name:'Arial',size:14,bold:true,color:{argb:'FF0B1527'}}; t.alignment={vertical:'middle'};
    ws.getRow(1).height=24;
    ws.mergeCells('A2:F2');
    const st=ws.getCell('A2'); st.value='Generado '+nowISO().replace('T',' ')+' · para el estudio contable';
    st.font={name:'Arial',size:9,italic:true,color:{argb:'FF6B7A99'}};
    // header
    const head=['Sucursal','Nombre','DNI','Concepto','Valor','Detalle'];
    const hr=ws.getRow(3); head.forEach((h,i)=>{ const c=hr.getCell(i+1); c.value=h; c.font={name:'Arial',size:10,bold:true,color:{argb:'FFFFFFFF'}}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF0B1527'}}; c.alignment={vertical:'middle'}; c.border={bottom:{style:'thin',color:{argb:'FFCC0000'}}}; });
    hr.height=20;
    // filas ordenadas por sucursal + nombre
    const rows=list.map(n=>{ const l=LEGAJOS[n.legajoId]||{}; const tc=TIPOS_NOV[n.tipo]||TIPOS_NOV.otro; return {suc:sucLabel(l.sucursal), nombre:l.nombre||'—', dni:l.dni||'', concepto:tc.label, unidad:tc.unidad, valor:num(n.valor), detalle:n.detalle||''}; })
      .sort((a,b)=>cmp(a.suc,b.suc)||cmp(a.nombre,b.nombre));
    rows.forEach(r=>{
      const row=ws.addRow([r.suc,r.nombre,r.dni,r.concepto, r.unidad==='$'?r.valor:(r.valor+' '+r.unidad), r.detalle]);
      if(r.unidad==='$'){ row.getCell(5).numFmt='"$"#,##0'; }
      row.eachCell(c=>{ c.font={name:'Arial',size:10}; c.border={bottom:{style:'hair',color:{argb:'FFDCE3F0'}}}; });
    });
    ws.autoFilter='A3:F3';
    const buf=await wb.xlsx.writeBuffer();
    const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='Novedades-nomina-'+state.novPeriodo+'.xlsx'; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast('Excel generado','ok');
  }catch(e){ console.error(e); toast('No se pudo exportar','err'); }
}
