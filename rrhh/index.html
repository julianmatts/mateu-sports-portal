}

/* --- guardado de un día (no re-renderiza: perdería el foco) --- */
let _calTimer=null, _calAvisoHecho=false;
async function calGuardarDia(slug, periodo, dia, texto){
  const t=String(texto||'').trim();
  CALEND[slug]=CALEND[slug]||{};
  CALEND[slug][periodo]=CALEND[slug][periodo]||{dias:{}};
  const nodo=CALEND[slug][periodo];
  nodo.dias=nodo.dias||{};
  if(t) nodo.dias[String(dia)]=t; else delete nodo.dias[String(dia)];
  nodo.actualizado=nowISO(); nodo.por=(SESSION.email||'');
  const st=$('calState'); if(st){ st.textContent='Guardando…'; st.className='calstate'; }
  try{
    if(HAS_DB){
      await fbPatch(ROOT+'/calendario/'+slug+'/'+periodo, {actualizado:nodo.actualizado, por:nodo.por});
      await fbPut(ROOT+'/calendario/'+slug+'/'+periodo+'/dias/'+dia, t||null);
    }
    if(st){ st.textContent='✓ Guardado'; st.className='calstate ok';
      clearTimeout(_calTimer); _calTimer=setTimeout(()=>{ if($('calState')) $('calState').textContent='Última edición '+nodo.actualizado.replace('T',' ').slice(0,16); },2500); }
  }catch(e){ console.error(e); if(st){ st.textContent='✕ No se pudo guardar'; } toast('No se pudo guardar el día','err'); }
}

// las últimas semanas de la sucursal elegida, con su confirmación

  const filas=sems.map(sm=>{

/* --- Excel del calendario, pensado para RRHH -------------------------------
   Tres piezas en un mismo libro:
     · una hoja por sucursal con el calendario del mes (grilla lunes→domingo,
       el número del día arriba y la novedad abajo, feriados y fines de semana
       marcados) — la foto que reemplaza al Excel que mandaban;
     · «Detalle», la lista plana (sucursal · fecha · día · semana · novedad)
       con autofiltro: es con lo que RRHH realmente trabaja;
     · «Resumen» (al exportar todas), el cierre semanal de cada sucursal.
   --------------------------------------------------------------------------- */
const XC = { navy:'FF0B1527', red:'FFCC0000', linea:'FFDCE3F0', finde:'FFF2F5FA',
             fuera:'FFF7F9FD', ferBg:'FFFFF7ED', ferTx:'FF9A3412', muted:'FF6B7A99',
             okBg:'FFE7F6EC', okTx:'FF166534', badBg:'FFFDECEC', badTx:'FF991B1B' };
const xcBorde = (c)=>({top:{style:'thin',color:{argb:c||XC.linea}},bottom:{style:'thin',color:{argb:c||XC.linea}},
                       left:{style:'thin',color:{argb:c||XC.linea}},right:{style:'thin',color:{argb:c||XC.linea}}});
const xcFill = argb => ({type:'pattern',pattern:'solid',fgColor:{argb}});
const xcHoja = n => String(n).replace(/[\\/*?:\[\]]/g,'-').slice(0,31);
const CAL_DOW_CORTO = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];

// membrete común de todas las hojas
function xcMembrete(ws, cols, titulo, sub){
  ws.mergeCells(1,1,1,cols);
  const t=ws.getCell(1,1); t.value=titulo;
  t.font={name:'Arial',size:15,bold:true,color:{argb:XC.navy}};
  t.alignment={vertical:'middle'};
  ws.getRow(1).height=26;
  ws.mergeCells(2,1,2,cols);
  const st=ws.getCell(2,1); st.value=sub;
  st.font={name:'Arial',size:9,italic:true,color:{argb:XC.muted}};
  ws.getRow(2).height=14;
  ws.getRow(3).height=6;   // aire
}

// una hoja con el calendario del mes de una sucursal
function calHojaMes(wb, slug, per){
  const ws = wb.addWorksheet(xcHoja(sucLabel(slug)), {
    views:[{state:'frozen', ySplit:5}],
    pageSetup:{orientation:'landscape', fitToPage:true, fitToWidth:1, fitToHeight:0,
               margins:{left:.3,right:.3,top:.4,bottom:.4,header:.2,footer:.2}}
  });
  for(let i=1;i<=7;i++) ws.getColumn(i).width=25;
  const d=calDatos(slug,per);
  const sems=calSemDelMes(per);
  const conf=sems.map(sm=>{ const c=calConfSem(slug,sm); return c&&c.estado ? (c.estado==='sin'?'sin novedades':'confirmada') : 'sin confirmar'; });
  xcMembrete(ws, 7, sucLabel(slug)+' · Novedades de '+calMesLabel(per),
    'Mateu Sports · RRHH — generado el '+fechaLabel(hoyISO())+(d.por?' · última edición de '+d.por:'')
    +' · semanas: '+sems.map((sm,i)=>calSemLbl(sm)+' ('+conf[i]+')').join(' | '));

  // encabezado de días
  const hr=ws.getRow(4);
  CAL_DOW_CORTO.forEach((n,i)=>{
    const c=hr.getCell(i+1); c.value=n.toUpperCase();
    c.font={name:'Arial',size:10,bold:true,color:{argb:'FFFFFFFF'}};
    c.fill=xcFill(XC.navy); c.alignment={horizontal:'center',vertical:'middle'};
    c.border={bottom:{style:'medium',color:{argb:XC.red}}};
  });
  hr.height=20;

  // cada semana ocupa dos filas: el número del día y, debajo, la novedad
  const celdas=calCeldas(per);
  for(let w=0; w<celdas.length/7; w++){
    const rNum=ws.addRow([]), rTxt=ws.addRow([]);
    rNum.height=17; rTxt.height=64;
    for(let i=0;i<7;i++){
      const dia=celdas[w*7+i];
      const cn=rNum.getCell(i+1), ct=rTxt.getCell(i+1);
      const finde = i>=5;
      if(dia===null){
        [cn,ct].forEach(c=>{ c.fill=xcFill(XC.fuera); c.border=xcBorde(); });
        continue;
      }
      const fer=calFeriado(per,dia), txt=calTexto(slug,per,dia);
      cn.value=dia;
      cn.font={name:'Arial',size:12,bold:true,color:{argb:fer?XC.ferTx:XC.navy}};
      cn.alignment={horizontal:'left',vertical:'middle',indent:1};
      cn.fill=xcFill(fer?XC.ferBg:(finde?XC.finde:'FFFFFFFF'));
      cn.border={top:xcBorde().top,left:xcBorde().left,right:xcBorde().right};
      ct.value = fer ? {richText:[{font:{name:'Arial',size:8,bold:true,color:{argb:XC.ferTx}}, text:fer.toUpperCase()+(txt?'\n':'')},
                                  {font:{name:'Arial',size:9,color:{argb:XC.navy}}, text:txt||''}]}
                     : txt||'';
      if(!fer){ ct.font={name:'Arial',size:9,color:{argb:XC.navy}}; }
      ct.alignment={wrapText:true,vertical:'top',indent:1};
      ct.fill=xcFill(fer?XC.ferBg:(finde?XC.finde:'FFFFFFFF'));
      ct.border={bottom:xcBorde().bottom,left:xcBorde().left,right:xcBorde().right};
    }
  }
  // pie
  const pie=ws.addRow([]); pie.height=18;
  ws.mergeCells(pie.number,1,pie.number,4);
  const pc=ws.getCell(pie.number,1); pc.value=sucLabel(slug);
  pc.font={name:'Arial',size:11,bold:true,color:{argb:XC.navy}};
  ws.mergeCells(pie.number,5,pie.number,7);
  const pm=ws.getCell(pie.number,5); pm.value=calMesLabel(per);
  pm.font={name:'Arial',size:11,bold:true,color:{argb:XC.navy}}; pm.alignment={horizontal:'right'};
  return ws;
}

// filas planas de una sucursal (para la hoja Detalle)
function calFilasDetalle(slug, per){
  const [y,m]=per.split('-').map(Number), tot=new Date(y,m,0).getDate(), out=[];
  for(let dia=1; dia<=tot; dia++){
    const txt=calTexto(slug,per,dia); if(!String(txt).trim()) continue;
    const f=new Date(y,m-1,dia);
    out.push({suc:sucLabel(slug), fecha:f, dow:CAL_DOW_CORTO[(f.getDay()+6)%7],
              sem:calSemLbl(calISO(calLunesDe(f))), fer:calFeriado(per,dia)||'', txt:String(txt).trim()});
  }
  return out;
}
// las semanas (lunes ISO) que tocan un mes
function calSemDelMes(per){
  const [y,m]=per.split('-').map(Number), tot=new Date(y,m,0).getDate();
  const out=[];
  for(let d=1; d<=tot; d++){ const sm=calISO(calLunesDe(new Date(y,m-1,d))); if(!out.includes(sm)) out.push(sm); }
  return out;
}

function calHojaDetalle(wb, filas, per){
  const ws=wb.addWorksheet('Detalle', {views:[{state:'frozen', ySplit:4}],
    pageSetup:{orientation:'landscape', fitToPage:true, fitToWidth:1, fitToHeight:0}});
  ws.columns=[{width:22},{width:12},{width:12},{width:18},{width:16},{width:70}];
  xcMembrete(ws, 6, 'Novedades de '+calMesLabel(per)+' · detalle',
    filas.length+' día(s) con novedades · generado el '+fechaLabel(hoyISO())+' · usá los filtros de la fila de abajo');
  const head=['Sucursal','Fecha','Día','Semana','Feriado','Novedad'];
  const hr=ws.getRow(4);
  head.forEach((h,i)=>{ const c=hr.getCell(i+1); c.value=h;
    c.font={name:'Arial',size:10,bold:true,color:{argb:'FFFFFFFF'}};
    c.fill=xcFill(XC.navy); c.alignment={vertical:'middle'};
    c.border={bottom:{style:'thin',color:{argb:XC.red}}}; });
  hr.height=20;
  filas.sort((a,b)=> cmp(a.suc,b.suc) || (a.fecha-b.fecha));
  filas.forEach(f=>{
    const r=ws.addRow([f.suc, f.fecha, f.dow, f.sem, f.fer, f.txt]);
    r.getCell(2).numFmt='dd/mm/yyyy';
    r.height=Math.min(60, 14+Math.floor(f.txt.length/62)*12);
    r.eachCell(c=>{ c.font={name:'Arial',size:9.5}; c.alignment={vertical:'top',wrapText:true};
      c.border={bottom:{style:'hair',color:{argb:XC.linea}}}; });
    if(f.fer) r.getCell(5).font={name:'Arial',size:9,bold:true,color:{argb:XC.ferTx}};
  });
  if(filas.length) ws.autoFilter={from:{row:4,column:1}, to:{row:4+filas.length,column:6}};
  return ws;
}

function calHojaResumen(wb, slugs, per){
  const sems=calSemDelMes(per);
  const ws=wb.addWorksheet('Resumen', {views:[{state:'frozen', xSplit:1, ySplit:4}],
    pageSetup:{orientation:'landscape', fitToPage:true, fitToWidth:1, fitToHeight:0}});
  ws.columns=[{width:24},{width:14}].concat(sems.map(()=>({width:20})));
  const nCols=2+sems.length;
  const faltan=slugs.filter(sl=>sems.some(sm=>{ const c=calConfSem(sl,sm); return !(c&&c.estado); }));
  xcMembrete(ws, nCols, 'Cierre semanal · '+calMesLabel(per),
    slugs.length+' sucursales · '+faltan.length+' con alguna semana sin confirmar · generado el '+fechaLabel(hoyISO()));
  const hr=ws.getRow(4);
  ['Sucursal','Días cargados'].concat(sems.map(sm=>'Semana '+calSemLbl(sm))).forEach((h,i)=>{
    const c=hr.getCell(i+1); c.value=h;
    c.font={name:'Arial',size:10,bold:true,color:{argb:'FFFFFFFF'}};
    c.fill=xcFill(XC.navy); c.alignment={vertical:'middle',wrapText:true};
    c.border={bottom:{style:'thin',color:{argb:XC.red}}}; });
  hr.height=26;
  slugs.forEach(sl=>{
    const r=ws.addRow([sucLabel(sl), calCargado(sl,per)].concat(sems.map(sm=>{
      const c=calConfSem(sl,sm), n=calDiasSemana(sl,sm);
      return c&&c.estado ? (c.estado==='sin' && !n ? 'Confirmada · sin novedades' : 'Confirmada · '+n+' día(s)')
           : (n? 'SIN CONFIRMAR · '+n+' día(s)' : 'SIN CONFIRMAR · sin cargar');
    })));
    r.height=16;
    r.eachCell((c,i)=>{ c.font={name:'Arial',size:9.5}; c.border={bottom:{style:'hair',color:{argb:XC.linea}}};
      if(i>2){ const v=String(c.value||'');
        const ok=v.indexOf('Confirmada')===0;
        c.fill=xcFill(ok?XC.okBg:XC.badBg);
        c.font={name:'Arial',size:9,bold:!ok,color:{argb:ok?XC.okTx:XC.badTx}};
        c.alignment={horizontal:'center'}; }
      if(i===2) c.alignment={horizontal:'center'};
    });
  });
  return ws;
}

async function calExportar(scope){
  if(typeof ExcelJS==='undefined'){ toast('Excel no disponible','err'); return; }
  const per=state.calMes;
  const slugs = scope==='todas'
    ? calSucsOperativas().concat(sucsVisibles().filter(x=>['administracion','externos','deposito'].includes(x) && calCargado(x,per)))
    : [state.calSuc];
  if(!slugs.length){ toast('No hay sucursales para exportar','err'); return; }
  toast('Generando el Excel…');
  try{
    const wb=new ExcelJS.Workbook();
    wb.creator='Mateu Sports — RRHH';
    wb.title='Novedades '+calMesLabel(per);
    if(scope==='todas') calHojaResumen(wb, slugs, per);
    const filas=[];
    slugs.forEach(sl=>{ calHojaMes(wb, sl, per); filas.push(...calFilasDetalle(sl, per)); });
    calHojaDetalle(wb, filas, per);
    const buf=await wb.xlsx.writeBuffer();
    const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='Novedades '+per+' - '+(scope==='todas'?'todas las sucursales':sucLabel(state.calSuc).replace(/[\\/:*?"<>|]/g,''))+'.xlsx';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast('Excel generado'+(scope==='todas'?' · '+slugs.length+' sucursales':''),'ok');
  }catch(e){ console.error(e); toast('No se pudo exportar: '+(e.message||e),'err'); }
}

/* --- recordatorio por la Bandeja a las sucursales que no confirmaron la semana --- */
async function calRecordar(){
  const sem=calSemActual();
  const faltan=calSucsOperativas().filter(x=>{ const c=calConfSem(x,sem); return !(c && c.estado); });
  if(!faltan.length) return;
  if(!confirm('Se les manda un directo por la Bandeja a '+faltan.length+' sucursal(es) que no confirmaron la semana del '+calSemLbl(sem)+':\n\n'
    +faltan.map(x=>'· '+sucLabel(x)).join('\n')+'\n\n¿Enviar?')) return;
  const btn=$('calRecordar'); if(btn){ btn.disabled=true; btn.textContent='Enviando…'; }
  let ok=0, sinCuenta=[];
  for(const slug of faltan){
    const mails=await mailsDeSlug(slug).catch(()=>[]);
    if(!mails.length){ sinCuenta.push(sucLabel(slug)); continue; }
    await enviarDirectos(mails, '📆 Falta confirmar las novedades de la semana del '+calSemLbl(sem)
      +'. Se cargan en Mi Sucursal → «Novedades del mes», día por día. Si no hubo nada, confirmalo igual con «Sin novedades».').catch(()=>{});
    ok++;
  }
  if(btn) btn.textContent='✓ Enviado a '+ok+(sinCuenta.length?' · sin cuenta: '+sinCuenta.join(', '):'');
}

/* --- aviso automático de los VIERNES a supervisión y RRHH con las sucursales
   que todavía no confirmaron la semana. Se dispara al abrir la pestaña (no hay
   backend con cron, es el mismo patrón que las alertas de ritmo de Indicadores)
   y se marca con un flag para no repetirlo. --- */
const CAL_AVISADOS = ['rrhh@mateu.com.ar','cristian.campion@mateu.com.ar'];
async function calAvisoViernes(){
  const hoy=new Date();
  if(hoy.getDay()<5 && hoy.getDay()!==0) return;         // viernes, sábado o domingo
  const sem=calSemActual();
  const faltan=calSucsOperativas().filter(x=>{ const c=calConfSem(x,sem); return !(c && c.estado); });
  if(!faltan.length) return;
  const flag=ROOT+'/calAlertas/'+sem+'/__resumen';
  try{
    const ya=await fbGet(flag);
    if(ya) return;
    await fbPut(flag, {ts:Date.now(), por:(SESSION.email||''), faltan:faltan.length});
    const texto='📆 Novedades de la semana del '+calSemLbl(sem)+': '+faltan.length+' de '
      +calSucsOperativas().length+' sucursales todavía no confirmaron — '
      +faltan.map(x=>sucLabel(x)+(calDiasSemana(x,sem)?'':' (sin cargar nada)')).join(' · ')
      +'. Se ve en RRHH → Calendario.';
    await enviarDirectos(CAL_AVISADOS, texto);
    // y el recordatorio a cada sucursal que falta
    for(const slug of faltan){
      const mails=await mailsDeSlug(slug).catch(()=>[]);
      if(mails.length) await enviarDirectos(mails, '📆 Se termina la semana y falta confirmar las novedades del '
        +calSemLbl(sem)+'. Se cargan en Mi Sucursal → «Novedades del mes». Si no hubo nada, confirmalo con «Sin novedades».').catch(()=>{});
    }
  }catch(e){ /* best-effort */ }
}

      <div class="s">Cargá horas extra, adelantos, comisiones o descuentos con <b>+ Novedad</b>. Al cierre exportás el Excel para el estudio contable.</div></div>`;

/* ============================================================
   TAB 6 — ROTACIÓN
   ============================================================ */
function bajasUltimos12(){
  const desde=new Date(); desde.setMonth(desde.getMonth()-12);
  return Object.values(LEGAJOS).filter(l=>l.estado==='baja' && l.baja_fecha && new Date(l.baja_fecha)>=desde);
}
function altasUltimos12(){
  const desde=new Date(); desde.setMonth(desde.getMonth()-12);
  return Object.values(LEGAJOS).filter(l=>l.ingreso && new Date(l.ingreso)>=desde);
}
// headcount activo a una fecha (fin de mes)
function headcountA(fechaISO){
  return Object.values(LEGAJOS).filter(l=>{
    if(!l.ingreso || l.ingreso>fechaISO) return false;
    if(l.estado==='baja' && l.baja_fecha && l.baja_fecha<=fechaISO) return false;
    return true;
  }).length;
}
function finDeMes(y,m){ const d=new Date(y,m,0); const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function viewRotacion(){
  const activos = Object.values(LEGAJOS).filter(l=>(l.estado||'activo')!=='baja');
  const altas = altasUltimos12(), bajas = bajasUltimos12();
  const hcAvg = (headcountA(finDeMes(new Date().getFullYear(), new Date().getMonth()+1)) + headcountA(finDeMesHace(12)))/2 || 1;
  const rot = ((altas.length+bajas.length)/2)/hcAvg*100;

  const kpis = `<div class="kpis">
    <div class="kpi info"><div class="k">Dotación actual</div><div class="v">${activos.length}</div></div>
    <div class="kpi ok"><div class="k">Altas (12 meses)</div><div class="v">${altas.length}</div></div>
    <div class="kpi bad"><div class="k">Bajas (12 meses)</div><div class="v">${bajas.length}</div></div>
    <div class="kpi warn"><div class="k">Índice de rotación</div><div class="v">${rot.toFixed(1)}<small>%</small></div><div class="s">anualizado</div></div>
  </div>`;

  // serie mensual de altas/bajas (12 meses)
  const meses=[]; const now=new Date();
  for(let i=11;i>=0;i--){ const dt=new Date(now.getFullYear(), now.getMonth()-i, 1); meses.push({y:dt.getFullYear(), m:dt.getMonth()+1}); }
  const serie = meses.map(({y,m})=>{
    const ini=y+'-'+String(m).padStart(2,'0')+'-01', fin=finDeMes(y,m);
    const a=Object.values(LEGAJOS).filter(l=>l.ingreso && l.ingreso>=ini && l.ingreso<=fin).length;
    const b=Object.values(LEGAJOS).filter(l=>l.estado==='baja' && l.baja_fecha && l.baja_fecha>=ini && l.baja_fecha<=fin).length;
    return {y,m,a,b};
  });
  const maxV = Math.max(1, ...serie.map(s=>Math.max(s.a,s.b)));
  const nm=['','Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const chart = `<div class="card"><div class="card-h">Altas y bajas por mes</div><div class="card-hs">Últimos 12 meses</div>
    <div class="chart">${serie.map(s=>`<div class="col"><div class="bars">
      <div class="bar alta" style="height:${Math.round(s.a/maxV*120)}px" title="${s.a} altas"></div>
      <div class="bar baja" style="height:${Math.round(s.b/maxV*120)}px" title="${s.b} bajas"></div>
    </div><div class="lbl">${nm[s.m]}</div></div>`).join('')}</div>
    <div class="legend"><span><span class="dot" style="background:var(--ok)"></span>Altas</span><span><span class="dot" style="background:var(--bad)"></span>Bajas</span></div>
  </div>`;

  // tabla por sucursal
  const porSuc={};
  Object.values(LEGAJOS).forEach(l=>{ const s=l.sucursal||'—'; (porSuc[s]=porSuc[s]||[]).push(l); });
  const desde12=new Date(); desde12.setMonth(desde12.getMonth()-12);
  const filas = Object.entries(porSuc).map(([s,arr])=>{
    const act=arr.filter(l=>(l.estado||'activo')!=='baja');
    const a=arr.filter(l=>l.ingreso && new Date(l.ingreso)>=desde12).length;
    const b=arr.filter(l=>l.estado==='baja' && l.baja_fecha && new Date(l.baja_fecha)>=desde12).length;
    const ants=act.filter(l=>l.ingreso).map(l=>antiguedadAnios(l));
    const antProm=ants.length? (ants.reduce((x,y)=>x+y,0)/ants.length):0;
    const rotS = act.length? ((a+b)/2)/act.length*100 : 0;
    return {s,hc:act.length,a,b,antProm,rotS};
  }).filter(f=>f.hc||f.a||f.b).sort((x,y)=>y.rotS-x.rotS);

  let tabla;
  if(!filas.length){
    tabla = `<div class="empty"><div class="ic">📊</div><div class="t">Sin datos de rotación</div><div class="s">Cargá legajos con fecha de ingreso (y baja cuando corresponda) para ver la rotación.</div></div>`;
  } else {
    const rows = filas.map(f=>`<tr>
      <td class="nm">${esc(sucLabel(f.s))}</td>
      <td class="num">${f.hc}</td>
      <td class="num" style="color:var(--ok)">${f.a}</td>
      <td class="num" style="color:var(--bad)">${f.b}</td>
      <td class="num">${f.antProm? (f.antProm<1? Math.round(f.antProm*12)+' m' : f.antProm.toFixed(1)+' a'):'—'}</td>
      <td class="num"><b>${f.rotS.toFixed(0)}%</b></td>
    </tr>`).join('');
    tabla = `<div class="tblwrap"><table class="grid"><thead><tr>
      <th>Sucursal</th><th class="num">Dotación</th><th class="num">Altas 12m</th><th class="num">Bajas 12m</th><th class="num">Antig. prom.</th><th class="num">Rotación</th>
      </tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  // motivos de baja
  const mot={}; bajas.forEach(l=>{ const m=l.baja_motivo||'Otro'; mot[m]=(mot[m]||0)+1; });
  const motArr=Object.entries(mot).sort((a,b)=>b[1]-a[1]);
  const motivos = motArr.length? `<div class="card"><div class="card-h">Motivos de baja</div><div class="card-hs">Últimos 12 meses</div>
    ${motArr.map(([m,c])=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border)"><span>${esc(m)}</span><b>${c}</b></div>`).join('')}</div>` : '';

  return `<div class="sec-head"><div><h1>Rotación</h1><div class="sub">Altas, bajas e índice de rotación por sucursal.</div></div></div>${kpis}${chart}
    <div class="card" style="padding:0;overflow:hidden;border:none;box-shadow:none;margin-bottom:16px"><div style="padding:0 2px 8px"><b style="font-family:var(--font-d);font-size:20px;letter-spacing:.5px">Rotación por sucursal</b></div>${tabla}</div>${motivos}`;
}
function finDeMesHace(nMeses){ const d=new Date(); d.setMonth(d.getMonth()-nMeses+1); return finDeMes(d.getFullYear(), d.getMonth()+1); }

/* ============================================================
   WIRE (eventos tras cada render)
   ============================================================ */
function wire(){
  // ---- Legajos ----
  const qLeg=$('qLeg'); if(qLeg) qLeg.oninput=debounce(()=>{ state.qLeg=qLeg.value; render(); },200);
  bindSel('fSuc','fSuc'); bindSel('fPuesto','fPuesto'); bindSel('fEstado','fEstado');
  if($('btnNuevo')) $('btnNuevo').onclick=()=>formLegajo(null);
  if($('btnImportar')) $('btnImportar').onclick=importarDotacion;
  if($('btnActualizar')) $('btnActualizar').onclick=abrirActualizar;
  document.querySelectorAll('[data-leg]').forEach(tr=> tr.onclick=e=>{ if(e.target.closest('.rowact')) return; detalleLegajo(tr.dataset.leg); });
  document.querySelectorAll('[data-edit]').forEach(b=> b.onclick=e=>{ e.stopPropagation(); formLegajo(b.dataset.edit); });
  document.querySelectorAll('[data-baja]').forEach(b=> b.onclick=e=>{ e.stopPropagation(); formBaja(b.dataset.baja); });
  document.querySelectorAll('[data-reactivar]').forEach(b=> b.onclick=e=>{ e.stopPropagation(); reactivar(b.dataset.reactivar); });

  // ---- Ausencias ----

  bindSel('aSuc','aSuc'); bindSel('aTipo','aTipo'); bindSel('aEstado','aEstado');
  if($('btnNuevaAus')) $('btnNuevaAus').onclick=()=>formAusencia(null);
  document.querySelectorAll('[data-editaus]').forEach(b=> b.onclick=()=>formAusencia(b.dataset.editaus));
  document.querySelectorAll('[data-delaus]').forEach(b=> b.onclick=()=>borrarAusencia(b.dataset.delaus));
  document.querySelectorAll('[data-aprob]').forEach(b=> b.onclick=()=>setEstadoAus(b.dataset.aprob,'aprobada'));
  document.querySelectorAll('[data-rech]').forEach(b=> b.onclick=()=>setEstadoAus(b.dataset.rech,'rechazada'));

  // ---- Sanciones ----
  const qSan=$('qSan'); if(qSan) qSan.oninput=debounce(()=>{ state.qSan=qSan.value; render(); },200);
  bindSel('snSuc','snSuc'); bindSel('snTipo','snTipo');
  if($('btnNuevaSan')) $('btnNuevaSan').onclick=()=>formSancion(null);
  document.querySelectorAll('[data-editsan]').forEach(b=> b.onclick=()=>formSancion(b.dataset.editsan));
  document.querySelectorAll('[data-delsan]').forEach(b=> b.onclick=()=>borrarSancion(b.dataset.delsan));

  // ---- Compensatorios ----
  bindSel('cSuc','cSuc'); bindSel('cEstado','cEstado'); bindSel('cVer','cVer');
  const dd=$('ddCompAdd');
  if($('btnCompAdd')) $('btnCompAdd').onclick=e=>{ e.stopPropagation(); dd.classList.toggle('on'); };
  if(dd){ dd.querySelectorAll('[data-k]').forEach(b=> b.onclick=()=>{ dd.classList.remove('on'); formCompCarga(null, b.dataset.k); });
    document.addEventListener('click', ()=>dd.classList.remove('on'), {once:true}); }
  if($('btnValorHora')) $('btnValorHora').onclick=formValorHora;
  if($('btnCompImp')) $('btnCompImp').onclick=abrirImportComp;
  document.querySelectorAll('[data-capr]').forEach(b=> b.onclick=()=>{ const [sl,id]=b.dataset.capr.split('|'); formAprobar(sl,id); });
  document.querySelectorAll('[data-crech]').forEach(b=> b.onclick=()=>{ const [sl,id]=b.dataset.crech.split('|'); formRechazar(sl,id); });
  document.querySelectorAll('[data-creab]').forEach(b=> b.onclick=()=>{ const [sl,id]=b.dataset.creab.split('|'); reabrirSolic(sl,id); });
  document.querySelectorAll('[data-cmovs]').forEach(b=> b.onclick=()=>{ const [sl,lg]=b.dataset.cmovs.split('|'); verMovsComp(sl,lg); });
  document.querySelectorAll('[data-cadd]').forEach(b=> b.onclick=()=>formCompCarga(b.dataset.cadd));

  // ---- Calendario ----
  const cS=$('calSuc'); if(cS) cS.onchange=()=>{ state.calSuc=cS.value; render(); };
  if($('calPrev')) $('calPrev').onclick=()=>{ state.calMes=calShift(state.calMes,-1); render(); };
  if($('calNext')) $('calNext').onclick=()=>{ state.calMes=calShift(state.calMes, 1); render(); };
  if($('calHoy')) $('calHoy').onclick=()=>{ state.calMes=periodoActual(); render(); };
  if($('calPrint')) $('calPrint').onclick=()=>window.print();
  const ddx=$('ddCalExcel');
  if($('calExcel')) $('calExcel').onclick=e=>{ e.stopPropagation(); ddx.classList.toggle('on'); };
  if(ddx){ ddx.querySelectorAll('[data-sc]').forEach(b=> b.onclick=()=>{ ddx.classList.remove('on'); calExportar(b.dataset.sc); });
    document.addEventListener('click', ()=>ddx.classList.remove('on'), {once:true}); }
  if($('calRecordar')) $('calRecordar').onclick=calRecordar;
  document.querySelectorAll('.calsem-chip[data-calsuc]').forEach(b=> b.onclick=()=>{ state.calSuc=b.dataset.calsuc; render(); });
  if(state.tab==='calendario' && !_calAvisoHecho){ _calAvisoHecho=true; calAvisoViernes(); }
  document.querySelectorAll('#calGrid textarea[data-cd]').forEach(ta=>{
    ta.onchange=()=>calGuardarDia(state.calSuc, state.calMes, ta.dataset.cd, ta.value);
  });

  // ---- Novedades ----
  const nP=$('novPeriodo'); if(nP) nP.onchange=async()=>{ state.novPeriodo=nP.value; await cargarNovedades(); render(); };
  if($('btnNuevaNov')) $('btnNuevaNov').onclick=()=>formNovedad(null);
  if($('btnExportNov')) $('btnExportNov').onclick=exportarNovedades;
  document.querySelectorAll('[data-editnov]').forEach(b=> b.onclick=()=>formNovedad(b.dataset.editnov));
  document.querySelectorAll('[data-delnov]').forEach(b=> b.onclick=()=>borrarNovedad(b.dataset.delnov));
}
function bindSel(id, key){ const el=$(id); if(el) el.onchange=()=>{ state[key]=el.value; render(); }; }
function debounce(fn,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }

/* ============================================================

function openModal(title, bodyHtml, footHtml){

}
function closeModal(){ $('modalBg').classList.remove('on'); }
function selOptions(arr, sel){ return arr.map(o=>{ const val=Array.isArray(o)?o[0]:o, lab=Array.isArray(o)?o[1]:o; return `<option value="${esc(val)}" ${String(sel)===String(val)?'selected':''}>${esc(lab)}</option>`; }).join(''); }
function sucSelectOptions(sel){ return sucsVisibles().sort((a,b)=>cmp(sucLabel(a),sucLabel(b))).map(s=>`<option value="${s}" ${sel===s?'selected':''}>${esc(sucLabel(s))}</option>`).join(''); }

async function guardarLegajo(id, data){
  try{
    if(HAS_DB){
      if(id){ await fbPut(ROOT+'/legajos/'+id, data); }
      else { const r=await fbPost(ROOT+'/legajos', data); id=r.name; }
    } else { id=id||('local-'+Object.keys(LEGAJOS).length); }
    LEGAJOS[id]=data; closeModal(); render(); toast('Legajo guardado','ok');
  }catch(e){ console.error(e); toast('No se pudo guardar','err'); }
}

async function reactivar(id){

/* ---------- Detalle legajo ---------- */
function detalleLegajo(id){
  const l=LEGAJOS[id]; if(!l) return;
  const base=vacacionesBase(l);
  const tomadas=vacacionesTomadas(id);
  const saldo=base-tomadas;
  const ausList=Object.entries(AUSENCIAS).map(([k,a])=>({id:k,...a})).filter(a=>a.legajoId===id).sort((a,b)=>cmp(b.desde||'',a.desde||''));
  const sanList=Object.entries(SANCIONES).map(([k,s])=>({id:k,...s})).filter(s=>s.legajoId===id).sort((a,b)=>cmp(b.fecha||'',a.fecha||''));
  const items=[
    ['DNI', l.dni||'—'],['CUIL', l.cuil||'—'],['Sucursal', sucLabel(l.sucursal)],['Puesto', l.puesto||'—'],
    ['Régimen', l.regimen||'—'],['Categoría', l.categoria||'—'],['Ingreso', fechaLabel(l.ingreso)],['Antigüedad', antiguedadLabel(l)],
    ['Teléfono', l.telefono||'—'],['Email', l.email||'—'],['Nacimiento', fechaLabel(l.nacimiento)],['Dirección', l.direccion||'—'],
  ];

      <div class="dl-item"><div class="l">Por antigüedad (base)</div><div class="v">${base} días</div></div>

      <div class="dl-item"><div class="l">Valorizado</div><div class="v">${valorHora(id)? fmtM(valorizadoPersona(compSlug,id)) : '—'}</div></div>
    </div>
    ${movsComp.length? `<div class="hintline" style="margin-top:10px">Último movimiento: ${fechaLabel(movsComp[0].f)} · ${Number(movsComp[0].d)>0?'+':''}${fmtDias(movsComp[0].d)} — ${esc(movsComp[0].m||'')}</div>`:'<div class="hintline" style="margin-top:10px">Sin movimientos cargados.</div>'}
    ${solComp.filter(x=>(x.estado||'pendiente')==='pendiente').length? `<div class="hintline" style="color:var(--warn)">Tiene ${solComp.filter(x=>(x.estado||'pendiente')==='pendiente').length} solicitud(es) esperando respuesta.</div>`:''}

    ${ausList.map(a=>{const t=TIPOS_AUS[a.tipo]||TIPOS_AUS.otro; const est=(a.estado||'aprobada'); return `<tr><td><span class="tag ${t.cls}">${esc(t.label)}</span></td><td>${fechaLabel(a.desde)} → ${fechaLabel(a.hasta)}</td><td class="num">${fmtInt(a.dias||diasEntre(a.desde,a.hasta))}</td><td>${est==='pendiente'?'<span class="tag pend">Pendiente</span>':est==='rechazada'?'<span class="tag rech">Rechazada</span>':'<span class="tag aprob">Aprobada</span>'}</td></tr>`;}).join('')}

  const histSan = sanList.length? `<div class="card-h" style="font-size:16px;margin-top:12px">Sanciones</div>

      <button class="btn btn-outline btn-sm" id="dlComp">🕘 Compensatorios y horas</button>
    </div>`;

  $('dlNov').onclick=()=>formNovedad(null, id);
  $('dlComp').onclick=()=>verMovsComp(compSlug||l.sucursal, id);
}
function vacacionesTomadas(legajoId){
  const y=new Date().getFullYear();
  return Object.values(AUSENCIAS).filter(a=>a.legajoId===legajoId && a.tipo==='vacaciones' && (a.estado||'aprobada')!=='rechazada' && (a.desde||'').startsWith(String(y)))
    .reduce((s,a)=>s+(a.dias||diasEntre(a.desde,a.hasta)),0);
}

/* ============================================================
   IMPORTAR DOTACIÓN desde Indicadores
   ============================================================ */
async function importarDotacion(){
  openModal('Importar dotación', `<div class="state"><div class="spinner"></div>Leyendo el último período de Indicadores…</div>`, '');
  try{
    const periodos = await fetch('../data/indicadores/periodos.json').then(r=>r.json());
    const per = (periodos.periodos||[]).map(p=>p.id).sort().reverse()[0];
    if(!per) throw new Error('sin períodos');
    const cadena = await fetch('../data/indicadores/'+per+'/cadena.json').then(r=>r.json());
    const sucsData = (cadena.sucursales||[]).map(s=>s.sucursal).filter(n=>DATA_SUC[n]);
    // traer cada archivo de sucursal
    const nuevos=[];
    for(const nombre of sucsData){
      const slug=DATA_SUC[nombre];
      if(!enAlcance(slug)) continue;
      const archivo=nombre.replace(/\./g,'').replace(/\s+/g,'-');
      let det; try{ det=await fetch('../data/indicadores/'+per+'/'+archivo+'.json').then(r=>r.json()); }catch(e){ continue; }
      (det.vendedores||[]).forEach(v=>{
        if(v.cubre) return; // coberturas: cada quien en su sucursal fija
        if(v.grupo==='Gerencia / otros' && /sin rol/i.test(v.sector||'')) return;
        const nombrePersona = titleCase(v.vendedor);
        nuevos.push({ nombre:nombrePersona, sucursal:slug, puesto:puestoDe(v), regimen:/part time|refuerzo|días|dias/i.test(v.sector||'')?'Part Time':'Full Time' });
      });
    }
    // deduplicar contra legajos existentes por nombre+sucursal
    const existentes=new Set(Object.values(LEGAJOS).map(l=>(l.nombre||'').toLowerCase()+'|'+l.sucursal));
    const aAgregar=nuevos.filter(n=>!existentes.has((n.nombre||'').toLowerCase()+'|'+n.sucursal));
    if(!aAgregar.length){ openModal('Importar dotación', `<div class="empty"><div class="ic">✅</div><div class="t">Todo al día</div><div class="s">No hay personas nuevas en Indicadores (${esc(per)}) que no estén ya en los legajos.</div></div>`, `<button class="btn btn-primary" id="mCancel">Cerrar</button>`); $('mCancel').onclick=closeModal; return; }
    const preview=aAgregar.slice(0,60).map(n=>`<tr><td class="nm">${esc(n.nombre)}</td><td>${esc(sucLabel(n.sucursal))}</td><td>${esc(n.puesto)}</td><td><span class="tag ${n.regimen==='Full Time'?'ft':'pt'}">${esc(n.regimen)}</span></td></tr>`).join('');
    const body=`<div class="hintline">Encontré <b>${aAgregar.length}</b> persona(s) en Indicadores (${esc(per)}) que no están en los legajos. Se crean como <b>activos</b>, sin fecha de ingreso (la completás después). Los que ya existen no se tocan.</div>
      <div class="tblwrap"><table class="grid"><thead><tr><th>Nombre</th><th>Sucursal</th><th>Puesto</th><th>Régimen</th></tr></thead><tbody>${preview}</tbody></table></div>
      ${aAgregar.length>60?`<div class="hintline" style="margin-top:8px">…y ${aAgregar.length-60} más.</div>`:''}`;
    openModal('Importar dotación', body, `<button class="btn btn-outline" id="mCancel">Cancelar</button><button class="btn btn-primary" id="mImport">Crear ${aAgregar.length} legajo(s)</button>`);
    $('mCancel').onclick=closeModal;
    $('mImport').onclick=async()=>{
      $('mImport').disabled=true; $('mImport').textContent='Creando…';
      for(const n of aAgregar){
        const data={ nombre:n.nombre, sucursal:n.sucursal, puesto:n.puesto, regimen:n.regimen, estado:'activo', ingreso:null, creado:nowISO(), actualizado:nowISO(), origen:'indicadores:'+per };
        try{ if(HAS_DB){ const r=await fbPost(ROOT+'/legajos', data); LEGAJOS[r.name]=data; } else { LEGAJOS['local-'+Object.keys(LEGAJOS).length]=data; } }catch(e){ console.error(e); }
      }
      closeModal(); render(); toast(aAgregar.length+' legajo(s) importados','ok');
    };
  }catch(e){
    console.error(e);
    openModal('Importar dotación', `<div class="empty"><div class="ic">⚠️</div><div class="t">No se pudo leer Indicadores</div><div class="s">Revisá que existan los datos en <code>data/indicadores/</code>.</div></div>`, `<button class="btn btn-primary" id="mCancel">Cerrar</button>`);
    $('mCancel').onclick=closeModal;
  }
}
function puestoDe(v){
  if(v.grupo==='Jefatura') return /sub/i.test(v.sector||'')?'Subencargado/a':'Encargado/a';
  if(v.grupo==='Ventas') return 'Vendedor/a';
  if(v.grupo==='Caja') return 'Cajero/a';
  if(v.grupo==='Refuerzos') return 'Depósito';
  return 'Otro';
}

/* ============================================================
   ACTUALIZAR desde el Excel "Registro Único de dotación"
   Sube el .xlsx (SheetJS, client-side). Parsea las hojas ACTIVOS y
   BAJAS; la sucursal no está en ACTIVOS → se cruza con la grilla de la
   hoja "Estado actual" por nombre (exacto + subconjunto de tokens).
   Hace MERGE por DNI/nombre: actualiza los existentes y agrega los
   nuevos, sin borrar lo cargado ni pisar la sucursal puesta a mano.
   ============================================================ */
let REG_PARSED = null;
const ruClean=s=>(s==null?'':String(s)).replace(/\s+/g,' ').trim();
const ruNorm=s=>ruClean(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\([^)]*\)/g,'').replace(/\*+/g,'').replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
const ruCap=s=>ruClean(s).toLowerCase().replace(/(^|[\s'’.\-])([a-záéíóúñü])/g,(m,p,c)=>p+c.toUpperCase());
const ruDni=c=>{const m=String(c||'').replace(/\D/g,'');return m.length===11?m.slice(2,10):'';};
function ruSerialISO(v){
  if(v==null||v==='') return null;
  if(v instanceof Date){ if(isNaN(v))return null; const p=x=>String(x).padStart(2,'0'); return v.getFullYear()+'-'+p(v.getMonth()+1)+'-'+p(v.getDate()); }
  const n=Number(v); if(!isFinite(n)||n<=0) return null;
  const d=new Date(Date.UTC(1899,11,30)+Math.round(n)*86400000); const y=d.getUTCFullYear();
  if(y<1950||y>2035) return null; const p=x=>String(x).padStart(2,'0');
  return y+'-'+p(d.getUTCMonth()+1)+'-'+p(d.getUTCDate());
}
function ruPuesto(cat){const c=ruNorm(cat);
  if(/encargad/.test(c)&&/sub/.test(c))return 'Subencargado/a'; if(/^sub/.test(c))return 'Subencargado/a';
  if(/encargad/.test(c))return 'Encargado/a'; if(/vendedor/.test(c))return 'Vendedor/a';
  if(/cajer/.test(c))return 'Cajero/a'; if(/maestranza|deposito|repositor|chofer/.test(c))return 'Depósito';
  if(/administrativ|administracion|contable|sistemas|rrhh|geren/.test(c))return 'Administrativo/a'; return 'Otro';}
const ruRegimen=j=>{const n=Number(String(j).replace(',','.'));return isFinite(n)&&n>=48?'Full Time':(isFinite(n)&&n>0?'Part Time':'');};
const RU_DIVISOR={'diagonal 80':'diagonal','plaza italia':'plaza','city bell':'city-bell','kids':'kids','8':'calle-47','12':'calle-12','47':'calle-47','outlet':'calle-55','ensenada':'ensenada','los hornos':'los-hornos','gonnet':'gonnet','berisso':'berisso','49':'calle-49','44':'av-44','adidas 7':'adidas','adidas 12':'adidas-12','adidas original':'originals','aurelius 10':'aurelius-10','aurelius 12':'aurelius-12','aurelius cb':'aurelius-cb','aurelius 5':'aurelius-5','e-commerce':'ecommerce','ecommerce':'ecommerce','deposito':'deposito','administracion':'administracion','externos':'externos'};
const RU_GRIDLAB={'diagonal 80':'diagonal','suc. plaza italia':'plaza','suc. city bell':'city-bell','kids':'kids','suc. 12':'calle-12','suc. 47':'calle-47','suc outlet':'calle-55','ensenada':'ensenada','los hornos':'los-hornos','gonnet':'gonnet','berisso':'berisso','suc 49':'calle-49','suc 44':'av-44','adidas 7':'adidas','adidas 12':'adidas-12','adidas original':'originals','aurelius 10':'aurelius-10','aurelius 12':'aurelius-12','aurelius cb':'aurelius-cb','aurelius 5':'aurelius-5','e-commerce':'ecommerce','deposito':'deposito','administracion':'administracion','externos':'externos'};
const RU_SEP=new Set(['sub','cajera','cajeras','cajero','choferes','chofer']);
const ruNormDiv=s=>ruNorm(s).replace(/^suc\.? ?/,'').replace(/^sucursal ?/,'').trim();
function ruRows(wb, hoja){
  const name=Object.keys(wb.Sheets).find(n=>n.toLowerCase().trim()===hoja.toLowerCase().trim());
  if(!name) return [];
  return XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, raw:true, defval:''});
}
function parseRegistroUnico(wb){
  // --- grilla persona -> sucursal (hoja "Estado actual") ---
  const grid=ruRows(wb,'Estado actual'); const head=grid[0]||[]; const colSlug={};
  for(let c=0;c<head.length;c++){ const lab=ruClean(head[c]).toLowerCase(); if(RU_GRIDLAB[lab]) colSlug[c]=RU_GRIDLAB[lab]; }
  const sucMap={};
  for(let r=1;r<grid.length;r++){ for(const c in colSlug){ const nm=ruClean(grid[r][c]); if(!nm)continue; const nn=ruNorm(nm); if(!nn||RU_SEP.has(nn))continue; if(!sucMap[nn])sucMap[nn]=colSlug[c]; } }
  const gridKeys=Object.keys(sucMap);
  const gridByPair={}; gridKeys.forEach(k=>{const t=k.split(' ');if(t.length>=2){const p=t[0]+' '+t[1];(gridByPair[p]=gridByPair[p]||new Set()).add(sucMap[k]);}});
  const tokset=s=>new Set(s.split(' ').filter(x=>x.length>1));
  const gridTok=gridKeys.map(k=>({slug:sucMap[k],toks:tokset(k)}));
  const subset=(a,b)=>{for(const x of a)if(!b.has(x))return false;return true;};
  const matchSuc=nn=>{
    if(sucMap[nn])return sucMap[nn]; const at=tokset(nn); let hit=null,amb=false;
    for(const g of gridTok){ if(g.toks.size<2||at.size<2)continue; if((subset(g.toks,at)||subset(at,g.toks))&&[...g.toks][0]===[...at][0]){ if(hit&&hit!==g.slug)amb=true; hit=g.slug; } }
    if(hit&&!amb)return hit;
    const t=nn.split(' '); if(t.length>=2){const s=gridByPair[t[0]+' '+t[1]]; if(s&&s.size===1)return [...s][0];}
    return null;
  };
  // --- ACTIVOS (por secciones de sucursal) ---
  const A=ruRows(wb,'ACTIVOS'); const activos=[]; let curSuc=null;
  for(let r=2;r<A.length;r++){ const row=A[r]; const nombre=ruClean(row[2]); if(!nombre)continue;
    if(nombre==='Empleado'||ruClean(row[4])==='Jornada')continue;
    const dv=RU_DIVISOR[ruNormDiv(nombre)]; if(dv){ if(!row[6])curSuc=dv; continue; }
    if(/^(mercado libre|ingresantes)$/.test(ruNorm(nombre)))continue;
    if(!row[6]&&!row[5])continue;
    const nn=ruNorm(nombre);
    activos.push({ nombre:ruCap(nombre), cuil:ruClean(row[6]), sucursal:curSuc||matchSuc(nn),
      puesto:ruPuesto(row[3]), regimen:ruRegimen(row[4]), ingreso:ruSerialISO(row[5]),
      nacimiento:ruSerialISO(row[7]), categoria:ruClean(row[3]), telefono:ruClean(row[9])||ruClean(row[10]),
      direccion:[ [ruClean(row[11]),ruClean(row[12]),ruClean(row[13])].filter(Boolean).join(' '), ruClean(row[14]) ].filter(Boolean).join(', '),
      legajo:ruClean(row[8]) });
  }
  // --- BAJAS ---
  const B=ruRows(wb,'BAJAS'); const bajas=[];
  for(let r=2;r<B.length;r++){ const row=B[r]; const nombre=ruClean(row[2]); if(!nombre)continue;
    const baja=ruSerialISO(row[15]), ing=ruSerialISO(row[4]); if(!baja&&!ing)continue;
    bajas.push({ nombre:ruCap(nombre), cuil:ruClean(row[5]), categoria:ruClean(row[3]), puesto:ruPuesto(row[3]),
      ingreso:ing, legajo:ruClean(row[7]), baja_fecha:baja, tipo:ruClean(row[16])||'Otro' });
  }
  return {activos, bajas};
}
function ruCorteCutoff(c){
  if(c==='none') return null; if(c==='all') return '0000-00-00'; if(c==='2024') return '2024-01-01';
  const d=new Date(); d.setMonth(d.getMonth()-(c==='12m'?12:3)); const p=x=>String(x).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
// Arma el nodo resultante (merge o reemplazo) sin escribir. base = legajos actuales.
function planActualizar(parsed, corte, modo, base){
  const result = modo==='replace' ? {} : {...base};
  const byDni={}, byNom={};
  Object.entries(base).forEach(([k,l])=>{ if(l.dni) byDni[l.dni]=k; if(l.nombre) byNom[ruNorm(l.nombre)]=k; });
  const keyDe=(dni,nombre)=>{ if(modo==='replace') return 'reg-'+(dni||('n'+ruNorm(nombre).replace(/ /g,'-'))); return (dni&&byDni[dni])||byNom[ruNorm(nombre)]||('reg-'+(dni||('n'+ruNorm(nombre).replace(/ /g,'-')))); };
  let nuevos=0, actualizados=0, bajasN=0; const sinSuc=[];
  parsed.activos.forEach(a=>{
    const dni=ruDni(a.cuil); const key=keyDe(dni,a.nombre); const prev=result[key];
    const m = prev?{...prev}:{creado:nowISO()};
    m.nombre=a.nombre; m.dni=dni; m.cuil=a.cuil||''; m.puesto=a.puesto; m.regimen=a.regimen;
    m.ingreso=a.ingreso||m.ingreso||null; m.nacimiento=a.nacimiento||m.nacimiento||null;
    m.categoria=a.categoria||''; m.telefono=a.telefono||m.telefono||''; m.direccion=a.direccion||m.direccion||'';
    m.legajo_nro=a.legajo||m.legajo_nro||''; m.sucursal=a.sucursal||m.sucursal||null;
    m.estado='activo'; m.baja_fecha=null; m.baja_motivo=null; m.origen='registro-unico'; m.actualizado=nowISO();
    if(prev&&base[key]) actualizados++; else nuevos++;
    if(!m.sucursal) sinSuc.push(a.nombre);
    result[key]=m;
  });
  const cutoff=ruCorteCutoff(corte);
  if(cutoff!==null){
    parsed.bajas.forEach(b=>{
      if(!b.baja_fecha||b.baja_fecha<cutoff) return;
      const dni=ruDni(b.cuil); const key=keyDe(dni,b.nombre); const prev=result[key];
      const m = prev?{...prev}:{creado:nowISO()};
      m.nombre=b.nombre; m.dni=dni; m.cuil=b.cuil||''; m.puesto=b.puesto; m.categoria=b.categoria||'';
      m.ingreso=b.ingreso||m.ingreso||null; m.legajo_nro=b.legajo||m.legajo_nro||'';
      m.estado='baja'; m.baja_fecha=b.baja_fecha; m.baja_motivo=b.tipo||'Otro'; m.sucursal=m.sucursal||null;
      m.origen='registro-unico'; m.actualizado=nowISO(); bajasN++;
      result[key]=m;
    });
  }
  return {result, nuevos, actualizados, bajasN, sinSuc, total:Object.keys(result).length};
}
function abrirActualizar(){
  if(typeof XLSX==='undefined'){ toast('Excel (SheetJS) no cargó todavía','err'); return; }
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.xlsx,.xls';
  inp.onchange=()=>{ const f=inp.files[0]; if(!f)return;
    openModal('Actualizar desde Excel', `<div class="state"><div class="spinner"></div>Leyendo ${esc(f.name)}…</div>`, '');
    const rd=new FileReader();
    rd.onload=e=>{ try{
        const wb=XLSX.read(new Uint8Array(e.target.result), {type:'array'});
        REG_PARSED=parseRegistroUnico(wb);
        if(!REG_PARSED.activos.length){ throw new Error('sin activos'); }
        previewActualizar(f.name);
      }catch(err){ console.error(err);
        openModal('Actualizar desde Excel', `<div class="empty"><div class="ic">⚠️</div><div class="t">No pude leer el Excel</div><div class="s">Revisá que tenga las hojas <b>ACTIVOS</b>, <b>BAJAS</b> y <b>Estado actual</b>.</div></div>`, `<button class="btn btn-primary" id="mCancel">Cerrar</button>`);
        $('mCancel').onclick=closeModal;
      } };
    rd.readAsArrayBuffer(f);
  };
  inp.click();
}
function previewActualizar(fname){
  const render1=()=>{
    const corte=$('ruCorte')?$('ruCorte').value:'3m'; const modo=$('ruModo')?$('ruModo').value:'merge';
    const plan=planActualizar(REG_PARSED, corte, modo, LEGAJOS);
    const conSuc=REG_PARSED.activos.filter(a=>a.sucursal).length;
    $('ruStats').innerHTML=`
      <div class="kpis" style="margin-bottom:12px">
        <div class="kpi info"><div class="k">Activos en el Excel</div><div class="v">${REG_PARSED.activos.length}</div><div class="s">${conSuc} con sucursal · ${REG_PARSED.activos.length-conSuc} sin asignar</div></div>
        <div class="kpi ok"><div class="k">${modo==='replace'?'A crear':'Nuevos'}</div><div class="v">${plan.nuevos}</div></div>
        <div class="kpi warn"><div class="k">${modo==='replace'?'—':'Se actualizan'}</div><div class="v">${modo==='replace'?'—':plan.actualizados}</div></div>
        <div class="kpi bad"><div class="k">Bajas a cargar</div><div class="v">${plan.bajasN}</div></div>
      </div>
      <div class="hintline">Quedarán <b>${plan.total}</b> legajos en total tras aplicar.${plan.sinSuc.length?` <b>${plan.sinSuc.length}</b> activos sin sucursal (se completan a mano después).`:''}</div>`;
  };
  const body=`
    <div class="hintline">Archivo: <b>${esc(fname)}</b> · ${REG_PARSED.activos.length} activos · ${REG_PARSED.bajas.length} bajas en el histórico.</div>
    <div class="frow">
      <div class="f"><label>Bajas a importar</label><select class="sel" id="ruCorte">
        <option value="3m" selected>Últimos 3 meses</option>
        <option value="12m">Últimos 12 meses</option>
        <option value="2024">Desde 2024</option>
        <option value="all">Todas</option>
        <option value="none">Ninguna</option>
      </select></div>
      <div class="f"><label>Modo</label><select class="sel" id="ruModo">
        <option value="merge" selected>Actualizar (no borra)</option>
        <option value="replace">Reemplazar todo</option>
      </select></div>
    </div>
    <div id="ruStats"></div>
    <div class="banner info" id="ruModoNota" style="margin-top:4px"></div>`;
  openModal('Actualizar desde Excel', body, `<button class="btn btn-outline" id="mCancel">Cancelar</button><button class="btn btn-primary" id="ruApply">Aplicar</button>`);
  const nota=()=>{ const modo=$('ruModo').value; $('ruModoNota').innerHTML = modo==='replace'
    ? '<b>Reemplazar todo</b>: borra los legajos actuales y deja solo lo del Excel. Perdés ediciones y asignaciones hechas a mano.'
    : '<b>Actualizar</b>: cruza por DNI, refresca los datos de cada persona y agrega los nuevos. No borra a nadie ni pisa la sucursal puesta a mano.'; };
  $('ruCorte').onchange=render1; $('ruModo').onchange=()=>{render1();nota();};
  render1(); nota();
  $('mCancel').onclick=closeModal;
  $('ruApply').onclick=aplicarActualizar;
}
async function aplicarActualizar(){
  const corte=$('ruCorte').value, modo=$('ruModo').value;
  $('ruApply').disabled=true; $('ruApply').textContent='Aplicando…';
  try{
    const full = HAS_DB ? (await fbGet(ROOT+'/legajos')||{}) : {...LEGAJOS};
    const plan = planActualizar(REG_PARSED, corte, modo, full);
    if(HAS_DB) await fbPut(ROOT+'/legajos', plan.result);
    await recargar(); closeModal(); state.tab='legajos'; syncTabs(); render();
    toast(`Listo: ${plan.nuevos} nuevos · ${plan.actualizados} actualizados · ${plan.bajasN} bajas`,'ok');
  }catch(e){ console.error(e); toast('No se pudo aplicar','err'); $('ruApply').disabled=false; $('ruApply').textContent='Aplicar'; }
}

/* ============================================================
   EXPORTAR NÓMINA (ExcelJS, estilo del OC de Managment)
   ============================================================ */
async function exportarNovedades(){
  if(typeof ExcelJS==='undefined'){ toast('Excel no disponible','err'); return; }
  const list=novedadesOrden();
  if(!list.length){ toast('No hay novedades para exportar','err'); return; }
  try{
    const wb=new ExcelJS.Workbook(); wb.creator='Mateu Sports — RRHH';
    const ws=wb.addWorksheet('Novedades', {views:[{state:'frozen', ySplit:3}]});
    ws.columns=[
      {key:'suc',width:22},{key:'nombre',width:28},{key:'dni',width:14},
      {key:'concepto',width:20},{key:'valor',width:14},{key:'detalle',width:34},
    ];
    // membrete
    ws.mergeCells('A1:F1');
    const t=ws.getCell('A1'); t.value='MATEU SPORTS · Novedades de nómina — '+periodoLabel(state.novPeriodo);
    t.font={name:'Arial',size:14,bold:true,color:{argb:'FF0B1527'}}; t.alignment={vertical:'middle'};
    ws.getRow(1).height=24;
    ws.mergeCells('A2:F2');
    const st=ws.getCell('A2'); st.value='Generado '+nowISO().replace('T',' ')+' · para el estudio contable';
    st.font={name:'Arial',size:9,italic:true,color:{argb:'FF6B7A99'}};
    // header
    const head=['Sucursal','Nombre','DNI','Concepto','Valor','Detalle'];
    const hr=ws.getRow(3); head.forEach((h,i)=>{ const c=hr.getCell(i+1); c.value=h; c.font={name:'Arial',size:10,bold:true,color:{argb:'FFFFFFFF'}}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF0B1527'}}; c.alignment={vertical:'middle'}; c.border={bottom:{style:'thin',color:{argb:'FFCC0000'}}}; });
    hr.height=20;
    // filas ordenadas por sucursal + nombre
    const rows=list.map(n=>{ const l=LEGAJOS[n.legajoId]||{}; const tc=TIPOS_NOV[n.tipo]||TIPOS_NOV.otro; return {suc:sucLabel(l.sucursal), nombre:l.nombre||'—', dni:l.dni||'', concepto:tc.label, unidad:tc.unidad, valor:num(n.valor), detalle:n.detalle||''}; })
      .sort((a,b)=>cmp(a.suc,b.suc)||cmp(a.nombre,b.nombre));
    rows.forEach(r=>{
      const row=ws.addRow([r.suc,r.nombre,r.dni,r.concepto, r.unidad==='$'?r.valor:(r.valor+' '+r.unidad), r.detalle]);
      if(r.unidad==='$'){ row.getCell(5).numFmt='"$"#,##0'; }
      row.eachCell(c=>{ c.font={name:'Arial',size:10}; c.border={bottom:{style:'hair',color:{argb:'FFDCE3F0'}}}; });
    });
    ws.autoFilter='A3:F3';
    const buf=await wb.xlsx.writeBuffer();
    const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='Novedades-nomina-'+state.novPeriodo+'.xlsx'; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast('Excel generado','ok');
  }catch(e){ console.error(e); toast('No se pudo exportar','err'); }
}
