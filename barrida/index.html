// filtro de selección múltiple: sin nada tildado = todas; el caso de uso típico
// es "Todas" y destildar una (p.ej. sacar NIÑO para achicar la lista de talles)
// ¿hay algún filtro de navegación puesto? (los tildes de Mostrar/Sumar no cuentan)
function hayFiltros(f){ return !!(f.suc||f.rubro||f.marca||f.tipoprod||f.q||f.discs.length||f.subrubros.length); }
// chips de los filtros puestos: se ve de un vistazo por qué está recortada la lista
function chipsFiltros(f, sucBySlug){
  const c=(k,v,lbl,txt)=>'<span class="fchip"><i>'+esc(lbl)+'</i>'+esc(txt)+'<button type="button" data-fk="'+k+'" data-fv="'+esc(v)+'" title="Sacar este filtro">✕</button></span>';
  let out='';
  if(f.suc)      out+=c('suc','',      'Sucursal', sucBySlug[f.suc]||f.suc);
  if(f.rubro)    out+=c('rubro','',    'Rubro',    stripNN(f.rubro));
  if(f.marca)    out+=c('marca','',    'Marca',    f.marca);
  if(f.tipoprod) out+=c('tipoprod','', 'Tipo',     stripNN(f.tipoprod));
  f.discs.forEach(v=>{ out+=c('discs',v,'Disciplina',stripNN(v)); });
  f.subrubros.forEach(v=>{ out+=c('subrubros',v,'Subrubro',stripNN(v)); });
  if(f.q)        out+=c('q','',        'Buscar',   f.q);
  return out;
}

// De la última barrida GUARDADA anterior a esta semana: qué se le sugirió a cada sucursal.
// Sirve para marcar lo que se repite (o no llegó, o el artículo rota fuerte y hay que recomprar).
async function cargarSemanaPrevia(sem){
  if(!FIREBASE_DB_URL) return null;
  try{
    const keys=await conTimeout(fbGet(ROOT+'/barridas','shallow=true'), 6000);
    const prev=Object.keys(keys||{}).filter(k=>k<sem).sort().pop();
    if(!prev) return null;
    const rep=await conTimeout(fbGet(ROOT+'/barridas/'+prev+'/reposicion'), 10000);
    if(!rep) return null;
    const map={};
    Object.entries(rep).forEach(([slug,filas])=>{ (filas||[]).forEach(r=>{ if(r&&r.id) map[r.id+'|'+slug]=(map[r.id+'|'+slug]||0)+(r.sugerido||0); }); });
    return { semana:prev, map };
  }catch(e){ return null; }
}

async function procesarBarrida(){
  if(!state.files.ventas || !state.files.reserva){ toast('Faltan las dos hojas','err'); return; }
  let histPrev=null, histSnaps=[];
  try{
    if(FIREBASE_DB_URL){
      // timeout: si la base no existe / está lenta, no bloquear el procesamiento
      const hist = await Promise.race([ fbGet(ROOT+'/reservaHist'), new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),6000)) ]);
      if(hist){
        const keys=Object.keys(hist).filter(k=>k<state.semana).sort().reverse();
        histSnaps=keys.map(k=>hist[k]||{});
        histPrev=histSnaps[0]||null;
      }
    }
  }catch(e){ /* si falla la base, seguimos sin histórico */ }
  // fuentes de la prioridad (meses de stock + categorías); si fallan, se procesa igual
  if(!PRIO.cargado){ toast('Cargando meses de stock y categorías…'); try{ await conTimeout(cargarPrioridad(),20000); }catch(e){ PRIO.cargado=true; } }
  // stock por sucursal guardado para la semana (si no hay archivo cargado): se baja recién acá
  try{ await asegurarStockData(); }catch(e){ toast('No pude bajar el stock por sucursal guardado; sigo sin él','err'); }
  // qué se le sugirió a cada sucursal en la última barrida guardada (para marcar lo que se repite)
  const prevRep = await cargarSemanaPrevia(state.semana);
  try{
    state.resultado=computar(histPrev, histSnaps);
    state.resultado.prioFuentes={ stock: PRIO.stock?('meses de stock '+PRIO.stockMes):'', cats: PRIO.catsOrigen||'' };
    state.resultado.previa = prevRep;              // qué se le sugirió a cada sucursal la semana pasada
    // lo ya bajado de la base, para recalcular sin volver a pedirlo (recalcular())
    state._proc = { histPrev, histSnaps, prioFuentes:state.resultado.prioFuentes, previa:prevRep };
    state.transf=null;                            // el cruce de transferencias es de la semana que se abrió
    aplicarVaciado(); aplicarUnidadesCurva();
    state.resultadoSemana=null;
    render();
    toast('Barrida procesada','ok');
  }catch(err){ console.error(err); toast('Error al procesar: '+(err.message||err),'err'); }
}

// Rehace el cruce con los mismos archivos y lo que ya se bajó de la base (histórico, semana
// previa, meses de stock, stock de la semana). Para los parámetros que cambian QUÉ reserva se
// reparte (los días de ingreso), que viven en computar() y no en los aplicar…() de pantalla.
function recalcular(){
  const P=state._proc;
  if(!P || !state.files.ventas || !state.files.reserva){ render(); return; }
  try{
    const transf=state.transf;
    state.resultado=computar(P.histPrev, P.histSnaps);
    state.resultado.prioFuentes=P.prioFuentes; state.resultado.previa=P.previa;
    state.transf=transf;
    aplicarVaciado(); aplicarUnidadesCurva();
    state.resultadoSemana=null;                    // cambió lo que se reparte: hay que volver a guardar
  }catch(err){ console.error(err); toast('Error al recalcular: '+(err.message||err),'err'); }
  render();
}

async function guardarBarrida(){
  if(!state.resultado){ toast('Procesá primero','err'); return; }
  if(!FIREBASE_DB_URL){ toast('Sin base configurada','err'); return; }
  const R=state.resultado, sem=state.semana;
  // reposición agrupada por slug (para que cada sucursal baje solo lo suyo)
  // El vaciado de la reserva chica NO va en un nodo aparte: se SUMA a la reposición de cada
  // sucursal, porque para el local es lo mismo (mercadería que baja del depósito) y así lo
  // ven sin cambios Indicadores y el Picking. Solo si el tilde estaba puesto.
  const vacI = state.filtros.vaciar ? vacIdx() : {};
  const repBySlug={};
  R.reposicion.forEach(r=>{
    // con el vaciado puesto, la sucursal con menos del mínimo del artículo no recibe nada
    if(state.filtros.vaciar && vacFueraDe(R, r.id, r.slug)!=null) return;
    const v=vacI[r.id+'|'+r.slug]; if(v) delete vacI[r.id+'|'+r.slug];
    const talles=Object.entries(r.talles).map(([t,d])=>({t, v:d.v, r:d.r, s:d.s}));
    if(v) v.talles.forEach(d=>{ const y=talles.find(x=>x.t===d.t); if(y) y.s+=d.s; else talles.push({t:d.t, v:0, r:d.r, s:d.s}); });
    (repBySlug[r.slug]=repBySlug[r.slug]||[]).push({
      id:r.id, codigo:r.codigo, desc:r.desc, marca:r.marca, rubro:r.rubro, tipo:r.tipo, disc:r.disc||'', genero:r.genero||'',
      vendido:r.vendido, reservaTotal:r.reservaTotal, sugerido:r.sugerido+(v?v.sugerido:0),
      vaciado:v?v.sugerido:0,                            // cuánto de lo que baja es por vaciar la reserva
      prio:r.prio||0, prioDe:r.prioDe||0, pr:r.pr||null,   // prioridad con la que se repartió la reserva
      // talles como ARRAY (no objeto): Firebase no admite claves con punto (ej "8.5").
      talles
    });
  });
  // sucursales que no vendieron el artículo pero lo tienen: reciben solo por el vaciado
  Object.values(vacI).forEach(v=>{ (repBySlug[v.slug]=repBySlug[v.slug]||[]).push({
    id:v.id, codigo:v.codigo, desc:v.desc, marca:v.marca, rubro:v.rubro, tipo:v.tipo, disc:v.disc||'', genero:v.genero||'',
    vendido:v.vendido, reservaTotal:v.reservaTotal, sugerido:v.sugerido, vaciado:v.sugerido, soloVaciado:true,
    prio:v.prio||0, prioDe:v.prioDe||0, pr:v.pr||null,
    talles: v.talles.map(d=>({t:d.t, v:0, r:d.r, s:d.s})),
  }); });
  // completar curva, también por slug: solo lo que quedó con unidades a mandar con los
  // parámetros elegidos (unidades por talle, huecos, mínimo de talles, vendió).
  // Solo si el depósito tildó «Completar curva» en Reposición: así la sucursal (Indicadores) y el
  // Picking ven la curva únicamente cuando se decidió mandarla.
  const curBySlug={};
  (state.filtros.curva ? curvaRows() : []).forEach(r=>{ (curBySlug[r.slug]=curBySlug[r.slug]||[]).push({
    id:r.id, codigo:r.codigo, desc:r.desc, marca:r.marca, rubro:r.rubro, tipo:r.tipo, disc:r.disc||'', genero:r.genero||'',
    enSucursal:r.enSucursal, nTalles:r.nTalles, vendido:r.vendido, reservaTotal:r.reservaTotal, sugerido:r.sugerido,
    prio:r.prio||0, prioDe:r.prioDe||0, pr:r.pr||null,                                        // puesto entre las sucursales del artículo (vendido · meses de stock · categoría)
    talles: r.faltan.filter(d=>d.s>0).map(d=>({t:d.t, r:d.r, s:d.s})),                       // faltantes a mandar
    tiene: Object.keys(r.tallesSuc||{}).sort(cmpTalle).map(t=>({t, q:r.tallesSuc[t]})),      // la curva que ya tiene
  }); });
  const fc=state.filtrosCur;
  const payload={
    meta:{ generado_en:nowISO(), generado_por:SESSION.email||'', semana:sem,
      archivo_ventas:(state.files.ventas||{}).archivo||'', archivo_reserva:(state.files.reserva||{}).archivo||'',
      archivo_stock:(state.files.stock||{}).archivo||'',

      // no repartir lo nuevo: talles con compra de hace menos de `dias` días (0 = sin filtro)
      dias_param:{ reservaConDias:!!R.conDias, activa:!!R.diasNuevo, dias:R.diasNuevo||0, unidades:(R.nuevos||{}).unidades||0, articulos:(R.nuevos||{}).articulos||0 },
      prioFuentes: R.prioFuentes||null,
      totales:R.totales },
    reposicion:repBySlug,
    curva:curBySlug,
    parada:R.parada,
    compras:R.compras,
  };
  try{
    const btn=$('btnGuardar'); if(btn){ btn.disabled=true; btn.textContent='Guardando…'; }
    // si el stock por sucursal vino de un archivo y no quedó guardado para ESTA semana (p.ej. se cambió la semana después de subirlo), se guarda ahora
    if(state.files.stock && !(state.stockSem && state.stockSem.semana===sem && state.stockSem.meta && state.stockSem.meta.archivo===state.files.stock.archivo)) await guardarStockSemana();
    await fbPut(ROOT+'/barridas/'+sem, payload);
    await fbPut(ROOT+'/reservaHist/'+sem, R.snapshot);
    await fbPut(ROOT+'/ultima', sem);

function wireMulti(id, key){
  const f=state.filtros, ms=$(id);
  if(!ms) return;
  ms.ontoggle=()=>{ state.mselOpen = ms.open ? id : (state.mselOpen===id ? null : state.mselOpen); };

    render();
  });

    e.preventDefault();
    f[key] = b.dataset.acc==='todas' ? [...ms.querySelectorAll('input[type=checkbox]')].map(x=>x.value) : [];
    render();
  });
  if(!window.__mselDoc){
    window.__mselDoc=true;
    document.addEventListener('click', e=>{
      // si el clic fue sobre un nodo que un re-render acaba de sacar del DOM
      // (checkbox/botón del propio panel), no es un "clic afuera": ignorar
      if(!document.contains(e.target)) return;
      document.querySelectorAll('details.msel[open]').forEach(el=>{
        if(!el.contains(e.target)){ el.open=false; if(state.mselOpen===el.id) state.mselOpen=null; }
      });

  }

async function abrirBarrida(sem){
  try{
    toast('Abriendo…');
    const b=await fbGet(ROOT+'/barridas/'+sem);
    if(!b){ toast('No encontré esa barrida','err'); return; }
    // reconstituir el shape de state.resultado desde lo guardado
    const reposicion=[];
    Object.entries(b.reposicion||{}).forEach(([slug,arr])=>{ (arr||[]).forEach(r=>{
      // talles vuelve como array [{t,v,r,s}] (por el punto en las claves) → reconstruir objeto
      let talles=r.talles;
      if(Array.isArray(talles)){ const o={}; talles.forEach(d=>{ o[d.t]={v:d.v,r:d.r,s:d.s}; }); talles=o; }
      reposicion.push({ ...r, talles:talles||{}, slug, sucNombre:(SLUG_SUC[slug]||OUTLET_SUC[slug]||slug) });
    }); });
    // completar curva: `talles` = faltantes a mandar [{t,r,s}], `tiene` = curva de la sucursal [{t,q}]
    const curva=[];
    Object.entries(b.curva||{}).forEach(([slug,arr])=>{ (arr||[]).forEach(r=>{
      const tallesSuc={}; (r.tiene||[]).forEach(d=>{ tallesSuc[d.t]=d.q; });
      const faltan=(r.talles||[]).map(d=>({t:d.t, r:d.r, s:d.s, ya:false}));
      const row={ ...r, slug, sucNombre:(SLUG_SUC[slug]||OUTLET_SUC[slug]||slug), tallesSuc, faltan, nTalles:r.nTalles||Object.keys(tallesSuc).length };
      delete row.tiene; delete row.talles;
      marcarInternos(row); curva.push(row);
    }); });
    const conStock = curva.length>0 || !!(b.meta && b.meta.archivo_stock);
    state.resultado={ reposicion, parada:b.parada||[], compras:b.compras||null, curva, vaciado:[], vacDejados:{}, conStock, snapshot:{}, totales:(b.meta&&b.meta.totales)||{}, sinHistorial:false };
    state._proc=null;                         // viene de la base: no hay archivos para recalcular
    if(b.meta && b.meta.curva_param){ const cp=b.meta.curva_param; ['unidades','soloHuecos','soloRotan','minTalles','incluirParados'].forEach(k=>{ if(cp[k]!=null) state.filtrosCur[k]=cp[k]; }); }
    state.filtros.curva = curva.length>0;   // el tilde queda como se guardó
    // el vaciado ya viene sumado a las filas guardadas: el tilde no tiene nada que recalcular
    state.filtros.vaciar = false;
    // el cruce con las transferencias que se haya guardado para esa semana
    state.transf = (b.transf && b.transf.porId) ? Object.assign({porId:{},porCod:{}}, b.transf.meta||{}, {porId:b.transf.porId||{}, porCod:b.transf.porCod||{}}) : null;
    if(b.meta && b.meta.prioFuentes) state.resultado.prioFuentes=b.meta.prioFuentes;
    aplicarUnidadesCurva();
    state.resultadoSemana=sem; state.semana=sem;
    setTab('reposicion');
    toast('Barrida del '+lunesLabel(sem),'ok');
  }catch(err){ toast('No se pudo abrir: '+(err.message||err),'err'); }
}

// hoja estilizada genérica: membrete + banda resumen + header navy + autofiltro + freeze

  ws.getRow(r).height=34; r++;
  ws.mergeCells(r,1,r,nCols);
  const sub=ws.getCell(r,1); sub.value=resumen; sub.font={size:10,name:'Calibri',color:{argb:BRAND.navy}};
  sub.alignment={horizontal:'left',vertical:'middle',indent:1}; sub.fill={type:'pattern',pattern:'solid',fgColor:{argb:BRAND.band}};

  ws.getRow(r).height=18;

// filas de reposición filtradas + ordenadas igual que la tabla
// Filas de Reposición con los filtros de la vista. Con el tilde «Completar curva» cada fila
// suma los talles de curva de esa misma sucursal (curvaFaltan / curvaU) y se agregan filas
// `soloCurva` para las sucursales que no vendieron pero tienen el artículo con talles faltantes.
// `sugerido` de la fila fusionada = reposición + curva (`sugRep` guarda solo la reposición).
// Filas de Reposición con «Completar curva» y «Vaciar la reserva chica» ya sumados, SIN los
// filtros de navegación (sucursal, rubro, búsqueda…): es el reparto completo de la semana,
// que es lo que hay que mirar para saber cuánto queda en el depósito de cada artículo.
function reposFusionadas(){
  const f=state.filtros, R=state.resultado;
  let rows=R.reposicion.slice();
  if(f.curva && R.conStock){
    const idx=curvaIdx();
    rows=rows.map(r=>{ const c=idx[r.id+'|'+r.slug]; if(!c) return r; delete idx[r.id+'|'+r.slug];
      return {...r, sugRep:r.sugerido, curvaFaltan:c.faltan, curvaU:c.sugerido, sugerido:r.sugerido+c.sugerido, tallesSuc:c.tallesSuc}; });
    Object.values(idx).forEach(c=>rows.push({ id:c.id, slug:c.slug, sucNombre:c.sucNombre, codigo:c.codigo, desc:c.desc, marca:c.marca, rubro:c.rubro, tipo:c.tipo, genero:c.genero, disc:c.disc,
      vendido:c.vendido, reservaTotal:c.reservaTotal, talles:{}, pr:c.pr, prio:c.prio, prioDe:c.prioDe,
      soloCurva:true, sugRep:0, curvaFaltan:c.faltan, curvaU:c.sugerido, sugerido:c.sugerido, tallesSuc:c.tallesSuc }));
  }
  if(f.vaciar){
    // «Vaciar la reserva chica» es un MODO, no un extra: la lista queda SOLO con los artículos
    // de poca reserva (pedido de Juli 08/09/2026) y muestra cómo se reparte todo lo que queda.
    const idx=vacIdx();
    const arts=R.vacArts||{};
    rows=rows.filter(r=>arts[r.id]);
    // la sucursal con menos del mínimo del artículo no recibe nada (ni la reposición por venta):
    // la fila queda en cero con el aviso y sus unidades ya se repartieron entre las demás
    rows=rows.map(r=>{ const st=vacFueraDe(R, r.id, r.slug); if(st==null) return r;
      return {...r, talles:{}, sugRep:0, curvaU:0, curvaFaltan:null, sugerido:0, vacFuera:st}; });
    rows=rows.map(r=>{ const c=idx[r.id+'|'+r.slug]; if(!c) return r; delete idx[r.id+'|'+r.slug];
      return {...r, sugRep:(r.sugRep!=null?r.sugRep:r.sugerido), vacFaltan:c.talles, vacU:c.sugerido, sugerido:r.sugerido+c.sugerido}; });
    Object.values(idx).forEach(c=>rows.push({ id:c.id, slug:c.slug, sucNombre:c.sucNombre, codigo:c.codigo, desc:c.desc, marca:c.marca, rubro:c.rubro, tipo:c.tipo, genero:c.genero, disc:c.disc,
      vendido:c.vendido, reservaTotal:c.reservaTotal, talles:{}, pr:c.pr, prio:c.prio, prioDe:c.prioDe,
      soloVaciado:true, sugRep:0, vacFaltan:c.talles, vacU:c.sugerido, sugerido:c.sugerido }));
  }
  return rows;
}
// lo que QUEDA en el depósito por artículo después de repartir todo (reposición + curva + vaciado)
function restantePorArt(){
  const R=state.resultado, res={}, bajan={};
  reposFusionadas().forEach(r=>{ bajan[r.id]=(bajan[r.id]||0)+(r.sugerido||0); if(res[r.id]==null) res[r.id]=r.reservaTotal; });
  const out={}; Object.keys(res).forEach(id=>{ out[id]=Math.max(0, res[id]-(bajan[id]||0)); });
  return out;
}
function reposFiltradas(){
  const f=state.filtros;
  let rows=reposFusionadas();
  if(f.excluirVarios) rows=rows.filter(r=>!/varios|facturacion/i.test(r.rubro+' '+r.tipo));
  if(f.soloSugerido) rows=rows.filter(r=>r.sugerido>0 || recortadaPorPrio(r));   // las recortadas por el reparto se ven igual
  if(f.soloFaltante) rows=rows.filter(faltaEn);
  if(f.soloRepite) rows=rows.filter(r=>repiteDe(r)>0);
  if(f.soloSinEnviar && state.transf) rows=rows.filter(r=>{ const e=estadoEnvio(r); return e && (e.k==='no'||e.k==='parcial'); });
  if(f.suc) rows=rows.filter(r=>r.slug===f.suc);
  if(f.rubro) rows=rows.filter(r=>r.rubro===f.rubro);
  if(f.marca) rows=rows.filter(r=>r.marca===f.marca);
  if(f.discs.length) rows=rows.filter(r=>f.discs.includes(r.disc||''));
  if(f.subrubros.length) rows=rows.filter(r=>f.subrubros.includes(r.genero||''));
  if(f.tipoprod) rows=rows.filter(r=>r.tipo===f.tipoprod);
  if(f.q){ const q=f.q.toLowerCase(); rows=rows.filter(r=>(r.desc+' '+r.codigo+' '+r.id+' '+r.marca).toLowerCase().includes(q)); }
  const s=state.sortRep;
  if(s.k==='art'){
    // agrupado por artículo: primero los que más unidades bajan, y dentro de cada artículo
    // las sucursales por prioridad (así se arma de una sola pasada por el depósito)
    const tot={}; rows.forEach(r=>{ tot[r.id]=(tot[r.id]||0)+(r.sugerido||0); });
    rows.sort((a,b)=>((tot[b.id]-tot[a.id])||cmp(a.desc,b.desc)||cmp(a.id,b.id))*(s.dir<0?1:-1)
      || (a.prio||99)-(b.prio||99) || cmp(a.sucNombre,b.sucNombre));
  } else {
    rows.sort((a,b)=>{ const va=a[s.k],vb=b[s.k]; return (typeof va==='number'?va-vb:cmp(va,vb))*s.dir; });
  }
  return rows;
}
// Rótulos del membrete y sufijo del nombre de archivo a partir de los filtros.
function exportLabels(rubro, marca, extras){
  const stripNN = s => String(s||'').replace(/^\d+\s*[-–]\s*/,'');
  const rubroLbl = rubro ? stripNN(rubro).toUpperCase() : 'TODOS LOS RUBROS';
  const extra = (extras||[]).filter(Boolean).map(x=>stripNN(x).toUpperCase()).join(' · ');
  const marcaLbl = (marca ? String(marca).toUpperCase() : 'TODAS LAS MARCAS') + (extra?'  ·  '+extra:'');
  const part=(s)=> s? '-'+stripNN(s).replace(/[^A-Za-z0-9]+/g,'') : '';
  return { rubro:rubroLbl, marca:marcaLbl, file: part(rubro)+part(marca)+(extras||[]).map(part).join('') };
}

// Planilla "del depósito", compartida por Reposición y Completar curva:
// Código · Artículo · Descripción · Destino · [talles = cantidad a mandar] · columnas de la derecha.
// cfg = { hoja, titulo, subtitulo, resumen, rows, talles, celda(row,t)->{val,falta},
//         derecha:[{h, w?, val(row), total?, falta?(row)}], archivo }
async function exportPlanilla(cfg){
  if(typeof ExcelJS==='undefined'){ toast('ExcelJS no cargó; recargá la página','err'); return; }
  const {rows, talles, derecha}=cfg;
  const izq=['Código','Artículo','Descripción','Destino'];
  const headers=[...izq, ...talles, ...derecha.map(d=>d.h)];
  const nCols=headers.length; const LZ=izq.length;
  const wb=new ExcelJS.Workbook();
  const ws=wb.addWorksheet(cfg.hoja, {views:[{showGridLines:false}]});
  ws.columns=[{width:16},{width:12},{width:36},{width:20}, ...talles.map(()=>({width:8})), ...derecha.map(d=>({width:d.w||9}))];

  let r=1;
  ws.mergeCells(r,1,r,nCols);
  const tit=ws.getCell(r,1);
  tit.value={ richText:[
    {font:{bold:true,size:15,name:'Calibri',color:{argb:BRAND.navy}},text:cfg.titulo+'\n'},
    {font:{bold:true,size:11,name:'Calibri',color:{argb:BRAND.red}},text:cfg.subtitulo},
    {font:{size:9,name:'Calibri',color:{argb:BRAND.muted}},text:'   ·  Depósito Central  ·  Semana del '+lunesLabel(state.semana)} ]};
  tit.alignment={horizontal:'left',vertical:'middle',wrapText:true,indent:1};
  for(let c=1;c<=nCols;c++){ ws.getCell(r,c).fill={type:'pattern',pattern:'solid',fgColor:{argb:BRAND.white}}; ws.getCell(r,c).border={bottom:{style:'medium',color:{argb:BRAND.red}}}; }
  ws.getRow(r).height=38; r++;

  // fila de resumen opcional (Reposición no la lleva: pedido de Juli 07/09/2026)
  if(cfg.resumen){
    ws.mergeCells(r,1,r,nCols);
    const sub=ws.getCell(r,1);
    sub.value=cfg.resumen;
    sub.font={size:10,name:'Calibri',color:{argb:BRAND.navy}}; sub.alignment={horizontal:'left',vertical:'middle',indent:1};
    sub.fill={type:'pattern',pattern:'solid',fgColor:{argb:BRAND.band}};
    ws.getRow(r).height=20; r+=2;
  }

  const headerRowIdx=r;
  const esTalleCol = i => i>=LZ && i<LZ+talles.length;   // i base 0
  headers.forEach((h,i)=>{ const c=ws.getCell(r,i+1); c.value=h; c.font={bold:true,color:{argb:BRAND.white},size:i<LZ?10:11,name:'Calibri'};
    // header de talles con banda vertical alternada (para no confundir columnas)
    const fill = esTalleCol(i) ? ((i-LZ)%2===0?BRAND.navy:BRAND.navyMid) : BRAND.navy;
    c.fill={type:'pattern',pattern:'solid',fgColor:{argb:fill}}; c.alignment={horizontal:i<LZ?'left':'center',vertical:'middle'};
    const bd=thinBorder(BRAND.navy); if(i===LZ || i===LZ+talles.length) bd.left={style:'medium',color:{argb:BRAND.sep}}; c.border=bd; });
  ws.getRow(r).height=25; r++;

  // filas: fondo blanco y bordes finos en todas las celdas (pedido de Juli 07/09/2026; antes bandas alternadas + separadores gruesos)
  rows.forEach((row,i)=>{
    const bg=BRAND.white;
    // izquierda: Código (barras) · Artículo (ID ITEM) · Descripción · Destino
    [row.codigo||'', row.id, row.desc, row.sucNombre].forEach((v,idx)=>{ const c=ws.getCell(r,idx+1); c.value=(v===''?null:v);
      c.font={size:10,bold:true,name:'Calibri',color:{argb:BRAND.navy}}; c.alignment={horizontal:'left',vertical:'middle'};
      c.fill={type:'pattern',pattern:'solid',fgColor:{argb:bg}}; c.border=thinBorder(BRAND.border); });
    // talles = cantidad a mandar; rojo si la reserva no alcanza (lo decide cfg.celda).
    // Banda VERTICAL alternada por columna (no por fila) para que no se confundan los talles.
    talles.forEach((t,ti)=>{ const c=ws.getCell(r,LZ+ti+1); const d=cfg.celda(row,t);
      c.value = d.val;
      c.alignment={horizontal:'center',vertical:'middle'};
      c.border=thinBorder(BRAND.border);
      if(d.falta){ c.font={size:11,bold:true,name:'Calibri',color:{argb:BRAND.faltaTxt}}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:BRAND.faltaBg}}; }
      else { c.font={size:11,bold:true,name:'Calibri',color:{argb:BRAND.navy}}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:bg}}; }
    });
    // derecha: Total y las analíticas
    derecha.forEach((d,idx)=>{ const c=ws.getCell(r,LZ+talles.length+idx+1); const v=d.val(row); c.value=(v===''||v==null?null:v);
      c.alignment={horizontal:'center',vertical:'middle'};
      c.border=thinBorder(BRAND.border);
      const esFaltaCol=!!(d.falta && d.falta(row));
      c.font={size:10,bold:true,name:'Calibri',color:{argb:esFaltaCol?BRAND.faltaTxt:BRAND.navy}};
      c.fill={type:'pattern',pattern:'solid',fgColor:{argb:esFaltaCol?BRAND.faltaBg:bg}};
    });
    ws.getRow(r).height=25;   // todas las filas de datos a 25 (pedido de Juli 07/09/2026)
    r++;
  });

  // autofiltro en las columnas de identidad (Código..Destino); los talles quedan sin flecha.
  ws.autoFilter={ from:{row:headerRowIdx,column:1}, to:{row:headerRowIdx,column:LZ} };
  ws.views=[{state:'frozen', xSplit:LZ, ySplit:headerRowIdx, showGridLines:false}];
  // al imprimir, membrete + encabezados (incluida la fila de talles) se repiten arriba en TODAS las hojas
  // y las columnas de identidad Código..Destino a la izquierda (pedido de Juli 08/09/2026)
  ws.pageSetup={orientation:'landscape', fitToPage:true, fitToWidth:1, fitToHeight:0,
    printTitlesRow:'1:'+headerRowIdx, printTitlesColumn:'A:'+String.fromCharCode(64+LZ),
    margins:{left:0.3,right:0.3,top:0.4,bottom:0.4,header:0.2,footer:0.2}};
  await downloadWorkbook(wb, cfg.archivo);
  toast('Excel generado ✓','ok');
}

async function exportRepXlsx(){
  const R=state.resultado; if(!R) return;
  const f=state.filtros;
  const verRojos = f.verRojos || f.soloFaltante;   // igual que en pantalla
  const rows=reposFiltradas().filter(r=>r.vacFuera==null);   // las que quedaron afuera del vaciado no llevan nada
  if(!rows.length){ toast('No hay filas para exportar','err'); return; }
  // columnas de talle: las que se mandan y, solo si se piden, las que quedaron en cero;
  // más los talles de «Completar curva» y del vaciado.
  const set=new Set(); rows.forEach(r=>{ Object.entries(r.talles).forEach(([t,d])=>{ if(d.s>0 || (verRojos&&d.v>0&&d.s<d.v&&!esNuevoRet(d))) set.add(t); }); (r.curvaFaltan||[]).forEach(d=>{ if(d.s>0) set.add(d.t); }); (r.vacFaltan||[]).forEach(d=>{ if(d.s>0) set.add(d.t); }); });
  const talles=[...set].sort(cmpTalle);
  const lbl=exportLabels(f.rubro, f.marca, [f.tipoprod, f.discs.join('+'), f.subrubros.join('+')]);
  const uCurva=rows.reduce((a,x)=>a+(x.curvaU||0),0), uVac=rows.reduce((a,x)=>a+(x.vacU||0),0);
  const curvaS=(row,t)=>{ const d=(row.curvaFaltan||[]).find(x=>x.t===t); return d?d.s:0; };
  const vacS=(row,t)=>{ const d=(row.vacFaltan||[]).find(x=>x.t===t); return d?d.s:0; };
  await exportPlanilla({
    hoja: f.vaciar?'Vaciado':'Reposición',
    titulo: (f.vaciar?'VACIADO DE RESERVA ':'REPOSICIÓN ')+lbl.rubro,
    subtitulo: lbl.marca+(f.vaciar?'  ·  ARTÍCULOS CON HASTA '+state.filtrosVac.max+' UNIDADES EN EL DEPÓSITO':'')+(uCurva?'  ·  + COMPLETAR CURVA DE TALLES':''),
    // sin fila de resumen ni analíticas (Vendido…Categoría): la planilla del depósito lleva solo lo que hay que mandar
    rows, talles,
    // cantidad a mandar = reposición por venta + talles de curva + vaciado de esa sucursal
    // el 0 rojo del talle que no se puede reponer solo sale si se pidió verlo en pantalla
    celda:(row,t)=>{ const d=row.talles[t]; const sug=(d?d.s:0)+curvaS(row,t)+vacS(row,t); const esFalta=!!(d&&d.v>0&&d.s<d.v&&verRojos&&!esNuevoRet(d)); return { val: sug>0?sug:(esFalta?0:null), falta:esFalta }; },
    derecha:[ {h:'Total',val:r=>r.sugerido,total:true} ],
    archivo:(f.vaciar?'vaciado-reserva':'reposicion')+lbl.file+'-'+state.semana+'.xlsx',
  });
}

/* ============================================================
   REPARTO INICIAL — pestaña aparte de la Barrida (pedido de Juli 10/09/2026)
   La Barrida de reserva repone lo VENDIDO con lo que hay en el depósito (reporte de stock +
   estadística de ventas). El Reparto inicial reparte lo que ENTRÓ: se alimenta de la
   estadística de remitos del sistema y sale REMITO POR REMITO, porque cada remito queda en
   una ubicación del depósito y el operario lo busca por ahí.
   Reglas (las seis de Juli):
     1. Solo lo que entró por los remitos elegidos, agrupado por remito.
     2. A quién y en qué orden: la marca tiene que estar en la Asignación de Marcas de la
        sucursal (calzado / indumentaria; «niño» solo para artículos de niño; si la marca
        tiene disciplinas, la del artículo tiene que estar) → tipo de asignación
        (principal > especial > secundaria) → categoría de la sucursal → venta de la marca en
        el rubro (último mes de Meses de Stock, en tres niveles: alta / media / baja) →
        meses de stock (menos = antes).
     3. Un artículo que entró en varios remitos se reparte JUNTO (una sola curva por
        sucursal) y a cada sucursal se le toman las unidades del remito que ya le está
        dando. Lo repartido se guarda (memoria): si el artículo vuelve a entrar, primero se
        les completa la curva a las que ya lo recibieron.
     4-5. Talles centrales (tabla CENTRALES_DEF, editable): 2 unidades (3 si alcanza); el
        resto de los talles, 1.
     6. Queda en el depósito ~1 curva: 1 unidad de cada talle que tenga 2 o más.
   El export de remitos NO trae talles: cada artículo se abre con la curva que tiene hoy en
   la reserva del depósito (el reporte de stock de la Barrida), repartida entre sus remitos
   según las unidades de cada uno. Si el sistema lo exporta abierto por talle, se usan esos.
   Firebase (recepciones-mateu, nodo barrida/): repartos/<fecha_hora> = {meta, remitos, porSuc},
   remitosRepartidos/<nro> = {rep, fecha, por}, repartoHist/<idItem>/<slug> = {t:[[talle,q]], ts, rep}
   y repartoConfig/centrales.
   ============================================================ */
const REP_SUC = Object.assign({}, SLUG_SUC, SUC_EXTRA, OUTLET_SUC);

const sinAcento = s => String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'');

const repKey = s => String(s==null?'':s).trim().replace(/[.#$\[\]\/]/g,'_') || '_';   // clave Firebase

const sumT = t => Object.values(t||{}).reduce((a,q)=>a+(q>0?q:0),0);

// número de celda: 50.00 · 1,00 · 1.075.241,48

/* ---------- lectura de la estadística de remitos ----------
   Soporta: (a) el pivot del sistema «Estad remitos <año>.csv» (una columna Cant.recibido + Costo
   por mes, encabezados de texto vacíos → las columnas se reconocen por contenido); (b) el Excel
   «Remitos de ingreso» (mismo pivot con encabezados); (c) un export con columna Remito y
   columnas de TALLE (si el sistema lo saca abierto por talle, se usan esos talles). */
function repCsvMatriz(buf){
  const u8=new Uint8Array(buf);
  const utf8 = u8[0]===0xEF && u8[1]===0xBB && u8[2]===0xBF;
  let txt; try{ txt=new TextDecoder(utf8?'utf-8':'windows-1252').decode(buf); }catch(e){ txt=new TextDecoder().decode(buf); }
  if(txt.charCodeAt(0)===0xFEFF) txt=txt.slice(1);
  const lineas=txt.split(/\r?\n/).filter(l=>l.length);
  const l0=lineas[0]||''; const sep=(l0.match(/;/g)||[]).length>=(l0.match(/,/g)||[]).length?';':',';
  return lineas.map(l=>l.split(sep).map(c=>c.trim().replace(/^"(.*)"$/,'$1')));
}
function repEsTalle(l){
  const s=nrmT(l); if(!s || /TOTAL|CANT|COSTO|IMPORTE/.test(s)) return false;
  const n=Number(s); if(isFinite(n)) return n>0 && n<70;
  return TALLES_LETRA.includes(s) || /^(UNI|UNICO|U|\d{1,2}A|\d{1,2}-\d{1,2}|XS\/S|S\/M|M\/L|L\/XL|XL\/XXL|SM|ML|YS|YM|YL|JR|SR)$/.test(s);
}
function repParseRemitos(M, archivo){
  const txt=c=>String(c==null?'':c).trim();
  const lim=Math.min(15, M.length);
  let cantRow=-1, hRow=-1;
  for(let i=0;i<lim;i++){ if((M[i]||[]).some(c=>/cant\.?\s*recib/i.test(txt(c)))){ cantRow=i; break; } }
  for(let i=0;i<lim;i++){ if((M[i]||[]).some(c=>/remito/i.test(txt(c)))){ hRow=i; break; } }
  const qcols=[], tcols=[]; let start, primeraQ;
  const ALI={ remito:/remito|comprobante/i, id:/id\.?\s*item|^item$/i, cod:/c[oó]d/i, desc:/art[ií]culo|descrip/i, marca:/^marca/i,
    rubro:/^rubro/i, genero:/sub\s*-?rubro|g[eé]nero/i, disc:/disciplina/i, tipo:/grupo\s*1|^tipo/i, prov:/proveedor/i };
  const col={};
  const porNombre=(fila, hasta)=>{ for(let j=0;j<hasta;j++){ const h=txt((M[fila]||[])[j]); if(!h) continue; for(const k in ALI){ if(col[k]==null && ALI[k].test(h)){ col[k]=j; break; } } } };
  if(cantRow>=0){
    // pivot: una columna Cant.recibido por mes (el mes está en alguna fila de arriba)
    (M[cantRow]||[]).forEach((c,j)=>{ if(!/cant/i.test(txt(c))) return;
      let mes=null, esTotal=false;
      for(let i=cantRow-1;i>=0;i--){ const v=txt((M[i]||[])[j]); if(!v) continue; if(/total/i.test(v)){ esTotal=true; break; } if(/^\d{1,2}(\.0+)?$/.test(v) && +v>=1 && +v<=12){ mes=+v; break; } }
      if(!esTotal) qcols.push({j, mes});
    });
    if(!qcols.length) throw new Error('Encontré «Cant.recibido» pero ninguna columna de mes.');
    start=cantRow+1; primeraQ=qcols[0].j;
    for(let i=0;i<=cantRow;i++) porNombre(i, primeraQ);
  } else if(hRow>=0){
    // plano: columna Remito + columnas de talle (o una de cantidad)
    const H=M[hRow]||[]; porNombre(hRow, H.length);
    const ident=Object.values(col); const ultimo=ident.length?Math.max(...ident):0;
    for(let j=ultimo+1;j<H.length;j++){ const l=txt(H[j]); if(repEsTalle(l)) tcols.push({j, t:l.replace(/\.0+$/,'')}); else if(/cant|unid/i.test(l) && !tcols.length) qcols.push({j, mes:null}); }
    if(!tcols.length && !qcols.length) throw new Error('Hay una columna «Remito» pero no encontré la cantidad ni columnas de talle.');
    start=hRow+1; primeraQ=(tcols[0]||qcols[0]).j;
  } else {
    throw new Error('No reconocí la estadística de remitos: no hay una fila con «Cant.recibido» ni una columna «Remito». Leí: '+(M[0]||[]).slice(0,12).map(txt).filter(Boolean).join(' · '));
  }
  // columnas de texto que no se reconocieron por nombre: por contenido
  const textCols=[]; for(let j=0;j<primeraQ;j++) textCols.push(j);
  const sample=[]; for(let i=start;i<M.length && sample.length<400;i++){ const r=M[i]||[]; if(textCols.some(j=>txt(r[j]))) sample.push(r); }
  const vals=j=>sample.map(r=>txt(r[j])).filter(Boolean);
  const frac=(j,rx)=>{ const v=vals(j); return v.length ? v.filter(x=>rx.test(x)).length/v.length : 0; };
  const libres=()=>textCols.filter(j=>!Object.values(col).includes(j));
  const pick=(k, score, min)=>{ if(col[k]!=null) return; let best=-1, bs=min; libres().forEach(j=>{ const s=score(j); if(s>bs){ bs=s; best=j; } }); if(best>=0) col[k]=best; };
  pick('remito', j=>frac(j,RX_REMITO), .7);
  pick('id', j=>frac(j,/^\d{4,8}$/), .8);
  pick('rubro', j=>frac(j,/^(\d{2}-)?(CALZADO|INDUMENTARIA|ACCESORIOS|VARIOS)$|^OTROS$/i), .6);
  pick('genero', j=>frac(j,/HOMBRE|DAMA|MUJER|NI.O|UNISEX|INFANT|VARIOS/i), .6);
  pick('cod', j=>{ const v=vals(j); if(!v.length) return 0; const f=v.filter(x=>/^\S{5,}$/.test(x)&&/[A-Z]/i.test(x)&&/\d/.test(x)).length/v.length; return f>=.7 ? f+new Set(v).size/v.length : 0; }, .7);
  pick('desc', j=>{ const v=vals(j); if(!v.length) return 0; const f=v.filter(x=>/\s/.test(x)).length/v.length; return f>=.6 ? v.reduce((a,x)=>a+x.length,0)/v.length : 0; }, 0);
  pick('disc', j=>frac(j,/RUNNING|CASUAL|TRAINING|FUTBOL|ADVENTURE|OUTDOOR|BASQUET|TENIS|PADEL|HOCKEY|NATACION|ORIGINALS|TREKKING|SKATE|VOLEY|RUGBY/i), .3);
  pick('tipo', j=>frac(j,/CALZADO|REMERA|PANTAL|CAMPER|BUZO|SHORT|MEDIA|MOCHIL|BOLSO|GORRO|CAMISET|CALZA|SANDAL|CHINEL|OJOTA|PELOTA|MUSCUL|CHOMBA|CONJUNT|MALLA|TOP|GUANTE|BERMUDA|ANTIPARR|CANILLER|GIFT/i), .4);
  if(col.marca==null && libres().includes(0)) col.marca=0;
  if(col.remito==null) throw new Error('No encontré la columna del número de remito (0005-000…).');
  if(col.id==null && col.cod==null) throw new Error('No encontré la columna del ID ITEM ni la del código del artículo.');
  const anio=(String(archivo||'').match(/20\d{2}/)||[])[0] || String(new Date().getFullYear());
  const g=(r,k)=>col[k]!=null?txt(r[col[k]]):'';
  const map=new Map();
  for(let i=start;i<M.length;i++){
    const r=M[i]||[]; const nro=g(r,'remito'); if(!nro || /total/i.test(nro)) continue;
    const id=g(r,'id').replace(/\.0+$/,''), cod=g(r,'cod'); const k=id||cod; if(!k) continue;
    let f=map.get(nro+'|'+k);
    if(!f){ f={ remito:nro, id:k, cod, desc:g(r,'desc'), marca:g(r,'marca'), rubro:g(r,'rubro'), genero:g(r,'genero'), disc:g(r,'disc'), tipo:g(r,'tipo'), porMes:{}, talles:tcols.length?{}:null, total:0 }; map.set(nro+'|'+k, f); }
    if(tcols.length) tcols.forEach(q=>{ const u=numR(r[q.j]); if(u>0){ f.talles[q.t]=(f.talles[q.t]||0)+u; f.total+=u; } });
    else qcols.forEach(q=>{ const u=numR(r[q.j]); if(u>0){ const m=q.mes!=null?String(q.mes):''; f.porMes[m]=(f.porMes[m]||0)+u; f.total+=u; } });
  }
  const filas=[...map.values()].filter(f=>f.total>0);
  const meses=[...new Set(qcols.map(q=>q.mes).filter(m=>m!=null))].filter(m=>filas.some(f=>f.porMes[String(m)]>0)).sort((a,b)=>a-b);
  return { archivo, anio, meses, conTalles:tcols.length>0, filas, nRemitos:new Set(filas.map(f=>f.remito)).size };
}
async function repCargarArchivo(file){
  try{
    toast('Leyendo la estadística de remitos…');
    const buf=await file.arrayBuffer();
    const hojas = /\.(csv|txt)$/i.test(file.name) ? [{name:'CSV', matrix:repCsvMatriz(buf)}] : leerLibro(buf);

    const S=state.rep; S.data=D; S.sel={}; S.res=null; S.abierto=null; S.selOpen=true;

/* ---------- de dónde salen los talles ----------
   Del export si viene abierto por talle; si no, del reporte de stock del depósito cargado en la
   Barrida (o del stock por sucursal, filas «Depósito»). */
function repFuenteReserva(){ return state.files.reserva || state.files.stock || null; }
function repReserva(){
  const f=repFuenteReserva(); if(!f) return null;
  const out={};
  filasDeHoja(f).forEach(r=>{
    if(f.cols.suc>=0 && !/deposito/i.test(sinAcento(r.suc))) return;
    const o=out[r.id]||(out[r.id]={talles:{}, total:0});
    Object.entries(r.talles).forEach(([t,q])=>{ o.talles[t]=(o.talles[t]||0)+q; }); o.total+=r.total;
    // el Excel «Remitos de ingreso» no trae ID ITEM, solo el código: también se busca por ahí
    if(r.meta.cod) out['cod:'+r.meta.cod.toUpperCase()]=o;
  });
  return out;
}
// enteros proporcionales a los pesos que suman `total` (mayor resto)
function lrReparto(pesos, total){
  const n=pesos.length; if(total<=0||!n) return pesos.map(()=>0);
  const s=pesos.reduce((a,b)=>a+Math.max(0,b),0); const w=s>0?pesos.map(x=>Math.max(0,x)):pesos.map(()=>1); const sw=w.reduce((a,b)=>a+b,0);
  const base=w.map(x=>Math.floor(x*total/sw)); let resto=total-base.reduce((a,b)=>a+b,0);
  const ord=w.map((x,i)=>({i, fr:x*total/sw-base[i]})).sort((a,b)=>b.fr-a.fr||a.i-b.i);
  for(let k=0;resto>0;k=(k+1)%n){ base[ord[k].i]++; resto--; }
  return base;
}
function repTallesDe(a, reserva){
  if(a.rem.every(r=>r.talles && sumT(r.talles)>0)) return { perRem:a.rem.map(r=>({nro:r.nro, t:Object.assign({},r.talles)})), estimado:false, faltan:0 };
  const R=reserva && (reserva[a.id] || (a.cod && reserva['cod:'+a.cod.toUpperCase()])); if(!R) return null;
  const ts=Object.keys(R.talles).filter(t=>R.talles[t]>0).sort(cmpTalle);
  const totR=ts.reduce((s,t)=>s+R.talles[t],0); if(totR<=0) return null;
  const U=a.rem.reduce((s,r)=>s+r.u,0);
  // la reserva de hoy puede tener stock viejo (más que el remito) o ya haber salido algo (menos)
  const disp = totR<=U ? ts.map(t=>R.talles[t]) : lrReparto(ts.map(t=>R.talles[t]), U);
  const cap=a.rem.map(r=>r.u), perRem=a.rem.map(r=>({nro:r.nro, t:{}}));
  ts.forEach((t,k)=>{ const q=disp[k]; if(q<=0) return;
    const w=cap.map(c=>Math.max(0,c)); const parts=lrReparto(w.some(x=>x>0)?w:a.rem.map(r=>r.u), q);
    parts.forEach((p,i)=>{ if(p>0){ perRem[i].t[t]=(perRem[i].t[t]||0)+p; cap[i]-=p; } }); });
  return { perRem, estimado:true, faltan:Math.max(0,U-totR) };
}

/* ---------- grupo del artículo y talles centrales ---------- */
function repGrupo(a){
  const rub=sinAcento(stripNN(a.rubro)).toUpperCase();
  const gen=sinAcento(stripNN(a.genero)+' '+(a.tipo||'')).toUpperCase();
  const fam = /CALZ/.test(rub)?'calz' : /INDUM/.test(rub)?'ind' : '';
  const g = /INFANT|BEBE|BABY/.test(gen)?'infante' : /\bNIN[OA]S?\b|\bKIDS?\b|JUNIOR/.test(gen)?'nino'
    : /DAMA|MUJER|FEMEN|WOMEN/.test(gen)?'dama' : /HOMBRE|MASCUL|\bMEN\b/.test(gen)?'hombre' : /UNISEX/.test(gen)?'unisex' : '';
  return { fam, g, key: fam&&g ? fam+'-'+g : '' };
}
function repCentralesTabla(){ return Object.assign({}, CENTRALES_DEF, state.rep.centrales||{}); }
function repCentrales(a, labels){
  const G=repGrupo(a);
  if(!G.fam) return { G, set:new Set(), regla:'accesorios: 1 unidad por talle' };
  const tabla=repCentralesTabla(); const mk=G.key+'|'+normMarca(a.marca);
  const lista = G.key ? (tabla[mk]||tabla[G.key]) : null;
  if(lista && lista.length){
    const L=new Set(lista.map(nrmT)); const set=new Set(labels.filter(t=>L.has(nrmT(t))));
    if(set.size) return { G, set, regla:'talles centrales de '+(GRUPO_LBL[G.key]||G.key)+(tabla[mk]?' ('+a.marca+')':'') };
  }
  // sin regla, o el artículo no trae ninguno de esos talles: el/los del medio de su curva
  const ord=labels.slice().sort(cmpTalle); if(ord.length<3) return { G, set:new Set(), regla:'curva corta: 1 por talle' };
  const set=new Set([ord[Math.floor((ord.length-1)/2)], ord[Math.floor(ord.length/2)]]);
  return { G, set, regla:'sin regla para '+(GRUPO_LBL[G.key]||'este tipo')+': los talles del medio' };
}

/* ---------- a quién (Asignación de Marcas) y en qué orden ---------- */
function repAsig(slug, a, G){
  if(SOLO_NINO[slug] && G.fam && G.g!=='nino' && G.g!=='infante') return null;
  const A=PRIO.asig, id=SLUG2MARCAS[slug];
  if(!A || !id) return { tipo:'sin', rank:4, nota:'sin datos de Asignación de Marcas' };
  const listas = G.fam==='calz' ? [A.calz[id]] : G.fam==='ind' ? [A.ind[id]] : [A.calz[id], A.ind[id]];
  const brands=[].concat(...listas.map(l=>l||[]));
  if(!brands.length) return { tipo:'sin', rank:4, nota:'la sucursal todavía no tiene cargada la asignación de '+(G.fam==='ind'?'indumentaria':G.fam==='calz'?'calzado':'marcas') };
  const mk=normMarca(a.marca);
  const b=brands.find(x=>{ const n=normMarca(x&&x.n); return n && mk && (n===mk || (Math.min(n.length,mk.length)>=3 && (n.startsWith(mk)||mk.startsWith(n)))); });
  if(!b) return null;
  const kids = G.g==='nino' || G.g==='infante';
  if(b.t==='nino' && !kids) return null;                         // asignada solo para niño
  const txt=sinAcento((b.d||[]).join(' ')).toLowerCase();
  if(txt){
    if(kids && /adulto|hombre|dama/.test(txt) && !/nin/.test(txt)) return null;
    if(!kids && /\bnin[oa]s?\b/.test(txt) && !/adulto|hombre|dama/.test(txt)) return null;
    if(state.rep.param.respetarDisc){
      const pedidas=DISC_CONOCIDAS.filter(k=>txt.includes(k.slice(0,5)));
      const disc=sinAcento(a.disc).toLowerCase();
      if(pedidas.length && disc && !pedidas.some(k=>disc.includes(k.slice(0,5)))) return null;
    }
  }
  const rank = (b.t==='prio'||b.t==='nino') ? 1 : b.t==='especial' ? 2 : 3;
  return { tipo:b.t||'sec', rank, nota:(b.d&&b.d.length)?b.d.join(', '):'' };
}
const ASIG_LBL = { prio:'marca principal', nino:'marca de niño', especial:'marca especial', sec:'marca secundaria', sin:'sin asignación cargada' };
function repHistDe(id, slug){
  const H=state.rep.hist; const e=H&&H[repKey(id)]&&H[repKey(id)][slug]; if(!e||!e.t) return null;
  if(e.ts && Date.now()-e.ts > REP_MEM_DIAS*864e5) return null;
  const o=deParesT(e.t); return Object.keys(o).length?o:null;
}
function repCandidatos(a, G, destinos){
  const P=state.rep.param, out=[];
  destinos.forEach(slug=>{
    const asig=repAsig(slug, a, G); if(!asig) return;
    const vm=ventasMarcaDe(slug, a.marca, a.rubro);
    out.push({ slug, sucNombre:nombreSuc(slug), asig, pr:prioInfo(slug, a.marca, a.rubro),
      venta:vm?vm.v:0, ventaNivel:vm?vm.nivel:'', hist:P.memoria?repHistDe(a.id, slug):null });
  });
  // la venta pesa en tres niveles (alta / media / baja respecto de la que más vende): así los
  // meses de stock deciden entre sucursales que venden parecido
  const max=Math.max(0, ...out.map(c=>c.venta));
  out.forEach(c=>{ c.vNivel = max<=0 ? 0 : c.venta>=max*0.66 ? 0 : c.venta>=max*0.33 ? 1 : 2; });
  out.sort(cmpReparto);
  out.forEach((c,i)=>{ c.prio=i+1; c.prioDe=out.length; });
  return out;
}
function cmpReparto(a,b){
  const ha=a.hist?0:1, hb=b.hist?0:1; if(ha!==hb) return ha-hb;               // ya lo recibió: se le completa primero
  if(a.asig.rank!==b.asig.rank) return a.asig.rank-b.asig.rank;               // asignación de marcas
  if(a.pr.catRank!==b.pr.catRank) return a.pr.catRank-b.pr.catRank;           // categoría
  if(a.vNivel!==b.vNivel) return a.vNivel-b.vNivel;                           // venta de la marca-rubro
  const ma=a.pr.ms!=null?a.pr.ms:Infinity, mb=b.pr.ms!=null?b.pr.ms:Infinity; // meses de stock
  if(ma!==mb) return ma-mb;
  if(b.venta!==a.venta) return b.venta-a.venta;
  return cmp(a.sucNombre,b.sucNombre);
}
function repPrioTxt(l){
  const p=l.pr||{}, partes=[];
  if(l.hist) partes.push('ya recibió este artículo (se le completa la curva)');
  if(l.asig) partes.push((ASIG_LBL[l.asig.tipo]||l.asig.tipo)+(l.asig.nota?' ('+l.asig.nota+')':''));

  if(l.venta!=null && l.ventaNivel) partes.push('vendió '+fmtInt(l.venta)+' u. de la '+(l.ventaNivel==='marca'?'marca':'rubro')+' el último mes');
  partes.push(p.ms!=null ? p.ms.toLocaleString('es-AR')+' meses de stock'+(p.msNivel==='rubro'?' (rubro)':'') : 'sin meses de stock');

/* ---------- el reparto de UN artículo (todos sus remitos juntos) ----------
   A · curva base: por prioridad, centrales `uCentral` y resto `uResto` (menos lo que ya recibió).
       No se le manda una curva rota: tiene que cubrir `minTalles` talles y algún central.
   B · centrales hasta `maxCentral`, de a una unidad por sucursal.
   C · excedente (opcional): vueltas de a una unidad por talle entre las que ya tienen curva.
   Queda: ~1 curva (`reserva` por talle con 2 o más) + lo que no se repartió.
   Después cada unidad se toma de un remito: la reserva del que más tiene del artículo (una sola
   ubicación) y a cada sucursal del remito que más le cubre / que ya le está dando. */
function repRepartirArt(perRem, cands, central, P){
  const avail={}; perRem.forEach(r=>Object.entries(r.t).forEach(([t,q])=>{ if(q>0) avail[t]=(avail[t]||0)+q; }));
  const talles=Object.keys(avail).sort(cmpTalle);
  const resv={}, d={};
  talles.forEach(t=>{ resv[t] = (P.reserva>0 && avail[t]>=2) ? Math.min(P.reserva, avail[t]-1) : 0; d[t]=avail[t]-resv[t]; });
  const nT=talles.filter(t=>d[t]>0).length, minT=Math.min(P.minTalles, nT);
  const hayCentral=talles.some(t=>central.has(t) && d[t]>0);
  const base=t=>central.has(t)?P.uCentral:P.uResto;
  const tope=t=>central.has(t)?Math.max(P.uCentral,P.maxCentral):P.uResto;
  const dist=cands.map(c=>Object.assign({}, c, { g:{}, tiene:c.hist||{}, ok:false }));
  // A · curva base
  dist.forEach(s=>{
    const g={}; let cubre=0, cubreC=false;
    talles.forEach(t=>{ const ya=s.tiene[t]||0; const q=Math.min(Math.max(0, base(t)-ya), d[t]); if(q>0) g[t]=q; if(ya+q>0){ cubre++; if(central.has(t)) cubreC=true; } });
    const yaLoTiene=sumT(s.tiene)>0, nuevo=sumT(g);
    if(!nuevo){ s.ok=yaLoTiene; return; }
    if(!yaLoTiene && (cubre<minT || (hayCentral && !cubreC))) return;
    Object.entries(g).forEach(([t,q])=>{ d[t]-=q; s.g[t]=q; }); s.ok=true;
  });
  // B · 3.ª unidad en los centrales
  let hubo=true;
  while(hubo){ hubo=false; for(const s of dist){ if(!s.ok) continue; for(const t of talles){
    if(!central.has(t) || d[t]<=0) continue; if((s.tiene[t]||0)+(s.g[t]||0) < tope(t)){ s.g[t]=(s.g[t]||0)+1; d[t]--; hubo=true; } } } }
  // C · excedente
  if(P.excedente){ hubo=true;
    while(hubo){ hubo=false; for(const s of dist){ if(!s.ok) continue; for(const t of talles){ if(d[t]>0){ s.g[t]=(s.g[t]||0)+1; d[t]--; hubo=true; } } } } }
  // ---- a qué remito va cada unidad ----
  const left=perRem.map(r=>Object.assign({}, r.t)), quedaRem=perRem.map(()=>({}));
  const totLeft=i=>sumT(left[i]);
  const ordRes=perRem.map((_,i)=>i).sort((i,j)=>totLeft(j)-totLeft(i) || j-i);
  talles.forEach(t=>{ let q=resv[t]; for(const i of ordRes){ if(q<=0) break; const take=Math.min(q, left[i][t]||0); if(take>0){ left[i][t]-=take; quedaRem[i][t]=(quedaRem[i][t]||0)+take; q-=take; } } });
  const lineas=[];
  dist.forEach(s=>{
    if(!s.ok || !sumT(s.g)) return;
    const cobertura=i=>Object.keys(s.g).reduce((a,t)=>a+Math.min(s.g[t], left[i][t]||0),0);
    const usa=[]; let pref=-1, best=0; left.forEach((_,i)=>{ const c=cobertura(i); if(c>best){ best=c; pref=i; } }); if(pref>=0) usa.push(pref);
    const porRem={};
    Object.keys(s.g).sort(cmpTalle).forEach(t=>{ let q=s.g[t];
      while(q>0){
        let i=usa.find(k=>(left[k][t]||0)>0); if(i==null) i=left.findIndex(x=>(x[t]||0)>0); if(i==null||i<0) break;
        const take=Math.min(q, left[i][t]); left[i][t]-=take; q-=take;
        if(!usa.includes(i)) usa.push(i);
        const o=porRem[i]||(porRem[i]={}); o[t]=(o[t]||0)+take;
      } });
    lineas.push(Object.assign(s, { porRem }));
  });
  left.forEach((l,i)=>Object.entries(l).forEach(([t,q])=>{ if(q>0) quedaRem[i][t]=(quedaRem[i][t]||0)+q; }));
  return { lineas, quedaRem, avail };
}

/* ---------- cálculo del reparto de los remitos elegidos ---------- */
function repCalcular(){
  const S=state.rep, D=S.data, P=S.param, m=S.mes;
  const reserva = D.conTalles ? null : repReserva();
  const arts=new Map();
  D.filas.forEach(f=>{
    if(!S.sel[f.remito]) return;
    const u = (D.conTalles||!m) ? f.total : (f.porMes[m]||0); if(u<=0) return;
    let a=arts.get(f.id); if(!a){ a={ id:f.id, cod:f.cod, desc:f.desc, marca:f.marca, rubro:f.rubro, genero:f.genero, disc:f.disc, tipo:f.tipo, rem:[] }; arts.set(f.id,a); }
    a.rem.push({ nro:f.remito, u, talles:f.talles?Object.assign({},f.talles):null });
  });
  // una tarjeta por remito elegido que tenga unidades en el mes
  const remOut={};
  arts.forEach(a=>a.rem.forEach(r=>{ if(!remOut[r.nro]) remOut[r.nro]={ nro:r.nro, marcas:new Set(), rubros:new Set(), arts:[], uRep:0, uQueda:0, uSin:0 }; }));
  const porSuc={}, sin=[]; let estimados=0, uTot=0;
  const destinos=repDestinos();
  arts.forEach(a=>{
    a.rem.sort((x,y)=>cmp(x.nro,y.nro));
    a.uTot=a.rem.reduce((s,r)=>s+r.u,0); uTot+=a.uTot; a.enRemitos=a.rem.length;
    a.rem.forEach(r=>{ const R0=remOut[r.nro]; R0.marcas.add(a.marca); R0.rubros.add(stripNN(a.rubro)); });
    const sinRep = motivo => { sin.push({ a, u:a.uTot, motivo }); a.rem.forEach(r=>{ if(remOut[r.nro]) remOut[r.nro].uSin+=r.u; }); };
    if(P.excluirVarios && /varios|otros|facturacion/i.test(stripNN(a.rubro)+' '+a.tipo)) return sinRep('Varios / Facturación: no se reparte por curva');
    const tl=repTallesDe(a, reserva);
    if(!tl) return sinRep(D.conTalles ? 'el remito no trae talles' : 'no está en la reserva del depósito cargada: no se puede abrir por talle');
    if(tl.estimado) estimados++;
    const labels=[...new Set([].concat(...tl.perRem.map(r=>Object.keys(r.t).filter(t=>r.t[t]>0))))];
    const C=repCentrales(a, labels);
    const cands=repCandidatos(a, C.G, destinos);
    const out=repRepartirArt(tl.perRem, cands, C.set, P);
    Object.assign(a, { estimado:tl.estimado, faltan:tl.faltan, centrales:[...C.set], regla:C.regla, grupo:C.G.key });
    if(!out.lineas.length) sin.push({ a, u:a.uTot, motivo: cands.length ? 'no alcanza para armar una curva: queda todo en el depósito' : 'ninguna sucursal destino tiene la marca asignada para este tipo de artículo', queda:true });
    tl.perRem.forEach((r,i)=>{
      const R0=remOut[r.nro]; if(!R0) return;
      const lineas=out.lineas.filter(l=>l.porRem[i]).map(l=>({ slug:l.slug, sucNombre:l.sucNombre, prio:l.prio, prioDe:l.prioDe, asig:l.asig, pr:l.pr,
        venta:l.venta, ventaNivel:l.ventaNivel, hist:!!l.hist, t:l.porRem[i], u:sumT(l.porRem[i]) }));
      const queda=out.quedaRem[i], uQ=sumT(queda);
      if(!lineas.length && !uQ) return;
      R0.arts.push({ art:a, lineas, queda, uQueda:uQ });
      R0.uRep+=lineas.reduce((s,l)=>s+l.u,0); R0.uQueda+=uQ;
      lineas.forEach(l=>{ const ps=porSuc[l.slug]||(porSuc[l.slug]={ slug:l.slug, nombre:l.sucNombre, u:0, arts:new Set(), remitos:new Set() }); ps.u+=l.u; ps.arts.add(a.id); ps.remitos.add(r.nro); });
    });
  });
  const remitos=Object.values(remOut).sort((x,y)=>cmp(x.nro,y.nro));
  remitos.forEach(r=>{ r.marca=[...r.marcas].filter(Boolean).join(' / '); r.rubro=[...r.rubros].filter(Boolean).join(' / '); r.arts.sort((x,y)=>cmp(x.art.desc,y.art.desc)||cmp(x.art.id,y.art.id)); });
  const uRep=remitos.reduce((s,r)=>s+r.uRep,0), uQueda=remitos.reduce((s,r)=>s+r.uQueda,0);
  return {
    remitos, porSuc:Object.values(porSuc).sort((x,y)=>y.u-x.u), sin,
    totales:{ remitos:remitos.length, arts:arts.size, u:uTot, uRep, uQueda, sucursales:Object.keys(porSuc).length, sinRep:sin.length, estimados,
      // unidades de los remitos que la reserva de hoy ya no tiene (salieron antes de cargar el stock)
      faltan:[...arts.values()].reduce((s,a)=>s+(a.faltan||0),0) },
    fuenteTalles: D.conTalles ? 'export' : ((repFuenteReserva()||{}).archivo||''),
    guardadoKey:null,
  };
}

/* ---------- memoria (Firebase) ---------- */
async function repCargarMemoria(){
  const S=state.rep; S.cargado=true;
  if(!FIREBASE_DB_URL){ S.hist={}; return; }
  const intentar=p=>p.then(v=>({ok:true, v}), ()=>({ok:false, v:null}));
  const [h, rr, cfg, keys]=await Promise.all([
    intentar(conTimeout(fbGet(ROOT+'/repartoHist'),15000)), intentar(conTimeout(fbGet(ROOT+'/remitosRepartidos'),10000)),
    intentar(conTimeout(fbGet(ROOT+'/repartoConfig'),8000)), intentar(conTimeout(fbGet(ROOT+'/repartos','shallow=true'),8000)) ]);
  S.hist = h.ok ? (h.v||{}) : null;          // null = no se pudo leer (no se guarda sin releerla)
  if(rr.ok) S.repartidos=rr.v||{};
  if(cfg.ok && cfg.v && cfg.v.centrales) S.centrales=cfg.v.centrales;
  const ks=Object.keys((keys.ok&&keys.v)||{}).sort().reverse().slice(0,12);
  const metas=await Promise.all(ks.map(k=>intentar(conTimeout(fbGet(ROOT+'/repartos/'+k+'/meta'),8000))));
  S.guardados=ks.map((k,i)=>({ key:k, meta:metas[i].v||{} }));
}
async function repGuardar(){
  const S=state.rep, R=S.res; if(!R || S.abierto) return;
  if(!FIREBASE_DB_URL){ toast('Sin base configurada','err'); return; }
  if(!R.totales.uRep){ toast('No hay nada repartido para guardar','err'); return; }
  if(S.hist==null){ await repCargarMemoria(); if(S.hist==null){ toast('No pude leer la memoria de envíos: probá de nuevo en un rato','err'); return; } }
  const ya=R.remitos.filter(rm=>S.repartidos[repKey(rm.nro)]);
  if(ya.length && !confirm(ya.length+' de estos remitos ya estaban guardados como repartidos ('+ya.slice(0,5).map(r=>repNroCorto(r.nro)).join(', ')+(ya.length>5?'…':'')+'). Si los volvés a guardar se suman a la memoria de envíos. ¿Seguir?')) return;
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  const key=d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds());
  const remitos={}, porSuc={}, suma={};
  R.remitos.forEach(rm=>{
    remitos[repKey(rm.nro)]={ nro:rm.nro, marca:rm.marca, rubro:rm.rubro, uRep:rm.uRep, uQueda:rm.uQueda,
      arts:rm.arts.map(x=>({ id:x.art.id, cod:x.art.cod||'', desc:x.art.desc||'', marca:x.art.marca||'', rubro:x.art.rubro||'', genero:x.art.genero||'',
        estimado:!!x.art.estimado, centrales:x.art.centrales||[], enRemitos:x.art.enRemitos||1,
        lineas:x.lineas.map(l=>({ slug:l.slug, prio:l.prio, prioDe:l.prioDe, hist:!!l.hist, t:paresT(l.t) })), queda:paresT(x.queda) })) };
    rm.arts.forEach(x=>x.lineas.forEach(l=>{
      (porSuc[l.slug]=porSuc[l.slug]||[]).push({ remito:rm.nro, id:x.art.id, cod:x.art.cod||'', desc:x.art.desc||'', marca:x.art.marca||'', rubro:x.art.rubro||'', genero:x.art.genero||'', t:paresT(l.t) });
      const k=repKey(x.art.id)+'/'+l.slug; const o=suma[k]||(suma[k]={id:x.art.id, slug:l.slug, t:{}}); Object.entries(l.t).forEach(([t,q])=>{ o.t[t]=(o.t[t]||0)+q; });
    }));
  });
  const meta={ fecha:nowISO(), por:SESSION.email||'', archivo:(S.data||{}).archivo||'', anio:(S.data||{}).anio||'', mes:S.mes, conTalles:!!(S.data&&S.data.conTalles),
    fuenteTalles:R.fuenteTalles||'', param:S.param, destinos:repDestinos(), totales:R.totales, remitos:R.remitos.map(r=>r.nro) };
  const upd={}, ahora=Date.now();
  Object.values(suma).forEach(x=>{ const tot=Object.assign({}, repHistDe(x.id, x.slug)||{}); Object.entries(x.t).forEach(([t,q])=>{ tot[t]=(tot[t]||0)+q; });
    upd['repartoHist/'+repKey(x.id)+'/'+x.slug]={ t:paresT(tot), ts:ahora, rep:key }; });
  R.remitos.forEach(rm=>{ upd['remitosRepartidos/'+repKey(rm.nro)]={ rep:key, fecha:meta.fecha, por:meta.por }; });
  try{
    const b=$('repGuardar'); if(b){ b.disabled=true; b.textContent='Guardando…'; }
    await fbPut(ROOT+'/repartos/'+key, { meta, remitos, porSuc });
    await fbPatch(ROOT, upd);
    Object.entries(upd).forEach(([path,v])=>{ const [n,a,b2]=path.split('/');
      if(n==='repartoHist'){ S.hist=S.hist||{}; (S.hist[a]=S.hist[a]||{})[b2]=v; } else if(n==='remitosRepartidos') S.repartidos[a]=v; });
    R.guardadoKey=key; S.guardados.unshift({ key, meta }); S.guardados=S.guardados.slice(0,12);
    toast('Reparto guardado ✓','ok'); render();
  }catch(e){ console.error(e); toast('No se pudo guardar: '+(e.message||e),'err'); render(); }
}

  if(!confirm('¿Borrar el reparto guardado el '+(m.fecha||key)+'?\nSus remitos vuelven a quedar pendientes y se descuenta de la memoria de envíos.')) return;

    Object.entries(resta).forEach(([k,t])=>{ const [id,slug]=k.split('/'); const e=S.hist[id]&&S.hist[id][slug]; if(!e) return;
      const cur=deParesT(e.t); Object.entries(t).forEach(([tt,q])=>{ cur[tt]=Math.max(0,(cur[tt]||0)-q); });
      const pr=paresT(cur); upd['repartoHist/'+k]= pr.length ? { t:pr, ts:e.ts||Date.now(), rep:e.rep||'' } : null; });
    Object.entries(S.repartidos||{}).forEach(([nk,v])=>{ if(v && v.rep===key) upd['remitosRepartidos/'+nk]=null; });
    await fbPatch(ROOT, upd);
    if(S.abierto && S.abierto.key===key){ S.abierto=null; S.res=null; }

function wireReparto(){
  const S=state.rep;
  const inp=$('repFile'), bRem=$('repBtnRem');
  if(bRem&&inp){ bRem.onclick=()=>inp.click(); inp.onchange=async e=>{ const f=e.target.files[0]; inp.value=''; if(f) await repCargarArchivo(f); }; }
  const inpR=$('repFileRes'), bRes=$('repBtnRes');
  if(bRes&&inpR){ bRes.onclick=()=>inpR.click(); inpR.onchange=async e=>{ const fl=[...e.target.files]; inpR.value=''; if(fl.length){ await cargarFilesComo('reserva', fl); if(S.res && S.data && !S.abierto) repRecalc(); } }; }
  const card=$('repCarga');
  if(card){ card.ondragover=e=>{ e.preventDefault(); card.classList.add('over'); }; card.ondragleave=()=>card.classList.remove('over');
    card.ondrop=async e=>{ e.preventDefault(); card.classList.remove('over'); const fs=[...e.dataTransfer.files];
      const rem=fs.find(f=>/\.(csv|txt)$/i.test(f.name) || /remito/i.test(f.name)); if(rem) await repCargarArchivo(rem);
      const otros=fs.filter(f=>f!==rem && /\.xlsx?$/i.test(f.name)); if(otros.length){ await cargarFilesComo('reserva', otros); if(S.res && S.data) repRecalc(); } }; }
  // selección de remitos
  const sel=$('repSel'); if(sel) sel.ontoggle=()=>{ S.selOpen=sel.open; };
  const on=(id,ev,fn)=>{ const el=$(id); if(el) el[ev]=fn; };
  on('repMes','onchange',e=>{ S.mes=e.target.value; S.res=null; render(); });
  on('repMarca','onchange',e=>{ S.f.marca=e.target.value; render(); });
  on('repRubro','onchange',e=>{ S.f.rubro=e.target.value; render(); });
  on('repVerRep','onchange',e=>{ S.f.verRepartidos=e.target.checked; render(); });
  on('repQ','oninput',e=>{ S.f.q=e.target.value; S._focus='repQ'; renderDebounce(); });
  on('repMarcarVis','onclick',()=>{ const todos=repRemitosLista(), f=S.f, q=(f.q||'').toLowerCase();
    todos.filter(r=>!r.rep && (!f.marca||r.marcas.has(f.marca)) && (!f.rubro||r.rubros.has(f.rubro)) && (!q||(r.nro+' '+r.texto+' '+r.marca).toLowerCase().includes(q))).slice(0,400).forEach(r=>{ S.sel[r.nro]=true; });
    S.res=null; render(); });
  on('repLimpiarSel','onclick',()=>{ S.sel={}; S.res=null; render(); });
  on('repArmar','onclick',repArmar);
  document.querySelectorAll('[data-rsel]').forEach(tr=>tr.onclick=()=>{ const n=tr.dataset.rsel; if(S.sel[n]) delete S.sel[n]; else S.sel[n]=true; S.res=null; render(); });
  // parámetros
  const num1=(id,k)=>on(id,'onchange',e=>{ S.param[k]=parseInt(e.target.value,10)||0; repRecalc(); });
  num1('rpUC','uCentral'); num1('rpMC','maxCentral'); num1('rpUR','uResto'); num1('rpMin','minTalles'); num1('rpRes','reserva');
  const bool=(id,k)=>on(id,'onchange',e=>{ S.param[k]=e.target.checked; repRecalc(); });
  bool('rpExc','excedente'); bool('rpDisc','respetarDisc'); bool('rpMem','memoria'); bool('rpVar','excluirVarios');
  const dest=$('repDest');
  if(dest){
    dest.ontoggle=()=>{ state.mselOpen = dest.open ? 'repDest' : (state.mselOpen==='repDest' ? null : state.mselOpen); };
    dest.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.onchange=()=>{ S.destinos=[...dest.querySelectorAll('input[type=checkbox]:checked')].map(x=>x.value); repRecalc(); });
    dest.querySelectorAll('[data-rgrp]').forEach(b=>b.onclick=e=>{ e.preventDefault(); const k=b.dataset.rgrp, cur=new Set(repDestinos());
      const del=Object.keys(REP_SUC).filter(s=>catDe(s)===k); const todas=del.every(s=>cur.has(s));
      del.forEach(s=>{ if(todas) cur.delete(s); else cur.add(s); }); S.destinos=[...cur]; repRecalc(); });
    if(!window.__mselDoc){ window.__mselDoc=true;
      document.addEventListener('click', e=>{ if(!document.contains(e.target)) return;
        document.querySelectorAll('details.msel[open]').forEach(el=>{ if(!el.contains(e.target)){ el.open=false; if(state.mselOpen===el.id) state.mselOpen=null; } }); }); }
  }
  const cb=$('repCentBox'); if(cb) cb.ontoggle=()=>{ S._centOpen=cb.open; };
  const ay=$('repAyuda'); if(ay) ay.ontoggle=()=>{ S._ayudaOpen=ay.open; };
  document.querySelectorAll('[data-cent]').forEach(el=>el.onchange=()=>{ const lista=el.value.split(/[,;]+/).map(x=>x.trim()).filter(Boolean);
    S.centrales=Object.assign({}, S.centrales||{}, { [el.dataset.cent]:lista }); repRecalc(); });
  on('repCentGuardar','onclick',async()=>{ if(!FIREBASE_DB_URL) return; try{ await fbPut(ROOT+'/repartoConfig/centrales', repCentralesTabla()); toast('Talles centrales guardados para todos ✓','ok'); }catch(e){ toast('No se pudo guardar: '+(e.message||e),'err'); } });
  on('repCentReset','onclick',async()=>{ if(!confirm('¿Volver a los talles centrales de fábrica (para todos)?')) return; S.centrales=null; try{ if(FIREBASE_DB_URL) await fbPut(ROOT+'/repartoConfig/centrales', null); }catch(e){} repRecalc(); });
  // resultado
  document.querySelectorAll('[data-rvista]').forEach(b=>b.onclick=()=>{ S.vista=b.dataset.rvista; render(); });
  on('repXlsx','onclick',repExportXlsx);
  on('repPrint','onclick',()=>{ S.vista='remito'; render(); setTimeout(()=>window.print(),150); });
  on('repGuardar','onclick',repGuardar);
  on('repCerrar','onclick',()=>{ S.abierto=null; S.res=null; render(); });
  document.querySelectorAll('[data-rabrir]').forEach(b=>b.onclick=()=>repAbrir(b.dataset.rabrir));
  document.querySelectorAll('[data-rborrar]').forEach(b=>b.onclick=()=>repBorrar(b.dataset.rborrar));
  if(S._focus){ const el=$(S._focus); S._focus=null; if(el){ el.focus(); try{ el.setSelectionRange(el.value.length, el.value.length); }catch(e){} } }
}

/* ---------- Excel: una hoja por remito (para imprimir en su ubicación) + resumen por sucursal ---------- */
function repHoja(wb, nombre, titulo, subtitulo, headers, widths, leftCols){
  const ws=wb.addWorksheet(nombre, {views:[{showGridLines:false}]});
  ws.columns=widths.map(w=>({width:w}));
  const nCols=headers.length;
  ws.mergeCells(1,1,1,nCols);
  const tit=ws.getCell(1,1);
  tit.value={ richText:[ {font:{bold:true,size:15,name:'Calibri',color:{argb:BRAND.navy}},text:titulo+'\n'}, {font:{bold:true,size:10,name:'Calibri',color:{argb:BRAND.red}},text:subtitulo} ]};
  tit.alignment={horizontal:'left',vertical:'middle',wrapText:true,indent:1};
  for(let c=1;c<=nCols;c++){ ws.getCell(1,c).border={bottom:{style:'medium',color:{argb:BRAND.red}}}; }
  ws.getRow(1).height=38;
  const hr=3;
  headers.forEach((h,i)=>{ const c=ws.getCell(hr,i+1); c.value=h; c.font={bold:true,color:{argb:BRAND.white},size:10,name:'Calibri'};
    c.fill={type:'pattern',pattern:'solid',fgColor:{argb:BRAND.navy}}; c.alignment={horizontal:i<leftCols?'left':'center',vertical:'middle'}; c.border=thinBorder(BRAND.navy); });
  ws.getRow(hr).height=22;
  ws.views=[{state:'frozen', xSplit:leftCols, ySplit:hr, showGridLines:false}];
  ws.pageSetup={orientation:'landscape', fitToPage:true, fitToWidth:1, fitToHeight:0, printTitlesRow:'1:'+hr, margins:{left:0.3,right:0.3,top:0.4,bottom:0.4,header:0.2,footer:0.2}};
  return { ws, hr, nCols };
}
async function repExportXlsx(){
  const S=state.rep, R=S.res; if(!R) return;
  if(typeof ExcelJS==='undefined'){ toast('ExcelJS no cargó; recargá la página','err'); return; }
  const rems=R.remitos.filter(rm=>rm.arts.length); if(!rems.length){ toast('No hay nada para exportar','err'); return; }
  const fecha = S.abierto ? String((S.abierto.meta||{}).fecha||S.abierto.key) : nowISO();
  const wb=new ExcelJS.Workbook();
  // resumen por sucursal
  const T=R.totales;
  const hs=repHoja(wb,'Por sucursal','REPARTO INICIAL · POR SUCURSAL', fmtInt(T.remitos)+' remitos · '+fmtInt(T.uRep||0)+' unidades a '+fmtInt(T.sucursales||0)+' sucursales · '+fmtInt(T.uQueda||0)+' quedan en el depósito · '+fecha,
    ['Sucursal','Categoría','Unidades','Artículos','Remitos'], [26,12,11,11,70], 2);
  R.porSuc.forEach((s,i)=>{ const r=hs.hr+1+i;
    [stripNN(s.nombre), CAT_LABEL[catDe(s.slug)]||'', s.u, s.arts.size, [...s.remitos].sort(cmp).map(repNroCorto).join(' · ')].forEach((v,j)=>{ const c=hs.ws.getCell(r,j+1); c.value=v;
      c.font={size:10,bold:j===0,name:'Calibri',color:{argb:BRAND.navy}}; c.alignment={horizontal:j<2||j===4?'left':'center',vertical:'middle',wrapText:j===4}; c.border=thinBorder(BRAND.border); }); });
  // una hoja por remito
  const nombres=new Set();
  rems.forEach(rm=>{
    const talles=[...new Set([].concat(...rm.arts.map(x=>[].concat(...x.lineas.map(l=>Object.keys(l.t)), Object.keys(x.queda)))))].sort(cmpTalle);
    let nom=('R '+repNroCorto(rm.nro)+' '+(rm.marca||'')).replace(/[\[\]:*?\/\\]/g,' ').slice(0,31).trim(); while(nombres.has(nom)) nom=(nom.slice(0,28)+' '+nombres.size).slice(0,31); nombres.add(nom);
    const izq=['Código','Artículo','Descripción','Destino'];
    const h=repHoja(wb, nom, 'REPARTO INICIAL · REMITO '+repNroCorto(rm.nro), (rm.nro+'  ·  '+(rm.marca||'')+(rm.rubro?'  ·  '+rm.rubro:'')+'  ·  '+fmtInt(rm.uRep)+' u. a repartir · '+fmtInt(rm.uQueda)+' quedan  ·  '+fecha).toUpperCase(),
      [...izq, ...talles, 'Total'], [16,11,36,22, ...talles.map(()=>7), 9], izq.length);
    let r=h.hr+1;
    rm.arts.forEach(x=>{ const a=x.art, C=new Set(a.centrales||[]);
      const filas=x.lineas.slice().sort((p,q)=>(p.prio||99)-(q.prio||99)).map(l=>({dest:stripNN(l.sucNombre), t:l.t, u:l.u, queda:false}));
      if(x.uQueda>0) filas.push({dest:'DEPÓSITO (queda)', t:x.queda, u:x.uQueda, queda:true});
      filas.forEach((fl,k)=>{
        const vals=[a.cod||'', a.id, (a.desc||'')+(a.estimado?' *':''), fl.dest];
        vals.forEach((v,j)=>{ const c=h.ws.getCell(r,j+1); c.value=(k===0||j===3)?v:null;
          c.font={size:10,bold:!fl.queda,italic:fl.queda,name:'Calibri',color:{argb:fl.queda?BRAND.muted:BRAND.navy}}; c.alignment={horizontal:'left',vertical:'middle'};
          const bd=thinBorder(BRAND.border); if(k===0) bd.top={style:'medium',color:{argb:BRAND.sep}}; c.border=bd; });
        talles.forEach((t,ti)=>{ const c=h.ws.getCell(r,izq.length+ti+1); const q=fl.t[t]||0; c.value=q>0?q:null;
          c.font={size:11,bold:!fl.queda,name:'Calibri',color:{argb:fl.queda?BRAND.muted:BRAND.navy}}; c.alignment={horizontal:'center',vertical:'middle'};
          if(C.has(t) && !fl.queda) c.fill={type:'pattern',pattern:'solid',fgColor:{argb:BRAND.talleBand}};
          const bd=thinBorder(BRAND.border); if(k===0) bd.top={style:'medium',color:{argb:BRAND.sep}}; c.border=bd; });
        const ct=h.ws.getCell(r,izq.length+talles.length+1); ct.value=fl.u; ct.font={size:11,bold:true,name:'Calibri',color:{argb:fl.queda?BRAND.muted:BRAND.navy}}; ct.alignment={horizontal:'center',vertical:'middle'};
        const bd=thinBorder(BRAND.border); if(k===0) bd.top={style:'medium',color:{argb:BRAND.sep}}; ct.border=bd;
        h.ws.getRow(r).height=22; r++;
      });
    });
    if(rm.arts.some(x=>x.art.estimado)){ r++; h.ws.getCell(r,1).value='* talles tomados de la reserva del depósito (el remito no trae talles): confirmarlos al abrir la caja. Fondo celeste = talle central.'; h.ws.getCell(r,1).font={size:9,italic:true,name:'Calibri',color:{argb:BRAND.muted}}; }
  });
  await downloadWorkbook(wb, 'reparto-inicial-'+fecha.slice(0,10)+'.xlsx');
  toast('Excel generado ✓','ok');
}
