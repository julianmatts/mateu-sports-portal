<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Análisis de Reserva — Depósito Central · Mateu Sports</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B1527;--navy-mid:#1a2f55;--navy-soft:#13203a;
  --red:#CC0000;--red-soft:#ff3b3b;
  --white:#fff;--off:#f5f7fc;--muted:#6B7A99;--muted-light:#b0bcd4;
  --card:#fff;--border:#dce3f0;
  --ok:#16a34a;--warn:#d97706;--bad:#dc2626;--exc:#7c3aed;
  --font-d:'Bebas Neue',sans-serif;--font-c:'Barlow Condensed',sans-serif;--font-b:'Barlow',sans-serif;
  --shadow:0 1px 4px rgba(11,21,39,.08);--shadow-md:0 8px 30px rgba(11,21,39,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--off);color:var(--navy);font-family:var(--font-b);min-height:100vh}
img,svg{max-width:100%}

/* ===== HEADER ===== */
.top{background:var(--navy);padding:12px 22px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:3px solid var(--red);position:sticky;top:0;z-index:40;flex-wrap:wrap;gap:10px}
.top a.logo{display:flex;align-items:center;gap:11px;text-decoration:none;min-width:0}
.top img{height:32px;filter:brightness(0) invert(1)}
.top .tt{font-family:var(--font-d);font-size:19px;letter-spacing:1.5px;color:#fff;line-height:1}
.top .ts{font-family:var(--font-c);font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--muted-light)}
.top-right{display:flex;align-items:center;gap:12px;margin-left:auto}
.who{text-align:right;line-height:1.1}
.who .n{font-family:var(--font-c);font-size:13px;font-weight:600;color:#fff;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .r{font-family:var(--font-c);font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--red-soft)}
.salir{background:transparent;border:1px solid rgba(255,255,255,.25);border-radius:6px;color:rgba(255,255,255,.7);
  font-family:var(--font-c);font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:7px 13px;cursor:pointer}
.salir:hover{color:#fff;border-color:#fff}

/* ===== NAV TABS ===== */
.tabs{background:#fff;border-bottom:1px solid var(--border);padding:0 22px;display:flex;gap:4px;overflow-x:auto;position:sticky;top:var(--msh-h,67px);z-index:30}
.tab{padding:13px 16px;border:0;background:none;cursor:pointer;font-family:var(--font-c);font-size:14px;font-weight:600;
  letter-spacing:.5px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--navy);border-bottom-color:var(--red)}
.tab:hover{color:var(--navy)}
.tab:focus-visible{outline:2px solid var(--red);outline-offset:-2px}
.tab .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:10px;background:#e6ebf5;
  color:var(--navy-mid);font-family:var(--font-b);font-size:11px;font-weight:700;line-height:18px;text-align:center}
.tab.on .badge{background:var(--red);color:#fff}

main{max-width:1200px;margin:0 auto;padding:22px 22px 80px}

.banner{border-radius:9px;padding:10px 14px;font-size:13px;margin-bottom:16px}
.banner.warn{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412}
.banner.info{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af}
.banner code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:4px;font-size:12px}

/* ===== CONTROLES ===== */
.sel,.inp{padding:9px 11px;border:1px solid var(--border);border-radius:7px;font-size:14px;color:var(--navy);background:#fff;font-family:var(--font-b)}
.sel:focus,.inp:focus{outline:none;border-color:var(--navy-mid)}
.btn{border:none;border-radius:8px;padding:10px 16px;font-family:var(--font-c);font-size:13px;font-weight:700;
  letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--red);color:#fff}.btn-primary:hover{background:#a00000}
.btn-outline{background:#fff;border:1.5px solid var(--border);color:var(--navy)}.btn-outline:hover{border-color:var(--navy-mid)}
.btn-sm{padding:6px 11px;font-size:11px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.sel:focus-visible,.inp:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* ===== CARDS ===== */
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sec-head h1{font-family:var(--font-d);font-size:30px;letter-spacing:1px;line-height:1}
.sec-head .sub{font-family:var(--font-c);font-size:13px;font-weight:500;color:var(--muted);margin-top:2px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.card-h{font-family:var(--font-d);font-size:20px;letter-spacing:.5px;margin-bottom:2px}
.card-hs{font-family:var(--font-c);font-size:12px;color:var(--muted);margin-bottom:14px}

/* ===== DROPZONE ===== */
.drop{border:2px dashed var(--border);border-radius:12px;padding:26px;text-align:center;background:#fff;cursor:pointer;transition:all .15s}
.drop.over{border-color:var(--red);background:#fff5f5}
.drop .ic{font-size:34px}
.drop .t{font-family:var(--font-c);font-weight:600;font-size:15px;margin-top:6px}
.drop .s{font-size:12.5px;color:var(--muted);margin-top:3px}
.filechip{display:inline-flex;align-items:center;gap:8px;background:#eef2fb;border:1px solid var(--border);border-radius:20px;
  padding:5px 12px;font-family:var(--font-c);font-size:12.5px;font-weight:600;color:var(--navy-mid);margin:4px 4px 0 0}
.filechip .ok{color:var(--ok)}.filechip .no{color:var(--bad)}

/* ===== KPIs ===== */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:11px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi.rep{border-left:4px solid var(--ok)}
.kpi.par{border-left:4px solid var(--warn)}
.kpi .k{font-family:var(--font-c);font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--font-d);font-size:32px;letter-spacing:.5px;margin-top:4px;line-height:1}
.kpi .v small{font-size:14px;color:var(--muted);font-family:var(--font-c)}

/* ===== SEGMENTADO (selector de sección) ===== */
.segbar{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 18px}
.segbar button{border:1.5px solid var(--border);background:#fff;border-radius:10px;padding:9px 14px;cursor:pointer;
  font-family:var(--font-c);font-size:13.5px;font-weight:600;color:var(--navy-mid);display:flex;align-items:center;gap:7px;transition:all .12s}
.segbar button:hover{border-color:var(--navy-mid)}
.segbar button .n{font-family:var(--font-b);font-size:12px;font-weight:700;background:#eef2fb;border-radius:10px;padding:1px 8px;color:var(--navy-mid)}
.segbar button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.segbar button.on .n{background:rgba(255,255,255,.22);color:#fff}
.segbar button:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* ===== FILTROS ===== */
.filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.fgrp{display:flex;flex-direction:column;gap:4px;min-width:120px}
.fgrp label{font-family:var(--font-c);font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
/* filtro de selección múltiple (Subrubro/género) */
.msel{position:relative}
.msel>summary{list-style:none;cursor:pointer;background:#fff;border:1px solid var(--border);border-radius:7px;
  padding:9px 28px 9px 11px;font-size:14px;color:var(--navy);min-width:120px;white-space:nowrap;position:relative;font-family:var(--font-b)}
.msel>summary::-webkit-details-marker{display:none}
.msel>summary::after{content:'▾';position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:11px}
.msel[open]>summary{border-color:var(--navy-mid)}
.msel-pop{position:absolute;z-index:40;top:calc(100% + 4px);left:0;background:#fff;border:1px solid var(--border);
  border-radius:10px;box-shadow:0 10px 26px rgba(11,21,39,.16);padding:8px;min-width:200px;max-height:280px;overflow:auto}
.msel-it{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.msel-it:hover{background:#f2f5fb}
.msel-acc{display:flex;gap:6px;border-top:1px solid var(--border);margin-top:6px;padding-top:8px}
.msel-acc button{flex:1;background:#fff;border:1px solid var(--border);border-radius:7px;padding:5px 8px;
  font-family:var(--font-c);font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;color:var(--navy)}
.msel-acc button:hover{border-color:var(--navy-mid)}
.msel-empty{font-size:12.5px;color:var(--muted);padding:6px 8px;max-width:230px;white-space:normal;line-height:1.4}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--navy-mid);cursor:pointer;user-select:none}

/* ===== TABLAS ===== */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:11px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:680px}
th{background:var(--navy);color:#fff;font-family:var(--font-c);font-weight:600;letter-spacing:.5px;padding:9px 11px;text-align:left;white-space:nowrap;position:sticky;top:0;cursor:pointer}
th.num,td.num{text-align:right}
th.noord{cursor:default}
td{padding:8px 11px;border-bottom:1px solid #eef0f7;vertical-align:middle}
tbody tr:hover td{background:#f8f9fe}
.mono{font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-family:var(--font-c);font-size:11px;font-weight:700;letter-spacing:.4px}
.pill.rec{background:#eff6ff;color:#1e40af}
.pill.cron{background:#fef2f2;color:#b91c1c}
.pill.suc{background:#eef2fb;color:var(--navy-mid)}
.pill.falta{background:#fef2f2;color:#b91c1c}
.talles{font-size:12px;color:var(--muted);font-family:var(--font-c)}
.talles .tg{display:inline-flex;align-items:baseline;margin:1px 10px 1px 0;white-space:nowrap}
.talles .tl{color:var(--navy);font-weight:700;margin-right:4px}
.talles .tv{color:var(--navy);font-weight:700}
.talles .tsep{color:var(--muted-light);margin:0 1px}
.talles .tr{color:var(--muted)}
.talles .tg.falta .tl,.talles .tg.falta .tv,.talles .tg.falta .tr{color:var(--bad)}
.talles .tas{margin-left:3px;color:#127a3a;font-weight:800}   /* → lo que recibe tras el reparto */
.talles .falta{color:var(--bad);font-weight:700}
.sug-badge{display:inline-block;min-width:34px;padding:2px 9px;border-radius:20px;background:#eafaf0;color:#127a3a;font-weight:800;font-variant-numeric:tabular-nums}
.sug-badge.zero{background:#f1f4fa;color:var(--muted-light)}
/* completar curva: talle faltante que se manda (verde) / faltante que no se manda (gris) */
.talles .tg.hueco{background:#eafaf0;border-radius:6px;padding:0 5px}
.talles .tg.hueco .tl,.talles .tg.hueco .tv{color:#127a3a}
.talles .tg.ya{opacity:.5}
.kpi.cur{border-left:4px solid #127a3a}
.lnk{border:0;background:none;color:var(--navy-mid);font-family:var(--font-c);font-size:12px;font-weight:600;cursor:pointer;text-decoration:underline;padding:0 2px}
.filechip small{color:var(--muted);font-weight:400}
.desc{max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp-suc{background:#eef2fb;font-family:var(--font-c);font-weight:700;color:var(--navy-mid);letter-spacing:.5px}

/* ===== ESTADOS ===== */
.state{text-align:center;padding:52px 20px;color:var(--muted)}
.state .big-ic{font-size:40px;margin-bottom:10px}
.state.err{color:var(--bad)}
.spinner{width:26px;height:26px;border:3px solid #e6ebf5;border-top-color:var(--red);border-radius:50%;
  display:inline-block;animation:spin .7s linear infinite;margin-bottom:10px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== HISTÓRICO ===== */
.histrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--border);
  border-radius:10px;background:#fff;margin-bottom:9px}
.histrow .hl{font-family:var(--font-c);font-weight:700;font-size:15px;color:var(--navy)}
.histrow .hs{font-size:12.5px;color:var(--muted)}

/* ===== TOAST ===== */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;
  padding:11px 18px;border-radius:9px;font-size:13.5px;box-shadow:var(--shadow-md);opacity:0;pointer-events:none;transition:all .25s;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:#166534}.toast.err{background:#991b1b}

@media(max-width:640px){ .sec-head h1{font-size:24px} .kpi .v{font-size:26px} }
</style>
<!-- Iconos SVG (reemplazan emojis que Windows 7 / navegadores viejos no dibujan) -->
<script src="../shared/marca.js"></script>
<script src="../shared/iconos.js" defer></script>

<body>

<!-- Header unificado del shell (shared/header.js). Los nodos de abajo quedan
     ocultos: el JS del módulo los sigue escribiendo (whoName/whoRole/salir). -->
<div hidden aria-hidden="true"><span id="whoName"></span><span id="whoRole"></span><button id="salir"></button></div>

<nav class="tabs" id="tabs">
  <button class="tab on" data-tab="cargar">Cargar barrida</button>
  <button class="tab" data-tab="reposicion">Reposición <span class="badge" id="bRep">0</span></button>
  <button class="tab" data-tab="curva">Completar curva <span class="badge" id="bCur">0</span></button>
  <button class="tab" data-tab="compras">Compras <span class="badge" id="bCom">0</span></button>
  <button class="tab" data-tab="parada">Reserva parada <span class="badge" id="bPar">0</span></button>
  <button class="tab" data-tab="historico">Histórico</button>
</nav>

<main>
  <div class="banner warn" id="cfgBanner" style="display:none"></div>
  <div id="view"><div class="state"><div class="spinner"></div>Cargando…</div></div>
</main>

<div class="toast" id="toast"></div>

<!-- SheetJS (leer el Excel) + ExcelJS (exportar con estilo, como el OC de Managment) -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script>
/* ============================================================
   Barrida de Reserva — módulo self-contained del Portal.
   Cruza la RESERVA del depósito central con las VENTAS de la semana
   abiertas por sucursal (dos hojas de un mismo Excel, o dos archivos)
   y genera tres alertas:
     • REPOSICIÓN  — artículo con reserva Y venta en una sucursal.
     • RESERVA PARADA — artículo con reserva y CERO venta en todas las sucursales.
     • COMPLETAR CURVA — (con la hoja opcional de STOCK por sucursal, abierto por
       talle) la sucursal tiene el artículo en algunos talles pero le faltan otros
       que SÍ hay en la reserva del depósito. La reserva de cada talle se reparte
       con prioridad a la sucursal que más vendió el artículo esa semana.
   Se corre semana a semana (típicamente los lunes). El histórico se
   guarda en Firebase (base barrida-mateu) como el resto del portal.
   Lee la sesión del Portal (localStorage), sin login propio.
   El cruce se calcula en el cliente; el Excel se parsea con SheetJS (CDN).
   ============================================================ */
'use strict';
const $ = id => document.getElementById(id);

/* ---------- Firebase ----------
   Reusa la base del Depósito Central (recepciones-mateu, ya existe y con reglas
   abiertas). Los datos de la barrida viven en un nodo aparte `barrida/…`, sin
   tocar el árbol `recepciones/…`. Vacío => MODO SIN BASE (carga y ve, no guarda). */
const FIREBASE_DB_URL = 'https://recepciones-mateu-default-rtdb.firebaseio.com';
const ROOT = 'barrida';   // rama raíz de la barrida dentro de la base

/* ---------- sesión ---------- */
const SESSION_KEY = 'mateu_portal_session';
function readSession(){ try{ const s=localStorage.getItem(SESSION_KEY); return s?JSON.parse(s):null; }catch(e){ return window.__sess||null; } }
const SESSION = readSession();
if(!SESSION || !SESSION.rol){ location.replace('../'); }
// La barrida la corre el depósito / gerencia. Las sucursales ven su aviso en Indicadores.
const puedeVer = SESSION && (SESSION.rol==='admin' || (SESSION.herramientas||[]).includes('barrida'));
if(SESSION && SESSION.rol && !puedeVer){ location.replace('../'); }

/* ---------- mapa nombre de sucursal (dato) -> slug del Portal ----------
   Mismo criterio que Indicadores; el Depósito no es destino de reposición. */
const SLUG_SUC = {
  'calle-12':'12-MS Calle 12','city-bell':'06-MS City Bell','calle-47':'08-MS Calle 47',
  'calle-49':'19-MS Calle 49','los-hornos':'13-MS Los Hornos','plaza':'01-MS Plaza Italia',
  'berisso':'16-MS Berisso','ensenada':'11-MS Ensenada','kids':'02-Mateu Kids',
  'aurelius-12':'04-Aurelius Calle 12','aurelius-5':'18-Aurelius Calle 5','aurelius-cb':'17-Aurelius City Bell',
  'adidas-12':'21-Adidas Calle 12','adidas':'09-Adidas Av. 7','originals':'15-Adidas Originals',
  'ecommerce':'99-Ecommerce',
};
const OUTLET_SUC = {
  'gonnet':'14-Outlet Gonnet','av-44':'20-Outlet Av. 44','calle-55':'03-Outlet Calle 55','aurelius-10':'07-Aurelius Calle 10',
};
// nombre normalizado -> {slug, nombre}
const NAME2SLUG = {};
function normName(s){ return String(s||'').trim().toLowerCase().replace(/\s+/g,' '); }
Object.entries(SLUG_SUC).forEach(([slug,n])=>NAME2SLUG[normName(n)]={slug,nombre:n});
Object.entries(OUTLET_SUC).forEach(([slug,n])=>NAME2SLUG[normName(n)]={slug,nombre:n});

/* ---------- Regla de reposición: medias Mateu Sports ----------
   Mínimo por talle vendido (docenas → unidades). Se identifican por marca
   "Mateu Sports" + rubro "Accesorios" + tipo/grupo "Medias". Para el/los talle(s)
   que la sucursal VENDIÓ, "A reponer" = mín(reserva, mínimo del talle) — se repone
   el mínimo aunque haya vendido menos; los talles NO vendidos no se tocan. Objetivo:
   sostener un stock mínimo por talle y sucursal en los talles con rotación. */
const MEDIAS_MIN = { S:12, M:24, L:36, XL:12 };   // 1/2/3/1 docenas
function esMediaMateu(meta){
  if(!meta) return false;
  const t = normName(meta.tipo), r = normName(meta.rubro), m = normName(meta.marca);
  return m.includes('mateu') && r.includes('accesorio') && /\bmedias?\b/.test(t);
}
// mínimo del talle (0 si el talle no está en la tabla → cae al cálculo normal)
function mediasMin(label){ return MEDIAS_MIN[String(label).toUpperCase().trim()] || 0; }

/* ---------- Prioridad de reposición (regla de Juli 07/09/2026) ----------
   Cuando la reserva de un talle NO alcanza para todas las sucursales que lo piden, se
   define a quién va (y no queda en duda) con tres parámetros, en este orden:
     1. VENDIDO — la sucursal que más vendió el artículo esta semana va primero
        (empate: la que más vendió ESE talle);
     2. MESES DE STOCK de la sucursal en la marca-rubro (gestion-stock/datos-meses-stock.js,
        último mes cargado; si la marca no tiene dato, el rubro): menos meses = más
        necesidad → antes; sin dato, después;
     3. CATEGORÍA de la sucursal (Asignación de Marcas): cat1 > cat2 = aurelius = adidas > outlet.
   Las fuentes se cargan al procesar (best-effort): si una falla, ese parámetro no desempata.
   El mismo orden se usa para repartir los talles de «Completar curva». */
const FB_MARCAS = 'https://asignacion-marcas-mateu-default-rtdb.firebaseio.com/asignacion_marcas.json';
// slug del Portal -> id de la sucursal en Asignación de Marcas (copia de pedidos-semanales)
const SLUG2MARCAS = {
  'calle-12':'ms-c12','city-bell':'ms-cb','diagonal':'ms-d80','calle-47':'ms-c47','calle-49':'ms-c49',
  'los-hornos':'ms-lh','plaza':'ms-pi','berisso':'ms-ber','ensenada':'ms-ens','kids':'ms-kids','ecommerce':'ms-ecom',
  'aurelius-12':'aur-c12','aurelius-5':'aur-c5','aurelius-10':'aur-c10','aurelius-cb':'aur-cb',
  'adidas-12':'adi-c12','adidas':'adi-7','originals':'adi-ori',
  'gonnet':'out-gon','av-44':'out-44','calle-55':'out-55',
};

function cmpPrioridad(a,b){

  if((b.vendTalle||0)!==(a.vendTalle||0)) return (b.vendTalle||0)-(a.vendTalle||0);

  if((b.enSucursal||0)!==(a.enSucursal||0)) return (b.enSucursal||0)-(a.enSucursal||0);

   ============================================================ */
// Detecta la fila de encabezado y las columnas relevantes de una hoja.
function detectarCols(matrix){
  // Busca en las primeras 8 filas la que tenga 'ID ITEM' o 'DESCRIP' o 'Sucursal'.
  // La hoja de ventas viene con orden de columnas FIJO (Sucursal · Rubro · Marca ·
  // Disciplina · Género · Tipo de producto · Descripción · ID ITEM · CODIGO BARRAS ·
  // talles…), así que sus columnas descriptivas se toman por posición y no dependen
  // del texto del encabezado; la fila de encabezado sólo se usa para los talles.
  // Distintos reportes nombran las columnas distinto: "ID ITEM" vs "Item",
  // "Descripción" vs "Articulo", "Tipo de producto" vs "Grupo 1". Aceptamos los
  // alias para reconocer tanto la hoja de ventas (trae "Sucursal") como la de
  // reserva/stock del depósito (sin "Sucursal").
  let headerIdx=-1;
  for(let i=0;i<Math.min(8,matrix.length);i++){
    const row=matrix[i].map(c=>normName(c));
    const hasSuc  = row.some(c=>c==='sucursal'||c.startsWith('sucursal'));
    const hasId   = row.some(c=>c.includes('id item')||c==='item'||c==='id');
    const hasDesc = row.some(c=>c.includes('descrip')||c==='articulo'||c.startsWith('articulo'));
    const hasCod  = row.some(c=>c.includes('codigo'));
    if(hasSuc || hasId || (hasDesc&&hasCod)){ headerIdx=i; break; }
  }
  // Sin encabezados descriptivos por nombre → probar el modo posicional (solo talles).
  if(headerIdx<0) return detectarColsPosicional(matrix);
  const H = matrix[headerIdx].map(c=>normName(c));
  const find = preds => { for(let j=0;j<H.length;j++){ if(preds(H[j],j)) return j; } return -1; };
  let cols = {
    suc:   find(h=>h==='sucursal'||h.startsWith('sucursal')),
    rubro: find(h=>h==='rubro'||h.startsWith('rubro')),
    marca: find(h=>h==='marca'),
    disc:  find(h=>h.includes('disciplina')),
    gen:   find(h=>h.includes('genero')),
    tipo:  find(h=>h.includes('tipo')||h.includes('grupo')),
    desc:  find(h=>h.includes('descrip')||h==='articulo'||h.startsWith('articulo')),
    id:    find(h=>h.includes('id item')||h==='item'||h==='id'),
    cod:   find(h=>h.includes('codigo')&&h.includes('barra')),
  };
  // Ventas con encabezados descriptivos en blanco/renombrados: si la 1ª columna
  // es "Sucursal", el orden de columnas es fijo → completamos por posición SOLO
  // las que no se detectaron por nombre (así no se pisan los alias correctos).
  if(cols.suc===0){
    const POS = { rubro:1, marca:2, disc:3, gen:4, tipo:5, desc:6, id:7, cod:8 };
    for(const k in POS){ if(cols[k]<0) cols[k]=POS[k]; }
  }
  // Talles = columnas a la derecha de CODIGO BARRAS con encabezado no vacío.
  // Se excluye la columna "Total" (la hoja de reserva trae al final el total de la
  // fila; si se contara como talle, duplicaría el stock).
  const desdeIdx = Math.max(cols.cod, cols.id, cols.desc);
  const talles=[];
  for(let j=desdeIdx+1;j<H.length;j++){
    const lbl=String(matrix[headerIdx][j]==null?'':matrix[headerIdx][j]).trim();
    if(lbl!=='' && normName(lbl)!=='total') talles.push({idx:j,label:lbl});
  }
  // Si detecté el ID (o la 1ª col es Sucursal) y hay talles, listo. Si no, la hoja
  // vino con los encabezados descriptivos en blanco (sólo rotulados los talles):
  // caemos al modo posicional, que no exige esos encabezados.
  if((cols.id>=0 || cols.suc===0) && talles.length>0) return { headerIdx, cols, talles };
  return detectarColsPosicional(matrix);
}

// Fallback: reportes SIN encabezados descriptivos (Sucursal/Item/Articulo/… en
// blanco), sólo con los encabezados de TALLE. Detecta la fila de encabezado por
// esos rótulos de talle y ubica las columnas descriptivas por su posición fija.
// Distingue ventas vs. reserva por el CONTENIDO de la 1ª columna: si son nombres
// de sucursal (mapa NAME2SLUG) → ventas; si no → reserva del depósito.
function detectarColsPosicional(matrix){
  // El header es la 1ª fila (de las primeras 8) con la col 0 vacía y ≥5 celdas
  // rotuladas (los talles). Las filas de datos traen la sucursal/rubro en col 0.
  let headerIdx=-1, talleStart=-1;
  for(let i=0;i<Math.min(8,matrix.length);i++){
    const row=matrix[i]||[];
    if(String(row[0]==null?'':row[0]).trim()!=='') continue;
    let start=-1, cnt=0;
    for(let j=0;j<row.length;j++){ const v=String(row[j]==null?'':row[j]).trim(); if(v!==''){ if(start<0)start=j; cnt++; } }
    if(start>=0 && cnt>=5){ headerIdx=i; talleStart=start; break; }
  }
  if(headerIdx<0) return null;
  let esVentas=false;
  for(let i=headerIdx+1;i<Math.min(headerIdx+40,matrix.length);i++){
    const c0=normName(matrix[i] && matrix[i][0]);
    if(c0 && NAME2SLUG[c0]){ esVentas=true; break; }
  }
  const cols = esVentas
    ? { suc:0, rubro:1, marca:2, disc:3, gen:4, tipo:5, desc:6, id:7, cod:8 }
    : { suc:-1, rubro:0, marca:1, tipo:2, disc:3, gen:4, desc:5, id:6, cod:7 };
  const talles=[];
  for(let j=talleStart;j<matrix[headerIdx].length;j++){
    const lbl=String(matrix[headerIdx][j]==null?'':matrix[headerIdx][j]).trim();
    if(lbl!=='' && normName(lbl)!=='total') talles.push({idx:j,label:lbl});
  }
  return { headerIdx, cols, talles };
}

// Convierte un ArrayBuffer de xlsx en {sheets:[{name,matrix}]}
function leerLibro(buf){
  const wb = XLSX.read(buf, {type:'array'});
  return wb.SheetNames.map(name=>({
    name,
    matrix: XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, blankrows:false, defval:''})
  }));
}

// Clasifica una hoja: 'ventas' | 'stock' (las dos tienen Sucursal) | 'reserva' | null.
// Ventas y stock por sucursal salen del mismo reporte del sistema con el MISMO layout
// (Sucursal · … · ID ITEM · talles), así que por encabezados no se distinguen: manda
// el nombre de la hoja y, si no dice nada, el del archivo («stock»/«existencia» →
// stock; «venta» → ventas). Si ninguno ayuda queda como ventas y se cambia desde el
// chip de la pantalla Cargar («↔ es stock por sucursal»).
function clasificarHoja(sheet, archivo){
  const det = detectarCols(sheet.matrix);
  if(!det || det.talles.length===0) return null;
  const porNombre = s => /stock|existenc/i.test(s) ? 'stock' : (/venta/i.test(s) ? 'ventas' : '');
  const tipo = det.cols.suc>=0 ? (porNombre(sheet.name) || porNombre(archivo||'') || 'ventas') : 'reserva';
  return { name:sheet.name, matrix:sheet.matrix, tipo, ...det };
}

// Procesa un File -> asigna a state.files.ventas / .reserva / .stock según lo que traiga
async function ingerirArchivo(file){
  const buf = await file.arrayBuffer();
  const sheets = leerLibro(buf);
  let asignadas=0;
  sheets.forEach(sh=>{
    const c = clasificarHoja(sh, file.name);
    if(!c) return;
    state.files[c.tipo] = { archivo:file.name, hoja:sh.name, matrix:c.matrix, headerIdx:c.headerIdx, cols:c.cols, talles:c.talles };
    asignadas++;
  });
  if(asignadas===0) throw new Error('No reconocí ninguna hoja de ventas, reserva o stock en "'+file.name+'". Revisá que tenga los encabezados (Sucursal, ID ITEM, Descripción, talles…).');
  return asignadas;
}
// Ventas ↔ stock por sucursal: mismo layout, así que si la detección por nombre se
// equivocó se intercambian a mano desde el chip.
function swapVentasStock(){
  const v=state.files.ventas; state.files.ventas=state.files.stock; state.files.stock=v;
  state.resultado=null; state.resultadoSemana=null;
  render();
}

// Agrega una hoja a un mapa idItem -> {meta, talles:{}, total, porSuc?}
function filasDeHoja(f){
  const out=[];
  for(let i=f.headerIdx+1;i<f.matrix.length;i++){
    const row=f.matrix[i];
    const id=String(row[f.cols.id]==null?'':row[f.cols.id]).trim();
    if(!id) continue;
    const talles={}; let total=0;
    f.talles.forEach(t=>{ const q=num(row[t.idx]); if(q!==0){ talles[t.label]=(talles[t.label]||0)+q; total+=q; } });
    out.push({
      id,
      suc: f.cols.suc>=0 ? String(row[f.cols.suc]||'').trim() : '',
      meta:{
        rubro:String(row[f.cols.rubro]||'').trim(),
        marca:String(row[f.cols.marca]||'').trim(),
        tipo: f.cols.tipo>=0?String(row[f.cols.tipo]||'').trim():'',    // subrubro
        genero: f.cols.gen>=0?String(row[f.cols.gen]||'').trim():'',
        desc: String(row[f.cols.desc]||'').trim(),
        cod:  f.cols.cod>=0?String(row[f.cols.cod]||'').trim():'',
      },
      talles, total,
    });
  }
  return out;
}

// Cruza reserva x ventas. histPrev = {idItem:total} de la semana anterior (o null).
// histSnaps = array de {idItem:total} de semanas previas ordenadas de más nueva a más vieja.
/* ---------- orden de talles ----------
   Numéricos por valor (35, 35.5, 36…); de letra por la escala de ropa; el resto al final. */
const TALLES_LETRA = ['XXXS','XXS','XS','S','M','L','XL','XXL','XXXL','3XL','4XL','5XL'];
function rankTalle(t){
  const s=String(t==null?'':t).trim().toUpperCase();
  const n=parseFloat(s.replace(',','.')); if(isFinite(n)) return n;
  const i=TALLES_LETRA.indexOf(s); return i>=0 ? 1000+i : Infinity;
}
const cmpTalle = (a,b)=>(rankTalle(a)-rankTalle(b))||cmp(a,b);

// Completar curva: marca cuáles talles faltantes son "huecos internos" (caen entre el
// menor y el mayor talle que la sucursal tiene) y recalcula lo sugerido por talle según
// el parámetro «unidades por talle» y el filtro «solo huecos internos».
function marcarInternos(row){
  const tiene=Object.keys(row.tallesSuc||{}).filter(t=>row.tallesSuc[t]>0).map(rankTalle).filter(isFinite);
  const lo=Math.min(...tiene), hi=Math.max(...tiene);
  row.faltan.forEach(f=>{ const k=rankTalle(f.t); f.interno = tiene.length>0 && isFinite(k) && k>lo && k<hi; });
}
// Reparto de la reserva por artículo × talle (regla de Juli 07/09/2026): primero se
// descuenta lo que ya va por Reposición (lo vendido), y lo que queda del talle se reparte
// entre las sucursales que no lo tienen en orden de PRIORIDAD = la que más vendió el
// artículo esta semana (en cualquier talle); empate → la que más stock tiene del artículo.
// Cada una recibe `unidades` por talle hasta agotar la reserva; las que quedan sin
// unidades se marcan `agotado` (se ve en gris: la reserva se fue a la que más vendió).
function aplicarUnidadesCurva(){
  const R=state.resultado; if(!R||!R.curva) return;
  const f=state.filtrosCur, U=Math.max(1,f.unidades|0);
  // reserva ya comprometida por Reposición, por artículo × talle
  const usoRep={};
  (R.reposicion||[]).forEach(r=>{ Object.entries(r.talles||{}).forEach(([t,d])=>{ const k=r.id+'|'+t; usoRep[k]=(usoRep[k]||0)+((d&&d.s)||0); }); });
  // candidatos por artículo × talle, ordenados por prioridad
  const porArt={};
  R.curva.forEach(row=>{
    row.faltan.forEach(d=>{ d.s=0; d.agotado=false; });
    (porArt[row.id]=porArt[row.id]||[]).push(row);
  });
  Object.entries(porArt).forEach(([id,rows])=>{
    // prioridad del artículo: vendido ↓ · meses de stock ↑ · categoría · stock en la sucursal ↓ (cmpPrioridad)
    const orden=rows.slice().sort(cmpPrioridad);
    orden.forEach((row,i)=>{ row.prio=i+1; row.prioDe=orden.length; });
    const talles=new Set(); rows.forEach(r=>r.faltan.forEach(d=>talles.add(d.t)));
    talles.forEach(t=>{
      const cand=orden.map(r=>({r, d:r.faltan.find(x=>x.t===t)})).filter(x=>x.d && !x.d.ya && !(f.soloHuecos && !x.d.interno));
      if(!cand.length) return;
      let disp=Math.max(0, cand[0].d.r - (usoRep[id+'|'+t]||0));
      cand.forEach(({d})=>{ d.s=Math.min(U, disp); disp-=d.s; if(d.s<=0) d.agotado=true; });
    });
  });
  R.curva.forEach(row=>{ row.sugerido=row.faltan.reduce((a,d)=>a+d.s,0); });
  R.totales.curva_lineas = R.curva.filter(r=>r.sugerido>0).length;
  R.totales.curva_unidades = R.curva.reduce((a,r)=>a+r.sugerido,0);
}

function computar(histPrev, histSnaps){
  const fV = state.files.ventas, fR = state.files.reserva, fS = state.files.stock;
  // ---- reserva ----
  const reserva={};
  filasDeHoja(fR).forEach(r=>{
    if(!reserva[r.id]) reserva[r.id]={ meta:r.meta, talles:{}, total:0 };
    const R=reserva[r.id];
    Object.entries(r.talles).forEach(([t,q])=>{ R.talles[t]=(R.talles[t]||0)+q; });
    R.total+=r.total;
    if(!R.meta.desc && r.meta.desc) R.meta=r.meta;
  });
  // ---- ventas (por sucursal, solo destinos válidos; Depósito/otros quedan afuera) ----
  const ventas={};   // id -> { porSuc:{slug:{nombre,total,talles}}, totalCadena, meta }
  filasDeHoja(fV).forEach(v=>{
    const m = NAME2SLUG[normName(v.suc)];
    if(!m) return;                 // excluye Depósito, "Sucursal" y cualquier no mapeada
    if(v.total<=0) return;
    if(!ventas[v.id]) ventas[v.id]={ porSuc:{}, totalCadena:0, meta:v.meta };
    const V=ventas[v.id];
    if(!V.porSuc[m.slug]) V.porSuc[m.slug]={ nombre:m.nombre, total:0, talles:{} };
    const S=V.porSuc[m.slug];
    Object.entries(v.talles).forEach(([t,q])=>{ if(q>0){ S.talles[t]=(S.talles[t]||0)+q; } });
    S.total+=v.total; V.totalCadena+=v.total;
  });
  // ---- stock por sucursal (hoja opcional): id -> { porSuc:{slug:{nombre,total,talles}}, meta }
  // Solo cuentan los talles con stock POSITIVO (un negativo del sistema vale como cero).
  const stock={};
  if(fS){
    filasDeHoja(fS).forEach(v=>{
      const m = NAME2SLUG[normName(v.suc)];
      if(!m) return;                 // Depósito y no mapeadas quedan afuera
      if(!stock[v.id]) stock[v.id]={ porSuc:{}, meta:v.meta };
      const S0=stock[v.id];
      if(!S0.porSuc[m.slug]) S0.porSuc[m.slug]={ nombre:m.nombre, total:0, talles:{} };
      const S=S0.porSuc[m.slug];
      Object.entries(v.talles).forEach(([t,q])=>{ if(q>0){ S.talles[t]=(S.talles[t]||0)+q; S.total+=q; } });
    });
  }

  // ---- cruce ----
  const reposicion=[];   // una fila por (artículo × sucursal candidata)
  const parada=[];
  Object.entries(reserva).forEach(([id,R])=>{
    if(R.total<=0) return;
    const V=ventas[id];
    if(V && V.totalCadena>0){
      const media = esMediaMateu(R.meta);   // medias Mateu: repone el mínimo del talle vendido
      Object.entries(V.porSuc).forEach(([slug,S])=>{
        let sugerido=0; const detTalles={};
        Object.entries(S.talles).forEach(([t,vq])=>{
          const rq=R.talles[t]||0;
          // MEDIAS: para el talle vendido el objetivo es el mínimo (S:12 M:24 L:36 XL:12),
          // aunque haya vendido menos; talle fuera de la tabla → objetivo = vendido.
          const min = media ? mediasMin(t) : 0;
          const objetivo = min>0 ? min : vq;
          const s = Math.min(objetivo, rq);
          if(vq>0||rq>0) detTalles[t]={v:objetivo, r:rq, s, vend:vq, piso:min>0};
          sugerido+=s;
        });
        reposicion.push({
          id, slug, sucNombre:S.nombre,
          codigo:R.meta.cod||V.meta.cod||'', desc:R.meta.desc||V.meta.desc||'',
          marca:R.meta.marca||V.meta.marca||'', rubro:R.meta.rubro||V.meta.rubro||'', tipo:R.meta.tipo||V.meta.tipo||'',
          genero:R.meta.genero||V.meta.genero||'',
          vendido:S.total, reservaTotal:R.total, sugerido, talles:detTalles, pisoMedias:media,
          pr: prioInfo(slug, R.meta.marca||V.meta.marca||'', R.meta.rubro||V.meta.rubro||''),
        });
      });
    } else {
      // sin venta en toda la cadena -> reserva parada
      const reciente = histPrev ? !(id in histPrev) : null;   // null = primera barrida, sin histórico
      let semanas=1;
      if(histSnaps){ for(const snap of histSnaps){ if(id in snap) semanas++; else break; } }
      parada.push({
        id, codigo:R.meta.cod||'', desc:R.meta.desc||'', marca:R.meta.marca||'', rubro:R.meta.rubro||'', tipo:R.meta.tipo||'',
        reservaTotal:R.total, semanas, ingresoReciente:reciente,
        talles:Object.entries(R.talles).map(([t,q])=>t+':'+q).join('  '),
      });
    }
  });

  // ---- REPARTO de la reserva por artículo × talle (prioridad) ----
  // Hasta acá cada sucursal pidió mín(objetivo, reserva) por su cuenta: si varias piden el
  // mismo talle, la suma puede superar la reserva. Acá se define a quién va: si alcanza
  // para todas, todas reciben lo suyo; si no, se reparte en orden de prioridad (vendido ·
  // meses de stock · categoría, ver cmpPrioridad) y las que quedan cortas se marcan (rec).
  {
    const porArt={}; reposicion.forEach(r=>{ (porArt[r.id]=porArt[r.id]||[]).push(r); });
    Object.values(porArt).forEach(rows=>{
      const orden=rows.slice().sort(cmpPrioridad);
      orden.forEach((r,i)=>{ r.prio=i+1; r.prioDe=orden.length; });
      const talles=new Set(); rows.forEach(r=>Object.keys(r.talles).forEach(t=>talles.add(t)));
      talles.forEach(t=>{
        const cand=orden.filter(r=>r.talles[t] && r.talles[t].v>0);
        if(!cand.length) return;
        const rq=cand[0].talles[t].r, dem=cand.reduce((a,r)=>a+r.talles[t].v,0);
        if(dem<=rq){ cand.forEach(r=>{ const d=r.talles[t]; d.s=d.v; d.rec=0; }); return; }
        let disp=rq;
        cand.slice().sort((a,b)=>cmpPrioridad({...a, vendTalle:a.talles[t].vend},{...b, vendTalle:b.talles[t].vend}))
          .forEach(r=>{ const d=r.talles[t]; d.s=Math.min(d.v, disp); disp-=d.s; d.rec=d.v-d.s; });
      });
      rows.forEach(r=>{ r.sugerido=Object.values(r.talles).reduce((a,d)=>a+d.s,0); r.recorte=Object.values(r.talles).reduce((a,d)=>a+(d.rec||0),0); });
    });
  }

  // ---- COMPLETAR CURVA (necesita la hoja de stock por sucursal) ----
  // La sucursal tiene el artículo (stock en ≥1 talle) pero le faltan talles que SÍ hay
  // en la reserva. Una fila por (artículo × sucursal) con la lista de talles faltantes.
  // Un talle que ya viene por Reposición (lo vendió y se sugiere bajarlo) se marca `ya`
  // y no se vuelve a contar. Lo sugerido por talle lo pone aplicarUnidadesCurva().
  const curva=[];
  if(fS){
    const repIdx={}; reposicion.forEach(r=>{ repIdx[r.id+'|'+r.slug]=r; });
    Object.entries(stock).forEach(([id,S0])=>{
      const R=reserva[id]; if(!R||R.total<=0) return;
      const V=ventas[id];
      Object.entries(S0.porSuc).forEach(([slug,S])=>{
        if(S.total<=0) return;
        const rep=repIdx[id+'|'+slug];
        const faltan=[];
        Object.entries(R.talles).forEach(([t,rq])=>{
          if(rq<=0 || (S.talles[t]||0)>0) return;
          const ya = !!(rep && rep.talles[t] && rep.talles[t].s>0);
          faltan.push({t, r:rq, ya, s:0});
        });
        if(!faltan.length) return;
        faltan.sort((a,b)=>cmpTalle(a.t,b.t));
        const row={
          id, slug, sucNombre:S.nombre,
          codigo:R.meta.cod||S0.meta.cod||'', desc:R.meta.desc||S0.meta.desc||'',
          marca:R.meta.marca||S0.meta.marca||'', rubro:R.meta.rubro||S0.meta.rubro||'', tipo:R.meta.tipo||S0.meta.tipo||'',
          genero:R.meta.genero||S0.meta.genero||'',
          enSucursal:S.total, nTalles:Object.keys(S.talles).length,
          vendido:(V&&V.porSuc[slug])?V.porSuc[slug].total:0, reservaTotal:R.total,
          tallesSuc:S.talles, faltan, sugerido:0,
          pr: prioInfo(slug, R.meta.marca||S0.meta.marca||'', R.meta.rubro||S0.meta.rubro||''),
        };
        marcarInternos(row);
        curva.push(row);
      });
    });
  }

  // ---- vista COMPRAS: por artículo global (no por sucursal) ----
  // Cada artículo vendido en la cadena, con su stock en reserva.
  //   sin reserva  -> mejor vendido a reponer a la marca (recomprar)
  //   con reserva  -> mejor vendido cubierto, solo seguimiento
  const compras=[];
  Object.entries(ventas).forEach(([id,V])=>{
    if(V.totalCadena<=0) return;
    const R=reserva[id];
    const reservaTotal = R? R.total : 0;
    compras.push({
      id, codigo:(R&&R.meta.cod)||V.meta.cod||'',
      desc:(R&&R.meta.desc)||V.meta.desc||'', marca:(R&&R.meta.marca)||V.meta.marca||'',
      rubro:(R&&R.meta.rubro)||V.meta.rubro||'', tipo:(R&&R.meta.tipo)||V.meta.tipo||'',
      vendido:V.totalCadena, reservaTotal, sucursales:Object.keys(V.porSuc).length,
      tieneReserva: reservaTotal>0,
    });
  });

  // snapshot de reserva de esta semana (para futuras barridas)
  const snapshot={}; Object.entries(reserva).forEach(([id,R])=>{ if(R.total>0) snapshot[id]=R.total; });

  const sucSet = new Set(reposicion.map(r=>r.slug));
  const noVarios = a => !/varios|facturacion/i.test(a.rubro+' '+a.tipo);
  // "notable" = mejor vendido (>=3 u. en la semana), mismo umbral que el filtro por defecto de la vista Compras.
  const notable = c => c.vendido>=3 && noVarios(c);
  return {
    reposicion, parada, compras, curva, conStock:!!fS, snapshot,
    totales:{
      curva_lineas: 0, curva_unidades: 0,      // los completa aplicarUnidadesCurva()
      items_reserva: Object.keys(snapshot).length,
      items_reponibles: new Set(reposicion.map(r=>r.id)).size,
      lineas_reposicion: reposicion.length,
      sucursales: sucSet.size,
      unidades_sugeridas: reposicion.reduce((a,r)=>a+r.sugerido,0),
      items_parados: parada.length,
      unidades_paradas: parada.reduce((a,r)=>a+r.reservaTotal,0),
      compras_sin_reserva: compras.filter(c=>!c.tieneReserva && notable(c)).length,
      compras_con_reserva: compras.filter(c=>c.tieneReserva && notable(c)).length,
    },
    sinHistorial: histPrev===null,
  };
}

function setTab(t){ state.tab=t; document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===t)); render(); }

function render(){
  const R=state.resultado;
  $('bRep').textContent = R? R.totales.lineas_reposicion : 0;
  $('bPar').textContent = R? R.totales.items_parados : 0;
  $('bCom').textContent = R? (R.totales.compras_sin_reserva||0) : 0;

function chipArchivo(tipo, label, opcional){
  const f=state.files[tipo];
  // ventas ↔ stock tienen el mismo layout: si la detección por nombre se equivocó, se cambia acá
  const swap = (tipo==='ventas'||tipo==='stock') && f
    ? ' <button type="button" class="lnk" data-swap="1" title="Ventas y stock por sucursal tienen el mismo formato: si esta hoja es la otra, intercambialas">↔ es '+(tipo==='ventas'?'stock por sucursal':'ventas')+'</button>' : '';
  if(f) return '<span class="filechip"><span class="ok">✓</span> '+esc(label)+': <b>'+esc(f.archivo)+'</b> · hoja "'+esc(f.hoja)+'" · '+f.talles.length+' talles'+swap+'</span>';
  return '<span class="filechip"><span class="no">○</span> '+esc(label)+': '+(opcional?'sin cargar <small>(opcional)</small>':'sin cargar')+'</span>';
}

  html+='<div class="card-hs" style="margin:-4px 0 12px"><b>Stock reserva</b> = lo que hay en el depósito central · <span class="sug-badge" style="padding:1px 7px">A reponer</span> = lo que conviene bajar a la sucursal (verde). En Talles, <span class="talles"><span class="tg"><span class="tl">M</span><span class="tv">3</span><span class="tsep">/</span><span class="tr">24</span></span></span> = <b>vendido</b> (navy) / <b>reserva</b> (gris). En rojo <span class="talles"><span class="tg falta"><span class="tl">M</span><span class="tv">3</span><span class="tsep">/</span><span class="tr">1</span><span class="tas">→1</span></span></span> = la reserva del talle no alcanzó para todas las sucursales que lo pidieron: <b>→ lo que le toca</b> a esta según la prioridad (a la marca probablemente haya que <b>reponer</b>). <b>Prioridad</b> = puesto de la sucursal entre las que piden ese artículo (1 = primera): vendido del artículo ↓, meses de stock en la marca-rubro ↑, categoría (pasá el mouse para ver los tres). En filas <span class="pill rec">piso medias</span> los talles muestran <b>objetivo mínimo / reserva</b>.</div>';
  const nFalta = rows.filter(faltaEn).length;
  html+='<div class="tbl-wrap"><table><thead><tr>'
    +th('Sucursal','sucNombre')+th('Artículo','desc')+th('Código','codigo')+th('Marca','marca')
    +thNum('Prioridad','prio')+thNum('Vendido','vendido')+thNum('Stock reserva','reservaTotal')+thNum('A reponer','sugerido')+'<th class="noord">Talles (vend/reserva → recibe)</th>'
    +'</tr></thead><tbody>';
  rows.forEach(r=>{
    const falta=faltaEn(r);
    const piso=r.pisoMedias;
    const tt=Object.entries(r.talles).filter(([t,d])=>d.v>0)
      .map(([t,d])=>{ const rec=d.s<d.v; return '<span class="tg'+(rec?' falta':'')+'"'+(rec?' title="Pidió '+d.v+', reserva del talle '+d.r+': por prioridad recibe '+d.s+'"':'')+'><span class="tl">'+esc(t)+'</span><span class="tv">'+d.v+'</span><span class="tsep">/</span><span class="tr">'+d.r+'</span>'+(rec?'<span class="tas">→'+d.s+'</span>':'')+'</span>'; }).join('');
    const pillPiso = piso?' <span class="pill rec" title="Medias Mateu: para el talle vendido se repone el mínimo (S:12 M:24 L:36 XL:12), aunque haya vendido menos">piso medias</span>':'';
    const tallesTitle = piso?' title="objetivo mínimo / reserva por talle vendido → lo que recibe"':'';
    const prio = r.prio ? '<span class="pill '+(r.prio===1?'rec':'suc')+'" title="Prioridad '+r.prio+' de '+r.prioDe+' sucursales que piden este artículo · '+esc(prioTxt(r))+'">'+r.prio+' de '+r.prioDe+'</span>' : '—';
    html+='<tr><td><span class="pill suc">'+esc(r.sucNombre)+'</span></td>'
      +'<td class="desc" title="'+esc(r.desc)+'">'+esc(r.desc||'—')+pillPiso+(falta?' <span class="pill falta" title="'+(piso?'La reserva no cubre el piso en algún talle':'La reserva no alcanzó en algún talle: recibe menos de lo vendido')+'">⚠ falta</span>':'')+'</td>'
      +'<td class="mono">'+esc(r.codigo||r.id)+'</td><td>'+esc(r.marca)+'</td>'
      +'<td class="num">'+prio+'</td>'
      +'<td class="num mono">'+fmtInt(r.vendido)+'</td><td class="num mono" style="color:var(--muted)">'+fmtInt(r.reservaTotal)+'</td>'

  return html;
}

function viewCompras(){
  const R=state.resultado;
  if(!R) return '<div class="state"><div class="big-ic">⚙️</div>Procesá una barrida en la pestaña «Cargar».</div>';
  if(!R.compras) return '<div class="state"><div class="big-ic">🛒</div>Esta barrida se guardó antes de la vista Compras. Volvé a procesar el Excel para verla.</div>';
  const f=state.filtrosCom;
  const aplica = c => (!f.excluirVarios || !/varios|facturacion/i.test(c.rubro+' '+c.tipo))
    && c.vendido>=f.minVendido
    && (!f.rubro || c.rubro===f.rubro) && (!f.marca || c.marca===f.marca)
    && (!f.q || (c.desc+' '+c.codigo+' '+c.id+' '+c.marca).toLowerCase().includes(f.q.toLowerCase()));
  const base=R.compras.filter(aplica);
  const s=state.sortCom;
  const ord = arr => arr.slice().sort((a,b)=>{ const va=a[s.k],vb=b[s.k]; return (typeof va==='number'?va-vb:cmp(va,vb))*s.dir; });
  const sinRes=ord(base.filter(c=>!c.tieneReserva));
  const conRes=ord(base.filter(c=>c.tieneReserva));
  const frenados=R.parada.filter(p=>(!f.excluirVarios || !/varios|facturacion/i.test(p.rubro+' '+p.tipo)) && (!f.rubro||p.rubro===f.rubro) && (!f.marca||p.marca===f.marca))
    .slice().sort((a,b)=>b.reservaTotal-a.reservaTotal);

  let html='<div class="sec-head"><div><h1>Vista de Compras</h1>'
    +'<div class="sub">Los más vendidos de la semana, separados según haya o no reserva en el depósito. Sin reserva = reponer a la marca; con reserva = seguimiento. Más los artículos frenados.</div></div></div>';

  // filtros comunes
  const rubros=uniq(R.compras.map(c=>c.rubro)), marcas=uniq(R.compras.filter(c=>!f.rubro||c.rubro===f.rubro).map(c=>c.marca));

    +'<div class="fgrp" style="min-width:110px"><label for="cTop">Mostrar</label><select class="sel" id="cTop">'
      +[10,20,30,50,100,0].map(n=>'<option value="'+n+'"'+(f.topN===n?' selected':'')+'>'+(n===0?'Todos':'Top '+n)+'</option>').join('')+'</select></div>'
    +'<div class="fgrp" style="flex:1;min-width:170px"><label for="cQ">Buscar</label><input class="inp" id="cQ" placeholder="artículo, código, marca…" value="'+esc(f.q)+'" style="width:100%"></div>'
    +'<div class="fgrp" style="min-width:auto"><label>&nbsp;</label><label class="chk"><input type="checkbox" id="cVarios" '+(f.excluirVarios?'checked':'')+'> Excluir Varios/Facturación</label></div>'
    +'<div class="fgrp" style="min-width:auto;margin-left:auto"><label>&nbsp;</label><button class="btn btn-outline btn-sm" id="btnCsvCom">⇩ Excel</button></div>'
    +'</div>';

  // KPIs
  html+='<div class="kpis">'
    +kpi('Mejores sin reserva',fmtInt(sinRes.length)+' <small>art.</small>','par')
    +kpi('Unidades a reponer',fmtInt(sinRes.reduce((a,c)=>a+c.vendido,0)),'par')
    +kpi('Mejores con reserva',fmtInt(conRes.length)+' <small>art.</small>','rep')
    +kpi('Artículos frenados',fmtInt(frenados.length)+' <small>art.</small>')
    +'</div>';

  // selector de sección (se ve una a la vez para que no quede una página larguísima)
  const vista=f.vista;
  html+='<div class="segbar">'
    +'<button data-vista="sin" class="'+(vista==='sin'?'on':'')+'">🔴 Sin reserva — reponer a la marca <span class="n">'+fmtInt(sinRes.length)+'</span></button>'
    +'<button data-vista="con" class="'+(vista==='con'?'on':'')+'">🟢 Con reserva — seguimiento <span class="n">'+fmtInt(conRes.length)+'</span></button>'
    +'<button data-vista="frenados" class="'+(vista==='frenados'?'on':'')+'">⏸️ Frenados <span class="n">'+fmtInt(frenados.length)+'</span></button>'
    +'</div>';

  const lim = f.topN>0 ? f.topN : Infinity;
  if(vista==='sin'){
    // resumen por marca de lo SIN reserva (a quién comprarle)
    if(sinRes.length){
      const porMarca={}; sinRes.forEach(c=>{ porMarca[c.marca||'—']=(porMarca[c.marca||'—']||0)+c.vendido; });
      const chips=Object.entries(porMarca).sort((a,b)=>b[1]-a[1]).slice(0,12)
        .map(([m,u])=>'<span class="filechip"><b>'+esc(m)+'</b> · '+fmtInt(u)+' u</span>').join('');
      html+='<div class="card" style="padding:14px"><div class="card-h" style="font-size:16px">A quién reponer (top marcas sin reserva)</div>'
        +'<div style="margin-top:8px">'+chips+'</div></div>';
    }
    html+=seccionCompras('🔴 Mejores vendidos SIN reserva — reponer a la marca', sinRes, lim);
  } else if(vista==='con'){
    html+=seccionCompras('🟢 Mejores vendidos CON reserva — seguimiento', conRes, lim);
  } else {
    html+='<h2 class="card-h" style="font-size:18px;margin:6px 0 8px">⏸️ Artículos frenados <span class="card-hs" style="display:inline">('+fmtInt(frenados.length)+')</span></h2>';
    if(!frenados.length) html+='<div class="card-hs">Sin artículos frenados para estos filtros.</div>';
    else{
      html+='<div class="tbl-wrap"><table><thead><tr><th>Artículo</th><th>Código</th><th>Marca</th><th>Rubro</th><th class="num">Reserva</th><th class="num">Semanas</th></tr></thead><tbody>';
      frenados.slice(0,lim).forEach(p=>{ html+='<tr><td class="desc" title="'+esc(p.desc)+'">'+esc(p.desc||'—')+'</td>'
        +'<td class="mono">'+esc(p.codigo||p.id)+'</td><td>'+esc(p.marca)+'</td><td>'+esc(p.rubro)+'</td>'
        +'<td class="num mono">'+fmtInt(p.reservaTotal)+'</td><td class="num mono">'+fmtInt(p.semanas)+'</td></tr>'; });
      html+='</tbody></table></div>';
      if(frenados.length>lim) html+='<div class="card-hs" style="margin-top:8px">Mostrando los primeros '+fmtInt(lim)+' (de '+fmtInt(frenados.length)+'). Subí «Mostrar» o usá la pestaña «Reserva parada».</div>';
    }
  }
  return html;
}

      +'<td class="num mono"><b>'+fmtInt(c.vendido)+'</b></td><td class="num mono">'+fmtInt(c.sucursales)+'</td>'

/* ---------- Completar curva ---------- */
// Filas de la curva con los filtros de la vista. `paraGuardar` deja pasar solo los
// filtros "de criterio" (varios, vendió, mínimo de talles) y no los de navegación
// (sucursal, rubro, marca, búsqueda): lo que se guarda es lo que el depósito decidió.
function curvaRows(paraGuardar){
  const R=state.resultado, f=state.filtrosCur;
  if(!R||!R.curva) return [];
  let rows=R.curva.filter(r=>r.sugerido>0);
  if(f.excluirVarios) rows=rows.filter(r=>!/varios|facturacion/i.test(r.rubro+' '+r.tipo));
  if(f.soloVendio) rows=rows.filter(r=>r.vendido>0);
  if(f.minTalles>1) rows=rows.filter(r=>r.nTalles>=f.minTalles);
  if(paraGuardar) return rows;
  if(f.suc) rows=rows.filter(r=>r.slug===f.suc);
  if(f.rubro) rows=rows.filter(r=>r.rubro===f.rubro);
  if(f.marca) rows=rows.filter(r=>r.marca===f.marca);
  if(f.genero) rows=rows.filter(r=>(r.genero||'')===f.genero);
  if(f.tipoprod) rows=rows.filter(r=>r.tipo===f.tipoprod);
  if(f.q){ const q=f.q.toLowerCase(); rows=rows.filter(r=>(r.desc+' '+r.codigo+' '+r.id+' '+r.marca).toLowerCase().includes(q)); }
  const s=state.sortCur; rows.sort((a,b)=>{ const va=a[s.k],vb=b[s.k]; return (typeof va==='number'? va-vb : cmp(va,vb))*s.dir; });
  return rows;
}
// La curva completa del artículo en esa sucursal: talles que tiene (navy, con su stock),
// talles que faltan y se mandan (verde: a mandar / reserva) y faltantes que no se mandan
// (gris: ya van por Reposición porque lo vendió, o quedaron afuera por «solo huecos»).
function curvaHtml(r){
  const all=[...new Set([...Object.keys(r.tallesSuc||{}), ...r.faltan.map(d=>d.t)])].sort(cmpTalle);
  const falt={}; r.faltan.forEach(d=>falt[d.t]=d);
  return all.map(t=>{
    const q=(r.tallesSuc||{})[t]||0;
    if(q>0) return '<span class="tg" title="La sucursal tiene '+q+'"><span class="tl">'+esc(t)+'</span><span class="tv">'+q+'</span></span>';
    const d=falt[t]; if(!d) return '';
    if(d.s>0) return '<span class="tg hueco" title="Falta en la sucursal · reserva '+d.r+' · se mandan '+d.s+'"><span class="tl">'+esc(t)+'</span><span class="tv">+'+d.s+'</span><span class="tsep">/</span><span class="tr">'+d.r+'</span></span>';
    const why = d.ya ? 'ya va por Reposición (lo vendió)' : d.agotado ? 'la reserva de este talle ('+d.r+') se asignó a las sucursales que más vendieron el artículo' : 'extremo de la curva (filtro «solo huecos internos»)';
    return '<span class="tg ya" title="Falta en la sucursal · '+why+'"><span class="tl">'+esc(t)+'</span><span class="tv">'+(d.ya?'rep.':d.agotado?'agot.':'·')+'</span></span>';
  }).join('');
}
function viewCurva(){
  const R=state.resultado;
  if(!R) return '<div class="state"><div class="big-ic">⚙️</div>Procesá una barrida en la pestaña «Cargar».</div>';
  if(!R.conStock) return '<div class="state"><div class="big-ic">📊</div>Esta barrida no tiene <b>stock por sucursal</b>.<br><span style="font-size:13px;color:var(--muted)">Subí en «Cargar» el reporte de stock de las sucursales abierto por talle (mismo formato que ventas) y volvé a procesar.</span></div>';
  const f=state.filtrosCur;
  const rows=curvaRows();
  const base=R.curva;
  const sucBySlug={}; base.forEach(r=>sucBySlug[r.slug]=r.sucNombre);
  const sucOpts=Object.entries(sucBySlug).sort((a,b)=>cmp(a[1],b[1])).map(([slug,n])=>'<option value="'+esc(slug)+'"'+(slug===f.suc?' selected':'')+'>'+esc(n)+'</option>').join('');
  const enRubro = base.filter(r=>(!f.rubro||r.rubro===f.rubro)&&(!f.marca||r.marca===f.marca));
  let html='<div class="sec-head"><div><h1>Completar curva de talles</h1>'
    +'<div class="sub">Artículos que la sucursal <b>ya tiene</b> (stock en algún talle) pero con talles que <b>no tiene y sí hay en la reserva</b>. Se manda '+f.unidades+' unidad'+(f.unidades>1?'es':'')+' por talle faltante (ajustable). Primero se descuenta lo que ya va por Reposición; lo que queda de cada talle se reparte <b>con prioridad a la sucursal que más vendió el artículo</b> esta semana (empate: la que más stock tiene). Si la reserva se agota, las que siguen quedan sin ese talle.</div></div></div>';
  html+='<div class="filtros">'
    +fsel('Sucursal','kSuc','<option value="">Todas</option>'+sucOpts)
    +fsel('Rubro','kRubro',opts(uniq(base.map(r=>r.rubro)),f.rubro))
    +fsel('Marca','kMarca',opts(uniq(base.filter(r=>!f.rubro||r.rubro===f.rubro).map(r=>r.marca)),f.marca))
    +fsel('Subrubro','kGenero',opts(uniq(enRubro.map(r=>r.genero)),f.genero))
    +fsel('Tipo de producto','kTipoProd',opts(uniq(enRubro.map(r=>r.tipo)),f.tipoprod))
    +'<div class="fgrp" style="flex:1;min-width:150px"><label for="kQ">Buscar</label><input class="inp" id="kQ" placeholder="artículo, código, ID…" value="'+esc(f.q)+'" style="width:100%"></div>'
    +'</div>'
    +'<div class="filtros">'
    +fsel('Unidades por talle faltante','kUni',[1,2,3].map(n=>'<option value="'+n+'"'+(n===f.unidades?' selected':'')+'>'+n+'</option>').join(''))

function fmulti(label, id, opciones, sel){
  const n=sel.length;
  const txt = !n ? 'Todas' : (n===1 ? sel[0] : n+' de '+opciones.length);

async function procesarBarrida(){
  if(!state.files.ventas || !state.files.reserva){ toast('Faltan las dos hojas','err'); return; }
  let histPrev=null, histSnaps=[];
  try{
    if(FIREBASE_DB_URL){
      // timeout: si la base no existe / está lenta, no bloquear el procesamiento
      const hist = await Promise.race([ fbGet(ROOT+'/reservaHist'), new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),6000)) ]);
      if(hist){
        const keys=Object.keys(hist).filter(k=>k<state.semana).sort().reverse();
        histSnaps=keys.map(k=>hist[k]||{});
        histPrev=histSnaps[0]||null;
      }
    }
  }catch(e){ /* si falla la base, seguimos sin histórico */ }
  // fuentes de la prioridad (meses de stock + categorías); si fallan, se procesa igual
  if(!PRIO.cargado){ toast('Cargando meses de stock y categorías…'); try{ await conTimeout(cargarPrioridad(),20000); }catch(e){ PRIO.cargado=true; } }
  try{
    state.resultado=computar(histPrev, histSnaps);
    state.resultado.prioFuentes={ stock: PRIO.stock?('meses de stock '+PRIO.stockMes):'', cats: PRIO.catsOrigen||'' };
    aplicarUnidadesCurva();
    state.resultadoSemana=null;
    render();
    toast('Barrida procesada','ok');
  }catch(err){ console.error(err); toast('Error al procesar: '+(err.message||err),'err'); }
}

async function guardarBarrida(){
  if(!state.resultado){ toast('Procesá primero','err'); return; }
  if(!FIREBASE_DB_URL){ toast('Sin base configurada','err'); return; }
  const R=state.resultado, sem=state.semana;
  // reposición agrupada por slug (para que cada sucursal baje solo lo suyo)
  const repBySlug={};
  R.reposicion.forEach(r=>{ (repBySlug[r.slug]=repBySlug[r.slug]||[]).push({
    id:r.id, codigo:r.codigo, desc:r.desc, marca:r.marca, rubro:r.rubro, tipo:r.tipo,
    vendido:r.vendido, reservaTotal:r.reservaTotal, sugerido:r.sugerido,
    prio:r.prio||0, prioDe:r.prioDe||0, pr:r.pr||null,   // prioridad con la que se repartió la reserva
    // talles como ARRAY (no objeto): Firebase no admite claves con punto (ej "8.5").
    talles: Object.entries(r.talles).map(([t,d])=>({t, v:d.v, r:d.r, s:d.s}))
  }); });
  // completar curva, también por slug: solo lo que quedó con unidades a mandar con los
  // parámetros elegidos (unidades por talle, huecos, mínimo de talles, vendió).
  const curBySlug={};
  curvaRows(true).forEach(r=>{ (curBySlug[r.slug]=curBySlug[r.slug]||[]).push({
    id:r.id, codigo:r.codigo, desc:r.desc, marca:r.marca, rubro:r.rubro, tipo:r.tipo, genero:r.genero||'',
    enSucursal:r.enSucursal, nTalles:r.nTalles, vendido:r.vendido, reservaTotal:r.reservaTotal, sugerido:r.sugerido,
    prio:r.prio||0, prioDe:r.prioDe||0, pr:r.pr||null,                                        // puesto entre las sucursales del artículo (vendido · meses de stock · categoría)
    talles: r.faltan.filter(d=>d.s>0).map(d=>({t:d.t, r:d.r, s:d.s})),                       // faltantes a mandar
    tiene: Object.keys(r.tallesSuc||{}).sort(cmpTalle).map(t=>({t, q:r.tallesSuc[t]})),      // la curva que ya tiene
  }); });
  const fc=state.filtrosCur;
  const payload={
    meta:{ generado_en:nowISO(), generado_por:SESSION.email||'', semana:sem,
      archivo_ventas:(state.files.ventas||{}).archivo||'', archivo_reserva:(state.files.reserva||{}).archivo||'',
      archivo_stock:(state.files.stock||{}).archivo||'',
      curva_param:{ unidades:fc.unidades, soloHuecos:fc.soloHuecos, minTalles:fc.minTalles, soloVendio:fc.soloVendio, excluirVarios:fc.excluirVarios },
      prioFuentes: R.prioFuentes||null,
      totales:R.totales },
    reposicion:repBySlug,
    curva:curBySlug,
    parada:R.parada,
    compras:R.compras,
  };
  try{
    const btn=$('btnGuardar'); if(btn){ btn.disabled=true; btn.textContent='Guardando…'; }
    await fbPut(ROOT+'/barridas/'+sem, payload);
    await fbPut(ROOT+'/reservaHist/'+sem, R.snapshot);
    await fbPut(ROOT+'/ultima', sem);
    state.resultadoSemana=sem;
    if(!state.histKeys.includes(sem)) state.histKeys.push(sem);
    toast('Barrida guardada ✓','ok');
    render();
  }catch(err){
    console.error(err);
    toast('No se pudo guardar (¿existe la base barrida-mateu?): '+(err.message||err),'err');
    render();
  }
}

async function abrirBarrida(sem){
  try{
    toast('Abriendo…');
    const b=await fbGet(ROOT+'/barridas/'+sem);
    if(!b){ toast('No encontré esa barrida','err'); return; }
    // reconstituir el shape de state.resultado desde lo guardado
    const reposicion=[];
    Object.entries(b.reposicion||{}).forEach(([slug,arr])=>{ (arr||[]).forEach(r=>{
      // talles vuelve como array [{t,v,r,s}] (por el punto en las claves) → reconstruir objeto
      let talles=r.talles;
      if(Array.isArray(talles)){ const o={}; talles.forEach(d=>{ o[d.t]={v:d.v,r:d.r,s:d.s}; }); talles=o; }
      reposicion.push({ ...r, talles:talles||{}, slug, sucNombre:(SLUG_SUC[slug]||OUTLET_SUC[slug]||slug) });
    }); });
    // completar curva: `talles` = faltantes a mandar [{t,r,s}], `tiene` = curva de la sucursal [{t,q}]
    const curva=[];
    Object.entries(b.curva||{}).forEach(([slug,arr])=>{ (arr||[]).forEach(r=>{
      const tallesSuc={}; (r.tiene||[]).forEach(d=>{ tallesSuc[d.t]=d.q; });
      const faltan=(r.talles||[]).map(d=>({t:d.t, r:d.r, s:d.s, ya:false}));
      const row={ ...r, slug, sucNombre:(SLUG_SUC[slug]||OUTLET_SUC[slug]||slug), tallesSuc, faltan, nTalles:r.nTalles||Object.keys(tallesSuc).length };
      delete row.tiene; delete row.talles;
      marcarInternos(row); curva.push(row);
    }); });
    const conStock = curva.length>0 || !!(b.meta && b.meta.archivo_stock);
    state.resultado={ reposicion, parada:b.parada||[], compras:b.compras||null, curva, conStock, snapshot:{}, totales:(b.meta&&b.meta.totales)||{}, sinHistorial:false };
    if(b.meta && b.meta.curva_param) Object.assign(state.filtrosCur, b.meta.curva_param);
    if(b.meta && b.meta.prioFuentes) state.resultado.prioFuentes=b.meta.prioFuentes;
    aplicarUnidadesCurva();
    state.resultadoSemana=sem; state.semana=sem;
    setTab('reposicion');
    toast('Barrida del '+lunesLabel(sem),'ok');
  }catch(err){ toast('No se pudo abrir: '+(err.message||err),'err'); }
}

const BRAND = { navy:'FF0B1527', navyMid:'FF1A2F55', red:'FFCC0000', white:'FFFFFFFF', band:'FFF5F7FC',
  talleBand:'FFEAF0FB', border:'FFDCE3F0', sep:'FF9FB0CC', totalBg:'FFF6F8FD', muted:'FF6B7A99', faltaBg:'FFFDE7E7', faltaTxt:'FFB91C1C' };
function thinBorder(color){ return {top:{style:'thin',color:{argb:color}},bottom:{style:'thin',color:{argb:color}},left:{style:'thin',color:{argb:color}},right:{style:'thin',color:{argb:color}}}; }
async function downloadWorkbook(wb, filename){
  const buf=await wb.xlsx.writeBuffer();
  const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(()=>URL.revokeObjectURL(url),1000);
}
// hoja estilizada genérica: membrete + banda resumen + header navy + autofiltro + freeze
function hojaEstilizada(wb, nombre, titulo, resumen, headers, widths, leftCols){
  const ws=wb.addWorksheet(nombre, {views:[{showGridLines:false}]});
  ws.columns=widths.map(w=>({width:w}));
  const nCols=headers.length; let r=1;
  ws.mergeCells(r,1,r,nCols);
  const tit=ws.getCell(r,1);
  tit.value={ richText:[ {font:{bold:true,size:14,name:'Calibri',color:{argb:BRAND.navy}},text:titulo+'\n'},
    {font:{size:9,name:'Calibri',color:{argb:BRAND.muted}},text:'Depósito Central · Semana del '+lunesLabel(state.semana)} ]};
  tit.alignment={horizontal:'left',vertical:'middle',wrapText:true,indent:1};
  for(let c=1;c<=nCols;c++){ ws.getCell(r,c).fill={type:'pattern',pattern:'solid',fgColor:{argb:BRAND.white}}; ws.getCell(r,c).border={bottom:{style:'medium',color:{argb:BRAND.red}}}; }
  ws.getRow(r).height=34; r++;
  ws.mergeCells(r,1,r,nCols);
  const sub=ws.getCell(r,1); sub.value=resumen; sub.font={size:10,name:'Calibri',color:{argb:BRAND.navy}};
  sub.alignment={horizontal:'left',vertical:'middle',indent:1}; sub.fill={type:'pattern',pattern:'solid',fgColor:{argb:BRAND.band}};
  ws.getRow(r).height=20; r+=2;
  const headerRowIdx=r;
  headers.forEach((h,i)=>{ const c=ws.getCell(r,i+1); c.value=h; c.font={bold:true,color:{argb:BRAND.white},size:10,name:'Calibri'};
    c.fill={type:'pattern',pattern:'solid',fgColor:{argb:BRAND.navy}}; c.alignment={horizontal:i<leftCols?'left':'center',vertical:'middle'}; c.border=thinBorder(BRAND.navy); });
  ws.getRow(r).height=18;
  ws.autoFilter={from:{row:headerRowIdx,column:1},to:{row:headerRowIdx,column:nCols}};
  ws.views=[{state:'frozen', ySplit:headerRowIdx, showGridLines:false}];
  ws.pageSetup={orientation:'landscape', fitToPage:true, fitToWidth:1, fitToHeight:0, margins:{left:0.3,right:0.3,top:0.4,bottom:0.4,header:0.2,footer:0.2}};
  return { ws, headerRowIdx, nCols, leftCols };
}
function filaEstilizada(meta, rowIdx, valores, i, tint){
  const bg = tint || (i%2===0?BRAND.white:BRAND.band);
  valores.forEach((v,idx)=>{ const c=meta.ws.getCell(rowIdx,idx+1); c.value=(v===''||v==null?null:v);
    c.font={size:10,name:'Calibri',color:{argb:BRAND.navy}}; c.alignment={horizontal:idx<meta.leftCols?'left':'center',vertical:'middle'};
    c.fill={type:'pattern',pattern:'solid',fgColor:{argb:bg}}; c.border=thinBorder(BRAND.border); });
}
// filas de reposición filtradas + ordenadas igual que la tabla
function reposFiltradas(){
  const f=state.filtros, R=state.resultado;
  let rows=R.reposicion.slice();
  if(f.excluirVarios) rows=rows.filter(r=>!/varios|facturacion/i.test(r.rubro+' '+r.tipo));
  if(f.soloSugerido) rows=rows.filter(r=>r.sugerido>0 || recortadaPorPrio(r));   // las recortadas por el reparto se ven igual
  if(f.soloFaltante) rows=rows.filter(faltaEn);
  if(f.suc) rows=rows.filter(r=>r.slug===f.suc);
  if(f.rubro) rows=rows.filter(r=>r.rubro===f.rubro);
  if(f.marca) rows=rows.filter(r=>r.marca===f.marca);
  if(f.subrubros.length) rows=rows.filter(r=>f.subrubros.includes(r.genero||''));
  if(f.tipoprod) rows=rows.filter(r=>r.tipo===f.tipoprod);
  if(f.q){ const q=f.q.toLowerCase(); rows=rows.filter(r=>(r.desc+' '+r.codigo+' '+r.id+' '+r.marca).toLowerCase().includes(q)); }
  const s=state.sortRep; rows.sort((a,b)=>{ const va=a[s.k],vb=b[s.k]; return (typeof va==='number'?va-vb:cmp(va,vb))*s.dir; });
  return rows;
}
// Rótulos del membrete y sufijo del nombre de archivo a partir de los filtros.
function exportLabels(rubro, marca, extras){
  const stripNN = s => String(s||'').replace(/^\d+\s*[-–]\s*/,'');
  const rubroLbl = rubro ? stripNN(rubro).toUpperCase() : 'TODOS LOS RUBROS';
  const extra = (extras||[]).filter(Boolean).map(x=>stripNN(x).toUpperCase()).join(' · ');
  const marcaLbl = (marca ? String(marca).toUpperCase() : 'TODAS LAS MARCAS') + (extra?'  ·  '+extra:'');
  const part=(s)=> s? '-'+stripNN(s).replace(/[^A-Za-z0-9]+/g,'') : '';
  return { rubro:rubroLbl, marca:marcaLbl, file: part(rubro)+part(marca)+(extras||[]).map(part).join('') };
}

// Planilla "del depósito", compartida por Reposición y Completar curva:
// Código · Artículo · Descripción · Destino · [talles = cantidad a mandar] · columnas de la derecha.
// cfg = { hoja, titulo, subtitulo, resumen, rows, talles, celda(row,t)->{val,falta},
//         derecha:[{h, w?, val(row), total?, falta?(row)}], archivo }
async function exportPlanilla(cfg){
  if(typeof ExcelJS==='undefined'){ toast('ExcelJS no cargó; recargá la página','err'); return; }
  const {rows, talles, derecha}=cfg;
  const izq=['Código','Artículo','Descripción','Destino'];
  const headers=[...izq, ...talles, ...derecha.map(d=>d.h)];
  const nCols=headers.length; const LZ=izq.length;
  const wb=new ExcelJS.Workbook();
  const ws=wb.addWorksheet(cfg.hoja, {views:[{showGridLines:false}]});
  ws.columns=[{width:16},{width:12},{width:36},{width:20}, ...talles.map(()=>({width:8})), ...derecha.map(d=>({width:d.w||9}))];

  let r=1;
  ws.mergeCells(r,1,r,nCols);
  const tit=ws.getCell(r,1);
  tit.value={ richText:[
    {font:{bold:true,size:15,name:'Calibri',color:{argb:BRAND.navy}},text:cfg.titulo+'\n'},
    {font:{bold:true,size:11,name:'Calibri',color:{argb:BRAND.red}},text:cfg.subtitulo},
    {font:{size:9,name:'Calibri',color:{argb:BRAND.muted}},text:'   ·  Depósito Central  ·  Semana del '+lunesLabel(state.semana)} ]};
  tit.alignment={horizontal:'left',vertical:'middle',wrapText:true,indent:1};
  for(let c=1;c<=nCols;c++){ ws.getCell(r,c).fill={type:'pattern',pattern:'solid',fgColor:{argb:BRAND.white}}; ws.getCell(r,c).border={bottom:{style:'medium',color:{argb:BRAND.red}}}; }
  ws.getRow(r).height=38; r++;

  ws.mergeCells(r,1,r,nCols);
  const sub=ws.getCell(r,1);
  sub.value=cfg.resumen;
  sub.font={size:10,name:'Calibri',color:{argb:BRAND.navy}}; sub.alignment={horizontal:'left',vertical:'middle',indent:1};
  sub.fill={type:'pattern',pattern:'solid',fgColor:{argb:BRAND.band}};
  ws.getRow(r).height=20; r+=2;

  const headerRowIdx=r;
  const esTalleCol = i => i>=LZ && i<LZ+talles.length;   // i base 0
  headers.forEach((h,i)=>{ const c=ws.getCell(r,i+1); c.value=h; c.font={bold:true,color:{argb:BRAND.white},size:i<LZ?10:11,name:'Calibri'};
    // header de talles con banda vertical alternada (para no confundir columnas)
    const fill = esTalleCol(i) ? ((i-LZ)%2===0?BRAND.navy:BRAND.navyMid) : BRAND.navy;
    c.fill={type:'pattern',pattern:'solid',fgColor:{argb:fill}}; c.alignment={horizontal:i<LZ?'left':'center',vertical:'middle'};
    const bd=thinBorder(BRAND.navy); if(i===LZ || i===LZ+talles.length) bd.left={style:'medium',color:{argb:BRAND.sep}}; c.border=bd; });
  ws.getRow(r).height=20; r++;

  rows.forEach((row,i)=>{
    const bg=i%2===0?BRAND.white:BRAND.band;
    // izquierda: Código (barras) · Artículo (ID ITEM) · Descripción · Destino
    [row.codigo||'', row.id, row.desc, row.sucNombre].forEach((v,idx)=>{ const c=ws.getCell(r,idx+1); c.value=(v===''?null:v);
      c.font={size:10,name:'Calibri',color:{argb:BRAND.navy}}; c.alignment={horizontal:'left',vertical:'middle'};
      c.fill={type:'pattern',pattern:'solid',fgColor:{argb:bg}}; c.border=thinBorder(BRAND.border); });
    // talles = cantidad a mandar; rojo si la reserva no alcanza (lo decide cfg.celda).
    // Banda VERTICAL alternada por columna (no por fila) para que no se confundan los talles.
    talles.forEach((t,ti)=>{ const c=ws.getCell(r,LZ+ti+1); const d=cfg.celda(row,t);
      c.value = d.val;
      c.alignment={horizontal:'center',vertical:'middle'};
      const bd=thinBorder(BRAND.border); if(ti===0) bd.left={style:'medium',color:{argb:BRAND.sep}};   // separa del bloque de identidad
      c.border=bd;
      if(d.falta){ c.font={size:11,bold:true,name:'Calibri',color:{argb:BRAND.faltaTxt}}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:BRAND.faltaBg}}; }
      else { c.font={size:11,name:'Calibri',color:{argb:BRAND.navy}}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb: ti%2===0?BRAND.white:BRAND.talleBand}}; }
    });
    // derecha: Total y las analíticas
    derecha.forEach((d,idx)=>{ const c=ws.getCell(r,LZ+talles.length+idx+1); const v=d.val(row); c.value=(v===''||v==null?null:v);
      c.alignment={horizontal:'center',vertical:'middle'};
      const bd=thinBorder(BRAND.border); if(idx===0) bd.left={style:'medium',color:{argb:BRAND.sep}};   // cierra el bloque de talles
      c.border=bd;
      const esFaltaCol=!!(d.falta && d.falta(row)), esTotal=!!d.total;
      c.font={size:10,bold:esTotal||esFaltaCol,name:'Calibri',color:{argb:esFaltaCol?BRAND.faltaTxt:BRAND.navy}};
      c.fill={type:'pattern',pattern:'solid',fgColor:{argb:esFaltaCol?BRAND.faltaBg:(esTotal?BRAND.totalBg:bg)}};
    });
    r++;
  });

  // autofiltro en las columnas de identidad (Código..Destino); los talles quedan sin flecha.
  ws.autoFilter={ from:{row:headerRowIdx,column:1}, to:{row:headerRowIdx,column:LZ} };
  ws.views=[{state:'frozen', xSplit:LZ, ySplit:headerRowIdx, showGridLines:false}];
  ws.pageSetup={orientation:'landscape', fitToPage:true, fitToWidth:1, fitToHeight:0, margins:{left:0.3,right:0.3,top:0.4,bottom:0.4,header:0.2,footer:0.2}};
  await downloadWorkbook(wb, cfg.archivo);
  toast('Excel generado ✓','ok');
}

async function exportRepXlsx(){
  const R=state.resultado; if(!R) return;
  const f=state.filtros;
  const rows=reposFiltradas();
  if(!rows.length){ toast('No hay filas para exportar','err'); return; }
  // columnas de talle: las que tienen SUGERIDO>0 o un recorte en algún artículo de lo filtrado.
  const set=new Set(); rows.forEach(r=>Object.entries(r.talles).forEach(([t,d])=>{ if(d.s>0 || (d.v>0&&d.s<d.v)) set.add(t); }));
  const talles=[...set].sort(cmpTalle);
  const lbl=exportLabels(f.rubro, f.marca, [f.subrubros.join('+'), f.tipoprod]);
  const totU=rows.reduce((a,x)=>a+x.sugerido,0), nFalta=rows.filter(faltaEn).length;
  await exportPlanilla({
    hoja:'Reposición', titulo:'REPOSICIÓN '+lbl.rubro, subtitulo:lbl.marca,
    resumen: fmtInt(rows.length)+' líneas · '+fmtInt(totU)+' unidades a reponer · '+fmtInt(nFalta)+' con recorte de talle (en rojo = la reserva no alcanzó; se repartió por prioridad: vendido · meses de stock · categoría)',
    rows, talles,
    celda:(row,t)=>{ const d=row.talles[t]; const sug=d?d.s:0; const esFalta=!!(d&&d.v>0&&d.s<d.v); return { val: sug>0?sug:(esFalta?0:null), falta:esFalta }; },
    derecha:[ {h:'Total',val:r=>r.sugerido,total:true}, {h:'Vendido',val:r=>r.vendido}, {h:'Reserva',val:r=>r.reservaTotal}, {h:'Falta',w:7,val:r=>faltaEn(r)?'Sí':'',falta:faltaEn},
      {h:'Prioridad',w:10,val:r=>r.prio?(r.prio+' de '+r.prioDe):''}, {h:'Meses stock',w:11,val:r=>(r.pr&&r.pr.ms!=null)?r.pr.ms:''}, {h:'Categoría',w:10,val:r=>CAT_LABEL[(r.pr||{}).cat]||''} ],
    archivo:'reposicion'+lbl.file+'-'+state.semana+'.xlsx',
  });
}

// Completar curva: misma planilla; en cada talle va la cantidad a mandar y a la derecha
// el total, lo que la sucursal tiene, la reserva y la curva que ya tiene.
async function exportCurXlsx(){
  const R=state.resultado; if(!R||!R.conStock){ toast('Esta barrida no tiene stock por sucursal','err'); return; }
  const f=state.filtrosCur;
  const rows=curvaRows();
  if(!rows.length){ toast('No hay filas para exportar','err'); return; }
  const set=new Set(); rows.forEach(r=>r.faltan.forEach(d=>{ if(d.s>0) set.add(d.t); }));
  const talles=[...set].sort(cmpTalle);
  const lbl=exportLabels(f.rubro, f.marca, [f.genero, f.tipoprod]);
  const totU=rows.reduce((a,x)=>a+x.sugerido,0);
  await exportPlanilla({
    hoja:'Completar curva', titulo:'COMPLETAR CURVA '+lbl.rubro, subtitulo:lbl.marca,
    resumen: fmtInt(rows.length)+' líneas · '+fmtInt(totU)+' unidades a mandar · '+f.unidades+' por talle faltante'+(f.soloHuecos?' · solo huecos internos de la curva':''),
    rows, talles,
    celda:(row,t)=>{ const d=row.faltan.find(x=>x.t===t); return { val:(d&&d.s>0)?d.s:null, falta:false }; },
    derecha:[ {h:'Total',val:r=>r.sugerido,total:true}, {h:'En sucursal',w:11,val:r=>r.enSucursal}, {h:'Reserva',val:r=>r.reservaTotal},
      {h:'Tiene (talle×stock)',w:26,val:r=>Object.keys(r.tallesSuc||{}).sort(cmpTalle).map(t=>t+'×'+r.tallesSuc[t]).join('  ')} ],
    archivo:'completar-curva'+lbl.file+'-'+state.semana+'.xlsx',
  });
}
async function exportParXlsx(){
  const R=state.resultado; if(!R) return;
  if(typeof ExcelJS==='undefined'){ toast('ExcelJS no cargó; recargá la página','err'); return; }
  const f=state.filtrosPar;
  let rows=R.parada.slice();
  if(f.excluirVarios) rows=rows.filter(r=>!/varios|facturacion/i.test(r.rubro+' '+r.tipo));
  if(f.soloCronica) rows=rows.filter(r=>r.semanas>=3 && !r.ingresoReciente);
  if(f.rubro) rows=rows.filter(r=>r.rubro===f.rubro);
  if(f.marca) rows=rows.filter(r=>r.marca===f.marca);
  if(f.q){ const q=f.q.toLowerCase(); rows=rows.filter(r=>(r.desc+' '+r.codigo+' '+r.id+' '+r.marca).toLowerCase().includes(q)); }
  const s=state.sortPar; rows.sort((a,b)=>{ const va=a[s.k],vb=b[s.k]; return (typeof va==='number'?va-vb:cmp(va,vb))*s.dir; });
  if(!rows.length){ toast('No hay filas para exportar','err'); return; }
  const wb=new ExcelJS.Workbook();
  const headers=['Rubro','Marca','Artículo','Código','Reserva','Semanas','Estado','Talles'];
  const meta=hojaEstilizada(wb,'Reserva parada','ANÁLISIS DE RESERVA · Reserva parada',
    fmtInt(rows.length)+' artículos · '+fmtInt(rows.reduce((a,r)=>a+r.reservaTotal,0))+' unidades paradas',
    headers,[16,16,34,14,9,9,17,30],4);
  let r=meta.headerRowIdx+1;
  rows.forEach((row,i)=>{
    const estado = row.ingresoReciente===true?'Ingreso reciente':(row.semanas>=3?'Crónica '+row.semanas+' sem':'');
    filaEstilizada(meta,r,[row.rubro,row.marca,row.desc,(row.codigo||row.id),row.reservaTotal,row.semanas,estado,row.talles],i);
    r++;
  });
  await downloadWorkbook(wb,'reserva-parada-'+state.semana+'.xlsx');
  toast('Excel generado ✓','ok');
}
async function exportComXlsx(){
  const R=state.resultado; if(!R||!R.compras){ toast('Sin datos de compras','err'); return; }
  if(typeof ExcelJS==='undefined'){ toast('ExcelJS no cargó; recargá la página','err'); return; }
  const f=state.filtrosCom;
  const aplica = c => (!f.excluirVarios || !/varios|facturacion/i.test(c.rubro+' '+c.tipo))
    && c.vendido>=f.minVendido && (!f.rubro||c.rubro===f.rubro) && (!f.marca||c.marca===f.marca)
    && (!f.q || (c.desc+' '+c.codigo+' '+c.id+' '+c.marca).toLowerCase().includes(f.q.toLowerCase()));
  const rows=R.compras.filter(aplica).sort((a,b)=>b.vendido-a.vendido);
  if(!rows.length){ toast('No hay filas para exportar','err'); return; }
  const wb=new ExcelJS.Workbook();
  const headers=['Categoría','Rubro','Marca','Artículo','Código','Vendido','Sucursales','Reserva'];
  const sin=rows.filter(c=>!c.tieneReserva).length;
  const meta=hojaEstilizada(wb,'Compras','ANÁLISIS DE RESERVA · Compras',
    fmtInt(rows.length)+' artículos · '+fmtInt(sin)+' sin reserva (reponer a la marca) · '+fmtInt(rows.length-sin)+' con reserva (seguimiento)',
    headers,[28,16,16,34,14,9,10,9],4);
  let r=meta.headerRowIdx+1;
  rows.forEach((c,i)=>{
    const cat=c.tieneReserva?'CON reserva — seguimiento':'SIN reserva — reponer a la marca';
    const tint=c.tieneReserva ? (i%2===0?'FFF1FAF4':'FFE9F6EC') : (i%2===0?'FFFDF3F3':'FFFBE9E9');
    filaEstilizada(meta,r,[cat,c.rubro,c.marca,c.desc,(c.codigo||c.id),c.vendido,c.sucursales,c.reservaTotal],i,tint);
    r++;
  });
  await downloadWorkbook(wb,'compras-'+state.semana+'.xlsx');
  toast('Excel generado ✓','ok');
}
