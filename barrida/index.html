/* ---------- lectura de la estadística de remitos ----------
   Soporta: (a) el pivot del sistema «Estad remitos <año>.csv» (una columna Cant.recibido + Costo
   por mes, encabezados de texto vacíos → las columnas se reconocen por contenido); (b) el Excel
   «Remitos de ingreso» (mismo pivot con encabezados); (c) un export con columna Remito y
   columnas de TALLE (si el sistema lo saca abierto por talle, se usan esos talles). */
function repCsvMatriz(buf){
  const u8=new Uint8Array(buf);
  const utf8 = u8[0]===0xEF && u8[1]===0xBB && u8[2]===0xBF;
  let txt; try{ txt=new TextDecoder(utf8?'utf-8':'windows-1252').decode(buf); }catch(e){ txt=new TextDecoder().decode(buf); }
  if(txt.charCodeAt(0)===0xFEFF) txt=txt.slice(1);
  const lineas=txt.split(/\r?\n/).filter(l=>l.length);
  const l0=lineas[0]||''; const sep=(l0.match(/;/g)||[]).length>=(l0.match(/,/g)||[]).length?';':',';
  return lineas.map(l=>l.split(sep).map(c=>c.trim().replace(/^"(.*)"$/,'$1')));
}
function repEsTalle(l){
  const s=nrmT(l); if(!s || /TOTAL|CANT|COSTO|IMPORTE/.test(s)) return false;
  const n=Number(s); if(isFinite(n)) return n>0 && n<70;
  return TALLES_LETRA.includes(s) || /^(UNI|UNICO|U|\d{1,2}A|\d{1,2}-\d{1,2}|XS\/S|S\/M|M\/L|L\/XL|XL\/XXL|SM|ML|YS|YM|YL|JR|SR)$/.test(s);
}
function repParseRemitos(M, archivo){
  const txt=c=>String(c==null?'':c).trim();
  const lim=Math.min(15, M.length);
  let cantRow=-1, hRow=-1;
  for(let i=0;i<lim;i++){ if((M[i]||[]).some(c=>/cant\.?\s*recib/i.test(txt(c)))){ cantRow=i; break; } }
  for(let i=0;i<lim;i++){ if((M[i]||[]).some(c=>/remito/i.test(txt(c)))){ hRow=i; break; } }
  const qcols=[], tcols=[]; let start, primeraQ;
  const ALI={ remito:/remito|comprobante/i, id:/id\.?\s*item|^item$/i, cod:/c[oó]d/i, desc:/art[ií]culo|descrip/i, marca:/^marca/i,
    rubro:/^rubro/i, genero:/sub\s*-?rubro|g[eé]nero/i, disc:/disciplina/i, tipo:/grupo\s*1|^tipo/i, prov:/proveedor/i,
    talle:/^tall?[ae]s?$|^talla|^size/i };   // estadística abierta por talle: una fila por remito × artículo × talle
  const col={};
  const porNombre=(fila, hasta)=>{ for(let j=0;j<hasta;j++){ const h=txt((M[fila]||[])[j]); if(!h) continue; for(const k in ALI){ if(col[k]==null && ALI[k].test(h)){ col[k]=j; break; } } } };
  if(cantRow>=0){
    // pivot: una columna Cant.recibido por mes (el mes está en alguna fila de arriba)
    (M[cantRow]||[]).forEach((c,j)=>{ if(!/cant/i.test(txt(c))) return;
      let mes=null, esTotal=false;
      for(let i=cantRow-1;i>=0;i--){ const v=txt((M[i]||[])[j]); if(!v) continue; if(/total/i.test(v)){ esTotal=true; break; } if(/^\d{1,2}(\.0+)?$/.test(v) && +v>=1 && +v<=12){ mes=+v; break; } }
      if(!esTotal) qcols.push({j, mes});
    });
    if(!qcols.length) throw new Error('Encontré «Cant.recibido» pero ninguna columna de mes.');
    start=cantRow+1; primeraQ=qcols[0].j;
    for(let i=0;i<=cantRow;i++) porNombre(i, primeraQ);
  } else if(hRow>=0){
    // plano: columna Remito + columnas de talle (o una de cantidad)
    const H=M[hRow]||[]; porNombre(hRow, H.length);
    const ident=Object.values(col); const ultimo=ident.length?Math.max(...ident):0;
    for(let j=ultimo+1;j<H.length;j++){ const l=txt(H[j]); if(repEsTalle(l)) tcols.push({j, t:l.replace(/\.0+$/,'')}); else if(/cant|unid/i.test(l) && !tcols.length) qcols.push({j, mes:null}); }

    throw new Error('No reconocí la estadística de remitos: no hay una fila con «Cant.recibido» ni una columna «Remito». Leí: '+(M[0]||[]).slice(0,12).map(txt).filter(Boolean).join(' · '));
  }

  const textCols=[]; for(let j=0;j<primeraQ;j++) textCols.push(j);
  const sample=[]; for(let i=start;i<M.length && sample.length<400;i++){ const r=M[i]||[]; if(textCols.some(j=>txt(r[j]))) sample.push(r); }
  const vals=j=>sample.map(r=>txt(r[j])).filter(Boolean);
  const frac=(j,rx)=>{ const v=vals(j); return v.length ? v.filter(x=>rx.test(x)).length/v.length : 0; };
  const libres=()=>textCols.filter(j=>!Object.values(col).includes(j));
  const pick=(k, score, min)=>{ if(col[k]!=null) return; let best=-1, bs=min; libres().forEach(j=>{ const s=score(j); if(s>bs){ bs=s; best=j; } }); if(best>=0) col[k]=best; };

  pick('genero', j=>frac(j,/HOMBRE|DAMA|MUJER|NI.O|UNISEX|INFANT|VARIOS/i), .6);
  pick('cod', j=>{ const v=vals(j); if(!v.length) return 0; const f=v.filter(x=>/^\S{5,}$/.test(x)&&/[A-Z]/i.test(x)&&/\d/.test(x)).length/v.length; return f>=.7 ? f+new Set(v).size/v.length : 0; }, .7);

  if(!tcols.length) pick('talle', j=>{ const v=vals(j); if(v.length<5) return 0; const f=v.filter(x=>repEsTalle(x.replace(/\.0+$/,''))).length/v.length; return (f>=.9 && new Set(v).size<=80) ? f : 0; }, .89);
  pick('desc', j=>{ const v=vals(j); if(!v.length) return 0; const f=v.filter(x=>/\s/.test(x)).length/v.length; return f>=.6 ? v.reduce((a,x)=>a+x.length,0)/v.length : 0; }, 0);
  pick('disc', j=>frac(j,/RUNNING|CASUAL|TRAINING|FUTBOL|ADVENTURE|OUTDOOR|BASQUET|TENIS|PADEL|HOCKEY|NATACION|ORIGINALS|TREKKING|SKATE|VOLEY|RUGBY/i), .3);
  pick('tipo', j=>frac(j,/CALZADO|REMERA|PANTAL|CAMPER|BUZO|SHORT|MEDIA|MOCHIL|BOLSO|GORRO|CAMISET|CALZA|SANDAL|CHINEL|OJOTA|PELOTA|MUSCUL|CHOMBA|CONJUNT|MALLA|TOP|GUANTE|BERMUDA|ANTIPARR|CANILLER|GIFT/i), .4);
  if(col.marca==null && libres().includes(0)) col.marca=0;
  if(col.remito==null) throw new Error('No encontré la columna del número de remito (0005-000…).');
  if(col.id==null && col.cod==null) throw new Error('No encontré la columna del ID ITEM ni la del código del artículo.');
  const anio=(String(archivo||'').match(/20\d{2}/)||[])[0] || String(new Date().getFullYear());
  const g=(r,k)=>col[k]!=null?txt(r[col[k]]):'';
  const map=new Map();
  for(let i=start;i<M.length;i++){
    const r=M[i]||[]; const nro=g(r,'remito'); if(!nro || /total/i.test(nro)) continue;
    const id=g(r,'id').replace(/\.0+$/,''), cod=g(r,'cod'); const k=id||cod; if(!k) continue;
    let f=map.get(nro+'|'+k);
    const conT=tcols.length>0 || col.talle!=null;
    if(!f){ f={ remito:nro, id:k, cod, desc:g(r,'desc'), marca:g(r,'marca'), rubro:g(r,'rubro'), genero:g(r,'genero'), disc:g(r,'disc'), tipo:g(r,'tipo'), porMes:{}, talles:conT?{}:null, total:0 }; map.set(nro+'|'+k, f); }
    if(tcols.length) tcols.forEach(q=>{ const u=numR(r[q.j]); if(u>0){ f.talles[q.t]=(f.talles[q.t]||0)+u; f.total+=u; } });
    else {
      // con columna de talle, cada fila es un talle: se abre por mes y por talle (exacto, sin estimar)
      const t = col.talle!=null ? g(r,'talle').replace(/\.0+$/,'') : '';
      if(col.talle!=null && (!t || /total/i.test(t))) continue;
      qcols.forEach(q=>{ const u=numR(r[q.j]); if(u>0){ const m=q.mes!=null?String(q.mes):''; f.porMes[m]=(f.porMes[m]||0)+u; f.total+=u;
        if(t){ f.talles[t]=(f.talles[t]||0)+u; const tm=(f.tallesMes=f.tallesMes||{}); (tm[m]=tm[m]||{})[t]=(tm[m][t]||0)+u; } } });
    }
  }
  const filas=[...map.values()].filter(f=>f.total>0);
  const meses=[...new Set(qcols.map(q=>q.mes).filter(m=>m!=null))].filter(m=>filas.some(f=>f.porMes[String(m)]>0)).sort((a,b)=>a-b);
  return { archivo, anio, meses, conTalles:tcols.length>0 || col.talle!=null, filas, nRemitos:new Set(filas.map(f=>f.remito)).size };
}
// unidades de una fila en el mes elegido (sin meses en el archivo, todo)
function repUDe(D, x, m){ return (!m || !(D.meses||[]).length) ? x.total : (x.porMes[m]||0); }

function repTallesMes(D, x, m){
  if(!x.talles) return null;
  if(m && (D.meses||[]).length && x.tallesMes) return Object.assign({}, x.tallesMes[String(m)]||{});

/* ---------- de dónde salen los talles ----------
   Del export si viene abierto por talle; si no, del reporte de stock del depósito cargado en la
   Barrida (o del stock por sucursal, filas «Depósito»). */
function repFuenteReserva(){ return state.files.reserva || state.files.stock || null; }
function repReserva(){
  const f=repFuenteReserva(); if(!f) return null;
  const C=state.rep._resCache;                       // el archivo se relee en cada render: se cachea
  if(C && C.f===f) return C.map;
  const out={};
  filasDeHoja(f).forEach(r=>{
    if(f.cols.suc>=0 && !/deposito/i.test(sinAcento(r.suc))) return;
    const o=out[r.id]||(out[r.id]={talles:{}, dias:{}, total:0, meta:r.meta, conDias:!!f.conDias});
    Object.entries(r.talles).forEach(([t,q])=>{ o.talles[t]=(o.talles[t]||0)+q;
      // días desde la última compra del talle (los trae el reporte de stock nuevo): la más reciente
      const d=r.dias?r.dias[t]:null; if(d!=null) o.dias[t] = o.dias[t]==null ? d : Math.min(o.dias[t], d); });
    o.total+=r.total;
    if(!o.meta.desc && r.meta.desc) o.meta=r.meta;
    // el Excel «Remitos de ingreso» no trae ID ITEM, solo el código: también se busca por ahí
    if(r.meta.cod) out['cod:'+r.meta.cod.toUpperCase()]=o;
  });
  state.rep._resCache={f, map:out};
  return out;
}

/* ---------- el hueco entre los dos reportes (Juli, 12/09/2026) ----------
   El Reparto inicial sale de la estadística de REMITOS y la Barrida del reporte de STOCK con
   «Días u.compra». Un artículo puede tener compra de hace pocos días en el stock y no figurar en
   ningún remito de la lista (o directamente no estar en la estadística): la Barrida no lo reparte
   —lo ve nuevo— y sin esto tampoco lo repartiría el Reparto inicial. Esos artículos se suman
   solos, en una tarjeta aparte «Ingresó hace poco · sin remito», con las mismas reglas. El corte
   en días es UNO SOLO para las dos pestañas: `state.filtros.diasNuevo`. */
const REP_NUEVO = '__nuevo__';
// hace cuántos días se repartió por última vez este artículo (memoria de envíos); null si nunca
function repRepartidoHace(id){
  const H=state.rep.hist, e=H&&H[repKey(id)]; if(!e) return null;
  let ts=0; Object.values(e).forEach(x=>{ if(x && x.ts>ts) ts=x.ts; });
  return ts ? Math.floor((Date.now()-ts)/864e5) : null;
}
// qué marcas-rubros se están repartiendo (el depósito reparte por marca): las de los remitos
// marcados; si no hay ninguno, los filtros Marca / Rubro de la lista. null = todas
function repFiltroSegSel(){
  const S=state.rep, D=S.data, m=S.mes, set=new Set();
  if(D) D.filas.forEach(x=>{ if(!S.sel[x.remito]) return; const u=repUDe(D,x,m); if(u>0) set.add(segDe(x.marca, x.rubro)); });
  if(set.size) return meta=>set.has(segDe(meta.marca, meta.rubro));
  const fm=normMarca(S.f.marca), fr=stripNN(S.f.rubro).toUpperCase().trim();
  if(fm||fr) return meta=>(!fm||normMarca(meta.marca)===fm) && (!fr||stripNN(meta.rubro).toUpperCase().trim()===fr);
  return null;
}
function repNuevosSinRemito(reserva, idsSel, N, acepta){
  const out=[];
  if(!reserva || !N) return out;
  Object.keys(reserva).forEach(id=>{
    if(id.indexOf('cod:')===0) return;                       // alias por código del mismo artículo
    const R=reserva[id]; if(!R || !R.conDias) return;
    if(acepta && !acepta(R.meta||{})) return;               // otra marca-rubro: no es de este reparto
    const cod=(R.meta&&R.meta.cod)||'';
    if(idsSel.has(id) || (cod && idsSel.has('cod:'+cod.toUpperCase()))) return;   // ya viene por un remito
    const talles={}; let u=0, dias=null;
    Object.entries(R.talles).forEach(([t,q])=>{ const d=R.dias?R.dias[t]:null;
      if(q>0 && d!=null && d<N){ talles[t]=q; u+=q; dias = dias==null ? d : Math.min(dias,d); } });
    if(!u) return;
    const hace=repRepartidoHace(id);
    if(hace!=null && hace<N) return;                         // ya se repartió cuando era nuevo
    const m=R.meta||{};
    out.push({ id, cod, desc:m.desc||'', marca:m.marca||'', rubro:m.rubro||'', genero:m.genero||'', disc:m.disc||'', tipo:m.tipo||'',
      rem:[{ nro:REP_NUEVO, u, talles }], sinRemito:true, diasDepo:dias });
  });
  return out;
}
// enteros proporcionales a los pesos que suman `total` (mayor resto)
function lrReparto(pesos, total){
  const n=pesos.length; if(total<=0||!n) return pesos.map(()=>0);
  const s=pesos.reduce((a,b)=>a+Math.max(0,b),0); const w=s>0?pesos.map(x=>Math.max(0,x)):pesos.map(()=>1); const sw=w.reduce((a,b)=>a+b,0);
  const base=w.map(x=>Math.floor(x*total/sw)); let resto=total-base.reduce((a,b)=>a+b,0);
  const ord=w.map((x,i)=>({i, fr:x*total/sw-base[i]})).sort((a,b)=>b.fr-a.fr||a.i-b.i);
  for(let k=0;resto>0;k=(k+1)%n){ base[ord[k].i]++; resto--; }
  return base;
}
function repTallesDe(a, reserva){
  if(a.rem.every(r=>r.talles && sumT(r.talles)>0)) return { perRem:a.rem.map(r=>({nro:r.nro, t:Object.assign({},r.talles)})), estimado:false, faltan:0 };
  const R=reserva && (reserva[a.id] || (a.cod && reserva['cod:'+a.cod.toUpperCase()])); if(!R) return null;
  const ts=Object.keys(R.talles).filter(t=>R.talles[t]>0).sort(cmpTalle);
  const totR=ts.reduce((s,t)=>s+R.talles[t],0); if(totR<=0) return null;
  const U=a.rem.reduce((s,r)=>s+r.u,0);
  // la reserva de hoy puede tener stock viejo (más que el remito) o ya haber salido algo (menos)
  const disp = totR<=U ? ts.map(t=>R.talles[t]) : lrReparto(ts.map(t=>R.talles[t]), U);
  const cap=a.rem.map(r=>r.u), perRem=a.rem.map(r=>({nro:r.nro, t:{}}));
  ts.forEach((t,k)=>{ const q=disp[k]; if(q<=0) return;
    const w=cap.map(c=>Math.max(0,c)); const parts=lrReparto(w.some(x=>x>0)?w:a.rem.map(r=>r.u), q);
    parts.forEach((p,i)=>{ if(p>0){ perRem[i].t[t]=(perRem[i].t[t]||0)+p; cap[i]-=p; } }); });
  return { perRem, estimado:true, faltan:Math.max(0,U-totR) };
}

/* ---------- grupo del artículo y talles centrales ---------- */
function repGrupo(a){
  const rub=sinAcento(stripNN(a.rubro)).toUpperCase();
  const gen=sinAcento(stripNN(a.genero)+' '+(a.tipo||'')).toUpperCase();
  const fam = /CALZ/.test(rub)?'calz' : /INDUM/.test(rub)?'ind' : '';
  const g = /INFANT|BEBE|BABY/.test(gen)?'infante' : /\bNIN[OA]S?\b|\bKIDS?\b|JUNIOR/.test(gen)?'nino'
    : /DAMA|MUJER|FEMEN|WOMEN/.test(gen)?'dama' : /HOMBRE|MASCUL|\bMEN\b/.test(gen)?'hombre' : /UNISEX/.test(gen)?'unisex' : '';
  // subrubro VARIOS (medias, accesorios, indumentaria sin género): no es adulto ni niño, va a TODOS los locales,
  // Mateu Kids incluido (Juli 23/09/2026). No cambia el género (sin talles centrales ni prioridad de niño).

/* Orden de talles del calzado de NIÑO en escala US (informe Crocs 17/09/2026): la escala infantil da la vuelta —
   C6·C8·C10·C12·C13 y después J1·J2·J3 (en Nike/adidas 10K…13.5K y después 1Y…6Y)—, así que el 1·2·3 son los MÁS
   GRANDES, no los más chicos. Ordenados por número, la curva progresiva salía al revés (x2 a los chicos).
   Se detecta por la letra (J/Y = juvenil, C/K = niño) o, sin letra, por contenido: si la curva llega a 10–13.5 y
   además trae talles de hasta 3.5, el tramo chico corrido desde el mínimo (pasos de hasta 1.5) es juvenil.
   La escala AR (17…34) no entra nunca acá: no tiene talles de 3.5 para abajo. */
function ordenTallesNino(labels){
  const info=labels.map(t=>{ const s=String(t==null?'':t).trim().toUpperCase(); const n=parseFloat(s.replace(/^[A-Z]+/,'').replace(',','.'));
    return { t, n, juv:/^[JY]|\d\s*Y$/.test(s), nin:/^[CK]|\d\s*[CK]$/.test(s) }; });
  const nums=info.filter(x=>isFinite(x.n));
  if(nums.length && !nums.some(x=>x.juv) && Math.max(...nums.map(x=>x.n))>=10 && Math.max(...nums.map(x=>x.n))<=13.5 && Math.min(...nums.map(x=>x.n))<=3.5){
    const ch=nums.filter(x=>!x.nin && x.n<8).sort((a,b)=>a.n-b.n);
    for(let i=0;i<ch.length;i++){ if(i>0 && ch[i].n-ch[i-1].n>1.5) break; ch[i].juv=true; }
  }
  const rk=x=>isFinite(x.n) ? (x.juv ? x.n+14 : x.n) : rankTalle(x.t);
  return info.slice().sort((a,b)=>(rk(a)-rk(b))||cmp(a.t,b.t)).map(x=>x.t);
}
function repCentralesTabla(){ return Object.assign({}, CENTRALES_DEF, state.rep.centrales||{}); }
function repCentrales(a, labels){

  }

  // calzado unisex (Juli 14/09/2026): si uno de los dos subrubros no tiene sus centrales completos (menos de 2 de
  // los 3), el artículo se toma como del otro: p.ej. MR530CK con 5.5/6/6.5 de dama y solo el 9 de hombre = dama,
  // y los talles de hombre van como el resto (1 por sucursal)
  if(G.key==='calz-unisex'){

    const cuenta=lst=>new Set(lst.map(nrmT).filter(t=>L.has(t))).size;
    const dOk=cuenta(dama)>=2, hOk=cuenta(homb)>=2;
    const usa = dOk && !hOk ? ['dama',dama] : hOk && !dOk ? ['hombre',homb] : null;
    if(usa){ const S0=new Set(usa[1].map(nrmT)); const set=new Set(labels.filter(t=>S0.has(nrmT(t))));
      if(set.size) return { G, set, regla:'calzado unisex tomado como '+usa[0]+' (el otro subrubro no tiene sus talles centrales completos)' }; }
  }

  if(ord.length<3) return { G, set:new Set(), regla:'curva corta: 1 por talle' };
  const set=new Set([ord[Math.floor((ord.length-1)/2)], ord[Math.floor(ord.length/2)]]);
  // calzado niño/infante (Juli 17/09/2026): curva «progresiva» = la mitad más chica x1 y la más grande x2
  // (en 8 talles: los primeros 4 x1 y los últimos 4 x2; impar: la mitad más grande lleva el talle del medio),
  // o «chata» = x1 en todos. `per` = unidades por talle; `set` queda como antes para la Barrida.
  if(G.fam==='calz' && (G.g==='nino' || G.g==='infante')){

  }
  return { G, set, regla:'sin regla para '+(GRUPO_LBL[G.key]||'este tipo')+': los talles del medio' };
}

  if(antes(new Date(y,11,25))) return 'Navidad';
  const cole = h0>=new Date(y,0,15) && h0<=new Date(y,2,10);
  if(cole && (/mochila/.test(txt) || (kids && G.fam==='calz'))) return 'Vuelta al cole';
  return '';
}

/* 6 · ROTACIÓN DEL REINGRESO. Para la sucursal que ya tiene el artículo: cuánto recibió del depósito en los últimos
       REP_ROT_MESES meses (envíos de logística) contra lo que le queda hoy (stock por sucursal).
         rotación ≥ 60 % (lo agota)      → recibe la curva entera y con perfil «honda»
         rotación < 50 % (tiene la mitad o más de lo que recibió) → solo se le completan los talles que le faltan
         en el medio, o sin datos de envíos → como hasta ahora (si lo vende, curva entera; si no, completa)
       Los envíos se bajan una vez por sesión y solo si hay stock por sucursal cargado. */
const REP_ROT_MESES = 4, REP_ROT_ALTA = 0.6, REP_ROT_BAJA = 0.5;
let REP_ENVIOS = null;                       // {<clave logística del código>:{<slug>:unidades}}
const repLogiKey = cod => String(cod||'').trim().replace(/[.#$\[\]\/]/g,'_');
async function repCargarEnvios(){
  if(REP_ENVIOS) return REP_ENVIOS;
  try{
    const ks=await conTimeout(fbGet(LOGI+'/meses','shallow=true'),8000);
    const meses=Object.keys(ks||{}).sort().slice(-REP_ROT_MESES); if(!meses.length) return null;
    const envs=await Promise.all(meses.map(ym=>conTimeout(fbGet(LOGI+'/meses/'+ym+'/envios'),60000).catch(()=>null)));
    const n2s={}; Object.entries(Object.assign({}, SLUG_SUC, OUTLET_SUC, SUC_EXTRA)).forEach(([sl,n])=>{ n2s[normName(n)]=sl; });
    const out={};
    envs.forEach(e=>{ (Array.isArray(e)?e:Object.values(e||{})).forEach(r=>{
      if(!r) return; const sl=n2s[normName(r[1])], u=Number(r[2])||0; if(!sl || u<=0) return;
      const o=out[r[0]]||(out[r[0]]={}); o[sl]=(o[sl]||0)+u; }); });
    REP_ENVIOS=out; REP_ENVIOS._meses=meses;
    return out;
  }catch(e){ return null; }
}
function repRotacion(a, slug, stock){
  if(!REP_ENVIOS || !stock || !a.cod) return null;
  const rec=(REP_ENVIOS[repLogiKey(a.cod)]||{})[slug]||0; if(rec<=0) return null;
  const st=Object.values(stock).reduce((x,q)=>x+(Number(q)||0),0);
  return { rec, stock:st, r:Math.max(0, Math.min(1, 1-st/rec)) };
}

/* CRITERIO «abrir a más locales» / «mayor profundidad» POR REMITO Y POR ARTÍCULO (Juli 20/09/2026). El portal propone uno
   de forma preliminar y se corrige a mano: manda lo elegido en el ARTÍCULO, si no lo del REMITO, si no el select general
   y, si ese está en «automático», la propuesta. Propuesta: unidades que entraron ÷ curva base = para cuántas sucursales
   alcanza; si alcanza para menos de la mitad de las candidatas → profundidad (pocas unidades: se concentran en las
   primeras por prioridad); si no → abrir. Un artículo que vino en varios remitos toma el criterio del remito que más trae. */
function repCriterioDe(a, perRem, labels, C, P, nCands){
  const S=state.rep, tot=perRem.reduce((x,r)=>x+sumT(r.t),0);
  const curva=labels.reduce((x,t)=>x+(C.per ? (C.per[t]||1) : C.set.has(t) ? P.uCentral : P.uResto),0) || 1;
  const alcanza=Math.floor(tot/curva);
  const auto = (nCands>0 && alcanza < nCands/2) ? 'profundidad' : 'abrir';
  const ok=v=>v==='abrir'||v==='profundidad';
  const remTop=perRem.slice().sort((x,y)=>sumT(y.t)-sumT(x.t)).map(r=>r.nro).find(n=>ok((S.criRem||{})[n]));
  let c, origen;
  if(ok((S.criArt||{})[a.id])){ c=S.criArt[a.id]; origen='art'; }
  else if(remTop){ c=S.criRem[remTop]; origen='remito'; }
  else if(ok(P.criterio)){ c=P.criterio; origen='general'; }
  else { c=auto; origen='auto'; }
  return { c, origen, auto, alcanza, nCands, tot, curva };
}
function repCandidatos(a, G, destinos){
  const P=state.rep.param, out=[];
  const VA=repVentaArt();
  destinos.forEach(slug=>{
    const asig=repAsig(slug, a, G); if(!asig) return;
    const vm=ventasMarcaDe(slug, a.marca, a.rubro);
    // «lo vende»: con el archivo de ventas, que haya vendido el artículo; sin él, que venda la marca en el rubro
    const vendeArt = VA ? !!((VA[a.id]||{})[slug]>0) : !!(vm && vm.v>0);
    const kidsArt = G.g==='nino' || G.g==='infante';
    const stockC=(REP_STOCK && REP_STOCK[a.id] && Object.keys(REP_STOCK[a.id][slug]||{}).length) ? REP_STOCK[a.id][slug] : null;
    const rot=repRotacion(a, slug, stockC);
    let perfil=repPerfil(slug, a, G, kidsArt && NINO_PRIO[slug]);
    if(rot && rot.r>=REP_ROT_ALTA) perfil='honda';                  // criterio 6: el reingreso que se agota
    // outlet (salvo la marca que lo trabaja «como local de línea»): va después de todas las de línea
    const outlet = catDe(slug)==='outlet' && !fichaOutletLinea(a.marca, G);
    out.push({ slug, sucNombre:nombreSuc(slug), asig, plana:!!asig.plana, perfil, rot, outlet, vendeArtSemana: !!(VA && (VA[a.id]||{})[slug]>0), ninoPrio:(kidsArt && NINO_PRIO[slug]) ? 0 : 1, deportePrio:(DEPORTE_PRIO[slug] && esDeporteEsp(a)) ? DEPORTE_PRIO[slug] : 9, prioMS:fichaPrioMS(a.marca, a.rubro), pared:paredIncompleta(slug, a), pr:prioInfo(slug, a.marca, a.rubro, a.genero),
      venta:vm?vm.v:0, ventaNivel:vm?vm.nivel:'', vendeArt, hist:P.memoria?repHistDe(a.id, slug):null,
      stock:stockC });
  });
  // criterio 3: con 6+ meses de stock de la marca no recibe modelos nuevos (queda anotada para el motivo)
  // …salvo que TODAS las que trabajan el artículo estén pasadas: la mercadería nueva no puede quedar entera en el
  // depósito (21/09/2026, New Balance: solo va a Diagonal 80 y City Bell, las dos con 6+ meses → 120 pares sin
  // repartir). Ahí el tope no se aplica y los meses de stock solo ordenan (menos = antes).
  let msFuera=out.filter(repMsExcedida);
  if(msFuera.length && msFuera.length===out.length){ out.msIgnorado=msFuera.map(c=>({ nombre:c.sucNombre, ms:c.pr.ms })); msFuera=[]; }
  // 21/09/2026 (Juli, reparto de Montagne: 3 de 5 sucursales afuera y 64 de 80 pares en el depósito): con el ratio alto
  // la sucursal YA NO queda afuera: recibe al final, con su curva normal (el ratio solo ordena).
  msFuera.forEach(c=>{ c.msAlto=true; });
  out.msFuera=[]; out.msAlto=msFuera.map(c=>({ slug:c.slug, nombre:c.sucNombre, ms:c.pr.ms }));
  // la venta pesa en tres niveles (alta / media / baja respecto de la que más vende): así los
  // meses de stock deciden entre sucursales que venden parecido
  const max=Math.max(0, ...out.map(c=>c.venta));
  out.forEach(c=>{ c.vNivel = max<=0 ? 0 : c.venta>=max*0.66 ? 0 : c.venta>=max*0.33 ? 1 : 2; });
  out.sort(cmpReparto);
  out.forEach((c,i)=>{ c.prio=i+1; c.prioDe=out.length; });
  return out;
}
function cmpReparto(a,b){
  if((a.ninoPrio||0)!==(b.ninoPrio||0)) return (a.ninoPrio||0)-(b.ninoPrio||0); // niño: Mateu Kids y Outlet Gonnet primero
  const oa=(a.asig&&a.asig.orden)||99, ob=(b.asig&&b.asig.orden)||99;          // «Prioridad» de la ficha de la marca (1 = primera)
  if(oa!==ob) return oa-ob;
  if((a.deportePrio||9)!==(b.deportePrio||9)) return (a.deportePrio||9)-(b.deportePrio||9); // deportes: Diagonal 80, City Bell
  // 23/09/2026 (reparto Nike): los outlets van después de TODAS las de línea, aunque la de línea tenga el ratio alto;
  // el ratio ordena dentro de cada grupo (antes Gonnet y Calle 55 quedaban antes que City Bell y Calle 47)
  if(!!a.outlet!==!!b.outlet) return a.outlet ? 1 : -1;
  if(!!a.msAlto!==!!b.msAlto) return a.msAlto ? 1 : -1;                        // 6+ meses de stock de la marca: recibe al final
  if(!!a.pared!==!!b.pared) return a.pared ? -1 : 1;                           // pared de running incompleta: completarla
  if(a.prioMS && b.prioMS){                                                    // marca estratégica: por meses de stock
    const ma=(a.pr&&a.pr.ms!=null)?a.pr.ms:Infinity, mb=(b.pr&&b.pr.ms!=null)?b.pr.ms:Infinity; if(ma!==mb) return ma-mb; }
  const ha=a.hist?0:1, hb=b.hist?0:1; if(ha!==hb) return ha-hb;               // ya lo recibió: se le completa primero
  if(a.asig.rank!==b.asig.rank) return a.asig.rank-b.asig.rank;               // asignación de marcas
  if(a.pr.catRank!==b.pr.catRank) return a.pr.catRank-b.pr.catRank;           // categoría
  if(a.vNivel!==b.vNivel) return a.vNivel-b.vNivel;                           // venta de la marca-rubro
  const ma=a.pr.ms!=null?a.pr.ms:Infinity, mb=b.pr.ms!=null?b.pr.ms:Infinity; // meses de stock
  if(ma!==mb) return ma-mb;
  if(b.venta!==a.venta) return b.venta-a.venta;
  return cmp(a.sucNombre,b.sucNombre);
}
function repPrioTxt(l){
  const p=l.pr||{}, partes=[];
  if(l.pared) partes.push('pared de '+(l.pared.disc||'running')+' de '+l.pared.marca+' '+(l.pared.gen==='DAMA'?'dama':'hombre')+' incompleta: tiene '+l.pared.tiene+' modelos de '+l.pared.min);
  if(l.hist) partes.push('ya recibió este artículo (se le completa la curva)');
  if(l.stock) partes.push('ya tiene '+fmtInt(Object.values(l.stock).reduce((x,q)=>x+q,0))+' u. en la sucursal ('+((state.rep.param.reingresoProf!==false && l.vendeArt)?'reingreso que se vende: recibe la curva entera igual':'reingreso: se le completa la curva')+')');
  if(l.rot) partes.push('rotación '+Math.round(l.rot.r*100)+' %: recibió '+fmtInt(l.rot.rec)+' u. en '+REP_ROT_MESES+' meses y le quedan '+fmtInt(l.rot.stock));
  if(l.msAlto) partes.push(REP_MS_TOPE+'+ meses de stock de la marca: va al final');
  { const pf=l.perfilEf||l.perfil; if(pf && PERFIL_LBL[pf]) partes.push(PERFIL_LBL[pf]); }
  if(l.asig) partes.push((ASIG_LBL[l.asig.tipo]||l.asig.tipo)+(l.asig.nota?' ('+l.asig.nota+')':''));
  if(p.cat) partes.push(CAT_LABEL[p.cat]||p.cat);
  if(l.venta!=null && l.ventaNivel) partes.push('vendió '+fmtInt(l.venta)+' u. de la '+(l.ventaNivel==='marca'?'marca':'rubro')+' el último mes');
  partes.push(p.ms!=null ? p.ms.toLocaleString('es-AR')+' meses de stock'+(p.msNivel==='rubro'?' (rubro)':p.msNivel==='subrubro'?' (subrubro)':'') : 'sin meses de stock');
  return 'Prioridad '+(l.prio||'—')+' de '+(l.prioDe||'—')+': '+partes.join(' · ');
}

/* ---------- el reparto de UN artículo (todos sus remitos juntos) ----------
   A · curva base: por prioridad, centrales `uCentral` y resto `uResto` (menos lo que ya recibió).
       No se le manda una curva rota: tiene que cubrir `minTalles` talles y algún central.
   B · centrales hasta `maxCentral`, de a una unidad por sucursal.
   C · excedente (opcional): vueltas de a una unidad por talle entre las que ya tienen curva.
   Queda: ~1 curva (`reserva` por talle con 2 o más) + lo que no se repartió.
   Después cada unidad se toma de un remito: la reserva del que más tiene del artículo (una sola
   ubicación) y a cada sucursal del remito que más le cubre / que ya le está dando. */
function repRepartirArt(perRem, cands, central, P, per){
  // curva por talle fija (calzado niño progresivo/chato): cada talle lleva lo suyo, sin 3.ª unidad; «central» = los x2
  if(per) central=new Set(Object.keys(per).filter(t=>per[t]>=2));
  const avail={}; perRem.forEach(r=>Object.entries(r.t).forEach(([t,q])=>{ if(q>0) avail[t]=(avail[t]||0)+q; }));
  const talles=Object.keys(avail).sort(cmpTalle);
  const resv={}, d={};
  // curva en el depósito solo si el artículo tiene «curvaDesde» unidades o más (Juli 14/09/2026)
  const RMIN = P.reservaMin==null ? 6 : P.reservaMin, CDESDE = P.curvaDesde==null ? 12 : P.curvaDesde;
  const totAvail=talles.reduce((x,t)=>x+avail[t],0), dejaCurva = P.reserva>0 && totAvail>=CDESDE;
  // la reserva se aparta DESPUÉS de las curvas base (ver «reserva del depósito» más abajo)
  talles.forEach(t=>{ resv[t]=0; d[t]=avail[t]; });
  const nT=talles.filter(t=>d[t]>0).length, minT=Math.min(P.minTalles, nT);
  const hayCentral=talles.some(t=>central.has(t) && d[t]>0);
  const base=t=>per ? (per[t]||1) : central.has(t)?P.uCentral:P.uResto;
  const tope=t=>per ? (per[t]||1) : central.has(t)?Math.max(P.uCentral,P.maxCentral):P.uResto;
  // «curva x1 plana» de la ficha de la marca: 1 por talle, sin agrandar centrales ni excedente
  // s.per = curva propia de la sucursal (medias Mateu: el piso depende del tipo de local)
  const baseS=(s,t)=>s.per ? (s.per[t]||1) : s.plana?1:base(t);
  // lo que ya tiene la sucursal: lo que se le mandó hace poco y/o su stock actual (reingresos), el mayor por talle.
  // Reingreso que se vende (Juli 17/09/2026): si la sucursal tiene el artículo y lo vende, su stock no le achica
  // la curva: recibe la curva entera igual (profundidad). Lo que se le mandó hace poco sí cuenta siempre.
  // Criterio 6 (rotación, 20/09/2026): con envíos de logística, manda cuánto le queda de lo que recibió: si lo agota,
  // curva entera; si todavía tiene la mitad o más, solo completa talles aunque lo venda.
  const tieneDe=c=>{ const o=Object.assign({}, c.hist||{});
    const entera = c.rot ? (c.rot.r>=REP_ROT_ALTA ? true : c.rot.r<REP_ROT_BAJA ? false : (P.reingresoProf!==false && c.vendeArt)) : (P.reingresoProf!==false && c.vendeArt);
    if(!P.pisoFijo && (entera || P.sinStock)) return o;   // medias: el piso es stock objetivo, siempre descuenta lo que tiene   // sinStock: segunda pasada de repCalcular (todas ya lo tienen y no salía nada)
    Object.entries(c.stock||{}).forEach(([t,q])=>{ o[t]=Math.max(o[t]||0, q); }); return o; };
  // Criterio 1 (perfil del local) y 5 (pico comercial: todos suben un escalón). La curva x1 de la ficha manda.
  // Ratio alto (6+ meses de la marca): solo ORDENA (va al final), la curva es la normal (Juli 21/09/2026). Criterio «profundidad»: todos suben un escalón — si no, en los
  // locales de curva base (Cat 2, Aurelius…) cambiar el criterio no cambiaba nada (Juli 21/09/2026).
  const perfilDe=c=>{ if(P.pisoFijo) return 'base'; let p=c.perfil||'honda'; if(P.pico) p=PERFIL_SUBE[p]; if(P.criterio==='profundidad') p=PERFIL_SUBE[p]; return p; };
  const dist=cands.map(c=>{ const pf=perfilDe(c); return Object.assign({}, c, { g:{}, tiene:tieneDe(c), ok:false, perfilEf:pf, plana:!P.pisoFijo && (!!c.plana || pf==='chata'), sinExc:!!P.pisoFijo || !!c.plana || (c.perfil||'honda')==='chata' }); });
  // A · curva base de UNA sucursal hasta `obj(t)` por talle; no le arma una curva rota
  const darCurva=(s, obj)=>{
    const g={}; let cubre=0, cubreC=false;
    talles.forEach(t=>{ const ya=(s.tiene[t]||0)+(s.g[t]||0); const q=Math.min(Math.max(0, obj(s,t)-ya), d[t]); if(q>0) g[t]=q; if(ya+q>0){ cubre++; if(central.has(t)) cubreC=true; } });
    const yaLoTiene=sumT(s.tiene)>0, nuevo=sumT(g);
    if(!nuevo){ s.ok=s.ok||yaLoTiene; return; }
    if(!yaLoTiene && !s.ok && (cubre<minT || (hayCentral && !cubreC))) return;
    Object.entries(g).forEach(([t,q])=>{ d[t]-=q; s.g[t]=(s.g[t]||0)+q; }); s.ok=true;
  };
  const apartarReserva=()=>{
    if(!dejaCurva) return;
    talles.forEach(t=>{ if(d[t]>0){ const q=Math.min(P.reserva, d[t]); resv[t]=q; d[t]-=q; } });
    if(talles.reduce((x,t)=>x+resv[t],0) < RMIN) talles.forEach(t=>{ d[t]+=resv[t]; resv[t]=0; });
  };
  // Criterio (Juli 17/09/2026, no siempre se usa el mismo):
  //  · «abrir» (el de siempre): curva base a TODAS por prioridad, después la reserva y la 3.ª unidad en centrales.
  //  · «profundidad»: se aparta la reserva y cada sucursal, en orden de prioridad, recibe la curva profunda
  //    (cada talle +1 sobre la base; centrales hasta el tope si es mayor) antes de pasar a la siguiente:
  //    llega a menos locales pero con más unidades.
  if(P.criterio==='profundidad'){
    const hondo=(s,t)=>s.plana ? 1 : per ? (per[t]||1)+1 : central.has(t) ? Math.max(P.uCentral+1, P.maxCentral) : P.uResto+1;
    apartarReserva();
    dist.forEach(s=>darCurva(s, s.perfilEf==='honda' ? hondo : baseS));
  } else {
    dist.forEach(s=>darCurva(s, baseS));
    // reserva del depósito (Juli 14/09/2026, prueba de Nehuen con New Balance): primero cada sucursal tiene su
    // curva base; la curva del depósito sale de lo que sobra y solo si llega a RMIN unidades (si no, se reparte)
    apartarReserva();
  }
  // B · 3.ª unidad en los centrales
  let hubo=true;
  while(hubo){ hubo=false; for(const s of dist){ if(!s.ok || s.plana || s.perfilEf!=='honda') continue; for(const t of talles){
    if(!central.has(t) || d[t]<=0) continue; if((s.tiene[t]||0)+(s.g[t]||0) < tope(t)){ s.g[t]=(s.g[t]||0)+1; d[t]--; hubo=true; } } } }
  // C · excedente
  if(P.excedente){ hubo=true;
    while(hubo){ hubo=false; for(const s of dist){ if(!s.ok || s.sinExc) continue; for(const t of talles){ if(d[t]>0){ s.g[t]=(s.g[t]||0)+1; d[t]--; hubo=true; } } } } }
  // D · reserva mínima (Juli 14/09/2026): si lo que queda en el depósito no llega a RMIN unidades, se vacía
  const queda=()=>talles.reduce((x,t)=>x+resv[t]+d[t],0);
  if(RMIN>0 && queda()>0 && queda()<RMIN && dist.some(s=>s.ok && !s.sinExc)){
    talles.forEach(t=>{ d[t]+=resv[t]; resv[t]=0; });
    hubo=true;
    while(hubo){ hubo=false; for(const s of dist){ if(!s.ok || s.sinExc) continue; for(const t of talles){ if(d[t]>0){ s.g[t]=(s.g[t]||0)+1; d[t]--; hubo=true; } } } }
  }
  // ---- a qué remito va cada unidad ----
  const left=perRem.map(r=>Object.assign({}, r.t)), quedaRem=perRem.map(()=>({}));
  const totLeft=i=>sumT(left[i]);
  const ordRes=perRem.map((_,i)=>i).sort((i,j)=>totLeft(j)-totLeft(i) || j-i);
  talles.forEach(t=>{ let q=resv[t]; for(const i of ordRes){ if(q<=0) break; const take=Math.min(q, left[i][t]||0); if(take>0){ left[i][t]-=take; quedaRem[i][t]=(quedaRem[i][t]||0)+take; q-=take; } } });
  const lineas=[];
  dist.forEach(s=>{
    if(!s.ok || !sumT(s.g)) return;
    const cobertura=i=>Object.keys(s.g).reduce((a,t)=>a+Math.min(s.g[t], left[i][t]||0),0);
    const usa=[]; let pref=-1, best=0; left.forEach((_,i)=>{ const c=cobertura(i); if(c>best){ best=c; pref=i; } }); if(pref>=0) usa.push(pref);
    const porRem={};
    Object.keys(s.g).sort(cmpTalle).forEach(t=>{ let q=s.g[t];
      while(q>0){
        let i=usa.find(k=>(left[k][t]||0)>0); if(i==null) i=left.findIndex(x=>(x[t]||0)>0); if(i==null||i<0) break;
        const take=Math.min(q, left[i][t]); left[i][t]-=take; q-=take;
        if(!usa.includes(i)) usa.push(i);
        const o=porRem[i]||(porRem[i]={}); o[t]=(o[t]||0)+take;
      } });
    lineas.push(Object.assign(s, { porRem }));
  });
  left.forEach((l,i)=>Object.entries(l).forEach(([t,q])=>{ if(q>0) quedaRem[i][t]=(quedaRem[i][t]||0)+q; }));
  return { lineas, quedaRem, avail };
}

/* ---------- Paredes de exhibición de running (13/09/2026, pedido de Juli) ----------
   Los locales exhiben por pared: un lado hombre, el otro dama; cada pared en sectores por disciplina
   (running y casual son los más grandes) y dentro de cada sector cada marca necesita un mínimo de
   modelos para destacarse. Columna = 9 apoyacalzados con cada modelo ×3 en vertical = 3 modelos por
   columna. Mínimo en running: Adidas 6 columnas (18 modelos), Nike y Puma 4 (12), el resto 2 (6).
   Solo Mateu Cat 1 y Cat 2 (no Kids, no Aurelius, no outlets). Cuenta cada artículo (cada color) con
   stock en PARED_MIN_TALLES talles o más; un unisex cuenta en hombre y en dama. Se exige a las marcas
   con running en el stock cargado que la sucursal tiene asignadas y cuya ficha deja running en ese
   subrubro (repAsig). Se muestra como alerta y, en el Reparto inicial y en «Abrir a más sucursales»,
   la sucursal con la pared incompleta pasa adelante con esa marca. */
const PARED_MOD_COL = 3;                               // 9 apoyacalzados ÷ cada modelo ×3 en vertical
const PARED_DISC = ['running','casual','adventure'];   // sectores de pared controlados; adventure desde el 21/09/2026 (Montagne y Salomon, 2 columnas)
const PARED_DISC_LBL = { running:'Running', casual:'Casual', adventure:'Adventure' };
const PARED_COLS = { adidas:6, nike:4, puma:4 };       // running por defecto; las demás marcas PARED_COLS_DEF
const PARED_COLS_DEF = 2, PARED_MIN_TALLES = 3;        // 3 talles distintos con al menos 1 central (Juli 13/09/2026)
let PAREDES = null;                                    // { semana, lista:[…], inc:{'slug|marca|disc|GEN':…}, marcas }
// columnas mínimas de la marca en el sector: las de su ficha («Pared» en Asignación de Marcas) y, en
// running, la regla general si la ficha no dice nada. Casual sin mínimo cargado = no se controla.
function paredCols(marca, disc){
  const F=PRIO.fichas, f=F && F.calzado && F.calzado[normMarca(marca)];
  const v=f && f.pared && Number(f.pared[disc]); if(v>0) return v;
  return disc==='running' ? (PARED_COLS[normMarca(marca)]||PARED_COLS_DEF) : 0;
}
function paredMin(marca, disc){ return paredCols(marca, disc||'running') * PARED_MOD_COL; }
function paredGeneros(genero){
  const g=sinAcento(stripNN(genero)).toUpperCase();
  return /DAMA|MUJER|FEMEN/.test(g) ? ['DAMA'] : /HOMBRE|MASCUL/.test(g) ? ['HOMBRE'] : /UNISEX/.test(g) ? ['HOMBRE','DAMA'] : [];
}
// Unisex: el género sale de los talles (Juli 13/09/2026): hasta el 39 AR es dama y desde el 40 hombre
// (US/UK: hasta 7 dama, desde 7.5 hombre). Un unisex que llega hasta el 39 suma solo en dama.
function talleGenero(t){
  const n=parseFloat(String(t).replace(',','.')); if(!isFinite(n)) return '';
  if(n>=30 && n<=50) return n<=39 ? 'DAMA' : 'HOMBRE';
  if(n>=3 && n<=16) return n<=7 ? 'DAMA' : 'HOMBRE';
  return '';
}
// talles con stock del artículo por subrubro de pared: {DAMA:[…], HOMBRE:[…]}
function paredCuenta(meta, talles){
  const con=Object.keys(talles||{}).filter(t=>(talles[t]||0)>0), gs=paredGeneros(meta&&meta.genero), out={};
  if(gs.length===2) con.forEach(t=>{ const g=talleGenero(t); (g?[g]:gs).forEach(x=>(out[x]=out[x]||[]).push(t)); });
  else gs.forEach(g=>{ if(con.length) out[g]=con; });
  return out;
}
function paredCentrales(meta, g){
  const tabla=repCentralesTabla(), key='calz-'+(g==='DAMA'?'dama':'hombre'), mm=normMarca(meta&&meta.marca);
  // artículo unisex: la dama va con los centrales de la curva unisex (escala US de hombre)
  const uni = g==='DAMA' && paredGeneros(meta&&meta.genero).length===2;
  const lista=(uni && tabla['calz-unisex-dama|'+mm]) || tabla[key+'|'+mm] || (uni && tabla['calz-unisex-dama']) || tabla[key];
  return (lista && lista.length) ? new Set(lista.map(nrmT)) : null;
}
// ¿se puede colgar en la pared? 3 talles distintos y alguno central del subrubro
function paredValido(meta, g, tl){
  const set=new Set((tl||[]).map(nrmT)); if(set.size<PARED_MIN_TALLES) return false;
  const C=paredCentrales(meta, g); return !C || [...set].some(t=>C.has(t));
}
// sector de pared del artículo: 'running' | 'casual' | '' (solo calzado)
function paredDisc(m){
  if(!m || !/CALZ/i.test(sinAcento(stripNN(m.rubro||'')))) return '';
  const d=sinAcento(m.disc||'').toLowerCase();
  return /running/.test(d) ? 'running' : /casual|lifestyle|urbano/.test(d) ? 'casual' : /adventure|outdoor|trekking|montan/.test(d) ? 'adventure' : '';
}
const paredRunning = m => paredDisc(m)==='running';
// locales con pared física: Mateu Cat 1 y Cat 2, sin Kids ni Ecommerce (la web no exhibe en pared)
function paredSlugs(){ return Object.keys(REP_SUC).filter(sl=>sl!=='kids' && sl!=='ecommerce' && ['cat1','cat2'].includes(catDe(sl))); }
function calcParedes(rows){
  if(!rows || !rows.some(v=>v.meta && v.meta.marca)) return null;
  const tiene={}, marcas={};
  rows.forEach(v=>{
    const m=v.meta||{}, disc=paredDisc(m); if(!disc) return;
    const mk=normMarca(m.marca); if(!mk) return; (marcas[disc]=marcas[disc]||{})[mk]=String(m.marca).trim();
    Object.entries(paredCuenta(m, v.talles)).forEach(([g,tl])=>{
      if(!paredValido(m, g, tl)) return;
      const k=v.slug+'|'+mk+'|'+disc+'|'+g; (tiene[k]=tiene[k]||new Set()).add(v.id); });
  });
  const lista=[], inc={};
  paredSlugs().forEach(slug=>PARED_DISC.forEach(disc=>Object.entries(marcas[disc]||{}).forEach(([mk,marca])=>['HOMBRE','DAMA'].forEach(g=>{
    const min=paredMin(marca, disc); if(!(min>0)) return;         // sin mínimo cargado para ese sector
    const G={ fam:'calz', g:g==='DAMA'?'dama':'hombre' }; G.key='calz-'+G.g;
    const asig=repAsig(slug, { marca, rubro:'CALZADO', genero:g, disc:disc.toUpperCase(), tipo:'CALZADO ADULTO', desc:'' }, G);
    if(!asig || asig.tipo==='sin') return;                       // la marca no va a esa pared
    const n=(tiene[slug+'|'+mk+'|'+disc+'|'+g]||new Set()).size;
    if(n>=min) return;
    const o={ slug, sucNombre:stripNN(nombreSuc(slug)), marca, disc, gen:g, tiene:n, min, falta:min-n, col:Math.floor(n/PARED_MOD_COL), colMin:min/PARED_MOD_COL };
    lista.push(o); inc[slug+'|'+mk+'|'+disc+'|'+g]=o;
  }))));
  lista.sort((a,b)=>cmp(a.sucNombre,b.sucNombre) || cmp(a.gen,b.gen) || cmp(a.disc,b.disc) || b.falta-a.falta);
  const todas={}; Object.values(marcas).forEach(o=>Object.assign(todas,o));
  return { semana:state.semana, lista, inc, marcas:Object.values(todas) };
}
// ¿esa sucursal tiene incompleta la pared de la marca, sector y subrubro del artículo?
function paredIncompleta(slug, a){
  const disc=paredDisc(a); if(!PAREDES || !disc) return null;
  const mk=normMarca(a.marca);
  // el unisex se asigna por sus talles: los del artículo que entra (reserva o remitos)
  const tl=Object.assign({}, a.resTalles||{}); (a.rem||[]).forEach(r=>Object.assign(tl, r.talles||{}));
  const gens = Object.keys(tl).length ? Object.keys(paredCuenta(a, Object.fromEntries(Object.keys(tl).map(t=>[t,1])))) : paredGeneros(a.genero);
  for(const g of gens){ const o=PAREDES.inc[slug+'|'+mk+'|'+disc+'|'+g]; if(o) return o; }
  return null;
}
function paredesHtml(P){
  if(!P) return '';
  const L=P.lista||[];
  if(!L.length) return '<details class="ayuda"><summary>🧱 Paredes de exhibición: todas las marcas llegan al mínimo en Cat 1 y Cat 2 ('+fmtInt((P.marcas||[]).length)+' marcas con running o casual en el stock cargado)</summary></details>';
  const nSuc=new Set(L.map(o=>o.slug)).size;

    +'Cuenta cada artículo con stock en '+PARED_MIN_TALLES+' talles distintos o más y al menos uno central; un unisex suma en dama o en hombre según sus talles (hasta el 39 dama, desde el 40 hombre). Sale del stock por sucursal cargado. '
    +'En el Reparto inicial y en «Abrir a más sucursales» estas sucursales pasan adelante con esa marca.'

    +L.map(o=>'<tr><td '+td+'>'+esc(o.sucNombre)+'</td><td '+td+'><b>'+esc(o.marca)+'</b></td><td '+td+'>'+(PARED_DISC_LBL[o.disc]||'Running')+'</td><td '+td+'>'+(o.gen==='DAMA'?'Dama':'Hombre')+'</td>'
      +'<td '+td+'>'+o.tiene+' modelos <small style="opacity:.7">('+o.col+' col.)</small></td><td '+td+'>'+o.min+' <small style="opacity:.7">('+o.colMin+' col.)</small></td>'

    +'</tbody></table></div></div></details>';

/* ---------- cálculo del reparto de los remitos elegidos ---------- */
function repCalcular(){
  const S=state.rep, D=S.data, P=S.param, m=S.mes;
  // la reserva se lee siempre: da los talles cuando el remito no los trae, los días de cada
  // artículo y los ingresos recientes que no están en ningún remito
  const reserva = repReserva();
  REP_STOCK = repStockPorId();          // stock por sucursal (archivo o guardado de la semana): reingresos
  const arts=new Map();
  D.filas.forEach(f=>{
    if(!S.sel[f.remito]) return;
    const u = repUDe(D, f, m); if(u<=0) return;
    let a=arts.get(f.id); if(!a){ a={ id:f.id, cod:f.cod, desc:f.desc, marca:f.marca, rubro:f.rubro, genero:f.genero, disc:f.disc, tipo:f.tipo, rem:[] }; arts.set(f.id,a); }
    a.rem.push({ nro:f.remito, u, talles:repTallesMes(D, f, m) });
  });
  // ingresos recientes que no figuran en los remitos elegidos (el hueco entre los dos reportes)
  const N = Math.max(0, state.filtros.diasNuevo|0);
  let sinRemitoN=0;
  if(P.huerfanos && reserva && N){
    const idsSel=new Set();
    arts.forEach((a,id)=>{ idsSel.add(id); if(a.cod) idsSel.add('cod:'+String(a.cod).toUpperCase()); });
    repNuevosSinRemito(reserva, idsSel, N, repFiltroSegSel()).forEach(a=>{ arts.set(a.id, a); sinRemitoN++; });
  }
  // una tarjeta por remito elegido que tenga unidades en el mes
  const remOut={};
  arts.forEach(a=>a.rem.forEach(r=>{ if(!remOut[r.nro]) remOut[r.nro]={ nro:r.nro, marcas:new Set(), rubros:new Set(), arts:[], uRep:0, uQueda:0, uSin:0 }; }));
  const porSuc={}, sin=[]; let estimados=0, uTot=0;
  const destinos=repDestinos();
  arts.forEach(a=>{
    a.rem.sort((x,y)=>cmp(x.nro,y.nro));
    a.uTot=a.rem.reduce((s,r)=>s+r.u,0); uTot+=a.uTot; a.enRemitos=a.rem.length;
    a.rem.forEach(r=>{ const R0=remOut[r.nro]; R0.marcas.add(a.marca); R0.rubros.add(stripNN(a.rubro)); });
    const sinRep = motivo => { sin.push({ a, u:a.uTot, motivo }); a.rem.forEach(r=>{ if(remOut[r.nro]) remOut[r.nro].uSin+=r.u; }); };
    if(P.excluirVarios && /varios|otros|facturacion/i.test(stripNN(a.rubro)+' '+a.tipo)) return sinRep('Varios / Facturación: no se reparte por curva');
    const tl=repTallesDe(a, reserva);
    if(!tl) return sinRep(D.conTalles ? 'el remito no trae talles' : 'no está en la reserva del depósito cargada: no se puede abrir por talle');
    if(tl.estimado) estimados++;
    const labels=[...new Set([].concat(...tl.perRem.map(r=>Object.keys(r.t).filter(t=>r.t[t]>0))))];
    const C=repCentrales(a, labels);
    // niño: Outlet Gonnet entra aunque los outlets estén afuera por defecto (sector de niños)
    const kidsA = C.G.g==='nino' || C.G.g==='infante';
    let destA = (kidsA && !Array.isArray(S.destinos) && REP_SUC.gonnet && !destinos.includes('gonnet')) ? destinos.concat('gonnet') : destinos;
    if(!Array.isArray(S.destinos) && fichaOutletLinea(a.marca, C.G))
      destA = destA.concat(Object.keys(REP_SUC).filter(sl=>catDe(sl)==='outlet' && !destA.includes(sl)));
    const cands=repCandidatos(a, C.G, destA);
    // medias de marca propia: el piso de cada talle depende de la sucursal (Cat 1 / Cat 2 / outlets)
    if(C.medias && esMediaMateu(a)) cands.forEach(c=>{ const pr={}; labels.forEach(t=>{ pr[t]=mediasMin(t, a.marca, c.slug)||1; }); c.per=pr; });
    // Niño y fútbol se reparten enteros (Juli 17/09/2026): no se deja curva en el depósito y el
    // excedente se sigue repartiendo, como hace el depósito a mano
    const todoP = !C.tranquila && !C.medias && P.todoNinoFutbol!==false && repTodoAlSalon(a, C.G);
    // verano fuera de temporada: sin curva profunda ni excedente, aunque sea de niño
    const cri=repCriterioDe(a, tl.perRem, labels, C, P, cands.length);
    const aMano = cri.origen==='art' || cri.origen==='remito';
    const Pc=Object.assign({}, P, { criterio:cri.c });
    let Pa = C.tranquila ? Object.assign({}, P, { criterio:'abrir', excedente:false }) : todoP ? Object.assign({}, Pc, { excedente:true, reserva:0 }) : Pc;
    // criterio 5: en las semanas previas a una fecha comercial, profundidad y sin curva en el depósito
    const pico = (C.tranquila || C.medias) ? '' : repPico(a, C.G);
    // (lo elegido a mano en el remito o en el artículo le gana a la fecha comercial)
    if(pico) Pa = Object.assign({}, Pa, { criterio: aMano ? cri.c : 'profundidad', reserva:0, pico:true });
    // medias Mateu: el piso por talle a cada sucursal, sin profundidad, sin excedente ni curva de reserva
    if(C.medias) Pa = Object.assign({}, P, { criterio:'abrir', excedente:false, reserva:0, reservaMin:0, minTalles:1, pisoFijo:true });
    a.cri = Object.assign(cri, { efectivo:Pa.criterio, fijo: C.tranquila ? 'fuera de temporada: curva tranquila' : C.medias ? 'piso por talle (medias / accesorios)' : '' });
    let out=repRepartirArt(tl.perRem, cands, C.set, Pa, C.per);
    // Reingreso que TODAS ya tienen con la curva completa (21/09/2026, Montagne ZEEPRO: 5 sucursales con su curva y poca
    // rotación → «solo completar talles» no daba nada y los 10 pares quedaban en el depósito). Lo que ingresa se reparte:
    // si por el stock de las sucursales no salió nada, se reparte igual por prioridad sin mirar ese stock (la memoria de
    // lo enviado hace poco sí sigue contando).
    a.stockIgnorado=false;
    if(!out.lineas.length && !C.medias && cands.some(c=>c.stock)){
      const out2=repRepartirArt(tl.perRem, cands, C.set, Object.assign({}, Pa, { sinStock:true }), C.per);
      if(out2.lineas.length){ out=out2; a.stockIgnorado=true; }
    }
    if(C.tranquila) a.tranquila = true;
    if(todoP) a.todoAlSalon = true;
    a.pico = pico || null; a.msFuera = cands.msFuera || []; a.msIgnorado = cands.msIgnorado || []; a.msAlto = cands.msAlto || [];
    Object.assign(a, { estimado:tl.estimado, faltan:tl.faltan, centrales:[...C.set], grupo:C.G.key,
      regla:C.regla + (pico ? ' · '+pico+' cerca: con profundidad y sin dejar curva en el depósito' : '')
        + (a.msFuera.length ? ' · no recibe'+(a.msFuera.length>1?'n':'')+' por tener '+REP_MS_TOPE+'+ meses de stock de la marca: '+a.msFuera.map(m=>m.nombre+' ('+m.ms.toLocaleString('es-AR')+')').join(', ') : '')
        + (a.msAlto.length ? ' · con '+REP_MS_TOPE+'+ meses de stock de la marca reciben al final: '+a.msAlto.map(m=>m.nombre+' ('+m.ms.toLocaleString('es-AR')+')').join(', ') : '')
        + (a.stockIgnorado ? ' · reingreso: todas las sucursales que lo trabajan ya tienen la curva completa, se reparte igual por prioridad' : '')
        + (a.msIgnorado.length ? ' · todas las que lo trabajan tienen '+REP_MS_TOPE+'+ meses de stock de la marca ('+a.msIgnorado.map(m=>m.nombre+' '+m.ms.toLocaleString('es-AR')).join(', ')+'): se reparte igual' : '') });
    if(a.diasDepo==null && reserva){    // hace cuántos días entró lo que hay hoy en el depósito
      const Rr=reserva[a.id] || (a.cod && reserva['cod:'+String(a.cod).toUpperCase()]);
      if(Rr && Rr.conDias){ const ds=Object.values(Rr.dias||{}).filter(d=>d!=null); if(ds.length) a.diasDepo=Math.min.apply(null, ds); }
    }
    if(!out.lineas.length) sin.push({ a, u:a.uTot, motivo: cands.length ? 'no alcanza para armar una curva: queda todo en el depósito' : (cands.msFuera||[]).length ? 'las sucursales que lo trabajan tienen '+REP_MS_TOPE+' meses o más de stock de la marca' : 'ninguna sucursal destino tiene la marca asignada para este tipo de artículo', queda:true });
    tl.perRem.forEach((r,i)=>{
      const R0=remOut[r.nro]; if(!R0) return;
      const lineas=out.lineas.filter(l=>l.porRem[i]).map(l=>({ slug:l.slug, sucNombre:l.sucNombre, prio:l.prio, prioDe:l.prioDe, asig:l.asig, pr:l.pr,
        venta:l.venta, ventaNivel:l.ventaNivel, hist:!!l.hist, perfil:l.perfilEf, rot:l.rot||null, t:l.porRem[i], u:sumT(l.porRem[i]) }));
      const queda=out.quedaRem[i], uQ=sumT(queda);
      if(!lineas.length && !uQ) return;
      R0.arts.push({ art:a, lineas, queda, uQueda:uQ });
      R0.uRep+=lineas.reduce((s,l)=>s+l.u,0); R0.uQueda+=uQ;
      lineas.forEach(l=>{ const ps=porSuc[l.slug]||(porSuc[l.slug]={ slug:l.slug, nombre:l.sucNombre, u:0, arts:new Set(), remitos:new Set() }); ps.u+=l.u; ps.arts.add(a.id); ps.remitos.add(r.nro); });
    });
  });
  const remitos=Object.values(remOut).sort((x,y)=>cmp(x.nro,y.nro));
  remitos.forEach(r=>{ r.marca=[...r.marcas].filter(Boolean).join(' / '); r.rubro=[...r.rubros].filter(Boolean).join(' / '); r.arts.sort((x,y)=>cmp(x.art.desc,y.art.desc)||cmp(x.art.id,y.art.id)); });
  const uRep=remitos.reduce((s,r)=>s+r.uRep,0), uQueda=remitos.reduce((s,r)=>s+r.uQueda,0);
  return repRetotalizar(repAplicarManual({
    remitos, porSuc:Object.values(porSuc).sort((x,y)=>y.u-x.u), sin,
    totales:{ remitos:remitos.length, arts:arts.size, u:uTot, uRep, uQueda, sucursales:Object.keys(porSuc).length, sinRep:sin.length, estimados,
      sinRemito:sinRemitoN, dias:N,
      // unidades de los remitos que la reserva de hoy ya no tiene (salieron antes de cargar el stock)
      faltan:[...arts.values()].reduce((s,a)=>s+(a.faltan||0),0) },
    fuenteTalles: D.conTalles ? 'export' : ((repFuenteReserva()||{}).archivo||''),
    guardadoKey:null,
  }));
}

/* ---------- ajuste a mano antes de guardar (Juli 18/09/2026) ----------
   Por artículo de cada remito se pueden cambiar las cantidades por talle, sumar una sucursal o
   sacarla. Lo que hay para repartir (repartido + queda) no cambia: lo que se le saca a una
   sucursal vuelve al depósito y lo que se le agrega sale de lo que queda. Los ajustes viven en
   `state.rep.manual` y se vuelven a aplicar arriba de cada recálculo, así cambiar un parámetro
   no los pisa. */
function repManKey(nro, id){ return nro+'|'+id; }
function repPool(x){ const p={}; Object.entries(x.queda||{}).forEach(([t,q])=>{ if(q>0) p[t]=q; });
  x.lineas.forEach(l=>Object.entries(l.t||{}).forEach(([t,q])=>{ if(q>0) p[t]=(p[t]||0)+q; })); return p; }
function repAplicarManualX(rm, x){
  const ov=(state.rep.manual||{})[repManKey(rm.nro, x.art.id)];
  if(!x.auto){ x.auto={}; x.lineas.forEach(l=>{ x.auto[l.slug]=Object.assign({}, l.t); }); x.lineasAuto=x.lineas; }
  if(!ov){ x.editado=false; return; }
  const pool=repPool(x), usado={}, prev={}; x.lineasAuto.forEach(l=>{ prev[l.slug]=l; });
  x.lineas=Object.keys(ov).filter(slug=>REP_SUC[slug]).map(slug=>{ const t={};
    Object.entries(ov[slug]||{}).forEach(([tt,q])=>{ q=Math.min(Math.max(0, parseInt(q,10)||0), (pool[tt]||0)-(usado[tt]||0)); if(q>0){ t[tt]=q; usado[tt]=(usado[tt]||0)+q; } });
    ov[slug]=Object.assign({}, t);
    return Object.assign({}, prev[slug]||{ slug, sucNombre:nombreSuc(slug), prio:null, prioDe:null, manual:true }, { t, u:sumT(t) }); });
  const queda={}; Object.keys(pool).forEach(t=>{ const q=pool[t]-(usado[t]||0); if(q>0) queda[t]=q; });

  const sel=$('repSel'); if(sel) sel.ontoggle=()=>{ S.selOpen=sel.open; };
  { const dn=$('repNuevos'); if(dn) dn.ontoggle=()=>{ S.nuevosOpen=dn.open; };
    document.querySelectorAll('[data-nv]').forEach(el=>el.onchange=()=>{ const p=el.dataset.nv.split('|'); repGuardarNuevo(p[0], p[1], el.value); }); }
  { const dm=$('repManual'); if(dm) dm.ontoggle=()=>{ S.manOpen=dm.open; }; const bg=$('rmGuardar'); if(bg) bg.onclick=repGuardarManual;
    document.querySelectorAll('[data-rdel]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); repBorrarManual(b.dataset.rdel); }); }
  const on=(id,ev,fn)=>{ const el=$(id); if(el) el[ev]=fn; };
  on('repMes','onchange',e=>{ S.mes=e.target.value; S.res=null; render(); });
  on('repMarca','onchange',e=>{ S.f.marca=e.target.value; render(); });
  on('repRubro','onchange',e=>{ S.f.rubro=e.target.value; render(); });
  on('repVerRep','onchange',e=>{ S.f.verRepartidos=e.target.checked; render(); });
  on('repQ','oninput',e=>{ S.f.q=e.target.value; S._focus='repQ'; renderDebounce(); });
  on('repMarcarVis','onclick',()=>{ const todos=repRemitosLista(), f=S.f, q=(f.q||'').toLowerCase();
    todos.filter(r=>!r.rep && (!f.marca||r.marcas.has(f.marca)) && (!f.rubro||r.rubros.has(f.rubro)) && (!q||(r.nro+' '+r.texto+' '+r.marca).toLowerCase().includes(q))).slice(0,400).forEach(r=>{ S.sel[r.nro]=true; });
    S.res=null; render(); });
  on('repLimpiarSel','onclick',()=>{ S.sel={}; S.res=null; render(); });
  on('repArmar','onclick',repArmar);
  document.querySelectorAll('[data-rsel]').forEach(tr=>tr.onclick=()=>{ const n=tr.dataset.rsel; if(S.sel[n]) delete S.sel[n]; else S.sel[n]=true; S.res=null; render(); });
  // parámetros
  const num1=(id,k)=>on(id,'onchange',e=>{ S.param[k]=parseInt(e.target.value,10)||0; repRecalc(); });
  num1('rpUC','uCentral'); num1('rpMC','maxCentral'); num1('rpUR','uResto'); num1('rpMin','minTalles'); num1('rpRes','reserva'); num1('rpCDesde','curvaDesde'); num1('rpRMin','reservaMin');
  on('rpNino','onchange',e=>{ S.param.ninoCurva=e.target.value; repRecalc(); });
  on('rpCrit','onchange',e=>{ S.param.criterio=e.target.value; repRecalc(); });
  const bool=(id,k)=>on(id,'onchange',e=>{ S.param[k]=e.target.checked; repRecalc(); });
  bool('rpExc','excedente'); bool('rpTodoNF','todoNinoFutbol'); bool('rpReing','reingresoProf'); bool('rpDisc','respetarDisc'); bool('rpMem','memoria'); bool('rpVar','excluirVarios'); bool('rpHuer','huerfanos');
  // el corte en días es el mismo para las dos pestañas (lo guarda barrida_prefs)
  on('rpDias','onchange',e=>{ const n=parseInt(e.target.value,10);
    state.filtros.diasNuevo = (isFinite(n)&&n>0) ? Math.min(365,n) : 10; state.filtros.sinNuevos=true;
    guardarPrefs(); repRecalc(); });
  const dest=$('repDest');
  if(dest){
    dest.ontoggle=()=>{ state.mselOpen = dest.open ? 'repDest' : (state.mselOpen==='repDest' ? null : state.mselOpen); };
    dest.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.onchange=()=>{ S.destinos=[...dest.querySelectorAll('input[type=checkbox]:checked')].map(x=>x.value); repRecalc(); });
    dest.querySelectorAll('[data-rgrp]').forEach(b=>b.onclick=e=>{ e.preventDefault(); const k=b.dataset.rgrp, cur=new Set(repDestinos());
      const del=Object.keys(REP_SUC).filter(s=>catDe(s)===k); const todas=del.every(s=>cur.has(s));
      del.forEach(s=>{ if(todas) cur.delete(s); else cur.add(s); }); S.destinos=[...cur]; repRecalc(); });
    if(!window.__mselDoc){ window.__mselDoc=true;
      document.addEventListener('click', e=>{ if(!document.contains(e.target)) return;
        document.querySelectorAll('details.msel[open]').forEach(el=>{ if(!el.contains(e.target)){ el.open=false; if(state.mselOpen===el.id) state.mselOpen=null; } }); }); }
  }
  const cb=$('repCentBox'); if(cb) cb.ontoggle=()=>{ S._centOpen=cb.open; };
  const ab=$('repAccBox'); if(ab) ab.ontoggle=()=>{ S._accOpen=ab.open; };
  document.querySelectorAll('[data-acc]').forEach(el=>el.onchange=()=>{ S.accTipos=Object.assign({}, S.accTipos||{}, { [el.dataset.acc]:Number(el.value)||0 }); repRecalc(); });
  on('repAccGuardar','onclick',async()=>{ if(!FIREBASE_DB_URL) return; try{ await fbPut(ROOT+'/repartoConfig/accTipos', accTabla()); toast('Accesorios por tipo guardados para todos ✓','ok'); }catch(e){ toast('No se pudo guardar: '+(e.message||e),'err'); } });
  on('repAccReset','onclick',async()=>{ if(!confirm('¿Volver a los valores de fábrica de accesorios (para todos)?')) return; S.accTipos=null; try{ if(FIREBASE_DB_URL) await fbPut(ROOT+'/repartoConfig/accTipos', null); }catch(e){} repRecalc(); });
  const ay=$('repAyuda'); if(ay) ay.ontoggle=()=>{ S._ayudaOpen=ay.open; };
  document.querySelectorAll('[data-cent]').forEach(el=>el.onchange=()=>{ const lista=el.value.split(/[,;]+/).map(x=>x.trim()).filter(Boolean);
    S.centrales=Object.assign({}, S.centrales||{}, { [el.dataset.cent]:lista }); repRecalc(); });
  on('repCentGuardar','onclick',async()=>{ if(!FIREBASE_DB_URL) return; try{ await fbPut(ROOT+'/repartoConfig/centrales', repCentralesTabla()); toast('Talles centrales guardados para todos ✓','ok'); }catch(e){ toast('No se pudo guardar: '+(e.message||e),'err'); } });
  on('repCentReset','onclick',async()=>{ if(!confirm('¿Volver a los talles centrales de fábrica (para todos)?')) return; S.centrales=null; try{ if(FIREBASE_DB_URL) await fbPut(ROOT+'/repartoConfig/centrales', null); }catch(e){} repRecalc(); });
  // resultado
  document.querySelectorAll('[data-rvista]').forEach(b=>b.onclick=()=>{ S.vista=b.dataset.rvista; render(); });
  // ajuste a mano antes de guardar
  document.querySelectorAll('[data-redit]').forEach(b=>b.onclick=()=>repEditAbrir(b.dataset.redit));
  document.querySelectorAll('select[data-rcri]').forEach(sel=>sel.onchange=()=>{ const S=state.rep, m = sel.dataset.rcri==='rem' ? (S.criRem=S.criRem||{}) : (S.criArt=S.criArt||{});
    if(sel.value) m[sel.dataset.rcriid]=sel.value; else delete m[sel.dataset.rcriid];
    // al cambiar el remito, lo elegido a mano en sus artículos sigue mandando (se ve en el chip «a mano»)
    repRecalc(); });
  document.querySelectorAll('[data-redok]').forEach(b=>b.onclick=repEditCerrar);
  document.querySelectorAll('[data-rreset]').forEach(b=>b.onclick=()=>repEditReset(b.dataset.rreset));
  document.querySelectorAll('.rg-in').forEach(i=>{ i.onchange=()=>repEditCelda(i); i.onfocus=()=>{ try{ i.select(); }catch(e){} };
    i.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); i.blur(); } }; });
  document.querySelectorAll('[data-rquitar]').forEach(b=>b.onclick=()=>{ const ov=S.manual[S.edit]; if(!ov) return; delete ov[b.dataset.rquitar]; repRecalc(); });
  document.querySelectorAll('[data-rsumar]').forEach(s=>s.onchange=()=>{ const ov=S.manual[S.edit]; if(!ov || !s.value) return; ov[s.value]={}; S._focusSuc=s.value; repRecalc(); });
  const resu=$('repResu'); if(resu) resu.onclick=e=>{ if(!e.target.closest('[data-rresetall]')) return;
    if(!confirm('¿Descartar TODOS los cambios a mano y volver al reparto automático?')) return; S.manual={}; S.edit=null; repRecalc(); };
  if(S._focusSuc){ const el=document.querySelector('.rg-in[data-slug="'+S._focusSuc+'"]'); S._focusSuc=null; if(el) el.focus(); }
  on('repXlsx','onclick',repExportXlsx);
  on('repPrint','onclick',()=>{ S.vista='remito'; render(); setTimeout(()=>window.print(),150); });
  on('repGuardar','onclick',repGuardar);
  on('repCerrar','onclick',()=>{ S.abierto=null; S.res=null; render(); });
  document.querySelectorAll('[data-rabrir]').forEach(b=>b.onclick=()=>repAbrir(b.dataset.rabrir));
  document.querySelectorAll('[data-rborrar]').forEach(b=>b.onclick=()=>repBorrar(b.dataset.rborrar));
  if(S._focus){ const el=$(S._focus); S._focus=null; if(el){ el.focus(); try{ el.setSelectionRange(el.value.length, el.value.length); }catch(e){} } }
}

/* ---------- Excel: una hoja por remito (para imprimir en su ubicación) + resumen por sucursal ---------- */
function repHoja(wb, nombre, titulo, subtitulo, headers, widths, leftCols){
  const ws=wb.addWorksheet(nombre, {views:[{showGridLines:false}]});
  ws.columns=widths.map(w=>({width:w}));
  const nCols=headers.length;
  ws.mergeCells(1,1,1,nCols);
  const tit=ws.getCell(1,1);
  tit.value={ richText:[ {font:{bold:true,size:15,name:'Calibri',color:{argb:BRAND.navy}},text:titulo+'\n'}, {font:{bold:true,size:10,name:'Calibri',color:{argb:BRAND.red}},text:subtitulo} ]};
  tit.alignment={horizontal:'left',vertical:'middle',wrapText:true,indent:1};
  for(let c=1;c<=nCols;c++){ ws.getCell(1,c).border={bottom:{style:'medium',color:{argb:BRAND.red}}}; }
  ws.getRow(1).height=38;
  const hr=3;
  headers.forEach((h,i)=>{ const c=ws.getCell(hr,i+1); c.value=h; c.font={bold:true,color:{argb:BRAND.white},size:10,name:'Calibri'};
    c.fill={type:'pattern',pattern:'solid',fgColor:{argb:BRAND.navy}}; c.alignment={horizontal:i<leftCols?'left':'center',vertical:'middle'}; c.border=thinBorder(BRAND.navy); });
  ws.getRow(hr).height=22;
  ws.views=[{state:'frozen', xSplit:leftCols, ySplit:hr, showGridLines:false}];
  ws.pageSetup={orientation:'landscape', fitToPage:true, fitToWidth:1, fitToHeight:0, printTitlesRow:'1:'+hr, margins:{left:0.3,right:0.3,top:0.4,bottom:0.4,header:0.2,footer:0.2}};
  return { ws, hr, nCols };
}
async function repExportXlsx(){
  const S=state.rep, R=S.res; if(!R) return;
  if(typeof ExcelJS==='undefined'){ toast('ExcelJS no cargó; recargá la página','err'); return; }
  const rems=R.remitos.filter(rm=>rm.arts.length); if(!rems.length){ toast('No hay nada para exportar','err'); return; }
  const fecha = S.abierto ? String((S.abierto.meta||{}).fecha||S.abierto.key) : nowISO();
  const wb=new ExcelJS.Workbook();
  // resumen por sucursal
  const T=R.totales;
  const hs=repHoja(wb,'Por sucursal','REPARTO INICIAL · POR SUCURSAL', fmtInt(T.remitos)+' remitos · '+fmtInt(T.uRep||0)+' unidades a '+fmtInt(T.sucursales||0)+' sucursales · '+fmtInt(T.uQueda||0)+' quedan en el depósito · '+fecha,
    ['Sucursal','Categoría','Unidades','Artículos','Remitos'], [26,12,11,11,70], 2);
  R.porSuc.forEach((s,i)=>{ const r=hs.hr+1+i;
    [stripNN(s.nombre), CAT_LABEL[catDe(s.slug)]||'', s.u, s.arts.size, [...s.remitos].sort(cmp).map(repNroCorto).join(' · ')].forEach((v,j)=>{ const c=hs.ws.getCell(r,j+1); c.value=v;
      c.font={size:10,bold:j===0,name:'Calibri',color:{argb:BRAND.navy}}; c.alignment={horizontal:j<2||j===4?'left':'center',vertical:'middle',wrapText:j===4}; c.border=thinBorder(BRAND.border); }); });
  // una hoja por remito
  const nombres=new Set();
  rems.forEach(rm=>{
    // Tablas de talles: artículos seguidos con la misma curva (rubro + adulto / niño / infante, y talles
    // de números o de letras) comparten tabla (la unión de sus talles); cuando cambia la curva (adulto →
    // niño) arranca una tabla nueva. Con una sola tabla, los talles van en el encabezado de la hoja; con
    // varias, cada tabla abre con su propia fila de talles.
    const tallesDe=x=>[...new Set([].concat(...x.lineas.map(l=>Object.keys(l.t)), Object.keys(x.queda||{})))];
    const curvaDe=(x,ts)=>{ const G=repGrupo(x.art), edad=(G.g==='nino'||G.g==='infante')?G.g:'adulto';
      const letras=ts.filter(t=>!/^\d/.test(String(t).trim())).length > ts.length/2;
      return (G.fam||'otro')+'|'+edad+'|'+(letras?'L':'N'); };
    const tablas=[];
    rm.arts.forEach(x=>{ const ts=tallesDe(x), k=curvaDe(x,ts), ult=tablas[tablas.length-1];
      if(ult && ult.k===k){ ts.forEach(t=>ult.set.add(t)); ult.arts.push(x); }
      else tablas.push({k, set:new Set(ts), arts:[x]}); });
    tablas.forEach(tb=>{ tb.talles=[...tb.set].sort(cmpTalle); });
    const varias=tablas.length>1;
    const nT=Math.max(1, ...tablas.map(tb=>tb.talles.length));
    const sr = rm.nro===REP_NUEVO;
    let nom=((sr?'Sin remito ':'R '+repNroCorto(rm.nro)+' ')+(rm.marca||'')).replace(/[\[\]:*?\/\\]/g,' ').slice(0,31).trim(); while(nombres.has(nom)) nom=(nom.slice(0,28)+' '+nombres.size).slice(0,31); nombres.add(nom);
    const izq=['Código','Artículo','Descripción','Destino'];
    const h=repHoja(wb, nom, sr?'REPARTO INICIAL · INGRESÓ HACE POCO (SIN REMITO)':'REPARTO INICIAL · REMITO '+repNroCorto(rm.nro), ((sr?'COMPRA DE HACE MENOS DE '+((R.totales||{}).dias||0)+' DÍAS':rm.nro)+'  ·  '+(rm.marca||'')+(rm.rubro?'  ·  '+rm.rubro:'')+'  ·  '+fmtInt(rm.uRep)+' u. a repartir · '+fmtInt(rm.uQueda)+' quedan  ·  '+fecha).toUpperCase(),
      [...izq, ...(varias ? ['Talles', ...Array(nT-1).fill('')] : tablas[0].talles), 'Total'], [16,11,36,22, ...Array(nT).fill(7), 9], izq.length);
    if(varias && nT>1) h.ws.mergeCells(h.hr, izq.length+1, h.hr, izq.length+nT);
    let r=h.hr+1;
    tablas.forEach((tb,tbi)=>{ const talles=tb.talles;
      if(varias){
        if(tbi>0) r++; // renglón en blanco antes de la tabla nueva
        // fila de talles de esta tabla
        const cab=[null, null, null, 'Destino', ...talles, ...Array(nT-talles.length).fill(null), 'Total'];
        cab.forEach((v,j)=>{ const c=h.ws.getCell(r,j+1); c.value=v;
          c.font={size:10,bold:true,name:'Calibri',color:{argb:BRAND.white}};
          c.fill={type:'pattern',pattern:'solid',fgColor:{argb:BRAND.navyMid}};
          c.alignment={horizontal:j<izq.length?'left':'center',vertical:'middle'}; c.border=thinBorder(BRAND.navyMid); });
        h.ws.getRow(r).height=20; r++;
      }
      tb.arts.forEach(x=>{ const a=x.art, C=new Set(a.centrales||[]);
        const filas=x.lineas.slice().sort((p,q)=>(p.prio||99)-(q.prio||99)).map(l=>({dest:stripNN(l.sucNombre), t:l.t, u:l.u, queda:false}));
        if(x.uQueda>0) filas.push({dest:'DEPÓSITO (queda)', t:x.queda, u:x.uQueda, queda:true});
        filas.forEach((fl,k)=>{
          const borde=()=>{ const bd=thinBorder(BRAND.border); if(k===0) bd.top={style:'medium',color:{argb:BRAND.sep}}; return bd; };
          const vals=[a.cod||'', a.id, (a.desc||'')+(a.estimado?' *':''), fl.dest];
          vals.forEach((v,j)=>{ const c=h.ws.getCell(r,j+1); c.value=(k===0||j===3)?v:null;
            c.font={size:10,bold:!fl.queda,italic:fl.queda,name:'Calibri',color:{argb:fl.queda?BRAND.muted:BRAND.navy}}; c.alignment={horizontal:'left',vertical:'middle'};
            c.border=borde(); });
          for(let ti=0;ti<nT;ti++){ const t=talles[ti]; const c=h.ws.getCell(r,izq.length+ti+1); const q=t!=null?(fl.t[t]||0):0; c.value=q>0?q:null;
            c.font={size:11,bold:!fl.queda,name:'Calibri',color:{argb:fl.queda?BRAND.muted:BRAND.navy}}; c.alignment={horizontal:'center',vertical:'middle'};
            if(t!=null && C.has(t) && !fl.queda) c.fill={type:'pattern',pattern:'solid',fgColor:{argb:BRAND.talleBand}};
            c.border=borde(); }
          const ct=h.ws.getCell(r,izq.length+nT+1); ct.value=fl.u; ct.font={size:11,bold:true,name:'Calibri',color:{argb:fl.queda?BRAND.muted:BRAND.navy}}; ct.alignment={horizontal:'center',vertical:'middle'};
          ct.border=borde();
          h.ws.getRow(r).height=22; r++;
        });
      });
    });
    if(rm.arts.some(x=>x.art.estimado)){ r++; h.ws.getCell(r,1).value='* talles tomados de la reserva del depósito (el remito no trae talles): confirmarlos al abrir la caja. Fondo celeste = talle central.'; h.ws.getCell(r,1).font={size:9,italic:true,name:'Calibri',color:{argb:BRAND.muted}}; }
  });
  await downloadWorkbook(wb, 'reparto-inicial-'+fecha.slice(0,10)+'.xlsx');
  toast('Excel generado ✓','ok');
}

  if(FIREBASE_DB_URL) cargarPartesSemana();
})();
