ar curva</b>, «Solo talles que rotan» no gasta reserva en esos últimos.<br>El chip <span class="pill rep2">↻ repite</span> avisa que a esa misma sucursal ya se le había sugerido ese artículo en la barrida anterior: o no se ejecutó el envío, o el artículo rota y hay que recomprarlo. La columna <b>Queda</b> es lo que sobra de ese artículo en el depósito después de repartirlo entre todas las sucursales (en azul, los que salen enteros).<br><b>Medias Mateu Sports y Aurelius</b> (filas <span class="pill rec">piso por talle</span>): por cada talle vendido se repone el mínimo del talle (Mateu S:12 · M:24 · L:36 · XL:12; Aurelius S chico 24 · M grande 24) aunque haya vendido menos, así que el número grande es ese mínimo y no lo vendido.'
    +(vacOn ? '<br>Con <b>Vaciar la reserva chica</b> se suman casilleros azules: <span class="tgx vac"><span class="txl">41</span><span class="txn">+2</span><span class="txr">vaciar</span></span> = el artículo tiene '+fv.max+' unidades o menos en todo el depósito, así que se reparte lo que queda entre las sucursales que lo venden o lo tienen (de a una por vuelta, en orden de prioridad) y deja de vivir en la reserva. <span class="tgx off"><span class="txl">43</span><span class="txn">—</span><span class="txr">se deja</span></span> = ese talle NO baja porque todas esas sucursales ya tienen '+fv.minSuc+' o más (bajarlo sería stock parado)'+(fv.minArt>0?', o porque ninguna tiene '+fv.minArt+' o más unidades del artículo':'')+'.'+(fv.minArt>0?' <b>A la sucursal que tiene menos de '+fv.minArt+' unidades del artículo no se le manda nada</b>, aunque lo haya vendido: si ya no lo tiene o le queda uno, una unidad suelta no arma nada; esas unidades se reparten entre las que sí lo tienen (con «Solo lo que se puede mandar» destildado se ven con el aviso <span class="pill fuera">no va · tiene 0</span>).':'')+' Las filas <span class="pill vac">solo vaciado</span> son sucursales que no lo vendieron pero lo tienen en stock.' : '')
    +(curvaOn ? '<br>Con <b>Completar curva</b> se suman casilleros verdes: <span class="tgx hueco"><span class="txl">41</span><span class="txn">+1</span><span class="txr">no tiene</span></span> = talle que la sucursal <b>no tiene</b> y sí hay en reserva (van +'+fc.unidades+' por talle faltante); <span class="tgx off"><span class="txl">43</span><span class="txn">—</span><span class="txr">agot.</span></span> = la reserva de ese talle se la llevó una sucursal con más prioridad. Las filas <span class="pill curva">solo curva</span> son sucursales que no vendieron el artículo pero lo tienen incompleto. <span class="tgx hueco"><span class="txl">5.5</span><span class="txn">+1</span><span class="txr">tiene 1</span></span> = <b>agrandar la curva</b>: talle <b>central</b> (la misma tabla del Reparto inicial) donde la sucursal tiene poco; se lleva a 2 y, si alcanza la reserva, a 3, en orden de prioridad.' : '')
    +(ampN ? '<br>Con <b>Abrir a más sucursales</b> se suman casilleros turquesa: <span class="tgx amp"><span class="txl">41</span><span class="txn">+2</span><span class="txr">abrir</span></span> = el artículo lleva '+Math.max(1,f.diasNuevo|0)+' días o más en el depósito y, después de la venta, la curva y el vaciado, sigue sobrando: se le arma una <b>curva de arranque</b> (2 en los talles centrales, 1 en el resto, nunca una curva rota) a una sucursal que <b>no lo tiene</b> y tiene la marca asignada, en el mismo orden que el Reparto inicial. Las filas <span class="pill amp">sucursal nueva</span> son esas sucursales. Los outlets entran desde los '+state.filtrosAmp.outletDias+' días; Aurelius y los locales Adidas, nunca.' : '')
    +((f.topeCalzado|0)>0 && R.conStock ? '<br><b>Tope de calzado</b>: con lo que se le manda, ninguna sucursal pasa de <b>'+(f.topeCalzado|0)+' unidades por talle</b>, aunque haya vendido más. <span class="tgx"><span class="txl">41</span><span class="txn">1</span><span class="txr">de 13 · tiene 2</span></span> = vendió más, pero ya tiene 2: va 1. Con «Ver los talles que no hay» se ven también los que no van porque ya tienen el tope (<span class="tgx off"><span class="txl">42</span><span class="txn">—</span><span class="txr">tiene 3</span></span>).' : '')
    +'</div></details>';
  const nFalta = rows.filter(faltaEn).length;
  const queda = restantePorArt();                       // por artículo: lo que sobra en el depósito
  const artVacios = new Set(rows.filter(r=>queda[r.id]===0).map(r=>r.id)).size;
  const uCurva = rows.reduce((a,r)=>a+(r.curvaU||0),0), uVac = rows.reduce((a,r)=>a+(r.vacU||0),0), uAmp = rows.reduce((a,r)=>a+(r.ampU||0),0);
  const uTot = rows.reduce((a,r)=>a+r.sugerido,0);
  const desg=[]; if(uCurva||uVac||uAmp){ desg.push('<b>'+fmtInt(uTot-uCurva-uVac-uAmp)+'</b> por venta');
    if(uCurva) desg.push('<span class="c-curva"><b>'+fmtInt(uCurva)+'</b> curva</span>');
    if(uVac) desg.push('<span class="c-vac"><b>'+fmtInt(uVac)+'</b> vaciado</span>');
    if(uAmp) desg.push('<span class="c-amp"><b>'+fmtInt(uAmp)+'</b> a otras sucursales</span>'); }
  html+='<div class="resu"><span><b>'+fmtInt(rows.length)+'</b> líneas</span>'
    +'<span><b>'+fmtInt(uTot)+'</b> unidades a bajar'+(desg.length?' <small>('+desg.join(' · ')+')</small>':'')+'</span>'
    +(nFalta?'<button type="button" class="c-falta lnkr" id="verFaltaBtn" title="'+(verRojos?'Ocultar los talles que no se pueden reponer':'Ver en rojo los talles que la sucursal vendió y el depósito no puede reponer')+'"><b>'+fmtInt(nFalta)+'</b> con faltante de talle: la reserva no alcanza '+(verRojos?'▴':'▾')+'</button>':'')
    +(artVacios?'<span class="c-cero"><b>'+fmtInt(artVacios)+'</b> artículos salen enteros del depósito</span>':'')
    +((R.diasNuevo && R.nuevos && R.nuevos.unidades)?'<span class="c-nuevo" title="Talles con una compra de hace menos de '+R.diasNuevo+' días: no se reparten en la barrida (van por el Reparto inicial). Con «Ver los talles que no hay» se ven en ámbar en cada fila."><b>'+fmtInt(R.nuevos.unidades)+'</b> u. nuevas sin repartir <small>('+fmtInt(R.nuevos.articulos)+' artículos · menos de '+R.diasNuevo+' días)</small></span>':'')
    +(R.resDup?'<span class="c-falta" title="El reporte de stock del depósito trae renglones repetidos (mismo artículo con los mismos talles y cantidades). Se contaron una sola vez para no duplicar la reserva."><b>'+fmtInt(R.resDup)+'</b> renglones repetidos en el reporte de stock: contados una vez</span>':'')
    +((R.tope&&R.tope.unidades)?'<span title="Calzado: talles que la sucursal vendió pero ya tiene cerca del tope ('+R.tope.tope+' por talle), así que se le manda menos o nada. Con «Ver los talles que no hay» se ven también los que quedaron en cero."><b>'+fmtInt(R.tope.unidades)+'</b> u. menos por el tope de calzado <small>('+R.tope.tope+' por talle)</small></span>':'')
    +(R.previa?(function(){ const n=rows.filter(r=>repiteDe(r)>0).length; return n?'<span class="c-rep"><b>'+fmtInt(n)+'</b> ya estaban en la barrida del '+lunesLabel(R.previa.semana)+'</span>':''; })():'')
    +(state.transf?(function(){ let env=0, ped=0, falta=0;
        rows.forEach(r=>{ const e=estadoEnvio(r); if(!e||e.k==='extra') return; ped+=r.sugerido; env+=Math.min(e.e,r.sugerido); if(e.k!=='ok') falta++; });
        const pc = ped>0 ? Math.round(env*100/ped) : 0;
        return '<span class="c-env"><b>'+pc+'%</b> ya enviado ('+fmtInt(env)+' de '+fmtInt(ped)+' u.)'+(falta?' · <b>'+fmtInt(falta)+'</b> líneas sin salir':'')+'</span>'; })():'')
    +'<span style="margin-left:auto;color:var(--muted-light)">'+fmtInt(new Set(rows.map(r=>r.id)).size)+' artículos · '+fmtInt(new Set(rows.map(r=>r.slug)).size)+' sucursales</span></div>';
  html+='<div class="tbl-wrap"><table><thead><tr>'
    +th('Sucursal','sucNombre')+th('Artículo','art')+th('Código','codigo')+th('Marca','marca')
    +thNum('Prioridad','prio')+thNum('Vendido','vendido')+thNum('Stock reserva','reservaTotal')+thNum('A reponer','sugerido')+'<th class="num noord" title="Lo que queda de este artículo en el depósito después de repartirlo entre todas las sucursales">Queda</th>'+(state.transf?'<th class="num noord" title="Unidades que el sistema registra como transferidas del depósito a esa sucursal">Enviado</th>':'')+'<th class="noord">Talles · cuántas unidades van de cada uno</th>'
    +'</tr></thead><tbody>';
  rows.forEach(r=>{
    const falta=faltaEn(r);
    const piso=r.pisoMedias;
    // Para armar la barrida solo importan los talles que bajan: los que quedan en cero
    // (el depósito no los tiene, o se los llevó otra sucursal) se ocultan salvo que se pidan.
    const ttRep=Object.entries(r.talles).filter(([t,d])=>(d.v>0 && (verRojos || d.s>0)) || (verRojos && d.top && d.vend>0)).map(([t,d])=>({t, h:talleChip(t,d,r)}));
    const pillPiso = piso?' <span class="pill rec" title="Piso por talle (medias de marca propia y accesorios por tipo): para el talle vendido se repone hasta el piso, aunque haya vendido menos">piso por talle</span>':'';
    const pillCurva = r.soloCurva?' <span class="pill curva" title="No vendió el artículo esta semana, pero lo tiene incompleto: solo talles de curva">solo curva</span>':'';
    const pillVac = r.soloVaciado?' <span class="pill vac" title="No vendió el artículo esta semana, pero lo tiene en stock: recibe parte de la reserva que se vacía">solo vaciado</span>':'';
    const pillAmp = r.ampU>0?' <span class="pill amp" title="'+esc('No tiene el artículo (o le queda menos de '+Math.max(1,fv.minArt|0)+'): lleva '+r.ampDias+' días en el depósito y sobra reserva, así que se le arma una curva de arranque.'+(r.ampAsig&&ASIG_LBL[r.ampAsig.tipo]?' En Asignación de Marcas es '+ASIG_LBL[r.ampAsig.tipo]+'.':''))+'">sucursal nueva</span>':'';
    // vendió talles que en el depósito son todos mercadería nueva (filtro de días de ingreso)
    const nNuevo = Object.values(r.talles||{}).filter(d=>d.v>0 && esNuevoRet(d)).length;
    const pillNuevo = (nNuevo && R.diasNuevo) ? ' <span class="pill nuevo" title="'+nNuevo+' de los talles que vendió solo tienen mercadería nueva en el depósito (compra de hace menos de '+R.diasNuevo+' días): no se reparten en la barrida">nuevo · sin repartir</span>' : '';
    const rep = repiteDe(r);
    const pillRep = rep?' <span class="pill rep2" title="La semana del '+lunesLabel(R.previa.semana)+' ya se le sugirieron '+fmtInt(rep)+' unidades de este artículo. Si no se envió, va de nuevo; si se envió y volvió a vender, el artículo rota y conviene recomprarlo.">↻ repite</span>':'';
    const prio = r.prio ? '<span class="pill '+(r.prio===1?'rec':'suc')+'" title="Prioridad '+r.prio+' de '+r.prioDe+' sucursales que piden este artículo · '+esc(prioTxt(r))+'">'+r.prio+' de '+r.prioDe+'</span>' : '—';
    // talles de curva (verde), vaciado (azul) y los que quedan en el depósito porque todas están cubiertas
    const ttCurva = curvaOn ? curvaChips(r.curvaFaltan, r).concat(engChips(r.curvaEng, r)) : [];
    const ttVac = (vacOn && r.vacFaltan) ? vacChips(r.vacFaltan, r) : [];
    const ttAmp = r.ampTalles ? ampChips(r.ampTalles, r) : [];
    const ttDej = vacOn ? dejChips(dejPorArt[r.id], fv.minSuc) : [];
    // un solo recorrido de menor a mayor talle (pedido de Juli 11/09/2026): reposición, curva,
    // vaciado y abrir intercalados en su lugar; a igual talle, en ese orden (el sort es estable)
    const tt = ttRep.concat(ttCurva, ttVac, ttAmp, ttDej).sort((a,b)=>cmpTalle(a.t,b.t)).map(x=>x.h).join('');
    // sucursal afuera del vaciado por tener poco stock del artículo
    const ttFuera = (vacOn && r.vacFuera!=null) ? '<span class="pill fuera" title="No se le manda: tiene '+fmtInt(r.vacFuera)+' unidades de este artículo (el mínimo para mandarle es '+fv.minArt+'). Lo que le tocaba por venta se reparte entre las sucursales que sí lo tienen.">no va · tiene '+fmtInt(r.vacFuera)+'</span>' : '';
    const detBadge = [ (r.curvaU>0?fmtInt(r.curvaU)+' para completar la curva':''), (r.vacU>0?fmtInt(r.vacU)+' por vaciar la reserva':''), (r.ampU>0?fmtInt(r.ampU)+' para abrir el artículo en esta sucursal':'') ].filter(Boolean).join(' + ');
    const badgeTitle = detBadge ? ' title="'+fmtInt(r.sugRep||0)+' por venta + '+detBadge+'"' : '';
    html+='<tr><td><span class="pill suc">'+esc(r.sucNombre)+'</span></td>'
      +'<td class="desc rep" title="'+esc(r.desc)+'"><span class="dtxt">'+esc(r.desc||'—')+'</span>'+pillPiso+pillCurva+pillVac+pillAmp+pillRep+pillNuevo+((falta&&verRojos)?(sinStockEn(r)
        ? ' <span class="pill falta" title="Vendió talles que el depósito no tiene: no hay nada que bajar, hay que pedírselos a la marca">⚠ hay que comprar</span>'
        : ' <span class="pill rec2" title="Hay stock del talle pero no alcanza para todas las sucursales que lo piden: por prioridad esta recibe menos de lo que vendió">⚠ recortado</span>'):'')+'</td>'
      +'<td class="mono">'+esc(r.codigo||r.id)+'</td><td>'+esc(r.marca)+'</td>'
      +'<td class="num">'+prio+'</td>'
      +'<td class="num mono">'+fmtInt(r.vendido)+'</td><td class="num mono" style="color:var(--muted)"'+(r.reservaNueva?' title="'+fmtInt(r.reservaTotal)+' para repartir + '+fmtInt(r.reservaNueva)+' nuevas (compra de hace menos de '+R.diasNuevo+' días) que no se reparten"':'')+'>'+fmtInt(r.reservaTotal)+(r.reservaNueva?' <small style="color:#6d28d9;font-weight:700">+'+fmtInt(r.reservaNueva)+'</small>':'')+'</td>'
      +'<td class="num"><span class="sug-badge'+(r.sugerido>0?'':' zero')+'"'+badgeTitle+'>'+fmtInt(r.sugerido)+((r.curvaU>0||r.vacU>0||r.ampU>0)?' <small style="font-weight:600;opacity:.8">(+'+fmtInt((r.curvaU||0)+(r.vacU||0)+(r.ampU||0))+')</small>':'')+'</span></td>'
      +'<td class="num mono"><span class="queda'+(queda[r.id]===0?' cero':'')+'" title="'+(queda[r.id]===0?'El artículo se baja entero: no queda nada en el depósito':'Quedan '+fmtInt(queda[r.id]||0)+' unidades de este artículo en el depósito')+'">'+fmtInt(queda[r.id]||0)+'</span></td>'
      +(state.transf?(function(){ const e=estadoEnvio(r); if(!e) return '<td class="num mono" style="color:var(--muted-light)">—</td>';
          const T={ok:['env ok','✓ '],parcial:['env par','⚠ '],no:['env no','✗ '],extra:['env ex','+ ']}[e.k];
          const tip={ok:'Se envió todo lo sugerido',parcial:'Se envió solo una parte de lo sugerido',no:'Todavía no salió del depósito',extra:'Se transfirió sin estar en la barrida'}[e.k];
          return '<td class="num"><span class="'+T[0]+'" title="'+esc(tip)+' ('+fmtInt(e.e)+' de '+fmtInt(r.sugerido)+')">'+T[1]+fmtInt(e.e)+'</span></td>'; })():'')
      +'<td class="talles"><div class="tw">'+((ttFuera+tt)||'—')+'</div></td></tr>';
  });
  html+='</tbody></table></div>';
  return html;
}

function viewCompras(){
  if(!puedeCompras()) return '';   // por si se llega por otro camino
  const R=state.resultado;
  if(!R) return '<div class="state"><div class="big-ic">⚙️</div>Cargá los Excel de la semana en la pestaña Barrida de reserva.</div>';
  if(!R.compras) return '<div class="state"><div class="big-ic">🛒</div>Esta barrida se guardó antes de la vista Compras. Volvé a procesar el Excel para verla.</div>';
  const f=state.filtrosCom;
  const aplica = c => (!f.excluirVarios || !/varios|facturacion/i.test(c.rubro+' '+c.tipo))
    && c.vendido>=f.minVendido
    && (!f.rubro || c.rubro===f.rubro) && (!f.marca || c.marca===f.marca)
    && (!f.q || (c.desc+' '+c.codigo+' '+c.id+' '+c.marca).toLowerCase().includes(f.q.toLowerCase()));
  const base=R.compras.filter(aplica);
  const s=state.sortCom;
  const ord = arr => arr.slice().sort((a,b)=>{ const va=a[s.k],vb=b[s.k]; return (typeof va==='number'?va-vb:cmp(va,vb))*s.dir; });
  const sinRes=ord(base.filter(c=>!c.tieneReserva));
  const conRes=ord(base.filter(c=>c.tieneReserva));
  const frenados=R.parada.filter(p=>(!f.excluirVarios || !/varios|facturacion/i.test(p.rubro+' '+p.tipo)) && (!f.rubro||p.rubro===f.rubro) && (!f.marca||p.marca===f.marca))
    .slice().sort((a,b)=>b.reservaTotal-a.reservaTotal);

  let html='<div class="sec-head"><div><h1>Vista de Compras</h1>'
    +'<div class="sub">Los más vendidos de la semana, separados según haya o no reserva en el depósito. Sin reserva = reponer a la marca; con reserva = seguimiento. Más los artículos frenados.</div></div></div>';

  // filtros comunes
  const rubros=uniq(R.compras.map(c=>c.rubro)), marcas=uniq(R.compras.filter(c=>!f.rubro||c.rubro===f.rubro).map(c=>c.marca));
  html+='<div class="filtros">'
    +fsel('Rubro','cRubro',opts(rubros,f.rubro))
    +fsel('Marca','cMarca',opts(marcas,f.marca))
    +'<div class="fgrp" style="min-width:120px"><label for="cMin">Vendidos ≥</label><input class="inp" id="cMin" type="number" min="1" value="'+f.minVendido+'" style="width:90px"></div>'
    +'<div class="fgrp" style="min-width:110px"><label for="cTop">Mostrar</label><select class="sel" id="cTop">'
      +[10,20,30,50,100,0].map(n=>'<option value="'+n+'"'+(f.topN===n?' selected':'')+'>'+(n===0?'Todos':'Top '+n)+'</option>').join('')+'</select></div>'
    +'<div class="fgrp" style="flex:1;min-width:170px"><label for="cQ">Buscar</label><input class="inp" id="cQ" placeholder="artículo, código, marca…" value="'+esc(f.q)+'" style="width:100%"></div>'
    +'<div class="fgrp" style="min-width:auto"><label>&nbsp;</label><label class="chk"><input type="checkbox" id="cVarios" '+(f.excluirVarios?'checked':'')+'> Excluir Varios/Facturación</label></div>'
    +'<div class="fgrp" style="min-width:auto;margin-left:auto"><label>&nbsp;</label><button class="btn btn-outline btn-sm" id="btnCsvCom">⇩ Excel</button></div>'
    +'</div>';

  // KPIs
  html+='<div class="kpis">'
    +kpi('Mejores sin reserva',fmtInt(sinRes.length)+' <small>art.</small>','par')
    +kpi('Unidades a reponer',fmtInt(sinRes.reduce((a,c)=>a+c.vendido,0)),'par')
    +kpi('Mejores con reserva',fmtInt(conRes.length)+' <small>art.</small>','rep')
    +kpi('Artículos frenados',fmtInt(frenados.length)+' <small>art.</small>')
    +'</div>';

  // selector de sección (se ve una a la vez para que no quede una página larguísima)
  const vista=f.vista;
  html+='<div class="segbar">'
    +'<button data-vista="sin" class="'+(vista==='sin'?'on':'')+'">🔴 Sin reserva — reponer a la marca <span class="n">'+fmtInt(sinRes.length)+'</span></button>'
    +'<button data-vista="con" class="'+(vista==='con'?'on':'')+'">🟢 Con reserva — seguimiento <span class="n">'+fmtInt(conRes.length)+'</span></button>'
    +'<button data-vista="frenados" class="'+(vista==='frenados'?'on':'')+'">⏸️ Frenados <span class="n">'+fmtInt(frenados.length)+'</span></button>'
    +'</div>';

  const lim = f.topN>0 ? f.topN : Infinity;
  if(vista==='sin'){
    // resumen por marca de lo SIN reserva (a quién comprarle)

      const chips=Object.entries(porMarca).sort((a,b)=>b[1]-a[1]).slice(0,12)
        .map(([m,u])=>'<span class="filechip"><b>'+esc(m)+'</b> · '+fmtInt(u)+' u</span>').join('');
      html+='<div class="card" style="padding:14px"><div class="card-h" style="font-size:16px">A quién reponer (top marcas sin reserva)</div>'
        +'<div style="margin-top:8px">'+chips+'</div></div>';
    }
    html+=seccionCompras('🔴 Mejores vendidos SIN reserva — reponer a la marca', sinRes, lim);
  } else if(vista==='con'){
    html+=seccionCompras('🟢 Mejores vendidos CON reserva — seguimiento', conRes, lim);
  } else {
    html+='<h2 class="card-h" style="font-size:18px;margin:6px 0 8px">⏸️ Artículos frenados <span class="card-hs" style="display:inline">('+fmtInt(frenados.length)+')</span></h2>';
    if(!frenados.length) html+='<div class="card-hs">Sin artículos frenados para estos filtros.</div>';
    else{
      html+='<div class="tbl-wrap"><table><thead><tr><th>Artículo</th><th>Código</th><th>Marca</th><th>Rubro</th><th class="num">Reserva</th><th class="num">Semanas</th></tr></thead><tbody>';
      frenados.slice(0,lim).forEach(p=>{ html+='<tr><td class="desc" title="'+esc(p.desc)+'">'+esc(p.desc||'—')+'</td>'
        +'<td class="mono">'+esc(p.codigo||p.id)+'</td><td>'+esc(p.marca)+'</td><td>'+esc(p.rubro)+'</td>'
        +'<td class="num mono">'+fmtInt(p.reservaTotal)+'</td><td class="num mono">'+fmtInt(p.semanas)+'</td></tr>'; });
      html+='</tbody></table></div>';
      if(frenados.length>lim) html+='<div class="card-hs" style="margin-top:8px">Mostrando los primeros '+fmtInt(lim)+' (de '+fmtInt(frenados.length)+'). Subí «Mostrar» o usá la pestaña «Reserva parada».</div>';
    }
  }
  return html;
}

  lim = lim||Infinity;
  let html='<h2 class="card-h" style="font-size:18px;margin:22px 0 8px">'+titulo+' <span class="card-hs" style="display:inline">('+fmtInt(rows.length)+')</span></h2>';
  if(!rows.length) return html+'<div class="card-hs">Sin artículos para estos filtros.</div>';

    +th('Artículo','desc')+th('Código','codigo')+th('Marca','marca')+th('Rubro','rubro')
    +thNum('Vendido','vendido')+thNum('Sucursales','sucursales')+thNum('Reserva','reservaTotal')
    +'</tr></thead><tbody>';

}

function viewParada(){

    +'<div class="fgrp" style="min-width:auto"><label>&nbsp;</label><label class="chk"><input type="checkbox" id="pVarios" '+(f.excluirVarios?'checked':'')+'> Excluir Varios/Facturación</label></div>'
    +'<div class="fgrp" style="min-width:auto"><label>&nbsp;</label><label class="chk"><input type="checkbox" id="pCron" '+(f.soloCronica?'checked':'')+'> Solo crónica (3+ sem)</label></div>'
    +'<div class="fgrp" style="min-width:auto;margin-left:auto"><label>&nbsp;</label><button class="btn btn-outline btn-sm" id="btnCsvPar">⇩ Excel</button></div>'
    +'</div>';
  if(!rows.length) return html+'<div class="state"><div class="big-ic">✅</div>Sin reserva parada para estos filtros.</div>';
  html+='<div class="tbl-wrap"><table><thead><tr>'
    +th('Artículo','desc')+th('Código','codigo')+th('Marca','marca')+th('Rubro','rubro')

    +'</tr></thead><tbody>';
  rows.forEach(r=>{
    let estado='';

/* ---------- Completar curva (dentro de Reposición) ----------
   Filas de la curva que pasan los filtros de criterio: unidades ya repartidas por
   aplicarUnidadesCurva(); sin venta del artículo en ninguna sucursal (reserva parada) solo
   si se pidió; y la sucursal tiene que tener el artículo en al menos N talles (default 2:
   un talle suelto es un resto, no una curva). Los filtros de navegación (sucursal, rubro,
   marca, búsqueda) los aplica reposFiltradas() sobre la vista ya fusionada. */
// ¿la fila de curva entra al reparto? (mismo criterio para repartir y para mostrar)
function curvaElegible(r){
  const f=state.filtrosCur;
  if(!f.incluirParados && !((r.ventaCadena||0)>0)) return false;
  if(f.minTalles>1 && r.nTalles<f.minTalles) return false;
  return true;
}
function curvaRows(){
  const R=state.resultado;
  if(!R||!R.curva) return [];
  return R.curva.filter(r=>r.sugerido>0 && curvaElegible(r));
}
// índice id|slug -> fila de curva (para fusionarla con la reposición)
function curvaIdx(){ const o={}; curvaRows().forEach(r=>{ o[r.id+'|'+r.slug]=r; }); return o; }
// Casillero de un talle en la columna Talles: talle arriba, unidades a mandar en grande,
// y abajo el porqué (cuántas hay en reserva; si no alcanzó, cuántas pedía).
// d = {v: lo pedido (vendido, o el mínimo en las medias), r: reserva del talle, s: lo que recibe}.
function talleChip(t, d, row){
  // calzado con tope: la sucursal ya tiene el máximo del talle, no le va nada (se ve con «Ver los talles que no hay»)
  if(d.top && d.v<=0){
    return '<span class="tgx off" title="'+esc('Talle '+t+': vendió '+d.vend+', pero la sucursal ya tiene '+d.tiene+' y en calzado no pasa de '+d.top+' por talle: no se le manda.')+'">'
      +'<span class="txl">'+esc(t)+'</span><span class="txn">—</span><span class="txr">tiene '+d.tiene+'</span></span>';
  }
  const piso = row && row.pisoMedias;
  const rec = d.s < d.v;                       // recibe menos de lo que pidió
  const nuevo = rec && esNuevoRet(d);          // hay, pero todo es mercadería nueva (filtro de días): no se reparte
  const nohay = rec && d.r<=0 && !nuevo;       // el depósito NO tiene ese talle → comprarle a la marca
  const vend = piso ? 'el piso del talle es '+(d.pisoN||d.v)+(d.tiene!=null?' y la sucursal tiene '+d.tiene+': faltan '+d.v:'') : 'vendió '+d.v;
  let pie, tip;
  if(nuevo){
    pie='nuevo · '+d.nd+' d';
    tip='Talle '+t+': '+vend+'. En el depósito hay '+d.nv+', pero la última compra fue hace '+d.nd+' días: es mercadería nueva y no se reparte en la barrida (va por el Reparto inicial).';
  } else if(nohay){
    pie='no hay';
    tip='Talle '+t+': '+vend+' y el depósito NO tiene ninguna. No es que se la llevó otra sucursal: no hay stock — hay que pedírselo a la marca.';
  } else if(rec){
    pie='de '+d.r+' · pedía '+d.v;
    tip='Talle '+t+': '+vend+' y en el depósito hay '+d.r+', que no alcanzan para todas las sucursales que lo piden. Por prioridad le tocan '+d.s+'.';
  } else {
    pie='de '+d.r;
    tip='Talle '+t+': '+vend+', en el depósito hay '+d.r+' y se le mandan '+d.s+'.';
  }
  if(d.nv>0 && !nuevo) tip+=' Además hay '+d.nv+' nuevas (compra de hace '+d.nd+' días) que no se reparten.';
  if(d.top && !nuevo && !nohay){ pie+=' · tiene '+d.tiene;
    tip+=' Vendió '+d.vend+', pero la sucursal ya tiene '+d.tiene+' y en calzado no pasa de '+d.top+' por talle: se le mandan hasta '+Math.max(0,d.top-d.tiene)+'.'; }
  // color (Juli 11/09/2026): amarillo = se manda, pero menos de lo pedido; rojo = no le va nada
  const cls = nuevo ? ' nuevo' : (!rec ? '' : (d.s>0 ? ' corto' : ' rec'));
  return '<span class="tgx'+cls+(nohay?' nohay':'')+' n-'+(nivelTalle(row,t)||'x')+'" title="'+esc(tip+curvaTip(row,t))+'">'
    +'<span class="txl">'+esc(t)+'</span><span class="txn">'+d.s+'</span><span class="txr">'+esc(pie)+'</span></span>';
}
// Las tres devuelven [{t, h}] (talle + casillero) para que la fila los intercale con los de
// reposición y los muestre todos juntos de menor a mayor talle.
// casilleros del vaciado: talles que bajan enteros porque la reserva del artículo es chica
function vacChips(talles, row){
  return (talles||[]).filter(d=>d.s>0).map(d=>({t:d.t, h:'<span class="tgx vac n-'+(nivelTalle(row,d.t)||'x')+'" title="'+esc('Vaciar reserva: quedan '+d.r+' de este talle en el depósito · se le mandan '+d.s+' a esta sucursal'+curvaTip(row,d.t))+'">'
    +'<span class="txl">'+esc(d.t)+'</span><span class="txn">+'+d.s+'</span><span class="txr">de '+d.r+' · vaciar</span></span>'}));
}
// casilleros de los talles que NO se bajan: todas las sucursales ya están cubiertas
function dejChips(dej, min){
  return (dej||[]).map(d=>({t:d.t, h:'<span class="tgx off" title="'+(d.tope
      ? 'Se deja en el depósito: todas las sucursales que lo piden llegarían a '+d.tope+' o más de este talle (tope de calzado). Quedan '+d.r+' en reserva.'
      : d.sinSuc
      ? 'Se deja en el depósito: ninguna sucursal que lo vende o lo tiene llega a '+d.minArt+' unidades del artículo (mandar una suelta no arma nada). Quedan '+d.r+' en reserva.'
      : 'Se deja en el depósito: todas las sucursales que lo piden ya tienen '+(d.min||min)+' o más de este talle (bajarlo sería stock parado). Quedan '+d.r+' en reserva.')+'">'
    +'<span class="txl">'+esc(d.t)+'</span><span class="txn">—</span><span class="txr">se deja</span></span>'}));
}
// chips de la curva de una fila: talles faltantes que se mandan (verde) y los que no (gris)
function curvaChips(faltan, row){
  return (faltan||[]).filter(d=>d.s>0 || !d.ya).map(d=>{   // `ya` = ya está en los talles de reposición de esta fila
    if(d.s>0) return {t:d.t, h:'<span class="tgx hueco n-'+(nivelTalle(row,d.t)||'x')+'" title="'+esc('Completar curva: la sucursal no tiene el talle '+d.t+' · en reserva '+d.r+' · se mandan '+d.s+(d.central&&d.s>1?' (talle central: se agranda)':'')+curvaTip(row,d.t))+'">'
      +'<span class="txl">'+esc(d.t)+'</span><span class="txn">+'+d.s+'</span><span class="txr">de '+d.r+' · no tiene</span></span>'};
    const why = d.agotado ? 'la reserva del talle se fue a las sucursales con más prioridad' : 'extremo de la curva (filtro «solo huecos internos»)';
    return {t:d.t, h:'<span class="tgx off" title="Completar curva: falta el talle '+esc(d.t)+' · '+why+'">'
      +'<span class="txl">'+esc(d.t)+'</span><span class="txn">—</span><span class="txr">'+(d.agotado?'agot.':'no va')+'</span></span>'};
  });
}
// agrandar la curva: talle central donde la sucursal tiene poco (verde, «tiene N»)
function engChips(eng, row){
  return (eng||[]).filter(d=>d.s>0).map(d=>({t:d.t, h:'<span class="tgx hueco n-'+(nivelTalle(row,d.t)||'x')+'" title="'+esc('Agrandar la curva: talle central, la sucursal tiene '+d.q+' · en reserva '+d.r+' · se le mandan '+d.s+curvaTip(row,d.t))+'">'
    +'<span class="txl">'+esc(d.t)+'</span><span class="txn">+'+d.s+'</span><span class="txr">de '+d.r+' · tiene '+d.q+'</span></span>'}));
}
// abrir a más sucursales: curva de arranque a una sucursal que no tiene el artículo (turquesa)
function ampChips(talles, row){
  return (talles||[]).filter(d=>d.s>0).map(d=>({t:d.t, h:'<span class="tgx amp n-'+(nivelTalle(row,d.t)||'x')+'" title="'+esc('Abrir a más sucursales: el artículo lleva '+row.ampDias+' días en el depósito y sobra reserva · en reserva '+d.r+(d.q?' · la sucursal tiene '+d.q:' · la sucursal no lo tiene')+' · se le mandan '+d.s+(d.central?' (talle central)':'')+curvaTip(row,d.t))+'">'
    +'<span class="txl">'+esc(d.t)+'</span><span class="txn">+'+d.s+'</span><span class="txr">de '+d.r+' · '+(d.q?'tiene '+d.q:'abrir')+'</span></span>'}));
}

/* ---------- Historial (botón arriba a la derecha) ----------
   Reemplaza a la pestaña «Histórico» (pedido de Juli 11/09/2026): un panel con buscador que
   lista las semanas guardadas. Se busca por fecha («08/09», «2026-09»), mes («septiembre») o año.
   Vive fuera de #view, así que render() no lo borra mientras está abierto. */
function histTexto(k){ const [y,m,d]=String(k).split('-'); return [lunesLabel(k), k, d+'/'+m, MESES_ES[+m]||'', y].join(' ').toLowerCase(); }
function pintarHistorial(){
  const pop=$('histPop'); if(!pop || pop.hidden) return;
  if(!$('histQ')){
    pop.innerHTML='<div class="hp-h"><b>Historial de barridas</b>'
      +'<button type="button" class="lnk" id="histRecargar" style="margin-left:auto" title="Volver a leer las semanas guardadas">↻ Recargar</button></div>'
      +'<input class="inp hp-q" id="histQ" type="search" placeholder="Buscar: 08/09, septiembre, 2026…" autocomplete="off">'
      +'<div class="hp-list" id="histList"></div>';
    $('histQ').oninput=pintarHistorial;
    $('histRecargar').onclick=async()=>{ $('histList').innerHTML='<div class="hp-vacio">Cargando…</div>'; await cargarHistKeys(); pintarHistorial(); };
    $('histList').onclick=e=>{ const b=e.target.closest('[data-hist]'); if(!b) return; cerrarHistorial(); abrirBarrida(b.dataset.hist); };
  }
  const list=$('histList');
  if(!FIREBASE_DB_URL){ list.innerHTML='<div class="hp-vacio">Sin base configurada: no hay historial.</div>'; return; }
  if(!state.histCargado){ list.innerHTML='<div class="hp-vacio">Cargando…</div>'; return; }
  if(!state.histKeys.length){ list.innerHTML='<div class="hp-vacio">Todavía no hay barridas guardadas.</div>'; return; }
  const toks=String($('histQ').value||'').toLowerCase().split(/\s+/).filter(Boolean);
  const keys=state.histKeys.slice().sort().reverse().filter(k=>{ const tx=histTexto(k); return toks.every(t=>tx.includes(t)); });
  if(!keys.length){ list.innerHTML='<div class="hp-vacio">Ninguna semana coincide con «'+esc($('histQ').value)+'».</div>'; return; }
  list.innerHTML=keys.map(k=>{ const [y,m]=k.split('-');
    const cur = state.resultado && state.resultadoSemana===k;
    return '<button type="button" class="hp-it" data-hist="'+esc(k)+'"><div><div class="hl">Semana del '+esc(lunesLabel(k))+(cur?' <span class="pill suc">abierta</span>':'')+'</div>'
      +'<div class="hs">'+esc((MESES_ES[+m]||'')+' '+y)+'</div></div><span class="go">Abrir →</span></button>'; }).join('');
}
function abrirHistorial(){
  const pop=$('histPop'), btn=$('btnHist'); if(!pop||!btn) return;
  pop.style.top=Math.round($('tabs').getBoundingClientRect().bottom+6)+'px';
  pop.hidden=false; btn.classList.add('on'); btn.setAttribute('aria-expanded','true');
  pintarHistorial();
  const q=$('histQ'); if(q){ q.focus(); q.select(); }
  if(FIREBASE_DB_URL) cargarHistKeys().then(pintarHistorial);   // siempre fresco al abrir
}
function cerrarHistorial(){
  const pop=$('histPop'), btn=$('btnHist'); if(!pop||pop.hidden) return;
  pop.hidden=true; if(btn){ btn.classList.remove('on'); btn.setAttribute('aria-expanded','false'); }
}
function wireHistorial(){
  const btn=$('btnHist'), pop=$('histPop'); if(!btn||!pop) return;
  btn.onclick=e=>{ e.stopPropagation(); if(pop.hidden) abrirHistorial(); else cerrarHistorial(); };
  document.addEventListener('click', e=>{ if(!pop.hidden && !pop.contains(e.target) && e.target!==btn) cerrarHistorial(); });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') cerrarHistorial(); });
  window.addEventListener('resize', cerrarHistorial);
}

/* encabezado ordenable */
function sortActivo(){ return state.tab==='parada'?state.sortPar : state.tab==='compras'?state.sortCom : state.sortRep; }
function th(label,key){ const s=sortActivo(); const on=s.k===key; return '<th data-sort="'+key+'">'+esc(label)+(on?(s.dir<0?' ▾':' ▴'):'')+'</th>'; }
function thNum(label,key){ const s=sortActivo(); const on=s.k===key; return '<th class="num" data-sort="'+key+'">'+esc(label)+(on?(s.dir<0?' ▾':' ▴'):'')+'</th>'; }
function fsel(label,id,inner){ return '<div class="fgrp"><label for="'+id+'">'+esc(label)+'</label><select class="sel" id="'+id+'">'+inner+'</select></div>'; }
// filtro de selección múltiple: sin nada tildado = todas; el caso de uso típico
// es "Todas" y destildar una (p.ej. sacar NIÑO para achicar la lista de talles)
// ¿hay algún filtro de navegación puesto? (los tildes de Mostrar/Sumar no cuentan)
function hayFiltros(f){ return !!(f.suc||f.rubro||f.marca||f.tipoprod||f.q||f.discs.length||f.subrubros.length); }
// chips de los filtros puestos: se ve de un vistazo por qué está recortada la lista
function chipsFiltros(f, sucBySlug){
  const c=(k,v,lbl,txt)=>'<span class="fchip"><i>'+esc(lbl)+'</i>'+esc(txt)+'<button type="button" data-fk="'+k+'" data-fv="'+esc(v)+'" title="Sacar este filtro">✕</button></span>';
  let out='';
  if(f.suc)      out+=c('suc','',      'Sucursal', sucBySlug[f.suc]||f.suc);
  if(f.rubro)    out+=c('rubro','',    'Rubro',    stripNN(f.rubro));
  if(f.marca)    out+=c('marca','',    'Marca',    f.marca);
  if(f.tipoprod) out+=c('tipoprod','', 'Tipo',     stripNN(f.tipoprod));
  f.discs.forEach(v=>{ out+=c('discs',v,'Disciplina',stripNN(v)); });
  f.subrubros.forEach(v=>{ out+=c('subrubros',v,'Subrubro',stripNN(v)); });
  if(f.q)        out+=c('q','',        'Buscar',   f.q);
  return out;
}
// «¿Cómo se lee esta tabla?»: abierta la primera vez, después como la dejó el usuario
function ayudaAbierta(){ try{ return localStorage.getItem('barrida_ayuda')!=='0'; }catch(e){ return true; } }
// El depósito usa siempre el mismo corte: los filtros y los parámetros de curva/vaciado
// se recuerdan en este navegador (la búsqueda no, que es de un rato).
const PREFS_KEY='barrida_prefs';
function guardarPrefs(){
  try{ const f=Object.assign({}, state.filtros); delete f.q;
    localStorage.setItem(PREFS_KEY, JSON.stringify({ v:2, f, fc:state.filtrosCur, fv:state.filtrosVac, fa:state.filtrosAmp, sort:state.sortRep })); }catch(e){}
}
function cargarPrefs(){
  try{
    const p=JSON.parse(localStorage.getItem(PREFS_KEY)||'null'); if(!p) return;
    // v2 (13/09/2026): «No repartir lo nuevo» pasó a venir prendido; las preferencias viejas lo
    // tenían apagado por defecto, así que ese valor no se toma de ellas (una sola vez)
    if(p.f) Object.keys(state.filtros).forEach(k=>{ if(k!=='q' && p.f[k]!=null && !(k==='sinNuevos' && p.v!==2)) state.filtros[k]=p.f[k]; });
    if(p.fc) Object.assign(state.filtrosCur, p.fc);
    if(p.fv) Object.assign(state.filtrosVac, p.fv);
    if(p.fa) Object.assign(state.filtrosAmp, p.fa);
    if(p.sort && p.sort.k) state.sortRep=p.sort;
  }catch(e){}
}

function fmulti(label, id, opciones, sel){
  const n=sel.length;
  const txt = !n ? 'Todas' : (n===1 ? stripNN(sel[0]) : n+' de '+opciones.length);
  let pop;
  if(!opciones.length){
    pop='<div class="msel-empty">Esta barrida se guardó sin este dato. Se completa solo con la <b>próxima barrida</b> que cargues (el cruce nuevo ya lo trae).</div>';
  } else {
    pop=opciones.map(o=>'<label class="msel-it"><input type="checkbox" value="'+esc(o)+'"'+(sel.includes(o)?' checked':'')+'> '+esc(stripNN(o))+'</label>').join('')
      +'<div class="msel-acc"><button type="button" data-acc="todas">Marcar todas</button><button type="button" data-acc="limpiar">Limpiar</button></div>';
  }
  return '<div class="fgrp"><label>'+esc(label)+'</label><details class="msel" id="'+id+'"'+(state.mselOpen===id?' open':'')+'>'
    +'<summary>'+esc(txt)+'</summary><div class="msel-pop">'+pop+'</div></details></div>';
}

// De la última barrida GUARDADA anterior a esta semana: qué se le sugirió a cada sucursal.
// Sirve para marcar lo que se repite (o no llegó, o el artículo rota fuerte y hay que recomprar).
async function cargarSemanaPrevia(sem){
  if(!FIREBASE_DB_URL) return null;
  try{
    const keys=await conTimeout(fbGet(ROOT+'/barridas','shallow=true'), 6000);
    const prev=Object.keys(keys||{}).filter(k=>k<sem).sort().pop();
    if(!prev) return null;
    const rep=await conTimeout(fbGet(ROOT+'/barridas/'+prev+'/reposicion'), 10000);
    if(!rep) return null;
    const map={};
    Object.entries(rep).forEach(([slug,filas])=>{ (filas||[]).forEach(r=>{ if(r&&r.id) map[r.id+'|'+slug]=(map[r.id+'|'+slug]||0)+(r.sugerido||0); }); });
    return { semana:prev, map };
  }catch(e){ return null; }
}

async function procesarBarrida(){
  if(!state.files.ventas || !state.files.reserva){ toast('Faltan las dos hojas','err'); return; }
  let histPrev=null, histSnaps=[];
  try{
    if(FIREBASE_DB_URL){
      // timeout: si la base no existe / está lenta, no bloquear el procesamiento
      const hist = await Promise.race([ fbGet(ROOT+'/reservaHist'), new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),6000)) ]);
      if(hist){
        const keys=Object.keys(hist).filter(k=>k<state.semana).sort().reverse();
        histSnaps=keys.map(k=>hist[k]||{});
        histPrev=histSnaps[0]||null;
      }
    }
  }catch(e){ /* si falla la base, seguimos sin histórico */ }
  // fuentes de la prioridad (meses de stock + categorías); si fallan, se procesa igual
  if(!PRIO.cargado){ toast('Cargando meses de stock y categorías…'); try{ await conTimeout(cargarPrioridad(),20000); }catch(e){ PRIO.cargado=true; } }
  // talles centrales editados en el Reparto inicial (los usa «agrandar la curva»); sin base, los de fábrica
  if(FIREBASE_DB_URL && !state.rep.cargado && !state.rep.centrales){
    try{ const c=await conTimeout(fbGet(ROOT+'/repartoConfig/centrales'),6000); if(c) state.rep.centrales=c; }catch(e){}
  }
  if(FIREBASE_DB_URL && !state.rep.cargado && !state.rep.accTipos){
    try{ const c=await conTimeout(fbGet(ROOT+'/repartoConfig/accTipos'),6000); if(c) state.rep.accTipos=c; }catch(e){}
  }
  // stock por sucursal guardado para la semana (si no hay archivo cargado): se baja recién acá
  try{ await asegurarStockData(); }catch(e){ toast('No pude bajar el stock por sucursal guardado; sigo sin él','err'); }
  // qué se le sugirió a cada sucursal en la última barrida guardada (para marcar lo que se repite)
  const prevRep = await cargarSemanaPrevia(state.semana);
  try{
    state.resultado=computar(histPrev, histSnaps);
    state.resultado.prioFuentes={ stock: PRIO.stock?('meses de stock '+PRIO.stockMes):'', cats: PRIO.catsOrigen||'' };
    state.resultado.previa = prevRep;              // qué se le sugirió a cada sucursal la semana pasada
    // lo ya bajado de la base, para recalcular sin volver a pedirlo (recalcular())
    state._proc = { histPrev, histSnaps, prioFuentes:state.resultado.prioFuentes, previa:prevRep };
    state.transf=null;                            // el cruce de transferencias es de la semana que se abrió
    aplicarReparto();
    state.resultadoSemana=null;
    render();
    toast('Barrida procesada','ok');
  }catch(err){ console.error(err); toast('Error al procesar: '+(err.message||err),'err'); }
}

// Rehace el cruce con los mismos archivos y lo que ya se bajó de la base (histórico, semana
// previa, meses de stock, stock de la semana). Para los parámetros que cambian QUÉ reserva se
// reparte (los días de ingreso), que viven en computar() y no en los aplicar…() de pantalla.
function recalcular(){
  const P=state._proc;
  if(!P || !state.files.ventas || !state.files.reserva){ render(); return; }
  try{
    const transf=state.transf;
    state.resultado=computar(P.histPrev, P.histSnaps);
    state.resultado.prioFuentes=P.prioFuentes; state.resultado.previa=P.previa;
    state.transf=transf;
    aplicarReparto();
    state.resultadoSemana=null;                    // cambió lo que se reparte: hay que volver a guardar
  }catch(err){ console.error(err); toast('Error al recalcular: '+(err.message||err),'err'); }
  render();
}

/* ---------- Barridas por MARCA + RUBRO (13/09/2026, pedido de Juli) ----------
   El depósito no barre todo el depósito de una: hace «Adidas calzado», «Nike calzado», «X
   indumentaria»… Antes cada «Guardar semana» escribía la semana entera y la marca siguiente pisaba
   a la anterior (Mi Sucursal y el Picking veían solo la última). Ahora cada guardado SUMA su pedazo:
   se conserva lo que ya estaba de otras marcas-rubros y se reemplaza solo lo de las que trae esta
   barrida. `meta.partes/<marca|rubro>` dice qué se guardó, cuándo y quién. Mi Sucursal y el Picking
   no cambian: siguen leyendo barridas/<lunes>, que ahora tiene todo lo barrido en la semana. */
const segDe = (marca, rubro) => normMarca(marca)+'|'+stripNN(rubro).toUpperCase().trim();
const segLbl = (marca, rubro) => (String(marca||'').trim()||'—')+' · '+(stripNN(rubro)||'—');
function totalesSemana(rep, cur, parada, base){
  const t=Object.assign({}, base||{});
  const filas=[].concat(...Object.values(rep||{}).map(a=>a||[])), filasC=[].concat(...Object.values(cur||{}).map(a=>a||[]));
  t.lineas_reposicion=filas.length; t.unidades_sugeridas=filas.reduce((a,r)=>a+(num(r.sugerido)||0),0);
  t.items_reponibles=new Set(filas.map(r=>r.id)).size; t.sucursales=Object.keys(rep||{}).length;
  t.curva_lineas=filasC.length; t.curva_unidades=filasC.reduce((a,r)=>a+(num(r.sugerido)||0),0);
  t.items_parados=(parada||[]).length; t.unidades_paradas=(parada||[]).reduce((a,r)=>a+(num(r.reservaTotal)||0),0);
  return t;
}
function fusionarSemana(prev, payload, segs, R){
  const claves=Object.keys(segs||{});
  const partes=Object.assign({}, (prev&&prev.meta&&prev.meta.partes)||{});
  const esMio = r => !!(r && segs[segDe(r.marca, r.rubro)]);
  const ahora=nowISO();
  const uDe = (bySlug,k) => [].concat(...Object.values(bySlug||{}).map(a=>a||[])).filter(r=>segDe(r.marca,r.rubro)===k).reduce((a,r)=>a+(num(r.sugerido)||0),0);
  claves.forEach(k=>{ const kk=repKey(k), sg=segs[k];
    if(R && R.desdeBase && partes[kk]) return;                 // se volvió a guardar la misma semana: se deja el registro original
    partes[kk]={ seg:k, marca:sg.marca||'', rubro:sg.rubro||'', articulos:sg.articulos||0, unidades:uDe(payload.reposicion,k)+uDe(payload.curva,k),
      generado_en:ahora, generado_por:SESSION.email||'', archivo_reserva:(state.files.reserva||{}).archivo||'',
      archivo_ventas:(state.files.ventas||{}).archivo||'', archivo_stock:(state.files.stock||{}).archivo||'' }; });
  if(!prev || !claves.length){ payload.meta.partes=partes; return payload; }
  const porSlug = (viejo, nuevo) => { const out={};
    Object.entries(viejo||{}).forEach(([slug,arr])=>{ const q=(arr||[]).filter(r=>r && !esMio(r)); if(q.length) out[slug]=q; });
    Object.entries(nuevo||{}).forEach(([slug,arr])=>{ out[slug]=(out[slug]||[]).concat(arr||[]); });
    return out; };
  const lista = (viejo, nuevo) => (viejo||[]).filter(r=>r && !esMio(r)).concat(nuevo||[]);
  const reposicion=porSlug(prev.reposicion, payload.reposicion), curva=porSlug(prev.curva, payload.curva);
  const parada=lista(prev.parada, payload.parada);
  // Compras sale de las ventas (pueden venir de todas las marcas): solo se guarda lo de lo barrido
  const compras=lista(prev.compras, (payload.compras||[]).filter(esMio));
  const meta=Object.assign({}, payload.meta, { partes, totales:totalesSemana(reposicion, curva, parada, payload.meta.totales) });
  const out={ meta, reposicion, curva, parada, compras };
  if(prev.transf) out.transf=prev.transf;
  return out;
}
// qué marcas-rubros ya se guardaron en la semana elegida (liviano: solo meta/partes)
async function cargarPartesSemana(){
  const sem=state.semana; if(!FIREBASE_DB_URL) return;

}
function partesSemanaHtml(mini){

  const chips=partes.sort((a,b)=>cmp(a.generado_en||'',b.generado_en||'')).map(pt=>{ const pisa=!guardada && !!mias[pt.seg];
    return '<span class="cparte'+(pisa?' pisa':'')+'" title="Guardada el '+esc(pt.generado_en||'')+(pt.generado_por?' por '+esc(pt.generado_por):'')+' · '+fmtInt(pt.unidades||0)+' u. a bajar'+(pisa?' · la barrida que tenés abierta es de esta marca: si la guardás, la reemplaza':'')+'">'+esc(segLbl(pt.marca,pt.rubro))+(pisa?' ↻':'')+'</span>'; }).join('');
  return (mini?'':'<span class="sep">|</span>')+'<span class="cpartes">Ya guardado esta semana: '+chips+'</span>';
}
async function guardarBarrida(){
  if(!state.resultado){ toast('Procesá primero','err'); return; }
  if(!FIREBASE_DB_URL){ toast('Sin base configurada','err'); return; }
  const R=state.resultado, sem=state.semana;
  // reposición agrupada por slug (para que cada sucursal baje solo lo suyo)
  // El vaciado de la reserva chica NO va en un nodo aparte: se SUMA a la reposición de cada
  // sucursal, porque para el local es lo mismo (mercadería que baja del depósito) y así lo
  // ven sin cambios Indicadores y el Picking. Solo si el tilde estaba puesto.
  const vacI = vacIdx();
  const repBySlug={};
  R.reposicion.forEach(r=>{
    // con el vaciado puesto, la sucursal con menos del mínimo del artículo no recibe nada
    if(vacFueraDe(R, r.id, r.slug)!=null) return;
    const v=vacI[r.id+'|'+r.slug]; if(v) delete vacI[r.id+'|'+r.slug];
    const talles=Object.entries(r.talles).map(([t,d])=>({t, v:d.v, r:d.r, s:d.s}));
    if(v) v.talles.forEach(d=>{ const y=talles.find(x=>x.t===d.t); if(y) y.s+=d.s; else talles.push({t:d.t, v:0, r:d.r, s:d.s}); });
    (repBySlug[r.slug]=repBySlug[r.slug]||[]).push({
      id:r.id, codigo:r.codigo, desc:r.desc, marca:r.marca, rubro:r.rubro, tipo:r.tipo, disc:r.disc||'', genero:r.genero||'',
      vendido:r.vendido, reservaTotal:r.reservaTotal, sugerido:r.sugerido+(v?v.sugerido:0),
      vaciado:v?v.sugerido:0,                            // cuánto de lo que baja es por vaciar la reserva
      prio:r.prio||0, prioDe:r.prioDe||0, pr:r.pr||null,   // prioridad con la que se repartió la reserva
      // talles como ARRAY (no objeto): Firebase no admite claves con punto (ej "8.5").
      talles
    });
  });
  // sucursales que no vendieron el artículo pero lo tienen: reciben solo por el vaciado
  Object.values(vacI).forEach(v=>{ (repBySlug[v.slug]=repBySlug[v.slug]||[]).push({
    id:v.id, codigo:v.codigo, desc:v.desc, marca:v.marca, rubro:v.rubro, tipo:v.tipo, disc:v.disc||'', genero:v.genero||'',
    vendido:v.vendido, reservaTotal:v.reservaTotal, sugerido:v.sugerido, vaciado:v.sugerido, soloVaciado:true,
    prio:v.prio||0, prioDe:v.prioDe||0, pr:v.pr||null,
    talles: v.talles.map(d=>({t:d.t, v:0, r:d.r, s:d.s})),
  }); });
  // abrir a más sucursales: también se SUMA a la reposición de la sucursal (campo `ampliar`), así
  // Indicadores y el Picking lo ven como mercadería que baja, sin cambios
  (R.ampliar||[]).forEach(a=>{
    const lista=repBySlug[a.slug]=repBySlug[a.slug]||[];
    const tt=a.talles.map(d=>({t:d.t, v:0, r:d.r, s:d.s}));
    const y=lista.find(x=>x.id===a.id);
    if(y){ tt.forEach(d=>{ const z=y.talles.find(x=>x.t===d.t); if(z) z.s+=d.s; else y.talles.push(d); }); y.sugerido+=a.sugerido; y.ampliar=a.sugerido; return; }
    lista.push({ id:a.id, codigo:a.codigo, desc:a.desc, marca:a.marca, rubro:a.rubro, tipo:a.tipo, disc:a.disc||'', genero:a.genero||'',
      vendido:a.vendido, reservaTotal:a.reservaTotal, sugerido:a.sugerido, ampliar:a.sugerido, soloAmpliar:true, diasDeposito:a.dias,
      prio:a.prio||0, prioDe:a.prioDe||0, pr:a.pr||null, talles:tt });
  });
  // completar curva, también por slug: solo lo que quedó con unidades a mandar con los
  // parámetros elegidos (unidades por talle, huecos, mínimo de talles, vendió).
  // Solo si el depósito tildó «Completar curva» en Reposición: así la sucursal (Indicadores) y el
  // Picking ven la curva únicamente cuando se decidió mandarla.
  const curBySlug={};
  (R.conStock ? curvaRows() : []).forEach(r=>{ (curBySlug[r.slug]=curBySlug[r.slug]||[]).push({
    id:r.id, codigo:r.codigo, desc:r.desc, marca:r.marca, rubro:r.rubro, tipo:r.tipo, disc:r.disc||'', genero:r.genero||'',
    enSucursal:r.enSucursal, nTalles:r.nTalles, vendido:r.vendido, reservaTotal:r.reservaTotal, sugerido:r.sugerido,
    prio:r.prio||0, prioDe:r.prioDe||0, pr:r.pr||null,                                        // puesto entre las sucursales del artículo (vendido · meses de stock · categoría)
    // faltantes a mandar + talles centrales que se agrandan (estos llevan `tiene` = lo que ya había)
    talles: r.faltan.filter(d=>d.s>0).map(d=>({t:d.t, r:d.r, s:d.s}))
      .concat((r.engrosa||[]).filter(d=>d.s>0).map(d=>({t:d.t, r:d.r, s:d.s, tiene:d.q}))),
    tiene: Object.keys(r.tallesSuc||{}).sort(cmpTalle).map(t=>({t, q:r.tallesSuc[t]})),      // la curva que ya tiene
  }); });
  const fc=state.filtrosCur;
  const payload={
    meta:{ generado_en:nowISO(), generado_por:SESSION.email||'', semana:sem,
      archivo_ventas:(state.files.ventas||{}).archivo||'', archivo_reserva:(state.files.reserva||{}).archivo||'',
      archivo_stock:(state.files.stock||{}).archivo||'',
      curva_param:{ activa:!!R.conStock, centralHasta:fc.centralHasta, unidades:fc.unidades, soloHuecos:fc.soloHuecos, soloRotan:fc.soloRotan, minTalles:fc.minTalles, incluirParados:fc.incluirParados },
      tope_param:{ tope:(R.tope||{}).tope||0, unidades:(R.tope||{}).unidades||0, talles:(R.tope||{}).talles||0 },
      vaciado_param:{ activa:(R.vaciado||[]).length>0, max:state.filtrosVac.max, minSuc:state.filtrosVac.minSuc, minArt:state.filtrosVac.minArt },
      // abrir a más sucursales (artículos con N+ días en el depósito a sucursales que no los tienen)
      ampliar_param:{ activa:(R.ampliar||[]).length>0, dias:Math.max(1,state.filtros.diasNuevo|0), outletDias:state.filtrosAmp.outletDias,
        uCentral:state.filtrosAmp.uCentral, maxCentral:state.filtrosAmp.maxCentral, reserva:state.filtrosAmp.reserva, excluye:'aurelius, adidas',
        unidades:(R.totales||{}).amp_unidades||0, lineas:(R.totales||{}).amp_lineas||0, articulos:(R.totales||{}).amp_arts||0 },
      // no repartir lo nuevo: talles con compra de hace menos de `dias` días (0 = sin filtro)
      dias_param:{ reservaConDias:!!R.conDias, activa:!!R.diasNuevo, dias:R.diasNuevo||0, unidades:(R.nuevos||{}).unidades||0, articulos:(R.nuevos||{}).articulos||0 },
      prioFuentes: R.prioFuentes||null,
      totales:R.totales },
    reposicion:repBySlug,
    curva:curBySlug,
    parada:R.parada,
    compras:R.compras,
  };
  // lo que ya se guardó esta semana de OTRAS marcas-rubros se conserva (ver fusionarSemana)
  const segs=R.segmentos||{};
  let prev=null;
  try{ prev=await conTimeout(fbGet(ROOT+'/barridas/'+sem),30000); }
  catch(e){ toast('No pude leer lo que ya se guardó esta semana: probá de nuevo en un rato (no se guardó nada)','err'); return; }
  const yaPartes=(prev&&prev.meta&&prev.meta.partes)||{};
  const pisa=Object.keys(segs).filter(k=>yaPartes[repKey(k)]).map(k=>{ const pt=yaPartes[repKey(k)];
    return '• '+segLbl(pt.marca,pt.rubro)+' (guardada el '+String(pt.generado_en||'').slice(0,16)+(pt.generado_por?' por '+pt.generado_por:'')+')'; });
  if(pisa.length && !R.desdeBase && !confirm('Esta semana ya se guardó:\n\n'+pisa.join('\n')+'\n\nSi guardás, se reemplaza con esta barrida. Las demás marcas de la semana quedan como están. ¿Seguir?')) return;
  const semana=fusionarSemana(prev, payload, segs, R);
  try{
    const btn=$('btnGuardar'); if(btn){ btn.disabled=true; btn.textContent='Guardando…'; }
    // si el stock por sucursal vino de un archivo y no quedó guardado para ESTA semana (p.ej. se cambió la semana después de subirlo), se guarda ahora
    if(state.files.stock && state._stockGuardado!==sem+'|'+state.files.stock.archivo) await guardarStockSemana();
    await fbPut(ROOT+'/barridas/'+sem, semana);
    // el snapshot de la reserva se SUMA al de la semana (cada marca trae sus artículos)
    if(R.snapshot && Object.keys(R.snapshot).length) await fbPatch(ROOT+'/reservaHist/'+sem, R.snapshot);
    await fbPut(ROOT+'/ultima', sem);
    state.partesSem={ semana:sem, partes:(semana.meta&&semana.meta.partes)||{} };
    state.resultadoSemana=sem;
    if(!state.histKeys.includes(sem)) state.histKeys.push(sem);
    const nombres=Object.values(segs).map(sg=>segLbl(sg.marca,sg.rubro));
    toast('Barrida guardada ✓'+(nombres.length && nombres.length<=3 ? ' · '+nombres.join(', ') : (nombres.length ? ' · '+nombres.length+' marcas-rubros' : '')),'ok');
    render();
  }catch(err){
    console.error(err);
    toast('No se pudo guardar (¿existe la base barrida-mateu?): '+(err.message||err),'err');
    render();
  }
}

function wireMulti(id, key){

  if(!ms) return;

  });

    e.preventDefault();

    render();
  });
  if(!window.__mselDoc){
    window.__mselDoc=true;

      // si el clic fue sobre un nodo que un re-render acaba de sacar del DOM

      if(!document.contains(e.target)) return;

        if(!el.contains(e.target)){ el.open=false; if(state.mselOpen===el.id) state.mselOpen=null; }

async function abrirBarrida(sem){
  try{
    toast('Abriendo…');
    const b=await fbGet(ROOT+'/barridas/'+sem);
    if(!b){ toast('No encontré esa barrida','err'); return; }
    // reconstituir el shape de state.resultado desde lo guardado
    const reposicion=[];
    Object.entries(b.reposicion||{}).forEach(([slug,arr])=>{ (arr||[]).forEach(r=>{
      // talles vuelve como array [{t,v,r,s}] (por el punto en las claves) → reconstruir objeto
      let talles=r.talles;
      if(Array.isArray(talles)){ const o={}; talles.forEach(d=>{ o[d.t]={v:d.v,r:d.r,s:d.s}; }); talles=o; }
      reposicion.push({ ...r, talles:talles||{}, slug, sucNombre:(SLUG_SUC[slug]||OUTLET_SUC[slug]||slug) });
    }); });
    // completar curva: `talles` = faltantes a mandar [{t,r,s}], `tiene` = curva de la sucursal [{t,q}]
    const curva=[];
    Object.entries(b.curva||{}).forEach(([slug,arr])=>{ (arr||[]).forEach(r=>{
      const tallesSuc={}; (r.tiene||[]).forEach(d=>{ tallesSuc[d.t]=d.q; });
      const faltan=(r.talles||[]).filter(d=>!(d.tiene>0)).map(d=>({t:d.t, r:d.r, s:d.s, ya:false}));
      const engrosa=(r.talles||[]).filter(d=>d.tiene>0).map(d=>({t:d.t, r:d.r, s:d.s, q:d.tiene}));   // centrales agrandados
      const row={ ...r, slug, sucNombre:(SLUG_SUC[slug]||OUTLET_SUC[slug]||slug), tallesSuc, faltan, engrosa, nTalles:r.nTalles||Object.keys(tallesSuc).length };
      delete row.tiene; delete row.talles;
      marcarInternos(row); curva.push(row);
    }); });
    const conStock = curva.length>0 || !!(b.meta && b.meta.archivo_stock);
    state.resultado={ reposicion, parada:b.parada||[], compras:b.compras||null, curva, vaciado:[], vacDejados:{}, conStock, snapshot:{}, totales:(b.meta&&b.meta.totales)||{}, sinHistorial:false };
    { const sg={}; [].concat(reposicion, curva, b.parada||[]).forEach(r=>{ if(!r) return; const k=segDe(r.marca,r.rubro); if(!sg[k]) sg[k]={ marca:String(r.marca||'').trim(), rubro:stripNN(r.rubro), articulos:0 }; });
      state.resultado.segmentos=sg; state.resultado.desdeBase=true; }   // volver a guardarla no pregunta: es la misma semana
    state._proc=null;                         // viene de la base: no hay archivos para recalcular
    if(b.meta && b.meta.curva_param){ const cp=b.meta.curva_param; ['unidades','soloHuecos','soloRotan','minTalles','incluirParados'].forEach(k=>{ if(cp[k]!=null) state.filtrosCur[k]=cp[k]; }); }
    if(b.meta && b.meta.curva_param && b.meta.curva_param.centralHasta!=null) state.filtrosCur.centralHasta=b.meta.curva_param.centralHasta;
    // el vaciado ya viene sumado a las filas guardadas (R.vaciado queda vacío: no se vuelve a sumar)
    // el cruce con las transferencias que se haya guardado para esa semana
    state.transf = (b.transf && b.transf.porId) ? Object.assign({porId:{},porCod:{}}, b.transf.meta||{}, {porId:b.transf.porId||{}, porCod:b.transf.porCod||{}}) : null;
    if(b.meta && b.meta.prioFuentes) state.resultado.prioFuentes=b.meta.prioFuentes;
    aplicarUnidadesCurva();
    state.resultadoSemana=sem; state.semana=sem;
    setTab('reposicion');
    toast('Barrida del '+lunesLabel(sem),'ok');
  }catch(err){ toast('No se pudo abrir: '+(err.message||err),'err'); }
}

// hoja estilizada genérica: membrete + banda resumen + header navy + autofiltro + freeze
function hojaEstilizada(wb, nombre, titulo, resumen, headers, widths, leftCols){

  ws.getRow(r).height=34; r++;
  ws.mergeCells(r,1,r,nCols);
  const sub=ws.getCell(r,1); sub.value=resumen; sub.font={size:10,name:'Calibri',color:{argb:BRAND.navy}};
  sub.alignment={horizontal:'left',vertical:'middle',indent:1}; sub.fill={type:'pattern',pattern:'solid',fgColor:{argb:BRAND.band}};
  ws.getRow(r).height=20; r+=2;
  const headerRowIdx=r;
  headers.forEach((h,i)=>{ const c=ws.getCell(r,i+1); c.value=h; c.font={bold:true,color:{argb:BRAND.white},size:10,name:'Calibri'};
    c.fill={type:'pattern',pattern:'solid',fgColor:{argb:BRAND.navy}}; c.alignment={horizontal:i<leftCols?'left':'center',vertical:'middle'}; c.border=thinBorder(BRAND.navy); });
  ws.getRow(r).height=18;
  ws.autoFilter={from:{row:headerRowIdx,column:1},to:{row:headerRowIdx,column:nCols}};
  ws.views=[{state:'frozen', ySplit:headerRowIdx, showGridLines:false}];

// filas de reposición filtradas + ordenadas igual que la tabla
// Filas de Reposición con los filtros de la vista. Con el tilde «Completar curva» cada fila
// suma los talles de curva de esa misma sucursal (curvaFaltan / curvaU) y se agregan filas
// `soloCurva` para las sucursales que no vendieron pero tienen el artículo con talles faltantes.
// `sugerido` de la fila fusionada = reposición + curva (`sugRep` guarda solo la reposición).
// Filas de Reposición con «Completar curva» y «Vaciar la reserva chica» ya sumados, SIN los
// filtros de navegación (sucursal, rubro, búsqueda…): es el reparto completo de la semana,
// que es lo que hay que mirar para saber cuánto queda en el depósito de cada artículo.
// reposición + curva + vaciado (sin «Abrir a más sucursales», que se calcula con lo que esto deja)
function reposBase(){
  const R=state.resultado;
  let rows=R.reposicion.slice();
  // «Completar curva» (y agrandar los centrales) va siempre que haya stock por sucursal (Juli 11/09/2026)
  if(R.conStock){
    const idx=curvaIdx();
    rows=rows.map(r=>{ const c=idx[r.id+'|'+r.slug]; if(!c) return r; delete idx[r.id+'|'+r.slug];
      return {...r, sugRep:r.sugerido, curvaFaltan:c.faltan, curvaEng:c.engrosa, curvaU:c.sugerido, sugerido:r.sugerido+c.sugerido, tallesSuc:c.tallesSuc}; });
    Object.values(idx).forEach(c=>rows.push({ id:c.id, slug:c.slug, sucNombre:c.sucNombre, codigo:c.codigo, desc:c.desc, marca:c.marca, rubro:c.rubro, tipo:c.tipo, genero:c.genero, disc:c.disc,
      vendido:c.vendido, reservaTotal:c.reservaTotal, talles:{}, pr:c.pr, prio:c.prio, prioDe:c.prioDe,
      soloCurva:true, sugRep:0, curvaFaltan:c.faltan, curvaEng:c.engrosa, curvaU:c.sugerido, sugerido:c.sugerido, tallesSuc:c.tallesSuc }));
  }
  if((R.vaciado||[]).length){
    // «Vaciar la reserva chica» también va siempre (Juli 11/09/2026): se suma a las filas. Para ver
    // SOLO esos artículos está «Ver solo: Reserva chica» (reposFiltradas).
    const idx=vacIdx();
    // la sucursal con menos del mínimo del artículo no recibe nada (ni la reposición por venta):
    // la fila queda en cero con el aviso y sus unidades ya se repartieron entre las demás
    rows=rows.map(r=>{ const st=vacFueraDe(R, r.id, r.slug); if(st==null) return r;
      return {...r, talles:{}, sugRep:0, curvaU:0, curvaFaltan:null, curvaEng:null, sugerido:0, vacFuera:st}; });
    rows=rows.map(r=>{ const c=idx[r.id+'|'+r.slug]; if(!c) return r; delete idx[r.id+'|'+r.slug];
      return {...r, sugRep:(r.sugRep!=null?r.sugRep:r.sugerido), vacFaltan:c.talles, vacU:c.sugerido, sugerido:r.sugerido+c.sugerido}; });
    Object.values(idx).forEach(c=>rows.push({ id:c.id, slug:c.slug, sucNombre:c.sucNombre, codigo:c.codigo, desc:c.desc, marca:c.marca, rubro:c.rubro, tipo:c.tipo, genero:c.genero, disc:c.disc,
      vendido:c.vendido, reservaTotal:c.reservaTotal, talles:{}, pr:c.pr, prio:c.prio, prioDe:c.prioDe,
      soloVaciado:true, sugRep:0, vacFaltan:c.talles, vacU:c.sugerido, sugerido:c.sugerido }));
  }
  return rows;
}
// todas las filas del reparto: reposición + curva + vaciado + abrir a más sucursales
function reposFusionadas(){
  const R=state.resultado;
  let rows=reposBase();
  if((R.ampliar||[]).length){
    const idx={}; R.ampliar.forEach(a=>{ idx[a.id+'|'+a.slug]=a; });
    rows=rows.map(r=>{ const a=idx[r.id+'|'+r.slug]; if(!a) return r; delete idx[r.id+'|'+r.slug];
      return {...r, sugRep:(r.sugRep!=null?r.sugRep:r.sugerido), ampTalles:a.talles, ampU:a.sugerido, ampDias:a.dias, ampAsig:a.asig, sugerido:r.sugerido+a.sugerido}; });
    Object.values(idx).forEach(a=>rows.push({ id:a.id, slug:a.slug, sucNombre:a.sucNombre, codigo:a.codigo, desc:a.desc, marca:a.marca, rubro:a.rubro, tipo:a.tipo, genero:a.genero, disc:a.disc,
      vendido:a.vendido, reservaTotal:a.reservaTotal, talles:{}, pr:a.pr, prio:a.prio, prioDe:a.prioDe,
      soloAmpliar:true, sugRep:0, ampTalles:a.talles, ampU:a.sugerido, ampDias:a.dias, ampAsig:a.asig, sugerido:a.sugerido }));
  }
  return rows;
}
// lo que QUEDA en el depósito por artículo después de repartir todo (reposición + curva + vaciado + abrir)
function restantePorArt(){
  const R=state.resultado, res={}, bajan={};
  reposFusionadas().forEach(r=>{ bajan[r.id]=(bajan[r.id]||0)+(r.sugerido||0); if(res[r.id]==null) res[r.id]=r.reservaTotal; });
  const out={}; Object.keys(res).forEach(id=>{ out[id]=Math.max(0, res[id]-(bajan[id]||0)); });
  return out;
}
function reposFiltradas(){

  let rows=reposFusionadas();
  if(f.excluirVarios) rows=rows.filter(r=>!/varios|facturacion/i.test(r.rubro+' '+r.tipo));
  if(f.soloSugerido) rows=rows.filter(r=>r.sugerido>0 || recortadaPorPrio(r));   // las recortadas por el reparto se ven igual
  if(f.soloFaltante) rows=rows.filter(faltaEn);
  if(f.soloRepite) rows=rows.filter(r=>repiteDe(r)>0);
  if(f.verSoloCurva) rows=rows.filter(r=>(r.curvaU||0)>0);
  if(f.verSoloVac){ const arts=state.resultado.vacArts||{}; rows=rows.filter(r=>arts[r.id]); }
  if(f.verSoloAmp) rows=rows.filter(r=>(r.ampU||0)>0);
  if(f.soloSinEnviar && state.transf) rows=rows.filter(r=>{ const e=estadoEnvio(r); return e && (e.k==='no'||e.k==='parcial'); });
  if(f.suc) rows=rows.filter(r=>r.slug===f.suc);
  if(f.rubro) rows=rows.filter(r=>r.rubro===f.rubro);
  if(f.marca) rows=rows.filter(r=>r.marca===f.marca);
  if(f.discs.length) rows=rows.filter(r=>f.discs.includes(r.disc||''));
  if(f.subrubros.length) rows=rows.filter(r=>f.subrubros.includes(r.genero||''));
  if(f.tipoprod) rows=rows.filter(r=>r.tipo===f.tipoprod);
  if(f.q){ const q=f.q.toLowerCase(); rows=rows.filter(r=>(r.desc+' '+r.codigo+' '+r.id+' '+r.marca).toLowerCase().includes(q)); }
  const s=state.sortRep;
  if(s.k==='art'){
    // agrupado por artículo: primero los que más unidades bajan, y dentro de cada artículo
    // las sucursales por prioridad (así se arma de una sola pasada por el depósito)
    const tot={}; rows.forEach(r=>{ tot[r.id]=(tot[r.id]||0)+(r.sugerido||0); });
    rows.sort((a,b)=>((tot[b.id]-tot[a.id])||cmp(a.desc,b.desc)||cmp(a.id,b.id))*(s.dir<0?1:-1)
      || (a.prio||99)-(b.prio||99) || cmp(a.sucNombre,b.sucNombre));
  } else {
    rows.sort((a,b)=>{ const va=a[s.k],vb=b[s.k]; return (typeof va==='number'?va-vb:cmp(va,vb))*s.dir; });
  }
  return rows;
}
// Rótulos del membrete y sufijo del nombre de archivo a partir de los filtros.
function exportLabels(rubro, marca, extras){
  const stripNN = s => String(s||'').replace(/^\d+\s*[-–]\s*/,'');
  const rubroLbl = rubro ? stripNN(rubro).toUpperCase() : 'TODOS LOS RUBROS';
  const extra = (extras||[]).filter(Boolean).map(x=>stripNN(x).toUpperCase()).join(' · ');
  const marcaLbl = (marca ? String(marca).toUpperCase() : 'TODAS LAS MARCAS') + (extra?'  ·  '+extra:'');
  const part=(s)=> s? '-'+stripNN(s).replace(/[^A-Za-z0-9]+/g,'') : '';
  return { rubro:rubroLbl, marca:marcaLbl, file: part(rubro)+part(marca)+(extras||[]).map(part).join('') };
}

// Planilla "del depósito", compartida por Reposición y Completar curva:
// Código · Artículo · Descripción · Destino · [talles = cantidad a mandar] · columnas de la derecha.
// cfg = { hoja, titulo, subtitulo, resumen, rows, talles, celda(row,t)->{val,falta},
//         derecha:[{h, w?, val(row), total?, falta?(row)}], archivo }
async function exportPlanilla(cfg){
  if(typeof ExcelJS==='undefined'){ toast('ExcelJS no cargó; recargá la página','err'); return; }
  const {rows, talles, derecha}=cfg;
  const izq=['Código','Artículo','Descripción','Destino'];
  const headers=[...izq, ...talles, ...derecha.map(d=>d.h)];
  const nCols=headers.length; const LZ=izq.length;
  const wb=new ExcelJS.Workbook();
  const ws=wb.addWorksheet(cfg.hoja, {views:[{showGridLines:false}]});
  ws.columns=[{width:16},{width:12},{width:36},{width:20}, ...talles.map(()=>({width:8})), ...derecha.map(d=>({width:d.w||9}))];

  let r=1;
  ws.mergeCells(r,1,r,nCols);
  const tit=ws.getCell(r,1);
  tit.value={ richText:[
    {font:{bold:true,size:15,name:'Calibri',color:{argb:BRAND.navy}},text:cfg.titulo+'\n'},
    {font:{bold:true,size:11,name:'Calibri',color:{argb:BRAND.red}},text:cfg.subtitulo},
    {font:{size:9,name:'Calibri',color:{argb:BRAND.muted}},text:'   ·  Depósito Central  ·  Semana del '+lunesLabel(state.semana)} ]};
  tit.alignment={horizontal:'left',vertical:'middle',wrapText:true,indent:1};
  for(let c=1;c<=nCols;c++){ ws.getCell(r,c).fill={type:'pattern',pattern:'solid',fgColor:{argb:BRAND.white}}; ws.getCell(r,c).border={bottom:{style:'medium',color:{argb:BRAND.red}}}; }
  ws.getRow(r).height=38; r++;

  // fila de resumen opcional (Reposición no la lleva: pedido de Juli 07/09/2026)
  if(cfg.resumen){
    ws.mergeCells(r,1,r,nCols);
    const sub=ws.getCell(r,1);
    sub.value=cfg.resumen;
    sub.font={size:10,name:'Calibri',color:{argb:BRAND.navy}}; sub.alignment={horizontal:'left',vertical:'middle',indent:1};
    sub.fill={type:'pattern',pattern:'solid',fgColor:{argb:BRAND.band}};
    ws.getRow(r).height=20; r+=2;
  }

  const headerRowIdx=r;
  const esTalleCol = i => i>=LZ && i<LZ+talles.length;   // i base 0
  headers.forEach((h,i)=>{ const c=ws.getCell(r,i+1); c.value=h; c.font={bold:true,color:{argb:BRAND.white},size:i<LZ?10:11,name:'Calibri'};
    // header de talles con banda vertical alternada (para no confundir columnas)
    const fill = esTalleCol(i) ? ((i-LZ)%2===0?BRAND.navy:BRAND.navyMid) : BRAND.navy;
    c.fill={type:'pattern',pattern:'solid',fgColor:{argb:fill}}; c.alignment={horizontal:i<LZ?'left':'center',vertical:'middle'};
    const bd=thinBorder(BRAND.navy); if(i===LZ || i===LZ+talles.length) bd.left={style:'medium',color:{argb:BRAND.sep}}; c.border=bd; });
  ws.getRow(r).height=25; r++;

  // filas: fondo blanco y bordes finos en todas las celdas (pedido de Juli 07/09/2026; antes bandas alternadas + separadores gruesos)
  rows.forEach((row,i)=>{
    const bg=BRAND.white;
    // izquierda: Código (barras) · Artículo (ID ITEM) · Descripción · Destino
    [row.codigo||'', row.id, row.desc, row.sucNombre].forEach((v,idx)=>{ const c=ws.getCell(r,idx+1); c.value=(v===''?null:v);
      c.font={size:10,bold:true,name:'Calibri',color:{argb:BRAND.navy}}; c.alignment={horizontal:'left',vertical:'middle'};
      c.fill={type:'pattern',pattern:'solid',fgColor:{argb:bg}}; c.border=thinBorder(BRAND.border); });
    // talles = cantidad a mandar; rojo si la reserva no alcanza (lo decide cfg.celda).
    // Banda VERTICAL alternada por columna (no por fila) para que no se confundan los talles.
    talles.forEach((t,ti)=>{ const c=ws.getCell(r,LZ+ti+1); const d=cfg.celda(row,t);
      c.value = d.val;
      c.alignment={horizontal:'center',vertical:'middle'};
      c.border=thinBorder(BRAND.border);
      // rojo = no le va nada del talle; amarillo = va menos de lo pedido (Juli 11/09/2026)
      if(d.falta && !d.val){ c.font={size:11,bold:true,name:'Calibri',color:{argb:BRAND.faltaTxt}}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:BRAND.faltaBg}}; }
      else if(d.falta){ c.font={size:11,bold:true,name:'Calibri',color:{argb:BRAND.cortoTxt}}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:BRAND.cortoBg}}; }
      else { c.font={size:11,bold:true,name:'Calibri',color:{argb:BRAND.navy}}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:bg}}; }
    });
    // derecha: Total y las analíticas
    derecha.forEach((d,idx)=>{ const c=ws.getCell(r,LZ+talles.length+idx+1); const v=d.val(row); c.value=(v===''||v==null?null:v);
      c.alignment={horizontal:'center',vertical:'middle'};
      c.border=thinBorder(BRAND.border);
      const esFaltaCol=!!(d.falta && d.falta(row));
      c.font={size:10,bold:true,name:'Calibri',color:{argb:esFaltaCol?BRAND.faltaTxt:BRAND.navy}};
      c.fill={type:'pattern',pattern:'solid',fgColor:{argb:esFaltaCol?BRAND.faltaBg:bg}};
    });
    ws.getRow(r).height=25;   // todas las filas de datos a 25 (pedido de Juli 07/09/2026)
    r++;
  });

  // autofiltro en las columnas de identidad (Código..Destino); los talles quedan sin flecha.
  ws.autoFilter={ from:{row:headerRowIdx,column:1}, to:{row:headerRowIdx,column:LZ} };
  ws.views=[{state:'frozen', xSplit:LZ, ySplit:headerRowIdx, showGridLines:false}];
  // al imprimir, membrete + encabezados (incluida la fila de talles) se repiten arriba en TODAS las hojas
  // y las columnas de identidad Código..Destino a la izquierda (pedido de Juli 08/09/2026)
  ws.pageSetup={orientation:'landscape', fitToPage:true, fitToWidth:1, fitToHeight:0,
    printTitlesRow:'1:'+headerRowIdx, printTitlesColumn:'A:'+String.fromCharCode(64+LZ),
    margins:{left:0.3,right:0.3,top:0.4,bottom:0.4,header:0.2,footer:0.2}};
  await downloadWorkbook(wb, cfg.archivo);
  toast('Excel generado ✓','ok');
}

async function exportRepXlsx(){
  const R=state.resultado; if(!R) return;
  const f=state.filtros;
  const verRojos = f.verRojos || f.soloFaltante;   // igual que en pantalla
  const rows=reposFiltradas().filter(r=>r.vacFuera==null);   // las que quedaron afuera del vaciado no llevan nada
  if(!rows.length){ toast('No hay filas para exportar','err'); return; }
  // columnas de talle: las que se mandan y, solo si se piden, las que quedaron en cero;
  // más los talles de «Completar curva» y del vaciado.
  const set=new Set(); rows.forEach(r=>{ Object.entries(r.talles).forEach(([t,d])=>{ if(d.s>0 || (verRojos&&d.v>0&&d.s<d.v&&!esNuevoRet(d))) set.add(t); }); (r.curvaFaltan||[]).forEach(d=>{ if(d.s>0) set.add(d.t); }); (r.curvaEng||[]).forEach(d=>{ if(d.s>0) set.add(d.t); }); (r.vacFaltan||[]).forEach(d=>{ if(d.s>0) set.add(d.t); }); (r.ampTalles||[]).forEach(d=>{ if(d.s>0) set.add(d.t); }); });
  const talles=[...set].sort(cmpTalle);
  const lbl=exportLabels(f.rubro, f.marca, [f.tipoprod, f.discs.join('+'), f.subrubros.join('+')]);
  const uCurva=rows.reduce((a,x)=>a+(x.curvaU||0),0), uVac=rows.reduce((a,x)=>a+(x.vacU||0),0);
  const curvaS=(row,t)=>{ const d=(row.curvaFaltan||[]).find(x=>x.t===t), e=(row.curvaEng||[]).find(x=>x.t===t); return (d?d.s:0)+(e?e.s:0); };
  const vacS=(row,t)=>{ const d=(row.vacFaltan||[]).find(x=>x.t===t); return d?d.s:0; };
  const ampS=(row,t)=>{ const d=(row.ampTalles||[]).find(x=>x.t===t); return d?d.s:0; };
  const uAmp=rows.reduce((a,x)=>a+(x.ampU||0),0);
  await exportPlanilla({
    hoja: f.verSoloVac?'Vaciado':'Reposición',
    titulo: (f.verSoloVac?'VACIADO DE RESERVA ':'REPOSICIÓN ')+lbl.rubro,
    subtitulo: lbl.marca+(f.verSoloVac?'  ·  ARTÍCULOS CON HASTA '+state.filtrosVac.max+' UNIDADES EN EL DEPÓSITO':'')+(uCurva?'  ·  + COMPLETAR CURVA DE TALLES':'')+((uVac&&!f.verSoloVac)?'  ·  + VACIADO DE RESERVA CHICA':'')+(uAmp?'  ·  + ABRIR A MÁS SUCURSALES':''),
    // sin fila de resumen ni analíticas (Vendido…Categoría): la planilla del depósito lleva solo lo que hay que mandar
    rows, talles,
    // cantidad a mandar = reposición por venta + talles de curva + vaciado de esa sucursal
    // el 0 rojo del talle que no se puede reponer solo sale si se pidió verlo en pantalla
    celda:(row,t)=>{ const d=row.talles[t]; const sug=(d?d.s:0)+curvaS(row,t)+vacS(row,t)+ampS(row,t); const esFalta=!!(d&&d.v>0&&d.s<d.v&&verRojos&&!esNuevoRet(d)); return { val: sug>0?sug:(esFalta?0:null), falta:esFalta }; },
    derecha:[ {h:'Total',val:r=>r.sugerido,total:true} ],
    archivo:(f.verSoloVac?'vaciado-reserva':'reposicion')+lbl.file+'-'+state.semana+'.xlsx',
  });
}

/* ============================================================
   REPARTO INICIAL — pestaña aparte de la Barrida (pedido de Juli 10/09/2026)
   La Barrida de reserva repone lo VENDIDO con lo que hay en el depósito (reporte de stock +
   estadística de ventas). El Reparto inicial reparte lo que ENTRÓ: se alimenta de la
   estadística de remitos del sistema y sale REMITO POR REMITO, porque cada remito queda en
   una ubicación del depósito y el operario lo busca por ahí.
   Reglas (las seis de Juli):
     1. Solo lo que entró por los remitos elegidos, agrupado por remito.
     2. A quién y en qué orden: la marca tiene que estar en la Asignación de Marcas de la
        sucursal (calzado / indumentaria; «niño» solo para artículos de niño; si la marca
        tiene disciplinas, la del artículo tiene que estar) → tipo de asignación
        (principal > especial > secundaria) → categoría de la sucursal → venta de la marca en
        el rubro (último mes de Meses de Stock, en tres niveles: alta / media / baja) →
        meses de stock (menos = antes).
     3. Un artículo que entró en varios remitos se reparte JUNTO (una sola curva por
        sucursal) y a cada sucursal se le toman las unidades del remito que ya le está
        dando. Lo repartido se guarda (memoria): si el artículo vuelve a entrar, primero se
        les completa la curva a las que ya lo recibieron.
     4-5. Talles centrales (tabla CENTRALES_DEF, editable): 2 unidades (3 si alcanza); el
        resto de los talles, 1.
     6. Queda en el depósito ~1 curva: 1 unidad de cada talle que tenga 2 o más.
   El export de remitos NO trae talles: cada artículo se abre con la curva que tiene hoy en
   la reserva del depósito (el reporte de stock de la Barrida), repartida entre sus remitos
   según las unidades de cada uno. Si el sistema lo exporta abierto por talle, se usan esos.
   Firebase (recepciones-mateu, nodo barrida/): repartos/<fecha_hora> = {meta, remitos, porSuc},
   remitosRepartidos/<nro> = {rep, fecha, por}, repartoHist/<idItem>/<slug> = {t:[[talle,q]], ts, rep}
   y repartoConfig/centrales.
   ============================================================ */
const REP_SUC = Object.assign({}, SLUG_SUC, SUC_EXTRA, OUTLET_SUC);
const nombreSuc = slug => REP_SUC[slug]||slug;
const REP_MEM_DIAS = 120;
const REP_SUC_DIAS = 60;                   // cuánto queda en Mi Sucursal / Picking lo repartido                  // la memoria de envíos vale 4 meses
const REP_PREFS = 'barrida_reparto_prefs';
const MESES_ES = ['','Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const RX_REMITO = /^\d{4}-\d{6,}$/;
const sinAcento = s => String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'');
const normMarca = s => sinAcento(s).toLowerCase().replace(/[^a-z0-9]/g,'');
const repKey = s => String(s==null?'':s).trim().replace(/[.#$\[\]\/]/g,'_') || '_';   // clave Firebase
const repNroCorto = nro => { if(nro===REP_NUEVO) return 'Sin remito'; const p=String(nro||'').split('-').pop().replace(/^0+/,''); return p||String(nro||''); };
const sumT = t => Object.values(t||{}).reduce((a,q)=>a+(q>0?q:0),0);
const paresT = t => Object.keys(t||{}).filter(k=>t[k]>0).sort(cmpTalle).map(k=>[k,t[k]]);
const deParesT = p => { const o={}; (p||[]).forEach(x=>{ if(x&&x.length>=2&&num(x[1])>0) o[String(x[0])]=(o[String(x[0])]||0)+num(x[1]); }); return o; };
// talle normalizado para comparar ("10.0" = "10", "8,5" = "8.5")
function nrmT(t){ const s=sinAcento(t).toUpperCase().replace(/\s+/g,'').replace(/,/g,'.'); const n=Number(s); return (s!==''&&isFinite(n))?String(n):s; }
// número de celda: 50.00 · 1,00 · 1.075.241,48
function numR(v){ if(typeof v==='number') return isFinite(v)?v:0; let s=String(v==null?'':v).trim(); if(!s) return 0; if(/,\d{1,3}$/.test(s)) s=s.replace(/\./g,'').replace(',','.'); const n=parseFloat(s); return isFinite(n)?n:0; }

/* ---------- talles centrales ----------
   Pedido de Juli: indumentaria dama S-M, hombre M-L, niño 10-12; calzado dama 37-38 AR y hombre
   41-42 AR (con los medios talles). En una misma lista van los rótulos AR y sus equivalentes:
   no se pisan (el calzado adulto en escala US va de 3 a 13, el AR de 34 a 46). Los US salen de
   la tabla de talles US Men / US Women / AR (la de New Balance, que Juli aplicó a todas el
   15/09/2026): el calzado de DAMA rotula US Women → 7 · 7.5 · 8 (= AR 37 a 38.5); el HOMBRE y
   el UNISEX rotulan US Men → hombre 8.5 · 9 · 9.5 (= AR 41 a 42) y la dama dentro de la curva
   unisex 5.5 · 6 · 6.5 (= AR 37 a 38.5). Puma rotula en UK (dama 4.5 a 5.5, hombre 8 a 9).
   Indumentaria unisex vende como hombre (M y L). Sin regla (calzado niño/unisex/infante): los 2 talles del medio del
   artículo. Accesorios: 1 por talle, sin centrales. Se edita en pantalla («Talles centrales»). */
const CENTRALES_DEF = {
  'calz-dama':        ['37','37.5','38','7','7.5','8'],        // US Women (Juli 15/09/2026)
  'calz-unisex-dama': ['37','37.5','38','5.5','6','6.5'],      // dama dentro de una curva unisex: US Men (Juli 15/09/2026)
