<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Análisis de Reserva — Depósito Central · Mateu Sports</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B1527;--navy-mid:#1a2f55;--navy-soft:#13203a;
  --red:#CC0000;--red-soft:#ff3b3b;
  --white:#fff;--off:#f5f7fc;--muted:#6B7A99;--muted-light:#b0bcd4;
  --card:#fff;--border:#dce3f0;
  --ok:#16a34a;--warn:#d97706;--bad:#dc2626;--exc:#7c3aed;
  --font-d:'Bebas Neue',sans-serif;--font-c:'Barlow Condensed',sans-serif;--font-b:'Barlow',sans-serif;
  --shadow:0 1px 4px rgba(11,21,39,.08);--shadow-md:0 8px 30px rgba(11,21,39,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--off);color:var(--navy);font-family:var(--font-b);min-height:100vh}
img,svg{max-width:100%}

/* ===== HEADER ===== */
.top{background:var(--navy);padding:12px 22px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:3px solid var(--red);position:sticky;top:0;z-index:40;flex-wrap:wrap;gap:10px}
.top a.logo{display:flex;align-items:center;gap:11px;text-decoration:none;min-width:0}
.top img{height:32px;filter:brightness(0) invert(1)}
.top .tt{font-family:var(--font-d);font-size:19px;letter-spacing:1.5px;color:#fff;line-height:1}
.top .ts{font-family:var(--font-c);font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--muted-light)}
.top-right{display:flex;align-items:center;gap:12px;margin-left:auto}
.who{text-align:right;line-height:1.1}
.who .n{font-family:var(--font-c);font-size:13px;font-weight:600;color:#fff;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .r{font-family:var(--font-c);font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--red-soft)}
.salir{background:transparent;border:1px solid rgba(255,255,255,.25);border-radius:6px;color:rgba(255,255,255,.7);
  font-family:var(--font-c);font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:7px 13px;cursor:pointer}
.salir:hover{color:#fff;border-color:#fff}

/* ===== NAV TABS ===== */
.tabs{background:#fff;border-bottom:1px solid var(--border);padding:0 22px;display:flex;gap:4px;overflow-x:auto;position:sticky;top:var(--msh-h,67px);z-index:30}
.tab{padding:13px 16px;border:0;background:none;cursor:pointer;font-family:var(--font-c);font-size:14px;font-weight:600;
  letter-spacing:.5px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--navy);border-bottom-color:var(--red)}
.tab:hover{color:var(--navy)}
.tab:focus-visible{outline:2px solid var(--red);outline-offset:-2px}
.tab .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:10px;background:#e6ebf5;
  color:var(--navy-mid);font-family:var(--font-b);font-size:11px;font-weight:700;line-height:18px;text-align:center}
.tab.on .badge{background:var(--red);color:#fff}

main{max-width:1200px;margin:0 auto;padding:22px 22px 80px}

.banner{border-radius:9px;padding:10px 14px;font-size:13px;margin-bottom:16px}
.banner.warn{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412}
.banner.info{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af}
.banner code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:4px;font-size:12px}

/* ===== CONTROLES ===== */
.sel,.inp{padding:9px 11px;border:1px solid var(--border);border-radius:7px;font-size:14px;color:var(--navy);background:#fff;font-family:var(--font-b)}
.sel:focus,.inp:focus{outline:none;border-color:var(--navy-mid)}
.btn{border:none;border-radius:8px;padding:10px 16px;font-family:var(--font-c);font-size:13px;font-weight:700;
  letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--red);color:#fff}.btn-primary:hover{background:#a00000}
.btn-outline{background:#fff;border:1.5px solid var(--border);color:var(--navy)}.btn-outline:hover{border-color:var(--navy-mid)}
.btn-sm{padding:6px 11px;font-size:11px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.sel:focus-visible,.inp:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* ===== CARDS ===== */
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sec-head h1{font-family:var(--font-d);font-size:30px;letter-spacing:1px;line-height:1}
.sec-head .sub{font-family:var(--font-c);font-size:13px;font-weight:500;color:var(--muted);margin-top:2px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.card-h{font-family:var(--font-d);font-size:20px;letter-spacing:.5px;margin-bottom:2px}
.card-hs{font-family:var(--font-c);font-size:12px;color:var(--muted);margin-bottom:14px}

/* ===== DROPZONE ===== */
.drop{border:2px dashed var(--border);border-radius:12px;padding:26px;text-align:center;background:#fff;cursor:pointer;transition:all .15s}
.drop.over{border-color:var(--red);background:#fff5f5}
.drop .ic{font-size:34px}
.drop .t{font-family:var(--font-c);font-weight:600;font-size:15px;margin-top:6px}
.drop .s{font-size:12.5px;color:var(--muted);margin-top:3px}
.filechip{display:inline-flex;align-items:center;gap:8px;background:#eef2fb;border:1px solid var(--border);border-radius:20px;
  padding:5px 12px;font-family:var(--font-c);font-size:12.5px;font-weight:600;color:var(--navy-mid);margin:4px 4px 0 0}
.filechip .ok{color:var(--ok)}.filechip .no{color:var(--bad)}

/* ===== KPIs ===== */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:11px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi.rep{border-left:4px solid var(--ok)}
.kpi.par{border-left:4px solid var(--warn)}
.kpi .k{font-family:var(--font-c);font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--font-d);font-size:32px;letter-spacing:.5px;margin-top:4px;line-height:1}
.kpi .v small{font-size:14px;color:var(--muted);font-family:var(--font-c)}

/* ===== SEGMENTADO (selector de sección) ===== */
.segbar{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 18px}
.segbar button{border:1.5px solid var(--border);background:#fff;border-radius:10px;padding:9px 14px;cursor:pointer;
  font-family:var(--font-c);font-size:13.5px;font-weight:600;color:var(--navy-mid);display:flex;align-items:center;gap:7px;transition:all .12s}
.segbar button:hover{border-color:var(--navy-mid)}
.segbar button .n{font-family:var(--font-b);font-size:12px;font-weight:700;background:#eef2fb;border-radius:10px;padding:1px 8px;color:var(--navy-mid)}
.segbar button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.segbar button.on .n{background:rgba(255,255,255,.22);color:#fff}
.segbar button:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* ===== FILTROS ===== */
.filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.fgrp{display:flex;flex-direction:column;gap:4px;min-width:120px}
.fgrp label{font-family:var(--font-c);font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
/* filtro de selección múltiple (Subrubro/género) */
.msel{position:relative}
.msel>summary{list-style:none;cursor:pointer;background:#fff;border:1px solid var(--border);border-radius:7px;
  padding:9px 28px 9px 11px;font-size:14px;color:var(--navy);min-width:120px;white-space:nowrap;position:relative;font-family:var(--font-b)}
.msel>summary::-webkit-details-marker{display:none}
.msel>summary::after{content:'▾';position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:11px}
.msel[open]>summary{border-color:var(--navy-mid)}
.msel-pop{position:absolute;z-index:40;top:calc(100% + 4px);left:0;background:#fff;border:1px solid var(--border);
  border-radius:10px;box-shadow:0 10px 26px rgba(11,21,39,.16);padding:8px;min-width:200px;max-height:280px;overflow:auto}
.msel-it{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.msel-it:hover{background:#f2f5fb}
.msel-acc{display:flex;gap:6px;border-top:1px solid var(--border);margin-top:6px;padding-top:8px}
.msel-acc button{flex:1;background:#fff;border:1px solid var(--border);border-radius:7px;padding:5px 8px;
  font-family:var(--font-c);font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;color:var(--navy)}
.msel-acc button:hover{border-color:var(--navy-mid)}
.msel-empty{font-size:12.5px;color:var(--muted);padding:6px 8px;max-width:230px;white-space:normal;line-height:1.4}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--navy-mid);cursor:pointer;user-select:none}
/* ===== PANEL DE FILTROS DE REPOSICIÓN (08/09/2026) =====
   Antes eran 6 selects + 5 tildes + el botón de Excel todos sueltos en la misma línea.
   Ahora: una tarjeta con dos filas (arriba QUÉ MIRAR, abajo QUÉ MOSTRAR / QUÉ SUMAR),
   chips con los filtros puestos y la explicación de la tabla en un desplegable. */
.fpanel{background:#fff;border:1px solid var(--border);border-radius:11px;padding:11px 14px 12px;margin-bottom:12px}
.fpanel .frow{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.fpanel .frow+.frow{margin-top:11px;padding-top:11px;border-top:1px solid #eef0f7;align-items:center}
.fgrupo{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.fgrupo>.glab{font-family:var(--font-c);font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.fsep{width:1px;align-self:stretch;background:#e6eaf4;margin:0 4px}
.fchips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:-4px 0 12px}
.fchips .glab{font-family:var(--font-c);font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.fchip{display:inline-flex;align-items:center;gap:7px;background:#eef2fb;color:var(--navy);border-radius:20px;padding:3px 5px 3px 11px;font-size:12.5px}
.fchip i{font-style:normal;font-family:var(--font-c);font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.fchip button{border:0;background:#dbe3f4;color:var(--navy-mid);width:17px;height:17px;border-radius:50%;cursor:pointer;line-height:16px;font-size:11px;padding:0}
.fchip button:hover{background:var(--red);color:#fff}
/* bloques de parámetros de Completar curva / Vaciar la reserva chica */
.fmodo{border-radius:10px;padding:9px 13px;margin:-4px 0 12px;display:flex;gap:10px 16px;flex-wrap:wrap;align-items:flex-end}
.fmodo>.mtit{font-family:var(--font-c);font-size:12px;font-weight:700;letter-spacing:.4px;align-self:center}
.fmodo .mres{font-size:12.5px;color:var(--navy-mid);align-self:center;flex:1;min-width:200px}
.fmodo.verde{background:#eafaf0;border:1px solid #cdeedb} .fmodo.verde .mtit{color:#127a3a}
.fmodo.azul{background:#eef3fc;border:1px solid #cfdcf3}  .fmodo.azul .mtit{color:#1e40af}
/* explicación de la tabla, plegable (se recuerda en localStorage) */
.ayuda{margin:0 0 12px}
.ayuda>summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-family:var(--font-c);
  font-size:12px;font-weight:600;letter-spacing:.3px;color:var(--navy-mid);background:#eef2fb;border-radius:20px;padding:5px 13px}
.ayuda>summary::-webkit-details-marker{display:none}
.ayuda>summary::before{content:'?';display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;
  border-radius:50%;background:var(--navy);color:#fff;font-size:10px;font-weight:700}
.ayuda[open]>summary{margin-bottom:8px}
/* tira de resumen arriba de la tabla: qué quedó después de filtrar */
.resu{display:flex;gap:8px 20px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--navy-mid);
  background:#f6f8fd;border:1px solid var(--border);border-radius:9px;padding:8px 13px;margin-bottom:8px}
.resu b{font-family:var(--font-b);font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
.resu .c-curva b{color:#127a3a} .resu .c-vac b{color:#1e40af} .resu .c-falta,.resu .c-falta b{color:var(--bad)}
.resu small{font-size:12px;color:var(--muted)}
.resu .c-cero b{color:#1e40af}
.resu .c-rep b{color:#92400e}
.resu .c-env b{color:#127a3a}
.env-ok,.env-par,.env-no,.env-ex{display:inline-block;padding:2px 8px;border-radius:20px;font-weight:800;font-variant-numeric:tabular-nums;font-size:12.5px}
.env-ok{background:#eafaf0;color:#127a3a} .env-par{background:#fef3c7;color:#92400e}
.env-no{background:#fdeaea;color:var(--bad)} .env-ex{background:#eef2fb;color:var(--navy-mid)}
.queda{color:var(--muted)} .queda.cero{color:#1e40af;font-weight:800}

/* ===== TABLAS ===== */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:11px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:680px}
th{background:var(--navy);color:#fff;font-family:var(--font-c);font-weight:600;letter-spacing:.5px;padding:9px 11px;text-align:left;white-space:nowrap;position:sticky;top:0;cursor:pointer}
th.num,td.num{text-align:right}
th.noord{cursor:default}
td{padding:8px 11px;border-bottom:1px solid #eef0f7;vertical-align:middle}
tbody tr:hover td{background:#f8f9fe}
.mono{font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-family:var(--font-c);font-size:11px;font-weight:700;letter-spacing:.4px}
.pill.rec{background:#eff6ff;color:#1e40af}
.pill.cron{background:#fef2f2;color:#b91c1c}
.pill.suc{background:#eef2fb;color:var(--navy-mid)}
.pill.falta{background:#fef2f2;color:#b91c1c}
.pill.curva{background:#eafaf0;color:#127a3a}
.pill.vac{background:#e6eefb;color:#1e40af}
.pill.rep2{background:#fef3c7;color:#92400e}
.talles{font-size:12px;color:var(--muted);font-family:var(--font-c)}
/* Un casillero por talle: arriba el talle, en grande CUÁNTAS unidades van, abajo el
   porqué (cuántas hay en reserva, o cuántas pedía si no alcanzó). Rediseñado el
   08/09/2026: antes era una línea "41 1/13" en la que no se sabía qué era cada número. */
.tgx{display:inline-flex;flex-direction:column;align-items:stretch;text-align:center;vertical-align:top;
  min-width:46px;margin:2px 5px 2px 0;border:1px solid #e2e8f3;border-radius:8px;overflow:hidden;background:#fff}
.tgx .txl{background:#eef2fb;color:var(--navy);font-family:var(--font-c);font-size:11px;font-weight:700;
  letter-spacing:.4px;padding:1px 6px;border-bottom:1px solid #e2e8f3;white-space:nowrap}
/* rotación del talle en su rubro: fuerte = rótulo navy pleno · medio = el neutro · flojo = apagado */
.tgx.n-fuerte .txl{background:var(--navy);color:#fff;border-bottom-color:var(--navy)}
.tgx.n-flojo .txl{background:#f4f6fa;color:var(--muted-light)}
.tgx .txn{font-family:var(--font-b);font-size:15px;font-weight:800;color:#127a3a;line-height:1.15;padding-top:2px;font-variant-numeric:tabular-nums}
.tgx .txr{font-family:var(--font-c);font-size:9.5px;font-weight:600;color:var(--muted-light);padding:0 4px 2px;white-space:nowrap}
.tgx.rec{border-color:#f3c9c9}                        /* la reserva no alcanzó: recibe menos de lo que pidió */
.tgx.rec .txl{background:#fdeaea;color:var(--bad);border-bottom-color:#f3c9c9}
.tgx.rec .txn,.tgx.rec .txr{color:var(--bad)}
.tgx.hueco{border-color:#bfe6cf}                      /* completar curva: talle que la sucursal no tiene */
.tgx.hueco .txl{background:#eafaf0;color:#127a3a;border-bottom-color:#bfe6cf}
.tgx.vac{border-color:#bcd2f2}                       /* vaciar la reserva chica: baja todo lo que queda */
.tgx.vac .txl{background:#e6eefb;color:#1e40af;border-bottom-color:#bcd2f2}
.tgx.vac .txn{color:#1e40af}
.tgx.off{opacity:.55}
.tgx.off .txn{color:var(--muted-light);font-size:12px;padding-top:4px}
.sug-badge{display:inline-block;min-width:34px;padding:2px 9px;border-radius:20px;background:#eafaf0;color:#127a3a;font-weight:800;font-variant-numeric:tabular-nums}
.sug-badge.zero{background:#f1f4fa;color:var(--muted-light)}
.kpi.cur{border-left:4px solid #127a3a}
.lnk{border:0;background:none;color:var(--navy-mid);font-family:var(--font-c);font-size:12px;font-weight:600;cursor:pointer;text-decoration:underline;padding:0 2px}
.filechip small{color:var(--muted);font-weight:400}
/* tarjeta de carga compacta (arriba de Reposición) */
.carga{padding:12px 16px;margin-bottom:14px}
.carga.over{outline:2px dashed var(--red);outline-offset:-4px}
.carga-row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}
.cbtn{display:flex;flex-direction:column;gap:3px;min-width:0}
.cfile{font-size:11.5px;color:var(--navy);max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cfile.muted{color:var(--muted-light)}
.cfile .ok{color:var(--ok);font-weight:700}
.carga-res{margin-top:10px;font-size:13px;color:var(--navy);line-height:1.6}
.carga-res.muted{color:var(--muted)}
.carga-res .sep{color:var(--muted-light);margin:0 10px}
.carga-res .ok{color:var(--ok);font-weight:700}.carga-res .warn{color:var(--warn);font-weight:700}.carga-res .muted{color:var(--muted)}
.desc{max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* en Reposición el nombre se recorta solo, para que los chips (piso medias · solo curva ·
   solo vaciado · ⚠ falta) queden siempre a la vista */
.desc.rep{max-width:360px;overflow:visible;text-overflow:clip}
.desc.rep .dtxt{display:inline-block;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.grp-suc{background:#eef2fb;font-family:var(--font-c);font-weight:700;color:var(--navy-mid);letter-spacing:.5px}

/* ===== ESTADOS ===== */
.state{text-align:center;padding:52px 20px;color:var(--muted)}
.state .big-ic{font-size:40px;margin-bottom:10px}
.state.err{color:var(--bad)}
.spinner{width:26px;height:26px;border:3px solid #e6ebf5;border-top-color:var(--red);border-radius:50%;
  display:inline-block;animation:spin .7s linear infinite;margin-bottom:10px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== HISTÓRICO ===== */
.histrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--border);
  border-radius:10px;background:#fff;margin-bottom:9px}
.histrow .hl{font-family:var(--font-c);font-weight:700;font-size:15px;color:var(--navy)}
.histrow .hs{font-size:12.5px;color:var(--muted)}

/* ===== TOAST ===== */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;
  padding:11px 18px;border-radius:9px;font-size:13.5px;box-shadow:var(--shadow-md);opacity:0;pointer-events:none;transition:all .25s;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:#166534}.toast.err{background:#991b1b}

@media(max-width:640px){ .sec-head h1{font-size:24px} .kpi .v{font-size:26px} }
</style>
<!-- Iconos SVG (reemplazan emojis que Windows 7 / navegadores viejos no dibujan) -->
<script src="../shared/marca.js"></script>
<script src="../shared/iconos.js" defer></script>
<!-- Header unificado del shell: barra Menú + logo + calendario retail + drawer -->
<script src="../shared/header.js" defer></script>
<script src="../shared/tutorial.js" defer></script>
</head>

<!-- SheetJS (leer el Excel) + ExcelJS (exportar con estilo, como el OC de Managment) -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script>
/* ============================================================
   Barrida de Reserva — módulo self-contained del Portal.
   Cruza la RESERVA del depósito central con las VENTAS de la semana
   abiertas por sucursal (dos hojas de un mismo Excel, o dos archivos)
   y genera tres alertas:
     • REPOSICIÓN  — artículo con reserva Y venta en una sucursal.
     • RESERVA PARADA — artículo con reserva y CERO venta en todas las sucursales.
     • COMPLETAR CURVA — (con la hoja opcional de STOCK por sucursal, abierto por
       talle) la sucursal tiene el artículo en algunos talles pero le faltan otros
       que SÍ hay en la reserva del depósito. La reserva de cada talle se reparte
       con prioridad a la sucursal que más vendió el artículo esa semana.
   Se corre semana a semana (típicamente los lunes). El histórico se
   guarda en Firebase (base barrida-mateu) como el resto del portal.
   Lee la sesión del Portal (localStorage), sin login propio.
   El cruce se calcula en el cliente; el Excel se parsea con SheetJS (CDN).
   ============================================================ */
'use strict';
const $ = id => document.getElementById(id);

/* ---------- Firebase ----------
   Reusa la base del Depósito Central (recepciones-mateu, ya existe y con reglas
   abiertas). Los datos de la barrida viven en un nodo aparte `barrida/…`, sin
   tocar el árbol `recepciones/…`. Vacío => MODO SIN BASE (carga y ve, no guarda). */
const FIREBASE_DB_URL = 'https://recepciones-mateu-default-rtdb.firebaseio.com';
const ROOT = 'barrida';   // rama raíz de la barrida dentro de la base

/* ---------- sesión ---------- */
const SESSION_KEY = 'mateu_portal_session';
function readSession(){ try{ const s=localStorage.getItem(SESSION_KEY); return s?JSON.parse(s):null; }catch(e){ return window.__sess||null; } }
const SESSION = readSession();
if(!SESSION || !SESSION.rol){ location.replace('../'); }
// La barrida la corre el depósito / gerencia. Las sucursales ven su aviso en Indicadores.
const puedeVer = SESSION && (SESSION.rol==='admin' || (SESSION.herramientas||[]).includes('barrida'));
if(SESSION && SESSION.rol && !puedeVer){ location.replace('../'); }

/* ---------- mapa nombre de sucursal (dato) -> slug del Portal ----------
   Mismo criterio que Indicadores; el Depósito no es destino de reposición. */
const SLUG_SUC = {
  'calle-12':'12-MS Calle 12','city-bell':'06-MS City Bell','calle-47':'08-MS Calle 47',
  'calle-49':'19-MS Calle 49','los-hornos':'13-MS Los Hornos','plaza':'01-MS Plaza Italia',
  'berisso':'16-MS Berisso','ensenada':'11-MS Ensenada','kids':'02-Mateu Kids',
  'aurelius-12':'04-Aurelius Calle 12','aurelius-5':'18-Aurelius Calle 5','aurelius-cb':'17-Aurelius City Bell',
  'adidas-12':'21-Adidas Calle 12','adidas':'09-Adidas Av. 7','originals':'15-Adidas Originals',
  'ecommerce':'99-Ecommerce',
};
const OUTLET_SUC = {
  'gonnet':'14-Outlet Gonnet','av-44':'20-Outlet Av. 44','calle-55':'03-Outlet Calle 55','aurelius-10':'07-Aurelius Calle 10',
};
// nombre normalizado -> {slug, nombre}
const NAME2SLUG = {};
function normName(s){ return String(s||'').trim().toLowerCase().replace(/\s+/g,' '); }
Object.entries(SLUG_SUC).forEach(([slug,n])=>NAME2SLUG[normName(n)]={slug,nombre:n});
Object.entries(OUTLET_SUC).forEach(([slug,n])=>NAME2SLUG[normName(n)]={slug,nombre:n});

/* ---------- Regla de reposición: medias Mateu Sports ----------
   Mínimo por talle vendido (docenas → unidades). Se identifican por marca
   "Mateu Sports" + rubro "Accesorios" + tipo/grupo "Medias". Para el/los talle(s)
   que la sucursal VENDIÓ, "A reponer" = mín(reserva, mínimo del talle) — se repone
   el mínimo aunque haya vendido menos; los talles NO vendidos no se tocan. Objetivo:
   sostener un stock mínimo por talle y sucursal en los talles con rotación. */
const MEDIAS_MIN = { S:12, M:24, L:36, XL:12 };   // 1/2/3/1 docenas
function esMediaMateu(meta){
  if(!meta) return false;
  const t = normName(meta.tipo), r = normName(meta.rubro), m = normName(meta.marca);
  return m.includes('mateu') && r.includes('accesorio') && /\bmedias?\b/.test(t);
}
// mínimo del talle (0 si el talle no está en la tabla → cae al cálculo normal)
function mediasMin(label){ return MEDIAS_MIN[String(label).toUpperCase().trim()] || 0; }

/* ---------- Prioridad de reposición (regla de Juli 07/09/2026) ----------
   Cuando la reserva de un talle NO alcanza para todas las sucursales que lo piden, se
   define a quién va (y no queda en duda) con tres parámetros, en este orden:
     1. VENDIDO — la sucursal que más vendió el artículo esta semana va primero
        (empate: la que más vendió ESE talle);
     2. MESES DE STOCK de la sucursal en la marca-rubro (gestion-stock/datos-meses-stock.js,
        último mes cargado; si la marca no tiene dato, el rubro): menos meses = más
        necesidad → antes; sin dato, después;
     3. CATEGORÍA de la sucursal (Asignación de Marcas): cat1 > cat2 = aurelius = adidas > outlet.
   Las fuentes se cargan al procesar (best-effort): si una falla, ese parámetro no desempata.
   El mismo orden se usa para repartir los talles de «Completar curva». */
const FB_MARCAS = 'https://asignacion-marcas-mateu-default-rtdb.firebaseio.com/asignacion_marcas.json';
// slug del Portal -> id de la sucursal en Asignación de Marcas (copia de pedidos-semanales)
const SLUG2MARCAS = {
  'calle-12':'ms-c12','city-bell':'ms-cb','diagonal':'ms-d80','calle-47':'ms-c47','calle-49':'ms-c49',
  'los-hornos':'ms-lh','plaza':'ms-pi','berisso':'ms-ber','ensenada':'ms-ens','kids':'ms-kids','ecommerce':'ms-ecom',
  'aurelius-12':'aur-c12','aurelius-5':'aur-c5','aurelius-10':'aur-c10','aurelius-cb':'aur-cb',
  'adidas-12':'adi-c12','adidas':'adi-7','originals':'adi-ori',
  'gonnet':'out-gon','av-44':'out-44','calle-55':'out-55',
};
// respaldo si la base de marcas no responde (semilla de marcas/index.html al 07/09/2026)
const CAT_SEED = {
  'calle-12':'cat1','city-bell':'cat1','calle-47':'cat1','diagonal':'cat1','kids':'cat1','ecommerce':'cat1',
  'los-hornos':'cat2','plaza':'cat2','berisso':'cat2','ensenada':'cat2','calle-49':'cat2',
  'aurelius-12':'aurelius','aurelius-5':'aurelius','aurelius-10':'aurelius','aurelius-cb':'aurelius',
  'adidas-12':'adidas','adidas':'adidas','originals':'adidas',
  'gonnet':'outlet','av-44':'outlet','calle-55':'outlet',
};
const CAT_RANK = { cat1:1, cat2:2, aurelius:2, adidas:2, outlet:3 };
const CAT_LABEL = { cat1:'Cat. 1', cat2:'Cat. 2', aurelius:'Aurelius', adidas:'Adidas', outlet:'Outlet' };
const PRIO = { stock:null, stockMes:'', cats:null, catsOrigen:'', cargado:false };
const conTimeout=(p,ms)=>Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]);
// meses de stock: el dataset pesa ~3 MB, se trae recién al procesar (una vez por sesión)
function cargarStockData(){
  if(PRIO.stock) return Promise.resolve(PRIO.stock);
  if(window.STOCK_DATA){ PRIO.stock=window.STOCK_DATA; return Promise.resolve(PRIO.stock); }
  return new Promise((res,rej)=>{
    const s=document.createElement('script'); s.src='../gestion-stock/datos-meses-stock.js?v='+Date.now();
    s.onload=()=>{ PRIO.stock=window.STOCK_DATA||null; if(PRIO.stock){ const m=PRIO.stock.meses||[]; PRIO.stockMes=(m[m.length-1]||'')+(PRIO.stock.anio?' '+PRIO.stock.anio:''); } res(PRIO.stock); };
    s.onerror=()=>rej(new Error('no se pudo cargar datos-meses-stock.js'));
    document.head.appendChild(s);
  });
}
async function cargarCategorias(){
  if(PRIO.cats) return PRIO.cats;
  try{
    const r=await conTimeout(fetch(FB_MARCAS),6000); if(!r.ok) throw new Error('HTTP '+r.status);
    const val=await r.json(); const data=val&&(val.data||val); const byId={};
    Object.values(data||{}).forEach(canal=>{ (canal&&Array.isArray(canal.sucursales)?canal.sucursales:[]).forEach(s=>{ if(s&&s.id&&s.cat) byId[s.id]=s.cat; }); });
    const cats={}; Object.entries(SLUG2MARCAS).forEach(([slug,id])=>{ if(byId[id]) cats[slug]=byId[id]; });
    if(Object.keys(cats).length){ PRIO.cats=Object.assign({},CAT_SEED,cats); PRIO.catsOrigen='Asignación de Marcas'; return PRIO.cats; }
    throw new Error('vacío');
  }catch(e){ PRIO.cats=Object.assign({},CAT_SEED); PRIO.catsOrigen='respaldo del código'; return PRIO.cats; }
}
async function cargarPrioridad(){
  await Promise.all([ cargarStockData().catch(()=>null), cargarCategorias() ]);
  PRIO.cargado=true;
}
const stripNN = s => String(s||'').replace(/^\d+\s*[-–]\s*/,'').trim();
// meses de stock de la sucursal en la marca-rubro (último mes cargado); null sin dato
function mesesStockDe(slug, marca, rubro){
  const D=PRIO.stock; if(!D||!D.sucursales) return null;
  const suc=D.sucursales[SLUG_SUC[slug]||OUTLET_SUC[slug]||'']; if(!suc||!suc.rubros) return null;
  const rk=stripNN(rubro).toUpperCase(); const R=suc.rubros[rk]; if(!R) return null;
  const ult=(D.meses||[])[(D.meses||[]).length-1]; if(!ult) return null;
  const ok = x => x && isFinite(x.ratio) && x.ratio>=0 && x.ventas>0;
  const mk=normName(marca); const mkey=Object.keys(R.marcas||{}).find(k=>normName(k)===mk);
  const M=mkey?R.marcas[mkey]:null;
  if(M && M.serie && ok(M.serie[ult])) return { ms:M.serie[ult].ratio, nivel:'marca' };
  if(R.serie && ok(R.serie[ult])) return { ms:R.serie[ult].ratio, nivel:'rubro' };
  return null;
}
function catDe(slug){ return (PRIO.cats||CAT_SEED)[slug]||''; }
function prioInfo(slug, marca, rubro){
  const m=mesesStockDe(slug, marca, rubro), c=catDe(slug);
  return { ms: m?Math.round(m.ms*10)/10:null, msNivel: m?m.nivel:'', cat:c, catRank: CAT_RANK[c]||9 };
}
// orden de prioridad (menor = antes): vendido del artículo ↓ · vendido del talle ↓ ·
// meses de stock ↑ (sin dato al final) · categoría (cat1 primero) · stock del artículo ↓ · nombre
function cmpPrioridad(a,b){
  if((b.vendido||0)!==(a.vendido||0)) return (b.vendido||0)-(a.vendido||0);
  if((b.vendTalle||0)!==(a.vendTalle||0)) return (b.vendTalle||0)-(a.vendTalle||0);
  const ma=(a.pr&&a.pr.ms!=null)?a.pr.ms:Infinity, mb=(b.pr&&b.pr.ms!=null)?b.pr.ms:Infinity;
  if(ma!==mb) return ma-mb;
  const ca=a.pr?a.pr.catRank:9, cb=b.pr?b.pr.catRank:9;
  if(ca!==cb) return ca-cb;
  if((b.enSucursal||0)!==(a.enSucursal||0)) return (b.enSucursal||0)-(a.enSucursal||0);
  return cmp(a.sucNombre,b.sucNombre);
}
// texto corto de los parámetros de prioridad de una fila (para tooltips y export)
function prioTxt(r){
  const p=r.pr||{}; const ms = p.ms!=null ? p.ms.toLocaleString('es-AR')+' meses de stock'+(p.msNivel==='rubro'?' (rubro)':'') : 'sin meses de stock';
  return 'vendió '+fmtInt(r.vendido||0)+' · '+ms+' · '+(CAT_LABEL[p.cat]||'sin categoría');
}
// La misma sucursal ya tenía este artículo en la barrida anterior: o no se ejecutó el envío,
// o el artículo rota fuerte y hay que recomprarlo. Devuelve las unidades de aquella vez.
function repiteDe(r){ const P=state.resultado&&state.resultado.previa; return P? (P.map[r.id+'|'+r.slug]||0) : 0; }
const faltaEn = r => Object.values(r.talles||{}).some(d=>d.v>0 && d.s<d.v);   // algún talle recortado (la reserva no alcanzó)
// recortada por el REPARTO (había reserva del talle pero se la llevó otra sucursal con más prioridad);
// distinto de «sin reserva» (r=0), que es señal de recompra a la marca
const recortadaPorPrio = r => Object.values(r.talles||{}).some(d=>d.v>0 && d.r>0 && d.s<d.v);

/* ---------- helpers ---------- */
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const num = x => { const n=Number(String(x==null?'':x).replace(',','.')); return isFinite(n)?n:0; };
const fmtInt = n => (Math.round(n||0)).toLocaleString('es-AR');
const cmp = (a,b)=>String(a).localeCompare(String(b),'es');
function toast(msg, kind){ const t=$('toast'); t.textContent=msg; t.className='toast show '+(kind||''); setTimeout(()=>{t.className='toast '+(kind||'');},2800); }
function nowISO(){ const d=new Date(); const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }
// lunes (ISO YYYY-MM-DD) de la semana de una fecha dada
function lunesDe(date){ const d=new Date(date); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function lunesLabel(iso){ if(!iso) return ''; const [y,m,dd]=iso.split('-'); return dd+'/'+m+'/'+y; }

/* ---------- Firebase REST ---------- */
function fbUrl(path){ return FIREBASE_DB_URL.replace(/\/+$/,'') + '/' + path.split('/').map(encodeURIComponent).join('/') + '.json'; }
async function fbGet(path, qs){ const r=await fetch(fbUrl(path)+(qs?'?'+qs:'')); if(!r.ok) throw new Error('Firebase HTTP '+r.status); return r.json(); }
async function fbPut(path, data){ const r=await fetch(fbUrl(path),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}); if(!r.ok) throw new Error('Firebase HTTP '+r.status); return r.json(); }

/* ============================================================
   ESTADO
   ============================================================ */
const state = {
  tab:'reposicion',
  files:{ ventas:null, reserva:null, stock:null },   // {archivo, hoja, matrix, headerIdx, cols, talles}; stock = opcional
  stockSem:null,                         // stock por sucursal GUARDADO para la semana elegida: {semana, meta, data|null}
  resultado:null,                        // salida de computar()
  semana: lunesDe(new Date()),           // lunes de la barrida
  histKeys:[],                           // lunes con barrida guardada
  // curva = tilde «Completar curva de talles» de Reposición: fusiona en cada fila los talles
  // que la sucursal no tiene y sí hay en reserva (y suma filas de sucursales que solo tienen curva)
  filtros:{ suc:'', rubro:'', marca:'', discs:[], subrubros:[], tipoprod:'', q:'', soloSugerido:true, excluirVarios:true, soloFaltante:false, soloRepite:false, soloSinEnviar:false, curva:false, vaciar:false },
  mselOpen:null,   // panel multi-select abierto (se conserva entre renders)
  filtrosPar:{ rubro:'', marca:'', q:'', excluirVarios:true, soloCronica:false },
  filtrosCom:{ rubro:'', marca:'', q:'', excluirVarios:true, minVendido:3, topN:20, vista:'sin' },
  // Completar curva: unidades = cuántas mandar por talle faltante; minTalles = la sucursal
  // tiene que tener stock en al menos N talles del artículo (1 solo talle es un resto, no
  // una curva); soloHuecos = sólo los faltantes que caen ENTRE el menor y el mayor que tiene
  // la sucursal (no los extremos); incluirParados = también artículos sin venta en ninguna sucursal.
  filtrosCur:{ soloHuecos:false, soloRotan:false, incluirParados:false, minTalles:2, unidades:1 },
  // Vaciar la reserva chica: max = hasta cuántas unidades del artículo (todos los talles
  // sumados) se considera reserva chica; minSuc = si TODAS las sucursales candidatas ya
  // tienen esa cantidad del talle, ese talle se deja en el depósito (no se las pasa de stock).
  filtrosVac:{ max:5, minSuc:3 },
  transf:null,                   // export de transferencias del sistema (sugerido vs. enviado)
  // por artículo: todas las sucursales de un mismo artículo, juntas (el depósito lo reparte de una)
  sortRep:{k:'art',dir:-1}, sortPar:{k:'reserva',dir:-1}, sortCom:{k:'vendido',dir:-1},
};

/* ============================================================
   PARSEO DEL EXCEL
   ============================================================ */
// Detecta la fila de encabezado y las columnas relevantes de una hoja.
function detectarCols(matrix){
  // Busca en las primeras 8 filas la que tenga 'ID ITEM' o 'DESCRIP' o 'Sucursal'.
  // La hoja de ventas viene con orden de columnas FIJO (Sucursal · Rubro · Marca ·
  // Disciplina · Género · Tipo de producto · Descripción · ID ITEM · CODIGO BARRAS ·
  // talles…), así que sus columnas descriptivas se toman por posición y no dependen
  // del texto del encabezado; la fila de encabezado sólo se usa para los talles.
  // Distintos reportes nombran las columnas distinto: "ID ITEM" vs "Item",
  // "Descripción" vs "Articulo", "Tipo de producto" vs "Grupo 1". Aceptamos los
  // alias para reconocer tanto la hoja de ventas (trae "Sucursal") como la de
  // reserva/stock del depósito (sin "Sucursal").
  let headerIdx=-1;
  for(let i=0;i<Math.min(8,matrix.length);i++){
    const row=matrix[i].map(c=>normName(c));
    const hasSuc  = row.some(c=>c==='sucursal'||c.startsWith('sucursal'));
    const hasId   = row.some(c=>c.includes('id item')||c==='item'||c==='id');
    const hasDesc = row.some(c=>c.includes('descrip')||c==='articulo'||c.startsWith('articulo'));
    const hasCod  = row.some(c=>c.includes('codigo'));
    if(hasSuc || hasId || (hasDesc&&hasCod)){ headerIdx=i; break; }
  }
  // Sin encabezados descriptivos por nombre → probar el modo posicional (solo talles).
  if(headerIdx<0) return detectarColsPosicional(matrix);
  const H = matrix[headerIdx].map(c=>normName(c));
  const find = preds => { for(let j=0;j<H.length;j++){ if(preds(H[j],j)) return j; } return -1; };
  let cols = {
    suc:   find(h=>h==='sucursal'||h.startsWith('sucursal')),
    rubro: find(h=>h==='rubro'||h.startsWith('rubro')),
    marca: find(h=>h==='marca'),
    disc:  find(h=>h.includes('disciplina')),
    // El sistema llama «Subrubro» a la columna del género (02-HOMBRE / 03-DAMA) y
    // «Grupo 1» al tipo de producto (CALZADO ADULTO). La disciplina (CASUAL, RUNNING,
    // FUTBOL 11) es su propia columna: hasta el 08/09/2026 se tomaba como subrubro.
    gen:   find(h=>h.includes('genero')||h.includes('subrubro')),
    tipo:  find(h=>h.includes('tipo')||h.includes('grupo')),
    desc:  find(h=>h.includes('descrip')||h==='articulo'||h.startsWith('articulo')),
    id:    find(h=>h.includes('id item')||h==='item'||h==='id'),
    cod:   find(h=>h.includes('codigo')&&h.includes('barra')),
  };
  // Ventas con encabezados descriptivos en blanco/renombrados: si la 1ª columna
  // es "Sucursal", el orden de columnas es fijo → completamos por posición SOLO
  // las que no se detectaron por nombre (así no se pisan los alias correctos).
  if(cols.suc===0){
    // Sucursal · Rubro · Marca · Grupo 1 (tipo) · Disciplina · Subrubro (género) ·
    // Articulo · Id Item · Codigo de barras
    const POS = { rubro:1, marca:2, tipo:3, disc:4, gen:5, desc:6, id:7, cod:8 };
    for(const k in POS){ if(cols[k]<0) cols[k]=POS[k]; }
  }
  // Talles = columnas a la derecha de CODIGO BARRAS con encabezado no vacío.
  // Se excluye la columna "Total" (la hoja de reserva trae al final el total de la
  // fila; si se contara como talle, duplicaría el stock).
  const desdeIdx = Math.max(cols.cod, cols.id, cols.desc);
  const talles=[];
  for(let j=desdeIdx+1;j<H.length;j++){
    const lbl=String(matrix[headerIdx][j]==null?'':matrix[headerIdx][j]).trim();
    if(lbl!=='' && normName(lbl)!=='total') talles.push({idx:j,label:lbl});
  }
  // Si detecté el ID (o la 1ª col es Sucursal) y hay talles, listo. Si no, la hoja
  // vino con los encabezados descriptivos en blanco (sólo rotulados los talles):
  // caemos al modo posicional, que no exige esos encabezados.
  if((cols.id>=0 || cols.suc===0) && talles.length>0) return { headerIdx, cols, talles };
  return detectarColsPosicional(matrix);
}

// Fallback: reportes SIN encabezados descriptivos (Sucursal/Item/Articulo/… en
// blanco), sólo con los encabezados de TALLE. Detecta la fila de encabezado por
// esos rótulos de talle y ubica las columnas descriptivas por su posición fija.
// Distingue ventas vs. reserva por el CONTENIDO de la 1ª columna: si son nombres
// de sucursal (mapa NAME2SLUG) → ventas; si no → reserva del depósito.
function detectarColsPosicional(matrix){
  // El header es la 1ª fila (de las primeras 8) con la col 0 vacía y ≥5 celdas
  // rotuladas (los talles). Las filas de datos traen la sucursal/rubro en col 0.
  let headerIdx=-1, talleStart=-1;
  for(let i=0;i<Math.min(8,matrix.length);i++){
    const row=matrix[i]||[];
    if(String(row[0]==null?'':row[0]).trim()!=='') continue;
    let start=-1, cnt=0;
    for(let j=0;j<row.length;j++){ const v=String(row[j]==null?'':row[j]).trim(); if(v!==''){ if(start<0)start=j; cnt++; } }
    if(start>=0 && cnt>=5){ headerIdx=i; talleStart=start; break; }
  }
  if(headerIdx<0) return null;
  let esVentas=false;
  for(let i=headerIdx+1;i<Math.min(headerIdx+40,matrix.length);i++){
    const c0=normName(matrix[i] && matrix[i][0]);
    if(c0 && NAME2SLUG[c0]){ esVentas=true; break; }
  }
  const cols = esVentas
    ? { suc:0, rubro:1, marca:2, tipo:3, disc:4, gen:5, desc:6, id:7, cod:8 }
    : { suc:-1, rubro:0, marca:1, tipo:2, disc:3, gen:4, desc:5, id:6, cod:7 };
  const talles=[];
  for(let j=talleStart;j<matrix[headerIdx].length;j++){
    const lbl=String(matrix[headerIdx][j]==null?'':matrix[headerIdx][j]).trim();
    if(lbl!=='' && normName(lbl)!=='total') talles.push({idx:j,label:lbl});
  }
  return { headerIdx, cols, talles };
}

// Convierte un ArrayBuffer de xlsx en {sheets:[{name,matrix}]}
function leerLibro(buf){
  const wb = XLSX.read(buf, {type:'array'});
  return wb.SheetNames.map(name=>({
    name,
    matrix: XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, blankrows:false, defval:''})
  }));
}

// Clasifica una hoja: 'ventas' | 'stock' (las dos tienen Sucursal) | 'reserva' | null.
// Ventas y stock por sucursal salen del mismo reporte del sistema con el MISMO layout
// (Sucursal · … · ID ITEM · talles), así que por encabezados no se distinguen: manda
// el nombre de la hoja y, si no dice nada, el del archivo («stock»/«existencia» →
// stock; «venta» → ventas). Si ninguno ayuda queda como ventas y se cambia desde el
// chip de la pantalla Cargar («↔ es stock por sucursal»).
function clasificarHoja(sheet, archivo){
  const det = detectarCols(sheet.matrix);
  if(!det || det.talles.length===0) return null;
  const porNombre = s => /stock|existenc/i.test(s) ? 'stock' : (/venta/i.test(s) ? 'ventas' : '');
  const tipo = det.cols.suc>=0 ? (porNombre(sheet.name) || porNombre(archivo||'') || 'ventas') : 'reserva';
  return { name:sheet.name, matrix:sheet.matrix, tipo, ...det };
}

// Lee File(s) y los asigna a state.files. `tipo` = el botón que se usó (ventas | reserva |
// stock | null si se soltaron en la tarjeta): una hoja con Sucursal va al tipo elegido
// (ventas o stock, que por encabezados no se distinguen); la reserva siempre a reserva.
// Con ventas + reserva cargadas se procesa solo.
async function cargarFilesComo(tipo, fileList){
  const files=[...fileList].filter(f=>/\.xlsx?$/i.test(f.name));
  if(!files.length){ toast('Subí un archivo .xlsx','err'); return; }
  try{
    toast('Leyendo Excel…');
    let huboStock=false;
    for(const file of files){
      const sheets=leerLibro(await file.arrayBuffer()); let n=0;
      sheets.forEach(sh=>{
        const c=clasificarHoja(sh, file.name); if(!c) return;
        let t=c.tipo;
        if(c.cols.suc>=0 && (tipo==='ventas'||tipo==='stock')) t=tipo;
        state.files[t]={ archivo:file.name, hoja:sh.name, matrix:c.matrix, headerIdx:c.headerIdx, cols:c.cols, talles:c.talles };
        if(t==='stock') huboStock=true;
        n++;
      });
      if(!n) throw new Error('No reconocí ninguna hoja de ventas, reserva o stock en "'+file.name+'". Revisá que tenga los encabezados (Sucursal, ID ITEM, Descripción, talles…).');
    }
    state.resultado=null; state.resultadoSemana=null;
    render(); toast('Archivo(s) cargado(s)','ok');
    if(huboStock) await guardarStockSemana();     // queda para todas las barridas de la semana
    if(state.files.ventas && state.files.reserva) await procesarBarrida();
  }catch(err){ toast(err.message||'No pude leer el archivo','err'); render(); }
}
const cargarFiles = fl => cargarFilesComo(null, fl);
/* ---------- Stock por sucursal de la SEMANA (guardado en la base) ----------
   El stock por sucursal se sube una vez por semana y sirve para todas las barridas de esa
   semana (otro día, otra compu): al subirlo se guarda en
   barrida/stockSuc/<lunesISO> = { meta:{archivo,hoja,subido,por,semana,ids,filas},
   data:{ <id>: { <slug>: [[talle,cant],…] } } } — solo talles con stock positivo, como pares
   (un talle como "8.5" es ilegal de clave en Firebase). Si no hay archivo cargado, la barrida
   usa el guardado de la semana elegida (se baja recién al procesar). Un archivo nuevo lo pisa. */
function stockDataDesdeHoja(fS){
  const data={}; let filas=0;
  filasDeHoja(fS).forEach(v=>{
    const m=NAME2SLUG[normName(v.suc)]; if(!m) return;
    const pares=Object.entries(v.talles).filter(([t,q])=>q>0).map(([t,q])=>[t,q]);
    if(!pares.length) return;
    const d=(data[v.id]=data[v.id]||{}); d[m.slug]=(d[m.slug]||[]).concat(pares); filas++;
  });
  return {data, filas};
}
// Filas de stock para el cruce: {id, slug, nombre, talles:{t:q}, meta}. Del archivo cargado
// (manda) o del guardado de la semana; null si no hay ninguno.
function stockRows(){
  const fS=state.files.stock;
  if(fS){
    const out=[];
    filasDeHoja(fS).forEach(v=>{ const m=NAME2SLUG[normName(v.suc)]; if(!m) return; out.push({ id:v.id, slug:m.slug, nombre:m.nombre, talles:v.talles, meta:v.meta }); });
    return out;
  }
  const ss=state.stockSem;
  if(ss && ss.data && ss.semana===state.semana){
    const out=[];
    Object.entries(ss.data).forEach(([id,porSlug])=>{ Object.entries(porSlug||{}).forEach(([slug,pares])=>{
      const talles={}; (pares||[]).forEach(p=>{ if(p&&p.length>=2) talles[String(p[0])]=(talles[String(p[0])]||0)+num(p[1]); });
      out.push({ id, slug, nombre:SLUG_SUC[slug]||OUTLET_SUC[slug]||slug, talles, meta:{} });
    }); });
    return out;
  }
  return null;
}
async function guardarStockSemana(){
  const fS=state.files.stock; if(!fS||!FIREBASE_DB_URL) return;
  const {data,filas}=stockDataDesdeHoja(fS);
  const meta={ archivo:fS.archivo, hoja:fS.hoja, subido:nowISO(), por:SESSION.email||'', semana:state.semana, ids:Object.keys(data).length, filas };
  try{
    toast('Guardando el stock por sucursal de la semana…');
    await fbPut(ROOT+'/stockSuc/'+state.semana, {meta, data});
    state.stockSem={ semana:state.semana, meta, data };
    toast('Stock por sucursal guardado para la semana del '+lunesLabel(state.semana)+' ✓','ok');
    render();
  }catch(e){ toast('No se pudo guardar el stock en la base: '+(e.message||e),'err'); }
}
// ¿hay stock guardado para la semana elegida? (solo el meta, liviano)
async function cargarStockSemana(){
  const sem=state.semana; if(!FIREBASE_DB_URL) return;
  if(state.stockSem && state.stockSem.semana===sem) return;
  state.stockSem=null;
  try{
    const meta=await conTimeout(fbGet(ROOT+'/stockSuc/'+sem+'/meta'),8000);
    if(state.semana!==sem) return;          // cambiaron la semana mientras bajaba
    if(meta){ state.stockSem={ semana:sem, meta, data:null }; render(); if(state.resultado && !state.resultado.conStock && state.files.ventas && state.files.reserva) procesarBarrida(); }
    else render();
  }catch(e){ /* sin base / sin red: se sigue sin stock guardado */ }
}
// baja el detalle del stock guardado (recién cuando hace falta para procesar)
async function asegurarStockData(){
  const ss=state.stockSem;
  if(state.files.stock || !ss || ss.data || ss.semana!==state.semana) return;
  toast('Bajando el stock por sucursal de la semana…');
  ss.data = (await conTimeout(fbGet(ROOT+'/stockSuc/'+ss.semana+'/data'),60000)) || {};
}

// Ventas ↔ stock por sucursal: mismo layout, así que si la detección por nombre se
// equivocó se intercambian a mano desde el chip. El stock nuevo se guarda para la semana.
function swapVentasStock(){
  const v=state.files.ventas; state.files.ventas=state.files.stock; state.files.stock=v;
  state.resultado=null; state.resultadoSemana=null;
  render();
  if(state.files.stock) guardarStockSemana();
  if(state.files.ventas && state.files.reserva) procesarBarrida();
}

/* ============================================================
   CÁLCULO DE LA BARRIDA
   ============================================================ */
// Agrega una hoja a un mapa idItem -> {meta, talles:{}, total, porSuc?}
function filasDeHoja(f){
  const out=[];
  for(let i=f.headerIdx+1;i<f.matrix.length;i++){
    const row=f.matrix[i];
    const id=String(row[f.cols.id]==null?'':row[f.cols.id]).trim();
    if(!id) continue;
    const talles={}; let total=0;
    f.talles.forEach(t=>{ const q=num(row[t.idx]); if(q!==0){ talles[t.label]=(talles[t.label]||0)+q; total+=q; } });
    out.push({
      id,
      suc: f.cols.suc>=0 ? String(row[f.cols.suc]||'').trim() : '',
      meta:{
        rubro:String(row[f.cols.rubro]||'').trim(),
        marca:String(row[f.cols.marca]||'').trim(),
        tipo: f.cols.tipo>=0?String(row[f.cols.tipo]||'').trim():'',    // «Grupo 1»: CALZADO ADULTO…
        disc: f.cols.disc>=0?String(row[f.cols.disc]||'').trim():'',    // CASUAL, RUNNING, FUTBOL 11…
        genero: f.cols.gen>=0?String(row[f.cols.gen]||'').trim():'',    // «Subrubro»: 02-HOMBRE, 03-DAMA…
        desc: String(row[f.cols.desc]||'').trim(),
        cod:  f.cols.cod>=0?String(row[f.cols.cod]||'').trim():'',
      },
      talles, total,
    });
  }
  return out;
}

// Cruza reserva x ventas. histPrev = {idItem:total} de la semana anterior (o null).
// histSnaps = array de {idItem:total} de semanas previas ordenadas de más nueva a más vieja.
/* ---------- orden de talles ----------
   Numéricos por valor (35, 35.5, 36…); de letra por la escala de ropa; el resto al final. */
const TALLES_LETRA = ['XXXS','XXS','XS','S','M','L','XL','XXL','XXXL','3XL','4XL','5XL'];
function rankTalle(t){
  const s=String(t==null?'':t).trim().toUpperCase();
  const n=parseFloat(s.replace(',','.')); if(isFinite(n)) return n;
  const i=TALLES_LETRA.indexOf(s); return i>=0 ? 1000+i : Infinity;
}
const cmpTalle = (a,b)=>(rankTalle(a)-rankTalle(b))||cmp(a,b);

// Completar curva: marca cuáles talles faltantes son "huecos internos" (caen entre el
// menor y el mayor talle que la sucursal tiene) y recalcula lo sugerido por talle según
// el parámetro «unidades por talle» y el filtro «solo huecos internos».
function marcarInternos(row){
  const tiene=Object.keys(row.tallesSuc||{}).filter(t=>row.tallesSuc[t]>0).map(rankTalle).filter(isFinite);
  const lo=Math.min(...tiene), hi=Math.max(...tiene);
  row.faltan.forEach(f=>{ const k=rankTalle(f.t); f.interno = tiene.length>0 && isFinite(k) && k>lo && k<hi; });
}
// Reparto de la reserva por artículo × talle (regla de Juli 07/09/2026): primero se
// descuenta lo que ya va por Reposición (lo vendido), y lo que queda del talle se reparte
// entre las sucursales que no lo tienen en orden de PRIORIDAD = la que más vendió el
// artículo esta semana (en cualquier talle); empate → la que más stock tiene del artículo.
// Cada una recibe `unidades` por talle hasta agotar la reserva; las que quedan sin
// unidades se marcan `agotado` (se ve en gris: la reserva se fue a la que más vendió).
function aplicarUnidadesCurva(){
  const R=state.resultado; if(!R||!R.curva) return;
  const f=state.filtrosCur, U=Math.max(1,f.unidades|0);
  // los artículos que se vacían enteros no entran al reparto de curva: ya se bajan completos
  const vacIds = state.filtros.vaciar ? new Set(vacRows().map(r=>r.id)) : null;
  // reserva ya comprometida por Reposición, por artículo × talle
  const usoRep={};
  (R.reposicion||[]).forEach(r=>{ Object.entries(r.talles||{}).forEach(([t,d])=>{ const k=r.id+'|'+t; usoRep[k]=(usoRep[k]||0)+((d&&d.s)||0); }); });
  // candidatos por artículo × talle, ordenados por prioridad. Las filas NO elegibles (un solo
  // talle, artículo sin venta en ninguna sucursal) quedan afuera del reparto: no consumen
  // reserva que le corresponde a otra sucursal.
  const porArt={};
  R.curva.forEach(row=>{
    row.faltan.forEach(d=>{ d.s=0; d.agotado=false; });
    row.prio=0; row.prioDe=0;
    if(vacIds && vacIds.has(row.id)) return;
    if(curvaElegible(row)) (porArt[row.id]=porArt[row.id]||[]).push(row);
  });
  Object.entries(porArt).forEach(([id,rows])=>{
    // prioridad del artículo: vendido ↓ · meses de stock ↑ · categoría · stock en la sucursal ↓ (cmpPrioridad)
    const orden=rows.slice().sort(cmpPrioridad);
    orden.forEach((row,i)=>{ row.prio=i+1; row.prioDe=orden.length; });
    const talles=new Set(); rows.forEach(r=>r.faltan.forEach(d=>talles.add(d.t)));
    talles.forEach(t=>{
      const cand=orden.map(r=>({r, d:r.faltan.find(x=>x.t===t)})).filter(x=>x.d && !x.d.ya
        && !(f.soloHuecos && !x.d.interno)
        && !(f.soloRotan && nivelTalle(x.r,t)==='flojo'));   // la cola de la curva no se completa
      if(!cand.length) return;
      let disp=Math.max(0, cand[0].d.r - (usoRep[id+'|'+t]||0));
      cand.forEach(({d})=>{ d.s=Math.min(U, disp); disp-=d.s; if(d.s<=0) d.agotado=true; });
    });
  });
  R.curva.forEach(row=>{ row.sugerido=row.faltan.reduce((a,d)=>a+d.s,0); });
  R.totales.curva_lineas = R.curva.filter(r=>r.sugerido>0).length;
  R.totales.curva_unidades = R.curva.reduce((a,r)=>a+r.sugerido,0);
}

/* ---------- Cerrar el circuito: qué se transfirió de verdad (08/09/2026) ----------
   La barrida sugiere; el depósito después arma y transfiere. Subiendo el export de
   transferencias del sistema (el mismo CSV/Excel que usa el Control F8 de Área de Producto)
   se cruza sugerido vs. enviado y se ve qué quedó sin salir.
   El export viene en VARIAS variantes (con/sin encabezado, con/sin Id.item, y el orden de
   origen/código/destino cambia), así que las columnas se detectan por CONTENIDO — mismo
   criterio que `equipo/`, mantener en sintonía:
     sucursales = prefijo «NN-» (la 1ª es el origen, la 2ª el destino) · código = la columna
     con letras que no es sucursal · enviado = la del rótulo «Enviado» o la primera decimal
     (1,00 / 1.00) después del código y el destino · Id.item = enteros de 4+ dígitos.
   Solo se cuentan las filas que SALEN del depósito central; si el export no trae ninguna,
   se cuentan todas y se avisa. */
// Una columna es de sucursal si sus valores son nombres del sistema (mapa NAME2SLUG) o el
// depósito: ojo que el rubro y el subrubro también empiezan con «NN-» (02-CALZADO, 02-HOMBRE).
const sinAcentos = v => normName(v).normalize('NFD').replace(/[̀-ͯ]/g,'');
const esDeposito = v => /deposito/.test(sinAcentos(v));   // el sistema lo escribe «05-Depósito»
const esSucCol = v => { const n=normName(v); return !!(n && (NAME2SLUG[n] || esDeposito(n))); };
const codKey = v => String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
function parseTransf(matrix, mesBarrida){
  // fila de encabezado con «Enviado» (si la hay)
  let hIdx=-1, eHdr=-1;
  for(let i=0;i<Math.min(5,matrix.length);i++){
    const c=(matrix[i]||[]).map(x=>String(x==null?'':x).trim().toUpperCase());
    const j=c.indexOf('ENVIADO'); if(j>=0){ hIdx=i; eHdr=j; break; }
  }
  // ¿pivot con una columna por MES? (fila de encabezado 1..12). Es el export anual: se cruza
  // contra el mes de la semana de la barrida y se avisa.
  let mesCol=-1, mesNro=0;
  if(eHdr<0){
    for(let i=0;i<Math.min(3,matrix.length);i++){
      const row=matrix[i]||[]; const meses={};
      row.forEach((v,j)=>{ const n=parseInt(String(v==null?'':v).trim(),10); if(n>=1&&n<=12&&String(v).trim()===String(n)) meses[n]=j; });
      if(Object.keys(meses).length>=3){ hIdx=i; mesNro=mesBarrida; mesCol=meses[mesBarrida]!=null?meses[mesBarrida]:-1; break; }
    }
  }
  const datos=matrix.slice(hIdx+1);
  const muestra=datos.slice(0,120);
  const cuenta=pred=>{ const c={}; muestra.forEach(cs=>{ (cs||[]).forEach((v,i)=>{ if(pred(String(v==null?'':v).trim())) c[i]=(c[i]||0)+1; }); }); return c; };
  const sucCnt=cuenta(esSucCol);
  const sucCols=Object.keys(sucCnt).filter(i=>sucCnt[i]>muestra.length/3).map(Number).sort((a,b)=>a-b);
  if(!sucCols.length) return null;
  // con una sola columna de sucursal, es el destino (el origen es siempre el depósito)
  const iO = sucCols.length>1 ? sucCols[0] : -1;
  const iD = sucCols.length>1 ? sucCols[1] : sucCols[0];
  // el código de artículo EMPIEZA con letras y trae dígitos, sin espacios (ADIJI0958, PUM40582801):
  // así no se confunde con el rubro/subrubro (02-CALZADO, 02-HOMBRE), que empiezan con número.
  const esCodigo = v => v.length>=4 && /^[A-Za-z]/.test(v) && /\d/.test(v) && !/\s/.test(v);
  const letCnt=cuenta(esCodigo);
  // entre las candidatas gana la de MÁS valores distintos (el código es único por artículo;
  // una columna de categoría repite los mismos pocos valores)
  const distintos={}; muestra.forEach(cs=>{ (cs||[]).forEach((v,i)=>{ const t=String(v==null?'':v).trim();
    if(esCodigo(t)){ (distintos[i]=distintos[i]||new Set()).add(t); } }); });
  let iC=-1,mejorC=0; for(const i in letCnt){
    if(+i===iO||+i===iD||letCnt[i]<=muestra.length/2) continue;
    const n=(distintos[i]||new Set()).size; if(n>mejorC){ mejorC=n; iC=+i; } }
  let iE=eHdr>=0?eHdr:mesCol;
  if(iE<0){
    const decCnt=cuenta(v=>/^\d+([.,]\d{1,2})?$/.test(v));
    const cand=Object.keys(decCnt).filter(i=>decCnt[i]>muestra.length/2).map(Number).sort((a,b)=>a-b);
    iE=cand.find(i=>i>iC&&i>iD); if(iE===undefined) iE=cand.length?cand[cand.length-1]:-1;
  }
  const intCnt=cuenta(v=>/^\d{4,6}$/.test(v));
  let iA=-1,mejorA=0; for(const i in intCnt){ if(+i!==iO&&+i!==iD&&+i!==iC&&+i!==iE&&intCnt[i]>muestra.length/2&&intCnt[i]>mejorA){ mejorA=intCnt[i]; iA=+i; } }
  if(iC<0||iE<0) return null;
  const leer = soloDepo => {
    const porId={}, porCod={}; let filas=0, unidades=0;
    datos.forEach(cols=>{
      if(!cols||cols.length<=iE) return;
      const dest=String(cols[iD]==null?'':cols[iD]).trim();
      const m=NAME2SLUG[normName(dest)]; if(!m) return;             // «Total», el depósito y basura afuera
      if(soloDepo && iO>=0 && !esDeposito(cols[iO])) return;
      const env=parseFloat(String(cols[iE]==null?'0':cols[iE]).replace(',','.'))||0;
      if(env<=0) return;
      const cod=codKey(cols[iC]), id=iA>=0?String(cols[iA]==null?'':cols[iA]).trim():'';
      if(id) porId[m.slug+'|'+id]=(porId[m.slug+'|'+id]||0)+env;
      if(cod) porCod[m.slug+'|'+cod]=(porCod[m.slug+'|'+cod]||0)+env;
      filas++; unidades+=env;
    });
    return { porId, porCod, filas, unidades };
  };
  const depo = iO>=0 ? leer(true) : null;
  const R = (depo && depo.filas>0) ? Object.assign(depo,{soloDeposito:true}) : Object.assign(leer(false),{soloDeposito:false});
  R.mes = mesCol>=0 ? mesNro : 0;             // >0 = se cruzó contra un mes entero, no la semana
  return R;
}
// unidades realmente transferidas a esa sucursal de ese artículo (null si no hay export)
function enviadoDe(r){
  const T=state.transf; if(!T) return null;
  const porId=T.porId[r.slug+'|'+r.id];
  if(porId!=null) return porId;
  const c=codKey(r.codigo); if(c && T.porCod[r.slug+'|'+c]!=null) return T.porCod[r.slug+'|'+c];
  return 0;
}
// estado de la línea contra lo que se envió
function estadoEnvio(r){
  const e=enviadoDe(r); if(e===null) return null;
  const sug=r.sugerido||0;
  if(sug<=0) return e>0 ? {k:'extra', e} : null;
  if(e<=0) return {k:'no', e};
  if(e>=sug) return {k:'ok', e};
  return {k:'parcial', e};
}
// lee el export (CSV ;-separado latin1, o Excel) y arma el índice
async function cargarTransferencias(file){
  try{
    toast('Leyendo el export…');
    let matrix;
    if(/\.csv$/i.test(file.name)){
      const txt=await new Promise((res,rej)=>{ const rd=new FileReader(); rd.onload=e=>res(e.target.result); rd.onerror=rej; rd.readAsText(file,'latin1'); });
      matrix=txt.split(/\r?\n/).filter(l=>l.trim()).map(l=>l.split(';').map(x=>x.trim()));
    } else {
      const buf=await file.arrayBuffer();
      const hojas=leerLibro(buf);
      matrix=null;
      for(const h of hojas){ const t=parseTransf(h.matrix); if(t){ matrix=h.matrix; break; } }
      if(!matrix) matrix=(hojas[0]||{}).matrix||[];
    }
    const T=parseTransf(matrix, parseInt(String(state.semana).slice(5,7),10)||0);
    if(!T || !T.filas){ toast('No pude reconocer las columnas del export de transferencias','err'); return; }
    state.transf=Object.assign(T,{ archivo:file.name, subido:nowISO() });
    render();
    toast('Transferencias cruzadas: '+fmtInt(T.unidades)+' unidades'
      +(T.mes?' del mes '+T.mes+' (el export es el anual por mes, no la semana)':'')
      +(T.soloDeposito?'':' · el export no trae salidas del depósito: se contó todo'),'ok');
    // si esta semana ya está guardada, el cruce queda guardado con ella
    if(FIREBASE_DB_URL && state.resultadoSemana===state.semana){
      try{ await fbPut(ROOT+'/barridas/'+state.semana+'/transf', { meta:{archivo:T.archivo, subido:T.subido, por:SESSION.email||'', filas:T.filas, unidades:T.unidades, soloDeposito:T.soloDeposito}, porId:T.porId, porCod:T.porCod });
      }catch(e){ /* el cruce sigue viéndose aunque no se pueda guardar */ }
    }
  }catch(err){ console.error(err); toast('No pude leer el export: '+(err.message||err),'err'); }
}

/* ---------- Curva de talles (velocidad de venta por talle, 08/09/2026) ----------
   En calzado e indumentaria no todos los talles rotan igual: el 41 vuela y el 47 duerme.
   La curva se calcula con la venta de la semana de TODAS las sucursales, agrupada por
   rubro + tipo de producto (CALZADO ADULTO y CALZADO NIÑO tienen escalas distintas), y
   ordena los talles de más a menos vendido:
     · fuerte = entra en el primer 60% de la venta acumulada del grupo,
     · medio  = hasta el 90%,
     · flojo  = la cola.
   Se usa para (1) teñir el rótulo del talle en la tabla, así se ve de un vistazo si lo que
   baja es un talle que rota, y (2) el control «Solo talles que rotan» de Completar curva,
   que evita gastar reserva completando talles de la cola. */
const CURVA_FUERTE = 0.60, CURVA_MEDIO = 0.90;
function curvaKey(meta){ return normName((meta&&meta.rubro)||'')+'|'+normName((meta&&meta.tipo)||''); }
// {clave: {tot, peso:{talle:0..1}, nivel:{talle:'fuerte'|'medio'|'flojo'}}}
function curvaDeTalles(filasVenta){
  const acc={};
  filasVenta.forEach(v=>{
    const k=curvaKey(v.meta); const A=acc[k]=acc[k]||{tot:0, q:{}};
    Object.entries(v.talles).forEach(([t,q])=>{ if(q>0){ A.q[t]=(A.q[t]||0)+q; A.tot+=q; } });
  });
  const out={};
  Object.entries(acc).forEach(([k,A])=>{
    if(A.tot<=0) return;
    const peso={}, nivel={};
    const orden=Object.entries(A.q).sort((a,b)=>b[1]-a[1]);
    let ac=0;
    orden.forEach(([t,q])=>{ peso[t]=q/A.tot; const antes=ac; ac+=peso[t];
      nivel[t] = antes<CURVA_FUERTE ? 'fuerte' : (antes<CURVA_MEDIO ? 'medio' : 'flojo'); });
    out[k]={ tot:A.tot, peso, nivel, talles:orden.length };
  });
  return out;
}
// nivel de rotación de un talle dentro de su rubro+tipo ('' si no hay dato)
function nivelTalle(row, t){
  const C=state.resultado&&state.resultado.curvaTalles; if(!C) return '';
  const g=C[curvaKey(row)]; if(!g||!g.nivel[t]) return '';
  return g.nivel[t];
}
function pesoTalle(row, t){
  const C=state.resultado&&state.resultado.curvaTalles; if(!C) return null;
  const g=C[curvaKey(row)]; if(!g||g.peso[t]==null) return null;
  return g.peso[t];
}
const NIVEL_TXT = { fuerte:'talle que rota (primer 60% de la venta del rubro)', medio:'rotación media', flojo:'cola de la curva: casi no se vende' };
// texto para el tooltip del casillero
function curvaTip(row, t){
  const n=nivelTalle(row,t); if(!n) return '';
  const w=pesoTalle(row,t);
  return ' · '+NIVEL_TXT[n]+(w!=null?' ('+(w*100).toFixed(1).replace('.',',')+'% de la venta)':'');
}

/* ---------- Vaciar la reserva chica (regla de Juli 08/09/2026) ----------
   En CALZADO e INDUMENTARIA, un artículo con muy poca reserva no tiene sentido en el
   depósito central: conviene repartir lo que queda y que viva en las sucursales. Si el
   artículo tiene hasta `max` unidades en total (todos los talles sumados) se baja TODO lo
   que quede después de la reposición normal, repartido de a una unidad por vuelta entre las
   sucursales candidatas en orden de prioridad (vendido · meses de stock · categoría).
   Candidatas = las que lo vendieron esta semana o las que lo tienen en stock.
   EXCEPCIÓN: si TODAS las candidatas ya tienen `minSuc` o más unidades de ese talle, el
   talle se DEJA en reserva (bajarlo solo les sumaría stock parado) y se marca con un
   indicador. La excepción necesita la hoja de stock por sucursal. */
const VAC_TOPE = 20;                       // tope duro de candidatos que se calculan (el umbral de pantalla llega a 10)
const esVaciable = rubro => /calzado|indumentaria/i.test(stripNN(rubro));
function aplicarVaciado(){
  const R=state.resultado; if(!R||!R.vaciado) return;
  const f=state.filtrosVac, MAX=Math.max(1,f.max|0), MIN=Math.max(1,f.minSuc|0);
  // reserva ya comprometida por Reposición, por artículo × talle
  const usoRep={};
  (R.reposicion||[]).forEach(r=>{ Object.entries(r.talles||{}).forEach(([t,d])=>{ const k=r.id+'|'+t; usoRep[k]=(usoRep[k]||0)+((d&&d.s)||0); }); });
  const dejados={};                        // id -> [{t,r}] talles que quedan en el depósito
  const porArt={};
  R.vaciado.forEach(row=>{ row.talles=[]; row.sugerido=0; row.prio=0; row.prioDe=0;
    if(row.reservaTotal<=MAX) (porArt[row.id]=porArt[row.id]||[]).push(row); });
  Object.entries(porArt).forEach(([id,rows])=>{
    const orden=rows.slice().sort(cmpPrioridad);
    orden.forEach((r,i)=>{ r.prio=i+1; r.prioDe=orden.length; });
    Object.entries(rows[0].resTalles||{}).forEach(([t,rq])=>{
      let disp=Math.max(0, rq-(usoRep[id+'|'+t]||0));
      if(disp<=0) return;
      if(rows[0].conStock && orden.every(r=>((r.tallesSuc||{})[t]||0)>=MIN)){
        (dejados[id]=dejados[id]||[]).push({t, r:rq, min:MIN}); return;   // todas cubiertas: se deja
      }
      for(let i=0; disp>0 && i<orden.length*rq+orden.length; i++){
        const r=orden[i%orden.length];
        let d=r.talles.find(x=>x.t===t); if(!d){ d={t, r:rq, s:0}; r.talles.push(d); }
        d.s++; disp--;
      }
    });
    rows.forEach(r=>{ r.talles.sort((a,b)=>cmpTalle(a.t,b.t)); r.sugerido=r.talles.reduce((a,d)=>a+d.s,0); });
  });
  R.vacDejados=dejados;
  R.totales.vac_lineas = R.vaciado.filter(r=>r.sugerido>0).length;
  R.totales.vac_unidades = R.vaciado.reduce((a,r)=>a+r.sugerido,0);
  R.totales.vac_dejados = Object.keys(dejados).length;
}
// filas del vaciado con unidades a mandar (recalculadas con los parámetros de pantalla)
function vacRows(){
  const R=state.resultado; if(!R||!R.vaciado) return [];
  aplicarVaciado();
  return R.vaciado.filter(r=>r.sugerido>0);
}
// índice id|slug -> fila de vaciado (para fusionarla con la reposición)
function vacIdx(){ const o={}; vacRows().forEach(r=>{ o[r.id+'|'+r.slug]=r; }); return o; }

function computar(histPrev, histSnaps){
  const fV = state.files.ventas, fR = state.files.reserva, fS = state.files.stock;
  // ---- reserva ----
  const reserva={};
  filasDeHoja(fR).forEach(r=>{
    if(!reserva[r.id]) reserva[r.id]={ meta:r.meta, talles:{}, total:0 };
    const R=reserva[r.id];
    Object.entries(r.talles).forEach(([t,q])=>{ R.talles[t]=(R.talles[t]||0)+q; });
    R.total+=r.total;
    if(!R.meta.desc && r.meta.desc) R.meta=r.meta;
  });
  // ---- ventas (por sucursal, solo destinos válidos; Depósito/otros quedan afuera) ----
  const ventas={};   // id -> { porSuc:{slug:{nombre,total,talles}}, totalCadena, meta }
  filasDeHoja(fV).forEach(v=>{
    const m = NAME2SLUG[normName(v.suc)];
    if(!m) return;                 // excluye Depósito, "Sucursal" y cualquier no mapeada
    if(v.total<=0) return;
    if(!ventas[v.id]) ventas[v.id]={ porSuc:{}, totalCadena:0, meta:v.meta };
    const V=ventas[v.id];
    if(!V.porSuc[m.slug]) V.porSuc[m.slug]={ nombre:m.nombre, total:0, talles:{} };
    const S=V.porSuc[m.slug];
    Object.entries(v.talles).forEach(([t,q])=>{ if(q>0){ S.talles[t]=(S.talles[t]||0)+q; } });
    S.total+=v.total; V.totalCadena+=v.total;
  });
  // ---- stock por sucursal (hoja opcional): id -> { porSuc:{slug:{nombre,total,talles}}, meta }
  // Solo cuentan los talles con stock POSITIVO (un negativo del sistema vale como cero).
  // Sale del archivo cargado o, si no hay, del stock GUARDADO para la semana (stockRows()).
  const stock={};
  const sRows=stockRows();
  if(sRows){
    sRows.forEach(v=>{
      if(!stock[v.id]) stock[v.id]={ porSuc:{}, meta:v.meta||{} };
      const S0=stock[v.id];
      if(!S0.porSuc[v.slug]) S0.porSuc[v.slug]={ nombre:v.nombre, total:0, talles:{} };
      const S=S0.porSuc[v.slug];
      Object.entries(v.talles).forEach(([t,q])=>{ if(q>0){ S.talles[t]=(S.talles[t]||0)+q; S.total+=q; } });
    });
  }

  // ---- curva de talles de la semana (rotación por talle, por rubro+tipo) ----
  const curvaTalles = curvaDeTalles(filasDeHoja(fV).filter(v=>NAME2SLUG[normName(v.suc)]));

  // ---- cruce ----
  const reposicion=[];   // una fila por (artículo × sucursal candidata)
  const parada=[];
  Object.entries(reserva).forEach(([id,R])=>{
    if(R.total<=0) return;
    const V=ventas[id];
    if(V && V.totalCadena>0){
      const media = esMediaMateu(R.meta);   // medias Mateu: repone el mínimo del talle vendido
      Object.entries(V.porSuc).forEach(([slug,S])=>{
        let sugerido=0; const detTalles={};
        Object.entries(S.talles).forEach(([t,vq])=>{
          const rq=R.talles[t]||0;
          // MEDIAS: para el talle vendido el objetivo es el mínimo (S:12 M:24 L:36 XL:12),
          // aunque haya vendido menos; talle fuera de la tabla → objetivo = vendido.
          const min = media ? mediasMin(t) : 0;
          const objetivo = min>0 ? min : vq;
          const s = Math.min(objetivo, rq);
          if(vq>0||rq>0) detTalles[t]={v:objetivo, r:rq, s, vend:vq, piso:min>0};
          sugerido+=s;
        });
        reposicion.push({
          id, slug, sucNombre:S.nombre,
          codigo:R.meta.cod||V.meta.cod||'', desc:R.meta.desc||V.meta.desc||'',
          marca:R.meta.marca||V.meta.marca||'', rubro:R.meta.rubro||V.meta.rubro||'', tipo:R.meta.tipo||V.meta.tipo||'',
          genero:R.meta.genero||V.meta.genero||'', disc:R.meta.disc||V.meta.disc||'',
          vendido:S.total, reservaTotal:R.total, sugerido, talles:detTalles, pisoMedias:media,
          pr: prioInfo(slug, R.meta.marca||V.meta.marca||'', R.meta.rubro||V.meta.rubro||''),
        });
      });
    } else {
      // sin venta en toda la cadena -> reserva parada
      const reciente = histPrev ? !(id in histPrev) : null;   // null = primera barrida, sin histórico
      let semanas=1;
      if(histSnaps){ for(const snap of histSnaps){ if(id in snap) semanas++; else break; } }
      parada.push({
        id, codigo:R.meta.cod||'', desc:R.meta.desc||'', marca:R.meta.marca||'', rubro:R.meta.rubro||'', tipo:R.meta.tipo||'',
        reservaTotal:R.total, semanas, ingresoReciente:reciente,
        talles:Object.entries(R.talles).map(([t,q])=>t+':'+q).join('  '),
      });
    }
  });

  // ---- REPARTO de la reserva por artículo × talle (prioridad) ----
  // Hasta acá cada sucursal pidió mín(objetivo, reserva) por su cuenta: si varias piden el
  // mismo talle, la suma puede superar la reserva. Acá se define a quién va: si alcanza
  // para todas, todas reciben lo suyo; si no, se reparte en orden de prioridad (vendido ·
  // meses de stock · categoría, ver cmpPrioridad) y las que quedan cortas se marcan (rec).
  {
    const porArt={}; reposicion.forEach(r=>{ (porArt[r.id]=porArt[r.id]||[]).push(r); });
    Object.values(porArt).forEach(rows=>{
      const orden=rows.slice().sort(cmpPrioridad);
      orden.forEach((r,i)=>{ r.prio=i+1; r.prioDe=orden.length; });
      const talles=new Set(); rows.forEach(r=>Object.keys(r.talles).forEach(t=>talles.add(t)));
      talles.forEach(t=>{
        const cand=orden.filter(r=>r.talles[t] && r.talles[t].v>0);
        if(!cand.length) return;
        const rq=cand[0].talles[t].r, dem=cand.reduce((a,r)=>a+r.talles[t].v,0);
        if(dem<=rq){ cand.forEach(r=>{ const d=r.talles[t]; d.s=d.v; d.rec=0; }); return; }
        let disp=rq;
        cand.slice().sort((a,b)=>cmpPrioridad({...a, vendTalle:a.talles[t].vend},{...b, vendTalle:b.talles[t].vend}))
          .forEach(r=>{ const d=r.talles[t]; d.s=Math.min(d.v, disp); disp-=d.s; d.rec=d.v-d.s; });
      });
      rows.forEach(r=>{ r.sugerido=Object.values(r.talles).reduce((a,d)=>a+d.s,0); r.recorte=Object.values(r.talles).reduce((a,d)=>a+(d.rec||0),0); });
    });
  }

  // ---- VACIAR LA RESERVA CHICA (calzado e indumentaria) ----
  // Candidatos: artículos con poca reserva y las sucursales que lo venden o lo tienen.
  // El reparto fino (umbral y excepción) lo hace aplicarVaciado(), para poder mover los
  // parámetros desde la pantalla sin volver a procesar el Excel.
  const vaciado=[];
  Object.entries(reserva).forEach(([id,R])=>{
    if(R.total<=0 || R.total>VAC_TOPE || !esVaciable(R.meta.rubro)) return;
    const V=ventas[id], S0=stock[id];
    const slugs=new Set();
    if(V) Object.keys(V.porSuc).forEach(sl=>slugs.add(sl));
    if(S0) Object.keys(S0.porSuc).forEach(sl=>{ if(S0.porSuc[sl].total>0) slugs.add(sl); });
    if(!slugs.size) return;                       // nadie lo vende ni lo tiene: queda en reserva parada
    const m=R.meta, mv=(V&&V.meta)||{};
    slugs.forEach(slug=>{
      const sv=(V&&V.porSuc[slug])||null, ss=(S0&&S0.porSuc[slug])||null;
      vaciado.push({
        id, slug, sucNombre:(sv&&sv.nombre)||(ss&&ss.nombre)||slug,
        codigo:m.cod||mv.cod||'', desc:m.desc||mv.desc||'', marca:m.marca||mv.marca||'',
        rubro:m.rubro||mv.rubro||'', tipo:m.tipo||mv.tipo||'', disc:m.disc||mv.disc||'', genero:m.genero||mv.genero||'',
        reservaTotal:R.total, resTalles:R.talles, conStock:!!sRows,
        vendido:sv?sv.total:0, enSucursal:ss?ss.total:0, tallesSuc:ss?ss.talles:{},
        talles:[], sugerido:0,
        pr: prioInfo(slug, m.marca||mv.marca||'', m.rubro||mv.rubro||''),
      });
    });
  });

  // ---- COMPLETAR CURVA (necesita la hoja de stock por sucursal) ----
  // La sucursal tiene el artículo (stock en ≥1 talle) pero le faltan talles que SÍ hay
  // en la reserva. Una fila por (artículo × sucursal) con la lista de talles faltantes.
  // Un talle que ya viene por Reposición (lo vendió y se sugiere bajarlo) se marca `ya`
  // y no se vuelve a contar. Lo sugerido por talle lo pone aplicarUnidadesCurva().
  const curva=[];
  if(sRows){
    const repIdx={}; reposicion.forEach(r=>{ repIdx[r.id+'|'+r.slug]=r; });
    Object.entries(stock).forEach(([id,S0])=>{
      const R=reserva[id]; if(!R||R.total<=0) return;
      const V=ventas[id];
      Object.entries(S0.porSuc).forEach(([slug,S])=>{
        if(S.total<=0) return;
        const rep=repIdx[id+'|'+slug];
        const faltan=[];
        Object.entries(R.talles).forEach(([t,rq])=>{
          if(rq<=0 || (S.talles[t]||0)>0) return;
          const ya = !!(rep && rep.talles[t] && rep.talles[t].s>0);
          faltan.push({t, r:rq, ya, s:0});
        });
        if(!faltan.length) return;
        faltan.sort((a,b)=>cmpTalle(a.t,b.t));
        const row={
          id, slug, sucNombre:S.nombre,
          codigo:R.meta.cod||S0.meta.cod||'', desc:R.meta.desc||S0.meta.desc||'',
          marca:R.meta.marca||S0.meta.marca||'', rubro:R.meta.rubro||S0.meta.rubro||'', tipo:R.meta.tipo||S0.meta.tipo||'',
          genero:R.meta.genero||S0.meta.genero||'', disc:R.meta.disc||S0.meta.disc||'',
          enSucursal:S.total, nTalles:Object.keys(S.talles).length,
          vendido:(V&&V.porSuc[slug])?V.porSuc[slug].total:0, ventaCadena:V?V.totalCadena:0, reservaTotal:R.total,
          tallesSuc:S.talles, faltan, sugerido:0,
          pr: prioInfo(slug, R.meta.marca||S0.meta.marca||'', R.meta.rubro||S0.meta.rubro||''),
        };
        marcarInternos(row);
        curva.push(row);
      });
    });
  }

  // ---- vista COMPRAS: por artículo global (no por sucursal) ----
  // Cada artículo vendido en la cadena, con su stock en reserva.
  //   sin reserva  -> mejor vendido a reponer a la marca (recomprar)
  //   con reserva  -> mejor vendido cubierto, solo seguimiento
  const compras=[];
  Object.entries(ventas).forEach(([id,V])=>{
    if(V.totalCadena<=0) return;
    const R=reserva[id];
    const reservaTotal = R? R.total : 0;
    compras.push({
      id, codigo:(R&&R.meta.cod)||V.meta.cod||'',
      desc:(R&&R.meta.desc)||V.meta.desc||'', marca:(R&&R.meta.marca)||V.meta.marca||'',
      rubro:(R&&R.meta.rubro)||V.meta.rubro||'', tipo:(R&&R.meta.tipo)||V.meta.tipo||'',
      vendido:V.totalCadena, reservaTotal, sucursales:Object.keys(V.porSuc).length,
      tieneReserva: reservaTotal>0,
    });
  });

  // snapshot de reserva de esta semana (para futuras barridas)
  const snapshot={}; Object.entries(reserva).forEach(([id,R])=>{ if(R.total>0) snapshot[id]=R.total; });

  const sucSet = new Set(reposicion.map(r=>r.slug));
  const noVarios = a => !/varios|facturacion/i.test(a.rubro+' '+a.tipo);
  // "notable" = mejor vendido (>=3 u. en la semana), mismo umbral que el filtro por defecto de la vista Compras.
  const notable = c => c.vendido>=3 && noVarios(c);
  return {
    reposicion, parada, compras, curva, vaciado, vacDejados:{}, curvaTalles, conStock:!!sRows, stockOrigen: fS ? 'archivo' : (sRows ? 'base' : ''), snapshot,
    totales:{
      curva_lineas: 0, curva_unidades: 0,      // los completa aplicarUnidadesCurva()
      vac_lineas: 0, vac_unidades: 0, vac_dejados: 0,   // los completa aplicarVaciado()
      items_reserva: Object.keys(snapshot).length,
      items_reponibles: new Set(reposicion.map(r=>r.id)).size,
      lineas_reposicion: reposicion.length,
      sucursales: sucSet.size,
      unidades_sugeridas: reposicion.reduce((a,r)=>a+r.sugerido,0),
      items_parados: parada.length,
      unidades_paradas: parada.reduce((a,r)=>a+r.reservaTotal,0),
      compras_sin_reserva: compras.filter(c=>!c.tieneReserva && notable(c)).length,
      compras_con_reserva: compras.filter(c=>c.tieneReserva && notable(c)).length,
    },
    sinHistorial: histPrev===null,
  };
}

function setTab(t){ state.tab=t; document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===t)); render(); }

function render(){
  const R=state.resultado;
  if(state.tab==='reposicion') guardarPrefs();   // el corte del depósito se recuerda en este navegador
  $('bRep').textContent = R? R.totales.lineas_reposicion : 0;
  $('bPar').textContent = R? R.totales.items_parados : 0;
  $('bCom').textContent = R? (R.totales.compras_sin_reserva||0) : 0;
  const v=$('view');
  if(state.tab==='reposicion') v.innerHTML=viewReposicion();
  else if(state.tab==='compras') v.innerHTML=viewCompras();
  else if(state.tab==='parada') v.innerHTML=viewParada();

function wireCarga(){
  const card=$('cargaCard'), input=$('fileInput'); if(!card||!input) return;
  card.querySelectorAll('[data-cargar]').forEach(b=>b.onclick=()=>{ state._cargarComo=b.dataset.cargar; input.click(); });
  input.onchange=async e=>{ const t=state._cargarComo||null; state._cargarComo=null;
    if(t==='transf'){ if(e.target.files[0]) await cargarTransferencias(e.target.files[0]); }
    else await cargarFilesComo(t, e.target.files);
    input.value=''; };
  card.ondragover=e=>{ e.preventDefault(); card.classList.add('over'); };
  card.ondragleave=()=>card.classList.remove('over');
  card.ondrop=async e=>{ e.preventDefault(); card.classList.remove('over'); await cargarFilesComo(null, e.dataTransfer.files); };
  // cambiar la semana: el stock guardado es por semana → se busca el de la nueva
  const sem=$('semInput'); if(sem) sem.onchange=e=>{ state.semana=e.target.value; state.stockSem=null; render(); cargarStockSemana(); };
  const bp=$('btnProcesar'); if(bp) bp.onclick=procesarBarrida;
  const bg=$('btnGuardar'); if(bg) bg.onclick=guardarBarrida;
  card.querySelectorAll('[data-swap]').forEach(b=>b.onclick=swapVentasStock);
  card.querySelectorAll('[data-quitar]').forEach(b=>b.onclick=()=>{ state.transf=null; render(); });
}
