<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reviews — Mateu Sports</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="../shared/iconos.js" defer></script>
  <script src="../shared/header.js" defer></script>
  <script src="../shared/notificaciones.js" defer></script>
  <script src="../shared/marca.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { color-scheme: light dark; }
    :root {
      --navy: #0B1527;
      --red: #CC0000;
      --off: #f5f7fc;
      --text: #333;
      --border: #e0e0e0;
      --muted: #888;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --shade-1: #e8eef5;
      --shade-2: #d4dce9;
      --marca-navy: var(--navy);
      --marca-red: var(--red);
      --marca-off: var(--off);
      --marca-mid: #1a2f55;
    }

    body {
      font-family: 'Barlow', sans-serif;
      background: var(--off);
      color: var(--text);
      line-height: 1.6;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 80px 16px 32px;
    }

    .top {
      padding: calc(16px + env(safe-area-inset-top, 0)) 16px 16px;
    }

    /* Hero Header */
    .page-hero {
      background: linear-gradient(135deg, var(--marca-navy) 0%, var(--marca-mid) 100%);
      color: white;
      padding: 32px 16px;
      border-radius: 12px;
      margin-bottom: 32px;
      border-bottom: 4px solid var(--marca-red);
    }

    .page-hero h1 {
      font-family: 'Bebas Neue';
      font-size: 2.8rem;
      margin-bottom: 8px;
      letter-spacing: 0.03em;
    }

    .page-hero p {
      opacity: 0.9;
      font-size: 0.95rem;
    }

    /* Filtros y controles */
    .controls {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      align-items: center;
    }

    .control-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .control-group label {
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--marca-navy);
      font-family: 'Barlow Condensed';
    }

    .control-group select, .control-group button {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: 'Barlow', sans-serif;
      font-size: 0.9rem;
      background: white;
      cursor: pointer;
      transition: all 0.2s;
    }

    .control-group select:hover,
    .control-group button:hover {
      border-color: var(--marca-red);
      box-shadow: 0 2px 8px rgba(204, 0, 0, 0.1);
    }

    .control-group button {
      background: var(--marca-navy);
      color: white;
      font-weight: 600;
      border: none;
    }

    /* KPI Stats */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    .kpi-card {
      background: white;
      border-radius: 8px;
      padding: 20px;
      border: 2px solid var(--border);
      text-align: center;
    }

    .kpi-value {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--marca-navy);
      margin: 8px 0;
      font-family: 'Barlow', sans-serif;
    }

    .kpi-label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      font-family: 'Barlow Condensed';
      font-weight: 600;
    }

    .kpi-card.good { border-top: 4px solid var(--success); }
    .kpi-card.bad { border-top: 4px solid var(--danger); }
    .kpi-card.neutral { border-top: 4px solid var(--marca-red); }

    /* Grid de sucursales */
    .sucursales-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .sucursal-card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      transition: all 0.3s;
    }

    .sucursal-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
    }

    .card-header {
      background: linear-gradient(135deg, var(--marca-navy) 0%, var(--marca-mid) 100%);
      color: white;
      padding: 20px;
      border-bottom: 4px solid var(--marca-red);
    }

    .card-header h2 {
      font-family: 'Barlow Condensed';
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 4px;
      letter-spacing: 0.02em;
    }

    .card-meta {
      font-size: 0.8rem;
      opacity: 0.85;
      display: flex;
      justify-content: space-between;
    }

    .card-body {
      padding: 20px;
    }

    .satisfaction-meter {
      text-align: center;
      margin-bottom: 20px;
    }

    .satisfaction-score {
      font-size: 3rem;
      font-weight: 700;
      color: var(--marca-red);
      margin: 8px 0;
    }

    .satisfaction-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      color: var(--muted);
      letter-spacing: 0.05em;
      font-family: 'Barlow Condensed';
    }

    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .stat-item {
      padding: 12px;
      background: var(--shade-1);
      border-radius: 6px;
      text-align: center;
    }

    .stat-item.good { border-left: 4px solid var(--success); }
    .stat-item.bad { border-left: 4px solid var(--danger); }

    .stat-value {
      font-size: 1.8rem;
      font-weight: 700;
      margin: 4px 0;
    }

    .stat-item.good .stat-value { color: var(--success); }
    .stat-item.bad .stat-value { color: var(--danger); }

    .stat-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--muted);
      font-family: 'Barlow Condensed';
      letter-spacing: 0.05em;
    }

    .progress-bar {
      width: 100%;
      height: 10px;
      background: var(--shade-1);
      border-radius: 5px;
      overflow: hidden;
      margin: 16px 0;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--success) 0%, var(--warning) 50%, var(--danger) 100%);
      transition: width 0.4s;
    }

    /* Chart container */
    .chart-container {
      position: relative;
      height: 300px;
      margin: 16px 0;
      background: var(--shade-1);
      border-radius: 6px;
      padding: 12px;
    }

    /* Sección de histórico */
    .history-section {
      background: white;
      border-radius: 10px;
      padding: 24px;
      border: 1px solid var(--border);
      margin-bottom: 32px;
    }

    .history-section h2 {
      font-family: 'Bebas Neue';
      font-size: 1.6rem;
      color: var(--marca-navy);
      margin-bottom: 20px;
      letter-spacing: 0.02em;
    }

    .history-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    .history-table th {
      background: var(--marca-navy);
      color: white;
      padding: 12px;
      text-align: left;
      font-weight: 600;
      font-family: 'Barlow Condensed';
      letter-spacing: 0.05em;
    }

    .history-table td {
      padding: 12px;
      border-bottom: 1px solid var(--border);
    }

    .history-table tr:hover {
      background: var(--shade-1);
    }

    .pct-good { color: var(--success); font-weight: 600; }
    .pct-bad { color: var(--danger); font-weight: 600; }

    /* Google Maps */
    #map {
      width: 100%;
      height: 500px;
      border-radius: 10px;
      margin: 32px 0;
      border: 1px solid var(--border);
    }

    .map-section {
      background: white;
      border-radius: 10px;
      padding: 24px;
      border: 1px solid var(--border);
      margin-bottom: 32px;
    }

    .map-section h2 {
      font-family: 'Bebas Neue';
      font-size: 1.6rem;
      color: var(--marca-navy);
      margin-bottom: 16px;
      letter-spacing: 0.02em;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 48px 16px;
      color: var(--muted);
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .sucursales-grid {
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      }
    }

    @media (max-width: 768px) {
      .container { padding: 80px 12px 20px; }
      .page-hero h1 { font-size: 2rem; }
      .sucursales-grid { grid-template-columns: 1fr; }
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
      .controls { flex-direction: column; align-items: stretch; }
      .control-group select, .control-group button { width: 100%; }
      #map { height: 350px; }
    }

    @media (max-width: 480px) {
      .page-hero h1 { font-size: 1.6rem; }
      .satisfaction-score { font-size: 2.5rem; }
      .kpi-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="top"></div>

<div class="container">
  <!-- Hero Header -->
  <div class="page-hero">
    <h1>⭐ Reviews de Sucursales</h1>
    <p>Análisis de opiniones de clientes — Buenas y malas críticas por localidad</p>
  </div>

  <!-- Controles -->
  <div class="controls">
    <div class="control-group">
      <label for="suc-filter">Sucursal:</label>
      <select id="suc-filter">
        <option value="">Todas las sucursales</option>
      </select>
    </div>
    <div class="control-group">
      <label for="mes-filter">Mes:</label>
      <select id="mes-filter">
        <option value="">Todos los meses</option>
      </select>
    </div>
    <div class="control-group">
      <button id="btn-refresh">🔄 Actualizar</button>
    </div>
  </div>

  <!-- KPIs -->
  <div class="kpi-grid">
    <div class="kpi-card neutral">
      <div class="kpi-label">Total Opiniones</div>
      <div class="kpi-value" id="kpi-total">0</div>
    </div>
    <div class="kpi-card good">
      <div class="kpi-label">Buenas</div>
      <div class="kpi-value" id="kpi-good">0</div>
    </div>
    <div class="kpi-card bad">
      <div class="kpi-label">Malas</div>
      <div class="kpi-value" id="kpi-bad">0</div>
    </div>
    <div class="kpi-card neutral">
      <div class="kpi-label">Satisfacción Promedio</div>
      <div class="kpi-value" id="kpi-pct">0%</div>
    </div>
  </div>

  <!-- Grid de Sucursales -->
  <div id="sucursales-container" class="sucursales-grid"></div>

  <!-- Mapa -->
  <div class="map-section">
    <h2>📍 Ubicación de Sucursales</h2>
    <div id="map"></div>
  </div>

  <!-- Histórico -->
  <div class="history-section">
    <h2>📊 Histórico Completo</h2>
    <table class="history-table" id="history-table">
      <thead>
        <tr>
          <th>Sucursal</th>
          <th>Mes</th>
          <th>Buenas</th>
          <th>Malas</th>
          <th>Total</th>
          <th>Satisfacción</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script src="../reviews/reviews-data.js" defer></script>
<script>
// Datos de ubicaciones de sucursales (lat, lng)
const LOCATIONS = {
  'calle-12': { lat: -34.9176, lng: -57.9511, nombre: 'Calle 12' },
  'calle-47': { lat: -34.9198, lng: -57.9564, nombre: 'Calle 47' },
  'calle-49': { lat: -34.9160, lng: -57.9560, nombre: 'Calle 49' },
  'diagonal': { lat: -34.9210, lng: -57.9480, nombre: 'Diagonal 80' },
  'aurelius-12': { lat: -34.9205, lng: -57.9515, nombre: 'Aurelius 12' },
  'aurelius-5': { lat: -34.9225, lng: -57.9505, nombre: 'Aurelius 5' },
  'aurelius-10': { lat: -34.9185, lng: -57.9525, nombre: 'Aurelius 10' },
  'aurelius-cb': { lat: -34.9195, lng: -57.9490, nombre: 'Aurelius CB' },
  'kids': { lat: -34.9170, lng: -57.9470, nombre: 'Kids' },
  'gonnet': { lat: -34.9230, lng: -57.9535, nombre: 'Outlet Gonnet' },
  'plaza-italia': { lat: -34.9145, lng: -57.9545, nombre: 'Plaza Italia' },
  'city-bell': { lat: -34.9140, lng: -57.9455, nombre: 'City Bell' },
  'los-hornos': { lat: -34.9250, lng: -57.9600, nombre: 'Los Hornos' },
  'ensenada': { lat: -34.8550, lng: -57.5090, nombre: 'Ensenada' },
  'berisso': { lat: -34.8620, lng: -57.4890, nombre: 'Berisso' },
  'avenida-44': { lat: -34.9300, lng: -57.9450, nombre: 'Outlet Avenida 44' },
  'adidas-12': { lat: -34.9210, lng: -57.9470, nombre: 'Adidas 12' },
  'adidas-original': { lat: -34.9200, lng: -57.9500, nombre: 'Adidas Original' },
  'outlet-55': { lat: -34.9220, lng: -57.9540, nombre: 'Outlet 55' },
};

let allReviews = {};
let map = null;
let charts = {};

function init() {
  if (!window.REVIEWS_DATA) {
    console.error('⚠️ Reviews data no cargado');
    return;
  }

  allReviews = window.REVIEWS_DATA.sucursales || {};

  // Leer sesión del Portal
  let session = {};
  const isLocal = window.location.protocol === 'file:';
  try {
    const stored = localStorage.getItem('mateu_portal_session');
    if (stored) session = JSON.parse(stored);
  } catch (e) {}

  if (!session.email && !isLocal) {
    try { window.location.href = '../'; } catch(e) {}
    return;
  }

  populateFilters();
  updateKPIs();
  renderSucursales();
  initMap();
  renderHistory();

  // Event listeners
  document.getElementById('suc-filter').addEventListener('change', () => {
    updateKPIs();
    renderSucursales();
    renderHistory();
  });

  document.getElementById('mes-filter').addEventListener('change', () => {
    updateKPIs();
    renderSucursales();
    renderHistory();
  });

  document.getElementById('btn-refresh').addEventListener('click', () => {
    location.reload();
  });
}

function getFilters() {
  return {
    sucursal: document.getElementById('suc-filter').value || null,
    mes: document.getElementById('mes-filter').value || null
  };
}

function populateFilters() {
  // Sucursales
  const sucSelect = document.getElementById('suc-filter');
  Object.entries(allReviews)
    .sort((a, b) => a[1].nombre.localeCompare(b[1].nombre))
    .forEach(([slug, data]) => {
      const opt = document.createElement('option');
      opt.value = slug;
      opt.textContent = data.nombre;
      sucSelect.appendChild(opt);
    });

  // Meses
  const meses = new Set();
  Object.values(allReviews).forEach(data => {
    data.reviews.forEach(r => meses.add(r.mes));
  });

  const mesSelect = document.getElementById('mes-filter');
  Array.from(meses).sort().reverse().forEach(mes => {
    const opt = document.createElement('option');
    opt.value = mes;
    opt.textContent = mes;
    mesSelect.appendChild(opt);
  });
}

function getFilteredData() {
  const filters = getFilters();
  const data = [];

  Object.entries(allReviews).forEach(([slug, sucData]) => {
    if (filters.sucursal && slug !== filters.sucursal) return;

    sucData.reviews.forEach(review => {
      if (filters.mes && review.mes !== filters.mes) return;
      data.push({ slug, ...sucData, ...review });
    });
  });

  return data;
}

function updateKPIs() {
  const data = getFilteredData();

  const total = data.reduce((s, r) => s + r.buenas + r.malas, 0);
  const buenas = data.reduce((s, r) => s + r.buenas, 0);
  const malas = data.reduce((s, r) => s + r.malas, 0);
  const pct = total > 0 ? (buenas / total * 100) : 0;

  document.getElementById('kpi-total').textContent = total.toLocaleString();
  document.getElementById('kpi-good').textContent = buenas.toLocaleString();
  document.getElementById('kpi-bad').textContent = malas.toLocaleString();
  document.getElementById('kpi-pct').textContent = pct.toFixed(1) + '%';
}

function renderSucursales() {
  const container = document.getElementById('sucursales-container');
  container.innerHTML = '';

  const filters = getFilters();
  let entriesToShow = Object.entries(allReviews);

  if (filters.sucursal) {
    entriesToShow = entriesToShow.filter(([slug]) => slug === filters.sucursal);
  }

  entriesToShow.sort((a, b) => a[1].nombre.localeCompare(b[1].nombre));

  entriesToShow.forEach(([slug, data]) => {
    let reviewToShow = data.reviews[data.reviews.length - 1];

    if (filters.mes) {
      reviewToShow = data.reviews.find(r => r.mes === filters.mes) || reviewToShow;
    }

    if (!reviewToShow) return;

    const total = reviewToShow.buenas + reviewToShow.malas;
    const pct = total > 0 ? (reviewToShow.buenas / total * 100) : 0;

    const card = document.createElement('div');
    card.className = 'sucursal-card';
    card.innerHTML = `
      <div class="card-header">
        <h2>${data.nombre}</h2>
        <div class="card-meta">
          <span>${reviewToShow.mes || 'Sin mes'}</span>
          <span id="badge-${slug}" class="badge">Estado</span>
        </div>
      </div>
      <div class="card-body">
        <div class="satisfaction-meter">
          <div class="satisfaction-score">${pct.toFixed(0)}%</div>
          <div class="satisfaction-label">Satisfacción</div>
        </div>

        <div class="progress-bar">
          <div class="progress-fill" style="width: ${pct}%"></div>
        </div>

        <div class="stats-row">
          <div class="stat-item good">
            <div class="stat-label">Buenas</div>
            <div class="stat-value">${reviewToShow.buenas}</div>
          </div>
          <div class="stat-item bad">
            <div class="stat-label">Malas</div>
            <div class="stat-value">${reviewToShow.malas}</div>
          </div>
        </div>

        <div style="font-size: 0.8rem; color: var(--muted); text-align: center; margin-top: 12px;">
          <strong>${(reviewToShow.buenas + reviewToShow.malas).toLocaleString()} opiniones</strong>
        </div>

        <div class="chart-container" id="chart-${slug}"></div>
      </div>
    `;

    container.appendChild(card);

    // Crear gráfico de tendencia
    setTimeout(() => {
      createTrendChart(slug, data);
    }, 100);
  });
}

function createTrendChart(slug, data) {
  const canvas = document.getElementById(`chart-${slug}`);
  if (!canvas || !canvas.parentElement) return;

  const ctx = canvas.getContext('2d') || document.createElement('canvas').getContext('2d');

  const labels = data.reviews.map(r => r.mes).slice(-6);
  const goodData = data.reviews.map(r => r.buenas).slice(-6);
  const badData = data.reviews.map(r => r.malas).slice(-6);

  if (charts[slug]) charts[slug].destroy();

  charts[slug] = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [
        {
          label: 'Buenas',
          data: goodData,
          borderColor: '#10b981',
          backgroundColor: 'rgba(16, 185, 129, 0.1)',
          tension: 0.3,
          fill: true
        },
        {
          label: 'Malas',
          data: badData,
          borderColor: '#ef4444',
          backgroundColor: 'rgba(239, 68, 68, 0.1)',
          tension: 0.3,
          fill: true
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: true, position: 'top' }
      },
      scales: {
        y: { beginAtZero: true }
      }
    }
  });
}

function initMap() {
  // Google Maps placeholder (requiere API key)
  const mapDiv = document.getElementById('map');
  mapDiv.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#888;font-size:16px;">🗺️ Mapa de sucursales (requiere Google Maps API key)</div>';

  // TODO: Integrar con Google Maps API cuando Juli proporcione la key
}

function renderHistory() {
  const data = getFilteredData().sort((a, b) => {
    const mesOrder = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
    const aIdx = mesOrder.indexOf((a.mes || '').toLowerCase());
    const bIdx = mesOrder.indexOf((b.mes || '').toLowerCase());
    return (bIdx >= 0 ? bIdx : 999) - (aIdx >= 0 ? aIdx : 999);
  });

  const tbody = document.querySelector('#history-table tbody');
  tbody.innerHTML = '';

  data.slice(0, 50).forEach(row => {
    const total = row.buenas + row.malas;
    const pct = total > 0 ? (row.buenas / total * 100) : 0;

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><strong>${row.nombre}</strong></td>
      <td>${row.mes || '—'}</td>
      <td><span class="pct-good">${row.buenas}</span></td>
      <td><span class="pct-bad">${row.malas}</span></td>
      <td>${total}</td>
      <td><span class="pct-good"><strong>${pct.toFixed(1)}%</strong></span></td>
    `;
    tbody.appendChild(tr);
  });
}

// Iniciar
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>

</body>
</html>
