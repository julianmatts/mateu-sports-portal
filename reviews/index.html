<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Reseñas de Google · Mateu Sports</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B1527;--navy-mid:#1a2f55;--red:#CC0000;
  --white:#fff;--off:#f5f7fc;--muted:#6B7A99;--muted-light:#b0bcd4;
  --card:#fff;--border:#dce3f0;
  --ok:#16a34a;--ok-bg:#f0fdf4;--warn:#d97706;--warn-bg:#fffbeb;--bad:#dc2626;--bad-bg:#fef2f2;
  --star:#fbbc04;
  --font-d:'Bebas Neue',sans-serif;--font-c:'Barlow Condensed',sans-serif;--font-b:'Barlow',sans-serif;
  --shadow:0 1px 4px rgba(11,21,39,.08);--shadow-md:0 8px 30px rgba(11,21,39,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--off);color:var(--navy);font-family:var(--font-b);min-height:100vh}
img,svg{max-width:100%}
button{font-family:inherit;cursor:pointer}

/* ---------- barra secundaria del shell ---------- */
.msh-subbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:#fff;border-bottom:1px solid var(--border);padding:10px 22px}
.msh-sub-t{font-family:var(--font-c);font-weight:700;font-size:19px;letter-spacing:.3px}
.sub-sp{flex:1}
.sel,.inp{font-family:var(--font-b);font-size:14px;padding:7px 10px;border:1px solid var(--border);
  border-radius:8px;background:#fff;color:var(--navy)}
.sel:focus,.inp:focus{outline:2px solid var(--navy-mid);outline-offset:-1px}
.btn-pres{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:8px 14px;
  font-size:13.5px;font-weight:600}
.btn-pres:hover{background:var(--navy-mid)}

/* ---------- layout ---------- */
.wrap{max-width:1360px;margin:0 auto;padding:22px}
.sec{margin-bottom:26px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sec-h h2{font-family:var(--font-c);font-size:20px;font-weight:700}
.sec-h .hint{color:var(--muted);font-size:13px}

/* ---------- resumen ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
.kpi .lab{font-family:var(--font-c);font-size:13px;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:.6px}
.kpi .val{font-size:32px;font-weight:700;line-height:1.15;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.kpi.acc{border-top:3px solid var(--red)}

/* ---------- ficha de sucursal (estilo ficha de Google) ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;
  box-shadow:var(--shadow);display:flex;flex-direction:column;transition:box-shadow .18s,transform .18s}
.card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.card.mine{border-color:var(--red);border-width:2px}

.c-head{display:flex;align-items:center;gap:11px;padding:14px 16px 12px}
.avatar{width:42px;height:42px;border-radius:50%;flex:0 0 42px;display:grid;place-items:center;
  color:#fff;font-family:var(--font-c);font-weight:700;font-size:16px;letter-spacing:.5px}
.c-name{font-family:var(--font-c);font-size:17.5px;font-weight:700;line-height:1.2}
.c-sub{font-size:12px;color:var(--muted)}
.c-chip{margin-left:auto;font-family:var(--font-c);font-size:11.5px;font-weight:600;
  padding:3px 9px;border-radius:999px;white-space:nowrap;text-transform:uppercase;letter-spacing:.4px}
.chip-ok{background:var(--ok-bg);color:var(--ok)}
.chip-warn{background:var(--warn-bg);color:var(--warn)}
.chip-bad{background:var(--bad-bg);color:var(--bad)}
.chip-none{background:#eef1f7;color:var(--muted)}

.c-score{display:flex;align-items:center;gap:14px;padding:2px 16px 12px}
.score-n{font-size:40px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.score-r .stars{display:block}
.score-r .cap{font-size:12.5px;color:var(--muted);margin-top:3px}

/* estrellas: 5 grises de fondo, encima las ámbar recortadas al % */
.stars{position:relative;display:inline-block;height:17px;line-height:0}
.stars .base,.stars .fill{display:block;height:17px;white-space:nowrap}
.stars .fill{position:absolute;inset:0;overflow:hidden}
.stars svg{height:17px;width:17px;vertical-align:top}

/* barras positivas / negativas */
.bars{padding:0 16px 12px;display:grid;gap:6px}
.bar-row{display:grid;grid-template-columns:64px 1fr 42px;align-items:center;gap:9px;font-size:12.5px}
.bar-row .bl{font-family:var(--font-c);font-weight:600;color:var(--muted)}
.bar-track{display:block;height:9px;border-radius:5px;background:#eef1f7;overflow:hidden}
.bar-fill{display:block;height:100%;border-radius:5px}
.bar-row .bn{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}

.c-foot{margin-top:auto;border-top:1px solid var(--border);padding:11px 16px 13px;
  display:grid;grid-template-columns:1fr 1fr;gap:10px}
.met .ml{font-family:var(--font-c);font-size:11.5px;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:.5px}
.met .mv{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.met .md{font-size:11.5px;font-weight:600}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--muted)}
.spark{grid-column:1/-1;margin-top:2px}
.c-last{grid-column:1/-1;font-size:12px;color:var(--muted);border-top:1px dashed var(--border);
  padding-top:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- tabla ranking ---------- */
.tbl-wrap{background:var(--card);border:1px solid var(--border);border-radius:14px;
  overflow-x:auto;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:var(--navy);color:#fff;font-family:var(--font-c);font-weight:600;font-size:12.5px;
  text-transform:uppercase;letter-spacing:.5px;padding:10px 12px;text-align:left;white-space:nowrap}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
th.srt{cursor:pointer;user-select:none}
th.srt:hover{background:var(--navy-mid)}
td{padding:9px 12px;border-bottom:1px solid var(--border)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--off)}
tbody tr.mine{background:#fff6f6}
td .nm{font-weight:600}
.pos{width:26px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- detalle ---------- */
.ovl{position:fixed;inset:0;background:rgba(11,21,39,.55);display:none;z-index:60;
  padding:24px;overflow:auto}
.ovl.on{display:block}
.dlg{background:#fff;border-radius:16px;max-width:1000px;margin:0 auto;box-shadow:var(--shadow-md);overflow:hidden}
.dlg-h{display:flex;align-items:center;gap:12px;padding:16px 20px;background:var(--navy);color:#fff}
.dlg-h .t{font-family:var(--font-c);font-size:20px;font-weight:700}
.dlg-h .x{margin-left:auto;background:transparent;border:1px solid rgba(255,255,255,.35);
  color:#fff;border-radius:8px;padding:5px 11px;font-size:14px}
.dlg-h .x:hover{background:rgba(255,255,255,.14)}
.dlg-b{padding:20px}
.chart{width:100%;height:230px;display:block}
.lg{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:6px 0 16px}
.lg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.empty{background:var(--card);border:1px dashed var(--border);border-radius:14px;
  padding:34px;text-align:center;color:var(--muted)}
.note{background:#fff;border:1px solid var(--border);border-left:3px solid var(--navy-mid);
  border-radius:10px;padding:12px 15px;font-size:13px;color:var(--muted);margin-top:14px}
.note b{color:var(--navy)}

@media(max-width:640px){
  .wrap{padding:14px}
  .msh-subbar{padding:9px 14px;gap:9px}
  .grid{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .kpi .val{font-size:26px}
  .ovl{padding:0}
  .dlg{border-radius:0;min-height:100%}
}
</style>
<script src="../shared/marca.js"></script>
<script src="../shared/iconos.js" defer></script>
<script src="../shared/header.js" defer></script>
<script src="../shared/notificaciones.js" defer></script>
<script src="reviews-data.js"></script>
</head>
<body>

<!-- Header unificado del shell (shared/header.js). Stubs ocultos por compatibilidad. -->
<div hidden aria-hidden="true"><span id="whoName"></span><span id="whoRole"></span><button id="salir"></button></div>

<div class="msh-subbar">
  <span class="msh-sub-t">Reseñas de Google</span>
  <label for="selMes" style="font-family:var(--font-c);font-weight:600;color:var(--muted)">Mes</label>
  <select class="sel" id="selMes"></select>
  <button class="btn-pres" id="btnPres">📄 Informe del mes</button>
  <span class="sub-sp"></span>
  <input class="inp" id="buscar" placeholder="Buscar sucursal…" style="width:180px">
</div>

<div class="wrap">
  <div class="sec">
    <div class="sec-h"><h2 id="tResumen">Resumen</h2><span class="hint" id="hResumen"></span></div>
    <div class="kpis" id="kpis"></div>
  </div>

  <div class="sec">
    <div class="sec-h"><h2>Por sucursal</h2>
      <span class="hint">Tocá una ficha para ver la evolución completa.</span></div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="sec">
    <div class="sec-h"><h2>Ranking del mes</h2>
      <span class="hint">Ordenado por captación. Tocá una columna para reordenar.</span></div>
    <div class="tbl-wrap"><table id="tabla">
      <thead><tr>
        <th></th><th>Sucursal</th>
        <th class="num srt" data-k="tasa">Captación</th>
        <th class="num srt" data-k="b">Buenas</th>
        <th class="num srt" data-k="m">Malas</th>
        <th class="num srt" data-k="pos">% positivas</th>
        <th class="num srt" data-k="t">Tickets</th>
        <th class="num srt" data-k="total">En Google</th>
        <th>Última opinión</th>
      </tr></thead>
      <tbody></tbody>
    </table></div>
    <div class="note" id="nota"></div>
  </div>
</div>

<div class="ovl" id="ovl">
  <div class="dlg">
    <div class="dlg-h"><span class="t" id="dlgT"></span><button class="x" id="dlgX">Cerrar</button></div>
    <div class="dlg-b" id="dlgB"></div>
  </div>
</div>

<script>
/* ============================================================
   Reseñas de Google por sucursal.
   Los datos salen de reviews-data.js, que genera scripts/gen-reviews.py
   desde el Excel de Iván. Este módulo NO escribe nada.
   ============================================================ */
const $ = id => document.getElementById(id);
const D = window.REVIEWS_DATA || {periodos:[], sucursales:{}};

/* ---- modo presentación ----
   ?pres=YYYY-MM arma el informe del mes en vez de la app. Es PÚBLICO, igual que el
   Reporte Mensual de stock: Iván lo manda por mail y lo tiene que poder abrir
   cualquiera, tenga o no usuario del portal. Por eso el chequeo va ANTES del gate.
   El informe solo muestra agregados del mes; no lista los nombres de quienes dejaron
   reseña, que sí se ven adentro del módulo. */
const PRES = (function(){
  const p = new URLSearchParams(location.search).get('pres');
  return p && /^\d{4}-\d{2}$/.test(p) ? p : null;
})();

/* ---- sesión del Portal (login blando, como el resto de los módulos) ---- */
const SESSION_KEY = 'mateu_portal_session';
let SESSION = null;
try { SESSION = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch(e){}
const ROL = SESSION && SESSION.rol;
const esSucursal = ROL === 'sucursal' || ROL === 'outlet';
const puedeVer = !!SESSION && (ROL === 'admin' || ROL === 'supervisor' || ROL === 'capacitador'
  || esSucursal || (SESSION.herramientas || []).includes('reviews'));
if (!PRES && (!SESSION || !ROL || ROL === 'puesto' || ROL === 'deposito' || !puedeVer))
  location.replace('../');

// Slug de la sucursal del usuario, para destacar su ficha.
const MI_SLUG = SESSION ? (SESSION.outlet_id || SESSION.sucursal || '') : '';

/* ---- helpers ---- */
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio',
               'agosto','septiembre','octubre','noviembre','diciembre'];
const esc = s => String(s == null ? '' : s)
  .replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf = n => (n == null ? '—' : n.toLocaleString('es-AR'));
const pf = (x, d) => (x == null ? '—' : (x * 100).toFixed(d == null ? 1 : d).replace('.', ',') + '%');

function mesLargo(p){
  if (!p) return '';
  const [a, m] = p.split('-');
  const n = MESES[+m - 1] || '';
  return n.charAt(0).toUpperCase() + n.slice(1) + ' ' + a;
}
function mesCorto(p){
  const [a, m] = p.split('-');
  return (MESES[+m - 1] || '').slice(0, 3) + " '" + a.slice(2);
}
function iniciales(nombre){
  const p = nombre.replace(/[^A-Za-zÁÉÍÓÚÑáéíóúñ0-9 ]/g, '').split(/\s+/).filter(Boolean);
  if (p.length === 1) return p[0].slice(0, 2).toUpperCase();
  return (p[0][0] + (p[1][0] || '')).toUpperCase();
}
// Color estable del avatar a partir del nombre (paleta sobria, sin rojo de alerta).
const PALETA = ['#1a2f55','#2b5c8a','#3d6b52','#6b4c8a','#8a5a2b','#4a5568','#7a2f4f','#2f6b6b'];
function colorDe(slug){
  let h = 0;
  for (let i = 0; i < slug.length; i++) h = (h * 31 + slug.charCodeAt(i)) >>> 0;
  return PALETA[h % PALETA.length];
}

/* ---- métricas de una fila ---- */
// b=buenas, m=malas, t=tickets, total=acumulado del local en Google, nuevas=nuevas del mes.
// tasa  = buenas / tickets  → captación: qué proporción de los tickets deja reseña.
//         (es la columna «%» del Excel de Iván)
// pos   = buenas / (buenas+malas) → qué proporción de las reseñas fue positiva.
function met(fila){
  if (!fila) return null;
  const b = fila.b || 0, m = fila.m || 0, t = fila.t || null;
  return {
    b, m, t,
    total: fila.total != null ? fila.total : null,
    nuevas: fila.nuevas != null ? fila.nuevas : null,
    autor: fila.autor || null,
    tasa: t ? b / t : null,
    pos: (b + m) ? b / (b + m) : null
  };
}
function filaDe(slug, p){ const s = D.sucursales[slug]; return s && s.serie[p] ? met(s.serie[p]) : null; }

// Período anterior con dato para esa sucursal.
function periodoPrevio(slug, p){
  const i = D.periodos.indexOf(p);
  for (let k = i - 1; k >= 0; k--) if (D.sucursales[slug].serie[D.periodos[k]]) return D.periodos[k];
  return null;
}

/* ---- estrellas: 5 estrellas rellenas al `pct` (0..1) ---- */
const STAR = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">'
  + '<path d="M12 2.5l2.9 6.06 6.6.88-4.8 4.6 1.2 6.56L12 17.5l-5.9 3.1 1.2-6.56-4.8-4.6 6.6-.88z"/></svg>';
function estrellas(pct){
  if (pct == null) return '<span class="stars" style="color:#dfe4ee"><span class="base">'
    + STAR.repeat(5) + '</span></span>';
  const w = Math.max(0, Math.min(1, pct)) * 100;
  return '<span class="stars" role="img" aria-label="' + pf(pct) + ' de reseñas positivas">'
    + '<span class="base" style="color:#dfe4ee">' + STAR.repeat(5) + '</span>'
    + '<span class="fill" style="color:var(--star);width:' + w.toFixed(2) + '%">'
    + STAR.repeat(5) + '</span></span>';
}

/* ---- sparkline de la captación (SVG, sin librerías) ---- */
function sparkline(slug, hasta, meses){
  const i = D.periodos.indexOf(hasta);
  const ps = D.periodos.slice(Math.max(0, i - (meses || 12) + 1), i + 1);
  const pts = ps.map(p => { const f = filaDe(slug, p); return f && f.tasa != null ? f.tasa : null; });
  const val = pts.filter(v => v != null);
  if (val.length < 2) return '';
  const W = 300, H = 34, max = Math.max.apply(null, val), min = Math.min.apply(null, val);
  const rango = (max - min) || 1;
  const x = k => (pts.length === 1 ? W / 2 : k * W / (pts.length - 1));
  const y = v => H - 3 - ((v - min) / rango) * (H - 8);
  let d = '', abierto = false;
  pts.forEach((v, k) => {
    if (v == null) { abierto = false; return; }
    d += (abierto ? 'L' : 'M') + x(k).toFixed(1) + ' ' + y(v).toFixed(1) + ' ';
    abierto = true;
  });
  const ult = pts.length - 1 - [].concat(pts).reverse().findIndex(v => v != null);
  return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" '
    + 'style="width:100%;height:34px" aria-hidden="true">'
    + '<path d="' + d + '" fill="none" stroke="var(--navy-mid)" stroke-width="2" '
    + 'stroke-linejoin="round" stroke-linecap="round"/>'
    + '<circle cx="' + x(ult).toFixed(1) + '" cy="' + y(pts[ult]).toFixed(1) + '" r="3" fill="var(--red)"/>'
    + '</svg>';
}

/* ---- estado ---- */
let MES = null;
let ORDEN = {k: 'tasa', dir: -1};

function sucursalesVisibles(){
  const q = ($('buscar').value || '').trim().toLowerCase();
  return Object.keys(D.sucursales)
    .filter(s => D.sucursales[s].serie[MES])
    .filter(s => !q || D.sucursales[s].nombre.toLowerCase().includes(q));
}

/* ---- resumen ---- */
function pintarResumen(){
  const slugs = sucursalesVisibles();
  const fs = slugs.map(s => filaDe(s, MES)).filter(Boolean);
  const b = fs.reduce((a, f) => a + f.b, 0);
  const m = fs.reduce((a, f) => a + f.m, 0);
  const t = fs.reduce((a, f) => a + (f.t || 0), 0);
  const enGoogle = fs.reduce((a, f) => a + (f.total || 0), 0);
  const conT = fs.filter(f => f.t);
  const tasa = t ? b / t : null;

  // Comparación con el mes anterior de la cadena (solo sucursales con dato en ambos).
  const prev = D.periodos[D.periodos.indexOf(MES) - 1];
  let dTasa = null;
  if (prev){
    let bp = 0, tp = 0;
    slugs.forEach(s => { const f = filaDe(s, prev); if (f && f.t){ bp += f.b; tp += f.t; } });
    if (tp && tasa != null) dTasa = tasa - bp / tp;
  }
  const flecha = d => d == null ? '' :
    '<span class="' + (d > 0.0005 ? 'up' : d < -0.0005 ? 'down' : 'flat') + '">'
    + (d > 0.0005 ? '▲ +' : d < -0.0005 ? '▼ ' : '') + (d * 100).toFixed(1).replace('.', ',')
    + ' pts vs. mes anterior</span>';

  $('tResumen').textContent = mesLargo(MES);
  $('hResumen').textContent = slugs.length + ' sucursales con datos';
  $('kpis').innerHTML =
    kpi('Reseñas del mes', nf(b + m), (m ? nf(m) + ' negativas' : 'sin reseñas negativas'), true)
  + kpi('Captación', tasa == null ? '—' : pf(tasa),
        conT.length ? flecha(dTasa) || (nf(t) + ' tickets') : 'sin tickets cargados')
  + kpi('Positivas', (b + m) ? pf(b / (b + m)) : '—', nf(b) + ' de ' + nf(b + m) + ' reseñas')
  + kpi('Acumulado en Google', enGoogle ? nf(enGoogle) : '—',
        enGoogle ? 'reseñas históricas del total de sucursales' : 'dato disponible desde mayo 2026');
}
function kpi(lab, val, sub, acc){
  return '<div class="kpi' + (acc ? ' acc' : '') + '"><div class="lab">' + lab + '</div>'
    + '<div class="val">' + val + '</div><div class="sub">' + (sub || '') + '</div></div>';
}

/* ---- fichas ---- */
function pintarGrid(){
  const slugs = sucursalesVisibles().sort((a, b) => {
    const fa = filaDe(a, MES), fb = filaDe(b, MES);
    const ta = fa && fa.tasa != null ? fa.tasa : -1, tb = fb && fb.tasa != null ? fb.tasa : -1;
    if (ta !== tb) return tb - ta;
    return D.sucursales[a].nombre.localeCompare(D.sucursales[b].nombre);
  });

  if (!slugs.length){
    $('grid').innerHTML = '<div class="empty">Ninguna sucursal coincide con la búsqueda.</div>';
    return;
  }

  $('grid').innerHTML = slugs.map(slug => {
    const s = D.sucursales[slug], f = filaDe(slug, MES);
    const prev = periodoPrevio(slug, MES), fp = prev ? filaDe(slug, prev) : null;
    const dTasa = (f.tasa != null && fp && fp.tasa != null) ? f.tasa - fp.tasa : null;
    const totalRes = f.b + f.m;
    const maxBar = Math.max(f.b, f.m, 1);

    // Semáforo por captación: es el KPI que mira Iván. Cuando el mes todavía no
    // trae los tickets (el último suele cargarse después), el chip muestra las
    // reseñas nuevas, que es el dato que sí está.
    let chip;
    if (f.tasa != null){
      const cls = f.tasa >= 0.10 ? 'chip-ok' : f.tasa >= 0.05 ? 'chip-warn' : 'chip-bad';
      chip = '<span class="c-chip ' + cls + '">' + pf(f.tasa) + ' captación</span>';
    } else if (f.nuevas){
      chip = '<span class="c-chip chip-ok">+' + nf(f.nuevas) + ' nuevas</span>';
    } else {
      chip = '<span class="c-chip chip-none">sin tickets</span>';
    }

    const delta = f.tasa == null ? '<span class="md flat">tickets no cargados</span>'
      : dTasa == null ? '<span class="md flat">sin comparación</span>'
      : '<span class="md ' + (dTasa > 0.0005 ? 'up' : dTasa < -0.0005 ? 'down' : 'flat') + '">'
        + (dTasa > 0.0005 ? '▲ +' : dTasa < -0.0005 ? '▼ ' : '± ')
        + (dTasa * 100).toFixed(1).replace('.', ',') + ' pts</span>';

    return '<article class="card' + (slug === MI_SLUG ? ' mine' : '') + '" data-slug="' + slug + '" tabindex="0">'
      + '<div class="c-head">'
        + '<div class="avatar" style="background:' + colorDe(slug) + '">' + esc(iniciales(s.nombre)) + '</div>'
        + '<div><div class="c-name">' + esc(s.nombre) + '</div>'
        + '<div class="c-sub">' + mesLargo(MES) + '</div></div>'
        + chip
      + '</div>'
      + '<div class="c-score">'
        + '<div class="score-n">' + (f.pos == null ? '—' : pf(f.pos, f.m ? 1 : 0)) + '</div>'
        + '<div class="score-r">' + estrellas(f.pos)
        + '<div class="cap">' + nf(totalRes) + (totalRes === 1 ? ' reseña' : ' reseñas') + ' del mes</div></div>'
      + '</div>'
      + '<div class="bars">'
        + barra('Positivas', f.b, maxBar, 'var(--ok)')
        + barra('Negativas', f.m, maxBar, 'var(--bad)')
      + '</div>'
      + '<div class="c-foot">'
        + '<div class="met"><div class="ml">Captación</div>'
          + '<div class="mv">' + (f.tasa == null ? '—' : pf(f.tasa)) + '</div>' + delta + '</div>'
        + '<div class="met"><div class="ml">En Google</div>'
          + '<div class="mv">' + nf(f.total) + '</div>'
          + '<span class="md ' + (f.nuevas ? 'up' : 'flat') + '">'
          + (f.nuevas != null ? '+' + nf(f.nuevas) + ' nuevas' : 'acumulado') + '</span></div>'
        + sparkline(slug, MES)
        + (f.autor ? '<div class="c-last">Última opinión leída · ' + esc(f.autor) + '</div>' : '')
      + '</div>'
      + '</article>';
  }).join('');
}
function barra(lab, n, max, color){
  // Con 0 la barra queda vacía; con 1 sobre un máximo grande igual se ve un hilo.
  const w = max ? (n / max * 100) : 0;
  const est = n ? 'width:' + w.toFixed(1) + '%;min-width:3px;background:' + color : 'width:0';
  return '<div class="bar-row"><span class="bl">' + lab + '</span>'
    + '<span class="bar-track"><span class="bar-fill" style="' + est + '"></span></span>'
    + '<span class="bn">' + nf(n) + '</span></div>';
}

/* ---- ranking ---- */
function pintarTabla(){
  const slugs = sucursalesVisibles();
  const filas = slugs.map(s => ({slug: s, nombre: D.sucursales[s].nombre, f: filaDe(s, MES)}));
  filas.sort((x, y) => {
    const a = x.f[ORDEN.k], b = y.f[ORDEN.k];
    if (a == null && b == null) return x.nombre.localeCompare(y.nombre);
    if (a == null) return 1;
    if (b == null) return -1;
    return a === b ? x.nombre.localeCompare(y.nombre) : (a - b) * ORDEN.dir;
  });

  document.querySelector('#tabla tbody').innerHTML = filas.map((r, i) =>
    '<tr' + (r.slug === MI_SLUG ? ' class="mine"' : '') + ' data-slug="' + r.slug + '">'
    + '<td class="pos">' + (i + 1) + '</td>'
    + '<td class="nm">' + esc(r.nombre) + '</td>'
    + '<td class="num">' + (r.f.tasa == null ? '—' : pf(r.f.tasa)) + '</td>'
    + '<td class="num">' + nf(r.f.b) + '</td>'
    + '<td class="num"' + (r.f.m ? ' style="color:var(--bad);font-weight:700"' : '') + '>' + nf(r.f.m) + '</td>'
    + '<td class="num">' + (r.f.pos == null ? '—' : pf(r.f.pos)) + '</td>'
    + '<td class="num">' + nf(r.f.t) + '</td>'
    + '<td class="num">' + nf(r.f.total) + '</td>'
    + '<td>' + esc(r.f.autor || '—') + '</td></tr>').join('');
}

/* ---- detalle: evolución completa de una sucursal ---- */
function abrirDetalle(slug){
  const s = D.sucursales[slug];
  const ps = D.periodos.filter(p => s.serie[p]);
  const fs = ps.map(p => ({p, f: met(s.serie[p])}));

  $('dlgT').textContent = s.nombre;
  $('dlgB').innerHTML =
      grafico(fs)
    + '<div class="lg"><span><i style="background:var(--ok)"></i>Reseñas positivas</span>'
    + '<span><i style="background:var(--bad)"></i>Negativas</span>'
    + '<span><i style="background:var(--navy-mid)"></i>Captación (reseñas ÷ tickets)</span></div>'
    + '<div class="tbl-wrap"><table><thead><tr>'
    + '<th>Mes</th><th class="num">Buenas</th><th class="num">Malas</th>'
    + '<th class="num">Tickets</th><th class="num">Captación</th>'
    + '<th class="num">En Google</th><th>Última opinión</th></tr></thead><tbody>'
    + fs.slice().reverse().map(r =>
        '<tr><td class="nm">' + mesLargo(r.p) + '</td>'
        + '<td class="num">' + nf(r.f.b) + '</td>'
        + '<td class="num"' + (r.f.m ? ' style="color:var(--bad);font-weight:700"' : '') + '>' + nf(r.f.m) + '</td>'
        + '<td class="num">' + nf(r.f.t) + '</td>'
        + '<td class="num">' + (r.f.tasa == null ? '—' : pf(r.f.tasa)) + '</td>'
        + '<td class="num">' + nf(r.f.total) + '</td>'
        + '<td>' + esc(r.f.autor || '—') + '</td></tr>').join('')
    + '</tbody></table></div>';
  $('ovl').classList.add('on');
  document.body.style.overflow = 'hidden';
}

// Barras apiladas de reseñas + línea de captación, en un solo SVG.
function grafico(fs){
  const W = 940, H = 230, ml = 42, mr = 44, mt = 14, mb = 34;
  const iw = W - ml - mr, ih = H - mt - mb;
  const maxR = Math.max(1, ...fs.map(r => r.f.b + r.f.m));
  const tasas = fs.map(r => r.f.tasa).filter(v => v != null);
  const maxT = tasas.length ? Math.max.apply(null, tasas) : 0;
  const bw = Math.max(4, Math.min(30, iw / fs.length * 0.62));
  const x = i => ml + (fs.length === 1 ? iw / 2 : i * iw / (fs.length - 1));
  const yR = v => mt + ih - (v / maxR) * ih;
  const yT = v => mt + ih - (maxT ? (v / maxT) * ih : 0);

  let g = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">';
  // guías horizontales
  for (let k = 0; k <= 4; k++){
    const y = mt + ih - k * ih / 4;
    g += '<line x1="' + ml + '" y1="' + y + '" x2="' + (W - mr) + '" y2="' + y
      + '" stroke="#eef1f7" stroke-width="1"/>'
      + '<text x="' + (ml - 7) + '" y="' + (y + 4) + '" text-anchor="end" font-size="10" '
      + 'fill="#6B7A99" font-family="Barlow">' + Math.round(maxR * k / 4) + '</text>';
    if (maxT) g += '<text x="' + (W - mr + 7) + '" y="' + (y + 4) + '" font-size="10" '
      + 'fill="#1a2f55" font-family="Barlow">' + (maxT * k / 4 * 100).toFixed(0) + '%</text>';
  }
  // barras
  fs.forEach((r, i) => {
    const cx = x(i) - bw / 2, tot = r.f.b + r.f.m;
    const hB = (r.f.b / maxR) * ih, hM = (r.f.m / maxR) * ih;
    if (tot) g += '<rect x="' + cx.toFixed(1) + '" y="' + yR(tot).toFixed(1) + '" width="' + bw.toFixed(1)
      + '" height="' + hM.toFixed(1) + '" fill="#dc2626"/>'
      + '<rect x="' + cx.toFixed(1) + '" y="' + (yR(tot) + hM).toFixed(1) + '" width="' + bw.toFixed(1)
      + '" height="' + hB.toFixed(1) + '" fill="#16a34a" opacity=".85"/>';
    if (i % Math.ceil(fs.length / 13) === 0 || i === fs.length - 1)
      g += '<text x="' + x(i).toFixed(1) + '" y="' + (H - 12) + '" text-anchor="middle" font-size="10" '
        + 'fill="#6B7A99" font-family="Barlow">' + mesCorto(r.p) + '</text>';
  });
  // línea de captación
  let d = '', abierto = false;
  fs.forEach((r, i) => {
    if (r.f.tasa == null) { abierto = false; return; }
    d += (abierto ? 'L' : 'M') + x(i).toFixed(1) + ' ' + yT(r.f.tasa).toFixed(1) + ' ';
    abierto = true;
  });
  if (d) g += '<path d="' + d + '" fill="none" stroke="#1a2f55" stroke-width="2.2" '
    + 'stroke-linejoin="round" stroke-linecap="round"/>';
  fs.forEach((r, i) => {
    if (r.f.tasa != null)
      g += '<circle cx="' + x(i).toFixed(1) + '" cy="' + yT(r.f.tasa).toFixed(1)
        + '" r="2.6" fill="#fff" stroke="#1a2f55" stroke-width="1.6"/>';
  });
  return g + '</svg>';
}

/* ============================================================
   INFORME MENSUAL  —  ?pres=YYYY-MM
   Deck que Iván manda por mail la primera semana de cada mes.
   Mismo lenguaje visual que el Reporte Mensual de stock
   (gestion-stock/?pres=): tapa a pantalla completa, nav con
   progreso, secciones numeradas, números en Saira itálica,
   reveal por IntersectionObserver e impresión con todo visible.
   Se escribe como documento completo (document.write), así que
   el HTML generado es autosuficiente: no hereda nada de acá.
   ============================================================ */

// Agregado de la cadena para un mes: totales + una fila por sucursal con su variación.
function presDatos(p){
  const prev = D.periodos[D.periodos.indexOf(p) - 1] || null;
  const filas = Object.keys(D.sucursales)
    .filter(s => D.sucursales[s].serie[p])
    .map(s => {
      const f = filaDe(s, p);
      const pp = periodoPrevio(s, p), fp = pp ? filaDe(s, pp) : null;
      return {
        slug: s, nombre: D.sucursales[s].nombre, f: f, prev: fp,
        dTasa: (f.tasa != null && fp && fp.tasa != null) ? f.tasa - fp.tasa : null
      };
    });

  const tot = filas.reduce((a, r) => ({
    b: a.b + r.f.b, m: a.m + r.f.m,
    t: a.t + (r.f.t || 0), google: a.google + (r.f.total || 0),
    nuevas: a.nuevas + (r.f.nuevas || 0)
  }), {b:0, m:0, t:0, google:0, nuevas:0});
  tot.tasa = tot.t ? tot.b / tot.t : null;
  tot.pos = (tot.b + tot.m) ? tot.b / (tot.b + tot.m) : null;

  let tasaPrev = null;
  if (prev){
    let bp = 0, tp = 0;
    filas.forEach(r => { const g = filaDe(r.slug, prev); if (g && g.t){ bp += g.b; tp += g.t; } });
    if (tp) tasaPrev = bp / tp;
  }
  tot.dTasa = (tot.tasa != null && tasaPrev != null) ? tot.tasa - tasaPrev : null;

  // El informe sale la primera semana del mes siguiente, cuando el mes recién
  // cerrado puede no tener todavía la columna de tickets. Sin tickets no hay
  // captación, así que se ordena por reseñas recibidas, que sí están.
  const modo = filas.some(r => r.f.tasa != null) ? 'tasa' : 'vol';
  return {p, prev, filas, tot, modo};
}

// Serie de la captación de la cadena, para la sparkline y el gráfico de barras.
function presSerie(hasta, meses){
  const i = D.periodos.indexOf(hasta);
  return D.periodos.slice(Math.max(0, i - (meses || 12) + 1), i + 1).map(p => {
    let b = 0, t = 0, r = 0;
    Object.keys(D.sucursales).forEach(s => {
      const f = filaDe(s, p);
      if (!f) return;
      r += f.b + f.m;
      if (f.t){ b += f.b; t += f.t; }
    });
    return {p, tasa: t ? b / t : null, resenas: r};
  });
}

function presUrl(p){
  return location.origin + location.pathname.replace(/[^/]*$/, '') + '?pres=' + p;
}

/* ---- resumen en texto, para pegar en el mail ---- */
function presTexto(dd){
  const L = [];
  const hayT = dd.modo === 'tasa';
  const val = r => hayT ? r.f.tasa : (r.f.b + r.f.m);
  const fmtV = v => hayT ? pf(v) : nf(v);
  const dif = r => hayT ? r.dTasa : (r.prev ? (r.f.b + r.f.m) - (r.prev.b + r.prev.m) : null);
  const umbral = hayT ? 0.005 : 0.5;
  const pts = d => (d >= 0 ? '+' : '') + (hayT
    ? (d * 100).toFixed(1).replace('.', ',') + ' pts'
    : nf(d) + (Math.abs(d) === 1 ? ' reseña' : ' reseñas'));

  L.push('RESEÑAS DE GOOGLE · ' + mesLargo(dd.p).toUpperCase());
  L.push('');
  L.push('Reseñas del mes: ' + nf(dd.tot.b + dd.tot.m)
    + (dd.tot.m ? ' (' + nf(dd.tot.m) + ' negativas)' : ' · ninguna negativa'));
  if (dd.tot.tasa != null){
    L.push('Captación: ' + pf(dd.tot.tasa) + ' de los tickets'
      + (dd.tot.dTasa != null
        ? ' (' + (dd.tot.dTasa >= 0 ? '+' : '') + (dd.tot.dTasa * 100).toFixed(1).replace('.', ',')
          + ' pts vs. ' + mesLargo(dd.prev) + ')' : ''));
  }
  if (dd.tot.google) L.push('Acumulado en Google: ' + nf(dd.tot.google) + ' reseñas');
  L.push('');

  const orden = dd.filas.slice().sort((a, b) => val(b) - val(a));
  if (orden.length){
    L.push(hayT ? 'MEJORES DEL MES (captación)' : 'MEJORES DEL MES (reseñas recibidas)');
    orden.slice(0, 5).forEach((r, i) =>
      L.push('  ' + (i + 1) + '. ' + r.nombre + ' — ' + fmtV(val(r))));
    L.push('');
    const suben = dd.filas.filter(r => dif(r) != null && dif(r) > umbral)
      .sort((a, b) => dif(b) - dif(a)).slice(0, 5);
    const bajan = dd.filas.filter(r => dif(r) != null && dif(r) < -umbral)
      .sort((a, b) => dif(a) - dif(b)).slice(0, 5);
    if (suben.length){
      L.push('SUBIERON');
      suben.forEach(r => L.push('  ' + r.nombre + ' ' + pts(dif(r))));
      L.push('');
    }
    if (bajan.length){
      L.push('BAJARON');
      bajan.forEach(r => L.push('  ' + r.nombre + ' ' + pts(dif(r))));
      L.push('');
    }
  }
  const conM = dd.filas.filter(r => r.f.m > 0).sort((a, b) => b.f.m - a.f.m);
  if (conM.length){
    L.push('CON RESEÑAS NEGATIVAS');
    conM.forEach(r => L.push('  ' + r.nombre + ': ' + r.f.m
      + (r.f.m === 1 ? ' reseña' : ' reseñas')));
    L.push('');
  }
  L.push('Informe completo: ' + presUrl(dd.p));
  return L.join('\n');
}

/* ---- sparkline para el KPI ---- */
function presSpark(vals){
  const v = vals.filter(x => x != null);
  if (v.length < 2) return '';
  const W = 220, H = 44, max = Math.max.apply(null, v), min = Math.min.apply(null, v);
  const r = (max - min) || 1;
  const x = i => i * W / (vals.length - 1);
  const y = t => 40 - ((t - min) / r) * 32;
  let d = '', area = '', abierto = false, ux = 0, uy = 0;
  vals.forEach((t, i) => {
    if (t == null) { abierto = false; return; }
    d += (abierto ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(t).toFixed(1) + ' ';
    abierto = true; ux = x(i); uy = y(t);
  });
  area = d ? d + 'L' + ux.toFixed(1) + ' ' + H + ' L0 ' + H + ' Z' : '';
  return '<div class="kpi-sp"><svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">'
    + '<path class="sp-a" d="' + area + '"/><path class="sp-l" d="' + d + '"/>'
    + '<circle class="sp-d" cx="' + ux.toFixed(1) + '" cy="' + uy.toFixed(1) + '" r="2.6"/></svg></div>';
}

/* ---- gráfico de barras de la evolución ---- */
function presGrafico(serie){
  const val = serie.filter(s => s.tasa != null);
  if (val.length < 2) return '';
  const max = Math.max.apply(null, val.map(s => s.tasa));
  const W = 1140, H = 300, ml = 46, mr = 16, mt = 22, mb = 40;
  const iw = W - ml - mr, ih = H - mt - mb;
  const paso = iw / serie.length;
  const bw = Math.min(56, paso * 0.6);

  let g = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet" role="img" '
    + 'aria-label="Captación mensual del total de sucursales">';
  for (let k = 0; k <= 4; k++){
    const y = mt + ih - k * ih / 4;
    g += '<line x1="' + ml + '" y1="' + y + '" x2="' + (W - mr) + '" y2="' + y + '" stroke="#E5E9F2"/>'
      + '<text x="' + (ml - 8) + '" y="' + (y + 4) + '" text-anchor="end" font-size="11" fill="#8A93A8" '
      + 'font-family="Barlow Condensed">' + (max * k / 4 * 100).toFixed(0) + '%</text>';
  }
  serie.forEach((s, k) => {
    const cx = ml + (k + 0.5) * paso;
    if (s.tasa != null){
      const h = (s.tasa / max) * ih, ult = k === serie.length - 1;
      g += '<rect x="' + (cx - bw / 2).toFixed(1) + '" y="' + (mt + ih - h).toFixed(1)
        + '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="2" fill="'
        + (ult ? '#CC0000' : '#0B1527') + '" opacity="' + (ult ? 1 : .8) + '"/>'
        + '<text x="' + cx.toFixed(1) + '" y="' + (mt + ih - h - 7).toFixed(1) + '" text-anchor="middle" '
        + 'font-size="12" fill="#0B1527" font-family="Saira" font-style="italic" font-weight="800">'
        + (s.tasa * 100).toFixed(1).replace('.', ',') + '</text>';
    }
    g += '<text x="' + cx.toFixed(1) + '" y="' + (H - 14) + '" text-anchor="middle" font-size="11" '
      + 'fill="#8A93A8" font-family="Barlow Condensed" letter-spacing="1">'
      + mesCorto(s.p).toUpperCase() + '</text>';
  });
  return '<div class="chart rv">' + g + '</svg></div>';
}

/* ---- el documento del informe ---- */
function presHtml(p){
  const dd = presDatos(p), T = dd.tot, hayT = dd.modo === 'tasa';
  const val = r => hayT ? r.f.tasa : (r.f.b + r.f.m);
  const fmtV = v => hayT ? pf(v) : nf(v);
  const dif = r => hayT ? r.dTasa : (r.prev ? (r.f.b + r.f.m) - (r.prev.b + r.prev.m) : null);
  const umbral = hayT ? 0.005 : 0.5;
  const pts = d => (d >= 0 ? '+' : '−') + (hayT
    ? Math.abs(d * 100).toFixed(1).replace('.', ',') + ' pts'
    : nf(Math.abs(d)));
  const chip = d => d == null ? '<span class="chip cz">—</span>'
    : '<span class="chip ' + (d > umbral ? 'cp' : d < -umbral ? 'cn' : 'cz') + '">'
      + (d > umbral ? '▲ ' : d < -umbral ? '▼ ' : '= ') + pts(d) + '</span>';

  const orden = dd.filas.slice().sort((a, b) => val(b) - val(a));
  const maxV = orden.length ? val(orden[0]) : 0;
  const suben = dd.filas.filter(r => dif(r) != null && dif(r) > umbral)
    .sort((a, b) => dif(b) - dif(a)).slice(0, 5);
  const bajan = dd.filas.filter(r => dif(r) != null && dif(r) < -umbral)
    .sort((a, b) => dif(a) - dif(b)).slice(0, 5);
  const conM = dd.filas.filter(r => r.f.m > 0).sort((a, b) => b.f.m - a.f.m);
  const serie = presSerie(p, 12);
  const logo = '<img class="%C%" src="' + LOGO + '" alt="Mateu Sports">';
  const lg = c => logo.replace('%C%', c);

  // KPI: el número grande se anima con countUp (data-n / data-dec / data-suf).
  // El valor final va escrito en el HTML, no vacío: si el conteo no llega a correr
  // (sin JS, pestaña en segundo plano, navegador viejo) el informe igual muestra el
  // número correcto en vez de quedarse en cero.
  const fmtNum = (n, dec, suf) => n.toLocaleString('es-AR',
    {minimumFractionDigits: dec, maximumFractionDigits: dec}) + (suf || '');
  const kpi = (icono, lab, n, dec, suf, delta, sub, spark) =>
    '<div class="kpi rv"><div class="kpi-i">' + icono + '</div>'
    + '<div class="kpi-l">' + lab + '</div>'
    + '<div class="kpi-v"><span class="num cu" data-n="' + (n == null ? '' : n) + '" data-dec="' + dec
    + '" data-suf="' + (suf || '') + '">' + (n == null ? '—' : fmtNum(n, dec, suf)) + '</span></div>'
    + (delta ? '<div class="kpi-d">' + delta + '</div>' : '')
    + '<div class="kpi-s">' + sub + '</div>' + (spark || '') + '</div>';

  const barra = (r, i, clase, valor, ancho) =>
    '<div class="hb rv" style="--d:' + (i * 60) + 'ms"><span class="hb-n">' + (i + 1) + '</span>'
    + '<span class="hb-l">' + esc(r.nombre) + '</span>'
    + '<span class="hb-t"><i class="hb-f ' + clase + '" style="--w:' + ancho + '%"></i></span>'
    + '<span class="hb-v">' + valor + '</span></div>';

  const secciones =
    /* 01 · resumen */
    '<section id="resumen" class="alt"><div class="wrap blk">'
    + '<div class="sec-h"><div><div class="sec-lbl">Resumen · 01</div>'
    + '<h2 class="sec-t">Los <em>números</em> del mes</h2></div>' + lg('sec-logo') + '</div>'
    + '<div class="kpis">'
      + kpi('01', 'Reseñas del mes', T.b + T.m, 0, '',
          T.m ? '<span class="c-red">' + nf(T.m) + ' negativas</span>'
              : '<span class="c-grn">Ninguna negativa</span>',
          'Suman lo que recibieron las ' + dd.filas.length + ' sucursales.',
          presSpark(serie.map(s => s.resenas)))
      + kpi('02', 'Captación', T.tasa == null ? null : T.tasa * 100, 1, '%',
          T.dTasa != null ? '<span class="chip ' + (T.dTasa > 0.0005 ? 'cp' : T.dTasa < -0.0005 ? 'cn' : 'cz')
            + '">' + (T.dTasa > 0.0005 ? '▲ +' : T.dTasa < -0.0005 ? '▼ −' : '= ')
            + Math.abs(T.dTasa * 100).toFixed(1).replace('.', ',') + ' pts</span> vs. ' + mesLargo(dd.prev) : '',
          T.t ? 'Reseñas buenas sobre ' + nf(T.t) + ' tickets.' : 'Sin tickets cargados todavía.',
          presSpark(serie.map(s => s.tasa)))
      + kpi('03', 'Positivas', T.pos == null ? null : T.pos * 100, 1, '%', '',
          nf(T.b) + ' de ' + nf(T.b + T.m) + ' reseñas fueron buenas.')
      + kpi('04', 'En Google', T.google || null, 0, '',
          T.nuevas ? '<span class="chip cp">+' + nf(T.nuevas) + ' nuevas</span>' : '',
          T.google ? 'Reseñas acumuladas de todos los locales.' : 'Se carga desde mayo 2026.')
    + '</div>'
    + '<div class="trend">Tendencia · últimos ' + serie.length + ' meses</div>'
    + '<p class="sec-p rv" style="margin-top:34px;margin-bottom:0"><b>Captación</b> es cuántas de las '
    + 'compras terminan en una reseña (reseñas buenas ÷ tickets emitidos): mide cuánto se está pidiendo '
    + 'la reseña en el mostrador. <b>Positivas</b> es la calidad de lo que llega.</p>'
    + '</div></section>'

    /* 02 · ranking */
    + (orden.length ? '<section id="ranking"><div class="wrap blk">'
      + '<div class="sec-h"><div><div class="sec-lbl">Ranking · 02</div>'
      + '<h2 class="sec-t">Quién <em>capta</em> más</h2></div>' + lg('sec-logo') + '</div>'
      + (hayT ? '' : '<p class="sec-p">' + mesLargo(p) + ' todavía no tiene cargada la cantidad de '
          + 'tickets, así que el ranking va por reseñas recibidas. Cuando se cargue esa columna en la '
          + 'planilla, este mismo informe pasa a ordenar por captación.</p>')
      + '<div class="panels">'
        + '<div class="panel rv"><div class="panel-t">Las cinco primeras<em>'
          + (hayT ? 'captación' : 'reseñas') + '</em></div>'
          + orden.slice(0, 5).map((r, i) => barra(r, i, 'f-nav', fmtV(val(r)),
              maxV ? (val(r) / maxV * 100).toFixed(1) : 0)).join('')
        + '</div>'
        + '<div class="panel rv"><div class="panel-t">Las cinco últimas<em>'
          + (hayT ? 'captación' : 'reseñas') + '</em></div>'
          + orden.slice(-5).reverse().map((r, i) => barra(r, i, 'f-non', fmtV(val(r)),
              maxV ? (val(r) / maxV * 100).toFixed(1) : 0)).join('')
        + '</div>'
      + '</div>'
      + '<div class="tbl rv"><table><thead><tr>'
        + '<th class="L">Sucursal</th>'
        + '<th>' + (hayT ? 'Captación' : 'Reseñas') + '<span class="th-sub">'
          + (hayT ? 'reseñas ÷ tickets' : 'del mes') + '</span></th>'
        + '<th>Variación<span class="th-sub">vs. ' + (dd.prev ? mesLargo(dd.prev) : 'mes anterior') + '</span></th>'
        + (hayT ? '<th>Reseñas<span class="th-sub">del mes</span></th>'
                + '<th>Tickets<span class="th-sub">emitidos</span></th>' : '')
        + '<th>Negativas<span class="th-sub">del mes</span></th>'
        + '<th>En Google<span class="th-sub">acumuladas</span></th>'
      + '</tr></thead><tbody>'
      + orden.map((r, i) => '<tr class="rv" style="--d:' + Math.min(i * 40, 600) + 'ms">'
          + '<td class="L"><i class="cod">' + (i + 1) + '</i>' + esc(r.nombre) + '</td>'
          + '<td class="nc">' + fmtV(val(r))
            + '<i class="cb" style="--w:' + (maxV ? (val(r) / maxV * 100).toFixed(1) : 0) + '%"></i></td>'
          + '<td>' + chip(dif(r)) + '</td>'
          + (hayT ? '<td class="nc">' + nf(r.f.b + r.f.m) + '</td>'
                  + '<td class="nc">' + nf(r.f.t) + '</td>' : '')
          + '<td class="nc"' + (r.f.m ? ' style="color:var(--rojo)"' : ' class="nc dim"') + '>'
            + (r.f.m || '—') + '</td>'
          + '<td class="nc">' + nf(r.f.total) + '</td></tr>').join('')
      + '</tbody></table></div>'
      + '<div class="tl rv"><span><i class="chip cp">▲</i> mejoró contra el mes anterior</span>'
      + '<span><i class="chip cn">▼</i> bajó</span>'
      + '<span><i class="chip cz">=</i> sin cambios</span></div>'
      + '</div></section>' : '')

    /* 03 · lo que cambió */
    + ((suben.length || bajan.length) ? '<section id="cambios" class="alt"><div class="wrap blk">'
      + '<div class="sec-h"><div><div class="sec-lbl">Movimiento · 03</div>'
      + '<h2 class="sec-t">Lo que <em>cambió</em></h2></div>' + lg('sec-logo') + '</div>'
      + '<p class="sec-p">Contra ' + (dd.prev ? mesLargo(dd.prev) : 'el mes anterior') + '.</p>'
      + '<div class="panels" style="margin-bottom:0">'
        + '<div class="panel rv"><div class="panel-t">Subieron<em>' + suben.length + '</em></div>'
          + (suben.length ? suben.map((r, i) => barra(r, i, 'f-grn', pts(dif(r)),
              Math.abs(dif(r)) / Math.abs(dif(suben[0])) * 100)).join('')
            : '<p class="sec-p" style="margin:0">Ninguna mejoró de forma significativa.</p>') + '</div>'
        + '<div class="panel rv"><div class="panel-t">Bajaron<em>' + bajan.length + '</em></div>'
          + (bajan.length ? bajan.map((r, i) => barra(r, i, 'f-red', pts(dif(r)),
              Math.abs(dif(r)) / Math.abs(dif(bajan[0])) * 100)).join('')
            : '<p class="sec-p" style="margin:0">Ninguna cayó de forma significativa.</p>') + '</div>'
      + '</div></div></section>' : '')

    /* 04 · negativas */
    + '<section id="negativas"><div class="wrap blk">'
      + '<div class="sec-h"><div><div class="sec-lbl">Atención · 04</div>'
      + '<h2 class="sec-t">Reseñas <em>negativas</em></h2></div>' + lg('sec-logo') + '</div>'
      + (conM.length
        ? '<p class="sec-p">' + nf(T.m) + ' de las ' + nf(T.b + T.m) + ' reseñas del mes fueron '
          + 'negativas (' + pf(1 - T.pos, 2) + ').</p>'
          + '<div class="negs">' + conM.map((r, i) => '<div class="ng rv" style="--d:' + (i * 60)
            + 'ms"><b>' + nf(r.f.m) + '</b><span>' + esc(r.nombre) + '</span></div>').join('') + '</div>'
        : '<div class="limpio rv">✓ Ninguna sucursal recibió reseñas negativas este mes</div>')
    + '</div></section>'

    /* 05 · evolución */
    + (presGrafico(serie) ? '<section id="evolucion" class="alt"><div class="wrap blk">'
      + '<div class="sec-h"><div><div class="sec-lbl">Evolución · 05</div>'
      + '<h2 class="sec-t">Cómo viene la <em>captación</em></h2></div>' + lg('sec-logo') + '</div>'
      + '<p class="sec-p">Captación mensual del total de sucursales. La barra roja es '
      + mesLargo(p) + '.</p>' + presGrafico(serie)
      + '</div></section>' : '');

  const script = '(function(){'
    + 'var nav=document.getElementById("nv"),prog=document.getElementById("pb");'
    + 'function sy(){return window.scrollY||document.documentElement.scrollTop||document.body.scrollTop||0;}'
    + 'function onScroll(){nav.classList.toggle("scrolled",sy()>40);'
    + 'var h=document.documentElement,max=h.scrollHeight-h.clientHeight;'
    + 'prog.style.width=(max>0?sy()/max*100:0)+"%";red();}'
    + 'window.addEventListener("scroll",onScroll,true);'
    + 'function each(sel,ctx,fn){var l=(ctx||document).querySelectorAll(sel);for(var i=0;i<l.length;i++)fn(l[i],i);}'
    + 'var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;'
    + 'function fmt(v,d){return v.toLocaleString("es-AR",{minimumFractionDigits:d,maximumFractionDigits:d});}'
    // El texto que ya trae el span es el valor final; la animación solo lo recorre.
    // Si no llega a terminar (sin frames, pestaña oculta), a los 1,8 s se escribe igual.
    + 'function countUp(el){if(el.dataset.done)return;el.dataset.done=1;'
    + 'var fin=el.textContent;if(el.dataset.n==="")return;'
    + 'var n=parseFloat(el.dataset.n)||0,d=parseInt(el.dataset.dec,10)||0,s=el.dataset.suf||"";'
    + 'if(reduce||!n||!window.requestAnimationFrame){el.textContent=fin;return;}'
    + 'var t0=null,dur=1300,listo=false;function step(t){if(!t0)t0=t;'
    + 'var q=Math.min(1,(t-t0)/dur);q=1-Math.pow(1-q,3);'
    + 'if(q>=1){el.textContent=fin;listo=true;}else{el.textContent=fmt(n*q,d)+s;requestAnimationFrame(step);}}'
    + 'el.textContent=fmt(0,d)+s;requestAnimationFrame(step);'
    + 'setTimeout(function(){if(!listo)el.textContent=fin;},1800);}'
    + 'function reveal(el){el.classList.add("on");each(".cu",el,countUp);}'
    // Red de seguridad: el informe se manda por mail y se abre en cualquier navegador,
    // así que un bloque nunca puede quedar en opacity:0. Si el observer no llegó a
    // dispararlo, esto lo revela igual al entrar en pantalla (y a los 1,2 s de cargar).
    + 'function red(){each(".blk",null,function(el){if(!el.classList.contains("on")&&'
    + 'el.getBoundingClientRect().top<(window.innerHeight||600)*0.92)reveal(el);});}'
    + 'var links=document.querySelectorAll(".nav-links a[href^=\\"#\\"]");'
    + 'function setActive(id){for(var i=0;i<links.length;i++)'
    + 'links[i].classList.toggle("act",links[i].getAttribute("href")==="#"+id);}'
    + 'if(window.IntersectionObserver&&!reduce){'
    + 'var obs=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){'
    + 'reveal(e.target);obs.unobserve(e.target);}});},{threshold:0.08,rootMargin:"0px 0px -6% 0px"});'
    + 'each(".blk",null,function(el){obs.observe(el);});'
    + 'var nobs=new IntersectionObserver(function(es){es.forEach(function(e){'
    + 'if(e.isIntersecting)setActive(e.target.id);});},{threshold:0.35});'
    + 'each("section[id]",null,function(el){nobs.observe(el);});'
    + '}else{each(".blk",null,function(el){reveal(el);});}'
    + 'onScroll();setTimeout(red,1200);'
    + 'var TXT=' + JSON.stringify(presTexto(dd)) + ',URL=' + JSON.stringify(presUrl(p)) + ';'
    + 'function copiar(t,b,o){function ok(){b.textContent="✓ Copiado";'
    + 'setTimeout(function(){b.textContent=o;},1800);}'
    + 'if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,fb);}else fb();'
    + 'function fb(){var a=document.createElement("textarea");a.value=t;a.style.position="fixed";'
    + 'a.style.opacity="0";document.body.appendChild(a);a.select();'
    + 'try{document.execCommand("copy");ok();}catch(e){prompt("Copiá el texto:",t);}'
    + 'document.body.removeChild(a);}}'
    + 'document.getElementById("bImp").onclick=function(){window.print();};'
    + 'document.getElementById("bLnk").onclick=function(){copiar(URL,this,"🔗 Copiar link");};'
    + 'document.getElementById("bTxt").onclick=function(){copiar(TXT,this,"⧉ Resumen para el mail");};'
    + '})();';

  return '<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">'
    + '<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">'
    + '<title>Reseñas de Google — Mateu Sports · ' + esc(mesLargo(p)) + '</title>'
    + '<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;500;600;700'
    + '&family=Barlow:wght@300;400;500;600&family=Saira:ital,wght@1,700;1,800&display=swap" rel="stylesheet">'
    + '<style>' + PRES_CSS + '</style></head><body>'

    + '<nav id="nv">' + lg('nav-logo') + '<ul class="nav-links">'
      + '<li><a href="#portada">Inicio</a></li><li><a href="#resumen">Resumen</a></li>'
      + (orden.length ? '<li><a href="#ranking">Ranking</a></li>' : '')
      + ((suben.length || bajan.length) ? '<li><a href="#cambios">Cambios</a></li>' : '')
      + '<li><a href="#negativas">Negativas</a></li>'
      + (presGrafico(serie) ? '<li><a href="#evolucion">Evolución</a></li>' : '')
      + '<li><a class="back" href="./">← Volver al módulo</a></li>'
    + '</ul><div class="prog"><i id="pb"></i></div></nav>'

    + '<section id="portada" style="padding:0"><div id="hero">'
      + '<div class="hero-bg"></div><div class="hero-grid"></div>'
      + '<div class="hero-diag"></div><div class="hero-stripe"></div>'
      + '<div class="hero-badge">Mateu Sports · Reseñas de Google</div>'
      + '<h1 class="hero-title">Reseñas<br>de <em>Google</em></h1>'
      + '<div class="hero-mes">' + esc(mesLargo(p))
        + '<span>Resumen · Ranking · Cambios · Negativas · Evolución</span></div>'
      + '<div class="hero-chips">'
        + '<span><b>' + nf(T.b + T.m) + '</b> reseñas</span>'
        + (T.tasa != null ? '<span><b>' + pf(T.tasa) + '</b> captación</span>' : '')
        + '<span><b>' + dd.filas.length + '</b> sucursales</span>'
        + (T.google ? '<span><b>' + nf(T.google) + '</b> en Google</span>' : '')
      + '</div>'
      + lg('hero-logo')
      + '<div class="hero-logo-cap">Datos de la planilla · ' + esc(D.generado || '—') + '</div>'
      + '<div class="hero-scroll"><span>Scroll</span><div class="scroll-line"></div></div>'
    + '</div></section>'

    + secciones

    + '<footer class="pie">' + lg('pie-l')
      + '<b>Reseñas de Google · ' + esc(mesLargo(p)) + '</b>'
      + '<p>Informe generado desde el Portal Mateu Sports con los datos de la planilla de reseñas, '
      + 'actualizada al ' + esc(D.generado || '—') + '. Las reseñas se leen de Google una vez por mes, '
      + 'a principios del mes siguiente.</p></footer>'

    + '<div class="acc">'
      + '<button id="bImp">🖨 Imprimir o PDF</button>'
      + '<button id="bLnk">🔗 Copiar link</button>'
      + '<button id="bTxt">⧉ Resumen para el mail</button>'
    + '</div>'

    + '<script>' + script + '<\/script></body></html>';
}

function presRender(p){
  if (!D.sucursales || !D.periodos.length || D.periodos.indexOf(p) < 0){
    document.body.innerHTML = '<div style="font-family:Barlow,sans-serif;padding:48px;text-align:center;'
      + 'color:#6B7A99">No hay datos para ' + esc(mesLargo(p))
      + '. <a href="./" style="color:#CC0000">Volver al módulo</a></div>';
    return;
  }
  const html = presHtml(p);
  document.open(); document.write(html); document.close();
}

/* ---- arranque ---- */
function pintar(){ pintarResumen(); pintarGrid(); pintarTabla(); }

function init(){
  // ?pres=YYYY-MM: el informe reemplaza a la app entera (y no pide sesión).
  if (PRES){ presRender(PRES); return; }

  if (!D.periodos.length){
    $('grid').innerHTML = '<div class="empty">No hay datos cargados todavía.</div>';
    return;
  }
  MES = D.periodos[D.periodos.length - 1];
  // Un mes sin la columna de tickets en ninguna sucursal está a medio cargar:
  // se puede ver, pero conviene que se note en el selector.
  const parcial = p => !Object.keys(D.sucursales)
    .some(s => { const f = filaDe(s, p); return f && f.t; });
  $('selMes').innerHTML = D.periodos.slice().reverse()
    .map(p => '<option value="' + p + '">' + mesLargo(p)
      + (parcial(p) ? ' · sin tickets' : '') + '</option>').join('');
  $('selMes').value = MES;

  $('nota').innerHTML = 'Los datos salen de la planilla de reseñas de Iván '
    + '(<b>' + esc(D.fuente || 'Excel de reseñas') + '</b>, actualizada al ' + esc(D.generado || '—') + ') '
    + 'y cubren ' + D.periodos.length + ' meses, de ' + mesLargo(D.periodos[0]) + ' a '
    + mesLargo(D.periodos[D.periodos.length - 1]) + '. '
    + '<b>Captación</b> es reseñas buenas sobre tickets emitidos — cuántos de los que compran dejan '
    + 'una reseña. <b>% positivas</b> es qué proporción de las reseñas del mes fue buena. '
    + 'El texto de cada reseña no está en la planilla: figura sólo el nombre de la última opinión leída.';

  $('selMes').onchange = e => { MES = e.target.value; pintar(); };
  // Abre el informe del mes que se está mirando, en una pestaña aparte.
  $('btnPres').onclick = () => window.open('?pres=' + MES, '_blank', 'noopener');
  let tId; $('buscar').oninput = () => { clearTimeout(tId); tId = setTimeout(pintar, 180); };

  document.querySelectorAll('th.srt').forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    ORDEN = {k, dir: ORDEN.k === k ? -ORDEN.dir : -1};
    pintarTabla();
  });

  // Abrir el detalle desde la ficha o desde la fila del ranking.
  document.addEventListener('click', e => {
    const el = e.target.closest('.card[data-slug], tbody tr[data-slug]');
    if (el) abrirDetalle(el.dataset.slug);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') cerrar();
    if (e.key === 'Enter' && document.activeElement && document.activeElement.dataset
        && document.activeElement.dataset.slug) abrirDetalle(document.activeElement.dataset.slug);
  });
  const cerrar = () => { $('ovl').classList.remove('on'); document.body.style.overflow = ''; };
  $('dlgX').onclick = cerrar;
  $('ovl').onclick = e => { if (e.target === $('ovl')) cerrar(); };

  pintar();

  // Aviso a shared/marca.js si la sesión es de una sucursal Aurelius.
  if (window.Marca && MI_SLUG && Marca.vista) { try { Marca.vista(MI_SLUG); } catch(e){} }
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
</body>
</html>
