<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Picking — Mateu Sports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="../shared/iconos.js" defer></script>
<style>
  :root{
    --navy:#0B1527;--navy-mid:#1a2f55;--red:#CC0000;--red-soft:#ff3b3b;--off:#f5f7fc;--card:#fff;--border:#dce3f0;
    --muted:#6B7A99;--muted-light:#b0bcd4;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--exc:#7c3aed;
    --font-d:'Bebas Neue',sans-serif;--font-c:'Barlow Condensed',sans-serif;--font-b:'Barlow',sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--off);color:var(--navy);font-family:var(--font-b);min-height:100vh}
  .top{background:var(--navy);border-bottom:3px solid var(--red);padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:40}
  .logo{display:flex;align-items:center;gap:12px;text-decoration:none}
  .logo img{height:34px;width:auto;display:block}
  .logo .tt{font-family:var(--font-d);font-size:22px;color:#fff;letter-spacing:1px}
  .logo .ts{font-family:var(--font-c);font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--muted-light)}
  .top-right{display:flex;align-items:center;gap:14px}
  .who .n{font-family:var(--font-c);font-size:13px;font-weight:600;color:#fff}
  .who .r{font-family:var(--font-c);font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--red-soft);text-align:right}
  .salir{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;font-family:var(--font-c);font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:7px 13px;cursor:pointer}
  .tabs{background:#fff;border-bottom:1px solid var(--border);padding:0 22px;display:flex;gap:4px;overflow-x:auto;position:sticky;top:59px;z-index:30}
  .tab{padding:13px 16px;border:0;background:none;cursor:pointer;font-family:var(--font-c);font-size:14px;font-weight:600;letter-spacing:.5px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
  .tab.on{color:var(--navy);border-bottom-color:var(--red)}
  main{max-width:1100px;margin:0 auto;padding:22px}
  .sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .sec-head h1{font-family:var(--font-d);font-size:30px;letter-spacing:.5px;margin:0;font-weight:400}
  .sec-head .sub{font-family:var(--font-c);font-size:13px;color:var(--muted)}
  .btn{border:none;border-radius:8px;padding:10px 16px;font-family:var(--font-c);font-size:13px;font-weight:700;letter-spacing:.5px;cursor:pointer;text-transform:uppercase}
  .btn-primary{background:var(--red);color:#fff}.btn-primary:hover{background:#a00000}
  .btn-outline{background:#fff;border:1.5px solid var(--border);color:var(--navy)}.btn-outline:hover{border-color:var(--navy-mid)}
  .btn-sm{padding:6px 11px;font-size:11px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .inp,.sel{padding:9px 11px;border:1px solid var(--border);border-radius:7px;font-size:14px;color:var(--navy);background:#fff;font-family:var(--font-b)}
  .inp:focus,.sel:focus{outline:2px solid var(--red);outline-offset:1px}
  .state{text-align:center;padding:44px 20px;color:var(--muted);font-family:var(--font-c)}
  .spin{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--red);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 12px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .subtabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
  .subtab{padding:7px 13px;border:1px solid var(--border);background:#fff;border-radius:999px;font-family:var(--font-c);font-weight:600;font-size:12.5px;color:var(--muted);cursor:pointer}
  .subtab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px}
  .card.prio-URGENTE{border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset}
  .pk-nro{font-family:var(--font-d);font-size:24px;letter-spacing:.5px}
  .pk-dest{font-family:var(--font-c);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.5px}
  .pk-meta{font-family:var(--font-c);font-size:12.5px;color:var(--muted);margin-top:2px}
  .pk-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
  .prog{height:8px;background:#eef1f7;border-radius:99px;overflow:hidden;margin-top:10px}
  .prog span{display:block;height:100%;background:var(--ok)}
  .pill{font-family:var(--font-c);font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .pill.pend{background:#eef1f7;color:var(--muted)}.pill.prep{background:#e7eefc;color:#1a3a8a}.pill.ctrl{background:#fff4e2;color:#9a5b00}.pill.fin{background:#e8f5ee;color:#166534}.pill.dif{background:#fdecec;color:#b00020}
  .pill.p-ALTA{background:#fff4e2;color:#9a5b00}.pill.p-URGENTE{background:#fdecec;color:#b00020}.pill.p-NORMAL{background:#eef1f7;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
  th{font-family:var(--font-c);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:8px;border-bottom:1px solid var(--border)}
  td{padding:8px;border-bottom:1px solid #eef1f7;font-variant-numeric:tabular-nums}
  td.num,th.num{text-align:right}
  .tbl-wrap{border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .overlay{position:fixed;inset:0;background:rgba(11,21,39,.55);display:none;align-items:flex-start;justify-content:center;padding:30px 16px;z-index:60;overflow:auto}
  .overlay.show{display:flex}
  .modal{background:#fff;border-radius:14px;max-width:640px;width:100%;padding:22px}
  .modal h2{font-family:var(--font-d);font-size:24px;letter-spacing:.5px;margin:0 0 4px}
  .modal .msub{font-family:var(--font-c);font-size:12.5px;color:var(--muted);margin-bottom:14px}
  .fld{margin-bottom:12px}
  .fld label{display:block;font-family:var(--font-c);font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  .fld .inp,.fld .sel{width:100%}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
  .row-x{display:flex;align-items:center;gap:8px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--navy);color:#fff;padding:12px 20px;border-radius:10px;font-family:var(--font-c);font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80}
  .toast.show{opacity:1}.toast.bad{background:var(--bad)}.toast.ok{background:var(--ok)}
  .hint{font-family:var(--font-c);font-size:12px;color:var(--muted)}
  .demo-banner{background:#fff4e2;border:1px solid #f4cd93;color:#8a5200;padding:10px 14px;border-radius:10px;margin-bottom:14px;font-family:var(--font-c);font-weight:600;font-size:13px;display:none}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const FIREBASE_DB_URL = 'https://recepciones-mateu-default-rtdb.firebaseio.com';
const BARR = 'barrida';   // reusa la base de barrida (recepciones-mateu)
const ROOT = 'picking';   // dominio nuevo

/* ---- sesión + rol (lee la sesión del Portal, sin login propio) ---- */
const SESSION_KEY='mateu_portal_session';
function readSession(){ try{ const s=localStorage.getItem(SESSION_KEY); return s?JSON.parse(s):null; }catch(e){ return null; } }
const SESSION = readSession();
const _mail = ((SESSION&&SESSION.email)||'').toLowerCase();
const COMPRAS_MAILS=['julian@mateu.com.ar','julian.demarco@mateu.com.ar'];
const DEPOSITO_MAILS=['logistica@mateu.com.ar','deposito@mateu.com.ar'];
const puedeVer = SESSION && (SESSION.rol==='admin' || DEPOSITO_MAILS.includes(_mail) || COMPRAS_MAILS.includes(_mail));
if(!SESSION || !SESSION.rol){ location.replace('../'); }
else if(!puedeVer){ location.replace('../'); }

/* ---- helpers ---- */
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const num = x => { const n=Number(x); return isFinite(n)?n:0; };
const fmtInt = n => (Math.round(n||0)).toLocaleString('es-AR');
const cmp = (a,b)=>String(a).localeCompare(String(b),'es');
function fbUrl(path,q){ return FIREBASE_DB_URL.replace(/\/+$/,'')+'/'+path.split('/').map(encodeURIComponent).join('/')+'.json'+(q?('?'+q):''); }
function fbKey(s){ return String(s||'').trim().replace(/[.#$/\[\]]/g,'~'); }
async function fbGet(path,q){ const r=await fetch(fbUrl(path,q)); if(!r.ok) throw new Error('Firebase '+r.status); return r.json(); }
async function fbPut(path,data){ const r=await fetch(fbUrl(path),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}); if(!r.ok) throw new Error('Firebase '+r.status); return r.json(); }
async function fbPost(path,data){ const r=await fetch(fbUrl(path),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}); if(!r.ok) throw new Error('Firebase '+r.status); return r.json(); }
async function fbDelete(path){ const r=await fetch(fbUrl(path),{method:'DELETE'}); if(!r.ok) throw new Error('Firebase '+r.status); return true; }
function nowISO(){ return new Date().toISOString().slice(0,19).replace('T',' '); }
function toast(msg,kind){ const t=$('toast'); t.textContent=msg; t.className='toast show '+(kind||''); setTimeout(()=>{t.className='toast '+(kind||'');},2600); }
const vals = o => o?Object.keys(o).map(k=>o[k]):[];
function nombreSuc(slug){ return String(slug||'').split('-').map(w=> !w?w:(w.length<=2?w.toUpperCase():w.charAt(0).toUpperCase()+w.slice(1))).join(' '); }
function openModal(html){ $('modal').innerHTML=html; $('overlay').classList.add('show'); }
function closeModal(){ $('overlay').classList.remove('show'); }
$('overlay').addEventListener('click',e=>{ if(e.target===$('overlay')) closeModal(); });
$('salir').onclick=()=>{ try{ localStorage.removeItem(SESSION_KEY); }catch(e){} location.replace('../'); };
if($('whoName')) $('whoName').textContent=(SESSION&&(SESSION.nombre||SESSION.email))||'—';
if($('whoRole')) $('whoRole').textContent=(SESSION&&SESSION.rol)||'—';

/* ---- estado + datos ---- */
const state = { tab:'pickings', pkTab:'pend' };
const DATA = { operarios:{}, zonas:{}, asignZona:{}, pickings:{}, seq:1841,
  bar:{ ultima:null, meta:null, slugs:[], combos:[], repoCache:{} } };
const EST_LABEL = { PENDIENTE:'pend', 'EN PREPARACIÓN':'prep', 'LISTO PARA CONTROL':'ctrl', FINALIZADO:'fin', 'CON DIFERENCIAS':'dif', PAUSADO:'prep' };

async function cargar(){
  const [ope,zon,asig,pick,seq,ultima] = await Promise.all([
    fbGet(ROOT+'/operarios'), fbGet(ROOT+'/zonas'), fbGet(ROOT+'/asignZona'),
    fbGet(ROOT+'/pickings'), fbGet(ROOT+'/seq'), fbGet(BARR+'/ultima')
  ]);
  DATA.operarios=ope||{}; DATA.zonas=zon||{}; DATA.asignZona=asig||{}; DATA.pickings=pick||{};
  DATA.seq=num(seq)||1841; DATA.bar.ultima=ultima||null;
  if(ultima){
    const lk=fbKey(ultima);
    const [meta,slugsObj]=await Promise.all([ fbGet(BARR+'/barridas/'+lk+'/meta'), fbGet(BARR+'/barridas/'+lk+'/reposicion','shallow=true') ]);
    DATA.bar.meta=meta||null; DATA.bar.slugs = slugsObj?Object.keys(slugsObj).sort((a,b)=>cmp(nombreSuc(a),nombreSuc(b))):[];
  }
}
// carga (y cachea) la reposición de una sucursal
async function repoDe(slug){
  if(DATA.bar.repoCache[slug]) return DATA.bar.repoCache[slug];
  const lk=fbKey(DATA.bar.ultima);
  const arr=await fbGet(BARR+'/barridas/'+lk+'/reposicion/'+slug);
  const list=Array.isArray(arr)?arr:(arr?vals(arr):[]);
  DATA.bar.repoCache[slug]=list; return list;
}
// combos (marca,rubro) presentes en toda la barrida — para asignar zonas
async function cargarCombos(){
  if(DATA.bar.combos.length || !DATA.bar.ultima) return DATA.bar.combos;
  const lk=fbKey(DATA.bar.ultima);
  const rep=await fbGet(BARR+'/barridas/'+lk+'/reposicion');
  const set={};
  Object.keys(rep||{}).forEach(slug=>{ (rep[slug]||[]).forEach(it=>{ const m=it.marca||'—', r=it.rubro||'—'; set[m+'|||'+r]={marca:m,rubro:r}; }); });
  DATA.bar.combos = Object.values(set).sort((a,b)=>cmp(a.marca,b.marca)||cmp(a.rubro,b.rubro));
  return DATA.bar.combos;
}

function comboKey(marca,rubro){ return fbKey(marca)+'__'+fbKey(rubro); }
function zonaDe(marca,rubro){ const zid=DATA.asignZona[comboKey(marca,rubro)]; return (zid&&DATA.zonas[zid])?{id:zid,...DATA.zonas[zid]}:null; }
function zonaOrden(marca,rubro){ const z=zonaDe(marca,rubro); return z?num(z.orden):999; }

/* ---- eventos (log de trazabilidad) ---- */
function logEvento(ev){ fbPost(ROOT+'/eventos', Object.assign({ts:nowISO(), operador_id:_mail||null}, ev)).catch(()=>{}); }

/* ============================================================ RENDER ========= */
function render(){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t.dataset.tab===state.tab));
  if(state.tab==='zonas') return renderZonas();
  if(state.tab==='operarios') return renderOperarios();
  return renderPickings();
}

/* ---- PICKINGS ---- */
function pickResumen(P){
  const items=vals(P.items||{}); let req=0,pick=0; const skus=items.length;
  items.forEach(it=>{ req+=num(it.requested_qty); pick+=num(it.picked_qty); });
  return {skus, req, pick, pct: req?Math.round(pick/req*100):0};
}
function renderPickings(){
  const groups={ pend:['PENDIENTE'], prep:['EN PREPARACIÓN','PAUSADO'], ctrl:['LISTO PARA CONTROL'], fin:['FINALIZADO','CON DIFERENCIAS'] };
  const all=vals(DATA.pickings);
  const cnt=k=>all.filter(p=>groups[k].includes(p.estado)).length;
  let html = seccionHead('Pickings','Preparación de pedidos del depósito, por recorrido de zonas.',
    '<button class="btn btn-primary btn-sm" id="btnNuevo">+ Crear picking</button>');
  html += '<div class="subtabs">'
    + subtab('pend','Pendientes',cnt('pend')) + subtab('prep','En preparación',cnt('prep'))
    + subtab('ctrl','Listos para control',cnt('ctrl')) + subtab('fin','Finalizados',cnt('fin')) + '</div>';
  const list=all.filter(p=>groups[state.pkTab].includes(p.estado))
    .sort((a,b)=>{ const pr={URGENTE:0,ALTA:1,NORMAL:2}; return (pr[a.prioridad]??2)-(pr[b.prioridad]??2) || cmp(b.created_at||'',a.created_at||''); });
  if(!list.length){ $('view').innerHTML = html + '<div class="state">No hay pickings en esta pestaña.</div>'; bindPickings(); return; }
  const cards=list.map(P=>{
    const r=pickResumen(P); const est=EST_LABEL[P.estado]||'pend';
    return '<div class="card prio-'+esc(P.prioridad||'NORMAL')+'">'
      + '<div class="row-x" style="justify-content:space-between"><span class="pk-nro">PICK #'+esc(P.nro)+'</span>'
      + (P.prioridad&&P.prioridad!=='NORMAL'?'<span class="pill p-'+esc(P.prioridad)+'">'+esc(P.prioridad)+'</span>':'')+'</div>'
      + '<div class="pk-dest">'+esc(nombreSuc(P.destino))+'</div>'
      + '<div class="pk-meta">'+fmtInt(r.req)+' unidades · '+fmtInt(r.skus)+' SKUs'
      + (P.filtros&&(P.filtros.marca||P.filtros.rubro)?(' · '+esc([P.filtros.marca,P.filtros.rubro].filter(Boolean).join(' / '))):'')+'</div>'
      + (P.operario?('<div class="pk-meta">Operario: '+esc(P.operario)+'</div>'):'')
      + '<div class="prog"><span style="width:'+r.pct+'%"></span></div>'
      + '<div class="pk-foot"><span class="pill '+est+'">'+esc(P.estado)+'</span>'
      + '<span class="hint">'+fmtInt(r.pick)+' / '+fmtInt(r.req)+' u</span></div>'
      + '<div class="pk-foot"><span class="hint">'+esc((P.created_at||'').slice(0,16))+'</span>'
      + '<button class="btn btn-outline btn-sm" data-del="'+esc(P.nro)+'">🗑</button></div>'
      + '</div>';
  }).join('');
  $('view').innerHTML = html + '<div class="grid">'+cards+'</div>';
  bindPickings();
}
function bindPickings(){
  const n=$('btnNuevo'); if(n) n.onclick=abrirNuevoPicking;
  document.querySelectorAll('.subtab[data-st]').forEach(b=>b.onclick=()=>{ state.pkTab=b.dataset.st; render(); });
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{ const nro=b.dataset.del; if(!confirm('¿Eliminar el PICK #'+nro+'?')) return; b.disabled=true; try{ await fbDelete(ROOT+'/pickings/'+fbKey(nro)); delete DATA.pickings[fbKey(nro)]; render(); toast('Picking eliminado','ok'); }catch(e){ b.disabled=false; toast('No se pudo','bad'); } });
}
function subtab(id,label,n){ return '<button class="subtab'+(state.pkTab===id?' on':'')+'" data-st="'+id+'">'+esc(label)+(n?(' ('+n+')'):'')+'</button>'; }

async function abrirNuevoPicking(){
  if(!DATA.bar.ultima){ toast('No hay una barrida cargada para crear pickings','bad'); return; }
  const marcas=[...new Set((await cargarCombos()).map(c=>c.marca))].sort(cmp);
  const rubros=[...new Set(DATA.bar.combos.map(c=>c.rubro))].sort(cmp);
  openModal(
    '<h2>Crear picking</h2><div class="msub">Barrida del '+esc(DATA.bar.ultima)+'. Elegí el destino y, si querés, filtrá por marca y/o rubro. El recorrido se ordena por zona.</div>'
    + '<div class="grid2"><div class="fld"><label>Destino (sucursal)</label><select class="sel" id="npDest"><option value="">Elegir…</option>'
    + DATA.bar.slugs.map(s=>'<option value="'+esc(s)+'">'+esc(nombreSuc(s))+'</option>').join('')+'</select></div>'
    + '<div class="fld"><label>Prioridad</label><select class="sel" id="npPrio"><option>NORMAL</option><option>ALTA</option><option>URGENTE</option></select></div></div>'
    + '<div class="grid2"><div class="fld"><label>Marca (opcional)</label><select class="sel" id="npMarca"><option value="">Todas</option>'
    + marcas.map(m=>'<option>'+esc(m)+'</option>').join('')+'</select></div>'
    + '<div class="fld"><label>Rubro (opcional)</label><select class="sel" id="npRubro"><option value="">Todos</option>'
    + rubros.map(r=>'<option>'+esc(r)+'</option>').join('')+'</select></div></div>'
    + '<div id="npPrev" class="hint"></div>'
    + '<div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">Cancelar</button>'
    + '<button class="btn btn-outline" id="npPreview">Previsualizar</button>'
    + '<button class="btn btn-primary" id="npCrear" disabled>Crear picking</button></div>'
  );
  let items=null;
  const armar=async()=>{
    const dest=$('npDest').value; if(!dest){ toast('Elegí el destino','bad'); return null; }
    const fm=$('npMarca').value, fr=$('npRubro').value;
    const repo=await repoDe(dest);
    const filt=repo.filter(it=> num(it.sugerido)>0 && (!fm||it.marca===fm) && (!fr||it.rubro===fr));
    return filt.map(it=>({ codigo:it.codigo, desc:it.desc, marca:it.marca||'—', rubro:it.rubro||'—', id:it.id,
      talles:(it.talles||[]).filter(t=>num(t.s)>0).map(t=>({t:t.t,s:num(t.s)})),
      requested_qty:num(it.sugerido) }));
  };
  $('npPreview').onclick=async()=>{
    const b=$('npPreview'); b.disabled=true;
    try{ items=await armar(); if(items===null){ b.disabled=false; return; }
      let u=0; items.forEach(i=>u+=i.requested_qty);
      const sinZona=items.filter(i=>!zonaDe(i.marca,i.rubro)).length;
      $('npPrev').innerHTML = items.length
        ? ('Se van a incluir <b>'+items.length+'</b> SKUs · <b>'+fmtInt(u)+'</b> unidades.'+(sinZona?(' <b style="color:var(--warn)">'+sinZona+' SKUs sin zona asignada (irán al final del recorrido).</b>'):' Todos con zona.'))
        : 'No hay ítems para ese filtro.';
      $('npCrear').disabled = !items.length;
    }catch(e){ toast(e.message,'bad'); }
    b.disabled=false;
  };
  $('npCrear').onclick=async()=>{
    if(!items||!items.length) return;
    const dest=$('npDest').value, prio=$('npPrio').value, fm=$('npMarca').value, fr=$('npRubro').value;
    // ordenar por zona (recorrido) y numerar sequence
    items.sort((a,b)=> zonaOrden(a.marca,a.rubro)-zonaOrden(b.marca,b.rubro) || cmp(a.marca,b.marca) || cmp(a.codigo,b.codigo));
    const itemsObj={};
    items.forEach((it,i)=>{ const z=zonaDe(it.marca,it.rubro); const iid='i'+String(i+1).padStart(4,'0');
      itemsObj[iid]={ codigo:it.codigo, desc:it.desc, marca:it.marca, rubro:it.rubro, talles:it.talles,
        zonaId:z?z.id:null, zonaNombre:z?z.nombre:'', requested_qty:it.requested_qty, picked_qty:0, controlled_qty:0, estado:'pendiente', sequence:i+1 }; });
    const nro=DATA.seq+1;
    const P={ nro, destino:dest, estado:'PENDIENTE', prioridad:prio, filtros:{marca:fm||'',rubro:fr||''},
      origen:{barrida:DATA.bar.ultima}, operario:'', created_at:nowISO(), creado_por:_mail, items:itemsObj };
    const b=$('npCrear'); b.disabled=true;
    try{
      await fbPut(ROOT+'/pickings/'+fbKey(nro), P);
      await fbPut(ROOT+'/seq', nro); DATA.seq=nro; DATA.pickings[fbKey(nro)]=P;
      logEvento({event_type:'picking_created', picking_id:nro, value:{destino:dest, skus:items.length}});
      closeModal(); state.pkTab='pend'; render(); toast('PICK #'+nro+' creado','ok');
    }catch(e){ b.disabled=false; toast('No se pudo crear: '+e.message,'bad'); }
  };
}

/* ---- ZONAS ---- */
async function renderZonas(){
  $('view').innerHTML='<div class="state"><div class="spin"></div>Cargando zonas…</div>';
  let combos=[]; try{ combos=await cargarCombos(); }catch(e){}
  const zonas=Object.keys(DATA.zonas).map(id=>({id,...DATA.zonas[id]})).sort((a,b)=>num(a.orden)-num(b.orden));
  let html=seccionHead('Zonas del depósito','Definí las zonas (nombre + orden del recorrido) y a qué marca/rubro corresponde cada una.',
    '<button class="btn btn-primary btn-sm" id="btnZona">+ Nueva zona</button>');
  html+='<div class="tbl-wrap" style="margin-bottom:20px"><table><thead><tr><th style="width:70px">Orden</th><th>Zona</th><th class="num">Combos</th><th style="width:90px"></th></tr></thead><tbody>';
  html+= zonas.length ? zonas.map(z=>{
    const usos=combos.filter(c=>DATA.asignZona[comboKey(c.marca,c.rubro)]===z.id).length;
    return '<tr><td class="num">'+esc(String(z.orden))+'</td><td><b>'+esc(z.nombre)+'</b></td><td class="num">'+usos+'</td>'
      + '<td><button class="btn btn-outline btn-sm" data-ez="'+esc(z.id)+'">✎</button> <button class="btn btn-outline btn-sm" data-dz="'+esc(z.id)+'">🗑</button></td></tr>';
  }).join('') : '<tr><td colspan="4" class="hint" style="padding:14px">Todavía no hay zonas. Creá la primera con "+ Nueva zona".</td></tr>';
  html+='</tbody></table></div>';
  // asignación combo -> zona
  html+='<div class="sec-head" style="margin-bottom:8px"><div><h1 style="font-size:22px">Marca / Rubro → Zona</h1><div class="sub">Asigná cada combinación de la barrida a una zona.</div></div></div>';
  if(!combos.length){ html+='<div class="state">No hay barrida cargada para listar las combinaciones.</div>'; }
  else{
    html+='<div class="tbl-wrap"><table><thead><tr><th>Marca</th><th>Rubro</th><th style="width:220px">Zona</th></tr></thead><tbody>';
    html+=combos.map(c=>{ const k=comboKey(c.marca,c.rubro); const cur=DATA.asignZona[k]||'';
      return '<tr><td><b>'+esc(c.marca)+'</b></td><td>'+esc(c.rubro)+'</td><td><select class="sel" data-combo="'+esc(k)+'" style="width:100%">'
        + '<option value="">— sin asignar —</option>'
        + zonas.map(z=>'<option value="'+esc(z.id)+'"'+(cur===z.id?' selected':'')+'>'+esc(z.nombre)+'</option>').join('')
        + '</select></td></tr>';
    }).join('');
    html+='</tbody></table></div>';
  }
  $('view').innerHTML=html;
  $('btnZona').onclick=()=>editarZona(null);
  document.querySelectorAll('[data-ez]').forEach(b=>b.onclick=()=>editarZona(b.dataset.ez));
  document.querySelectorAll('[data-dz]').forEach(b=>b.onclick=async()=>{ const id=b.dataset.dz; if(!confirm('¿Eliminar la zona "'+(DATA.zonas[id]?DATA.zonas[id].nombre:'')+'"?')) return; try{ await fbDelete(ROOT+'/zonas/'+id); delete DATA.zonas[id]; render(); toast('Zona eliminada','ok'); }catch(e){ toast('No se pudo','bad'); } });
  document.querySelectorAll('[data-combo]').forEach(sel=>sel.onchange=async()=>{ const k=sel.dataset.combo, zid=sel.value;
    try{ if(zid){ await fbPut(ROOT+'/asignZona/'+k, zid); DATA.asignZona[k]=zid; } else { await fbDelete(ROOT+'/asignZona/'+k); delete DATA.asignZona[k]; } toast('Asignado','ok'); }catch(e){ toast('No se pudo guardar','bad'); } });
}
function editarZona(id){
  const z = id?DATA.zonas[id]:{nombre:'',orden:(Object.keys(DATA.zonas).length+1)*10};
  openModal('<h2>'+(id?'Editar zona':'Nueva zona')+'</h2>'
    + '<div class="fld"><label>Nombre</label><input class="inp" id="zNom" value="'+esc(z.nombre||'')+'" placeholder="Ej: Adidas Calzado"></div>'
    + '<div class="fld"><label>Orden del recorrido (menor = primero)</label><input class="inp" id="zOrd" type="number" value="'+esc(String(z.orden||10))+'"></div>'
    + '<div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" id="zSave">Guardar</button></div>');
  $('zSave').onclick=async()=>{
    const nombre=$('zNom').value.trim(); if(!nombre){ toast('Falta el nombre','bad'); return; }
    const orden=num($('zOrd').value); const zid=id||('z'+fbKey(nombre)+'_'+Math.floor(performance.now()));
    const b=$('zSave'); b.disabled=true;
    try{ const rec={nombre,orden}; await fbPut(ROOT+'/zonas/'+zid, rec); DATA.zonas[zid]=rec; closeModal(); render(); toast('Zona guardada','ok'); }
    catch(e){ b.disabled=false; toast('No se pudo','bad'); }
  };
}

/* ---- OPERARIOS ---- */
function renderOperarios(){
  const ops=Object.keys(DATA.operarios).map(id=>({id,...DATA.operarios[id]})).sort((a,b)=>cmp(a.nombre,b.nombre));
  let html=seccionHead('Operarios','Los que preparan pedidos. El kiosco usa esta lista al iniciar/terminar una tarea.',
    '<button class="btn btn-primary btn-sm" id="btnOp">+ Nuevo operario</button>');
  html+='<div class="tbl-wrap"><table><thead><tr><th>Nombre</th><th>Estado</th><th style="width:120px"></th></tr></thead><tbody>';
  html+= ops.length ? ops.map(o=>'<tr><td><b>'+esc(o.nombre)+'</b></td><td>'+(o.activo!==false?'<span class="pill fin">Activo</span>':'<span class="pill pend">Inactivo</span>')+'</td>'
    + '<td><button class="btn btn-outline btn-sm" data-toga="'+esc(o.id)+'">'+(o.activo!==false?'Desactivar':'Activar')+'</button> <button class="btn btn-outline btn-sm" data-delo="'+esc(o.id)+'">🗑</button></td></tr>').join('')
    : '<tr><td colspan="3" class="hint" style="padding:14px">Todavía no hay operarios. Cargá el primero con "+ Nuevo operario".</td></tr>';
  html+='</tbody></table></div>';
  $('view').innerHTML=html;
  $('btnOp').onclick=()=>{ openModal('<h2>Nuevo operario</h2><div class="fld"><label>Nombre</label><input class="inp" id="opNom" placeholder="Nombre y apellido"></div>'
    + '<div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" id="opSave">Guardar</button></div>');
    $('opNom').focus();
    $('opSave').onclick=async()=>{ const nombre=$('opNom').value.trim(); if(!nombre){ toast('Falta el nombre','bad'); return; }
      const id='op'+fbKey(nombre.toLowerCase())+'_'+Math.floor(performance.now()); const rec={nombre,activo:true,creado:nowISO()};
      const b=$('opSave'); b.disabled=true;
      try{ await fbPut(ROOT+'/operarios/'+id, rec); DATA.operarios[id]=rec; closeModal(); render(); toast('Operario agregado','ok'); }catch(e){ b.disabled=false; toast('No se pudo','bad'); } };
  };
  document.querySelectorAll('[data-toga]').forEach(b=>b.onclick=async()=>{ const id=b.dataset.toga; const o=DATA.operarios[id]; if(!o) return; const na=!(o.activo!==false); try{ await fbPut(ROOT+'/operarios/'+id+'/activo', na); o.activo=na; render(); }catch(e){ toast('No se pudo','bad'); } });
  document.querySelectorAll('[data-delo]').forEach(b=>b.onclick=async()=>{ const id=b.dataset.delo; if(!confirm('¿Eliminar a "'+(DATA.operarios[id]?DATA.operarios[id].nombre:'')+'"?')) return; try{ await fbDelete(ROOT+'/operarios/'+id); delete DATA.operarios[id]; render(); toast('Operario eliminado','ok'); }catch(e){ toast('No se pudo','bad'); } });
}

/* ---- util ---- */
function seccionHead(title,sub,actions){ return '<div class="sec-head"><div><h1>'+esc(title)+'</h1>'+(sub?'<div class="sub">'+esc(sub)+'</div>':'')+'</div>'+(actions?'<div class="row-x">'+actions+'</div>':'')+'</div>'; }

/* ---- tabs + init ---- */
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{ state.tab=b.dataset.tab; render(); });
(async function init(){
  try{ await cargar(); render(); }
  catch(e){ $('view').innerHTML='<div class="state">No pude cargar los datos. Revisá la conexión.<br><br><button class="btn btn-outline" onclick="location.reload()">↻ Reintentar</button></div>'; }
})();
</script>
</body>
</html>
