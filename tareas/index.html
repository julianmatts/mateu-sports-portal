<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tareas de la Sucursal · Mateu Sports</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B1527;--navy-mid:#1a2f55;--navy-soft:#13203a;
  --red:#CC0000;--red-soft:#ff3b3b;
  --white:#fff;--off:#f5f7fc;--muted:#6B7A99;--muted-light:#b0bcd4;
  --card:#fff;--border:#dce3f0;
  --ok:#16a34a;--ok-bg:#f0fdf4;--warn:#d97706;--warn-bg:#fffbeb;--bad:#dc2626;--bad-bg:#fef2f2;
  --font-d:'Bebas Neue',sans-serif;--font-c:'Barlow Condensed',sans-serif;--font-b:'Barlow',sans-serif;
  --shadow:0 1px 4px rgba(11,21,39,.08);--shadow-md:0 8px 30px rgba(11,21,39,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--off);color:var(--navy);font-family:var(--font-b);min-height:100vh}
img,svg{max-width:100%}
button{font-family:inherit}

/* ===== barra secundaria (bajo el header del shell) ===== */
.msh-subbar .sub-suc{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip-suc{display:inline-flex;align-items:center;gap:6px;background:var(--navy);color:#fff;border-radius:8px;padding:6px 11px;
  font-family:var(--font-c);font-size:13px;font-weight:700;letter-spacing:.8px;text-transform:uppercase}
.sel,.inp,.ta{border:1.5px solid var(--border);border-radius:8px;padding:9px 11px;font-family:var(--font-b);font-size:14px;color:var(--navy);background:#fff;width:100%}
.sel:focus,.inp:focus,.ta:focus{outline:none;border-color:var(--navy-mid)}
.ta{min-height:76px;resize:vertical}
.sub-yo{display:flex;align-items:center;gap:7px;margin-left:auto}
.sub-yo label{font-family:var(--font-c);font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.sub-yo .inp{width:170px;padding:7px 10px;font-size:13px}
.msh-subbar .sel{width:auto;padding:7px 10px;font-size:13px}

/* ===== pestañas ===== */
.tabs{background:#fff;border-bottom:1px solid var(--border);padding:0 22px;display:flex;gap:4px;overflow-x:auto;position:sticky;top:var(--msh-h,67px);z-index:30}
.tab{padding:13px 16px;border:0;background:none;cursor:pointer;font-family:var(--font-c);font-size:14px;font-weight:600;
  letter-spacing:.5px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.tab.on{color:var(--navy);border-bottom-color:var(--red)}
.tab:hover{color:var(--navy)}
.tab:focus-visible{outline:2px solid var(--red);outline-offset:-2px}
.tab .badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:10px;background:#e6ebf5;
  color:var(--navy-mid);font-family:var(--font-b);font-size:11px;font-weight:700;line-height:18px;text-align:center}
.tab.on .badge{background:var(--navy);color:#fff}
.tab .badge.alert{background:var(--red);color:#fff}
.tab .badge.zero{display:none}

main{max-width:1100px;margin:0 auto;padding:22px 22px 90px}

/* ===== botones ===== */
.btn{border:none;border-radius:8px;padding:10px 16px;font-family:var(--font-c);font-size:13px;font-weight:700;
  letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn-primary{background:var(--red);color:#fff}.btn-primary:hover{background:#a00000}
.btn-navy{background:var(--navy);color:#fff}.btn-navy:hover{background:var(--navy-mid)}
.btn-outline{background:#fff;border:1.5px solid var(--border);color:var(--navy)}.btn-outline:hover{border-color:var(--navy-mid)}
.btn-ok{background:var(--ok);color:#fff}.btn-ok:hover{background:#15803d}
.btn-ghost{background:transparent;color:var(--muted)}.btn-ghost:hover{color:var(--navy);background:#f0f3fa}
.btn-sm{padding:6px 11px;font-size:11px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.sel:focus-visible,.inp:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* ===== cabecera de sección / tarjetas ===== */
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sec-head h1{font-family:var(--font-d);font-size:30px;letter-spacing:1px;line-height:1}
.sec-head .sub{font-family:var(--font-c);font-size:13px;font-weight:500;color:var(--muted);margin-top:4px}
.sec-head .acts{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card.done{opacity:.72}
.card.alerta{border-color:#fca5a5;box-shadow:0 0 0 3px rgba(220,38,38,.08)}
.card.warn{border-color:#fcd34d}
.banner{border-radius:9px;padding:10px 14px;font-size:13px;margin-bottom:14px;line-height:1.45}
.banner.warn{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412}
.banner.bad{background:var(--bad-bg);border:1px solid #fca5a5;color:#991b1b}
.banner.info{background:#eef2ff;border:1px solid #c7d2fe;color:#3730a3}
.banner.ok{background:var(--ok-bg);border:1px solid #bbf7d0;color:#166534}
.banner b{font-weight:700}

/* kpis chicos */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.kpi .l{font-family:var(--font-c);font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--font-d);font-size:28px;line-height:1.05;margin-top:4px}
.kpi .v.bad{color:var(--bad)}.kpi .v.ok{color:var(--ok)}.kpi .v.warn{color:var(--warn)}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}

/* filtros */
.filtros{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.fchip{border:1.5px solid var(--border);background:#fff;border-radius:20px;padding:6px 13px;font-family:var(--font-c);font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.fchip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.fchip .n{opacity:.75;margin-left:4px}

/* ===== tarjeta de tarea ===== */
.tarea{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:start}
.tarea .t{font-family:var(--font-c);font-size:19px;font-weight:700;line-height:1.15}
.tarea .t .tag{display:inline-block;vertical-align:middle;margin-left:6px}
.tarea .d{font-size:13.5px;color:#334155;margin-top:5px;white-space:pre-wrap}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:3px 8px;font-family:var(--font-c);font-size:11.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;background:#eef2f9;color:var(--navy-mid)}
.tag.red{background:var(--bad-bg);color:#991b1b}.tag.ok{background:var(--ok-bg);color:#166534}.tag.amb{background:var(--warn-bg);color:#92400e}
.tag.navy{background:var(--navy);color:#fff}.tag.ger{background:#ede9fe;color:#5b21b6}
.tarea .acts{display:flex;flex-direction:column;gap:6px;align-items:stretch;min-width:132px}
.tarea .acts .btn{justify-content:center}
.tarea .hecho{font-size:12.5px;color:var(--muted);margin-top:8px}
.tarea .hecho b{color:var(--ok)}

/* fotos antes / después */
.fotos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;max-width:440px}
.foto{position:relative;border:1.5px dashed var(--border);border-radius:10px;overflow:hidden;background:#f8fafc;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .15s}
.foto:hover{border-color:var(--navy-mid)}
.foto.has{border-style:solid;border-color:#cbd5e1}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.foto .lab{position:absolute;left:8px;top:8px;background:rgba(11,21,39,.82);color:#fff;font-family:var(--font-c);font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;padding:3px 8px;border-radius:5px}
.foto .lab.desp{background:rgba(204,0,0,.88)}
.foto .empty{text-align:center;color:var(--muted);font-family:var(--font-c);font-size:13px;font-weight:600;padding:10px}
.foto .empty .ic{font-size:22px;display:block;margin-bottom:2px}
.foto .x{position:absolute;right:6px;top:6px;background:rgba(11,21,39,.75);color:#fff;border:0;border-radius:50%;width:24px;height:24px;font-size:14px;line-height:1;cursor:pointer}
.foto .spin{position:absolute;inset:0;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center}
.cmp-link{margin-top:8px;font-family:var(--font-c);font-size:13px;font-weight:700;color:var(--navy-mid);background:none;border:0;cursor:pointer;text-decoration:underline;padding:0}

/* ===== limpieza ===== */
.grupo{margin-bottom:22px}
.grupo-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.grupo-h h2{font-family:var(--font-c);font-size:17px;font-weight:700;letter-spacing:.8px;text-transform:uppercase}
.grupo-h .prog{display:flex;align-items:center;gap:8px;font-family:var(--font-c);font-size:13px;font-weight:600;color:var(--muted)}
.bar{width:140px;height:8px;background:#e6ebf5;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--navy);border-radius:4px;transition:width .3s}
.bar i.ok{background:var(--ok)}
.lrow{background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.lrow.ok{background:var(--ok-bg);border-color:#bbf7d0}
.chk{width:34px;height:34px;border-radius:9px;border:2px solid var(--border);background:#fff;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;color:#fff;transition:all .15s;flex:0 0 auto}
.chk.on{background:var(--ok);border-color:var(--ok)}
.chk:hover{border-color:var(--navy-mid)}
.lrow .n{font-family:var(--font-c);font-size:16px;font-weight:700;line-height:1.1}
.lrow .z{font-size:12px;color:var(--muted);margin-top:2px}
.lrow .z b{color:var(--ok);font-weight:600}
.lrow .r{display:flex;gap:6px;align-items:center}
.dots{display:inline-flex;gap:3px;margin-top:5px}
.dots i{width:9px;height:9px;border-radius:2px;background:#e6ebf5;display:block}
.dots i.on{background:var(--ok)}.dots i.off{background:#fecaca}.dots i.hoy{outline:1.5px solid var(--navy);outline-offset:1px}
.lrow .mini{display:flex;gap:4px}
.lrow .mini img{width:34px;height:34px;object-fit:cover;border-radius:6px;border:1px solid var(--border);cursor:pointer}
.ibtn{border:1.5px solid var(--border);background:#fff;border-radius:7px;width:30px;height:30px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.ibtn:hover{border-color:var(--navy-mid);color:var(--navy)}

/* ===== vidrieras ===== */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.vid{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.vid.alerta{border-color:#fca5a5;box-shadow:0 0 0 3px rgba(220,38,38,.1)}
.vid.warn{border-color:#fcd34d}
.vid .img{aspect-ratio:4/3;background:#eef2f9;position:relative;display:flex;align-items:center;justify-content:center;color:var(--muted);font-family:var(--font-c);font-weight:600;cursor:pointer}
.vid .img img{width:100%;height:100%;object-fit:cover;display:block}
.vid .img .st{position:absolute;left:10px;top:10px}
.vid .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.vid .n{font-family:var(--font-c);font-size:19px;font-weight:700;line-height:1.1;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.vid .dias{font-family:var(--font-d);font-size:34px;line-height:1;letter-spacing:.5px}
.vid .dias.bad{color:var(--bad)}.vid .dias.warn{color:var(--warn)}.vid .dias.ok{color:var(--ok)}
.vid .dias small{font-family:var(--font-c);font-size:13px;font-weight:600;letter-spacing:.5px;color:var(--muted);margin-left:5px;text-transform:uppercase}
.vid .last{font-size:12.5px;color:var(--muted)}
.vid .acts{display:flex;gap:6px;margin-top:auto;flex-wrap:wrap}
.hist{border-top:1px solid var(--border);padding:10px 14px;background:#fafbfe}
.hist summary{font-family:var(--font-c);font-size:12.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);cursor:pointer}
.hrow{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--border);font-size:12.5px}
.hrow:last-child{border-bottom:0}
.hrow img{width:44px;height:33px;object-fit:cover;border-radius:5px;border:1px solid var(--border)}
.hrow .hi{flex:1}
.hrow .hi b{font-family:var(--font-c);font-size:13px}

/* ===== resumen todas ===== */
.subtabs{display:inline-flex;border:1.5px solid var(--border);border-radius:9px;overflow:hidden;background:#fff;margin-bottom:16px}
.subtab{border:0;background:none;cursor:pointer;padding:9px 16px;font-family:var(--font-c);font-size:13px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.subtab + .subtab{border-left:1.5px solid var(--border)}
.subtab.on{background:var(--navy);color:#fff}
.res td.num{text-align:right;font-family:var(--font-c);font-weight:600}
.res tr.tot td{background:#f3f5fa;font-weight:700;border-top:2px solid var(--navy)}
.idx{display:inline-block;min-width:44px;text-align:center;border-radius:6px;padding:3px 8px;font-family:var(--font-d);font-size:17px;letter-spacing:.5px}
.idx.ok{background:var(--ok-bg);color:#166534}.idx.amb{background:var(--warn-bg);color:#92400e}.idx.bad{background:var(--bad-bg);color:#991b1b}.idx.na{background:#eef2f9;color:var(--muted)}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.gv{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;box-shadow:var(--shadow)}
.gv.alerta{border-color:#fca5a5}.gv.warn{border-color:#fcd34d}
.gv .im{aspect-ratio:4/3;background:#eef2f9;display:flex;align-items:center;justify-content:center;color:var(--muted);font-family:var(--font-c);font-size:12px}
.gv .im img{width:100%;height:100%;object-fit:cover;display:block}
.gv .b{padding:8px 10px}
.gv .s{font-family:var(--font-c);font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.gv .n{font-family:var(--font-c);font-size:14px;font-weight:700;line-height:1.1;margin-top:1px}
.gv .d{font-size:12px;margin-top:3px}.gv .d.bad{color:var(--bad);font-weight:700}.gv .d.warn{color:var(--warn)}.gv .d.ok{color:var(--ok)}
.rec{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
.rec .t{font-family:var(--font-c);font-size:18px;font-weight:700;line-height:1.1}
.rec .acts{display:flex;gap:6px;flex-wrap:wrap}
.chk-line{display:flex;align-items:center;gap:8px;font-size:13.5px;margin:4px 0 12px;cursor:pointer}
.chk-line input{width:17px;height:17px}
.mes-sel{display:inline-flex;align-items:center;gap:8px}
.mes-sel .sel{width:auto}
@media(max-width:640px){ .rec{grid-template-columns:1fr} .subtabs{width:100%;overflow-x:auto} }
table.res{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;font-size:13px}
.res th{background:var(--navy);color:#fff;font-family:var(--font-c);font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:10px 10px;text-align:left;border-bottom:3px solid var(--red)}
.res td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.res tr:hover td{background:#f8fafc;cursor:pointer}
.res td.c{text-align:center}
.res .pill{display:inline-block;min-width:26px;text-align:center;border-radius:12px;padding:2px 8px;font-family:var(--font-c);font-weight:700;font-size:12.5px}
.pill.ok{background:var(--ok-bg);color:#166534}.pill.bad{background:var(--bad-bg);color:#991b1b}.pill.amb{background:var(--warn-bg);color:#92400e}.pill.na{background:#eef2f9;color:var(--muted)}
.res-wrap{overflow-x:auto}

/* ===== modal / hoja ===== */
.scrim{position:fixed;inset:0;background:rgba(11,21,39,.55);z-index:1285;display:none;align-items:center;justify-content:center;padding:16px}
.scrim.open{display:flex}
.sheet{background:#fff;border-radius:14px;width:100%;max-width:560px;max-height:92vh;overflow:auto;box-shadow:var(--shadow-md)}
.sheet.wide{max-width:900px}
.sh-h{background:var(--navy);color:#fff;padding:14px 18px;border-bottom:3px solid var(--red);display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:2}
.sh-h h3{font-family:var(--font-d);font-size:22px;letter-spacing:1px;line-height:1}
.sh-h .x{background:transparent;border:0;color:rgba(255,255,255,.75);font-size:26px;line-height:1;cursor:pointer}
.sh-b{padding:18px}
.sh-f{padding:12px 18px 18px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--border)}
.fld{margin-bottom:12px}
.fld label{display:block;font-family:var(--font-c);font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.fld .hint{font-size:12px;color:var(--muted);margin-top:4px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sucs{display:flex;flex-wrap:wrap;gap:6px;max-height:150px;overflow:auto;padding:4px 0}
.sucs .fchip{padding:5px 10px;font-size:12.5px}

/* comparativa antes / después */
.cmp{position:relative;width:100%;aspect-ratio:4/3;background:#0B1527;border-radius:10px;overflow:hidden;user-select:none;touch-action:none}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.cmp .after{clip-path:inset(0 0 0 50%)}
.cmp .hnd{position:absolute;top:0;bottom:0;left:50%;width:3px;background:#fff;transform:translateX(-50%);box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.cmp .hnd::after{content:'◂ ▸';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--red);color:#fff;border-radius:20px;padding:6px 10px;font-size:13px;font-weight:700;white-space:nowrap;box-shadow:var(--shadow-md)}
.cmp .lb{position:absolute;top:10px;background:rgba(11,21,39,.85);color:#fff;font-family:var(--font-c);font-size:12px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;padding:4px 9px;border-radius:5px}
.cmp .lb.a{left:10px}.cmp .lb.b{right:10px;background:rgba(204,0,0,.9)}
.cmp input[type=range]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.sbs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sbs .p{background:#0B1527;border-radius:10px;overflow:hidden;position:relative;aspect-ratio:4/3}
.sbs .p img{width:100%;height:100%;object-fit:contain;display:block}
.sbs .p .lb{position:absolute;left:10px;top:10px;background:rgba(11,21,39,.85);color:#fff;font-family:var(--font-c);font-size:12px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;padding:4px 9px;border-radius:5px}
.sbs .p .lb.b{background:rgba(204,0,0,.9)}
.cmp-modo{display:inline-flex;border:1.5px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:12px}
.cmp-modo button{border:0;background:#fff;padding:7px 14px;font-family:var(--font-c);font-size:12.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);cursor:pointer}
.cmp-modo button.on{background:var(--navy);color:#fff}
.cmp-info{font-size:12.5px;color:var(--muted);margin-top:10px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

.state{text-align:center;padding:52px 20px;color:var(--muted)}
.state .big-ic{font-size:40px;margin-bottom:10px}
.state.err{color:var(--bad)}
.state h3{font-family:var(--font-c);font-size:18px;font-weight:700;color:var(--navy);margin-bottom:6px}
.state p{font-size:13.5px;max-width:460px;margin:0 auto 12px}
.spinner{width:26px;height:26px;border:3px solid #e6ebf5;border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;
  padding:11px 18px;border-radius:9px;font-size:13.5px;box-shadow:var(--shadow-md);opacity:0;pointer-events:none;transition:all .25s;z-index:1300}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:#166534}.toast.err{background:#991b1b}.toast.warn{background:#92400e}
.ro{font-size:12.5px;color:var(--muted);font-style:italic}

/* CELULAR */
@media(max-width:640px){
  main{padding:14px 12px 100px}
  .tabs{padding:0 8px}.tab{padding:12px 11px;font-size:13px}

  .lrow{grid-template-columns:auto 1fr;}.lrow .r{grid-column:1/-1;justify-content:flex-end}
  .bar{width:90px}
}

<script>
/* ============================================================
   Tareas de la Sucursal — módulo self-contained del Portal.
   Para las cuentas de sucursal/outlet (y gerencia como control):
   · Cambio de precios: tareas de remarcación (las publica gerencia a
     una o varias sucursales, o la propia sucursal se las anota).
   · Sectores de marcas: armado/rearmado de sectores de exhibición.
   · Limpieza: checklist diario / semanal / mensual con historial.
   · Vidrieras: cada vidriera con su último cambio; alerta cuando
     lleva más de N días sin cambios.
   Todo con foto ANTES / DESPUÉS y comparativa (slider o lado a lado).
   Lee la sesión del Portal (localStorage), sin login propio.
   ============================================================ */
'use strict';
const $ = id => document.getElementById(id);

/* ---------- Firebase ----------
   Reusa la base recepciones-mateu (ya existe, reglas abiertas) en un nodo
   aparte `tareas/…`, sin tocar `recepciones/`, `barrida/`, `objetivos/` ni
   `capacitaciones/`. Las fotos van comprimidas (JPEG ≤1280px) como data URI en
   `tareas/fotos/<slug>/<id>`; en el ítem solo viaja la miniatura (~10 KB),
   así el listado es liviano y la foto grande se baja al abrir la comparativa. */
const FIREBASE_DB_URL = 'https://recepciones-mateu-default-rtdb.firebaseio.com';
const ROOT = 'tareas';
const MENSAJES_DB_URL = 'https://mensajes-mateu-default-rtdb.firebaseio.com';
const USUARIOS_DB_URL = 'https://discontinuos-mateu-default-rtdb.firebaseio.com';
// Vidriera sin cambios: días por defecto para la alerta (gerencia lo ajusta en el módulo).
const DIAS_VIDRIERA_DEF = 15;
// Firebase Storage (opcional): cuando Juli cree el bucket (Firebase → Storage → «Comenzar»,
// reglas abiertas) y pegue acá su nombre (p.ej. 'recepciones-mateu.appspot.com'), las fotos
// grandes suben ahí por REST y en la base queda solo la URL. Vacío = data URI en la RTDB.
const STORAGE_BUCKET = '';
// Poda: las fotos grandes de tareas hechas y limpiezas de hace más de N días se borran
// (queda la miniatura y el registro). Las vidrieras conservan todo su historial.
const PODA_DIAS = 90;
// A quién le llega el aviso de vidriera en alerta además de la sucursal (supervisor).
const ALERTA_AVISADOS = ['cristian.campion@mateu.com.ar'];

/* ---------- sesión ---------- */
const SESSION_KEY = 'mateu_portal_session';
function readSession(){ try{ const s=localStorage.getItem(SESSION_KEY); return s?JSON.parse(s):null; }catch(e){ return window.__sess||null; } }
const SESSION = readSession();
if(!SESSION || !SESSION.rol || SESSION.rol==='puesto' || SESSION.rol==='deposito'){ location.replace('../'); }
const esGerencia = !!SESSION && (SESSION.rol==='admin' || SESSION.rol==='supervisor');
const esSucursal = !!SESSION && (SESSION.rol==='sucursal' || SESSION.rol==='outlet');
const puedeVer = !!SESSION && (SESSION.rol==='admin' || esSucursal || (SESSION.herramientas||[]).includes('tareas'));
if(SESSION && SESSION.rol && !puedeVer){ location.replace('../'); }

/* ---------- sucursales (slug del Portal) ---------- */
const STORES = [
  {slug:'plaza',      nombre:'Plaza Italia'},
  {slug:'kids',       nombre:'Mateu Kids'},
  {slug:'calle-55',   nombre:'Outlet Calle 55'},
  {slug:'aurelius-12',nombre:'Aurelius 12'},
  {slug:'city-bell',  nombre:'City Bell'},
  {slug:'aurelius-10',nombre:'Aurelius 10'},
  {slug:'calle-47',   nombre:'Calle 47'},
  {slug:'adidas',     nombre:'Adidas Av. 7'},
  {slug:'diagonal',   nombre:'Diagonal 80'},
  {slug:'ensenada',   nombre:'Ensenada'},
  {slug:'calle-12',   nombre:'Calle 12'},
  {slug:'los-hornos', nombre:'Los Hornos'},
  {slug:'gonnet',     nombre:'Outlet Gonnet'},
  {slug:'originals',  nombre:'Adidas Originals'},
  {slug:'berisso',    nombre:'Berisso'},
  {slug:'aurelius-cb',nombre:'Aurelius CB'},
  {slug:'aurelius-5', nombre:'Aurelius 5'},
  {slug:'calle-49',   nombre:'Calle 49'},
  {slug:'av-44',      nombre:'Outlet Av. 44'},
  {slug:'adidas-12',  nombre:'Adidas Calle 12'},
  {slug:'ecommerce',  nombre:'Ecommerce'},
];
const SLUG_NOMBRE = {}; STORES.forEach(s=>SLUG_NOMBRE[s.slug]=s.nombre);
function nombreSuc(slug){ return SLUG_NOMBRE[slug] || (slug||'').replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase()) || '—'; }
// Sucursales que ve gerencia: el supervisor, las de su alcance (si lo tiene cargado).
function storesVisibles(){
  if(SESSION.rol==='supervisor' && Array.isArray(SESSION.sucursales) && SESSION.sucursales.length){
    const set=new Set(SESSION.sucursales); return STORES.filter(s=>set.has(s.slug));
  }
  return STORES;
}
function slugSesion(){ return esSucursal ? ((SESSION.rol==='outlet'?SESSION.outlet_id:SESSION.sucursal)||null) : null; }

/* ---------- helpers ---------- */
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(msg, kind){ const t=$('toast'); t.textContent=msg; t.className='toast show '+(kind||''); clearTimeout(toast._t); toast._t=setTimeout(()=>{t.className='toast '+(kind||'');},2800); }
const p2 = n => String(n).padStart(2,'0');
function hoyISO(d){ d=d||new Date(); return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
function lunesDe(d){ d=new Date(d||new Date()); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); return hoyISO(d); }
function mesDe(d){ d=d||new Date(); return d.getFullYear()+'-'+p2(d.getMonth()+1); }
function fmtFecha(iso){ if(!iso) return '—'; const [y,m,d]=String(iso).slice(0,10).split('-'); return d+'/'+m+'/'+y; }
function fmtTs(ts){ if(!ts) return '—'; const d=new Date(ts); return p2(d.getDate())+'/'+p2(d.getMonth()+1)+' '+p2(d.getHours())+':'+p2(d.getMinutes()); }
function diasDesde(ts){ if(!ts) return null; return Math.floor((Date.now()-ts)/86400000); }
function diasHasta(iso){ if(!iso) return null; const d=new Date(iso+'T00:00:00'); const h=new Date(hoyISO()+'T00:00:00'); return Math.round((d-h)/86400000); }
function haceTxt(ts){ const d=diasDesde(ts); if(d==null) return ''; if(d===0) return 'hoy'; if(d===1) return 'ayer'; return 'hace '+d+' días'; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function nombreCorto(email){
  const u=(email||'').split('@')[0]||''; return u ? u.split(/[._-]+/).map(p=>!p?p:/^rrhh$/i.test(p)?'RRHH':p.charAt(0).toUpperCase()+p.slice(1)).join(' ') : '—';
}
// Quién firma: el nombre que escribió la persona en «Yo soy» (cuenta de sucursal) o el usuario del mail.
function firma(){ const yo=(state.yo||'').trim(); return yo ? yo+' ('+nombreCorto(SESSION.email)+')' : nombreCorto(SESSION.email); }
function sortBy(arr, f, desc){ return arr.slice().sort((a,b)=>{ const x=f(a), y=f(b); return (x<y?-1:x>y?1:0)*(desc?-1:1); }); }

/* ---------- Firebase REST ----------
   Las escrituras pasan por fbWrite: si no hay conexión (fetch falla por red), el
   cambio queda en una COLA en localStorage (`tareas_cola`) y se reintenta solo al
   volver la señal (`online`), al abrir el módulo y cada 30 s. La pantalla se
   actualiza igual, así el que está en la vidriera sin señal no pierde la foto. */
function fbUrl(path){ return FIREBASE_DB_URL.replace(/\/+$/,'') + '/' + (ROOT+(path?'/'+path:'')).split('/').map(encodeURIComponent).join('/') + '.json'; }
async function fbGet(path){ const r=await fetch(fbUrl(path)); if(!r.ok) throw new Error('Firebase HTTP '+r.status); return r.json(); }
const COLA_KEY='tareas_cola';
let _colaEnviando=false;
function colaLeer(){ try{ return JSON.parse(localStorage.getItem(COLA_KEY)||'[]'); }catch(e){ return []; } }
function colaGuardar(q){ try{ localStorage.setItem(COLA_KEY, JSON.stringify(q)); return true; }catch(e){ return false; } }
function esErrorRed(e){ return !!e && (e.name==='TypeError' || /Failed to fetch|NetworkError|Load failed|network/i.test(e.message||'')); }
async function fbWrite(method, path, data){
  try{
    const r=await fetch(fbUrl(path),{method, headers:{'Content-Type':'application/json'}, body: method==='DELETE'?undefined:JSON.stringify(data)});
    if(!r.ok) throw new Error('Firebase HTTP '+r.status);
    return r.json();
  }catch(e){
    if(!esErrorRed(e) || _colaEnviando) throw e;
    const q=colaLeer(); q.push({method, path, data: method==='DELETE'?null:data, ts:Date.now()});
    const txt=JSON.stringify(q);
    if(txt.length>4e6 || !colaGuardar(q)) throw new Error('Sin conexión y sin lugar para guardar el cambio en este dispositivo');
    pintarCola(); toast('Sin conexión: quedó guardado en este dispositivo y se manda al volver la señal','warn');
    return {__cola:true};
  }
}
const fbPut=(path,data)=>fbWrite('PUT',path,data);
const fbPatch=(path,data)=>fbWrite('PATCH',path,data);
const fbDel=(path)=>fbWrite('DELETE',path);
async function colaEnviar(manual){
  if(_colaEnviando) return; const q=colaLeer(); if(!q.length){ pintarCola(); return; }
  _colaEnviando=true; let n=0;
  try{
    while(q.length){ const it=q[0]; await fbWrite(it.method, it.path, it.data); q.shift(); colaGuardar(q); n++; }
    toast('Se enviaron '+n+' cambio'+(n===1?'':'s')+' pendiente'+(n===1?'':'s'),'ok');
    _colaEnviando=false; pintarCola(); recargar();
  }catch(e){ _colaEnviando=false; pintarCola(); if(manual) toast('Todavía sin conexión ('+(n?n+' enviados':'nada enviado')+')','warn'); }
}
function pintarCola(){
  const b=$('colaBanner'); if(!b) return; const q=colaLeer();
  if(!q.length){ b.style.display='none'; return; }
  b.style.display=''; b.innerHTML='⏳ <b>'+q.length+' cambio'+(q.length===1?'':'s')+' esperando conexión</b> · se mandan solos al volver la señal. <button class="cmp-link" style="margin:0" onclick="colaEnviar(true)">Reintentar ahora</button>';
}
window.addEventListener('online', ()=>colaEnviar(false));
setInterval(()=>{ if(colaLeer().length && navigator.onLine!==false) colaEnviar(false); }, 30000);

/* ---------- Bandeja del Portal (best-effort) ---------- */
const fbKeyMail=e=>(e||'').toLowerCase().trim().replace(/\./g,',');
const convKeyDe=(a,b)=>[fbKeyMail(a),fbKeyMail(b)].sort().join('__');
let _usuariosPortal=null;
function usuariosPortal(){
  if(_usuariosPortal) return _usuariosPortal;
  _usuariosPortal=fetch(USUARIOS_DB_URL+'/usuarios.json').then(r=>r.ok?r.json():null).catch(()=>null);
  return _usuariosPortal;
}
async function mailsDeSucursal(slug){
  const us=await usuariosPortal(); if(!us) return [];
  return [...new Set(Object.values(us).filter(u=>u&&u.email&&((u.rol==='sucursal'&&u.sucursal===slug)||(u.rol==='outlet'&&u.outlet_id===slug))).map(u=>u.email.toLowerCase()))];
}
async function directo(mails, texto){
  const de=(SESSION.email||'').toLowerCase(); if(!de) return 0;
  const ts=Date.now(); let n=0;
  await Promise.all([...new Set((mails||[]).map(m=>(m||'').toLowerCase()))].filter(m=>m&&m!==de).map(a=>
    fetch(MENSAJES_DB_URL+'/directos/'+convKeyDe(de,a)+'.json',{method:'POST',body:JSON.stringify({de:SESSION.email, texto, ts})}).then(()=>{n++;}).catch(()=>null)));
  return n;
}

/* ============================================================
   ESTADO
   ============================================================ */
const state = {
  tab:'precios',
  slug:null,          // sucursal que se está viendo (null = «Todas las sucursales» en gerencia)
  data:{precios:{}, sectores:{}, limpieza:{}, vidrieras:{}},
  cfg:{diasVidriera:DIAS_VIDRIERA_DEF},
  filtro:{precios:'pend', sectores:'pend'},
  yo:'',
  resumen:null,
  recurrentes:{},
  resVista:'hoy',            // subvista del resumen de gerencia: hoy · cumpl · galeria · recurrentes
  cumplMes:mesDe(),
  cargando:false,
};
try{ const t=localStorage.getItem('tareas_tab'); if(t && ['precios','sectores','limpieza','vidrieras'].includes(t)) state.tab=t; }catch(e){}

const TIPOS = {
  precios:  { nombre:'Cambio de precios', ic:'💲', uno:'cambio de precio', verbo:'remarcar' },
  sectores: { nombre:'Sectores de marcas', ic:'🏷️', uno:'sector', verbo:'armar' },
};
// Checklist de limpieza sugerido para una sucursal que arranca de cero.
const LIMPIEZA_SUGERIDA = [
  {t:'Vidrios de la vidriera y puerta', z:'Frente', f:'diaria'},
  {t:'Piso del salón', z:'Salón', f:'diaria'},
  {t:'Mostrador y caja', z:'Caja', f:'diaria'},
  {t:'Probadores (espejos, banquetas, cortinas)', z:'Probadores', f:'diaria'},
  {t:'Baño del personal', z:'Baño', f:'diaria'},
  {t:'Exhibidores y estantes de calzado', z:'Salón', f:'semanal'},
  {t:'Percheros y maniquíes', z:'Salón', f:'semanal'},
  {t:'Depósito: pasillos y estanterías', z:'Depósito', f:'semanal'},
  {t:'Luces, carteles y letreros', z:'Frente', f:'mensual'},
  {t:'Limpieza profunda del depósito', z:'Depósito', f:'mensual'},
];

/* ============================================================
   CARGA
   ============================================================ */
async function cargarSucursal(slug){
  state.cargando=true;
  const [pr, se, li, vi, cfg] = await Promise.all([
    fbGet('precios/'+slug).catch(()=>null), fbGet('sectores/'+slug).catch(()=>null),
    fbGet('limpieza/'+slug).catch(()=>null), fbGet('vidrieras/'+slug).catch(()=>null),
    fbGet('config/global').catch(()=>null),
  ]);
  state.data={precios:pr||{}, sectores:se||{}, limpieza:li||{}, vidrieras:vi||{}};
  if(cfg && cfg.diasVidriera) state.cfg.diasVidriera=Number(cfg.diasVidriera)||DIAS_VIDRIERA_DEF;
  state.cargando=false;
}
async function cargarTodas(){
  state.cargando=true;
  const [pr, se, li, vi, cfg, rec] = await Promise.all([
    fbGet('precios').catch(()=>null), fbGet('sectores').catch(()=>null),
    fbGet('limpieza').catch(()=>null), fbGet('vidrieras').catch(()=>null), fbGet('config/global').catch(()=>null),
    fbGet('recurrentes').catch(()=>null),
  ]);
  if(cfg && cfg.diasVidriera) state.cfg.diasVidriera=Number(cfg.diasVidriera)||DIAS_VIDRIERA_DEF;
  state.resumen={precios:pr||{}, sectores:se||{}, limpieza:li||{}, vidrieras:vi||{}};
  state.recurrentes=rec||{};
  state.cargando=false;
}
async function recargar(){
  try{
    if(state.slug) await cargarSucursal(state.slug); else await cargarTodas();
    render();
    if(state.slug){
      avisarVidrierasEnAlerta().catch(()=>{});
      avisarVencidas({[state.slug]:{precios:state.data.precios, sectores:state.data.sectores}}).catch(()=>{});
    }else if(esGerencia){
      // circuitos automáticos de gerencia (no hay backend con cron): se disparan al abrir el resumen
      const porSlug={}; storesVisibles().forEach(st=>{ porSlug[st.slug]={precios:state.resumen.precios[st.slug], sectores:state.resumen.sectores[st.slug]}; });
      avisarVencidas(porSlug).catch(()=>{});
      const gen=await generarRecurrentes().catch(()=>0);
      if(gen){ toast('Se generaron '+gen+' tarea'+(gen===1?'':'s')+' recurrente'+(gen===1?'':'s'),'ok'); await cargarTodas(); render(); }
      podarFotos().catch(()=>{});
    }
  }catch(e){ $('view').innerHTML='<div class="state err"><div class="big-ic">⚠️</div>No se pudo cargar: '+esc(e.message)+'</div>'; }
}
function sumarDias(iso, n){ const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return hoyISO(d); }
/* Aviso por la Bandeja de tareas VENCIDAS (fecha pasada sin marcar): a las cuentas de
   la sucursal + supervisor, una sola vez por tarea (flag tareas/alertasVenc/<slug>/<id>). */
async function avisarVencidas(porSlug){
  const slugs=Object.keys(porSlug||{}); if(!slugs.length) return;
  let flags=null; const patch={};
  for(const slug of slugs){
    const venc=[];
    ['precios','sectores'].forEach(tipo=>pendientes(porSlug[slug]&&porSlug[slug][tipo]).filter(vencida).forEach(t=>venc.push({tipo,t})));
    if(!venc.length) continue;
    if(!flags) flags=await fbGet('alertasVenc').catch(()=>null)||{};
    const nuevas=venc.filter(x=>!(flags[slug]&&flags[slug][x.t.id])); if(!nuevas.length) continue;
    const mails=[...await mailsDeSucursal(slug), ...ALERTA_AVISADOS];
    const texto='⚠ '+nombreSuc(slug)+': '+nuevas.length+' tarea'+(nuevas.length===1?'':'s')+' vencida'+(nuevas.length===1?'':'s')+' sin hacer: '
      +nuevas.map(x=>'«'+x.t.titulo+'» ('+TIPOS[x.tipo].nombre+', '+fmtFecha(x.t.vigencia||x.t.limite)+')').join(', ')
      +'. Hacela y marcala como hecha en Tareas de la Sucursal.';
    await directo(mails, texto);
    nuevas.forEach(x=>patch[slug+'/'+x.t.id]=Date.now());
  }
  if(Object.keys(patch).length) await fbPatch('alertasVenc', patch).catch(()=>{});
}
/* Poda de fotos grandes (gerencia, una vez por día por dispositivo): tareas hechas y
   limpiezas de hace más de PODA_DIAS días pierden la foto grande; queda la miniatura
   y el registro (marcado `podada`). Las vidrieras no se podan. */
async function podarFotos(){
  const k='tareas_poda_'+hoyISO(); try{ if(localStorage.getItem(k)) return; }catch(e){}
  const R=state.resumen; if(!R) return; const lim=Date.now()-PODA_DIAS*86400000; const patch={}; let n=0;
  ['precios','sectores'].forEach(tipo=>Object.keys(R[tipo]).forEach(slug=>lista(R[tipo][slug]).forEach(t=>{
    if(t.estado!=='hecha' || !(t.hecho && t.hecho.ts<lim)) return;
    ['antes','despues'].forEach(l=>{ const r=t.fotos&&t.fotos[l]; if(r&&(r.id||r.url)){ borrarFoto(slug,r); const b=tipo+'/'+slug+'/'+t.id+'/fotos/'+l; patch[b+'/id']=null; patch[b+'/url']=null; patch[b+'/podada']=true; n++; } });
  })));
  Object.keys(R.limpieza).forEach(slug=>lista(R.limpieza[slug]).forEach(i=>Object.entries(i.hechos||{}).forEach(([per,h])=>{
    if(!h || !(h.ts && h.ts<lim)) return;
    ['antes','despues'].forEach(l=>{ const r=h[l]; if(r&&(r.id||r.url)){ borrarFoto(slug,r); const b='limpieza/'+slug+'/'+i.id+'/hechos/'+per+'/'+l; patch[b+'/id']=null; patch[b+'/url']=null; patch[b+'/podada']=true; n++; } });
  })));
  if(n) await fbPatch('', patch);
  try{ localStorage.setItem(k,'1'); }catch(e){}
}
/* Plantillas recurrentes (gerencia): cada N días se genera sola la tarea en sus
   sucursales, con fecha = vencimiento + plazo. Se corre al abrir el resumen. */
async function generarRecurrentes(){
  const rec=state.recurrentes||{}; const hoy=hoyISO(); const patch={}; let n=0; const avisos=[];
  for(const [id,r] of Object.entries(rec)){
    if(!r || r.activo===false || !r.proximo || r.proximo>hoy) continue;
    const cada=Math.max(1, Number(r.cadaDias)||7);
    let prox=r.proximo; while(prox<=hoy) prox=sumarDias(prox, cada);
    const due=sumarDias(prox, -cada);                       // la última ocurrencia vencida
    const fecha=sumarDias(due, Math.max(0, Number(r.plazoDias)||0));
    const slugs=(r.sucursales&&r.sucursales.length)?r.sucursales:STORES.map(x=>x.slug);
    const tipo=r.tipo==='sectores'?'sectores':'precios';
    const base={ titulo:r.titulo, marca:r.marca||'', detalle:r.detalle||'', estado:'pendiente', origen:'gerencia', recurrente:id, exigeFoto:!!r.exigeFoto,
      creado:{por:'Recurrente · '+nombreCorto(SESSION.email), mail:SESSION.email||'', ts:Date.now()} };
    if(tipo==='precios') base.vigencia=fecha; else { base.limite=fecha; base.ubicacion=r.ubicacion||''; }
    slugs.forEach(sl=>{ patch[tipo+'/'+sl+'/'+uid()]=base; n++; });
    patch['recurrentes/'+id+'/proximo']=prox; patch['recurrentes/'+id+'/ultima']=hoy;
    avisos.push({tipo, base, slugs});
  }
  if(!n) return 0;
  await fbPatch('', patch);
  avisos.forEach(a=>avisarTareaNueva(a.tipo, a.base, a.slugs).catch(()=>{}));
  return n;
}

function lista(obj){ return Object.entries(obj||{}).filter(([k,v])=>v&&typeof v==='object').map(([k,v])=>Object.assign({id:k},v)); }

/* ============================================================
   FOTOS — compresión en el navegador (sin subir el original)
   ============================================================ */
function leerImagen(file){
  return new Promise((res,rej)=>{
    if(window.createImageBitmap){
      createImageBitmap(file,{imageOrientation:'from-image'}).then(res).catch(()=>{
        const url=URL.createObjectURL(file); const im=new Image(); im.onload=()=>{URL.revokeObjectURL(url);res(im);}; im.onerror=rej; im.src=url;
      });
    }else{ const url=URL.createObjectURL(file); const im=new Image(); im.onload=()=>{URL.revokeObjectURL(url);res(im);}; im.onerror=rej; im.src=url; }
  });
}
function reducir(img, max, q){
  const w=img.width, h=img.height, k=Math.min(1, max/Math.max(w,h));
  const c=document.createElement('canvas'); c.width=Math.round(w*k); c.height=Math.round(h*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg', q);
}
async function comprimirFoto(file){
  const img=await leerImagen(file);
  return { full:reducir(img,1280,.78), thumb:reducir(img,360,.68) };
}
// Abre el selector/cámara y devuelve {full,thumb} o null si canceló.
function pedirFoto(){
  return new Promise(res=>{
    const inp=$('fileInp'); inp.value='';
    inp.onchange=async()=>{
      const f=inp.files&&inp.files[0]; if(!f){ res(null); return; }
      try{ toast('Preparando la foto…'); res(await comprimirFoto(f)); }catch(e){ toast('No se pudo leer la foto','err'); res(null); }
    };
    inp.click();
  });
}
// Guarda la foto grande (Storage si hay bucket; si no, tareas/fotos/<slug>/<id> en la
// RTDB) y devuelve la referencia liviana para el ítem: {id, thumb, ts, por[, url]}.
async function guardarFoto(slug, foto){
  const id=uid(); const ref={id, thumb:foto.thumb, ts:Date.now(), por:firma()};
  if(STORAGE_BUCKET){
    try{ ref.url=await storageSubir(slug+'/'+id+'.jpg', foto.full); return ref; }
    catch(e){ if(esErrorRed(e)) throw e; console.warn('Storage falló, cae a la RTDB', e); }
  }
  await fbPut('fotos/'+slug+'/'+id, {data:foto.full, ts:ref.ts, por:ref.por});
  return ref;
}
async function storageSubir(name, dataUri){
  const blob=await (await fetch(dataUri)).blob();
  const r=await fetch('https://firebasestorage.googleapis.com/v0/b/'+STORAGE_BUCKET+'/o?name='+encodeURIComponent(ROOT+'/'+name),{method:'POST',headers:{'Content-Type':'image/jpeg'},body:blob});
  if(!r.ok) throw new Error('Storage HTTP '+r.status);
  const j=await r.json();
  return 'https://firebasestorage.googleapis.com/v0/b/'+STORAGE_BUCKET+'/o/'+encodeURIComponent(j.name)+'?alt=media&token='+j.downloadTokens;
}
// Borra la foto grande (no la miniatura, que vive en el ítem). Best-effort.
function borrarFoto(slug, ref){
  if(!ref) return;
  if(ref.url){ fetch(ref.url.split('?')[0],{method:'DELETE'}).catch(()=>{}); }
  else if(ref.id) fbDel('fotos/'+slug+'/'+ref.id).catch(()=>{});
}
const _fotoCache={};
async function bajarFoto(slug, ref){
  if(!ref) return null; if(ref.url) return ref.url; if(!ref.id) return ref.thumb||null;
  const k=slug+'/'+ref.id; if(_fotoCache[k]) return _fotoCache[k];
  const f=await fbGet('fotos/'+slug+'/'+ref.id).catch(()=>null);
  const d=(f&&f.data)||ref.thumb||null; if(d) _fotoCache[k]=d; return d;
}

      +(ondel?'<button class="x" title="Quitar foto" onclick="event.stopPropagation();'+ondel+'">×</button>':'')+'</div>';
  }
  return '<div class="foto" onclick="'+onclick+'"><div class="empty"><span class="ic">📷</span>'+lab+'<br><small>tocar para sacar / subir</small></div></div>';
}

/* ============================================================
   LIMPIEZA — checklist con frecuencia
   ============================================================ */
const FREC={diaria:{l:'Hoy',s:'todos los días'}, semanal:{l:'Esta semana',s:'una vez por semana'}, mensual:{l:'Este mes',s:'una vez por mes'}};
// clave del período vigente según la frecuencia (día / lunes / mes)
function periodoDe(f, d){ return f==='semanal' ? lunesDe(d) : f==='mensual' ? mesDe(d) : hoyISO(d); }
function entradaPeriodo(item){ const k=periodoDe(item.frecuencia||'diaria'); return item.hechos && item.hechos[k] ? item.hechos[k] : null; }
// hecho = entrada del período con firma (una foto de «antes» sola deja la entrada pendiente)
function hechoEnPeriodo(item){ const e=entradaPeriodo(item); return e && !e.pendiente ? e : null; }
function limpiezaEstado(obj){
  const r={diaria:{tot:0,ok:0,pend:0}, semanal:{tot:0,ok:0,pend:0}, mensual:{tot:0,ok:0,pend:0}};
  lista(obj).filter(i=>i.activo!==false).forEach(i=>{ const f=r[i.frecuencia]||r.diaria; f.tot++; if(hechoEnPeriodo(i)) f.ok++; else f.pend++; });
  return r;
}
// Últimos 14 períodos de un ítem (para los puntitos de cumplimiento)
function ultimosPeriodos(f, n){
  const out=[]; const d=new Date(); d.setHours(12,0,0,0);
  for(let i=0;i<n;i++){
    out.unshift(periodoDe(f,d));
    if(f==='mensual') d.setMonth(d.getMonth()-1); else if(f==='semanal') d.setDate(d.getDate()-7); else d.setDate(d.getDate()-1);
  }
  return out;
}
function renderLimpieza(){
  const D=state.data.limpieza, items=lista(D).filter(i=>i.activo!==false), est=limpiezaEstado(D);
  let h='<div class="sec-head"><div><h1>🧹 Limpieza</h1><div class="sub">'+esc(nombreSuc(state.slug))+' · '+fmtFecha(hoyISO())+'</div></div>'
    +'<div class="acts">'+(items.length?'':'<button class="btn btn-navy" onclick="cargarSugerido()">⇩ Cargar checklist sugerido</button>')+'<button class="btn btn-primary" onclick="nuevaLimpieza()">+ Agregar tarea</button></div></div>';
  if(!items.length){
    h+='<div class="state"><div class="big-ic">🧹</div><h3>Todavía no hay checklist de limpieza</h3><p>Cargá el checklist sugerido (vidrios, piso, probadores, baño, depósito…) y ajustalo a tu local, o agregá las tareas una por una. Cada día se marcan las que se hicieron.</p><button class="btn btn-navy" onclick="cargarSugerido()">⇩ Cargar checklist sugerido</button></div>';
    $('view').innerHTML=h; return;
  }
  const kp=(l,e)=>'<div class="kpi"><div class="l">'+l+'</div><div class="v '+(e.tot?(e.ok===e.tot?'ok':e.ok?'warn':'bad'):'')+'">'+e.ok+'<span style="font-size:16px;color:var(--muted)"> / '+e.tot+'</span></div><div class="s">'+(e.tot?(e.pend?e.pend+' pendiente'+(e.pend===1?'':'s'):'todo hecho ✓'):'sin tareas')+'</div></div>';
  h+='<div class="kpis">'+kp('Hoy',est.diaria)+kp('Esta semana',est.semanal)+kp('Este mes',est.mensual)+'</div>';
  ['diaria','semanal','mensual'].forEach(f=>{
    const its=sortBy(items.filter(i=>(i.frecuencia||'diaria')===f), i=>(hechoEnPeriodo(i)?'1':'0')+(i.zona||'')+(i.titulo||''));
    if(!its.length) return;
    const e=est[f], pct=e.tot?Math.round(e.ok/e.tot*100):0;
    h+='<div class="grupo"><div class="grupo-h"><h2>'+FREC[f].l+' <small style="color:var(--muted);font-weight:500;text-transform:none;letter-spacing:0">· '+FREC[f].s+'</small></h2><div class="prog"><div class="bar"><i class="'+(pct===100?'ok':'')+'" style="width:'+pct+'%"></i></div>'+e.ok+'/'+e.tot+'</div></div>';
    its.forEach(i=>{
      const hp=hechoEnPeriodo(i); const per=ultimosPeriodos(f, f==='mensual'?6:f==='semanal'?8:14); const hoyK=periodoDe(f);
      const dots=per.map(k=>'<i class="'+(i.hechos&&i.hechos[k]?'on':(k===hoyK?'':'off'))+(k===hoyK?' hoy':'')+'" title="'+k+'"></i>').join('');
      const q='\''+i.id+'\'';
      const fa=hp&&hp.antes, fd=hp&&hp.despues;
      h+='<div class="lrow '+(hp?'ok':'')+'"><button class="chk '+(hp?'on':'')+'" onclick="toggleLimpieza('+q+')" title="'+(hp?'Desmarcar':'Marcar como hecha')+'">'+(hp?'✓':'')+'</button>'
        +'<div><div class="n">'+esc(i.titulo)+'</div><div class="z">'+(i.zona?esc(i.zona)+' · ':'')+(hp?'<b>hecho '+fmtTs(hp.ts)+(hp.por?' · '+esc(hp.por):'')+'</b>':'pendiente')+'</div><div class="dots">'+dots+'</div></div>'
        +'<div class="r">'+(fa||fd?'<div class="mini">'+(fa?'<img src="'+fa.thumb+'" title="Antes" onclick="verFotosLimpieza('+q+')">':'')+(fd?'<img src="'+fd.thumb+'" title="Después" onclick="verFotosLimpieza('+q+')">':'')+'</div>':'')
        +'<button class="ibtn" title="Foto de antes" onclick="fotoLimpieza('+q+',\'antes\')">📷</button><button class="ibtn" title="Foto de después" onclick="fotoLimpieza('+q+',\'despues\')">✨</button>'
        +'<button class="ibtn" title="Editar" onclick="editarLimpieza('+q+')">✏</button></div></div>';
    });
    h+='</div>';
  });
  h+='<p class="ro">Los puntitos muestran los últimos períodos: verde = hecho, rojo = no se hizo, el recuadro es el período actual. 📷 guarda la foto de antes y ✨ la de después del día.</p>';
  $('view').innerHTML=h;
}
async function toggleLimpieza(id){
  const i=state.data.limpieza[id]; if(!i) return;
  const k=periodoDe(i.frecuencia||'diaria'); const e=entradaPeriodo(i);
  try{
    if(e && !e.pendiente){
      if(!confirm('¿Desmarcar «'+i.titulo+'»?'+(e.antes||e.despues?' Se quitan también sus fotos del período.':''))) return;
      await fbDel('limpieza/'+state.slug+'/'+id+'/hechos/'+k); delete i.hechos[k];
    }else{
      const h=Object.assign({}, e||{}, {por:firma(), ts:Date.now()}); delete h.pendiente;
      await fbPut('limpieza/'+state.slug+'/'+id+'/hechos/'+k, h); i.hechos=i.hechos||{}; i.hechos[k]=h;
    }
    render();
  }catch(e){ toast('No se pudo guardar: '+e.message,'err'); }
}
async function fotoLimpieza(id, lado){
  const i=state.data.limpieza[id]; if(!i) return;
  const foto=await pedirFoto(); if(!foto) return;
  const k=periodoDe(i.frecuencia||'diaria');
  try{
    const ref=await guardarFoto(state.slug, foto);
    i.hechos=i.hechos||{};
    const h=Object.assign({}, i.hechos[k]||{});
    // la foto de después marca la tarea como hecha; la de antes sola queda como entrada pendiente
    if(!h.ts){ if(lado==='despues'){ h.por=firma(); h.ts=Date.now(); delete h.pendiente; } else h.pendiente=true; }
    h[lado]=ref;
    await fbPut('limpieza/'+state.slug+'/'+id+'/hechos/'+k, h); i.hechos[k]=h;
    render(); toast('Foto guardada','ok');
  }catch(e){ toast('No se pudo guardar la foto: '+e.message,'err'); }
}

/* ============================================================

function ultimoCambio(v){ const cs=lista(v.cambios||{}); if(!cs.length) return null; return sortBy(cs, c=>c.ts||0, true)[0]; }
function diasAlertaDe(v){ return Number(v.diasAlerta)||state.cfg.diasVidriera||DIAS_VIDRIERA_DEF; }
function vidEstado(v){
  const u=ultimoCambio(v); const lim=diasAlertaDe(v);
  const ts=u?u.ts:(v.creado&&v.creado.ts); const d=diasDesde(ts);
  if(d==null) return {cls:'na', dias:null, lim, txt:'sin cambios registrados'};
  if(d>=lim) return {cls:'bad', dias:d, lim, txt:'⚠ Sin cambios hace '+d+' días (tope '+lim+')'};
  if(d>=Math.max(lim-4, Math.round(lim*.7))) return {cls:'warn', dias:d, lim, txt:'Le quedan '+(lim-d)+' días para el cambio'};
  return {cls:'ok', dias:d, lim, txt:'Al día'};
}

  if(!vids.length){

/* ---- Cumplimiento del mes ---- */
function mesesDisponibles(){ const out=[]; const d=new Date(); d.setDate(1); for(let i=0;i<6;i++){ out.push(mesDe(d)); d.setMonth(d.getMonth()-1); } return out; }
function mesLabel(ym){ const [y,m]=ym.split('-'); return ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'][Number(m)-1]+' '+y; }
function cumplSucursal(slug, ym){
  const R=state.resumen; const hoy=hoyISO();
  const c={slug, hechas:0, total:0, aTiempo:0, diasSum:0, liOk:0, liTot:0, cambios:0, vids:0, alerta:0, tareas:[]};
  ['precios','sectores'].forEach(tipo=>lista(R[tipo][slug]).forEach(t=>{
    const fecha=t.vigencia||t.limite;
    const hechaMes = t.estado==='hecha' && t.hecho && mesDe(new Date(t.hecho.ts))===ym;
    const vencMes = t.estado!=='hecha' && fecha && fecha.slice(0,7)===ym && fecha<hoy;
    if(hechaMes){ c.total++; c.hechas++; const ok=!fecha || hoyISO(new Date(t.hecho.ts))<=fecha; if(ok) c.aTiempo++; c.diasSum+=Math.max(0,(t.hecho.ts-((t.creado&&t.creado.ts)||t.hecho.ts))/86400000); c.tareas.push({tipo,t,ok}); }
    else if(vencMes){ c.total++; c.tareas.push({tipo,t,ok:false}); }
  }));
  const [y,m]=ym.split('-').map(Number); const ini=new Date(y,m-1,1), fin=new Date(y,m,0), hoyD=new Date(); const finEf=fin<hoyD?fin:hoyD;
  lista(R.limpieza[slug]).filter(i=>i.activo!==false).forEach(i=>{
    const f=i.frecuencia||'diaria'; const alta=i.creado&&i.creado.ts?new Date(i.creado.ts):ini; const desde=alta>ini?alta:ini; if(desde>finEf) return;
    const per=new Set(); const d=new Date(desde); d.setHours(12,0,0,0);
    while(d<=finEf){ per.add(periodoDe(f,d)); d.setDate(d.getDate()+1); }
    per.forEach(k=>{ c.liTot++; if(i.hechos&&i.hechos[k]&&!i.hechos[k].pendiente) c.liOk++; });
  });
  lista(R.vidrieras[slug]).forEach(v=>{ c.vids++; if(vidEstado(v).cls==='bad') c.alerta++; lista(v.cambios||{}).forEach(ch=>{ if(mesDe(new Date(ch.ts))===ym) c.cambios++; }); });
  c.pctTiempo = c.total? c.aTiempo/c.total : null;
  c.diasProm = c.hechas? c.diasSum/c.hechas : null;
  c.pctLimp = c.liTot? c.liOk/c.liTot : null;
  c.pctVid = c.vids? (c.vids-c.alerta)/c.vids : null;
  const parts=[c.pctTiempo,c.pctLimp,c.pctVid].filter(x=>x!=null);
  c.indice = parts.length? parts.reduce((a,b)=>a+b,0)/parts.length : null;
  return c;
}
const pct=x=>x==null?'—':Math.round(x*100)+'%';
const clsPct=x=>x==null?'na':x>=.9?'ok':x>=.7?'amb':'bad';
function renderCumpl(){

  const tot=rows.reduce((a,r)=>({hechas:a.hechas+r.hechas,total:a.total+r.total,aTiempo:a.aTiempo+r.aTiempo,liOk:a.liOk+r.liOk,liTot:a.liTot+r.liTot,cambios:a.cambios+r.cambios,vids:a.vids+r.vids,alerta:a.alerta+r.alerta}),{hechas:0,total:0,aTiempo:0,liOk:0,liTot:0,cambios:0,vids:0,alerta:0});
  let h=resHead('Ranking por sucursal · el índice promedia tareas a tiempo, limpieza cumplida y vidrieras al día. Insumo para la evaluación del supervisor.');

  h+='<div class="kpis"><div class="kpi"><div class="l">Tareas a tiempo</div><div class="v '+clsPct(tot.total?tot.aTiempo/tot.total:null)+'">'+pct(tot.total?tot.aTiempo/tot.total:null)+'</div><div class="s">'+tot.aTiempo+' de '+tot.total+' (hechas '+tot.hechas+')</div></div>'

/* ---- Excel (ExcelJS, estilo RRHH: membrete + header navy con línea roja + autofiltro) ---- */
const XC={navy:'FF0B1527',red:'FFCC0000',linea:'FFDCE3F0',muted:'FF6B7A99',okBg:'FFE7F6EC',okTx:'FF166534',badBg:'FFFDECEC',badTx:'FF991B1B',ambBg:'FFFFF7ED',ambTx:'FF92400E'};
const xcFill=argb=>({type:'pattern',pattern:'solid',fgColor:{argb}});
function xcHoja(wb, nombre, cols, titulo, sub, header, filas, colorCol){
  const ws=wb.addWorksheet(nombre.replace(/[\\/*?:\[\]]/g,'-').slice(0,31), {views:[{state:'frozen', ySplit:4}]});
  ws.columns=cols.map(w=>({width:w}));
  ws.mergeCells(1,1,1,cols.length); const t=ws.getCell(1,1); t.value=titulo; t.font={name:'Arial',size:15,bold:true,color:{argb:XC.navy}}; ws.getRow(1).height=26;
  ws.mergeCells(2,1,2,cols.length); const st=ws.getCell(2,1); st.value=sub; st.font={name:'Arial',size:9,italic:true,color:{argb:XC.muted}}; ws.getRow(3).height=6;
  const hr=ws.getRow(4); header.forEach((h,i)=>{ const c=hr.getCell(i+1); c.value=h; c.font={name:'Arial',size:10,bold:true,color:{argb:'FFFFFFFF'}}; c.fill=xcFill(XC.navy); c.alignment={vertical:'middle',wrapText:true}; c.border={bottom:{style:'thin',color:{argb:XC.red}}}; }); hr.height=24;
  filas.forEach(f=>{ const r=ws.addRow(f); r.eachCell((c,i)=>{ c.font={name:'Arial',size:9.5}; c.border={bottom:{style:'hair',color:{argb:XC.linea}}};
    const k=colorCol&&colorCol(f,i-1); if(k){ c.fill=xcFill(XC[k+'Bg']); c.font={name:'Arial',size:9.5,bold:true,color:{argb:XC[k+'Tx']}}; } }); });
  if(filas.length) ws.autoFilter={from:{row:4,column:1},to:{row:4+filas.length,column:cols.length}};
  return ws;
}

    const wb=new ExcelJS.Workbook(); wb.creator='Portal Mateu Sports';

    // Hoy

      (f,i)=>{ if(i!==9||f[9]==='—') return null; return f[9]>=90?'ok':f[9]>=70?'amb':'bad'; });
    // Tareas del mes (detalle)

      const fecha=t.vigencia||t.limite; const enMes=(t.hecho&&mesDe(new Date(t.hecho.ts))===ym)||(fecha&&fecha.slice(0,7)===ym)||(t.creado&&mesDe(new Date(t.creado.ts))===ym);

    lim.sort((a,b)=>a[0].localeCompare(b[0])||a[4].localeCompare(b[4]));

    // Vidrieras
    const vid=[];
    storesVisibles().forEach(s=>lista(R.vidrieras[s.slug]).forEach(v=>{ const e=vidEstado(v), u=ultimoCambio(v); const nMes=lista(v.cambios||{}).filter(c=>mesDe(new Date(c.ts))===ym).length;

    xcHoja(wb,'Vidrieras',[20,24,14,20,12,10,12,14,30],'Vidrieras', 'Estado a hoy y cambios de '+mesLabel(ym)+' · '+gen, ['Sucursal','Vidriera','Último cambio','Por','Días sin cambio','Tope','Estado','Cambios en el mes','Última nota'], vid,
      (f,i)=>i===6?(f[6]==='EN ALERTA'?'bad':f[6]==='Por vencer'?'amb':f[6]==='Al día'?'ok':null):null);
    const buf=await wb.xlsx.writeBuffer();

  }else{
    state.slug=slugSesion();
    $('subSuc').innerHTML='<span class="chip-suc">🏪 '+esc(nombreSuc(state.slug))+'</span>';
    $('subYo').style.display='';

    $('yoInp').onchange=()=>{ state.yo=($('yoInp').value||'').trim(); try{ localStorage.setItem('tareas_yo_'+state.slug, state.yo); }catch(e){} };
    // «Yo soy» desde el PADRÓN de la sucursal (shared/equipo.js): lista de personas en

      const sel=$('yoSel'); if(!sel) return;
      sel.innerHTML='<option value="">Yo soy…</option>'+gente.map(p=>'<option value="'+esc(p.nombre)+'"'+(p.nombre===state.yo?' selected':'')+'>'+esc(p.nombre)+' · '+esc(p.puesto)+'</option>').join('');
      if(state.yo && !gente.some(p=>p.nombre===state.yo)){ const r=Equipo.resolver(state.yo, gente); if(r.exacto){ state.yo=r.persona.nombre; sel.value=state.yo; } }
      sel.onchange=()=>{ state.yo=sel.value; try{ localStorage.setItem('tareas_yo_'+state.slug, state.yo); }catch(e){} };
      $('yoInp').style.display='none'; sel.style.display='';
    }).catch(()=>{});
  }
}
function init(){
  if(!SESSION) return;
  $('whoName').textContent=SESSION.email||'—'; $('whoRole').textContent=SESSION.rol||'';
  const salir=$('salir'); if(salir) salir.onclick=()=>{ try{localStorage.removeItem(SESSION_KEY);}catch(e){} location.replace('../'); };
  document.querySelectorAll('.tab').forEach(b=>{ b.onclick=()=>setTab(b.dataset.tab); b.classList.toggle('on', b.dataset.tab===state.tab); });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ cerrarHoja(); cerrarCmp(); } });
  pintarSubbar(); pintarCola(); colaEnviar(false);
  if(esSucursal && !state.slug){ $('view').innerHTML='<div class="state err"><div class="big-ic">⚠️</div>Tu usuario no tiene sucursal asignada. Pedile a gerencia que la cargue en el ⚙ del Portal.</div>'; return; }
  recargar();
}
init();
</script>
