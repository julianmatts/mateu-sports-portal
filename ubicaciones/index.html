<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B1527">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Buscador de Artículos — Mateu Sports</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
:root{
  --navy:#0B1527; --navy-mid:#152238; --navy-light:#1e3252;
  --red:#CC0000; --red-soft:#ff6b6b;
  --white:#fff; --bg:#f5f7fc;
  --gray-200:#e8e7e3; --gray-400:#9a9890; --gray-600:#5a5955;
  --green:#2a6e2a; --green-bg:#e0f2e0;
  --amber:#8a6d1a; --amber-bg:#fdf3d7;
  --red-bg:#fdeaea;
  --font-d:'Bebas Neue',sans-serif; --font-c:'Barlow Condensed',sans-serif; --font-b:'Barlow',sans-serif;
}
html{ -webkit-text-size-adjust:100%; }
body{ font-family:var(--font-b); background:var(--bg); color:var(--navy); font-size:14px; }
button{ font-family:inherit; }
input,select{ font-family:inherit; font-size:16px; } /* 16px evita el zoom automático de iOS */
img,svg{ max-width:100%; } /* ningún medio empuja el ancho en pantallas chicas */

/* ============ HEADER ============ */
.hdr{
  background:#fff; border-bottom:1px solid #dce3f0;
  z-index:300;
  display:flex; align-items:center; gap:10px; padding:10px 14px;
}
/* Isla dinámica: en la app instalada el header sube bajo la barra de estado */
/* Isla dinámica / notch: el header navy se extiende bajo la barra de estado (app instalada);
   en el navegador el inset es 0. Con «html» delante gana a los padding de las media queries móviles. */
html .hdr{padding-top:calc(10px + env(safe-area-inset-top,0px))}
.hdr-logo{ line-height:0; flex-shrink:0; }
.hdr-logo img{ height:30px; filter:brightness(0) invert(1); display:block; }
.hdr-title{ flex:1; min-width:0; }
.hdr-title .t{ font-family:var(--font-d); font-size:20px; letter-spacing:1px; color:var(--navy); line-height:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hdr-title .s{ font-family:var(--font-c); font-size:11px; font-weight:600; letter-spacing:2px; text-transform:uppercase; color:#6B7A99; }
.hdr-right{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
.perfil-chip{
  display:flex; align-items:center; gap:6px; background:#f0f3fa;
  border:1px solid #dce3f0; border-radius:20px; padding:3px 10px 3px 3px;
  cursor:pointer; color:var(--navy); max-width:130px;
}
.perfil-chip .av{ width:26px; height:26px; border-radius:50%; flex-shrink:0; }
.perfil-chip .nm{ font-family:var(--font-c); font-size:13px; font-weight:600; letter-spacing:.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.btn-salir{
  background:#fdeceb; border:1px solid #f0bfbc; border-radius:6px;
  color:#c0261f; font-family:var(--font-c); font-size:12px; font-weight:600;
  letter-spacing:1px; text-transform:uppercase; padding:6px 10px; cursor:pointer;
}
.btn-salir:hover{ background:#c0261f; color:#fff; border-color:#c0261f; }
.btn-mostrador{
  background:#f0f3fa; border:1px solid #dce3f0; border-radius:6px;
  color:var(--navy); font-family:var(--font-c); font-size:12px; font-weight:600;
  letter-spacing:1px; text-transform:uppercase; padding:6px 10px; cursor:pointer;
  display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
}
.btn-mostrador:hover{ color:var(--red); border-color:var(--red); background:#fff; }
.btn-mostrador.on{ background:var(--navy); color:#fff; border-color:var(--navy); }

/* avatar genérico (imagen o iniciales) */
.av{ border-radius:50%; object-fit:cover; background:var(--navy-mid); color:#fff;
  display:flex; align-items:center; justify-content:center; font-family:var(--font-c); font-weight:700; overflow:hidden; }
.av img{ width:100%; height:100%; object-fit:cover; display:block; }

/* ============ BARRA DE ESTADO ============ */
.statusbar{
  background:#fff; border-bottom:1px solid var(--gray-200);
  padding:7px 14px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  font-size:12px; color:var(--gray-600);
}
.statusbar .st-right{ margin-left:auto; display:flex; flex-direction:column; align-items:flex-end; gap:5px; }
.statusbar .sync{ font-size:11px; color:var(--gray-400); white-space:nowrap; }
.statusbar #btnCargarStock{ white-space:nowrap; }
.carga-warn{ color:var(--red); font-weight:600; }
.carga-ok{ color:var(--green); }

/* semáforo */
.semaforo{ display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px; vertical-align:middle; }
.semaforo.verde{ background:#3aa03a; } .semaforo.amarillo{ background:#e0b020; } .semaforo.rojo{ background:var(--red); }

/* ============ TABS ============ */
.tabs{
  background:#fff; border-bottom:1px solid var(--gray-200); display:flex;
  position:sticky; top:var(--msh-h,67px); z-index:250; overflow-x:auto;
}
.tab{
  flex:1; border:none; background:transparent; padding:11px 8px; cursor:pointer;
  font-family:var(--font-c); font-size:14px; font-weight:700; letter-spacing:1.5px;
  text-transform:uppercase; color:var(--gray-400); border-bottom:3px solid transparent;
  white-space:nowrap; position:relative;
}
.tab.active{ color:var(--navy); border-bottom-color:var(--red); }
.tab .badge{
  background:var(--red); color:#fff; border-radius:9px; font-size:11px; font-weight:700;
  padding:1px 6px; margin-left:4px; font-family:var(--font-b); letter-spacing:0;
}

.main{ padding:12px 14px 90px; max-width:860px; margin:0 auto; }
.view{ display:none; } .view.active{ display:block; }

/* ============ CARDS / GENÉRICOS ============ */
.card{ background:#fff; border:1px solid var(--gray-200); border-radius:6px; padding:14px; margin-bottom:12px; }
.card-title{ font-family:var(--font-c); font-size:14px; font-weight:700; letter-spacing:1px; text-transform:uppercase; margin-bottom:10px; }
.empty{ text-align:center; color:var(--gray-400); padding:26px 10px; font-size:14px; }
.hint{ font-size:12px; color:var(--gray-400); }
.btn-sec{ border:1px solid var(--gray-200); background:#fff; border-radius:8px; padding:7px 14px; font-size:13px; font-weight:600; cursor:pointer; }
.btn-sec:hover{ border-color:var(--navy); }
.btn-pri{ border:none; background:var(--red,#CC0000); color:#fff; border-radius:8px; padding:8px 16px; font-size:13px; font-weight:700; cursor:pointer; }

.btn{
  font-family:var(--font-c); font-size:14px; font-weight:700; letter-spacing:1.5px;
  text-transform:uppercase; padding:10px 18px; border-radius:6px; cursor:pointer;
  border:none; transition:opacity .15s;
}
.btn:disabled{ opacity:.5; cursor:default; }
.btn-primary{ background:var(--red); color:#fff; }
.btn-navy{ background:var(--navy); color:#fff; }
.btn-outline{ background:transparent; border:1.5px solid var(--gray-200); color:var(--gray-600); }
.btn-outline:hover{ border-color:var(--navy); color:var(--navy); }
.btn-sm{ padding:6px 12px; font-size:12px; letter-spacing:1px; }
.btn-block{ display:block; width:100%; }

/* ============ BUSCADOR ============ */
.search-wrap{ position:relative; margin-bottom:12px; }
/* buscador protagonista: alto, letra grande, borde navy y sombra; en rojo al enfocar */
.search-input{
  width:100%; height:100%; min-height:64px; padding:16px 56px 16px 22px;
  border:2px solid var(--navy); border-radius:10px; outline:none; background:#fff;
  font-size:20px; font-weight:500; color:var(--navy); box-shadow:0 4px 14px rgba(11,21,39,.10);
}
.search-input::placeholder{ color:var(--gray-400); font-weight:400; }
.search-input:focus{ border-color:var(--red); box-shadow:0 4px 18px rgba(204,0,0,.16); }
.search-input:focus{ border-color:var(--navy); }
.search-clear{
  position:absolute; right:8px; top:50%; transform:translateY(-50%);
  border:none; background:transparent; font-size:24px; color:var(--gray-400); cursor:pointer;
  padding:6px 12px; display:none;
}

/* sección SIN UBICAR */
.su-head{
  display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none;
  background:var(--navy); color:#fff; border-radius:6px; padding:11px 14px; margin-bottom:8px;
}
.su-head .tt{ font-family:var(--font-c); font-size:14px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; }
.su-head .badge{ background:var(--red); color:#fff; border-radius:10px; font-size:12px; font-weight:700; padding:2px 9px; }
.su-head .arrow{ margin-left:auto; transition:transform .15s; }
.su-head.open .arrow{ transform:rotate(180deg); }
.su-body{ display:none; margin-bottom:14px; }
.su-body.open{ display:block; }

/* card de artículo */
.art-card{
  background:#fff; border:1px solid var(--gray-200); border-left:3px solid var(--gray-200);
  border-radius:6px; padding:11px 12px; margin-bottom:8px;
}
.art-card.sin-ubicar{ border-left-color:var(--red); }
.art-top{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
.art-cod{
  font-family:var(--font-c); font-size:15px; font-weight:700; letter-spacing:.5px;
  background:none; border:none; padding:0; color:var(--navy); cursor:pointer;
  border-bottom:1px dotted var(--gray-400); text-align:left;
}
.art-cod:hover{ color:var(--red); border-bottom-color:var(--red); }
.art-stock{
  margin-left:auto; font-family:var(--font-c); font-size:12px; font-weight:700;
  background:var(--bg); border:1px solid var(--gray-200); border-radius:3px; padding:2px 8px;
  color:var(--gray-600); white-space:nowrap;
}
.art-desc{ font-size:13px; color:var(--gray-600); margin:2px 0 8px; }
/* stock por talle (solo si la carga del día vino abierta por talle) */
.talle-chips{ display:flex; flex-wrap:wrap; gap:4px; margin:-4px 0 8px; }
.talle-chip{
  font-family:var(--font-c); font-size:12px; font-weight:600; letter-spacing:.3px;
  background:var(--bg); border:1px solid var(--gray-200); border-radius:3px; padding:2px 7px;
  color:var(--gray-600); white-space:nowrap;
}
.talle-chip b{ color:var(--navy); }
.talle-chip.cero{ opacity:.5; }
.talle-chip.cero b{ color:var(--red); }
body.puesto .talle-chip{ font-size:15px; padding:4px 10px; }
.ubi-chips{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
.ubi-chip{
  display:inline-flex; align-items:center; gap:6px; background:var(--navy); color:#fff;
  border-radius:4px; padding:7px 10px; font-family:var(--font-c); font-size:13px;
  font-weight:600; letter-spacing:.5px;
}
.ubi-chip .x{
  border:none; background:rgba(255,255,255,.15); color:#fff; border-radius:3px;
  width:22px; height:22px; line-height:1; cursor:pointer; font-size:14px; flex-shrink:0;
}
.ubi-chip .x:hover{ background:var(--red); }
.ubi-add{
  border:1.5px dashed var(--gray-400); background:transparent; color:var(--gray-600);
  border-radius:4px; padding:7px 12px; font-family:var(--font-c); font-size:13px;
  font-weight:600; letter-spacing:.5px; cursor:pointer;
}
.ubi-add:hover{ border-color:var(--navy); color:var(--navy); }
.sin-ubi-tag{
  font-family:var(--font-c); font-size:11px; font-weight:700; letter-spacing:1px;
  text-transform:uppercase; color:var(--red); background:var(--red-bg);
  border-radius:3px; padding:3px 8px;
}
/* artículos nuevos sin ubicar: prioridad para el depósito */
.nuevo-tag{
  font-family:var(--font-c); font-size:11px; font-weight:700; letter-spacing:1px;
  text-transform:uppercase; color:var(--amber); background:var(--amber-bg);
  border-radius:3px; padding:3px 8px;
}
.art-card.nuevo{ border-left-color:var(--amber); background:#fffdf6; }
.nuevos-banner{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  background:var(--amber-bg); border:1px solid #f0dfa8; border-left:4px solid var(--amber);
  border-radius:6px; padding:10px 12px; margin-bottom:12px; font-size:14px; color:var(--navy);
}
.nuevos-banner b{ font-family:var(--font-d); font-size:22px; color:var(--amber); letter-spacing:.5px; }
.nuevos-banner .btn{ margin-left:auto; }
.su-filter{
  font-family:var(--font-c); font-size:12px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
  background:transparent; border:1px solid var(--amber); color:var(--amber); border-radius:12px;
  padding:2px 10px; cursor:pointer; margin-left:6px;
}
.su-filter.on{ background:var(--amber); color:#fff; }

/* ============ ESTANTERÍAS ============ */
.est-card{ background:#fff; border:1px solid var(--gray-200); border-radius:6px; margin-bottom:10px; overflow:hidden; }
.est-head{ display:flex; align-items:center; gap:8px; padding:11px 12px; background:var(--navy); color:#fff; }
.est-head .nm{ font-family:var(--font-c); font-size:15px; font-weight:700; letter-spacing:1px; text-transform:uppercase; flex:1; min-width:0; }
.est-head .cnt{ font-size:11px; color:rgba(255,255,255,.6); white-space:nowrap; }
.icon-btn{
  border:none; background:rgba(255,255,255,.12); color:#fff; border-radius:4px;
  width:30px; height:30px; cursor:pointer; font-size:14px; flex-shrink:0; line-height:1;
}
.icon-btn:hover{ background:var(--red); }
.icon-btn.lite{ background:transparent; border:1px solid var(--gray-200); color:var(--gray-600); }
.icon-btn.lite:hover{ background:var(--bg); color:var(--navy); border-color:var(--gray-400); }
.mod-list{ padding:10px 12px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.mod-chip{
  display:inline-flex; align-items:center; gap:7px; background:var(--bg);
  border:1px solid var(--gray-200); border-radius:4px; padding:8px 12px; cursor:pointer;
  font-family:var(--font-c); font-size:14px; font-weight:600; letter-spacing:.5px;
}
.mod-chip:hover{ border-color:var(--navy); }
.mod-chip .n{ background:var(--navy); color:#fff; border-radius:9px; font-size:11px; padding:1px 7px; font-family:var(--font-b); }
.mod-chip .edit{ border:none; background:transparent; color:var(--gray-400); cursor:pointer; font-size:13px; padding:0 2px; }
.mod-chip .edit:hover{ color:var(--navy); }

/* ============ PERFILES ============ */
.perfil-select-screen{
  min-height:100vh; background:var(--navy); display:flex; flex-direction:column;
  align-items:center; justify-content:center; padding:30px 16px; text-align:center;
}
.pss-logo img{ height:40px; filter:brightness(0) invert(1); margin-bottom:8px; }
.pss-title{ font-family:var(--font-d); font-size:32px; letter-spacing:2px; color:#fff; }
.pss-sub{ font-family:var(--font-c); font-size:14px; letter-spacing:2px; text-transform:uppercase; color:rgba(255,255,255,.5); margin-bottom:34px; }
.pss-grid{ display:flex; flex-wrap:wrap; gap:22px; justify-content:center; max-width:600px; }
.pss-item{ cursor:pointer; width:96px; background:transparent; border:none; }
.pss-item .av{ width:88px; height:88px; margin:0 auto 8px; font-size:30px; border:3px solid transparent; transition:border-color .15s; }
.pss-item:hover .av, .pss-item.kb-sel .av{ border-color:var(--red); }
.pss-item.kb-sel .nm{ color:#fff; }
.pss-item{ outline:none; }
.pss-item .nm{ font-family:var(--font-c); font-size:15px; font-weight:600; letter-spacing:.5px; color:rgba(255,255,255,.85); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pss-item .rl{ font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:rgba(255,255,255,.4); }
.pss-exit{ margin-top:38px; }

.perfil-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; }
.perfil-card{ background:#fff; border:1px solid var(--gray-200); border-radius:6px; padding:14px 10px; text-align:center; }
.perfil-card .av{ width:64px; height:64px; margin:0 auto 8px; font-size:22px; }
.perfil-card .nm{ font-family:var(--font-c); font-size:15px; font-weight:700; }
.perfil-card .rl{ font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--gray-400); margin-bottom:8px; }

/* ============ MODALS / SHEET ============ */
.overlay{
  display:none; position:fixed; inset:0; background:rgba(11,21,39,.55); z-index:800;
  align-items:center; justify-content:center; padding:16px;
}
.overlay.show{ display:flex; }
.modal{
  background:#fff; border-radius:8px; padding:18px; width:460px; max-width:100%;
  max-height:86vh; overflow-y:auto;
}
.modal-title{
  font-family:var(--font-c); font-size:16px; font-weight:700; letter-spacing:1px;
  text-transform:uppercase; margin-bottom:12px; padding-bottom:8px; border-bottom:2px solid var(--navy);
}
.modal-footer{ margin-top:16px; display:flex; justify-content:flex-end; gap:8px; flex-wrap:wrap; }

.sheet-overlay{
  display:none; position:fixed; inset:0; background:rgba(11,21,39,.55); z-index:850;
  align-items:flex-end; justify-content:center;
}
.sheet-overlay.show{ display:flex; }
.sheet{
  background:#fff; border-radius:14px 14px 0 0; width:100%; max-width:560px;
  max-height:78vh; overflow-y:auto; padding:16px 16px 26px;
}
.sheet-title{ font-family:var(--font-c); font-size:15px; font-weight:700; letter-spacing:1px; text-transform:uppercase; margin-bottom:4px; }
.sheet-sub{ font-size:12px; color:var(--gray-400); margin-bottom:14px; }
.sheet-opt{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  background:var(--bg); border:1px solid var(--gray-200); border-radius:6px;
  padding:14px; margin-bottom:8px; cursor:pointer; font-family:var(--font-c);
  font-size:16px; font-weight:600; letter-spacing:.5px;
}
.sheet-opt:hover{ border-color:var(--navy); }
.sheet-opt .n{ margin-left:auto; font-size:11px; color:var(--gray-400); font-family:var(--font-b); }

/* formularios */
.fld{ margin-bottom:12px; }
.fld label{
  display:block; font-family:var(--font-c); font-size:11px; font-weight:700;
  letter-spacing:1.5px; text-transform:uppercase; color:var(--gray-600); margin-bottom:4px;
}
.fld input[type=text], .fld input[type=number], .fld select{
  width:100%; padding:10px 12px; border:1.5px solid var(--gray-200); border-radius:6px; outline:none; background:#fff;
}
.fld input:focus, .fld select:focus{ border-color:var(--navy); }
.radio-row{ display:flex; gap:8px; flex-wrap:wrap; }
.radio-row label{
  flex:1 1 calc(50% - 8px); display:flex; align-items:center; justify-content:center; gap:6px;
  border:1.5px solid var(--gray-200); border-radius:6px; padding:10px; cursor:pointer;
  font-family:var(--font-c); font-size:14px; font-weight:600; letter-spacing:.5px; text-transform:none;
}
.radio-row input{ accent-color:var(--red); }
.radio-row label.sel{ border-color:var(--navy); background:var(--bg); }

/* selector de avatares predeterminados */
.av-pick{ display:grid; grid-template-columns:repeat(auto-fill,minmax(52px,1fr)); gap:8px; }
.av-opt{
  width:52px; height:52px; border-radius:50%; border:2.5px solid transparent;
  cursor:pointer; font-size:26px; line-height:1; display:flex; align-items:center;
  justify-content:center; padding:0; background:var(--bg);
}
.av-opt.sel{ border-color:var(--red); box-shadow:0 0 0 2px rgba(204,0,0,.25); }
.av-opt .av{ width:100%; height:100%; font-size:17px; }
.av.av-emoji{ line-height:1; }

/* resumen de carga */
.res-row{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--gray-200); }
.res-row .num{ font-family:var(--font-d); font-size:26px; min-width:44px; text-align:right; }
.res-row .lbl{ font-family:var(--font-c); font-size:13px; font-weight:600; letter-spacing:1px; text-transform:uppercase; color:var(--gray-600); }
.res-row.nuevos .num{ color:var(--red); } .res-row.elim .num{ color:var(--gray-400); }
.res-toggle{ margin-left:auto; border:none; background:transparent; color:var(--navy); cursor:pointer; font-size:12px; text-decoration:underline dotted; }
.res-lista{ display:none; font-size:12px; color:var(--gray-600); max-height:160px; overflow-y:auto; padding:6px 0 2px; }
.res-lista.open{ display:block; }
.res-lista div{ padding:2px 0; border-bottom:1px dashed var(--gray-200); }

/* tabla resumen global */
.table-wrap{ overflow-x:auto; }
table.resumen{ width:100%; border-collapse:collapse; font-size:13px; }
table.resumen th{
  font-family:var(--font-c); font-size:11px; font-weight:700; letter-spacing:1px;
  text-transform:uppercase; color:var(--gray-400); text-align:left; padding:7px 8px;
  border-bottom:2px solid var(--navy); white-space:nowrap;
}

/* hero: logo + título, calcado del selector de perfiles */

body.puesto .search-input{

}

body.puesto .hist-btn{

}

/* ============ HISTORIAL DE CONSULTAS ============ */
.search-row{ display:flex; gap:10px; margin-bottom:12px; align-items:stretch; flex-wrap:wrap; }
.search-row .search-wrap{ flex:1 1 320px; margin-bottom:0; }
.hist-btn{

  background:#fff; cursor:pointer; line-height:1; position:relative;

.hist-btn svg{ width:26px; height:26px; display:block; }
.hist-btn:hover{ border-color:var(--navy); }
/* píldora SIN UBICAR dentro de la fila: compacta, pero con la cantidad bien grande */

}

@media (max-width:560px){ .search-row .search-wrap{ flex-basis:100%; } }
.hist-btn:hover{ border-color:var(--navy); }
.pick-badge{

}

}
.toast-btn{
  background:transparent; border:none; color:var(--red-soft); font-weight:700;

}
.sheet-opt.sug{ border-color:#3aa03a; background:var(--green-bg); }
.hist-overlay{

  z-index:860; justify-content:flex-end;
}
.hist-overlay.show{ display:flex; }
.hist-drawer{
  background:#fff; width:min(360px,94vw); height:100%; display:flex; flex-direction:column;
  box-shadow:-12px 0 30px rgba(11,21,39,.25);
}

  background:var(--navy); color:#fff; padding:12px 14px; display:flex; align-items:center;
  gap:10px; border-bottom:3px solid var(--red);
}
.hist-head .tt{ font-family:var(--font-c); font-weight:700; letter-spacing:1.5px; text-transform:uppercase; font-size:15px; flex:1; }
.hist-head .cnt{ font-size:12px; color:rgba(255,255,255,.6); }
.hist-list{ flex:1; overflow-y:auto; padding:10px; }
.hist-item{

}
.hist-item:hover{ border-color:var(--navy); }
.hist-item .av{ width:38px; height:38px; flex-shrink:0; font-size:15px; }
.hist-item .info{ flex:1; min-width:0; }

.hist-item .desc{ font-size:11px; color:var(--gray-600); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

.hist-item .quien{ font-size:10px; letter-spacing:.5px; text-transform:uppercase; color:var(--gray-400); font-family:var(--font-c); font-weight:600; }
.hist-item .hora{ font-size:11px; color:var(--gray-400); white-space:nowrap; align-self:flex-start; }
.art-card.flash{ outline:3px solid var(--red); }

/* barra global (admin/supervisión) */
.global-bar{

  position:sticky; top:var(--msh-h,67px); z-index:260;
}

}

.toast{

/* impresión: solo el listado */
#printArea{ display:none; }

  #printArea th{ background:#eee; }

/* ============ MOBILE (≤560px) ============
   El header es la única fuente real de scroll horizontal: en modo sucursal
   se juntan chip de perfil + Mostrador + Salir y aplastan el título a 0px.
   Acá compactamos SOLO el ancho (el alto se mantiene ~57px para no desalinear
   las barras sticky que cuelgan de top:56px). El resto del layout ya colapsa
   solo (flex-wrap, grids con minmax, tablas dentro de .table-wrap). */
@media(max-width:560px){
  .hdr{ padding:10px; gap:8px; }               /* menos padding lateral; alto igual */
  .hdr-logo img{ height:26px; }                /* logo un toque más chico → más aire para el título */

}

<script>
/* ============================================================
   CONFIGURACIÓN
   Base de datos propia del módulo. El proyecto "ubicaciones-mateu"
   se crea a mano en la consola de Firebase (Realtime Database en
   modo test / reglas abiertas, igual que turnero y marcas).
   ============================================================ */
const FB = 'https://ubicaciones-mateu-default-rtdb.firebaseio.com';
const SESSION_KEY = 'mateu_portal_session';
const TOOL_ID = 'ubicaciones';
const POLL_MS = 5000;

// Mismas sucursales que el Portal / Gestión de Stock.
const SUCURSALES = [
  {slug:'calle-12',   nombre:'Calle 12'},
  {slug:'city-bell',  nombre:'City Bell'},
  {slug:'diagonal',   nombre:'Casa Matriz Diagonal 80'},
  {slug:'calle-47',   nombre:'Calle 47'},
  {slug:'calle-49',   nombre:'Calle 49'},
  {slug:'los-hornos', nombre:'Los Hornos'},
  {slug:'plaza',      nombre:'Plaza'},
  {slug:'berisso',    nombre:'Berisso'},
  {slug:'ensenada',   nombre:'Ensenada'},

  {slug:'adidas-12',  nombre:'Adidas 12'},
  {slug:'adidas',     nombre:'Adidas'},
  {slug:'originals',  nombre:'Originals'},
  {slug:'ecommerce',  nombre:'Ecommerce'},
  {slug:'deposito',   nombre:'Deposito'},
];
const SUCURSAL_BY_SLUG = {}; SUCURSALES.forEach(s=>SUCURSAL_BY_SLUG[s.slug]=s);

// Sucursales con más de un depósito físico: rangos de estantería → nombre del piso.
// Diagonal 80 tiene dos: E1–E26 en el subsuelo y E27 en adelante en el 2° piso.
const DEPOSITOS_SUC = {
  'diagonal': [
    {nombre:'Subsuelo', desde:1,  hasta:26},
    {nombre:'2° piso',  desde:27, hasta:Infinity}
  ]
};
function numEstanteria(est){
  const n = parseInt(String((est&&est.nombre)||'').replace(/\D+/g,''),10);
  return isNaN(n) ? null : n;
}
// "Subsuelo" / "2° piso" para una estantería, o null si la sucursal tiene un solo depósito
function depositoDe(est){
  const zonas = DEPOSITOS_SUC[SUC]; if(!zonas) return null;
  const n = numEstanteria(est); if(n===null) return null;
  const z = zonas.find(z=> n>=z.desde && n<=z.hasta);
  return z ? z.nombre : null;
}
// Nota de orden para los recorridos: " — primero Subsuelo, después 2° piso"
function depositosOrdenTxt(){
  const zonas = DEPOSITOS_SUC[SUC]; if(!zonas) return '';
  return ' — primero '+zonas.map(z=>z.nombre).join(', después ');
}

// Cuentas de supervisión: ven TODAS las sucursales en modo consulta.
// La cuenta con rol admin del Portal (Juli) además edita todo.
const SUPERVISION_EMAILS = [
  'cristian.campion@mateu.com.ar',

  'julian@mateu.com.ar',
  'producto@mateu.com.ar',
];

// Roles de perfil. Solo "encargado" gestiona (carga de stock, estanterías,
// perfiles); el resto opera igual que vendedor (buscar y asignar ubicaciones).
const PERFIL_ROLES = [
  {id:'encargado', label:'Encargado'},
  {id:'vendedor',  label:'Vendedor'},
  {id:'deposito',  label:'Depósito'},
  {id:'cajera',    label:'Cajera'},
];
const ROL_LABEL_PERFIL = {}; PERFIL_ROLES.forEach(r=>ROL_LABEL_PERFIL[r.id]=r.label);
function rolLabel(rol){ return ROL_LABEL_PERFIL[rol] || rol; }

/* Importar dotación desde Indicadores de Sucursal: reusa la misma data
   (data/indicadores) para sembrar los perfiles con nombre + rol, sin duplicar
   el dato. slug del Buscador -> nombre de sucursal en Indicadores. */
const SLUG_SUC_IND = {
  'calle-12':'12-MS Calle 12','city-bell':'06-MS City Bell','calle-47':'08-MS Calle 47',
  'calle-49':'19-MS Calle 49','los-hornos':'13-MS Los Hornos','plaza':'01-MS Plaza Italia',
  'berisso':'16-MS Berisso','ensenada':'11-MS Ensenada','kids':'02-Mateu Kids',
  'aurelius-12':'04-Aurelius Calle 12','aurelius-5':'18-Aurelius Calle 5','aurelius-cb':'17-Aurelius City Bell',
  'adidas-12':'21-Adidas Calle 12','adidas':'09-Adidas Av. 7','originals':'15-Adidas Originals',
};
const GRUPO_ROL_IND = { Jefatura:'encargado', Ventas:'vendedor', Caja:'cajera', Refuerzos:'deposito' };
const ROL_ORDEN_IND = { encargado:1, vendedor:2, cajera:3, deposito:4 };
function archivoInd(nombre){ return nombre.replace(/\./g,'').replace(/\s+/g,'-'); }
function titleNombre(s){ return (s||'').toLowerCase().replace(/(^|[\s'’-])([a-záéíóúñü])/g,(m,p,c)=>p+c.toUpperCase()); }
function idFromNombre(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }

// Trae la dotación operativa del último período y REEMPLAZA los perfiles de la sucursal.
async function importarDotacion(){
  const dataName = SLUG_SUC_IND[SUC];
  if(!dataName){ alert('Esta sucursal todavía no tiene datos de dotación en Indicadores.'); return; }
  if(!confirm('Va a REEMPLAZAR los perfiles de esta sucursal con la dotación de Indicadores (nombre + rol del último período).\n\nSe pierden los avatares y ajustes hechos a mano. ¿Seguir?')) return;
  try{
    const periodos = (await fetchJSON('../data/indicadores/periodos.json') || {}).periodos || [];
    if(!periodos.length){ alert('No hay períodos cargados en Indicadores.'); return; }
    const per = periodos[0].id; // más nuevo primero
    const d = await fetchJSON('../data/indicadores/'+per+'/'+archivoInd(dataName)+'.json');
    const perfiles = {};
    (d.vendedores||[]).forEach(v=>{
      if(v.cubre) return;                       // cada persona en su sucursal fija
      const rol = GRUPO_ROL_IND[v.grupo]; if(!rol) return;   // solo roles operativos
      perfiles[idFromNombre(v.vendedor)] = { nombre:titleNombre(v.vendedor), rol, orden:ROL_ORDEN_IND[rol], avatar:null };
    });
    const n = Object.keys(perfiles).length;
    if(!n){ alert('No se encontró dotación operativa para esta sucursal en '+per+'.'); return; }
    await putJSON(sucPath()+'/perfiles.json', perfiles);
    await cargarPerfiles();
    renderPanelPerfiles();
    alert('Listo: '+n+' perfiles importados desde Indicadores ('+per+').');
  }catch(e){ alert('No se pudo importar la dotación: '+(e&&e.message||e)); }
}

const $ = id => document.getElementById(id);
const esc = s => (s===null||s===undefined)?'':String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function saveLS(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function readLS(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } }
function delLS(k){ try{ localStorage.removeItem(k); }catch(e){} }

async function fetchJSON(url){
  const r = await fetch(url);
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
const putJSON   = (url,d)=>fetch(url,{method:'PUT',  body:JSON.stringify(d),headers:{'Content-Type':'application/json'}});
const patchJSON = (url,d)=>fetch(url,{method:'PATCH',body:JSON.stringify(d),headers:{'Content-Type':'application/json'}});
const postJSON  = (url,d)=>fetch(url,{method:'POST', body:JSON.stringify(d),headers:{'Content-Type':'application/json'}}).then(r=>r.json());
const delJSON   = (url)=>fetch(url,{method:'DELETE'});

// Los códigos de artículo son clave de Firebase: no admiten . # $ / [ ]
function fbKey(codigo){ return String(codigo).trim().replace(/[.#$\/\[\]]/g,'-'); }
function newId(pfx){ return pfx + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function fmtFecha(ts){
  if(!ts) return '—';
  const d = new Date(ts);
  const dd = String(d.getDate()).padStart(2,'0'), mm = String(d.getMonth()+1).padStart(2,'0');
  return dd+'/'+mm+'/'+d.getFullYear()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function fmtHora(ts){
  const d = new Date(ts);
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
// Clave del día local (YYYY-MM-DD) para el historial de consultas
function hoyKey(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

// Horas transcurridas descontando sábados y domingos completos.
function horasHabilesDesde(ts){
  if(!ts) return Infinity;
  let total = 0;
  const cur = new Date(ts);
  const now = Date.now();
  while(cur.getTime() < now){
    const finDia = new Date(cur); finDia.setHours(24,0,0,0);
    const tramo = Math.min(finDia.getTime(), now) - cur.getTime();
    const dow = cur.getDay();
    if(dow!==0 && dow!==6) total += tramo;
    cur.setTime(finDia.getTime());
  }
  return total / 3600000;
}
function estadoCarga(ts){
  const h = horasHabilesDesde(ts);
  if(h < 24) return 'verde';
  if(h < 48) return 'amarillo';
  return 'rojo';
}

let toastTimer = null;
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.style.pointerEvents='none'; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}
// Toast con botón de acción (ej: "Deshacer")
function toastAccion(msg, btnLabel, fn){
  const t = $('toast');
  t.innerHTML = esc(msg)+'<button class="toast-btn" id="toastAct">'+esc(btnLabel)+'</button>';
  t.style.pointerEvents='auto'; t.classList.add('show');
  clearTimeout(toastTimer);
  $('toastAct').addEventListener('click', ()=>{ t.classList.remove('show'); t.style.pointerEvents='none'; fn(); });
  toastTimer = setTimeout(()=>{ t.classList.remove('show'); t.style.pointerEvents='none'; }, 6000);
}
function showErr(msg){ const b=$('errBanner'); b.textContent=msg; b.classList.add('show'); }
function hideErr(){ $('errBanner').classList.remove('show'); }

/* Avatares: predeterminados (emoji sobre la paleta) o iniciales sobre navy/rojo.
   En el perfil se guarda el id del avatar (ej: "futbol"), no una imagen. */
const AV_COLORS = ['#1e3252','#CC0000','#152238','#8b0000','#0B1527'];
const AVATARES = [
  {id:'futbol',   emoji:'⚽'}, {id:'basquet',  emoji:'🏀'}, {id:'tenis',  emoji:'🎾'},
  {id:'voley',    emoji:'🏐'}, {id:'boxeo',    emoji:'🥊'}, {id:'pesas',  emoji:'🏋️'},
  {id:'runner',   emoji:'🏃'}, {id:'bici',     emoji:'🚴'}, {id:'zapa',   emoji:'👟'},
  {id:'gorra',    emoji:'🧢'}, {id:'camiseta', emoji:'🎽'}, {id:'copa',   emoji:'🏆'},
  {id:'rayo',     emoji:'⚡'}, {id:'fuego',    emoji:'🔥'}, {id:'leon',   emoji:'🦁'},
  {id:'aguila',   emoji:'🦅'},
];
const AVATAR_BY_ID = {}; AVATARES.forEach((a,i)=>{ a.bg = AV_COLORS[i % AV_COLORS.length]; AVATAR_BY_ID[a.id]=a; });

function avatarHtml(perfil, extraClass){
  const cls = 'av'+(extraClass?' '+extraClass:'');
  const av = perfil && perfil.avatar;
  if(av && String(av).startsWith('data:')) return '<div class="'+cls+'"><img src="'+av+'" alt=""></div>'; // legado (fotos viejas)
  if(av && AVATAR_BY_ID[av]){
    const a = AVATAR_BY_ID[av];
    return '<div class="'+cls+' av-emoji" style="background:'+a.bg+'">'+a.emoji+'</div>';
  }
  const nombre = (perfil&&perfil.nombre)||'?';
  const ini = nombre.trim().split(/\s+/).map(p=>p[0]).slice(0,2).join('').toUpperCase();
  let h=0; for(const c of nombre) h=(h*31+c.charCodeAt(0))>>>0;
  return '<div class="'+cls+'" style="background:'+AV_COLORS[h%AV_COLORS.length]+'">'+esc(ini)+'</div>';
}

function tieneAcceso(s){
  if(!s || !s.email) return false;
  if((s.herramientas||[]).includes(TOOL_ID)) return true;
  if(s.rol==='admin') return true;
  return SUPERVISION_EMAILS.includes((s.email||'').toLowerCase());
}

// MODO de la cuenta:
//  'sucursal' → cuenta de una sucursal o de su depósito (opera con perfiles)
//  'puesto'   → puesto de consulta del salón: SOLO buscar (sin perfiles ni edición)
//  'admin'    → Juli: todas las sucursales, edición total
//  'super'    → supervisión: todas las sucursales, solo consulta
let MODE = null;
if(SESSION){
  const email = (SESSION.email||'').toLowerCase();
  if(SESSION.rol==='admin') MODE='admin';
  else if((SESSION.rol==='sucursal' || SESSION.rol==='deposito') && SESSION.sucursal) MODE='sucursal';
  else if(SESSION.rol==='puesto' && SESSION.sucursal) MODE='puesto';
  else if(SUPERVISION_EMAILS.includes(email)) MODE='super';
}
// Cuenta operativa del depósito: asigna ubicaciones y carga el stock del día,
// pero NO administra perfiles (eso queda para el encargado y el admin).
const ES_DEPOSITO = !!(SESSION && SESSION.rol==='deposito');

/* ============================================================
   ESTADO
   ============================================================ */
let SUC = null;            // slug de la sucursal activa
let PERFIL = null;         // perfil activo {id, nombre, rol, avatar} (solo MODE sucursal)
let PERFILES = {};         // perfiles de la sucursal activa
let DATA = { articulos:{}, estanterias:{}, meta:{}, consultas:{}, feedback:{} };
let lastHash = '';
let lastSyncTs = 0;
let pollTimer = null;
let tabActiva = 'buscar';
let searchQuery = '';
let suAbierto = false;     // sección SIN UBICAR expandida
let suSoloNuevos = false;  // filtro "⚡ Nuevos" de la sección SIN UBICAR
let moduloVista = null;    // {estId, modId} para el filtro inverso
let AUDIT = null;          // auditoría en curso {estId, marcas} (se declara acá
                           // porque setTab la resetea ya durante el arranque)
let FB_PERFIL = null;      // modo puesto: quién firma el comentario (se elige en la
                           // hoja de feedback y se olvida al cerrarla — puesto compartido)

// Quién puede qué (se recalcula al elegir perfil / sucursal)
function canAssign(){ return MODE==='admin' || (MODE==='sucursal' && !!PERFIL); }
// Cargar stock del día + editar estanterías: admin, perfil encargado o cuenta de depósito.
function canStock(){ return MODE==='admin' || (MODE==='sucursal' && (ES_DEPOSITO || (PERFIL && PERFIL.rol==='encargado'))); }
// Administrar perfiles: SOLO admin o perfil encargado con cuenta de sucursal.
function canManage(){ return MODE==='admin' || (MODE==='sucursal' && !ES_DEPOSITO && PERFIL && PERFIL.rol==='encargado'); }
function nombreOperador(){
  if(MODE==='sucursal' && PERFIL) return PERFIL.nombre;
  if(MODE==='puesto') return 'Puesto de consulta';
  return (SESSION && SESSION.email) || '—';
}

const sucPath = ()=> FB + '/sucursales/' + SUC;

/* ============================================================
   BOOT
   ============================================================ */
(function init(){
  if(!tieneAcceso(SESSION) || !MODE){ location.href='../'; return; }
  $('pssLogo').src = LOGO;   // el logo del header lo pone shared/header.js
  $('btnSalir').addEventListener('click', ()=>{ if(MODE==='puesto') salirPuesto(); else location.href='../'; });
  $('btnMostrador').addEventListener('click', entrarModoMostrador);
  $('btnPerfiles').addEventListener('click', ()=> setTab('perfiles'));
  $('btnCargarStock').addEventListener('click', ()=> $('fileStock').click());
  $('pssSalir').addEventListener('click', ()=>{ location.href='../'; });
  wireStatic();

  if(MODE==='sucursal'){
    SUC = SESSION.sucursal;
    entrarSucursal();
  } else if(MODE==='puesto'){
    // Modo mostrador del salón: directo a Buscar, sin selector de perfiles.
    // Los perfiles se cargan igual: firman los comentarios de los artículos.
    SUC = SESSION.sucursal;
    cargarPerfiles().then(montarApp);
  } else {
    montarGlobal();
  }
})();

async function entrarSucursal(){
  // asegurar config/nombre (primera vez que la sucursal entra)
  const info = SUCURSAL_BY_SLUG[SUC];
  try{
    const cfg = await fetchJSON(sucPath()+'/config.json');
    if(!cfg || !cfg.nombre) await putJSON(sucPath()+'/config.json', {nombre: info?info.nombre:SUC});
  }catch(e){ /* sin conexión: se reporta abajo */ }

  await cargarPerfiles();
  const recordado = readLS('ubic_perfil_'+SUC);
  if(recordado && PERFILES[recordado]) {
    seleccionarPerfil(recordado, true);
  } else {
    mostrarSelectorPerfiles();
  }
}

/* ============================================================
   PERFILES — selector estilo Netflix
   ============================================================ */
async function cargarPerfiles(){
  try{
    PERFILES = await fetchJSON(sucPath()+'/perfiles.json') || {};
    await sincronizarPerfilesPadron();
    hideErr();
  }catch(e){
    PERFILES = {};
    showErr('No se pudo conectar a la base de Ubicaciones. Verificá la conexión (o que la base "ubicaciones-mateu" exista).');
  }
}

/* Los perfiles salen del PADRÓN de la sucursal (shared/equipo.js → rrhh/equipo/<slug>,
   el mismo que arma el encargado en Mi Sucursal → Mi equipo y valida RRHH). Cada
   persona activa con rol operativo tiene su perfil con id = legajoId; avatares y
   orden se conservan (por id, o por nombre para migrar los perfiles viejos). Los
   perfiles marcados `manual` (creados a mano acá) se respetan. Sin padrón para la
   sucursal, no se toca nada. */
const _padronSyncDone = {};
async function sincronizarPerfilesPadron(){
  if(!SUC || !window.Equipo || _padronSyncDone[SUC]) return;
  let gente; try{ gente = Equipo.activos(await Equipo.cargar(SUC)); }catch(e){ return; }
  gente = gente.filter(p=>ROL_ORDEN_IND[p.rol]);
  if(!gente.length) return;
  _padronSyncDone[SUC]=true;
  const viejos = Object.keys(PERFILES).map(id=>({id, ...PERFILES[id]}));
  const porNombre = new Map(); viejos.forEach(v=>{ const k=Equipo.norm(v.nombre); if(k && !porNombre.has(k)) porNombre.set(k, v); });
  const nuevos = {};
  gente.forEach((p,i)=>{
    const prev = PERFILES[p.id] || (()=>{ let v=null; Equipo.clavesDe(p).forEach(c=>{ if(!v && porNombre.has(c)) v=porNombre.get(c); }); return v; })();
    nuevos[p.id] = { nombre:p.nombre, rol:p.rol, orden:(ROL_ORDEN_IND[p.rol]||9)*100+i, avatar:(prev&&prev.avatar)||null, legajo:true };
  });
  viejos.filter(v=>v.manual && !nuevos[v.id]).forEach(v=>{ nuevos[v.id]={...v}; delete nuevos[v.id].id; });
  const limpio = o => JSON.stringify(Object.keys(o).sort().map(k=>[k,o[k]]));
  if(limpio(nuevos)===limpio(PERFILES)) return;
  try{
    await putJSON(sucPath()+'/perfiles.json', nuevos);
    PERFILES = nuevos;
    // el perfil activo pudo cambiar de id (perfil viejo por nombre → legajoId)
    if(PERFIL && !PERFILES[PERFIL.id]){
      const k=Equipo.norm(PERFIL.nombre); const nid=Object.keys(PERFILES).find(id=>Equipo.norm(PERFILES[id].nombre)===k || gente.some(g=>g.id===id && Equipo.clavesDe(g).has(k)));
      if(nid){ PERFIL={id:nid, ...PERFILES[nid]}; saveLS('ubic_perfil_'+SUC, nid); } else PERFIL=null;
    }
  }catch(e){ console.warn('perfiles desde el padrón', e); }
}
function perfilesOrdenados(){
  return Object.keys(PERFILES).map(id=>({id, ...PERFILES[id]}))
    .sort((a,b)=>(a.orden||99)-(b.orden||99) || (a.nombre||'').localeCompare(b.nombre||''));
}

function mostrarSelectorPerfiles(){
  const info = SUCURSAL_BY_SLUG[SUC];
  $('pssSucursal').textContent = info ? info.nombre : SUC;
  const lista = perfilesOrdenados();
  const grid = $('pssGrid');
  if(!lista.length){
    grid.innerHTML = '<div style="color:rgba(255,255,255,.7);max-width:340px;font-size:14px">'+
      'Todavía no hay perfiles en esta sucursal.<br><br>'+
      'Creá el primer perfil (va a ser <b>encargado</b>) para empezar.'+
      '<div style="margin-top:16px"><button class="btn btn-primary" id="pssCrearPrimero">Crear primer perfil</button></div></div>';
    $('pssCrearPrimero').addEventListener('click', ()=> abrirFormPerfil(null, true));
  } else {
    grid.innerHTML = lista.map(p=>
      '<button class="pss-item" data-perfil="'+p.id+'">'+avatarHtml(p)+
      '<div class="nm">'+esc(p.nombre)+'</div><div class="rl">'+esc(rolLabel(p.rol))+'</div></button>'
    ).join('');
    grid.querySelectorAll('[data-perfil]').forEach(b=> b.addEventListener('click', ()=> seleccionarPerfil(b.dataset.perfil, false)));
    pssIdx = 0; pssMarcar();
  }
  $('app').style.display='none';
  $('profileScreen').style.display='flex';
}

/* Navegación por teclado del selector (puestos con lectora, sin mouse):
   flechas para moverse entre perfiles y Enter para confirmar. */
let pssIdx = 0;
function pssMarcar(){
  const items = Array.from(document.querySelectorAll('.pss-item'));
  items.forEach((b,i)=> b.classList.toggle('kb-sel', i===pssIdx));
  if(items[pssIdx]) items[pssIdx].focus();
}
document.addEventListener('keydown', e=>{
  if($('profileScreen').style.display!=='flex') return;
  const items = document.querySelectorAll('.pss-item');
  if(!items.length) return;
  if(e.key==='ArrowRight' || e.key==='ArrowDown'){ e.preventDefault(); pssIdx=(pssIdx+1)%items.length; pssMarcar(); }
  else if(e.key==='ArrowLeft' || e.key==='ArrowUp'){ e.preventDefault(); pssIdx=(pssIdx-1+items.length)%items.length; pssMarcar(); }
  else if(e.key==='Enter'){ e.preventDefault(); if(items[pssIdx]) items[pssIdx].click(); }
});

function seleccionarPerfil(id, silencioso){
  PERFIL = {id, ...PERFILES[id]};
  saveLS('ubic_perfil_'+SUC, id);
  $('profileScreen').style.display='none';
  if(!silencioso) toast('Hola, '+PERFIL.nombre+' 👋');
  montarApp();
}

function cambiarPerfil(){
  PERFIL = null;
  delLS('ubic_perfil_'+SUC);
  clearTimeout(inactTimer);
  detenerPolling();
  cargarPerfiles().then(mostrarSelectorPerfiles);
}

/* Salir del modo puesto (quiosco): pide el PIN de la cuenta antes de cerrar
   la sesión, para que un cliente del salón no pueda desloguear el puesto.
   Valida contra los usuarios del Portal (discontinuos-mateu). */
const PORTAL_USUARIOS_URL = 'https://discontinuos-mateu-default-rtdb.firebaseio.com/usuarios.json';
async function salirPuesto(){
  const pin = prompt('Para cerrar la sesión del puesto, ingresá el PIN de la cuenta:');
  if(pin===null || !String(pin).trim()) return;
  try{
    const us = await fetchJSON(PORTAL_USUARIOS_URL);
    const mail = (SESSION.email||'').toLowerCase();
    const yo = Object.values(us||{}).find(u=>u && u.email && u.email.toLowerCase()===mail);
    if(!yo || String(yo.pin)!==String(pin).trim()){ toast('PIN incorrecto.'); return; }
    delLS(SESSION_KEY);
    location.href='../';
  }catch(e){ toast('No se pudo verificar el PIN. Revisá la conexión.'); }
}

/* Arma la pantalla quiosco del puesto: mueve historial + lista de retiro al
   lado del calendario del shell (arriba a la derecha) y agrega el pie fijo
   con la sucursal, la frase de marca y el Salir. Se ejecuta una sola vez. */
function montarQuiosco(){
  if($('puestoFoot')) return;
  const foot = document.createElement('div');
  foot.className = 'puesto-foot'; foot.id = 'puestoFoot';
  const info = SUCURSAL_BY_SLUG[SUC];
  foot.innerHTML = '<span class="pf-suc">'+esc(info?info.nombre:SUC)+'</span>'+
    '<span class="pf-frase">DESDE 1905 JUNTO AL DEPORTE</span>'+
    '<span class="pf-salir"></span>';
  document.body.appendChild(foot);
  foot.querySelector('.pf-salir').appendChild($('btnSalir'));
  // los botones van junto al calendario; header.js monta con defer, por eso el reintento
  const mover = ()=>{
    const cal = document.querySelector('.msh-cal');
    if(!cal) return false;
    cal.prepend($('btnPicking'));
    cal.prepend($('btnRepone'));
    cal.prepend($('btnHistorial'));
    return true;
  };
  if(!mover()){
    const t = setInterval(()=>{ if(mover()) clearInterval(t); }, 150);
    setTimeout(()=> clearInterval(t), 6000);
  }
}

/* Puente con el escáner del sistema (modo puesto): un programita en la PC
   (scripts/puente-escaner/) detecta la ráfaga de la lectora cuando el vendedor
   escanea PARADO EN EL SISTEMA y publica el código en scanBridge/<slug>.
   Acá lo escuchamos por SSE y disparamos la búsqueda solos: una sola
   escaneada sirve para el sistema Y el Buscador. */
let sbUltimoTs = null, sbActivo = false;
function iniciarScanBridge(){
  if(MODE!=='puesto' || !window.EventSource || sbActivo) return;
  sbActivo = true;
  let primera = true;
  try{
    const es = new EventSource(FB + '/scanBridge/' + encodeURIComponent(SUC) + '.json');
    es.addEventListener('put', e=>{
      try{
        const d = JSON.parse(e.data);
        const rec = d && d.data;
        const codigo = rec && rec.codigo, ts = rec && rec.ts;
        // el primer put es el estado guardado (un escaneo viejo): se ignora
        if(primera){ primera = false; sbUltimoTs = ts || null; return; }
        if(!codigo || (ts && ts===sbUltimoTs)) return;
        sbUltimoTs = ts || null;
        $('searchInput').value = codigo;
        searchQuery = codigo;
        $('searchClear').style.display = 'block';
        renderResultados();
        toast('📡 Escaneado en el sistema: '+codigo);
      }catch(err){}
    });
    // si se corta la conexión, EventSource reintenta solo
  }catch(e){}
}

/* Modo mostrador manual: cierra lo que esté abierto y vuelve al selector
   de perfiles estilo Netflix (mismo estado que el protector de pantalla por
   inactividad). Deja el puesto listo para que el próximo elija su cara. */

  cambiarPerfil();
}

/* Puestos compartidos (salón/depósito): tras 3 minutos sin actividad
   se vuelve solo al selector de perfiles, así el próximo vendedor
   elige su cara antes de consultar. La sesión de la sucursal no se toca. */
let INACTIVIDAD_MS = 3*60*1000;
let inactTimer = null;
function resetInactividad(){
  if(MODE!=='sucursal' || !PERFIL) return;
  clearTimeout(inactTimer);
  inactTimer = setTimeout(()=>{
    if(MODE!=='sucursal' || !PERFIL) return;
    cerrarSheet(); cerrarModal(); cerrarHistorial(); cerrarRepone();
    cambiarPerfil();
  }, INACTIVIDAD_MS);
}
['pointerdown','keydown','touchstart'].forEach(ev=>
  document.addEventListener(ev, resetInactividad, {passive:true}));

/* ============================================================
   MONTAJE DE LA APP (vista sucursal)
   ============================================================ */
function montarApp(){
  const info = SUCURSAL_BY_SLUG[SUC];
  $('hdrSucursal').textContent = info ? info.nombre : SUC;
  if(MODE==='sucursal' && PERFIL){
    $('perfilChip').style.display='flex';
    $('perfilChipAv').outerHTML = avatarHtml(PERFIL).replace('<div class="av','<div id="perfilChipAv" class="av');
    $('perfilChipNm').textContent = PERFIL.nombre;
    $('btnMostrador').style.display='inline-flex';
  } else {
    $('perfilChip').style.display='none';
    $('btnMostrador').style.display='none';
  }
  // «Perfiles» vive en la barra superior (entre el perfil activo y Mostrador), solo para quien administra
  $('btnPerfiles').style.display = canManage() ? 'inline-flex' : 'none';
  // El puesto de consulta es un quiosco: Salir existe pero pide el PIN de la
  // cuenta (así el staff puede cerrar la sesión y un cliente no).
  $('btnSalir').style.display = '';
  // Modo vidriera: la pantalla del salón esconde lo operativo (ver CSS body.puesto)
  document.body.classList.toggle('puesto', MODE==='puesto');
  if(MODE==='puesto'){ montarQuiosco(); iniciarScanBridge(); }
  $('app').style.display='block';
  if(SUC && MODE!=='puesto') cargarF8s();
  const ids = renderTabs();
  // si la vista activa ya no corresponde (p.ej. Perfiles al pasar de encargado a vendedor), a Buscar
  setTab(ids.includes(tabActiva) || (tabActiva==='perfiles' && canManage()) ? tabActiva : 'buscar');
  iniciarPolling();
  resetInactividad();
}

function renderTabs(){
  const tabs = [];
  if(MODE==='admin' || MODE==='super') tabs.push({id:'resumen', label:'Resumen'});
  if(SUC){
    tabs.push({id:'buscar', label:'Buscar', badge:true});
    // El puesto de consulta del salón solo busca: sin estanterías ni actividad.
    if(MODE!=='puesto'){
      tabs.push({id:'f8s', label:'F8s', badgeF8:true});
      tabs.push({id:'estanterias', label:'Estanterías'});
      tabs.push({id:'actividad', label:'Actividad'});
    }
  }
  $('tabs').innerHTML = tabs.map(t=>
    '<button class="tab" data-tab="'+t.id+'">'+t.label+
    (t.badge?'<span class="badge" id="tabBadgeSU" style="display:none">0</span>':'')+
    (t.badgeF8?'<span class="badge" id="tabBadgeF8" style="display:none">0</span>':'')+'</button>'
  ).join('');
  $('tabs').querySelectorAll('.tab').forEach(b=> b.addEventListener('click', ()=> setTab(b.dataset.tab)));
  return tabs.map(t=>t.id);
}

function setTab(id){
  tabActiva = id;
  moduloVista = null;
  AUDIT = null; // salir de una auditoría en curso (las marcas quedan guardadas en el dispositivo)
  document.querySelectorAll('.tab').forEach(b=> b.classList.toggle('active', b.dataset.tab===id));
  $('btnPerfiles').classList.toggle('on', id==='perfiles');
  document.querySelectorAll('.view').forEach(v=> v.classList.remove('active'));
  const el = $('view-'+id); if(el) el.classList.add('active');
  if(id==='buscar') renderBuscar();
  if(id==='f8s') renderF8s();
  if(id==='estanterias') renderEstanterias();
  if(id==='actividad') renderActividad();
  if(id==='perfiles') renderPanelPerfiles();
  if(id==='resumen') renderResumenGlobal();
}

/* ============================================================
   POLLING (articulos + estanterias + meta; NUNCA perfiles)
   ============================================================ */
/* Polling en dos niveles para no fundir la cuota de descarga de Firebase:
   cada 5 s se piden solo `meta` (que trae `rev`, la versión de los datos) y
   las consultas del día — un par de KB. El catálogo completo (articulos,
   estanterias, feedback) se baja únicamente cuando `rev` cambió, o cada 10 min
   como red de seguridad (por si escribe un cliente viejo que no marca rev,
   o se edita a mano en la consola de Firebase). */
let lastRev = null, lastFullTs = 0;
async function refrescarDatos(){
  if(!SUC) return false;
  const [meta, consultas, reposicion] = await Promise.all([
    fetchJSON(sucPath()+'/meta.json').catch(()=>undefined),
    fetchJSON(sucPath()+'/consultas/'+hoyKey()+'.json').catch(()=>undefined),
    fetchJSON(sucPath()+'/reposicion.json').catch(()=>undefined),
  ]);
  if(meta===undefined && consultas===undefined){
    // puede ser base vacía o sin conexión: probamos un fetch que distinga
    try{ await fetchJSON(sucPath()+'/config.json'); hideErr(); }
    catch(e){ showErr('Sin conexión con la base de Ubicaciones. Reintentando…'); return false; }
  } else hideErr();
  const rev = meta ? (meta.rev||null) : null;
  if(!DATA.__full || rev !== lastRev || (Date.now()-lastFullTs) > 600000){
    const [articulos, estanterias, feedback] = await Promise.all([
      fetchJSON(sucPath()+'/articulos.json').catch(()=>null),
      fetchJSON(sucPath()+'/estanterias.json').catch(()=>null),
      fetchJSON(sucPath()+'/feedback.json').catch(()=>null),
    ]);
    DATA = { articulos:articulos||{}, estanterias:estanterias||{}, meta:meta||{}, consultas:consultas||{}, feedback:feedback||{}, reposicion:reposicion||{}, __full:true };
    lastRev = rev; lastFullTs = Date.now();
  } else {
    DATA.meta = meta||{};
    DATA.consultas = consultas||{};
    DATA.reposicion = reposicion||{};
  }
  lastSyncTs = Date.now();
  const hash = JSON.stringify(DATA);
  if(hash!==lastHash){ lastHash=hash; return true; }
  return false;
}

function hayUiBloqueante(){
  return $('sheetOverlay').classList.contains('show') || $('modalOverlay').classList.contains('show');
}

async function pollLoop(){
  try{
    const cambio = await refrescarDatos();
    if(cambio && !hayUiBloqueante()) renderVistaActiva();
    if(cambio && $('histOverlay').classList.contains('show')) renderHistorial();
    if(cambio && $('repOverlay').classList.contains('show')) renderRepone();
    if(cambio) reponeBadge();
    renderStatusbar();
  }catch(e){}
  pollTimer = setTimeout(pollLoop, POLL_MS);
}

function iniciarPolling(){
  detenerPolling();
  refrescarDatos().then(()=>{ renderVistaActiva(); renderStatusbar(); reponeBadge(); podarConsultas(); });
  pollTimer = setTimeout(pollLoop, POLL_MS);
  if(!window.__syncTicker) window.__syncTicker = setInterval(renderSyncLabel, 1000);
}
function detenerPolling(){ if(pollTimer){ clearTimeout(pollTimer); pollTimer=null; } }

// Con la pestaña en segundo plano no se pollea (ahorra cuota de Firebase
// en los puestos que quedan abiertos todo el día); al volver, se refresca.

function articulosLista(){
  return Object.keys(DATA.articulos||{}).map(k=>({key:k, ...DATA.articulos[k]}));
}
function sinUbicarLista(){
  return articulosLista()
    .filter(a=>!a.ubicaciones || !Object.keys(a.ubicaciones).length)
    .sort((a,b)=>(b.fechaAlta||0)-(a.fechaAlta||0));  // más nuevos primero
}

/* ---- Artículos NUEVOS sin ubicar (prioridad para el depósito) ----
   "Nuevo" = entró en una carga POSTERIOR a la carga inicial de la sucursal
   (así el día 1, con todo el stock recién importado, no se marca todo) y
   hace como máximo NUEVO_DIAS. Deja de ser "nuevo" al ubicarlo. */
const NUEVO_DIAS = 7;
function primeraCargaTs(){
  let min = Infinity;
  for(const k in (DATA.articulos||{})){ const f = DATA.articulos[k].fechaAlta; if(f && f<min) min=f; }
  return min===Infinity ? 0 : min;
}
function esNuevo(a, primera){
  if(a.ubicaciones && Object.keys(a.ubicaciones).length) return false;
  const f = a.fechaAlta||0; if(!f) return false;
  if(primera===undefined) primera = primeraCargaTs();
  // cada carga graba un único timestamp: "posterior a la primera" = entró en otra carga
  return f > primera && (Date.now()-f) <= NUEVO_DIAS*86400000;
}
function nuevosLista(){ const p = primeraCargaTs(); return sinUbicarLista().filter(a=>esNuevo(a,p)); }
function edadAlta(ts){
  const d = Math.floor((Date.now()-(ts||0))/86400000);
  return d<=0 ? 'ingresó hoy' : d===1 ? 'ingresó ayer' : 'ingresó hace '+d+' días';
}
function nombreUbicacion(u){
  const est = (DATA.estanterias||{})[u.estanteriaId];
  const mod = est && est.modulos && est.modulos[u.moduloId];
  if(!est) return '(estantería eliminada)';
  const dep = depositoDe(est);
  return est.nombre + (mod ? ' · '+mod.nombre : '') + (dep ? ' · '+dep : '');
}
// Cuenta artículos por estantería y por módulo en una sola pasada
// (cada artículo cuenta una vez por estantería/módulo, aunque tenga varias asignaciones).
function contarUbicados(){
  const porEst = {}, porMod = {};
  for(const a of articulosLista()){
    const vistos = {};
    for(const uid in (a.ubicaciones||{})){
      const u = a.ubicaciones[uid];
      if(!vistos[u.estanteriaId]){ vistos[u.estanteriaId]=1; porEst[u.estanteriaId]=(porEst[u.estanteriaId]||0)+1; }
      if(u.moduloId){
        const mk = u.estanteriaId+':'+u.moduloId;
        if(!vistos[mk]){ vistos[mk]=1; porMod[mk]=(porMod[mk]||0)+1; }
      }
    }
  }
  return {porEst, porMod};
}

// Índices del stock local para cruzar el F8 (Id.item primero, código de marca de respaldo)
function f8Indices(){
  const byId={}, byCod={}; const arts=DATA.articulos||{};
  for(const k in arts){ const a=arts[k];
    if(a.articulo) byId[String(a.articulo).trim()] = {key:k, ...a};
    if(a.codigo) byCod[String(a.codigo).replace(/\s+/g,'').toUpperCase()] = {key:k, ...a};
  }
  return {byId, byCod};
}
// Orden del recorrido: número de estantería y de módulo de la primera ubicación
function f8Orden(art){
  if(!art) return {ne:9999, nm:9999, nom:'SIN UBICAR'};
  const us = Object.values(art.ubicaciones||{});
  let best = null;
  for(const u of us){
    const est=(DATA.estanterias||{})[u.estanteriaId]; if(!est) continue;
    const mod=est.modulos && est.modulos[u.moduloId];
    const ne=parseInt(String(est.nombre||'').replace(/\D+/g,''),10); const neN=isNaN(ne)?9998:ne;
    const nmP=mod?parseInt(String(mod.nombre||'').replace(/\D+/g,''),10):0; const nmN=isNaN(nmP)?0:nmP;
    const dep=depositoDe(est);
    if(!best || neN<best.ne || (neN===best.ne && nmN<best.nm))
      best={ne:neN, nm:nmN, nom:est.nombre+(mod?' · '+mod.nombre:'')+(dep?' · '+dep:'')};
  }
  if(best){ best.todas = us.map(u=>nombreUbicacion(u)).join(' / '); return best; }
  return {ne:9999, nm:9999, nom:'SIN UBICAR'};
}
function f8Filas(d){
  const {byId, byCod} = f8Indices();
  return (d.lineas||[]).map((L,i)=>{
    const art = (L.a && byId[String(L.a).trim()]) || byCod[String(L.c||'').replace(/\s+/g,'').toUpperCase()] || null;
    return {L, i, art, ord:f8Orden(art)};
  }).sort((x,y)=> x.ord.ne-y.ord.ne || x.ord.nm-y.ord.nm || String(x.L.c).localeCompare(String(y.L.c)));
}

function f8Doc2(id){ return f8Lista().find(x=>x.id===id); }
function f8uMarcar(id,i,ok){ const m=(_f8Draft[id]=_f8Draft[id]||{}); m[i]={ok, motivo:ok?'':(m[i]&&m[i].motivo)||''}; renderF8s(); }
function f8uMotivo(id,i,mot){ const m=(_f8Draft[id]=_f8Draft[id]||{}); m[i]={ok:false, motivo:mot}; f8uProg(id); }
function f8uProg(id){
  const d=f8Doc2(id); if(!d) return;
  const tot=(d.lineas||[]).length, m=_f8Draft[id]||{};
  const resp=Object.values(m).filter(x=>x&&(x.ok===true||(x.ok===false&&x.motivo))).length;
  const el=$('f8uProg-'+id); if(el) el.innerHTML='Respondidos: <b>'+resp+'</b> de '+tot;
  const btn=$('f8uBtn-'+id); if(btn){ btn.disabled=resp<tot; btn.style.opacity=resp<tot?'.5':'1'; }
}
async function f8uConfirmar(id){
  const d=f8Doc2(id); if(!d||MODE!=='sucursal') return;
  const tot=(d.lineas||[]).length, m=_f8Draft[id]||{};
  const resp=Object.values(m).filter(x=>x&&(x.ok===true||(x.ok===false&&x.motivo))).length;
  if(resp<tot){ toast('Faltan responder '+(tot-resp)+' artículo(s) — cada ✗ con su motivo.'); return; }
  const si=Object.values(m).filter(x=>x.ok===true).length;
  if(!confirm('¿Enviar la confirmación del F8 del '+d.fecha+'?\n\n✓ Enviados: '+si+'\n✗ No enviados (con motivo): '+(tot-si)+'\n\nLe llega al Área de Producto y se cruza contra las transferencias reales.')) return;
  const conf={ts:Date.now(), por:(SESSION&&SESSION.email)||'', lineas:m};
  await f8Patch2(id,{conf});
  d.conf=conf; delete _f8Draft[id];
  toast('Confirmación enviada ✓');
  renderF8s();
}
function f8RecorridoFilas(id){
  const d=f8Doc2(id); if(!d) return null;
  return {d, filas:f8Filas(d)};
}
function f8Csv(id){
  const r=f8RecorridoFilas(id); if(!r) return;
  const filas=[['#','Ubicación','Código','Id.item','Descripción','Stock','Destino','Cantidad']]
    .concat(r.filas.map((f,i)=>[i+1, f.ord.nom, f.L.c||'', f.L.a||'', (f.art&&f.art.descripcion)||'', f.art?(f.art.stock??''):'', f.L.d||'', f.L.todo?'Todo':(f.L.t||'')]));
  const csv='﻿'+filas.map(x=>x.map(v=>String(v).replace(/;/g,',')).join(';')).join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='Recorrido F8 '+r.d.fecha+' '+SUC+'.csv'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  if(MODE==='sucursal'&&!r.d.descargado){ r.d.descargado=Date.now(); f8Patch2(id,{descargado:r.d.descargado}); }

  let res = todos.filter(a=>matchArticulo(a,q))
    .sort((a,b)=>(a.codigo||'').localeCompare(b.codigo||''));
  // Lectora de mano: la etiqueta del sistema codifica CÓDIGO + símbolo + TALLE
  // ("MAT375$M"). Si lo escaneado no matchea tal cual, se reintenta con el
  // código base (lo anterior al símbolo) y se muestra el artículo completo.
  let notaScan = '';

      res = todos.filter(a=>matchArticulo(a,base))
        .sort((a,b)=>(a.codigo||'').localeCompare(b.codigo||''));

        const talle = q.slice(base.length+1).trim();
        notaScan = '<div class="hint" style="text-align:center;margin-bottom:8px">Escaneado: <b>'+esc(base.toUpperCase())+'</b>'+

  cont.innerHTML = res.length
    ? notaScan + res.slice(0,100).map(a=>artCardHtml(a)).join('') + (res.length>100?'<div class="hint" style="text-align:center">Mostrando 100 de '+res.length+' resultados.</div>':'')
    : '<div class="empty">Sin resultados para “'+esc(searchQuery)+'”.</div>';
  wireArtCards(cont, {consulta:true});
  // TODA búsqueda queda registrada sola (no hace falta tocar el artículo)
  clearTimeout(autoRegTimer);
  if(q.length>=3){
    const snap = {q:searchQuery.trim(), key:(res.length===1?res[0].key:null), n:res.length};
    autoRegTimer = setTimeout(()=> registrarBusqueda(snap), 1400);
  }
}

/* ============================================================
   HISTORIAL DE CONSULTAS DEL DÍA
   Compartido por sucursal en Firebase (consultas/{YYYY-MM-DD}):
   cualquier puesto (salón o depósito) ve las consultas de todos
   y puede retomar una búsqueda con un toque.
   ============================================================ */
let autoRegTimer = null;
// última entrada escrita por este puesto: sirve para ir REFINANDO la misma
// fila mientras se sigue tipeando ("zap" → "zapa" → "zapatilla") en vez de
// llenar el historial con cada tecla.
let ultimaEntrada = null; // {id, q, ts}

// ¿la búsqueda nueva continúa a la última que guardó este puesto?
function refinaUltima(q){
  const prev = ultimaEntrada;
  if(!prev || !q || !prev.q) return null;
  if((Date.now()-prev.ts) >= 3*60*1000) return null;
  if(!DATA.consultas[prev.id]) return null;
  const a = q.toLowerCase(), b = prev.q.toLowerCase();
  return (a.startsWith(b) || b.startsWith(a)) ? prev : null;
}

// Registro por artículo (clic en la tarjeta, escaneo con la lectora)
function registrarConsulta(artKey, texto){
  const a = DATA.articulos[artKey]; if(!a || !SUC) return;
  guardarConsulta({
    key: artKey, codigo: a.codigo,
    descripcion: (a.descripcion||'').slice(0,60),
    q: (texto||a.codigo||'').slice(0,60),
  });
}

/* Registro automático de la búsqueda tipeada, con o sin resultado:
   - un solo resultado → queda el artículo (como si lo hubieran tocado)
   - varios resultados → queda el texto buscado y cuántos dio
   - sin resultados → también queda (sirve para saber qué pide la gente y no está) */
function registrarBusqueda(b){
  if(!SUC || !b || !b.q) return;
  if(b.key){ registrarConsulta(b.key, b.q); return; }
  guardarConsulta({ key:null, q: b.q.slice(0,60), n: b.n });
}

/* Escribe la entrada en Firebase. Si es el refinamiento de la búsqueda anterior
   (mismo puesto, texto que la continúa, menos de 3 minutos) pisa esa fila; si no,
   no repite la misma consulta del mismo perfil dentro de los 10 minutos. */
function guardarConsulta(base){
  const entrada = Object.assign({
    por: nombreOperador(),
    avatar: (MODE==='sucursal' && PERFIL && PERFIL.avatar) || null,
    ts: Date.now(),
  }, base);
  const prev = refinaUltima(entrada.q);
  if(prev){
    // Firebase no borra claves ausentes en un PATCH: se mandan explícitas en null
    const patch = Object.assign({key:null, codigo:null, descripcion:null, n:null}, entrada);
    patchJSON(sucPath()+'/consultas/'+hoyKey()+'/'+prev.id+'.json', patch).catch(()=>{});
    DATA.consultas[prev.id] = entrada; lastHash='';
    ultimaEntrada = {id:prev.id, q:entrada.q||'', ts:entrada.ts};
    if($('histOverlay').classList.contains('show')) renderHistorial();
    return;
  }
  const repetida = Object.values(DATA.consultas||{}).some(c=>
    c.por===entrada.por && (Date.now()-(c.ts||0)) < 10*60*1000 &&
    (entrada.key ? c.key===entrada.key
                 : (!c.key && (c.q||'').toLowerCase()===(entrada.q||'').toLowerCase())));
  if(repetida) return;
  postJSON(sucPath()+'/consultas/'+hoyKey()+'.json', entrada)
    .then(r=>{ if(r && r.name){
      DATA.consultas[r.name]=entrada; lastHash='';
      ultimaEntrada = {id:r.name, q:entrada.q||'', ts:entrada.ts};
      if($('histOverlay').classList.contains('show')) renderHistorial();
    }})
    .catch(()=>{});
}

function consultasOrdenadas(){
  return Object.keys(DATA.consultas||{}).map(k=>({id:k, ...DATA.consultas[k]}))
    .sort((a,b)=>(b.ts||0)-(a.ts||0));
}

/* ============================================================
   MODO MOSTRADOR — lectora de código de barras USB
   La lectora "tipea" muy rápido y termina con Enter. Se detecta
   globalmente: no hace falta clickear el buscador; alcanza con
   estar dentro del módulo. Al detectar un escaneo se busca el
   código, se resalta la card y se registra la consulta.
   ============================================================ */
let scanBuf = '', scanLast = 0;
const SCAN_GAP_MS = 90;   // separación máxima entre teclas de una lectora
const SCAN_MIN_LEN = 4;   // largo mínimo para tratarlo como escaneo

document.addEventListener('keydown', e=>{
  if(!SUC || $('profileScreen').style.display==='flex') return;
  // si el foco está en un input de un formulario (no el buscador), no interferir
  const ae = document.activeElement;
  if(ae && (ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'||ae.tagName==='SELECT') && ae.id!=='searchInput') return;
  const now = Date.now();
  if(now - scanLast > SCAN_GAP_MS) scanBuf = '';
  scanLast = now;
  // terminadores típicos de lectora: Enter (CR/LF) o Tab, según configuración
  if(e.key === 'Enter' || e.key === 'Tab'){
    if(scanBuf.length >= SCAN_MIN_LEN){
      e.preventDefault(); // solo si es un escaneo real; el Tab manual sigue navegando
      procesarEscaneo(scanBuf);
    }
    scanBuf = '';
  } else if(e.key.length === 1){
    scanBuf += e.key;
  }
});

function procesarEscaneo(codigo){
  // con la Lista de retiro abierta, los escaneos se suman ahí
  if(pickingAbierto()){ pickingAgregar(codigo); return; }
  cerrarSheet(); cerrarModal(); cerrarHistorial(); cerrarRepone();
  if(tabActiva!=='buscar') setTab('buscar');
  searchQuery = codigo;
  $('searchInput').value = codigo;
  $('searchClear').style.display = 'block';
  renderResultados();
  // match exacto por clave, o único por inclusión (por si la etiqueta trae prefijos)
  const key = fbKey(codigo);
  let art = DATA.articulos[key] ? key : null;
  if(!art){
    const matches = articulosLista().filter(a=>matchArticulo(a, codigo.toLowerCase()));
    if(matches.length===1) art = matches[0].key;
  }
  if(art){
    clearTimeout(autoRegTimer); // el escaneo registra ya, sin esperar el debounce
    registrarConsulta(art);
    const card = document.querySelector('#searchResults .art-card[data-art="'+CSS.escape(art)+'"]');
    if(card){
      card.classList.add('flash');
      card.scrollIntoView({block:'center'});
      setTimeout(()=> card.classList.remove('flash'), 1600);
    }
  } else {
    toast('El código escaneado no está en el stock de hoy: '+codigo);
  }
}

/* — Importar F8 —
   Lee los mismos Excel que carga el Área de Producto (equipo/): tanto el
   modelo con columna DESTINO como el de matriz (una columna por sucursal
   destino). Se queda con las líneas cuyo ORIGEN es esta sucursal y arma la
   lista con cantidades y destinos para el recorrido. */
const F8_FOLD = s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'');
const F8_DEST_MAP_RAW = {plaza:'plaza italia','mateu kids':'mateu kids',outlet:'outlet calle 55','outlet calle 55':'outlet calle 55',gonnet:'outlet gonnet','outlet gonnet':'outlet gonnet','avenida 44':'outlet av. 44','av. 44':'outlet av. 44','44':'outlet av. 44','outlet av. 44':'outlet av. 44','55':'outlet calle 55','aurelius 12':'aurelius calle 12','depósito':'depósito',deposito:'depósito','city bell':'city bell','aurelius 10':'aurelius calle 10','calle 47':'calle 47','adidas 7':'adidas av. 7',diagonal:'diagonal 80',ensenada:'ensenada','calle 12':'calle 12','los hornos':'los hornos',originals:'adidas originals',berisso:'berisso','aurelius cb':'aurelius city bell','aurelius 5':'aurelius calle 5','calle 49':'calle 49','adidas 12':'adidas calle 12',ecommerce:'ecommerce',topper:'topper','plaza italia':'plaza italia','12':'calle 12','47':'calle 47','49':'calle 49',adidas:'adidas av. 7',kids:'mateu kids'};
const F8_DEST_MAP = {}; for(const k in F8_DEST_MAP_RAW) F8_DEST_MAP[F8_FOLD(k)] = F8_FOLD(F8_DEST_MAP_RAW[k]);
function f8Nrm(d){
  if(!d) return '';
  d = F8_FOLD(String(d).toLowerCase().trim().replace(/^todo\s+/,'').trim());
  return F8_DEST_MAP[d] || d;
}
// slug del Buscador -> nombre canónico de sucursal en los F8 (ya foldeado)
const F8_SLUG_ORIGEN = {'calle-12':'calle 12','city-bell':'city bell',diagonal:'diagonal 80','calle-47':'calle 47','calle-49':'calle 49','los-hornos':'los hornos',plaza:'plaza italia',berisso:'berisso',ensenada:'ensenada',kids:'mateu kids','aurelius-12':'aurelius calle 12','aurelius-5':'aurelius calle 5','aurelius-cb':'aurelius city bell','adidas-12':'adidas calle 12',adidas:'adidas av. 7',originals:'adidas originals',ecommerce:'ecommerce',deposito:'deposito'};

// Port del parseF8 de equipo/index.html: devuelve líneas {o, d, c, a, t, tt?}
// tt = curva de talles {talle: unidades} (solo en el formato con columna DESTINO,
// donde las columnas entre la cabecera y el TOTAL son los talles)
function f8ParseLineas(wb){
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:null});
  let hi = 8;
  for(let i=0;i<15&&i<rows.length;i++) if((rows[i]||[]).some(c=>String(c)==='ORIGEN')){ hi=i; break; }
  if(!rows[hi]) throw new Error('sin encabezados');
  // El rótulo TOTAL puede estar en cualquier fila de la cabecera (en el F8 real está
  // una fila más arriba que ORIGEN y su posición depende de la curva de talles)
  let tc = -1;
  for(let i=hi;i>=0&&tc<0;i--){ const fila=rows[i]||[]; for(let ci=0;ci<fila.length;ci++) if(String(fila[ci]==null?'':fila[ci]).trim().toUpperCase()==='TOTAL'){ tc=ci; break; } }
  if(tc<0) tc = 31;
  const H = rows[hi].map(c=>String(c==null?'':c).trim());
  const HU = H.map(h=>h.toUpperCase());
  const findCol=(...pats)=>{ for(const p of pats){ const i=HU.findIndex(h=>h===p); if(i>=0) return i; } for(const p of pats){ const i=HU.findIndex(h=>h.startsWith(p)); if(i>=0) return i; } return -1; };
  const cO=findCol('ORIGEN'), cD=findCol('DESTINO');
  const cC0=findCol('CODIGO','CÓDIGO','COD'); const cC=cC0>=0?cC0:2;
  const cA0=findCol('ARTICULO','ARTÍCULO','DESCRIPCION','DESCRIPCIÓN'); const cA=cA0>=0?cA0:3;
  // primera columna de talles/cantidades = después de la última columna de texto
  const base = Math.max(cO,cC,cA,cD,5)+1;
  // rótulo del talle de una columna: primera celda no vacía de la cabecera hacia arriba
  const lblTalle = ci=>{ for(let i=hi;i>=0;i--){ const v=(rows[i]||[])[ci]; if(v!=null && String(v).trim()!=='') return String(v).trim(); } return ''; };
  // sin columna DESTINO → formato matriz: una columna por sucursal destino entre base y TOTAL
  const dcols=[]; if(cD<0) for(let ci=base;ci<tc;ci++) if(H[ci]&&ci!==cO&&ci!==cC&&ci!==cA) dcols.push(ci);
  const lineas=[];
  for(const r of rows.slice(hi+1)){
    if(!r || !r[1]) continue;
    // el valor del total puede estar 1-2 columnas a la derecha del rótulo (merges)
    let t=null; for(let ci=tc;ci<=tc+2&&ci<r.length;ci++) if(typeof r[ci]==='number'){ t=r[ci]; break; }
    if(t===null){ const fin=tc>base?tc:r.length; const ns=[]; for(let ci=base;ci<fin&&ci<r.length;ci++) if(typeof r[ci]==='number') ns.push(r[ci]); t=ns.reduce((a,b)=>a+b,0); }
    // Destino «Todo X» sin unidades = mandar todo lo que haya (regla de Juli 26/08):
    // entra sin cantidades ni talles, marcado como todo
    const dRaw = cD>=0 ? String(r[cD]||'').trim() : '';
    const esTodo = t===0 && /^todo(\s|$)/i.test(dRaw);
    if(t<=0 && !esTodo) continue;
    const o=String((cO>=0?r[cO]:r[1])||'').trim(), c=String(r[cC]||'').trim(), a=String(r[cA]||'').trim();
    if(cD>=0){
      const d=dRaw;
      if(o&&c&&d){
        if(esTodo){ lineas.push({o,d,c,a,t:0,todo:1}); continue; }
        const tt={};
        for(let ci=base;ci<tc&&ci<r.length;ci++){
          const v=r[ci]; if(typeof v!=='number'||v<=0) continue;
          const lb=lblTalle(ci); if(lb && lb.toUpperCase()!=='TOTAL') tt[lb]=(tt[lb]||0)+v;
        }
        const L={o,d,c,a,t}; if(Object.keys(tt).length) L.tt=tt;
        lineas.push(L);
      }
    }
    else for(const ci of dcols){ const v=r[ci]; if(typeof v==='number'&&v>0&&o&&c) lineas.push({o,d:H[ci],c,a,t:v}); }
  }
  return lineas;
}

function pickingImportarF8(file){
  const reader = new FileReader();
  reader.onload = ev=>{
    let lineas;
    try{
      const wb = XLSX.read(ev.target.result, {type:'array'});
      lineas = f8ParseLineas(wb);
    }catch(err){ console.error(err); toast('No se pudo leer el F8. ¿Es el Excel de David/Daniel?'); return; }
    if(!lineas.length){ toast('El F8 no tiene líneas con movimiento.'); return; }

    const nombreSuc = (SUCURSAL_BY_SLUG[SUC]||{}).nombre || SUC;
    const miOrigen = F8_SLUG_ORIGEN[SUC] || '';
    let usar = lineas.filter(L=>f8Nrm(L.o)===miOrigen);
    let aviso = '';
    if(usar.length){
      const otras = lineas.length - usar.length;
      if(otras) aviso = otras===1 ? 'Se descartó 1 línea con otro origen.' : 'Se descartaron '+otras+' líneas con otro origen.';
    } else {
      // el F8 no tiene líneas de esta sucursal: se importa entero, avisando
      usar = lineas;
      const origenes = [...new Set(lineas.map(L=>f8Nrm(L.o)))];
      aviso = '⚠ Ninguna línea tiene origen '+nombreSuc+'; se importó todo el F8 (origen: '+origenes.join(', ')+').';
    }

    // una entrada por código, sumando unidades y juntando destinos (con talles si el F8 los trae;
    // los destinos «Todo X» quedan marcados en todoD: sin cantidad ni talles)
    const mergeDestT = (into, d, tt)=>{ if(!tt) return; const dt = into[d] || (into[d]={}); for(const tl in tt) dt[tl]=(dt[tl]||0)+tt[tl]; };
    const porCod = new Map();
    usar.forEach(L=>{
      const g = porCod.get(L.c) || {codigo:L.c, desc:L.a, cant:0, dest:{}, destT:{}, todoD:{}};
      g.cant += +L.t||0;
      g.dest[L.d] = (g.dest[L.d]||0) + (+L.t||0);
      if(L.todo) g.todoD[L.d] = 1;
      mergeDestT(g.destT, L.d, L.tt);
      if(!g.desc) g.desc = L.a;
      porCod.set(L.c, g);
    });

    let agregados=0, yaEstaban=0, sinStock=0;
    porCod.forEach(g=>{
      const art = pickingResolver(g.codigo);
      if(art){
        if(pickingItems.includes(art)) yaEstaban++; else { pickingItems.push(art); agregados++; }
        const inf = pickingInfo[art] || (pickingInfo[art] = {cant:0, dest:{}, destT:{}, todoD:{}});
        inf.cant += g.cant;
        for(const d in g.dest) inf.dest[d] = (inf.dest[d]||0) + g.dest[d];
        if(!inf.destT) inf.destT = {};
        for(const d in g.destT) mergeDestT(inf.destT, d, g.destT[d]);
        if(!inf.todoD) inf.todoD = {};
        for(const d in g.todoD) inf.todoD[d] = 1;
      } else {
        const ya = pickingNoStock.find(x=>x.codigo===g.codigo);
        if(ya){
          ya.cant += g.cant;
          for(const d in g.dest) ya.dest[d]=(ya.dest[d]||0)+g.dest[d];
          if(!ya.destT) ya.destT = {};
          for(const d in g.destT) mergeDestT(ya.destT, d, g.destT[d]);
          if(!ya.todoD) ya.todoD = {};
          for(const d in g.todoD) ya.todoD[d] = 1;
        }
        else { pickingNoStock.push(g); }
        sinStock++;
      }
    });

    renderPickList(); pickingBadge();
    const inf = $('pickF8Info');
    if(inf){
      inf.style.display = 'block';
      inf.innerHTML = '📄 <b>'+esc(file.name)+'</b>: '+porCod.size+' artículos → '+
        '<b>'+agregados+'</b> a la lista'+
        (yaEstaban ? ' · '+yaEstaban+' ya estaban (se sumaron unidades)' : '')+
        (sinStock ? ' · <span style="color:var(--red)"><b>'+sinStock+'</b> sin stock hoy</span>' : '')+
        (aviso ? '<br>'+esc(aviso) : '');
    }
    toast('F8 importado: '+agregados+' artículos a la lista.');
  };
  reader.readAsArrayBuffer(file);
}

// «40×2 · 41» — curva de talles compacta (×1 se omite); números en orden natural
// y talles de letra en orden de ropa (XS→S→M→L→XL…), no alfabético
const TALLE_ORD = {XXS:1, XS:2, S:3, M:4, L:5, XL:6, XXL:7, XXXL:8, '2XL':7, '3XL':8};
function pickingTalleCmp(a, b){
  const oa = TALLE_ORD[String(a).toUpperCase()], ob = TALLE_ORD[String(b).toUpperCase()];
  if(oa && ob) return oa - ob;
  if(oa || ob) return oa ? -1 : 1;
  return String(a).localeCompare(String(b), 'es', {numeric:true});
}
function pickingTallesTxt(tt){
  return Object.entries(tt||{})
    .sort((a,b)=>pickingTalleCmp(a[0], b[0]))
    .map(([tl,n])=> n>1 ? tl+'×'+n : tl).join(' · ');
}
function pickingDestTxt(dest, destT, todoD){
  return Object.entries(dest||{}).map(([d,n])=>{
    if(todoD && todoD[d]) return d.replace(/^todo\s+/i,'')+' (TODO lo que haya)';
    const tt = destT && destT[d] ? pickingTallesTxt(destT[d]) : '';
    return d+' ('+n+(tt?': '+tt:'')+')';
  }).join(' · ');
}
// Para imprimir: un renglón por destino, con la curva de talles al lado.
// Mantiene la hoja prolija: destino en negrita, talles en gris, sin cortar feo.
function pickingDestHtml(dest, destT, todoD){
  const es = Object.entries(dest||{});
  if(!es.length) return '—';
  return es.map(([d,n])=>{
    if(todoD && todoD[d]) return '<div class="pdest"><b>'+esc(d.replace(/^todo\s+/i,''))+'</b> <span class="ptall">TODO lo que haya</span></div>';
    const tt = destT && destT[d] ? pickingTallesTxt(destT[d]) : '';
    return '<div class="pdest"><b>'+esc(d)+'</b> ×'+n+(tt?' <span class="ptall">('+esc(tt)+')</span>':'')+'</div>';
  }).join('');
}
// Cantidad a retirar: número, «Todo» (destino sin unidades) o la mezcla de ambos
function pickingCantTxt(g){
  const hayTodo = g.todoD && Object.keys(g.todoD).length;
  if(!hayTodo) return String(g.cant);
  return g.cant > 0 ? g.cant+' + Todo' : 'Todo';
}

}

        grupos[g].map(({a,u,k})=>{

          const inf = pickingInfo[k];
          return '<tr><td class="chk"></td><td>'+esc(a.codigo)+'</td><td>'+esc(a.descripcion||'')+'</td>'+

            '<td>'+esc(a.stock)+'</td><td>'+esc(mod)+'</td></tr>';

    }).join('')+
