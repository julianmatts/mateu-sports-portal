        '</table>'
      : '');
  window.print();
}

// limpieza: consultas se conservan 7 días (alimentan el Top de Actividad),
// movimientos 30 días.
const consultasPruned = {};
function podarConsultas(){
  if(!SUC || consultasPruned[SUC]) return;
  consultasPruned[SUC] = true;
  const validas = new Set();
  for(let i=0;i<7;i++){
    const d = new Date(Date.now()-i*86400000);
    validas.add(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));
  }
  fetchJSON(sucPath()+'/consultas.json?shallow=true').then(dias=>{
    Object.keys(dias||{}).forEach(d=>{ if(!validas.has(d)) delJSON(sucPath()+'/consultas/'+d+'.json'); });
  }).catch(()=>{});
  fetchJSON(sucPath()+'/reposicion.json').then(reps=>{
    const lim = Date.now()-7*86400000;
    const patch = {};
    Object.keys(reps||{}).forEach(id=>{ const r=reps[id]; if(r && r.hecho && (r.hecho.ts||0) < lim) patch[id]=null; });
    if(Object.keys(patch).length) patchJSON(sucPath()+'/reposicion.json', patch);
  }).catch(()=>{});
  fetchJSON(sucPath()+'/movimientos.json').then(movs=>{
    const lim = Date.now()-30*86400000;
    const patch = {};
    Object.keys(movs||{}).forEach(id=>{ if((movs[id].ts||0) < lim) patch[id]=null; });
    if(Object.keys(patch).length) patchJSON(sucPath()+'/movimientos.json', patch);
  }).catch(()=>{});
}

function artCardHtml(a){
  const ubis = a.ubicaciones||{};
  const uids = Object.keys(ubis);
  const sinUbi = !uids.length;
  const puede = canAssign();
  // Comentar también puede el puesto de consulta (firma con un perfil de la sucursal)
  const puedeComentar = puede || MODE==='puesto';
  // feedback del equipo sobre este artículo
  const fb = (DATA.feedback||{})[a.key];
  const fbItems = fb && fb.items ? Object.values(fb.items) : [];
  const porTipo = {};
  fbItems.forEach(i=>{ porTipo[i.tipo]=(porTipo[i.tipo]||0)+1; });
  const fbChips = FEEDBACK_TIPOS.filter(t=>porTipo[t.id])
    .map(t=>'<span class="fb-chip">'+t.emoji+' '+t.label+' <b>'+porTipo[t.id]+'</b></span>').join('');
  // «Yo repongo»: se vendió de la exhibición y alguien se hace cargo de reponerlo
  const rep = repDeArticulo(a.key);
  const repHtml = rep
    ? '<span class="fb-chip rep" title="Se hizo cargo '+esc(rep.por)+' · '+fmtHora(rep.ts)+'">🔄 Repone <b>'+esc(rep.por)+'</b></span>'+
      '<button class="fb-done" data-rephecho="'+esc(rep.id)+'">✓ Repuesto</button>'
    : '<button class="fb-add rep" data-repone="1">🔄 Yo repongo</button>';
  const fbRow = '<div class="fb-row">'+fbChips+(puedeComentar?'<button class="fb-add" data-fb="1">💬 Comentar</button>':'')+repHtml+'</div>';
  const nuevo = sinUbi && esNuevo(a);
  return '<div class="art-card'+(sinUbi?' sin-ubicar':'')+(nuevo?' nuevo':'')+(rep?' repone':'')+'" data-art="'+esc(a.key)+'">'+
    '<div class="art-top"><button class="art-cod" data-histart="'+esc(a.key)+'" title="Ver historial de movimientos">'+esc(a.codigo)+'</button>'+
      (a.articulo?'<span class="hint" title="Id.item">#'+esc(a.articulo)+'</span>':'')+
      (nuevo?'<span class="nuevo-tag" title="Entró en una carga reciente y todavía no tiene lugar">⚡ Nuevo · '+edadAlta(a.fechaAlta)+'</span>':'')+
      (sinUbi?'<span class="sin-ubi-tag">Sin ubicar</span>':'')+
      '<span class="art-stock">Stock: '+esc(a.stock)+'</span></div>'+
    '<div class="art-desc">'+esc(a.descripcion||'')+'</div>'+
    (Array.isArray(a.talles) && a.talles.length
      ? '<div class="talle-chips" title="Stock por talle (según la última carga)">'+
          a.talles.map(x=>'<span class="talle-chip'+(+x.c>0?'':' cero')+'">'+esc(x.t)+' <b>'+(+x.c||0)+'</b></span>').join('')+'</div>'
      : '')+
    '<div class="ubi-chips">'+
      uids.map(uid=>{
        const u=ubis[uid];
        return '<span class="ubi-chip" title="'+esc(u.por?('Asignó '+u.por+(u.ts?' · '+fmtFecha(u.ts):'')):'')+'">'+esc(nombreUbicacion(u))+
          (puede?'<button class="x" data-quitar="'+uid+'" title="Quitar ubicación">✕</button>':'')+'</span>';
      }).join('')+
      (puede?'<button class="ubi-add" data-agregar="1">+ '+(sinUbi?'Asignar ubicación':'Agregar')+'</button>':'')+

}

  cont.querySelectorAll('.art-card').forEach(card=>{
    const key = card.dataset.art;
    card.querySelectorAll('[data-quitar]').forEach(b=> b.addEventListener('click', ()=> quitarUbicacion(key, b.dataset.quitar)));
    const add = card.querySelector('[data-agregar]');

    const fbBtn = card.querySelector('[data-fb]');

    const histBtn = card.querySelector('[data-histart]');
    if(histBtn) histBtn.addEventListener('click', ()=> verHistorialArticulo(key));
    const repBtn = card.querySelector('[data-repone]');

    const repOk = card.querySelector('[data-rephecho]');

/* ---- asignación (bottom sheet: estantería → módulo) ---- */
function estanteriasOrdenadas(){
  return Object.keys(DATA.estanterias||{}).map(id=>({id, ...DATA.estanterias[id]}))
    .sort((a,b)=>(a.orden||99)-(b.orden||99));
}
function modulosOrdenados(est){
  return Object.keys(est.modulos||{}).map(id=>({id, ...est.modulos[id]}))
    .sort((a,b)=>(a.orden||99)-(b.orden||99));
}

// Sugerencia: dónde están los artículos "hermanos" (mismo prefijo de código,
// que en la práctica es la marca: GIVCGE…, RUG…, MED…, etc.)
function sugerirUbicaciones(artKey){
  const a = DATA.articulos[artKey]; if(!a) return {pref:null, sugs:[]};
  const m = String(a.codigo||'').toUpperCase().match(/^[A-ZÑ]{2,}/);
  if(!m) return {pref:null, sugs:[]};
  const pref = m[0];
  const counts = {};
  for(const otro of articulosLista()){
    if(otro.key===artKey) continue;
    if(!String(otro.codigo||'').toUpperCase().startsWith(pref)) continue;
    for(const uid in (otro.ubicaciones||{})){
      const u = otro.ubicaciones[uid];
      const k = u.estanteriaId+'::'+(u.moduloId||'');
      counts[k] = (counts[k]||0)+1;
    }
  }
  const sugs = Object.entries(counts).sort((x,y)=>y[1]-x[1]).slice(0,3)
    .map(([k,n])=>{ const [estId,modId]=k.split('::'); return {estId, modId:modId||null, n}; })
    .filter(s=>DATA.estanterias[s.estId]);
  return {pref, sugs};
}

function abrirSheetAsignar(artKey){
  const a = DATA.articulos[artKey]; if(!a) return;
  const ests = estanteriasOrdenadas();
  if(!ests.length){
    toast(canStock() ? 'Primero creá estanterías en la pestaña Estanterías.' : 'No hay estanterías creadas. Pedile al encargado que las cargue.');
    return;
  }
  const {pref, sugs} = sugerirUbicaciones(artKey);
  const sugsHtml = sugs.length
    ? '<div class="fb-grupo mas">💡 Sugerido — otros "'+esc(pref)+'…" están acá</div>'+
      sugs.map(s=>{
        const e = DATA.estanterias[s.estId];
        const mod = s.modId && e.modulos && e.modulos[s.modId];
        const dep = depositoDe(e);
        return '<button class="sheet-opt sug" data-sug="'+s.estId+'::'+(s.modId||'')+'">'+
          esc(e.nombre + (mod ? ' · '+mod.nombre : '') + (dep ? ' · '+dep : ''))+'<span class="n">'+s.n+' art.</span></button>';
      }).join('')+
      '<div class="fb-grupo">O elegí a mano</div>'
    : '';
  // Con más de un depósito (Diagonal 80): separador por piso en la lista
  let prevDepSheet;
  $('sheetBody').innerHTML =
    '<div class="sheet-title">'+esc(a.codigo)+'</div>'+
    '<div class="sheet-sub">'+esc(a.descripcion||'')+' — elegí la estantería</div>'+
    sugsHtml+
    ests.map(e=>{
      const dep = depositoDe(e);
      const head = (dep && dep!==prevDepSheet) ? '<div class="fb-grupo">'+esc(dep)+'</div>' : '';
      prevDepSheet = dep;
      return head+'<button class="sheet-opt" data-est="'+e.id+'">'+esc(e.nombre)+
        '<span class="n">'+Object.keys(e.modulos||{}).length+' módulos</span></button>';
    }).join('');
  $('sheetOverlay').classList.add('show');
  $('sheetBody').querySelectorAll('[data-sug]').forEach(b=> b.addEventListener('click', ()=>{
    const [estId, modId] = b.dataset.sug.split('::');
    asignarUbicacion(artKey, estId, modId||null);
  }));
  $('sheetBody').querySelectorAll('[data-est]').forEach(b=> b.addEventListener('click', ()=> sheetElegirModulo(artKey, b.dataset.est)));
}

function sheetElegirModulo(artKey, estId){
  const a = DATA.articulos[artKey]; const est = DATA.estanterias[estId];
  if(!a || !est) return cerrarSheet();
  const mods = modulosOrdenados(est);
  if(!mods.length){
    // estantería sin módulos: se asigna a la estantería sola
    return asignarUbicacion(artKey, estId, null);
  }
  $('sheetBody').innerHTML =
    '<div class="sheet-title">'+esc(a.codigo)+' → '+esc(est.nombre)+(depositoDe(est)?' · '+esc(depositoDe(est)):'')+'</div>'+
    '<div class="sheet-sub">Elegí el módulo</div>'+
    mods.map(m=>'<button class="sheet-opt" data-mod="'+m.id+'">'+esc(m.nombre)+'</button>').join('')+
    '<button class="btn btn-outline btn-block" id="sheetVolver" style="margin-top:6px">← Volver</button>';
  $('sheetBody').querySelectorAll('[data-mod]').forEach(b=> b.addEventListener('click', ()=> asignarUbicacion(artKey, estId, b.dataset.mod)));
  $('sheetVolver').addEventListener('click', ()=> abrirSheetAsignar(artKey));
}

function cerrarSheet(){
  $('sheetOverlay').classList.remove('show');
  FB_PERFIL = null;   // puesto compartido: el próximo comentario vuelve a elegir quién firma
}

async function asignarUbicacion(artKey, estId, modId){
  cerrarSheet();
  const a = DATA.articulos[artKey]; if(!a) return;
  // evitar duplicado exacto
  for(const uid in (a.ubicaciones||{})){
    const u=a.ubicaciones[uid];
    if(u.estanteriaId===estId && (u.moduloId||null)===(modId||null)){ toast('Ya estaba asignado ahí.'); return; }
  }
  const entrada = { estanteriaId:estId, moduloId:modId||null, por:nombreOperador(), ts:Date.now() };
  try{
    const r = await postJSON(sucPath()+'/articulos/'+encodeURIComponent(artKey)+'/ubicaciones.json', entrada);
    if(!a.ubicaciones) a.ubicaciones={};
    a.ubicaciones[r.name] = entrada;
    lastHash=''; renderVistaActiva(); renderStatusbar();
    patchMetaContadores();
    registrarMovimiento(artKey, 'asigna', nombreUbicacion(entrada));
    toast('Ubicación asignada ✓');
  }catch(e){ toast('No se pudo guardar. Probá de nuevo.'); }
}

async function quitarUbicacion(artKey, uid){
  const a = DATA.articulos[artKey]; if(!a || !a.ubicaciones || !a.ubicaciones[uid]) return;
  const entrada = {...a.ubicaciones[uid]};
  const nombreUbi = nombreUbicacion(entrada);
  try{
    await delJSON(sucPath()+'/articulos/'+encodeURIComponent(artKey)+'/ubicaciones/'+uid+'.json');
    delete a.ubicaciones[uid];
    registrarMovimiento(artKey, 'quita', nombreUbi);
    lastHash=''; renderVistaActiva(); renderStatusbar();
    patchMetaContadores();
    toastAccion('Ubicación quitada.', 'Deshacer', async ()=>{
      try{
        const r = await postJSON(sucPath()+'/articulos/'+encodeURIComponent(artKey)+'/ubicaciones.json', entrada);
        const art = DATA.articulos[artKey];
        if(art){ if(!art.ubicaciones) art.ubicaciones={}; art.ubicaciones[r.name]=entrada; }
        registrarMovimiento(artKey, 'asigna', nombreUbi+' (deshacer)');
        lastHash=''; renderVistaActiva(); renderStatusbar(); patchMetaContadores();
        toast('Ubicación restaurada ✓');
      }catch(err){ toast('No se pudo deshacer.'); }
    });
  }catch(e){ toast('No se pudo quitar. Probá de nuevo.'); }
}

/* ============================================================
   FEEDBACK DE ARTÍCULOS (comentarios predeterminados)
   Se guarda en feedback/{artKey} y lo consume la planilla de
   Pedidos Semanales del encargado (grupo 'mas' → Pedidos,
   grupo 'menos' → Menos Vendidos).
   ============================================================ */
function abrirSheetFeedback(artKey){
  const a = DATA.articulos[artKey]; if(!a) return;
  const fb = (DATA.feedback||{})[artKey];
  const items = fb && fb.items
    ? Object.keys(fb.items).map(id=>({id, ...fb.items[id]})).sort((x,y)=>(y.ts||0)-(x.ts||0))
    : [];
  const grupos = [
    {g:'mas',   tt:'🔥 Para pedir más (va a la planilla de Pedidos)'},
    {g:'menos', tt:'🧊 Para frenar (va a la planilla de Menos Vendidos)'},
  ];
  // En el puesto de consulta el comentario se firma con un perfil de la sucursal
  const esPuesto = MODE==='puesto';
  const quienes = esPuesto ? perfilesOrdenados() : [];
  $('sheetBody').innerHTML =
    '<div class="sheet-title">💬 '+esc(a.codigo)+'</div>'+
    '<div class="sheet-sub">'+esc(a.descripcion||'')+' — elegí un comentario</div>'+
    (esPuesto
      ? '<div class="fb-grupo">👤 ¿Quién comenta?</div>'+
        (quienes.length
          ? '<div class="fb-quien-row">'+quienes.map(p=>
              '<button class="fb-quien'+(FB_PERFIL&&FB_PERFIL.id===p.id?' sel':'')+'" data-fbquien="'+esc(p.id)+'">'+
              avatarHtml(p)+esc(p.nombre)+'</button>').join('')+'</div>'
          : '<div class="hint">La sucursal todavía no tiene perfiles creados.</div>')
      : '')+
    grupos.map(({g,tt})=>
      '<div class="fb-grupo '+g+'">'+tt+'</div>'+
      FEEDBACK_TIPOS.filter(t=>t.grupo===g).map(t=>
        '<button class="sheet-opt" data-fbtipo="'+t.id+'">'+t.emoji+' '+t.label+'</button>').join('')
    ).join('')+
    (items.length
      ? '<div class="fb-grupo">Comentarios de este artículo</div>'+items.map(i=>{
          const t = FEEDBACK_BY_ID[i.tipo] || {emoji:'💬', label:i.tipo};
          const puedeBorrar = i.por===nombreOperador() || canManage();
          return '<div class="fb-item">'+avatarHtml({nombre:i.por, avatar:i.avatar})+
            '<div class="info"><b>'+t.emoji+' '+esc(t.label)+'</b>'+
            '<div class="quien">'+esc(i.por)+' · '+fmtFecha(i.ts)+'</div></div>'+
            (puedeBorrar?'<button class="icon-btn lite" data-fbdel="'+i.id+'" title="Borrar comentario">✕</button>':'')+
            '</div>';
        }).join('')
      : '');
  $('sheetOverlay').classList.add('show');
  $('sheetBody').querySelectorAll('[data-fbquien]').forEach(b=> b.addEventListener('click', ()=>{
    const id = b.dataset.fbquien;
    FB_PERFIL = PERFILES[id] ? {id, ...PERFILES[id]} : null;
    abrirSheetFeedback(artKey);   // re-render para marcar la selección
  }));
  $('sheetBody').querySelectorAll('[data-fbtipo]').forEach(b=> b.addEventListener('click', ()=>{
    if(MODE==='puesto' && !FB_PERFIL){ toast('Primero elegí quién comenta 👆'); return; }
    agregarFeedback(artKey, b.dataset.fbtipo);
  }));
  $('sheetBody').querySelectorAll('[data-fbdel]').forEach(b=> b.addEventListener('click', ()=> quitarFeedback(artKey, b.dataset.fbdel)));
}

async function agregarFeedback(artKey, tipo){
  const a = DATA.articulos[artKey]; if(!a) return;
  if(MODE==='puesto' && !FB_PERFIL) return;   // el puesto firma siempre con un perfil
  const firmante = MODE==='puesto' ? FB_PERFIL : PERFIL;
  const por = MODE==='puesto' ? FB_PERFIL.nombre : nombreOperador();
  const fb = (DATA.feedback||{})[artKey];
  const repetido = fb && fb.items && Object.values(fb.items).some(i=>i.tipo===tipo && i.por===por);
  if(repetido){ toast('Ya dejaste ese comentario en este artículo.'); return; }
  const id = newId('f');
  const item = { tipo, por, avatar:(firmante && firmante.avatar)||null, ts:Date.now() };
  // un solo PATCH multi-path: datos del artículo + el comentario nuevo
  const patch = { codigo:a.codigo, descripcion:(a.descripcion||'').slice(0,60) };
  patch['items/'+id] = item;
  try{
    await patchJSON(sucPath()+'/feedback/'+encodeURIComponent(artKey)+'.json', patch);
    if(!DATA.feedback) DATA.feedback = {};
    if(!DATA.feedback[artKey]) DATA.feedback[artKey] = {codigo:a.codigo, descripcion:patch.descripcion, items:{}};
    if(!DATA.feedback[artKey].items) DATA.feedback[artKey].items = {};
    DATA.feedback[artKey].items[id] = item;
    lastHash='';
    cerrarSheet(); renderVistaActiva(); bumpRev();
    toast('Comentario guardado ✓ El encargado lo ve en Pedidos Semanales.');
  }catch(e){ toast('No se pudo guardar. Probá de nuevo.'); }
}

async function quitarFeedback(artKey, itemId){
  try{
    await delJSON(sucPath()+'/feedback/'+encodeURIComponent(artKey)+'/items/'+itemId+'.json');
    const fb = DATA.feedback && DATA.feedback[artKey];
    if(fb && fb.items) delete fb.items[itemId];
    lastHash='';
    abrirSheetFeedback(artKey);
    renderVistaActiva(); bumpRev();
  }catch(e){ toast('No se pudo borrar.'); }
}

/* ============================================================
   REPOSICIÓN DEL SALÓN — "Yo repongo"
   Se vendió un artículo que estaba exhibido: el vendedor toca
   «Yo repongo», firma con su nombre y queda pendiente hasta que
   vuelve y lo marca repuesto. Compartido por sucursal
   (reposicion/<id> en Firebase): lo ve todo el salón.
   ============================================================ */

function reposiciones(){
  return Object.keys(DATA.reposicion||{})
    .map(id=>({id, ...DATA.reposicion[id]}))
    .sort((a,b)=>(b.ts||0)-(a.ts||0));
}
function repPendientes(){ return reposiciones().filter(r=>!r.hecho); }
// pendiente de este artículo (uno por artículo: no se pisan dos vendedores)
function repDeArticulo(artKey){ return repPendientes().find(r=>r.artKey===artKey) || null; }

function reponeBadge(){
  const b = $('reponeBadge'); if(!b) return;
  const n = repPendientes().length;
  b.textContent = n; b.style.display = n ? 'block' : 'none';
}

/* Hoja para hacerse cargo: muestra dónde está en el depósito (que es lo que
   el vendedor necesita para ir a buscarlo) y con qué nombre firma. */
function abrirSheetRepone(artKey){
  const a = DATA.articulos[artKey]; if(!a) return;
  if(repDeArticulo(artKey)){ abrirRepone(); return; }   // ya hay alguien a cargo
  const ubis = Object.values(a.ubicaciones||{});
  const sinStock = !(+a.stock > 0);
  // en el puesto se elige el nombre (como en Comentar); en la sucursal firma el perfil activo
  const esPuesto = MODE==='puesto';
  const quienes = esPuesto ? perfilesOrdenados() : [];
  $('sheetBody').innerHTML =
    '<div class="sheet-title">🔄 '+esc(a.codigo)+'</div>'+
    '<div class="sheet-sub">'+esc(a.descripcion||'')+'</div>'+
    (sinStock
      ? '<div class="fb-grupo menos">⚠ No queda stock en el depósito</div>'+
        '<div class="hint" style="margin-bottom:6px">Igual podés anotarlo, pero avisale al encargado: hay que pedirlo a otra sucursal.</div>'
      : '')+
    '<div class="fb-grupo">📍 Dónde está en el depósito</div>'+
    '<div class="hint" style="margin-bottom:6px">'+
      (ubis.length ? ubis.map(u=>esc(nombreUbicacion(u))).join(' · ')
                   : 'Sin ubicación asignada — está en SIN UBICAR.')+
      ' · Stock: '+esc(a.stock)+'</div>'+
    (Array.isArray(a.talles) && a.talles.length
      ? '<div class="talle-chips" style="margin-bottom:6px">'+a.talles.map(x=>
          '<span class="talle-chip'+(+x.c>0?'':' cero')+'">'+esc(x.t)+' <b>'+(+x.c||0)+'</b></span>').join('')+'</div>'
      : '')+
    (esPuesto
      ? '<div class="fb-grupo">👤 ¿Quién repone?</div>'+
        (quienes.length
          ? '<div class="fb-quien-row">'+quienes.map(p=>
              '<button class="fb-quien'+(FB_PERFIL&&FB_PERFIL.id===p.id?' sel':'')+'" data-repquien="'+esc(p.id)+'">'+
              avatarHtml(p)+esc(p.nombre)+'</button>').join('')+'</div>'
          : '<div class="hint">La sucursal todavía no tiene perfiles creados.</div>')
      : '')+
    '<button class="sheet-opt sug" data-repok="1" style="margin-top:12px">🔄 Me hago cargo de reponerlo</button>';
  $('sheetOverlay').classList.add('show');
  $('sheetBody').querySelectorAll('[data-repquien]').forEach(b=> b.addEventListener('click', ()=>{
    const id = b.dataset.repquien;
    FB_PERFIL = PERFILES[id] ? {id, ...PERFILES[id]} : null;
    abrirSheetRepone(artKey);   // re-render para marcar la selección
  }));
  $('sheetBody').querySelector('[data-repok]').addEventListener('click', ()=> tomarReposicion(artKey));
}

async function tomarReposicion(artKey){
  const a = DATA.articulos[artKey]; if(!a) return;
  if(MODE==='puesto' && !FB_PERFIL){ toast('Primero elegí quién repone 👆'); return; }
  if(repDeArticulo(artKey)){ toast('Ya hay alguien a cargo de ese artículo.'); return; }
  const firmante = MODE==='puesto' ? FB_PERFIL : PERFIL;
  const rec = {
    artKey, codigo:a.codigo, descripcion:(a.descripcion||'').slice(0,60),
    ubic: Object.values(a.ubicaciones||{}).map(u=>nombreUbicacion(u)).join(' · ') || null,
    por: MODE==='puesto' ? FB_PERFIL.nombre : nombreOperador(),
    avatar: (firmante && firmante.avatar) || null,
    ts: Date.now(),
  };
  const id = newId('r');
  try{
    await putJSON(sucPath()+'/reposicion/'+id+'.json', rec);
    if(!DATA.reposicion) DATA.reposicion = {};
    DATA.reposicion[id] = rec; lastHash='';
    cerrarSheet(); renderVistaActiva(); reponeBadge(); bumpRev();
    toast('Anotado ✓ Cuando lo repongas, marcalo como repuesto.');
  }catch(e){ toast('No se pudo guardar. Probá de nuevo.'); }
}

async function marcarRepuesto(id){
  const r = (DATA.reposicion||{})[id]; if(!r || r.hecho) return;
  const hecho = { por: MODE==='puesto' ? ((FB_PERFIL&&FB_PERFIL.nombre)||r.por) : nombreOperador(), ts: Date.now() };
  try{
    await patchJSON(sucPath()+'/reposicion/'+id+'.json', {hecho});
    DATA.reposicion[id] = Object.assign({}, r, {hecho}); lastHash='';
    if($('repOverlay').classList.contains('show')) renderRepone();
    renderVistaActiva(); reponeBadge(); bumpRev();
    toast('Repuesto en la exhibición ✓');
  }catch(e){ toast('No se pudo guardar. Probá de nuevo.'); }
}

// se equivocó de artículo o lo tomó otro: sacarlo de la lista
async function soltarReposicion(id){
  if(!(DATA.reposicion||{})[id]) return;
  try{
    await delJSON(sucPath()+'/reposicion/'+id+'.json');
    delete DATA.reposicion[id]; lastHash='';
    if($('repOverlay').classList.contains('show')) renderRepone();
    renderVistaActiva(); reponeBadge(); bumpRev();
  }catch(e){ toast('No se pudo borrar.'); }
}

function abrirRepone(){ cerrarSheet(); renderRepone(); $('repOverlay').classList.add('show'); }
function cerrarRepone(){ $('repOverlay').classList.remove('show'); }

function renderRepone(){
  const lista = reposiciones();
  const pend = lista.filter(r=>!r.hecho);
  const hechas = lista.filter(r=>r.hecho).slice(0,15);
  $('repCnt').textContent = pend.length ? pend.length+' pendiente'+(pend.length===1?'':'s') : '';
  const item = r=>
    '<div class="hist-item rep-item'+(r.hecho?' hecho':'')+'">'+
      avatarHtml({nombre:r.por, avatar:r.avatar})+
      '<div class="info"><div class="cod">'+esc(r.codigo)+'</div>'+
      '<div class="desc">'+esc(r.descripcion||'')+'</div>'+
      (r.ubic?'<div class="ubi">📍 '+esc(r.ubic)+'</div>':'<div class="ubi">Sin ubicar</div>')+
      '<div class="quien">'+esc(r.por)+' · '+fmtHora(r.ts)+
        (r.hecho?' → repuesto '+fmtHora(r.hecho.ts)+' por '+esc(r.hecho.por):'')+'</div></div>'+
      (r.hecho ? '<div class="rep-acc"><span class="hora">✓</span></div>'
               : '<div class="rep-acc"><button class="fb-done" data-rephecho="'+esc(r.id)+'">✓ Repuesto</button>'+
                 '<button class="icon-btn lite" data-repdel="'+esc(r.id)+'" title="Sacar de la lista">✕</button></div>')+
    '</div>';
  $('repList').innerHTML =
    (pend.length
      ? pend.map(item).join('')
      : '<div class="empty">No hay nada pendiente de reponer 🎉<br><span class="hint">Cuando vendas algo que estaba exhibido, buscalo y tocá «🔄 Yo repongo».</span></div>')+
    (hechas.length ? '<div class="fb-grupo">Ya repuestos</div>'+hechas.map(item).join('') : '');
  $('repList').querySelectorAll('[data-rephecho]').forEach(b=> b.addEventListener('click', ()=> marcarRepuesto(b.dataset.rephecho)));
  $('repList').querySelectorAll('[data-repdel]').forEach(b=> b.addEventListener('click', ()=> soltarReposicion(b.dataset.repdel)));
}

/* ============================================================
   CARGA DE STOCK (Excel → sync)
   ============================================================ */
function onFileStock(e){
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    try{
      const wb = XLSX.read(ev.target.result, {type:'array'});
      // dos modelos: la planilla de Drive de la sucursal (varias hojas
      // "UBICACION …") o el export plano de una hoja (mapeo de columnas)
      if(esPlanillaDrive(wb)) abrirModalDrive(wb); else abrirModalMapeo(wb);
    }catch(err){
      toast('No se pudo leer el archivo. ¿Es un .xlsx válido?');
    }
  };
  reader.readAsArrayBuffer(file);
}

// Heurísticas de detección de columnas
const RX_COD  = /^(c[oó]d(igo)?|art[ií]culo|sku|referencia|ref)/i;
const RX_DESC = /(descrip|detalle|nombre|denominaci)/i;
const RX_STK  = /(stock|cantidad|existencia|unidades|^cant)/i;
const RX_UBI  = /ubicaci/i;
const RX_TALLE = /^tall[ea]s?\b|^size\b/i;

function detectarEncabezado(rows){
  for(let i=0; i<Math.min(rows.length, 25); i++){
    const row = rows[i]||[];
    let iCod=-1, iDesc=-1, iStk=-1, iUbi=-1, iTalle=-1;
    row.forEach((c,j)=>{
      const t = String(c||'').trim();
      if(!t) return;
      if(iCod<0  && RX_COD.test(t))  iCod=j;
      if(iDesc<0 && RX_DESC.test(t)) iDesc=j;
      if(iStk<0  && RX_STK.test(t))  iStk=j;
      if(iUbi<0  && RX_UBI.test(t))  iUbi=j;
      if(iTalle<0 && RX_TALLE.test(t)) iTalle=j;
    });
    if(iCod>=0 && iStk>=0) return {fila:i, iCod, iDesc, iStk, iUbi, iTalle};
  }
  return null;
}

/* Export SIN fila de encabezados (p.ej. el stock pelado de Diagonal: Id.item ·
   SKU · Descripción · Stock): se reconocen las columnas por su CONTENIDO sobre
   una muestra de filas. Números grandes (≥1000, ~6 dígitos) = Id.item; números
   chicos = stock; texto con espacios = descripción; texto corto sin espacios =
   código (SKU). Devuelve {fila:-1, iCod, iDesc, iStk, iUbi, iArt} o null. */
function detectarColumnasDatos(rows){
  const sample = rows.filter(r=>r && r.some(c=>String(c==null?'':c).trim()!=='')).slice(0,300);
  if(sample.length<2) return null;
  const nCols = Math.max.apply(null, sample.map(r=>r.length));
  const st=[];
  for(let j=0;j<nCols;j++){
    const vals = sample.map(r=>String(r[j]==null?'':r[j]).trim()).filter(v=>v!=='');
    if(vals.length < sample.length*0.5) continue;   // columnas casi vacías no juegan
    const nums = vals.filter(v=>/^-?\d+(?:[.,]\d+)?$/.test(v));
    st.push({ j,
      numShare: nums.length/vals.length,
      avg: nums.length ? nums.reduce((a,v)=>a+parseFloat(v.replace(',','.')),0)/nums.length : 0,
      spaceShare: vals.filter(v=>v.indexOf(' ')>=0).length/vals.length,
      avgLen: vals.reduce((a,v)=>a+v.length,0)/vals.length,
      ubiShare: vals.filter(v=>parseUbicacionTexto(v).length).length/vals.length });
  }
  if(!st.length) return null;
  const usados=new Set();
  const pick=(filtro,orden)=>{ const c=st.filter(x=>!usados.has(x.j)).filter(filtro).sort(orden)[0];
    if(c) usados.add(c.j); return c?c.j:-1; };
  const iDesc = pick(x=>x.numShare<0.3 && x.spaceShare>=0.4, (a,b)=>b.avgLen-a.avgLen);
  const iUbi  = pick(x=>x.ubiShare>=0.5, (a,b)=>b.ubiShare-a.ubiShare);
  const numCols = st.filter(x=>!usados.has(x.j) && x.numShare>=0.9).sort((a,b)=>a.avg-b.avg);
  const iStk = numCols.length ? numCols[0].j : -1; if(iStk>=0) usados.add(iStk);
  const iArt = (numCols.length>1 && numCols[numCols.length-1].avg>=1000) ? numCols[numCols.length-1].j : -1;
  if(iArt>=0) usados.add(iArt);
  const iCod = pick(x=>x.numShare<0.9, (a,b)=>(a.spaceShare-b.spaceShare) || (a.avgLen-b.avgLen));
  if(iCod<0 || iStk<0) return null;
  return {fila:-1, iCod, iDesc, iStk, iUbi, iArt};
}

// "EST 2 - MOD 1" con variantes sucias: orden invertido, espacios/guiones
// irregulares y "MOD 3y4" (dos módulos). Devuelve [{est, mod|null}].
function parseUbicacionTexto(txt){
  const t = String(txt||'').toUpperCase();
  // "EST 2 - MOD 1" (export plano) o "E2-M1" (planilla de Drive de la sucursal)
  const est = t.match(/EST\s*\.?\s*(\d+)/) || t.match(/(?:^|[^A-Z])E\s*(\d+)/);
  if(!est) return [];
  const myn = t.match(/MOD\s*\.?\s*(\d+)\s*Y\s*(\d+)/);
  if(myn) return [{est:+est[1], mod:+myn[1]}, {est:+est[1], mod:+myn[2]}];
  const mod = t.match(/MOD\s*\.?\s*(\d+)/) || t.match(/(?:^|[^A-Z])M\s*(\d+)/);
  return [{est:+est[1], mod: mod ? +mod[1] : null}];
}

/* ------------------------------------------------------------
   PLANILLA DE DRIVE DE LA SUCURSAL (modelo "UBICACION DEPOSITO")
   Además del export plano (una hoja: Código · Descripción · Stock ·
   Ubicación), se acepta la planilla que la sucursal usa en Drive:
   - Hojas "UBICACION CALZADO / INDUMENTARIA / ACCESORIOS": grilla por
     casillero con columnas UBICACIÓN (E#-M#) · Contador · Articulo
     (Id.item) · Codigo (SKU de marca) · Descripcion · Stock. Los
     casilleros vacíos vienen con #N/A. Un artículo en dos módulos
     aparece en dos filas con el MISMO stock total → NO se suma.
   - Hoja "Base de Datos": stock completo del día (Id.item · Código de
     barras (= SKU) · Artículo · Stock). Opcional: agrega los artículos
     que no están ubicados (quedan en SIN UBICAR).
   Clave del artículo = SKU (como Calle 49); el Id.item se guarda en
   `articulo` y también se busca por él.
   ------------------------------------------------------------ */
const RX_HOJA_UBI = /^\s*UBICACI[OÓ]N\s+/i;
const RX_HOJA_BD  = /base\s*de\s*datos/i;

function filasDe(wb, nombre){
  const c = wb.__rowsCache = wb.__rowsCache || {};
  return c[nombre] || (c[nombre] = XLSX.utils.sheet_to_json(wb.Sheets[nombre], {header:1, defval:''}));
}
function idxCol(hdr, rx){ return (hdr||[]).findIndex(c=>rx.test(String(c||'').trim())); }
function esNA(v){ const s=String(v==null?'':v).trim(); return !s || s==='#N/A' || s==='#REF!' || s==='#VALUE!'; }
function limpiarId(v){ const s=String(v==null?'':v).trim(); return /^\d+(\.0+)?$/.test(s) ? String(parseInt(s,10)) : s; }
function numStock(v){ const n=parseFloat(String(v).replace(',','.')); return isNaN(n)?0:n; }
// "40.0" (número de Excel) → "40"; conserva "7.5", "S", "35-40"
function nrmTalle(v){ const s=String(v==null?'':v).trim(); return /^\d+(\.0+)?$/.test(s) ? String(parseInt(s,10)) : s; }
// stock por talle explícito («40×2 · 41×0»), para preview y export;
// acepta el objeto del parseo ({talle:cant}) o el array guardado ([{t,c}])
function tallesStockTxt(tt){
  if(!tt) return '';
  const es = Array.isArray(tt) ? tt.map(x=>[x.t,x.c]) : Object.entries(tt);
  return es.sort((a,b)=>pickingTalleCmp(a[0],b[0])).map(([t,c])=>t+'×'+(+c||0)).join(' · ');
}

function hojasDrive(wb){
  return wb.SheetNames.filter(n=>{
    if(!RX_HOJA_UBI.test(n)) return false;
    const hdr = filasDe(wb,n)[0]||[];
    return idxCol(hdr,/^ubicaci/i)>=0 && idxCol(hdr,/^c[oó]digo$/i)>=0 && idxCol(hdr,/^art[ií]culo$/i)>=0;
  });
}
function esPlanillaDrive(wb){ return hojasDrive(wb).length>0; }

function parsearPlanillaDrive(wb, incluirBD){
  const porCod = {}; const hojas = [];
  const getArt = codigo => porCod[codigo] || (porCod[codigo] = {codigo, articulo:'', descripcion:'', stock:0, ubis:[]});
  for(const n of hojasDrive(wb)){
    const rows = filasDe(wb,n); const hdr = rows[0]||[];
    const iUbi=idxCol(hdr,/^ubicaci/i), iArt=idxCol(hdr,/^art[ií]culo$/i), iCod=idxCol(hdr,/^c[oó]digo$/i), iDesc=idxCol(hdr,/^descrip/i);
    let iStk=idxCol(hdr,/stock/i); if(iStk<0) iStk=Math.max(iDesc,iCod)+1; // INDUMENTARIA trae el dato sin encabezado
    let arts=0, ubis=0, omit=0; const vistos=new Set();
    for(let i=1;i<rows.length;i++){
      const r=rows[i]||[];
      const articulo=limpiarId(r[iArt]), codigo=String(r[iCod]==null?'':r[iCod]).trim();
      if(esNA(articulo) && esNA(codigo)) continue;   // casillero vacío de la grilla
      if(esNA(codigo)){ omit++; continue; }           // Id.item sin SKU (#N/A): no se puede cargar
      const a = getArt(codigo);
      if(!a.articulo && !esNA(articulo)) a.articulo = articulo;
      const d = String(r[iDesc]==null?'':r[iDesc]).trim(); if(!a.descripcion && !esNA(d)) a.descripcion = d;
      const s = r[iStk]; if(!esNA(s)) a.stock = Math.max(a.stock, numStock(s)); // mismo total en cada fila: no se suma
      for(const u of parseUbicacionTexto(r[iUbi])){
        if(!a.ubis.some(x=>x.est===u.est && x.mod===u.mod)){ a.ubis.push(u); ubis++; }
      }
      if(!vistos.has(codigo)){ vistos.add(codigo); arts++; }
    }
    hojas.push({nombre:n, arts, ubis, omit});
  }
  let bd = null;
  const nBD = wb.SheetNames.find(n=>RX_HOJA_BD.test(n));
  if(incluirBD && nBD){
    const rows = filasDe(wb,nBD);
    const f = rows.findIndex(r=>(r||[]).some(c=>/id\.?\s*item/i.test(String(c))));
    if(f>=0){
      const hdr=rows[f]; const iId=idxCol(hdr,/id\.?\s*item/i), iCod=idxCol(hdr,/c[oó]digo/i), iDesc=idxCol(hdr,/^art[ií]culo/i), iStk=idxCol(hdr,/stock/i);
      let total=0, nuevos=0;
      for(let i=f+1;i<rows.length;i++){
        const r=rows[i]||[]; const codigo=String(r[iCod]==null?'':r[iCod]).trim(); const articulo=limpiarId(r[iId]);
        if(esNA(codigo) || !/^\d+$/.test(articulo)) continue; // filas de texto libre ("contencion", "Caja")
        total++;
        if(!porCod[codigo]) nuevos++;
        const a = getArt(codigo);
        if(!a.articulo) a.articulo = articulo;
        const d = String(r[iDesc]==null?'':r[iDesc]).trim(); if(!a.descripcion && !esNA(d)) a.descripcion = d;
        const s = r[iStk]; if(!esNA(s)) a.stock = numStock(s); // el stock del día manda
      }
      bd = {nombre:nBD, total, nuevos};
    }
  }
  return {lista:Object.values(porCod), hojas, bd, nBD};
}

  const nBD = wb.SheetNames.find(n=>RX_HOJA_BD.test(n));
  $('modalBody').innerHTML =

      'Se leen todas las hojas de ubicación juntas; un artículo en varios módulos suma ubicaciones, no stock.</div>'+

    $('drvPreview').innerHTML =

        (h.omit?' · '+h.omit+' fila'+(h.omit===1?'':'s')+' sin SKU omitida'+(h.omit===1?'':'s'):'')+'</div></div></div>').join('')+
      (bd ? '<div class="res-row"><div class="num">'+bd.nuevos+'</div><div class="lbl">Solo en «'+esc(bd.nombre)+'» (sin ubicar)'+
        '<div class="hint" style="text-transform:none;letter-spacing:0;font-weight:400">'+bd.total+' artículos con stock en la hoja</div></div></div>' : '')+
      (lista.length
        ? '<div class="hint" style="margin:8px 0"><b>'+lista.length+' artículos</b> en total · <b>'+ubicados+'</b> con ubicación'+
            (ests.size?' · estanterías E1–E'+Math.max(...ests):'')+'</div>'+
          '<div class="table-wrap"><table class="prev"><tr><th>SKU</th><th>Id.item</th><th>Descripción</th><th>Stock</th><th>Ubicación</th></tr>'+
          lista.filter(a=>a.ubis.length).slice(0,5).map(a=>'<tr><td>'+esc(a.codigo)+'</td><td>'+esc(a.articulo)+'</td><td>'+esc(a.descripcion.slice(0,45))+'</td><td>'+a.stock+'</td>'+
            '<td>'+esc(a.ubis.map(u=>'Est '+u.est+(u.mod!==null?' · Mod '+u.mod:'')).join(' / '))+'</td></tr>').join('')+
          '</table></div>'
        : '<div class="hint" style="color:var(--red)">No se leyó ningún artículo.</div>');
  }
  preview();
  if($('drvBD')) $('drvBD').addEventListener('change', preview);
  $('drvManual').addEventListener('click', e=>{ e.preventDefault(); abrirModalMapeo(wb); });
  $('mapCancelar').addEventListener('click', cerrarModal);
  $('mapConfirmar').addEventListener('click', async ()=>{
    if(!parsed || !parsed.lista.length){ toast('No hay artículos para sincronizar.'); return; }
    $('mapConfirmar').disabled = true; $('mapConfirmar').textContent = 'Sincronizando…';
    try{ await sincronizarStock(parsed.lista); }
    catch(e){ toast('Error al sincronizar. Probá de nuevo.'); cerrarModal(); }
  });
}

function abrirModalMapeo(wb, hojaElegida){
  const hojas = wb.SheetNames;
  const rowsCache = wb.__rowsCache = wb.__rowsCache || {};
  const rowsDe = n => rowsCache[n] || (rowsCache[n] = XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, defval:''}));

  // hoja por defecto: se prefiere una llamada "UBICACION" con encabezados
  // detectables; si no, la primera hoja donde se detecten encabezados.
  const hoja = hojaElegida
    || hojas.find(n=>RX_UBI.test(n) && detectarEncabezado(rowsDe(n)))
    || hojas.find(n=>detectarEncabezado(rowsDe(n)))
    || hojas.find(n=>detectarColumnasDatos(rowsDe(n)))
    || hojas[0];
  const rows = rowsDe(hoja);
  // 1º encabezados con nombre; 2º sin encabezados, columnas por contenido (fila:-1)
  const det = detectarEncabezado(rows) || detectarColumnasDatos(rows) || {fila:0, iCod:-1, iDesc:-1, iStk:-1, iUbi:-1};

  function selCol(id, sel, opcional){
    const f = parseInt($('mapFila').value,10);
    // sin encabezados: como rótulo se muestra la letra de la columna + un valor de ejemplo
    const hdr = f>=0 ? (rows[f]||[])
      : (rows[0]||[]).map((c,j)=>'Col '+String.fromCharCode(65+j)+' · ej: '+String(c==null?'':c).slice(0,16));
    return '<select id="'+id+'">'+(opcional?'<option value="-1"'+(sel<0?' selected':'')+'>— No importar —</option>':'')+
      hdr.map((c,j)=>'<option value="'+j+'"'+(j===sel?' selected':'')+'>'+esc(String(c||('(col '+(j+1)+')')).slice(0,40))+'</option>').join('')+'</select>';
  }

  $('modalBody').innerHTML =
    '<div class="modal-title">Cargar stock — mapeo de columnas</div>'+
    '<div class="hint" style="margin-bottom:10px">'+rows.length+' filas. '+
      (det.fila===-1?'El archivo viene sin encabezados: se reconocieron las columnas por su contenido; revisá y confirmá.'
        :det.iCod>=0?'Se detectaron las columnas automáticamente; revisá y confirmá.':'⚠ No se pudieron detectar las columnas: elegilas a mano.')+
      (esPlanillaDrive(wb)?' <a href="#" id="mapDrive">Volver al modo planilla de ubicaciones</a>':'')+'</div>'+
    (hojas.length>1
      ? '<div class="fld"><label>Hoja del archivo</label><select id="mapHoja">'+
          hojas.map(n=>'<option value="'+esc(n)+'"'+(n===hoja?' selected':'')+'>'+esc(n)+'</option>').join('')+'</select></div>'
      : '')+
    '<div class="fld"><label>Fila de encabezados</label><select id="mapFila">'+
      '<option value="-1"'+(det.fila===-1?' selected':'')+'>Sin encabezados (los datos arrancan en la fila 1)</option>'+
      rows.slice(0,25).map((r,i)=>'<option value="'+i+'"'+(i===det.fila?' selected':'')+'>Fila '+(i+1)+': '+
        esc(r.slice(0,5).map(c=>String(c||'—').slice(0,14)).join(' | ').slice(0,70))+'</option>').join('')+'</select></div>'+
    '<div class="fld"><label>Columna código</label><span id="wrapCod"></span></div>'+
    '<div class="fld"><label>Columna descripción</label><span id="wrapDesc"></span></div>'+
    '<div class="fld"><label>Columna stock</label><span id="wrapStk"></span></div>'+
    '<div class="fld"><label>Columna talle (opcional)</label><span id="wrapTalle"></span>'+
      '<div class="hint" style="margin-top:4px">Si el export viene abierto por talle (una fila por artículo y talle), el stock se agrupa por artículo y la tarjeta muestra el disponible de cada talle. Sin esta columna, se carga solo el total como siempre.</div></div>'+
    '<div class="fld"><label>Columna Id.item (opcional)</label><span id="wrapArt"></span>'+
      '<div class="hint" style="margin-top:4px">El número interno del sistema (p.ej. 104585): sirve para buscar y escanear. Si no viene, se conserva el que ya estaba guardado.</div></div>'+
    '<div class="fld"><label>Columna ubicación (opcional)</label><span id="wrapUbi"></span>'+
      '<div class="hint" style="margin-top:4px">Si se importa, solo se aplica a artículos que todavía no tienen ninguna ubicación asignada en la app. Crea las estanterías/módulos que falten.</div></div>'+
    '<div id="mapPreview"></div>'+
    '<div class="modal-footer">'+
      '<button class="btn btn-outline" id="mapCancelar">Cancelar</button>'+
      '<button class="btn btn-primary" id="mapConfirmar">Sincronizar</button></div>';
  $('modalOverlay').classList.add('show');

  const selHoja = $('mapHoja');
  if(selHoja) selHoja.addEventListener('change', ()=> abrirModalMapeo(wb, selHoja.value));
  if($('mapDrive')) $('mapDrive').addEventListener('click', e=>{ e.preventDefault(); abrirModalDrive(wb); });

  function refrescarSelects(iCod,iDesc,iStk,iUbi,iArt,iTalle){
    $('wrapCod').innerHTML  = selCol('mapCod',  iCod);
    $('wrapDesc').innerHTML = selCol('mapDesc', iDesc);
    $('wrapStk').innerHTML  = selCol('mapStk',  iStk);
    $('wrapTalle').innerHTML= selCol('mapTalle', iTalle!=null?iTalle:-1, true);
    $('wrapArt').innerHTML  = selCol('mapArt',  iArt!=null?iArt:-1, true);
    $('wrapUbi').innerHTML  = selCol('mapUbi',  iUbi, true);
    ['mapCod','mapDesc','mapStk','mapTalle','mapArt','mapUbi'].forEach(id=> $(id).addEventListener('change', preview));
    preview();
  }

  function parsearConMapeo(){
    const f = parseInt($('mapFila').value,10);   // -1 = sin encabezados: los datos arrancan en la fila 0
    const iCod=parseInt($('mapCod').value,10), iDesc=parseInt($('mapDesc').value,10),
          iStk=parseInt($('mapStk').value,10), iUbi=parseInt($('mapUbi').value,10),
          iArt=parseInt(($('mapArt')||{value:'-1'}).value,10),
          iTalle=parseInt(($('mapTalle')||{value:'-1'}).value,10);
    const porCodigo = {};
    let filasLeidas = 0;
    for(let i=f+1; i<rows.length; i++){
      const r = rows[i]||[];
      const codigo = String(r[iCod]===0?'0':(r[iCod]||'')).trim();
      if(!codigo) continue;
      const stock = parseFloat(String(r[iStk]).replace(',','.'));
      const desc = String(r[iDesc]||'').trim();
      filasLeidas++;
      // agrupar por código (si el reporte viene abierto por talle, se suma)
      if(!porCodigo[codigo]) porCodigo[codigo] = {codigo, descripcion:desc, stock:0, ubis:[]};
      if(!porCodigo[codigo].descripcion && desc) porCodigo[codigo].descripcion = desc;
      porCodigo[codigo].stock += isNaN(stock)?0:stock;
      // con columna talle mapeada, además del total se guarda el desglose
      if(iTalle>=0){
        const tl = nrmTalle(r[iTalle]);
        if(tl){
          const tt = porCodigo[codigo].talles || (porCodigo[codigo].talles = {});
          tt[tl] = (tt[tl]||0) + (isNaN(stock)?0:stock);
        }
      }
      if(iArt>=0 && !porCodigo[codigo].articulo){
        const av=String(r[iArt]==null?'':r[iArt]).trim(); if(av) porCodigo[codigo].articulo=av;
      }
      if(iUbi>=0){
        for(const u of parseUbicacionTexto(r[iUbi])){
          if(!porCodigo[codigo].ubis.some(x=>x.est===u.est && x.mod===u.mod)) porCodigo[codigo].ubis.push(u);
        }
      }
    }

    refrescarSelects(Math.max(d2.iCod,0), Math.max(d2.iDesc,0), Math.max(d2.iStk,0), d2.iUbi!=null?d2.iUbi:-1, d2.iArt!=null?d2.iArt:-1, d2.iTalle!=null?d2.iTalle:-1);
  });
  refrescarSelects(Math.max(det.iCod,0), Math.max(det.iDesc,0), Math.max(det.iStk,0), det.iUbi!=null?det.iUbi:-1, det.iArt!=null?det.iArt:-1, det.iTalle!=null?det.iTalle:-1);

async function sincronizarStock(lista){
  // leer artículos y estanterías actuales JUSTO antes, para preservar ubicaciones.
  // ⚠ Si esta lectura falla NO se puede seguir: continuar con {} haría que toda
  // la sucursal parezca nueva y se pisarían TODAS las ubicaciones (le pasó a
  // Diagonal el 26/08/2026 con una lectura que falló en silencio).
  let prev, ests;
  try{
    prev = await fetchJSON(sucPath()+'/articulos.json') || {};
    ests = await fetchJSON(sucPath()+'/estanterias.json') || {};
  }catch(e){
    cerrarModal();
    toast('⚠ No se pudo leer el estado actual de la sucursal. NO se cargó nada: revisá la conexión y probá de nuevo.');
    return;
  }
  const now = Date.now();
  const out = {};
  const nuevos = [], eliminados = [];
  let actualizados = 0;

  for(const art of lista){
    const key = fbKey(art.codigo);
    const p = prev[key];
    // si el Excel trae la descripción vacía o basura (= el mismo código),
    // se conserva la descripción buena que ya estaba guardada
    const descExcel = (art.descripcion && art.descripcion !== art.codigo) ? art.descripcion : '';
    const rec = {
      codigo: art.codigo,
      descripcion: descExcel || (p ? p.descripcion : ''),
      stock: art.stock,
      ultimaCarga: now,
      fechaAlta: p && p.fechaAlta ? p.fechaAlta : now,
    };
    if(p && p.ubicaciones) rec.ubicaciones = p.ubicaciones;
    // desglose por talle: solo si ESTA carga vino abierta por talle (una carga
    // sin talle lo deja sin desglose, para no mostrar talles viejos como vigentes)
    if(art.talles){
      const arr = Object.entries(art.talles).sort((x,y)=>pickingTalleCmp(x[0],y[0])).map(([t,c])=>({t,c}));
      if(arr.length) rec.talles = arr;
    }
    // Id.item del sistema (lo trae la planilla de Drive); se conserva si ya estaba
    if(art.articulo) rec.articulo = String(art.articulo); else if(p && p.articulo) rec.articulo = p.articulo;
    if(p) actualizados++; else nuevos.push(rec);
    out[key] = rec;
  }
  for(const key in prev){ if(!out[key]) eliminados.push(prev[key]); }

  // ubicaciones de la planilla (columna opcional): solo para artículos que
  // no tienen ninguna asignada en la app; crea estanterías/módulos faltantes.
  let estsCambiadas = false, ubicacionesImportadas = 0;
  const asegurarEstanteria = num => {
    for(const id in ests){ const m = String(ests[id].nombre||'').match(/(\d+)/); if(m && +m[1]===num) return id; }
    const id = 'est'+num;
    ests[id] = {nombre:'Estantería '+num, orden:num, modulos:{}};
    estsCambiadas = true; return id;
  };
  const asegurarModulo = (estId, num) => {
    const e = ests[estId]; if(!e.modulos) e.modulos = {};
    for(const id in e.modulos){ const m = String(e.modulos[id].nombre||'').match(/(\d+)/); if(m && +m[1]===num) return id; }
    const id = 'mod'+num;
    e.modulos[id] = {nombre:'Módulo '+num, orden:num};
    estsCambiadas = true; return id;
  };
  for(const art of lista){
    if(!art.ubis || !art.ubis.length) continue;
    const rec = out[fbKey(art.codigo)];
    if(rec.ubicaciones && Object.keys(rec.ubicaciones).length) continue; // no pisar lo ubicado en la app
    rec.ubicaciones = {};
    for(const u of art.ubis){
      const estId = asegurarEstanteria(u.est);
      const modId = u.mod !== null ? asegurarModulo(estId, u.mod) : null;
      rec.ubicaciones[newId('u')] = { estanteriaId:estId, moduloId:modId, por:nombreOperador()+' (planilla)', ts:now };
    }
    ubicacionesImportadas++;
  }
  // Red de seguridad: si la carga borra una parte grande de las ubicaciones
  // existentes (artículos que desaparecen del Excel o claves que no matchean),
  // frenar y pedir confirmación con los números en la mano.
  const conUbi = o => Object.values(o).filter(a=>a.ubicaciones && Object.keys(a.ubicaciones).length).length;
  const ubisPrev = conUbi(prev), ubisAhora = conUbi(out);
  const perdidas = ubisPrev - ubisAhora;
  if(perdidas > 0 && perdidas >= Math.max(10, Math.round(ubisPrev*0.3))){
    const seguir = confirm('⚠ ATENCIÓN\n\nHoy hay '+ubisPrev+' artículos con ubicación asignada y después de esta carga quedarían '+ubisAhora+' ('+perdidas+' perderían su lugar).\n\nSi no era la intención, cancelá y revisá el archivo.\n\n¿Continuar igual?');
    if(!seguir){ cerrarModal(); toast('Carga cancelada. No se cambió nada.'); return; }
  }

  if(estsCambiadas) await putJSON(sucPath()+'/estanterias.json', ests);
  DATA.estanterias = ests;

  // una sola escritura grande (PUT del set completo) + meta
  await putJSON(sucPath()+'/articulos.json', out);

  // feedback de artículos que ya no vienen en el Excel → se limpia
  try{
    const fbAll = await fetchJSON(sucPath()+'/feedback.json') || {};
    const huerfanos = Object.keys(fbAll).filter(k=>!out[k]);
    if(huerfanos.length){
      const patchFb = {}; huerfanos.forEach(k=>{ patchFb[k]=null; delete (DATA.feedback||{})[k]; });
      await patchJSON(sucPath()+'/feedback.json', patchFb);
    }
  }catch(e){}
  const sinUbi = Object.values(out).filter(a=>!a.ubicaciones || !Object.keys(a.ubicaciones).length).length;
  await patchJSON(sucPath()+'/meta.json', {
    ultimaCargaStock: now,
    cargadoPor: nombreOperador(),
    totalArticulos: Object.keys(out).length,
    sinUbicar: sinUbi,
    rev: now,
  });

  DATA.articulos = out;
  DATA.meta = {...DATA.meta, ultimaCargaStock:now, cargadoPor:nombreOperador(), totalArticulos:Object.keys(out).length, sinUbicar:sinUbi};
  lastHash='';
  mostrarResumenCarga(nuevos, actualizados, eliminados, ubicacionesImportadas);
  renderVistaActiva(); renderStatusbar();
}

  } else {

    html += ests.map((e,idx)=>{
      const mods = modulosOrdenados(e);

            '<button class="icon-btn" data-down="'+e.id+'" title="Bajar" '+(idx===ests.length-1?'disabled style="opacity:.3"':'')+'>↓</button>'+
            '<button class="icon-btn" data-ren="'+e.id+'" title="Renombrar">✎</button>'+

        '</div>'+

          mods.map(m=>'<span class="mod-chip" data-ver="'+e.id+':'+m.id+'">'+esc(m.nombre)+
            '<span class="n">'+(counts.porMod[e.id+':'+m.id]||0)+'</span>'+
            (manage?'<button class="edit" data-modren="'+e.id+':'+m.id+'" title="Renombrar">✎</button>'+
                    '<button class="edit" data-moddel="'+e.id+':'+m.id+'" title="Eliminar">✕</button>':'')+
            '</span>').join('')+
          (manage?'<button class="ubi-add" data-nuevomod="'+e.id+'">+ Módulo</button>':'')+
          (!mods.length && !manage ? '<span class="hint">Sin módulos.</span>':'')+
        '</div>'+
        '<div class="est-foot">'+
          '<button class="est-tool" data-print="'+e.id+'">🖨 Imprimir listado</button>'+
          (canAssign()?'<button class="est-tool" data-audit="'+e.id+'">📋 Auditar</button>':'')+
          (e.ultimaAuditoria
            ? '<span class="hint">Auditada '+fmtFecha(e.ultimaAuditoria.ts)+' por '+esc(e.ultimaAuditoria.por||'—')+
              (e.ultimaAuditoria.faltantes?' · <b style="color:var(--red)">'+e.ultimaAuditoria.faltantes+' faltante'+(e.ultimaAuditoria.faltantes===1?'':'s')+'</b>':' · sin faltantes')+'</span>'
            : '')+

  cont.querySelectorAll('[data-print]').forEach(b=> b.addEventListener('click', ()=> imprimirEstanteria(b.dataset.print)));
  cont.querySelectorAll('[data-audit]').forEach(b=> b.addEventListener('click', ()=> iniciarAuditoria(b.dataset.audit)));

async function nuevaEstanteria(){
  const nombre = prompt('Nombre de la estantería (ej: "Estantería 3"):');

  const ests = estanteriasOrdenadas();
  const id = newId('e');
  const rec = {nombre:nombre.trim(), orden:(ests.length?Math.max(...ests.map(e=>e.orden||0)):0)+1, modulos:{}};
  try{
    await putJSON(sucPath()+'/estanterias/'+id+'.json', rec);
    DATA.estanterias[id]=rec; lastHash=''; renderEstanterias(); bumpRev();
  }catch(e){ toast('No se pudo crear.'); }
}

async function renombrarEstanteria(id){
  const e = DATA.estanterias[id]; if(!e) return;
  const nombre = prompt('Nuevo nombre:', e.nombre);
  if(!nombre || !nombre.trim() || nombre.trim()===e.nombre) return;
  try{
    await patchJSON(sucPath()+'/estanterias/'+id+'.json', {nombre:nombre.trim()});
    e.nombre=nombre.trim(); lastHash=''; renderEstanterias(); bumpRev();
  }catch(err){ toast('No se pudo renombrar.'); }
}

async function moverEstanteria(id, dir){
  const ests = estanteriasOrdenadas();
  const i = ests.findIndex(e=>e.id===id);
  const j = i+dir;
  if(i<0 || j<0 || j>=ests.length) return;
  // normalizamos orden 1..n y swapeamos
  const patch = {};
  ests.forEach((e,idx)=>{ e.orden=idx+1; });
  const tmp = ests[i].orden; ests[i].orden = ests[j].orden; ests[j].orden = tmp;
  ests.forEach(e=>{ patch[e.id+'/orden'] = e.orden; DATA.estanterias[e.id].orden = e.orden; });
  try{
    await patchJSON(sucPath()+'/estanterias.json', patch);
    lastHash=''; renderEstanterias(); bumpRev();
  }catch(e){ toast('No se pudo reordenar.'); }
}

function articulosAfectados(estId, modId){
  // [artKey, uid] de cada asignación que apunta a esa estantería/módulo
  const afect = [];
  for(const a of articulosLista())
    for(const uid in (a.ubicaciones||{})){
      const u=a.ubicaciones[uid];
      if(u.estanteriaId===estId && (!modId || u.moduloId===modId)) afect.push([a.key, uid]);
    }
  return afect;
}

function eliminarEstanteria(id){
  const e = DATA.estanterias[id]; if(!e) return;
  const afect = articulosAfectados(id, null);
  confirmarModal(
    'Eliminar '+esc(e.nombre),
    afect.length
      ? '<b>Hay '+afect.length+' artículo'+(afect.length===1?'':'s')+' ubicado'+(afect.length===1?'':'s')+' acá.</b><br>'+
        'Si confirmás, se quitan esas asignaciones y los que queden sin ninguna ubicación pasan a <b>SIN UBICAR</b>.'
      : 'La estantería no tiene artículos asignados.',
    async ()=>{
      // un solo PATCH multi-path sobre la sucursal
      const patch = {['estanterias/'+id]: null};
      afect.forEach(([artKey,uid])=>{ patch['articulos/'+artKey+'/ubicaciones/'+uid] = null; });
      try{
        await patchJSON(sucPath()+'.json', patch);
        delete DATA.estanterias[id];
        afect.forEach(([artKey,uid])=>{ const a=DATA.articulos[artKey]; if(a&&a.ubicaciones) delete a.ubicaciones[uid]; });
        lastHash=''; renderEstanterias(); renderStatusbar(); patchMetaContadores();
        toast('Estantería eliminada.');
      }catch(err){ toast('No se pudo eliminar.'); }
    });
}

    (arts.length ? arts.map(a=>artCardHtml(a)).join('') : '<div class="empty">No hay artículos ubicados en este módulo.</div>');

/* ============================================================
   AUDITORÍA DE ESTANTERÍA
   Flujo sin celulares: 🖨 imprime el listado de lo que debería
   haber, el vendedor recorre con papel, y después marca en la PC
   qué está y qué falta. Los faltantes pueden quedar sin ubicación
   (la verdad física manda). Se guarda la última auditoría en la
   estantería.
   ============================================================ */
// (AUDIT se declara arriba, en el bloque de ESTADO)

// Artículos de una estantería agrupados por módulo (en orden)
function articulosPorModulo(estId){
  const e = DATA.estanterias[estId]; if(!e) return [];
  const grupos = modulosOrdenados(e).map(m=>({modId:m.id, nombre:m.nombre, arts:[]}));
  const suelto = {modId:null, nombre:'Sin módulo', arts:[]};
  for(const a of articulosLista()){
    for(const uid in (a.ubicaciones||{})){
      const u = a.ubicaciones[uid];
      if(u.estanteriaId!==estId) continue;
      const g = grupos.find(x=>x.modId===u.moduloId) || suelto;
      if(!g.arts.some(x=>x.key===a.key)) g.arts.push(a);
    }
  }
  if(suelto.arts.length) grupos.push(suelto);
  grupos.forEach(g=> g.arts.sort((x,y)=>(x.codigo||'').localeCompare(y.codigo||'')));
  return grupos.filter(g=>g.arts.length);
}

function imprimirEstanteria(estId){
  const e = DATA.estanterias[estId]; if(!e) return;
  const info = SUCURSAL_BY_SLUG[SUC];
  const grupos = articulosPorModulo(estId);
  const total = grupos.reduce((s,g)=>s+g.arts.length,0);
  $('printArea').innerHTML =
    '<h1>Auditoría de depósito — '+esc(e.nombre)+(depositoDe(e)?' ('+esc(depositoDe(e))+')':'')+'</h1>'+
    '<div class="sub">'+esc(info?info.nombre:SUC)+' · '+fmtFecha(Date.now())+' · '+total+' artículos · Marcar ✓ lo que está / ✗ lo que falta</div>'+
    (grupos.length
      ? grupos.map(g=>'<h2>'+esc(g.nombre)+' ('+g.arts.length+')</h2>'+
          '<table><tr><th class="chk">✓/✗</th><th>Código</th><th>Descripción</th><th>Stock</th></tr>'+
          g.arts.map(a=>'<tr><td class="chk"></td><td>'+esc(a.codigo)+'</td><td>'+esc(a.descripcion||'')+'</td><td>'+esc(a.stock)+'</td></tr>').join('')+
          '</table>').join('')
      : '<p>No hay artículos ubicados en esta estantería.</p>');
  window.print();
}

const audLsKey = ()=> 'ubic_audit_'+SUC;

function iniciarAuditoria(estId){
  const guardada = readLS(audLsKey());
  const marcas = (guardada && guardada.estId===estId && (Date.now()-(guardada.ts||0)) < 86400000)
    ? (guardada.marcas||{}) : {};
  AUDIT = {estId, marcas};
  renderAuditoria();
}

function audGuardar(){
  saveLS(audLsKey(), {estId:AUDIT.estId, marcas:AUDIT.marcas, ts:Date.now()});
}

function renderAuditoria(){
  if(!AUDIT) return;
  const e = DATA.estanterias[AUDIT.estId];
  const cont = $('view-auditoria');
  document.querySelectorAll('.view').forEach(v=> v.classList.remove('active'));
  cont.classList.add('active');
  if(!e){ AUDIT=null; setTab('estanterias'); return; }
  const grupos = articulosPorModulo(AUDIT.estId);
  const total = grupos.reduce((s,g)=>s+g.arts.length,0);
  // limpiar marcas de artículos que ya no están en la estantería
  const validos = new Set(); grupos.forEach(g=>g.arts.forEach(a=>validos.add(a.key)));
  Object.keys(AUDIT.marcas).forEach(k=>{ if(!validos.has(k)) delete AUDIT.marcas[k]; });

  cont.innerHTML =
    '<button class="btn btn-outline btn-sm" id="audVolver">← Salir de la auditoría</button>'+
    '<div class="card-title" style="font-size:17px;margin-top:10px">📋 Auditoría — '+esc(e.nombre)+(depositoDe(e)?' · '+esc(depositoDe(e)):'')+'</div>'+
    '<div class="hint" id="audProgreso" style="margin-bottom:10px"></div>'+
    (total
      ? grupos.map(g=>'<div class="fb-grupo">'+esc(g.nombre)+' · '+g.arts.length+'</div>'+
          g.arts.map(a=>{
            const m = AUDIT.marcas[a.key]||'';
            return '<div class="aud-row'+(m?' '+m:'')+'" data-aud="'+esc(a.key)+'">'+
              '<div class="info"><b>'+esc(a.codigo)+'</b><div class="hint">'+esc((a.descripcion||'').slice(0,60))+' · Stock: '+esc(a.stock)+'</div></div>'+
              '<button class="aud-btn si'+(m==='esta'?' on':'')+'" data-mk="esta">✓ Está</button>'+
              '<button class="aud-btn no'+(m==='falta'?' on':'')+'" data-mk="falta">✕ Falta</button>'+
            '</div>';
          }).join('')).join('')+
        '<button class="btn btn-primary btn-block" id="audTerminar" style="margin-top:14px">Terminar auditoría</button>'
      : '<div class="empty">Esta estantería no tiene artículos ubicados.</div>');

  audProgreso(total);
  $('audVolver').addEventListener('click', ()=>{ AUDIT=null; setTab('estanterias'); });
  const fin = $('audTerminar');
  if(fin) fin.addEventListener('click', ()=> terminarAuditoria(total));
  cont.querySelectorAll('.aud-row').forEach(row=>{
    const key = row.dataset.aud;
    row.querySelectorAll('.aud-btn').forEach(btn=> btn.addEventListener('click', ()=>{
      const mk = btn.dataset.mk;
      AUDIT.marcas[key] = (AUDIT.marcas[key]===mk) ? undefined : mk;
      if(!AUDIT.marcas[key]) delete AUDIT.marcas[key];
      audGuardar();
      // actualizar la fila en el lugar (sin re-render: no salta el scroll)
      const m = AUDIT.marcas[key]||'';
      row.classList.toggle('esta', m==='esta');
      row.classList.toggle('falta', m==='falta');
      row.querySelector('.aud-btn.si').classList.toggle('on', m==='esta');
      row.querySelector('.aud-btn.no').classList.toggle('on', m==='falta');
      audProgreso(total);
    }));
  });
}

function audProgreso(total){
  const marcados = Object.keys(AUDIT.marcas).length;
  const faltan = Object.values(AUDIT.marcas).filter(m=>m==='falta').length;
  const el = $('audProgreso');
  if(el) el.innerHTML = '<b>'+marcados+'</b> de '+total+' revisados · '+
    (faltan?'<b style="color:var(--red)">'+faltan+' faltante'+(faltan===1?'':'s')+'</b>':'sin faltantes')+
    '. Marcá cada artículo según el recorrido (podés imprimir el listado desde Estanterías).';
}

function terminarAuditoria(total){
  const e = DATA.estanterias[AUDIT.estId];
  const revisados = Object.keys(AUDIT.marcas).length;
  const faltantes = Object.keys(AUDIT.marcas).filter(k=>AUDIT.marcas[k]==='falta');
  const listaHtml = faltantes.length
    ? '<div style="max-height:160px;overflow-y:auto;margin:8px 0;font-size:12px">'+
        faltantes.map(k=>{ const a=DATA.articulos[k]; return '<div>'+esc(a?a.codigo:k)+' — '+esc(a?(a.descripcion||''):'')+'</div>'; }).join('')+'</div>'
    : '';
  $('modalBody').innerHTML =
    '<div class="modal-title">Terminar auditoría — '+esc(e.nombre)+'</div>'+
    '<div style="font-size:14px;line-height:1.5"><b>'+revisados+'</b> de '+total+' revisados · <b>'+faltantes.length+'</b> faltante'+(faltantes.length===1?'':'s')+'.</div>'+
    listaHtml+
    (faltantes.length
      ? '<label style="display:flex;gap:8px;align-items:flex-start;font-size:13px;margin-top:8px;cursor:pointer">'+
        '<input type="checkbox" id="audQuitar" checked style="margin-top:2px;accent-color:var(--red)">'+
        'Quitar la ubicación de los faltantes en esta estantería (los que queden sin ninguna pasan a SIN UBICAR)</label>'
      : '')+
    '<div class="modal-footer">'+
      '<button class="btn btn-outline" id="audNo">Seguir marcando</button>'+
      '<button class="btn btn-primary" id="audSi">Confirmar</button></div>';
  $('modalOverlay').classList.add('show');
  $('audNo').addEventListener('click', cerrarModal);
  $('audSi').addEventListener('click', async ()=>{
    $('audSi').disabled = true;
    const quitar = faltantes.length && $('audQuitar') && $('audQuitar').checked;
    const patch = {};
    if(quitar){
      for(const k of faltantes){
        const a = DATA.articulos[k]; if(!a) continue;
        for(const uid in (a.ubicaciones||{})){
          if(a.ubicaciones[uid].estanteriaId===AUDIT.estId) patch['articulos/'+k+'/ubicaciones/'+uid] = null;
        }
        patch['movimientos/'+newId('mv')] = {artKey:k, codigo:a.codigo, tipo:'quita', ubic:e.nombre+' (auditoría)', por:nombreOperador(), ts:Date.now()};
      }
    }
    const registro = {ts:Date.now(), por:nombreOperador(), revisados, faltantes:faltantes.length};
    patch['estanterias/'+AUDIT.estId+'/ultimaAuditoria'] = registro;
    try{
      await patchJSON(sucPath()+'.json', patch);
      if(quitar) for(const k of faltantes){
        const a = DATA.articulos[k]; if(!a || !a.ubicaciones) continue;
        Object.keys(a.ubicaciones).forEach(uid=>{ if(a.ubicaciones[uid].estanteriaId===AUDIT.estId) delete a.ubicaciones[uid]; });
      }
      e.ultimaAuditoria = registro;
      delLS(audLsKey());
      AUDIT = null; lastHash='';
      cerrarModal(); setTab('estanterias'); renderStatusbar(); patchMetaContadores();
      toast('Auditoría guardada ✓'+(quitar&&faltantes.length?' Se quitaron '+faltantes.length+' ubicaciones.':''));
    }catch(err){ toast('No se pudo guardar la auditoría.'); $('audSi').disabled=false; }
  });
}

/* ============================================================
   ACTIVIDAD — top de consultados (7 días) + ranking de ubicadores
   El Top sirve para decidir qué artículos conviene tener en las
   estanterías de más fácil acceso.
   ============================================================ */
async function renderActividad(){
  const cont = $('view-actividad');
  cont.innerHTML = '<div class="hint">Cargando actividad…</div>';
  let consultas = {};
  try{ consultas = await fetchJSON(sucPath()+'/consultas.json') || {}; }catch(e){}
  // aplanar los días retenidos (7) y agrupar por artículo
  const porArt = {}, porPersona = {}, sinRes = {};
  Object.values(consultas).forEach(dia=> Object.values(dia||{}).forEach(c=>{
    if(!c) return;
    if(c.key){
      if(!porArt[c.key]) porArt[c.key] = {key:c.key, codigo:c.codigo, descripcion:c.descripcion||'', n:0};
      porArt[c.key].n++;
    } else if(!c.n && c.q){
      // búsqueda que no encontró NADA: o el artículo está y no se cargó, o no está en la sucursal
      const k = c.q.toLowerCase();
      if(!sinRes[k]) sinRes[k] = {q:c.q, n:0, quienes:new Set(), ultima:0};
      sinRes[k].n++; sinRes[k].ultima = Math.max(sinRes[k].ultima, c.ts||0);
      if(c.por) sinRes[k].quienes.add(c.por);
    }
    // ranking de quién busca más (toda consulta registrada, mismos 7 días)
    if(c.por && (c.key || c.q)){
      if(!porPersona[c.por]) porPersona[c.por] = {por:c.por, avatar:c.avatar||null, n:0, arts:new Set()};
      porPersona[c.por].n++; porPersona[c.por].arts.add(c.key || ('q:'+(c.q||'').toLowerCase()));
    }
  }));
  const top = Object.values(porArt).sort((a,b)=>b.n-a.n).slice(0,15);
  const buscadores = Object.values(porPersona).sort((a,b)=>b.n-a.n).slice(0,10);
  const nada = Object.values(sinRes).sort((a,b)=> b.n-a.n || b.ultima-a.ultima).slice(0,15);

  // reposición del salón de la semana (nodo aparte, ya viene en DATA por el polling)
  const reps = reposiciones().filter(r=>(r.ts||0) >= Date.now()-7*86400000);
  const repPend = reps.filter(r=>!r.hecho);
  const repHechas = reps.filter(r=>r.hecho);
  const repPorPersona = {};
  repHechas.forEach(r=>{ const q=(r.hecho&&r.hecho.por)||r.por; repPorPersona[q]=(repPorPersona[q]||0)+1; });
  const repRanking = Object.entries(repPorPersona).sort((a,b)=>b[1]-a[1]).slice(0,10);

  // ranking: asignaciones vigentes de los últimos 7 días, por perfil
  // (se excluye lo importado de planillas)
  const lim = Date.now()-7*86400000;
  const rk = {};
  for(const a of articulosLista())
    for(const uid in (a.ubicaciones||{})){
      const u = a.ubicaciones[uid];
      if((u.ts||0)>=lim && u.por && !/\(planilla\)/.test(u.por)) rk[u.por]=(rk[u.por]||0)+1;
    }
  const ranking = Object.entries(rk).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const perfiles = perfilesOrdenados();

  const horasDe = ts=>{
    const h = Math.round((Date.now()-(ts||0))/3600000);
    return h < 1 ? 'recién' : (h < 24 ? 'hace '+h+' h' : 'hace '+Math.round(h/24)+' d');
  };
  cont.innerHTML =
    '<div class="card"><div class="card-title">🚫 Lo que buscan y no aparece — últimos 7 días</div>'+
    (nada.length
      ? nada.map((t,i)=>
          '<div class="act-row"><span class="act-pos">'+(i+1)+'</span><span class="act-n">'+t.n+'×</span>'+
            '<div class="info"><b>'+esc(t.q)+'</b>'+
            '<div class="hint">'+[...t.quienes].slice(0,3).map(esc).join(', ')+
              (t.quienes.size>3?' +'+(t.quienes.size-3):'')+'</div></div>'+
            '<span class="act-ubi hint">'+horasDe(t.ultima)+'</span></div>').join('')+
        '<div class="hint" style="margin-top:8px">Búsquedas que no dieron ningún resultado. Puede ser que el artículo esté en la sucursal y falte cargarlo (subir el stock del día), o que no lo tengamos: si se repite, conviene pedirlo a otra sucursal o avisarle a Compras.</div>'
      : '<div class="empty">Todas las búsquedas encontraron algo 👌</div>')+'</div>'+
    '<div class="card"><div class="card-title">🔄 Reposición del salón — últimos 7 días</div>'+
    (reps.length
      ? '<div class="act-row"><span class="act-n">'+repHechas.length+'</span>'+
          '<div class="info"><b>repuestos</b><div class="hint">artículos que se vendieron de la exhibición y volvieron a su lugar</div></div>'+
          (repPend.length?'<span class="act-ubi" style="color:var(--red)">'+repPend.length+' pendiente'+(repPend.length===1?'':'s')+'</span>':'<span class="act-ubi">al día ✓</span>')+
        '</div>'+
        repPend.map(r=>
          '<div class="act-row"><span class="act-pos">·</span>'+avatarHtml({nombre:r.por, avatar:r.avatar})+
            '<div class="info"><b>'+esc(r.codigo)+'</b><div class="hint">'+esc((r.descripcion||'').slice(0,50))+'</div></div>'+
            '<span class="act-ubi hint">'+esc(r.por)+' · '+horasDe(r.ts)+'</span></div>').join('')+
        (repRanking.length
          ? '<div class="hint" style="margin:8px 0 4px">Quiénes repusieron</div>'+
            repRanking.map(([por,n],i)=>{
              const perfil = perfiles.find(p=>p.nombre===por) || {nombre:por};
              return '<div class="act-row"><span class="act-pos">'+(i+1)+'</span>'+avatarHtml(perfil)+
                '<div class="info"><b>'+esc(por)+'</b></div><span class="act-n">'+n+'</span></div>';
            }).join('')
          : '')
      : '<div class="empty">Nadie usó «🔄 Yo repongo» esta semana.<br><span class="hint">Sale en la tarjeta del artículo, al lado de Comentar.</span></div>')+'</div>'+
    '<div class="card"><div class="card-title">🔎 Más consultados — últimos 7 días</div>'+
    (top.length
      ? top.map((t,i)=>{
          const art = DATA.articulos[t.key];
          const ubis = art ? Object.values(art.ubicaciones||{}).map(u=>nombreUbicacion(u)).join(' · ') : '';
          return '<div class="act-row"><span class="act-pos">'+(i+1)+'</span><span class="act-n">'+t.n+'×</span>'+
            '<div class="info"><b>'+esc(t.codigo)+'</b><div class="hint">'+esc((t.descripcion||'').slice(0,50))+'</div></div>'+
            '<span class="act-ubi">'+(art ? (ubis||'<span style="color:var(--red)">SIN UBICAR</span>') : '<span class="hint">fuera de stock</span>')+'</span></div>';
        }).join('')+
        '<div class="hint" style="margin-top:8px">Si lo más consultado está en estanterías del fondo, conviene moverlo a una de fácil acceso.</div>'
      : '<div class="empty">Sin consultas en los últimos 7 días.</div>')+'</div>'+
    '<div class="card"><div class="card-title">🏆 Ubicadores de la semana</div>'+
    (ranking.length
      ? ranking.map(([por,n],i)=>{
          const perfil = perfiles.find(p=>p.nombre===por);
          return '<div class="act-row"><span class="act-pos">'+(i+1)+'</span>'+avatarHtml(perfil||{nombre:por})+
            '<div class="info"><b>'+esc(por)+'</b></div><span class="act-n">'+n+' ubicado'+(n===1?'':'s')+'</span></div>';
        }).join('')
      : '<div class="empty">Sin ubicaciones asignadas esta semana.</div>')+'</div>'+
    '<div class="card"><div class="card-title">🔎 Buscadores de la semana</div>'+
    (buscadores.length
      ? buscadores.map((b,i)=>{
          const perfil = perfiles.find(p=>p.nombre===b.por) || {nombre:b.por, avatar:b.avatar};
          return '<div class="act-row"><span class="act-pos">'+(i+1)+'</span>'+avatarHtml(perfil)+
            '<div class="info"><b>'+esc(b.por)+'</b><div class="hint">'+b.arts.size+' búsqueda'+(b.arts.size===1?'':'s')+' distinta'+(b.arts.size===1?'':'s')+'</div></div>'+
            '<span class="act-n">'+(b.n===1?'1 vez':b.n+' veces')+'</span></div>';
        }).join('')+
        '<div class="hint" style="margin-top:8px">Cuenta todas las búsquedas hechas en el Buscador en los últimos 7 días (se registran solas, encuentren o no).</div>'
      : '<div class="empty">Sin búsquedas registradas en los últimos 7 días.</div>')+'</div>';
}

      PERFIL_ROLES.map(r=>{

    '</div>'+(esPrimero?'<div class="hint" style="margin-top:4px">El primer perfil siempre es encargado.</div>':'')+'</div>'+
    '<div class="fld"><label>Avatar</label><div class="av-pick" id="pfAvPick"></div>'+
      '<div class="hint" style="margin-top:6px">Elegí un avatar, o dejá el primero para usar las iniciales.</div></div>'+
    '<div class="modal-footer">'+
      '<button class="btn btn-outline" id="pfCancelar">Cancelar</button>'+
      '<button class="btn btn-primary" id="pfGuardar">Guardar</button></div>';
  $('modalOverlay').classList.add('show');

  function pintarAvPick(){
    const nombre = ($('pfNombre').value||'').trim() || (p&&p.nombre) || '?';
    $('pfAvPick').innerHTML =
      '<button type="button" class="av-opt'+(!avatarSel?' sel':'')+'" data-av="" title="Iniciales">'+avatarHtml({nombre})+'</button>'+
      AVATARES.map(a=>'<button type="button" class="av-opt'+(avatarSel===a.id?' sel':'')+'" data-av="'+a.id+'" style="background:'+a.bg+'">'+a.emoji+'</button>').join('');
    $('pfAvPick').querySelectorAll('[data-av]').forEach(b=> b.addEventListener('click', ()=>{ avatarSel = b.dataset.av; pintarAvPick(); }));
  }
  pintarAvPick();
  $('pfNombre').addEventListener('input', ()=>{ if(!avatarSel) pintarAvPick(); });

  $('pfRolRow').querySelectorAll('input').forEach(r=> r.addEventListener('change', ()=>{
    $('pfRolRow').querySelectorAll('label').forEach(l=> l.classList.toggle('sel', l.querySelector('input').checked));
  }));
  $('pfCancelar').addEventListener('click', ()=>{ cerrarModal(); if(esPrimero) mostrarSelectorPerfiles(); });
  $('pfGuardar').addEventListener('click', async ()=>{
    const nombre = ($('pfNombre').value||'').trim();
    if(!nombre){ toast('Falta el nombre.'); return; }
    const rol = esPrimero ? 'encargado' : ($('pfRolRow').querySelector('input:checked')||{}).value || 'vendedor';
    $('pfGuardar').disabled=true;
    try{
      if(perfilId){
        const patch = PERFILES[perfilId] && PERFILES[perfilId].legajo ? {avatar: avatarSel || null} : {nombre, rol, avatar: avatarSel || null};
        await patchJSON(sucPath()+'/perfiles/'+perfilId+'.json', patch);
        PERFILES[perfilId] = {...PERFILES[perfilId], ...patch};
        if(PERFIL && PERFIL.id===perfilId){ PERFIL={id:perfilId, ...PERFILES[perfilId]}; montarApp(); }
      } else {
        const id = newId('p');
        const lista = perfilesOrdenados();
        const rec = {nombre, rol, orden:(lista.length?Math.max(...lista.map(x=>x.orden||0)):0)+1, manual:true};
        if(avatarSel) rec.avatar = avatarSel;
        await putJSON(sucPath()+'/perfiles/'+id+'.json', rec);
        PERFILES[id]=rec;
      }
      cerrarModal();
      if(esPrimero){ mostrarSelectorPerfiles(); }
      else if(tabActiva==='perfiles') renderPanelPerfiles();
      toast('Perfil guardado ✓');
    }catch(e){ toast('No se pudo guardar.'); $('pfGuardar').disabled=false; }
  });
}

function eliminarPerfil(id){
  const p = PERFILES[id]; if(!p) return;
  const encargados = perfilesOrdenados().filter(x=>x.rol==='encargado');
  if(p.rol==='encargado' && encargados.length<=1){
    toast('No se puede eliminar: es el único perfil encargado de la sucursal.');
    return;
  }
  confirmarModal('Eliminar perfil', '¿Eliminar el perfil de <b>'+esc(p.nombre)+'</b>?<br><span class="hint">El historial no se pierde: las cargas y asignaciones guardan el nombre.</span>', async ()=>{
    try{
      await delJSON(sucPath()+'/perfiles/'+id+'.json');
      delete PERFILES[id];
      if(PERFIL && PERFIL.id===id){ cambiarPerfil(); return; }
      renderPanelPerfiles();
      toast('Perfil eliminado.');
    }catch(e){ toast('No se pudo eliminar.'); }
  });
}

/* ============================================================
   MODO GLOBAL (admin / supervisión)
   ============================================================ */
function montarGlobal(){
  $('app').style.display='block';
  $('globalBar').style.display='flex';
  $('globalModo').textContent = MODE==='admin' ? 'Edición total' : 'Solo consulta';
  $('hdrSucursal').textContent = MODE==='admin' ? 'Administración' : 'Supervisión';
  const sel = $('selSucursal');
  sel.innerHTML = '<option value="">— Resumen general —</option>'+
    SUCURSALES.map(s=>'<option value="'+s.slug+'">'+s.nombre+'</option>').join('');
  sel.addEventListener('change', ()=>{
    detenerPolling();
    SUC = sel.value || null;
    DATA = {articulos:{}, estanterias:{}, meta:{}}; lastHash='';
    renderTabs();
    $('btnPerfiles').style.display = (SUC && canManage()) ? 'inline-flex' : 'none';
    if(SUC){
      $('hdrSucursal').textContent = SUCURSAL_BY_SLUG[SUC].nombre + (MODE==='admin'?' · Admin':' · Consulta');
      setTab('buscar');
      iniciarPolling();
    } else {
      $('hdrSucursal').textContent = MODE==='admin' ? 'Administración' : 'Supervisión';
      setTab('resumen');
      renderStatusbar();
    }
  });
  renderTabs();
  setTab('resumen');
}

async function renderResumenGlobal(){
  const cont = $('view-resumen');
  cont.innerHTML = '<div class="hint">Cargando resumen de sucursales…</div>';
  let slugs = [];
  try{
    const shallow = await fetchJSON(FB+'/sucursales.json?shallow=true') || {};
    slugs = SUCURSALES.map(s=>s.slug).filter(sl=>shallow[sl]);
    hideErr();
  }catch(e){
    cont.innerHTML = '';
    showErr('No se pudo conectar a la base de Ubicaciones. Verificá que la base "ubicaciones-mateu" exista y esté accesible.');
    return;
  }
  if(!slugs.length){
    cont.innerHTML = '<div class="empty">Ninguna sucursal empezó a usar el módulo todavía.</div>';
    return;
  }
  const metas = await Promise.all(slugs.map(sl=> fetchJSON(FB+'/sucursales/'+sl+'/meta.json').catch(()=>null)));
  const filas = slugs.map((sl,i)=>{
    const m = metas[i]||{};
    const est = m.ultimaCargaStock ? estadoCarga(m.ultimaCargaStock) : 'rojo';
    return '<tr class="click" data-suc="'+sl+'">'+
      '<td><b>'+esc(SUCURSAL_BY_SLUG[sl].nombre)+'</b></td>'+
      '<td><span class="semaforo '+est+'"></span>'+(m.ultimaCargaStock?fmtFecha(m.ultimaCargaStock):'Nunca')+
        (m.cargadoPor?' <span class="hint">('+esc(m.cargadoPor)+')</span>':'')+'</td>'+
      '<td class="r">'+(m.totalArticulos!=null?m.totalArticulos:'—')+'</td>'+
      '<td class="r">'+(m.sinUbicar!=null?(m.sinUbicar>0?'<span class="pill-rojo">'+m.sinUbicar+'</span>':'<span class="pill-verde">0</span>'):'—')+'</td>'+
      '<td>→</td></tr>';
  }).join('');
  cont.innerHTML =
    '<div class="card"><div class="card-title">Estado por sucursal</div>'+
    '<div class="table-wrap"><table class="resumen">'+
    '<thead><tr><th>Sucursal</th><th>Última carga</th><th style="text-align:right">Artículos</th><th style="text-align:right">Sin ubicar</th><th></th></tr></thead>'+
    '<tbody>'+filas+'</tbody></table></div>'+
    '<div class="hint" style="margin-top:8px">Semáforo: <span class="semaforo verde"></span>&lt;24 h hábiles · <span class="semaforo amarillo"></span>24–48 h · <span class="semaforo rojo"></span>+48 h o nunca. Tocá una sucursal para entrar.</div>'+
    '</div>';
  cont.querySelectorAll('tr.click').forEach(tr=> tr.addEventListener('click', ()=>{
    $('selSucursal').value = tr.dataset.suc;
    $('selSucursal').dispatchEvent(new Event('change'));
  }));
}

/* ============================================================
   MODAL DE CONFIRMACIÓN GENÉRICO
   ============================================================ */
function confirmarModal(titulo, htmlMsg, onOk){
  $('modalBody').innerHTML =
    '<div class="modal-title">'+titulo+'</div>'+
    '<div style="font-size:14px;line-height:1.5">'+htmlMsg+'</div>'+
    '<div class="modal-footer">'+
      '<button class="btn btn-outline" id="cfNo">Cancelar</button>'+
      '<button class="btn btn-primary" id="cfSi">Confirmar</button></div>';
  $('modalOverlay').classList.add('show');
  $('cfNo').addEventListener('click', cerrarModal);
  $('cfSi').addEventListener('click', async ()=>{ $('cfSi').disabled=true; await onOk(); cerrarModal(); });
}
</script>
