<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Academia de Ventas — Mateu Sports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700;1,800&family=Barlow+Condensed:ital,wght@0,600;0,700;1,700;1,800&display=swap" rel="stylesheet">
<script src="../shared/iconos.js" defer></script>
<!-- Header unificado del shell: barra Menú + logo + calendario retail + drawer -->
<script src="../shared/header.js" defer></script>
<script src="../shared/tutorial.js" defer></script>
<style>
  :root{
    --accent:#e4002b; --accent-dk:#b30022; --azul:#0057b8; --tinta:#1a1c1f;
    --fondo:#f6f7f8; --gris:#6b7280; --gris2:#9aa0a8; --borde:#e2e4e8; --verde:#178a50;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--fondo); color:var(--tinta);
    font-family:'Barlow','Helvetica Neue',sans-serif; font-size:15px; }
  a{ color:var(--accent); }
  a:hover{ color:var(--accent-dk); }
  button{ font-family:'Barlow',sans-serif; }
  button:focus,input:focus,select:focus,textarea:focus{ outline:none; }

  .franja{ height:4px; background:linear-gradient(90deg,var(--accent) 0%,var(--accent) 58%,#fff 58%,#fff 61%,var(--azul) 61%,var(--azul) 100%); }
  .topbar{ background:#fff; border-bottom:1px solid var(--borde); padding:0 32px; height:64px;
    display:flex; align-items:center; gap:28px; position:sticky; top:var(--msh-h,67px); z-index:20; }
  .topbar img.logo{ height:30px; display:block; }
  .nav{ display:flex; align-items:center; gap:24px; height:100%; }
  .nav .tab{ color:var(--gris); text-decoration:none; font-size:15px; font-weight:600; height:100%;
    display:flex; align-items:center; gap:7px; border-bottom:3px solid transparent; cursor:pointer; user-select:none; white-space:nowrap; }
  .nav .tab:hover{ color:var(--tinta); }
  .nav .tab.act{ color:var(--tinta); font-weight:700; border-bottom-color:var(--accent); }
  .nav .pill{ min-width:20px; height:20px; border-radius:10px; background:var(--accent); color:#fff; font-size:12px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; padding:0 6px; }
  .who{ margin-left:auto; display:flex; align-items:center; gap:12px; }
  .who .ava{ width:38px; height:38px; border-radius:50%; background:var(--tinta); color:#fff; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; flex-shrink:0; cursor:default; }
  .who .nom{ font-size:14px; font-weight:700; line-height:1.25; }
  .who .rol{ font-size:12px; color:var(--gris); }
  .who a.salir{ display:flex; align-items:center; padding:8px; border-radius:8px; text-decoration:none; margin-left:2px; }
  .who a.salir:hover{ background:rgba(0,0,0,.05); }
  .who .cambiar{ font-size:11.5px; }

  .wrap{ max-width:1360px; margin:0 auto; padding:36px 32px 64px; }
  .wrap.angosto{ max-width:860px; }
  .wrap.medio{ max-width:1100px; }
  .titulo-xl{ font-family:'Barlow Condensed',sans-serif; font-style:italic; font-weight:800; font-size:44px; line-height:1; text-transform:uppercase; }
  .bajada{ margin-top:10px; font-size:16px; color:var(--gris); }
  .sec-t{ font-size:14px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--tinta); }
  .muted{ color:var(--gris); }
  .card-b{ background:#fff; border:1px solid var(--borde); border-radius:6px; padding:22px 24px; }
  .vacio{ border:1.5px dashed var(--borde); border-radius:6px; padding:36px 22px; text-align:center; color:var(--gris); background:#fff; }
  .err{ background:#fde7eb; border:1px solid #f5c6cf; color:#8a1f11; border-radius:6px; padding:12px 16px; margin-bottom:16px; }

  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; border:none; border-radius:3px; cursor:pointer;
    font-size:13px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; padding:12px 22px; background:#eef0f3; color:var(--tinta); text-decoration:none; }
  .btn:hover{ filter:brightness(.96); }
  .btn.pri{ background:var(--accent); color:#fff; }
  .btn.pri:hover{ background:var(--accent-dk); filter:none; }
  .btn.oscuro{ background:var(--tinta); color:#fff; }
  .btn.linea{ background:transparent; border:1px solid var(--tinta); color:var(--tinta); }
  .btn.mini{ padding:7px 12px; font-size:11.5px; letter-spacing:1px; }
  .btn.peligro{ background:#fde7eb; color:var(--accent); }
  .btn[disabled]{ opacity:.5; cursor:default; }

  input[type=text],input[type=number],input[type=date],input[type=url],select,textarea{
    width:100%; background:#fff; border:1px solid var(--borde); border-radius:4px; color:var(--tinta);
    padding:11px 13px; font-size:15px; font-family:'Barlow',sans-serif; }
  input:focus,select:focus,textarea:focus{ border-color:#6ea8d8; }
  textarea{ resize:vertical; min-height:80px; }
  label.fl{ display:block; font-size:12px; font-weight:700; color:var(--gris); text-transform:uppercase; letter-spacing:1.2px; margin:0 0 6px; }
  .fila{ display:flex; gap:14px; flex-wrap:wrap; }
  .fila>div{ flex:1; min-width:170px; }

  .chip{ display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700; letter-spacing:1px; text-transform:uppercase; padding:4px 10px; border-radius:3px; }
  .chip.rojo{ background:#fde7eb; color:var(--accent-dk); }
  .chip.azulc{ background:#e7effa; color:var(--azul); }
  .chip.ambar{ background:#fdf3d7; color:#8a6d00; }
  .chip.verde{ background:#e2f4ea; color:var(--verde); }
  .fchip{ padding:9px 16px; border-radius:999px; font-size:14px; font-weight:700; cursor:pointer; background:#fff; color:var(--tinta); border:1px solid #d8dbe0; letter-spacing:.3px; }
  .fchip.act{ background:var(--tinta); color:#fff; border-color:var(--tinta); }

  /* ---- catálogo ---- */
  .prog-tabs{ display:flex; gap:16px; margin-top:14px; flex-wrap:wrap; }
  .prog-tab{ display:flex; align-items:center; justify-content:space-between; gap:14px; width:252px; min-height:76px; padding:14px 18px;
    color:#fff; border:3px solid transparent; border-radius:6px; cursor:pointer; text-align:left; font-size:16px; font-weight:700; text-transform:uppercase; line-height:1.2; letter-spacing:.5px; }
  .prog-tab.act{ border-color:var(--tinta); }
  .carrusel{ display:flex; gap:18px; overflow-x:auto; margin-top:26px; padding-bottom:14px; scroll-snap-type:x proximity; }
  .ccard{ position:relative; flex-shrink:0; width:258px; height:460px; border-radius:6px; overflow:hidden; background:#e2e4e8; scroll-snap-align:start; cursor:pointer; }
  .ccard:hover{ box-shadow:0 8px 24px rgba(0,0,0,.22); }
  .ccard img.cover,.icard img.cover,.hcard img.cover{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  .ccard .grad,.icard .grad,.hcard .grad{ position:absolute; inset:0; pointer-events:none; }
  .ccard .check,.icard .check,.hcard .check{ position:absolute; top:14px; left:14px; width:38px; height:38px; border-radius:50%; background:rgba(20,20,20,.45); display:flex; align-items:center; justify-content:center; color:#fff; font-size:12.5px; font-weight:700; }
  .ccard .check.ok,.icard .check.ok,.hcard .check.ok{ background:#fff; color:var(--tinta); }
  .ccard .pie,.icard .pie,.hcard .pie{ position:absolute; left:16px; right:16px; bottom:18px; display:flex; flex-direction:column; align-items:flex-start; gap:10px; }
  .ccard .dur,.icard .dur,.hcard .dur{ display:inline-flex; align-items:center; gap:6px; background:rgba(20,20,20,.55); color:#fff; font-size:13px; font-weight:600; padding:4px 10px; border-radius:4px; }
  .ccard .tit,.icard .tit,.hcard .tit{ color:#fff; font-size:19px; font-weight:800; text-transform:uppercase; line-height:1.15; text-shadow:0 1px 3px rgba(0,0,0,.25); }
  .ccard.chica{ height:420px; cursor:default; }
  .ccard.chica:hover{ box-shadow:none; }
  .ccard .editar{ position:absolute; top:14px; right:14px; z-index:2; }

  /* ---- player de curso ---- */
  .hero{ background:#17181a; color:#fff; }
  .hero-in{ max-width:1240px; margin:0 auto; padding:30px 32px 26px; }
  .hero a.volver{ color:var(--gris2); text-decoration:none; font-size:14px; font-weight:600; }
  .hero a.volver:hover{ color:#fff; }
  .hero .h-tit{ font-family:'Barlow Condensed',sans-serif; font-style:italic; font-weight:800; font-size:42px; line-height:1; text-transform:uppercase; }
  .hero .h-sub{ margin-top:10px; font-size:15px; color:#cfd3d9; }
  .player{ max-width:1240px; margin:0 auto; padding:32px; display:grid; grid-template-columns:320px 1fr; gap:28px; align-items:start; }
  @media (max-width:900px){ .player{ grid-template-columns:1fr; } .indice{ position:static !important; } }
  .indice{ background:#fff; border:1px solid var(--borde); border-radius:6px; overflow:hidden; position:sticky; top:calc(var(--msh-h,67px) + 88px); }
  .indice .cab{ padding:16px 20px; border-bottom:1px solid var(--borde); font-size:13px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--gris); }
  .lec{ display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:13px 20px; border:none; border-left:4px solid transparent; background:#fff; cursor:pointer; }
  .lec:hover{ background:#f2f3f5; }
  .lec.act{ background:#f2f3f5; border-left-color:var(--accent); }
  .lec .n{ width:26px; height:26px; border-radius:50%; background:#e9eaee; color:var(--gris); display:inline-flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:700; flex-shrink:0; }
  .lec.act .n{ background:var(--tinta); color:#fff; }
  .lec.ok .n{ background:var(--verde); color:#fff; }
  .lec .t{ font-size:14.5px; font-weight:600; color:var(--tinta); line-height:1.3; }
  .lec.act .t{ font-weight:700; }
  .lec-tit{ font-family:'Barlow Condensed',sans-serif; font-style:italic; font-weight:800; font-size:34px; line-height:1; text-transform:uppercase; }
  .seccion{ border:1px solid var(--borde); border-left:4px solid #d8dbe0; border-radius:6px; padding:20px 24px; background:#fff; }
  .seccion .st{ font-size:13px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--gris); }
  .seccion .sx{ margin-top:10px; font-size:15.5px; color:#33383f; line-height:1.6; white-space:pre-line; }
  .seccion.dato{ background:#e7effa; border-color:#c9dcf2; border-left-color:var(--azul); } .seccion.dato .st{ color:var(--azul); }
  .seccion.evitar{ background:#fde7eb; border-color:#f5c6cf; border-left-color:var(--accent); } .seccion.evitar .st{ color:var(--accent-dk); }
  .seccion.tip{ background:#e2f4ea; border-color:#c3e5d2; border-left-color:var(--verde); } .seccion.tip .st{ color:var(--verde); }
  .seccion.ejemplo{ background:#f2f3f5; border-color:var(--borde); border-left-color:var(--tinta); } .seccion.ejemplo .st{ color:var(--tinta); }
  .video-marco{ position:relative; padding-top:56.25%; border-radius:6px; overflow:hidden; background:#000; }
  .video-marco iframe{ position:absolute; inset:0; width:100%; height:100%; border:none; }
  .preg-card{ background:#fff; border:1px solid var(--borde); border-radius:6px; padding:20px 24px; }
  .preg-card .q{ font-size:16px; font-weight:700; line-height:1.4; }
  .op-btn{ display:block; width:100%; text-align:left; padding:12px 14px; border-radius:4px; border:1.5px solid #d8dbe0; background:#fff; color:var(--tinta); font-size:15px; font-weight:600; cursor:pointer; }
  .op-btn.sel{ background:#f2f3f5; border-color:var(--tinta); }
  .op-btn.bien{ background:#e2f4ea; border-color:var(--verde); color:var(--verde); }
  .op-btn.mal{ background:#fde7eb; border-color:var(--accent); color:var(--accent-dk); }
  .banner{ border-radius:6px; padding:22px 26px; color:#fff; }
  .banner.verde{ background:var(--verde); }
  .banner.rojo{ background:var(--accent-dk); }

  /* ---- historial ---- */
  .hcard{ position:relative; flex-shrink:0; width:258px; height:420px; border-radius:6px; overflow:hidden; background:#e2e4e8; }
  .hcert{ display:flex; flex-direction:column; align-items:center; padding:28px 20px; }
  .hcert .ct{ font-family:'Barlow Condensed',sans-serif; font-style:italic; font-weight:800; font-size:34px; color:#fff; letter-spacing:1px; }
  .hlock{ background:#eceef1; border:1px dashed #c6cad1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:28px 24px; gap:16px; text-align:center; }

  /* ---- novedades ---- */
  .nov{ background:#fff; border:1px solid var(--borde); border-radius:6px; padding:20px 22px; display:flex; gap:16px; cursor:pointer; }
  .nov:hover{ box-shadow:0 4px 16px rgba(0,0,0,.08); }
  .nov.nueva{ border-color:#efb4bf; }
  .nov.leida{ opacity:.72; }
  .nov .ava{ width:44px; height:44px; border-radius:50%; color:#fff; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700; flex-shrink:0; }

  /* ---- equipo / ranking ---- */
  .nivel-card{ background:#fff; border:1px solid var(--borde); border-top:4px solid var(--tinta); border-radius:6px; padding:16px; display:flex; flex-direction:column; gap:6px; }
  .tabla{ background:#fff; border:1px solid var(--borde); border-radius:6px; overflow:hidden; }
  .trow{ display:grid; gap:16px; padding:15px 22px; border-bottom:1px solid #eef0f3; align-items:center; }
  .trow:hover{ background:#fafbfc; }
  .trow.cab{ padding:14px 22px; background:#fafbfc; border-bottom:1px solid var(--borde); font-size:12px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--gris); }
  .trow.cab:hover{ background:#fafbfc; }
  .pava{ border-radius:50%; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; flex-shrink:0; }
  .barra{ height:6px; border-radius:3px; background:#e9eaee; overflow:hidden; }
  .barra>div{ height:100%; background:var(--accent); }
  .barra.v>div{ background:var(--verde); }
  .podio{ background:#fff; border:1px solid var(--borde); border-top:5px solid #c9a800; border-radius:6px; padding:24px; display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; }
  .toggle{ display:flex; border:1px solid #d8dbe0; border-radius:4px; overflow:hidden; }
  .toggle button{ padding:11px 20px; font-size:13px; font-weight:700; letter-spacing:1px; text-transform:uppercase; cursor:pointer; border:none; background:#fff; color:var(--tinta); }
  .toggle button.act{ background:var(--tinta); color:#fff; }
  .toggle button+button{ border-left:1px solid #d8dbe0; }

  /* ---- inicio ---- */
  .ini-grid{ display:grid; grid-template-columns:1.1fr 1.1fr .9fr; gap:28px; margin-top:32px; align-items:start; }
  @media (max-width:1000px){ .ini-grid{ grid-template-columns:1fr; } }
  .badge-hex{ width:72px; text-align:center; cursor:pointer; }
  .badge-hex svg{ filter:drop-shadow(0 3px 5px rgba(0,0,0,.18)); }
  .icard{ position:relative; flex-shrink:0; width:214px; height:310px; border-radius:6px; overflow:hidden; background:#e2e4e8; cursor:pointer; display:block; }
  .icard:hover{ box-shadow:0 6px 20px rgba(0,0,0,.18); }

  /* ---- modal / certificado ---- */
  .velo{ position:fixed; inset:0; background:rgba(10,14,20,.55); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .modal{ background:#fff; border-radius:8px; max-width:560px; width:100%; max-height:88vh; overflow:auto; padding:26px; }
  .modal h2{ margin:0 0 6px; font-size:21px; }
  #certVista{ position:fixed; inset:0; background:rgba(10,14,20,.68); z-index:60; display:flex; align-items:center; justify-content:center; padding:20px; overflow:auto; }
  /* Certificado: diseño del prototipo (Certificado.dc.html) */
  .cert{ width:1160px; max-width:100%; background:#fff; box-shadow:0 10px 40px rgba(0,0,0,.12); position:relative; overflow:hidden; }
  .cert .c-banda{ height:10px; background:var(--accent); }
  .cert .c-banda.azul{ background:var(--azul); }
  .cert .c-deco{ position:absolute; right:-120px; top:-120px; width:340px; height:340px; transform:rotate(-8deg); pointer-events:none; }
  .cert .c-in{ position:relative; display:flex; flex-direction:column; align-items:center; text-align:center; padding:64px 80px 56px; }
  .cert .c-logo{ height:58px; display:block; }
  .cert .c-tit{ margin-top:40px; font-family:'Barlow Condensed',sans-serif; font-style:italic; font-weight:800; font-size:68px; line-height:1; color:var(--tinta); letter-spacing:1px; }
  .cert .c-sub{ margin-top:10px; font-size:20px; font-weight:700; letter-spacing:7px; color:var(--gris); }
  .cert .c-otorga{ margin-top:48px; font-size:17px; color:var(--gris); }
  .cert .c-quien{ margin-top:10px; font-size:52px; font-weight:700; color:var(--tinta); line-height:1.1; }
  .cert .c-linea{ margin-top:8px; width:340px; max-width:80%; height:3px; background:var(--accent); }
  .cert .c-por{ margin-top:34px; font-size:17px; color:#4b5158; max-width:640px; line-height:1.5; }
  .cert .c-prog{ margin-top:22px; display:flex; align-items:center; gap:18px; flex-wrap:wrap; justify-content:center; }
  .cert .c-prog .nom{ font-family:'Barlow Condensed',sans-serif; font-style:italic; font-weight:800; font-size:46px; letter-spacing:1px; text-transform:uppercase; line-height:1.05; }
  .cert .c-firmas{ margin-top:60px; display:grid; grid-template-columns:1fr 1fr 1fr; gap:48px; width:100%; align-items:end; }
  .cert .c-firma{ display:flex; flex-direction:column; gap:8px; align-items:center; }
  .cert .c-firma .v{ font-size:22px; font-weight:700; color:var(--tinta); }
  .cert .c-firma .l{ width:100%; height:1.5px; background:#c6cad1; }
  .cert .c-firma .k{ font-size:12.5px; font-weight:700; letter-spacing:2px; color:var(--gris); }
  .cert .c-pw{ margin-top:44px; display:flex; align-items:center; gap:12px; }
  @media (max-width:760px){ .cert .c-in{ padding:40px 22px 36px; } .cert .c-tit{ font-size:46px; } .cert .c-quien{ font-size:34px; } .cert .c-firmas{ grid-template-columns:1fr; gap:22px; } .cert .c-prog .nom{ font-size:30px; } }
  @media print{
    @page{ size:landscape; margin:10mm; }
    body *{ visibility:hidden; }
    #certVista, #certVista *{ visibility:visible; }
    #certVista{ position:absolute; inset:0; background:#fff; padding:0; display:block; }
    .cert{ width:100%; box-shadow:none; }
    .no-print{ display:none !important; }
  }
  .tabla{ overflow-x:auto; }
  .tabla .trow{ min-width:720px; }
  .trow.clic{ cursor:pointer; }
  .badge-comp svg{ filter:drop-shadow(0 3px 6px rgba(201,168,0,.45)); }
  @media (max-width:900px){
    .indice{ display:flex; overflow-x:auto; position:static !important; padding:6px; gap:4px; }
    .indice .cab{ display:none; }
    .lec{ flex:0 0 auto; width:auto; border-left:none; border-bottom:3px solid transparent; padding:9px 12px; border-radius:4px; }
    .lec.act{ border-bottom-color:var(--accent); }
    .lec .t{ white-space:nowrap; font-size:13.5px; }
  }
  @media (max-width:820px){
    .landing-grid{ grid-template-columns:1fr !important; }
    .topbar{ padding:0 14px; gap:14px; overflow-x:auto; }
    .wrap{ padding:24px 14px 60px; }
    .who .nom,.who .rol,.who .cambiar{ display:none; }
    .titulo-xl{ font-size:34px; }
  }
</style>
</head>
<body>
<div class="franja"></div>
<div class="topbar">
  <div class="nav" id="nav"></div>
  <div class="who">
    <div class="ava" id="whoAva" title="">·</div>
    <div><div class="nom" id="whoNom">—</div><div class="rol" id="whoRol">—</div>
      <a href="#" class="cambiar" id="whoCambiar" style="display:none">Cambiar persona</a></div>
    <a class="salir" href="../" title="Volver al Portal">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M10 4 H5.5 V20 H10" stroke="#6b7280" stroke-width="1.8" stroke-linecap="round"/><path d="M14 8 L18 12 L14 16 M18 12 H9" stroke="#6b7280" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </div>
</div>
<div id="app"><div class="wrap muted">Cargando la Academia…</div></div>

<script>
/* ============================================================
   ACADEMIA DE VENTAS — plataforma funcional con el diseño del
   prototipo de Design (las .dc.html quedan solo como referencia).
   ------------------------------------------------------------
   - Datos: Firebase recepciones-mateu, nodo `capacitaciones/`
     (cursos/, programas/, avances/<slug>/<persona>/<curso>,
      novedades/, encuestas/, archivos/).
   - Dotación real: data/indicadores del último período (mismo
     mapa SLUG_SUC_IND que Buscador/RRHH).
   - Staff (admin/capacitador/supervisor) gestiona cursos y
     programas; alumno (cuenta sucursal → elige persona) cursa.

/* PIN personal dentro de la Academia (seguridad blanda, como el PIN del Portal):
   nodo pins/<slug>/<persona>. Lo define cada uno la primera vez; el encargado o
   el staff lo resetean desde la ficha de la persona en «Mi equipo». */
function pedirPin(titulo, texto, confirmar){
  return new Promise(res=>{
    const velo=document.createElement('div'); velo.className='velo';
    velo.innerHTML='<div class="modal" style="max-width:420px"><h2>'+esc(titulo)+'</h2><p class="muted" style="margin:0 0 14px">'+esc(texto)+'</p>'+
      '<input type="password" id="pinA" inputmode="numeric" maxlength="4" placeholder="4 dígitos" style="font-size:22px;letter-spacing:8px;text-align:center">'+
      (confirmar?'<input type="password" id="pinB" inputmode="numeric" maxlength="4" placeholder="Repetí el PIN" style="font-size:22px;letter-spacing:8px;text-align:center;margin-top:10px">':'')+
      '<div style="display:flex;gap:8px;margin-top:14px"><button class="btn pri" id="pinOk" style="flex:1">Continuar</button><button class="btn" id="pinCancel" style="background:#fff">Cancelar</button></div>'+
      '<p class="muted" id="pinMsg" style="font-size:13px;margin:10px 0 0"></p></div>';
    document.body.appendChild(velo);
    const a=velo.querySelector('#pinA'); a.focus();
    const ok=()=>{
      const v=a.value.trim();
      if(!/^\d{4}$/.test(v)){ velo.querySelector('#pinMsg').textContent='El PIN son 4 números.'; return; }
      if(confirmar && velo.querySelector('#pinB').value.trim()!==v){ velo.querySelector('#pinMsg').textContent='Los dos PIN no coinciden.'; return; }
      velo.remove(); res(v);
    };
    velo.querySelector('#pinOk').addEventListener('click',ok);
    velo.addEventListener('keydown',e=>{ if(e.key==='Enter') ok(); });
    velo.querySelector('#pinCancel').addEventListener('click',()=>{ velo.remove(); res(null); });
  });
}
async function verificarPin(p){
  const guardado = await fbGet('pins/'+MI_SLUG+'/'+p.id).catch(()=>null);
  if(!guardado || !guardado.pin){
    const pin = await pedirPin('Creá tu PIN', 'Hola '+p.nombre.split(' ')[0]+'. Elegí un PIN de 4 números para que tu avance quede solo a tu nombre. Si lo olvidás, tu encargado lo resetea.', true);
    if(!pin) return false;
    await fbPut('pins/'+MI_SLUG+'/'+p.id, {pin, ts:Date.now(), nombre:p.nombre});
    return true;
  }
  for(let intento=1; intento<=3; intento++){
    const pin = await pedirPin('Tu PIN', p.nombre+(intento>1?' · intento '+intento+' de 3':'')+'. Ingresá tu PIN de 4 números.', false);
    if(pin===null) return false;
    if(pin===String(guardado.pin)) return true;
  }
  alert('PIN incorrecto 3 veces. Pedile a tu encargado que lo resetee desde «Mi equipo».');
  return false;
}

/* Resumen precomputado que leen otros módulos (Panel General, Evaluaciones, RRHH):
   capacitaciones/resumen = { ts, porSlug:{slug:{personas,conCursos,pct,aprobados,sinActividad}}, personas:{slug:{pid:{nombre,rol,pct,aprobados:[...],ult}}} } */
async function publicarResumen(){
  if(!ES_STAFF) return;
  const slugs=Object.keys(SLUG_SUC_IND);
  await Promise.all(slugs.map(s=>dotacion(s).catch(()=>[])));
  const porSlug={}, personas={};
  slugs.forEach(slug=>{
    let suma=0, con=0, aprob=0, sinAct=0; personas[slug]={};
    personasDe(slug).forEach(per=>{
      const st=statsPersona(slug,per);
      if(st.asig){ con++; suma+=st.pct; aprob+=st.certs; if(!st.ult) sinAct++; }
      const avP=(AVANCES[slug]||{})[per.id]||{};
      const aprobados=cursosDe(slug,per.rol).filter(x=>estadoCurso(avP[x.curso.id],x.curso).completo).map(x=>x.curso.titulo);
      personas[slug][per.id]={ nombre:per.nombre, rol:per.rol, pct:st.pct, asig:st.asig, aprobados, ult:st.ult||0 };
    });
    porSlug[slug]={ personas:personasDe(slug).length, conCursos:con, pct:con?Math.round(suma/con):0, aprobados:aprob, sinActividad:sinAct };
  });
  await fbPut('resumen',{ ts:Date.now(), porSlug, personas }).catch(()=>{});
}
/* Recordatorios automáticos de vencimiento: 7 días antes y el día anterior, una sola vez por programa. */
async function recordatoriosVencimiento(){
  const hoy=Date.now();
  for(const p of Object.values(PROGRAMAS)){
    if(!p.limite || p.activo===false || !programaVisible(p)) continue;
    const d=diasHasta(p.limite); if(d===null || d<0) continue;
    const rec=p.recordatorios||{};
    const clave = d<=1 ? 'd1' : (d<=7 ? 'd7' : null);
    if(!clave || rec[clave]) continue;
    rec[clave]=hoy; p.recordatorios=rec;
    try{
      await fbPut('programas/'+p.id+'/recordatorios', rec);   // primero la marca, para no duplicar
      const texto='⏰ Academia de Ventas: el programa «'+p.nombre+'» vence '+(d<=1?(d===0?'HOY':'MAÑANA'):'el '+p.limite+' (en '+d+' días)')+'. Entrá a Capacitaciones y completá lo que te falta.';
      await fetch(MENSAJES_DB_URL+'/avisos.json',{method:'POST',body:JSON.stringify({de:'capacitacion@mateu.com.ar',texto,ts:hoy}),headers:{'Content-Type':'application/json'}});
      await fbPost('novedades',{tipo:'Recordatorio',autor:CAPACITADOR_FIRMA,rol:'Capacitador',titulo:(d<=1?'Último día':'Quedan '+d+' días')+' para cerrar '+p.nombre,cuerpo:'Completá los cursos pendientes antes del '+p.limite+'.',ts:hoy});
    }catch(e){}
  }
}

function tiempoRel(ts){
  const d = Date.now()-ts;
  if(d<60000) return 'recién';
  if(d<3600000) return 'hace '+Math.floor(d/60000)+' min';
  if(d<86400000) return 'hace '+Math.floor(d/3600000)+' h';
  if(d<172800000) return 'ayer';
  return 'hace '+Math.floor(d/86400000)+' días';
}

/* ---------- archivos (PDF/PPT en Firebase, en partes base64) ---------- */
const ARCHIVO_MAX_MB = 20;
const ARCHIVO_CHUNK = 4000000;
async function subirArchivo(file,onProgreso){
  const fid = nuevoId('f');
  const dataUrl = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(new Error('no se pudo leer el archivo')); r.readAsDataURL(file); });
  const b64 = dataUrl.slice(dataUrl.indexOf(',')+1);
  const n = Math.ceil(b64.length/ARCHIVO_CHUNK);
  await fbPut('archivos/'+fid+'/meta',{nombre:file.name,mime:file.type||'application/octet-stream',size:file.size,n,ts:Date.now(),por:SESSION.email});
  for(let i=0;i<n;i++){ if(onProgreso) onProgreso(i+1,n); await fbPut('archivos/'+fid+'/c/'+i, b64.slice(i*ARCHIVO_CHUNK,(i+1)*ARCHIVO_CHUNK)); }
  return fid;
}
async function bajarArchivo(fid){
  const meta = await fbGet('archivos/'+fid+'/meta'); if(!meta) throw new Error('archivo no encontrado');
  let b64=''; for(let i=0;i<meta.n;i++) b64 += await fbGet('archivos/'+fid+'/c/'+i);
  const bin = atob(b64); const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return { blob:new Blob([arr],{type:meta.mime}), meta };
}

/* ---------- dotación (Indicadores) ---------- */
async function ultimoPeriodo(){
  if(PERIODO_IND) return PERIODO_IND;
  const p = (await getJSON('../data/indicadores/periodos.json').catch(()=>({periodos:[]}))).periodos||[];
  PERIODO_IND = p.length ? p[0].id : null; return PERIODO_IND;
}
async function dotacion(slug){
  if(DOT_CACHE[slug]) return DOT_CACHE[slug];
  const dn = SLUG_SUC_IND[slug]; if(!dn){ DOT_CACHE[slug]=[]; return []; }
  const per = await ultimoPeriodo(); if(!per){ DOT_CACHE[slug]=[]; return []; }
  const d = await getJSON('../data/indicadores/'+per+'/'+archivoInd(dn)+'.json').catch(()=>null);
  const out=[];
  ((d&&d.vendedores)||[]).forEach(v=>{
    if(v.cubre) return; const rol=GRUPO_ROL_IND[v.grupo]; if(!rol) return;
    out.push({id:idFromNombre(v.vendedor), nombre:titleNombre(v.vendedor), rol});
  });
  out.sort((a,b)=> a.rol===b.rol ? a.nombre.localeCompare(b.nombre) : (a.rol==='encargado'?-1: b.rol==='encargado'?1: a.rol.localeCompare(b.rol)));
  DOT_CACHE[slug]=out; return out;
}
function personasDe(slug){
  const dot = DOT_CACHE[slug]||[];
  const avs = AVANCES[slug]||{};
  const out = dot.slice();
  Object.keys(avs).forEach(pid=>{
    if(!out.find(x=>x.id===pid)){ const a=Object.values(avs[pid])[0]||{}; out.push({id:pid,nombre:a.nombre||pid,rol:a.rol||'vendedor'}); }
  });
  return out;
}

/* ---------- asignación y avance ---------- */
function progColor(p,i){ return p.color || PALETA[(i!==undefined?i:Object.keys(PROGRAMAS).indexOf(p.id))%PALETA.length] || '#1a1c1f'; }
function programasDe(slug, rolPersona){
  return Object.values(PROGRAMAS).filter(p=>{
    if(p.activo===false) return false;
    if(!programaVisible(p)) return false;
    const okRol = !(p.roles&&p.roles.length) || p.roles.includes(rolPersona);
    const okSuc = !(p.sucursales&&p.sucursales.length) || p.sucursales.includes(slug);
    return okRol && okSuc;
  }).sort((a,b)=>(a.ts||0)-(b.ts||0));
}
function programaVisible(p){
  return (p.cursos||[]).some(cid=>CURSOS[cid]&&CURSOS[cid].activo!==false) || encActiva(p);
}
function cursosDe(slug, rolPersona){
  const vistos=new Set(); const out=[];
  programasDe(slug,rolPersona).forEach(p=>(p.cursos||[]).forEach(cid=>{
    if(vistos.has(cid)||!CURSOS[cid]||CURSOS[cid].activo===false) return;
    vistos.add(cid); out.push({curso:CURSOS[cid],programa:p});
  }));
  return out;
}
function estadoCurso(av,curso){
  const a=av||{}; const nm=(curso.modulos||[]).length;
  const modsOk=Object.keys(a.mods||{}).length;
  const hayQuiz=!!(curso.quiz&&(curso.quiz.preguntas||[]).length);
  const quizOk=!hayQuiz||!!(a.quiz&&a.quiz.ok);
  const total=nm+(hayQuiz?1:0);
  const hecho=Math.min(modsOk,nm)+((hayQuiz&&quizOk)?1:0);
  const completo=!!a.fin||(total>0&&hecho>=total);
  return { modsOk, nm, hayQuiz, quizOk, avance: total?Math.round(100*hecho/total):0, completo, empezado: modsOk>0||!!(a.quiz&&a.quiz.int) };
}
function statsPersona(slug, per){
  const asig = cursosDe(slug, per.rol);
  const avP = (AVANCES[slug]||{})[per.id]||{};
  let suma=0, mods=0, certs=0, ult=0, seg=0; const rapidos=[];
  asig.forEach(x=>{
    const a=avP[x.curso.id]; const e=estadoCurso(a,x.curso);
    suma+=e.avance; mods+=e.modsOk+((e.hayQuiz&&e.quizOk&&a)?1:0); if(e.completo) certs++;
    if(a){ ult=Math.max(ult, a.fin||0, (a.quiz&&a.quiz.ts)||0, a.encTs||0, a.ultTs||0); }
    const t=a&&a.tiempo?Object.values(a.tiempo).reduce((q,v)=>q+(+v||0),0):0; seg+=t;
    // "muy rápido": curso completo con 3+ módulos leídos en menos de 20 segundos por módulo
    if(e.completo && e.nm>=3 && a && a.tiempo && t < e.nm*20) rapidos.push(x.curso.titulo);
  });
  return { asig:asig.length, pct: asig.length?Math.round(suma/asig.length):0, mods, certs, ult, seg, rapidos };
}

/* ---------- PLAYER DE CURSO ---------- */
function abrirCurso(cid){
  const av = ES_STAFF ? null : avanceYo(cid);
  const c = CURSOS[cid]; if(!c) return;
  const nm=(c.modulos||[]).length;
  let idx=0;
  if(av&&av.mods){ while(idx<nm && av.mods[idx]) idx++; }   // primer módulo pendiente
  PLAYER={ cid, idx, resp:{}, enviado:false, landing:true };
  render();
  window.scrollTo(0,0);
}

function seccionesDeTexto(contenido){
  // Bloques separados por línea en blanco. "[[tipo]] Título" al inicio de un
  // bloque lo convierte en tarjeta destacada (dato / tip / evitar / ejemplo).
  return (contenido||'').split(/\n\s*\n/).map(b=>{
    const m=b.match(/^\[\[(dato|tip|evitar|ejemplo)\]\]\s*([^\n]*)\n?([\s\S]*)$/);
    if(m) return {tipo:m[1], titulo:m[2], texto:m[3].trim()};
    const t=b.match(/^([^\n]{2,60}):\s*\n([\s\S]+)$/);
    if(t) return {tipo:'', titulo:t[1], texto:t[2].trim()};
    return {tipo:'', titulo:'', texto:b.trim()};
  }).filter(s=>s.texto||s.titulo);
}

        html.push('<div class="banner '+(okQ?'verde':'rojo')+'"><div style="font-size:19px;font-weight:700">'+(okQ?'¡Quiz aprobado!':'No alcanzaste el puntaje')+'</div>'+
          '<div style="font-size:15px;opacity:.92">'+bien+' de '+pregs.length+' correctas ('+pje+'%)'+(okQ?' — ¡curso completado!':' — necesitás '+(q.aprueba||70)+'% para aprobar.')+'</div>'+
          (okQ?'':'<button class="btn" id="pReintentar" style="align-self:flex-start;margin-top:8px;background:#fff">Reintentar</button>')+'</div>');
      }
      html.push('</div>');
    }
    // Encuesta post-curso
    if(!ES_STAFF && est.completo && !av.encTs){
      html.push('<div class="sec-t" style="margin-top:30px">Contanos cómo estuvo</div><div class="card-b" style="margin-top:12px">'+
        '<div class="fila">'+[['e1','El contenido'],['e2','La claridad'],['e3','La utilidad para mi trabajo']].map(([id,l])=>
          '<div><label class="fl">'+l+'</label><select id="'+id+'">'+[5,4,3,2,1].map(v=>'<option value="'+v+'">'+'⭐'.repeat(v)+' ('+v+')</option>').join('')+'</select></div>').join('')+'</div>'+
        '<div style="margin-top:12px"><label class="fl">Comentario (opcional)</label><textarea id="eCom" placeholder="¿Qué mejorarías? ¿Qué te sirvió más?"></textarea></div>'+
        '<div style="margin-top:12px"><button class="btn pri" id="encEnviar">Enviar encuesta</button></div></div>');
    } else if(!ES_STAFF && est.completo && av.encTs){
      html.push('<p class="muted" style="margin-top:20px">Gracias por responder la encuesta de este curso 🙌</p>');
    }
  }
  html.push('</div></div>');
  app.innerHTML=html.join('');

  $('pVolver').addEventListener('click',e=>{ e.preventDefault(); PLAYER=null; render(); });
  app.querySelectorAll('[data-lec]').forEach(b=>b.addEventListener('click',()=>{
    PLAYER.idx = b.dataset.lec==='quiz' ? mods.length : +b.dataset.lec; render();
  }));
  const bc=$('pCert'); if(bc) bc.addEventListener('click',()=>verCertificado({curso:c}));
  const ant=$('pAnt'); if(ant) ant.addEventListener('click',()=>{ if(PLAYER.idx>0){ PLAYER.idx--; render(); } });
  app.querySelectorAll('[data-verpdf]').forEach(b=>b.addEventListener('click', async ()=>{
    b.disabled=true; b.textContent='Cargando…';
    try{ const {blob}=await bajarArchivo(b.dataset.verpdf); const url=URL.createObjectURL(blob);
      $('pdfMarco').innerHTML='<iframe src="'+url+'#view=FitH" style="width:100%;height:72vh;border:1px solid var(--borde);border-radius:6px;background:#fff"></iframe>'; b.textContent='📖 Abierto abajo';
    }catch(err){ alert('No se pudo abrir: '+err.message); b.disabled=false; b.textContent='📖 Ver acá'; }
  }));
  // tiempo de lectura del módulo actual (se acumula al completar)
  if(!esQuiz && PLAYER._idxT!==PLAYER.idx){ PLAYER._idxT=PLAYER.idx; PLAYER.t0=Date.now(); }
  const sig=$('pSig'); if(sig) sig.addEventListener('click', async ()=>{
    if(!ES_STAFF){
      const nuevo=Object.assign({},av); nuevo.mods=Object.assign({},av.mods||{}); nuevo.mods[PLAYER.idx]=1;
      nuevo.tiempo=Object.assign({},av.tiempo||{}); nuevo.tiempo[PLAYER.idx]=(+nuevo.tiempo[PLAYER.idx]||0)+Math.min(1800, Math.round((Date.now()-(PLAYER.t0||Date.now()))/1000)); PLAYER.t0=Date.now();
      const e2=estadoCurso(nuevo,c); if(e2.completo&&!nuevo.fin) nuevo.fin=Date.now();
      sig.disabled=true;
      try{ await guardarAvanceYo(c.id,nuevo); }catch(err){ alert('No se pudo guardar: '+err.message); }
    }
    if(PLAYER.idx<mods.length-1) PLAYER.idx++;
    else if(hayQuiz) PLAYER.idx=mods.length;
    render();
  });
  app.querySelectorAll('.op-btn').forEach(b=>b.addEventListener('click',()=>{
    if(ES_STAFF||PLAYER.enviado) return;
    PLAYER.resp[+b.dataset.p]=+b.dataset.o; render();
  }));
  const env=$('pEnviar'); if(env) env.addEventListener('click', async ()=>{
    const pregs=c.quiz.preguntas||[];
    if(pregs.some((p,i)=>PLAYER.resp[i]===undefined)){ alert('Respondé todas las preguntas antes de enviar.'); return; }
    const bien=pregs.filter((p,i)=>PLAYER.resp[i]===+p.ok).length;
    const pje=pct(bien,pregs.length); const okQ=pje>=(c.quiz.aprueba||70);
    const nuevo=Object.assign({},av);
    nuevo.quiz={pje,ok:okQ,ts:Date.now(),int:((av.quiz&&av.quiz.int)||0)+1};
    const e2=estadoCurso(nuevo,c); if(e2.completo&&!nuevo.fin) nuevo.fin=Date.now();
    env.disabled=true;
    try{ await guardarAvanceYo(c.id,nuevo); }catch(err){ alert('No se pudo guardar: '+err.message); return; }
    PLAYER.enviado=true; render();
  });
  const rei=$('pReintentar'); if(rei) rei.addEventListener('click',()=>{ PLAYER.resp={}; PLAYER.enviado=false; render(); });
  const ee=$('encEnviar'); if(ee) ee.addEventListener('click', async ()=>{
    ee.disabled=true;
    try{
      await fbPost('encuestas/'+c.id,{de:YO.nombre,slug:MI_SLUG,r1:+$('e1').value,r2:+$('e2').value,r3:+$('e3').value,com:$('eCom').value.trim(),ts:Date.now()});
      const nuevo=Object.assign({},avanceYo(c.id)||{},{encTs:Date.now()});
      await guardarAvanceYo(c.id,nuevo);
    }catch(err){ alert('No se pudo enviar: '+err.message); }
    render();
  });
  bindArchivos(app);
}

          '<svg width="46" height="46" viewBox="0 0 24 24" fill="none" style="position:relative"><path d="M12 3 L14.5 8.5 L20.5 9.2 L16 13.2 L17.3 19.2 L12 16.2 L6.7 19.2 L8 13.2 L3.5 9.2 L9.5 8.5 Z" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"/></svg></div></div>'+
          (finProg?'<div style="align-self:flex-start;display:inline-flex;align-items:center;gap:6px;background:rgba(20,20,20,.4);color:#fff;font-size:13px;font-weight:600;padding:4px 10px;border-radius:4px">'+fechaCorta(finProg)+'</div>':'')+
          '<button class="btn" data-certprog="'+esc(p.id)+'" style="margin-top:14px;width:100%;background:#fff">Ver certificado</button></div>');
      } else {
        html.push('<div class="hcard hlock">'+
          '<svg width="44" height="44" viewBox="0 0 24 24" fill="none"><rect x="5" y="10" width="14" height="10" rx="2" stroke="#9aa0a8" stroke-width="1.8"/><path d="M8 10 V7.5 A4 4 0 0 1 16 7.5 V10" stroke="#9aa0a8" stroke-width="1.8"/></svg>'+
          '<div style="font-size:15.5px;font-weight:700;color:var(--gris);line-height:1.4">Completá los '+cs.length+' cursos para obtener tu certificado</div>'+

          '<div style="font-size:13.5px;font-weight:700;color:#9aa0a8">'+done.length+' de '+cs.length+' completados</div></div>');
      }
      if(encActiva(p)) html.push(encuestaCardHtml(p,true).replace('class="ccard chica"','class="hcard"'));
      cs.forEach(c=>{
        const est=estadoCurso(avanceYo(c.id),c);
        html.push('<div class="hcard" data-abrir="'+esc(c.id)+'" style="cursor:pointer">'+coverHtml(c,c.color||color)+
          '<span class="check'+(est.completo?' ok':'')+'" style="position:absolute;top:14px;left:14px;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:'+(est.completo?'#fff':'rgba(20,20,20,.45)')+';color:'+(est.completo?'var(--tinta)':'#fff')+';font-size:12.5px;font-weight:700">'+
          (est.completo?'✓':(est.empezado?est.avance+'%':'·'))+'</span>'+
          '<div class="pie" style="position:absolute;left:16px;right:16px;bottom:18px;display:flex;flex-direction:column;align-items:flex-start;gap:10px">'+
          '<span class="dur"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="#fff" stroke-width="1.8"/><path d="M12 7.5 V12 L15 14" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg> '+esc(c.dur||'')+'</span>'+

/* Ficha de una persona: qué le falta, tiempos, mensaje a la sucursal, reset de PIN */
function fichaPersona(f){
  const avP=(AVANCES[f.slug]||{})[f.per.id]||{};
  const asig=cursosDe(f.slug,f.per.rol);
  const velo=document.createElement('div'); velo.className='velo';
  const filas=asig.map(x=>{ const a=avP[x.curso.id]; const e=estadoCurso(a,x.curso); const t=a&&a.tiempo?Object.values(a.tiempo).reduce((q,v)=>q+(+v||0),0):0;
    return '<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #eef0f3;font-size:14px"><span style="flex:1">'+esc(x.curso.titulo)+' <span class="muted" style="font-size:12px">· '+esc(x.programa.nombre)+'</span></span>'+
      (e.completo?'<span class="chip verde">Aprobado'+(a&&a.quiz?' '+a.quiz.pje+'%':'')+'</span>':(e.empezado?'<span class="chip azulc">'+e.avance+'%</span>':'<span class="chip" style="background:#eef0f3">Pendiente</span>'))+

  velo.innerHTML='<div class="modal" style="max-width:620px"><div style="display:flex;align-items:center;gap:12px"><div class="pava" style="width:46px;height:46px;background:'+(ROL_COLOR[f.per.rol]||'#1a1c1f')+';font-size:16px">'+esc(iniciales(f.per.nombre))+'</div>'+
    '<div><h2 style="margin:0">'+esc(f.per.nombre)+'</h2><div class="muted" style="font-size:13.5px">'+esc(ROL_LABEL_PERSONA[f.per.rol]||f.per.rol)+' · '+esc(SUC_LABEL[f.slug]||f.slug)+' · avance '+f.st.pct+'% · '+(f.st.ult?'última actividad '+tiempoRel(f.st.ult):'sin actividad')+'</div></div></div>'+
    (f.st.rapidos.length?'<div class="seccion evitar" style="margin-top:14px"><div class="st">Muy rápido</div><div class="sx">Completó '+esc(f.st.rapidos.join(', '))+' en menos de 20 segundos por módulo. Vale la pena charlarlo.</div></div>':'')+

    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;border-top:1px solid var(--borde);padding-top:14px">'+
    (ES_STAFF?'<button class="btn oscuro mini" id="fMsg">✉ Escribir a la sucursal</button>':'')+
    '<button class="btn mini" id="fPin">🔑 Resetear PIN</button>'+
    '<button class="btn mini" id="fCerrar" style="margin-left:auto;background:#fff">Cerrar</button></div>'+
    '<div id="fMsgBox" style="display:none;margin-top:12px"><textarea id="fTexto" style="min-height:80px"></textarea><div style="margin-top:8px"><button class="btn pri mini" id="fEnviar">Enviar a la Bandeja de la sucursal</button> <span class="muted" id="fEst" style="font-size:13px"></span></div></div></div>';
  document.body.appendChild(velo);
  velo.querySelector('#fCerrar').addEventListener('click',()=>velo.remove());
  velo.addEventListener('click',e=>{ if(e.target===velo) velo.remove(); });
  velo.querySelector('#fPin').addEventListener('click', async ()=>{
    if(!confirm('¿Resetear el PIN de '+f.per.nombre+'? La próxima vez que entre, crea uno nuevo.')) return;
    try{ await fbDel('pins/'+f.slug+'/'+f.per.id); alert('PIN reseteado.'); }catch(err){ alert('No se pudo: '+err.message); }
  });
  const bm=velo.querySelector('#fMsg'); if(bm) bm.addEventListener('click',()=>{
    const box=velo.querySelector('#fMsgBox'); box.style.display='';
    const pend=asig.filter(x=>!estadoCurso(avP[x.curso.id],x.curso).completo).map(x=>x.curso.titulo);
    velo.querySelector('#fTexto').value='🎓 Academia de Ventas — para '+f.per.nombre+': '+(pend.length?'te falta completar '+pend.join(', ')+'. ':'¡felicitaciones, estás al día! ')+'Cualquier duda, me escribís.';
  });
  const be=velo.querySelector('#fEnviar'); if(be) be.addEventListener('click', async ()=>{
    const texto=velo.querySelector('#fTexto').value.trim(); if(!texto) return;
    be.disabled=true; const est=velo.querySelector('#fEst');
    try{ const mails=await usuariosDeSucursal(f.slug); if(!mails.length) throw new Error('la sucursal no tiene cuenta en el Portal');
      for(const m of mails) await enviarDirecto(m, texto); est.textContent='Enviado a '+mails.join(', ');
    }catch(err){ est.textContent='No se pudo: '+err.message; be.disabled=false; }
  });
}

/* ============================================================
   ASISTENTE: crear curso desde un PDF / PowerPoint
   ------------------------------------------------------------
   Lee el texto del archivo en el navegador (pdf.js / JSZip desde
   CDN, carga lazy), propone un módulo por página o diapositiva
   (título = primera línea corta; los encabezados en MAYÚSCULAS
   quedan como tarjetas tituladas), y adjunta el archivo original.
   ============================================================ */
function loadScript(src){
  return new Promise((res,rej)=>{
    if(document.querySelector('script[src="'+src+'"]')) return res();
    const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('no se pudo cargar '+src)); document.head.appendChild(s);
  });
}
function esDecorativa(l){
  // Texto "e s p a c i a d o" (membretes, kickers): la mayoría de los tokens son de 1 letra.
  const t=l.split(' '); return t.length>=4 && t.filter(x=>x.length===1).length/t.length>0.6;
}
let LINEAS_REPETIDAS = new Set();   // membrete/pie que aparece en varias páginas (se arma en extraerPdf)
function limpiarLineas(lineas){
  // Quita membretes/pies repetidos, numeración de página y texto decorativo; normaliza espacios.
  return lineas.map(l=>l==='§'?l:l.replace(/\s+/g,' ').trim())
    .filter(l=>l && (l==='§' || (!/^\d{1,3}$/.test(l) && !/^(página|pagina|page)\s*\d+/i.test(l) && !/\d+\s*(de|of|\/)\s*\d+$/i.test(l) && !esDecorativa(l) && !LINEAS_REPETIDAS.has(l))));
}
function lineasAContenido(lineas){
  // Un encabezado = línea corta en MAYÚSCULAS (o que termina en ":") → "Título:\n" del bloque.
  const out=[]; let bloque=[];
  const cerrar=()=>{ if(bloque.length){ out.push(bloque.join('\n')); bloque=[]; } };
  lineas.forEach(l=>{
    const esTitulo = l.length<=70 && l.length>=3 && !/[.!?]$/.test(l) && (l===l.toUpperCase() && /[A-ZÁÉÍÓÚÑ]/.test(l) || /:$/.test(l));
    if(esTitulo){ cerrar(); bloque.push(l.replace(/:$/,'')+':'); }
    else bloque.push(l);
  });
  cerrar();
  // Un bloque que es solo "Título:" sin texto se pega al siguiente
  const res=[]; for(let i=0;i<out.length;i++){ if(/^[^\n]+:$/.test(out[i]) && i+1<out.length){ res.push(out[i]+'\n'+out[i+1]); i++; } else res.push(out[i]); }
  return res.join('\n\n');
}
function moduloDesdeLineas(lineas, fallbackTitulo){
  lineas=limpiarLineas(lineas);
  if(!lineas.length) return null;
  let titulo=fallbackTitulo;
  const primera=lineas[0];
  if(primera.length<=80 && (lineas.length===1 || primera.length<=70)){ titulo=titleNombre(primera.toLowerCase()); lineas=lineas.slice(1); }
  const contenido=lineasAContenido(lineas);
  if(contenido.replace(/\s/g,'').length<25 && !titulo) return null;
  return { titulo, tipo:'texto', contenido };
}
async function extraerPdf(file){
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  const mods=[]; const porPagina=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const tc=await page.getTextContent();
    // Agrupa los ítems por renglón (coordenada y) y ordena de arriba a abajo.
    const filas={};
    tc.items.forEach(it=>{ if(!it.str||!it.str.trim()) return; const y=Math.round(it.transform[5]/3)*3; (filas[y]=filas[y]||[]).push({x:it.transform[4],s:it.str,h:it.transform[3]||10}); });
    const ys=Object.keys(filas).map(Number).sort((a,b)=>b-a);
    const lineas=[]; let yPrev=null, hPrev=10;
    ys.forEach(y=>{
      const f=filas[y].sort((a,b)=>a.x-b.x);
      const txt=f.map(i=>i.s).join(' ').replace(/\s+/g,' ').trim();
      const h=f[0].h||10;
      if(yPrev!==null && (yPrev-y) > Math.max(h,hPrev)*1.9) lineas.push('');   // salto grande = párrafo nuevo
      lineas.push(txt); yPrev=y; hPrev=h;
    });
    // Convierte los '' en separadores de bloque preservando el resto
    const bloques=[]; let cur=[];
    lineas.forEach(l=>{ if(l===''){ if(cur.length){ bloques.push(cur); cur=[]; } } else cur.push(l); });
    if(cur.length) bloques.push(cur);
    // Reconstruye con separadores explícitos: cada bloque se une con \n y entre bloques va \n\n
    const lineasPlanas=[]; bloques.forEach((b,i)=>{ if(i) lineasPlanas.push('§'); b.forEach(l=>lineasPlanas.push(l)); });
    porPagina.push(lineasPlanas);
  }
  // Membrete / pie: una línea (normalizada) que aparece en 2+ páginas.
  LINEAS_REPETIDAS=new Set();
  if(porPagina.length>1){
    const cnt={};
    porPagina.forEach(ls=>{ new Set(ls.filter(l=>l!=='§').map(l=>l.replace(/\s+/g,' ').trim())).forEach(l=>{ cnt[l]=(cnt[l]||0)+1; }); });
    Object.keys(cnt).forEach(l=>{ if(cnt[l]>=2 && l.length<=90) LINEAS_REPETIDAS.add(l); });
  }
  porPagina.forEach((ls,i)=>{ const m=moduloDesdeLineasPdf(ls,'Página '+(i+1)); if(m) mods.push(m); });
  LINEAS_REPETIDAS=new Set();
  return mods;
}
function moduloDesdeLineasPdf(lineas, fallback){
  // Igual que moduloDesdeLineas pero respeta los saltos de párrafo (§) detectados por posición.
  const limpias=limpiarLineas(lineas.map(l=>l==='§'?'§':l)).filter(l=>l);
  if(!limpias.filter(l=>l!=='§').length) return null;
  let titulo=fallback; let resto=limpias.slice();
  while(resto.length && resto[0]==='§') resto.shift();
  if(resto.length && resto[0].length<=70){
    let t=resto[0]; resto=resto.slice(1);
    // Título grande partido en varias líneas cortas en MAYÚSCULAS → se une (máx. 3 líneas)
    let n=0; while(resto.length && resto[0]!=='§' && resto[0].length<=30 && resto[0]===resto[0].toUpperCase() && /[A-ZÁÉÍÓÚÑ]/.test(resto[0]) && n<2){ t+=' '+resto.shift(); n++; }
    titulo=titleNombre(t.toLowerCase());
  }
  const bloques=[]; let cur=[];
  resto.forEach(l=>{ if(l==='§'){ if(cur.length){ bloques.push(cur); cur=[]; } } else cur.push(l); });
  if(cur.length) bloques.push(cur);
  const contenido=bloques.map(b=>lineasAContenido(b)).filter(Boolean).join('\n\n');
  if(contenido.replace(/\s/g,'').length<25) return null;
  return { titulo, tipo:'texto', contenido };
}
async function extraerPptx(file){
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
  const zip=await JSZip.loadAsync(file);
  const nombres=Object.keys(zip.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a,b)=>parseInt(a.match(/\d+/)[0])-parseInt(b.match(/\d+/)[0]));
  const mods=[];
  for(const n of nombres){
    const xml=await zip.file(n).async('string');
    const doc=new DOMParser().parseFromString(xml,'application/xml');
    let titulo=''; const lineas=[];
    doc.querySelectorAll('sp').forEach(sp=>{
      const ph=sp.querySelector('nvPr > ph'); const tipo=ph?(ph.getAttribute('type')||'body'):'';
      const parrafos=[];
      sp.querySelectorAll('p').forEach(p=>{ const t=[...p.querySelectorAll('t')].map(t=>t.textContent).join('').replace(/\s+/g,' ').trim(); if(t) parrafos.push(t); });
      if(!parrafos.length) return;
      if((tipo==='title'||tipo==='ctrTitle') && !titulo){ titulo=titleNombre(parrafos.join(' ').toLowerCase()); return; }
      lineas.push.apply(lineas,parrafos);
    });
    const num=parseInt(n.match(/\d+/)[0]);
    const m=moduloDesdeLineas(lineas, titulo||('Diapositiva '+num));
    if(m){ if(titulo) m.titulo=titulo; mods.push(m); }
    else if(titulo && lineas.length===0){ /* portada o separador: se omite */ }
  }
  return mods;
}

/* ---------- editor de módulos (compartido: asistente + editor de curso) ---------- */
let PREV_ABIERTAS = new Set();   // vistas previas desplegadas ("<pref><i>")
const TIPO_LABEL = { texto:'Texto / lectura', video:'Video (YouTube)', archivo:'Archivo (PDF / PowerPoint)', enlace:'Material (link externo)' };
function previewModuloHtml(m){
  if(m.tipo==='video'){ const yt=esUrlYoutube(m.contenido); return yt?'<div class="video-marco" style="max-width:520px"><iframe src="https://www.youtube.com/embed/'+yt+'" allowfullscreen loading="lazy"></iframe></div>':'<p class="muted">Pegá un link de YouTube para ver el video acá.</p>'; }
  if(m.tipo==='archivo') return '<div class="seccion"><div class="st">Material del curso</div><div style="margin-top:10px"><span class="btn oscuro mini">📥 Descargar '+esc(m.archivoNombre||'material')+'</span></div></div>';
  if(m.tipo==='enlace') return '<div class="seccion"><div class="st">Material del curso</div><div style="margin-top:10px"><span class="btn oscuro mini">📄 Abrir material</span></div></div>';
  const secs=seccionesDeTexto(m.contenido);
  if(!secs.length) return '<p class="muted">Escribí el contenido para ver cómo queda.</p>';
  return '<div style="display:flex;flex-direction:column;gap:10px">'+secs.map(s=>'<div class="seccion '+esc(s.tipo)+'">'+(s.titulo?'<div class="st">'+esc(s.titulo)+'</div>':'')+'<div class="sx" style="font-size:14.5px">'+esc(s.texto)+'</div></div>').join('')+'</div>';
}
function moduloEditorHtml(m,i,op){
  const p=op.pref, abierta=PREV_ABIERTAS.has(p+i), total=op.total;
  return '<div class="card-b" style="margin-top:10px"><div class="fila">'+
    '<div style="flex:2;min-width:220px"><label class="fl">Módulo '+(i+1)+'</label><input type="text" data-'+p+'t="'+i+'" value="'+esc(m.titulo||'')+'" placeholder="Título del módulo"></div>'+
    '<div><label class="fl">Tipo</label><select data-'+p+'tipo="'+i+'">'+['texto','video','archivo','enlace'].map(t=>'<option value="'+t+'"'+((m.tipo||'texto')===t?' selected':'')+'>'+TIPO_LABEL[t]+'</option>').join('')+'</select></div>'+
    '<div style="align-self:flex-end;display:flex;gap:6px;flex-wrap:wrap">'+
      '<button class="btn mini" data-'+p+'up="'+i+'" title="Subir"'+(i===0?' disabled':'')+'>↑</button>'+
      '<button class="btn mini" data-'+p+'down="'+i+'" title="Bajar"'+(i===total-1?' disabled':'')+'>↓</button>'+
      (op.unir?'<button class="btn mini" data-'+p+'unir="'+i+'" title="Pegar este módulo al final del anterior">⤴ Unir</button>':'')+
      '<button class="btn mini" data-'+p+'prev="'+i+'">👁 '+(abierta?'Ocultar':'Vista previa')+'</button>'+
      '<button class="btn mini peligro" data-'+p+'del="'+i+'">🗑</button></div></div>'+
    '<div style="margin-top:10px">'+
    ((m.tipo||'texto')==='texto' ? '<label class="fl">Contenido</label><textarea data-'+p+'c="'+i+'" style="min-height:130px" placeholder="Doble enter = tarjeta nueva. Opcional: [[tip]] Título, [[dato]] Título, [[evitar]] Título o [[ejemplo]] Título al inicio de un bloque lo destaca con color.">'+esc(m.contenido||'')+'</textarea>'
      : m.tipo==='archivo' ? '<label class="fl">Archivo</label>'+
        (m.contenido?'<p style="margin:0 0 8px;font-size:14px">Subido: <b>'+esc(m.archivoNombre||m.contenido)+'</b> ✓ — elegir otro archivo lo reemplaza.</p>':'')+
        '<input type="file" data-'+p+'f="'+i+'" accept=".pdf,.ppt,.pptx,.doc,.docx,.xls,.xlsx"> <span class="muted" data-'+p+'fst="'+i+'" style="font-size:13px"></span>'+
        '<p class="muted" style="font-size:12.5px;margin:7px 0 0">Máx. '+ARCHIVO_MAX_MB+' MB. Si el PPT pesa mucho por las fotos, conviene exportarlo a PDF.</p>'
      : '<label class="fl">URL</label><input type="url" data-'+p+'c="'+i+'" value="'+esc(m.contenido||'')+'" placeholder="https://…">')+
    (abierta?'<div style="margin-top:12px;padding:14px;background:#f6f7f8;border-radius:6px"><div class="fl" style="margin-bottom:8px">Así lo ve el equipo</div>'+previewModuloHtml(m)+'</div>':'')+
    '</div></div>';
}
function leerModulosForm(app,mods,p){
  app.querySelectorAll('[data-'+p+'t]').forEach(i=>{ mods[+i.dataset[p+'t']].titulo=i.value.trim(); });
  app.querySelectorAll('[data-'+p+'tipo]').forEach(i=>{ mods[+i.dataset[p+'tipo']].tipo=i.value; });
  app.querySelectorAll('[data-'+p+'c]').forEach(i=>{ mods[+i.dataset[p+'c']].contenido=i.value.trim(); });
}
function bindModulosEditor(app,mods,p,leer){
  app.querySelectorAll('[data-'+p+'del]').forEach(b=>b.addEventListener('click',()=>{ leer(); mods.splice(+b.dataset[p+'del'],1); PREV_ABIERTAS.clear(); render(); }));
  app.querySelectorAll('[data-'+p+'up]').forEach(b=>b.addEventListener('click',()=>{ leer(); const i=+b.dataset[p+'up']; if(i>0){ [mods[i-1],mods[i]]=[mods[i],mods[i-1]]; PREV_ABIERTAS.clear(); render(); } }));
  app.querySelectorAll('[data-'+p+'down]').forEach(b=>b.addEventListener('click',()=>{ leer(); const i=+b.dataset[p+'down']; if(i<mods.length-1){ [mods[i+1],mods[i]]=[mods[i],mods[i+1]]; PREV_ABIERTAS.clear(); render(); } }));
  app.querySelectorAll('[data-'+p+'prev]').forEach(b=>b.addEventListener('click',()=>{ leer(); const k=p+b.dataset[p+'prev']; if(PREV_ABIERTAS.has(k)) PREV_ABIERTAS.delete(k); else PREV_ABIERTAS.add(k); render(); }));
  app.querySelectorAll('[data-'+p+'tipo]').forEach(s=>s.addEventListener('change',()=>{ leer(); render(); }));
  app.querySelectorAll('[data-'+p+'f]').forEach(inp=>inp.addEventListener('change', async ()=>{
    const f=inp.files&&inp.files[0]; if(!f) return;
    if(f.size>ARCHIVO_MAX_MB*1048576){ alert('«'+f.name+'» pesa '+(f.size/1048576).toFixed(1)+' MB y el máximo es '+ARCHIVO_MAX_MB+' MB.\nSi es un PowerPoint con muchas fotos, exportalo a PDF y subí ese.'); inp.value=''; return; }
    leer();
    const st=app.querySelector('[data-'+p+'fst="'+inp.dataset[p+'f']+'"]'); inp.disabled=true;
    try{
      const fid=await subirArchivo(f,(i,n)=>{ if(st) st.textContent='Subiendo… parte '+i+' de '+n; });
      const m=mods[+inp.dataset[p+'f']]; m.contenido=fid; m.archivoNombre=f.name;
      if(!m.titulo) m.titulo=f.name.replace(/\.[^.]+$/,'');
      render();
    }catch(err){ alert('No se pudo subir el archivo: '+err.message); inp.disabled=false; if(st) st.textContent=''; }
  }));
}

          modulos: w.mods.concat([{ titulo:'Material original: '+w.file.name, tipo:'archivo', contenido:fid, archivoNombre:w.file.name }]),
          quiz:{ aprueba:w.quiz.aprueba, preguntas:w.quiz.preguntas.filter(p=>p.q&&p.ops.length>=2) } };
        est.textContent='Guardando el curso…';
        await fbPut('cursos/'+curso.id,curso); CURSOS[curso.id]=curso;
        let prog=null;
        if(w.progNuevo){
          prog={ id:nuevoId('p'), nombre:w.progNuevo, color:PALETA[Object.keys(PROGRAMAS).length%PALETA.length], cursos:[curso.id], roles:[], sucursales:[], limite:'', activo:true, ts:Date.now(), por:SESSION.email };
        } else if(w.progId && PROGRAMAS[w.progId]){
          prog=PROGRAMAS[w.progId]; prog.cursos=(prog.cursos||[]).concat(prog.cursos.includes(curso.id)?[]:[curso.id]);
        }
        if(prog){ await fbPut('programas/'+prog.id,prog); PROGRAMAS[prog.id]=prog; }
        if(w.avisar){
          const yo=quienSoy();
          const texto='🎓 Academia de Ventas: nuevo curso «'+curso.titulo+'»'+(prog?' en '+prog.nombre:'')+'. Entrá a Capacitaciones desde el Portal.';
          await fetch(MENSAJES_DB_URL+'/avisos.json',{method:'POST',body:JSON.stringify({de:SESSION.email,texto,ts:Date.now()}),headers:{'Content-Type':'application/json'}}).catch(()=>{});
          await fbPost('novedades',{tipo:'Nuevo programa',autor:yo.nombre,rol:yo.rol,titulo:'Nuevo curso: '+curso.titulo,cuerpo:(prog?'Dentro de '+prog.nombre+'. ':'')+'Ya está disponible en el catálogo.',ts:Date.now()}).catch(()=>{});
          NOVEDADES=await fbGet('novedades').catch(()=>NOVEDADES)||{};
        }
        WIZ=null; VISTA=null; pintarNav();
        alert('¡Listo! El curso «'+curso.titulo+'» quedó publicado'+(prog?' en '+prog.nombre:' (sin programa todavía)')+'.\n\nPodés seguir ajustándolo cuando quieras desde Gestión → ✏ Editar (texto, orden, portada, quiz).');
        abrirCurso(curso.id);
      }catch(err){ btn.disabled=false; est.textContent=''; alert('No se pudo publicar: '+err.message); }
    });
  }
}

  app.querySelectorAll('[data-qdown]').forEach(b=>b.addEventListener('click',()=>{ leerForm(); const i=+b.dataset.qdown; const q=c.quiz.preguntas; if(i<q.length-1){ [q[i+1],q[i]]=[q[i],q[i+1]]; render(); } }));
  bindModulosEditor(app,c.modulos,'m',leerForm);
  $('guardarCurso').addEventListener('click', async ()=>{
    leerForm();
    if(!c.titulo){ alert('Poné un título al curso.'); return; }
    const malas=(c.quiz.preguntas||[]).filter(p=>p.q&&(p.ops.length<2||p.ok>=p.ops.length));
    if(malas.length){ alert('Hay preguntas con menos de 2 opciones o con la correcta fuera de rango.'); return; }
    c.quiz.preguntas=(c.quiz.preguntas||[]).filter(p=>p.q&&p.ops.length>=2);
    c.modulos=(c.modulos||[]).filter(m=>m.titulo||m.contenido);

    catch(err){ alert('No se pudo guardar: '+err.message); }
  });

  const [data, previas, posts]=await Promise.all([fbGet('encuestas').catch(()=>null), fbGet('encuestasPrevias').catch(()=>null), fbGet('encuestasPost').catch(()=>null)]);
  const html=['<div class="wrap medio">'];
  html.push('<div class="titulo-xl">Gestión</div><div class="bajada">Lo que dijo el equipo al terminar cada curso (contenido · claridad · utilidad, de 1 a 5).</div>'+gesTabs());
  // Encuestas previas por programa (respuestas abiertas, confidenciales)
  const bloqueAbiertas=(titulo, data)=>{
    const ids=Object.keys(data||{}); if(!ids.length) return;
    html.push('<div class="sec-t" style="margin-top:28px">'+titulo+'</div>');
    ids.forEach(pid=>{
      const filas=[]; Object.keys(data[pid]||{}).forEach(slug=>Object.values(data[pid][slug]||{}).forEach(r=>filas.push(Object.assign({slug},r))));
      filas.sort((a,b)=>(b.ts||0)-(a.ts||0));
      html.push('<div class="card-b" style="margin-top:10px"><div style="display:flex;align-items:baseline;gap:12px"><b style="font-size:16px">'+esc((PROGRAMAS[pid]&&PROGRAMAS[pid].nombre)||pid)+'</b><span class="chip azulc">'+filas.length+' respuesta'+(filas.length===1?'':'s')+'</span></div>'+
        filas.map(r=>'<details style="margin-top:10px;border-top:1px solid var(--borde);padding-top:10px"><summary style="cursor:pointer;font-size:14.5px"><b>'+esc(r.nombre||'')+'</b> <span class="muted">· '+esc(ROL_LABEL_PERSONA[r.rol]||r.rol||'')+' · '+esc(SUC_LABEL[r.slug]||r.slug)+' · '+fechaCorta(r.ts||0)+'</span></summary>'+
          (r.respuestas||[]).map(x=>'<div style="margin:10px 0 0 14px;font-size:14.5px"><div class="muted" style="font-size:13px">'+esc(x.q)+'</div><div>'+esc(x.a)+'</div></div>').join('')+'</details>').join('')+'</div>');
    });
  };
  bloqueAbiertas('Encuestas previas por programa', previas);
  bloqueAbiertas('Encuestas post-programa', posts);
  const prevIds=Object.keys(previas||{}).concat(Object.keys(posts||{}));
  const cids=Object.keys(data||{});
  if(cids.length) html.push('<div class="sec-t" style="margin-top:32px">Encuestas al terminar cada curso</div>');
  if(!cids.length && !prevIds.length) html.push('<div class="vacio" style="margin-top:26px">Sin respuestas todavía. La encuesta de curso aparece automáticamente al completarlo; la previa, cuando el programa la tiene activada.</div>');
  cids.forEach(cid=>{
    const resp=Object.values((data||{})[cid]||{}); if(!resp.length) return;
    const prom=k=>(resp.reduce((s,r)=>s+(+r[k]||0),0)/resp.length).toFixed(1);
    const coms=resp.filter(r=>r.com);
    html.push('<div class="sec-t" style="margin-top:28px">'+esc((CURSOS[cid]&&CURSOS[cid].titulo)||cid)+' <span class="chip azulc">'+resp.length+' respuesta'+(resp.length===1?'':'s')+'</span></div>');
    html.push('<div class="card-b" style="margin-top:10px"><div class="fila">'+
      [['Contenido',prom('r1')],['Claridad',prom('r2')],['Utilidad',prom('r3')]].map(([l,v])=>
        '<div style="text-align:center"><div style="font-size:26px;font-weight:800">'+v+'</div><div class="muted" style="font-size:13px">'+l+'</div></div>').join('')+'</div>'+
      (coms.length?'<div style="margin-top:14px;border-top:1px solid var(--borde);padding-top:12px">'+
        coms.map(r=>'<div style="margin-bottom:8px;font-size:14px">“'+esc(r.com)+'” <span class="muted">— '+esc(r.de||'')+' ('+esc(SUC_LABEL[r.slug]||r.slug||'')+')</span></div>').join('')+'</div>':'')+'</div>');
  });
  html.push('</div>');
  app.innerHTML=html.join('');
  bindGesTabs(app);
}

async function cargarAvancesAlumno(){ AVANCES[MI_SLUG]=(await fbGet('avances/'+MI_SLUG).catch(()=>null))||{}; }
(async function init(){
  if(!SESSION || !puedeVer) return;
  try{
    const [cursos, programas, novedades] = await Promise.all([
      fbGet('cursos').catch(()=>null), fbGet('programas').catch(()=>null), fbGet('novedades').catch(()=>null)
    ]);
    CURSOS=cursos||{}; PROGRAMAS=programas||{}; NOVEDADES=novedades||{};
    if(ES_STAFF){
      AVANCES=(await fbGet('avances').catch(()=>null))||{};
    } else {
      if(MI_SLUG){
        await asegurarYo(); await cargarAvancesAlumno();
        const conEnc=Object.values(PROGRAMAS).filter(p=>encActiva(p));
        await Promise.all(conEnc.map(async p=>{ const r=await fbGet('encuestasPrevias/'+p.id+'/'+MI_SLUG+'/'+YO.id).catch(()=>null); if(r) ENC_RESP[p.id]=r; }));
        await Promise.all(Object.values(PROGRAMAS).filter(p=>encPostActiva(p)).map(async p=>{ const r=await fbGet('encuestasPost/'+p.id+'/'+MI_SLUG+'/'+YO.id).catch(()=>null); if(r) ENC_RESP_POST[p.id]=r; }));
      }
    }
    pintarWho(); pintarNav(); render();
    recordatoriosVencimiento();                       // 7 días antes y el día anterior, una vez por programa
    if(ES_STAFF) publicarResumen();                   // resumen para Panel General / Evaluaciones / RRHH
    if(ES_STAFF) iaDisponible();                      // muestra los botones ✨ si la clave está cargada en Cloudflare
  }catch(e){
    $('app').innerHTML='<div class="wrap"><div class="err">No se pudo cargar la Academia ('+esc(e.message)+'). Probá recargar.</div></div>';
  }
})();
</script>
