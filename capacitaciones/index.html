<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Academia de Ventas — Mateu Sports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:ital,wght@0,600;0,700;1,700;1,800&display=swap" rel="stylesheet">
<script src="../shared/iconos.js" defer></script>
<style>
  :root{
    --navy:#0B1527; --rojo:#CC0000; --accent:#e4002b; --azul:#0057b8;
    --fondo:#f6f7f8; --tinta:#1a1c1f; --gris:#6b7280; --borde:#e2e4e8;
    --verde:#1e8e3e; --ambar:#b8860b;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--fondo); color:var(--tinta);
    font-family:'Barlow','Helvetica Neue',sans-serif; font-size:15px; }
  a{ color:var(--accent); }

  .franja{ height:4px; background:linear-gradient(90deg,var(--accent) 0%,var(--accent) 58%,#fff 58%,#fff 61%,var(--azul) 61%,var(--azul) 100%); }
  .topbar{ background:#fff; border-bottom:1px solid var(--borde); padding:0 26px; height:62px;
    display:flex; align-items:center; gap:26px; position:sticky; top:0; z-index:20; }
  .topbar img.logo{ height:30px; display:block; }
  .topbar .marca{ display:flex; flex-direction:column; font-size:9.5px; font-weight:700; letter-spacing:1px; line-height:1.3; color:var(--tinta); border-left:1px solid var(--borde); padding-left:10px; }
  .tabs{ display:flex; gap:20px; height:100%; }
  .tab{ color:var(--gris); text-decoration:none; font-size:15px; font-weight:600; height:100%;
    display:flex; align-items:center; gap:7px; border-bottom:3px solid transparent; cursor:pointer; user-select:none; }
  .tab:hover{ color:var(--tinta); }
  .tab.act{ color:var(--tinta); font-weight:700; border-bottom-color:var(--accent); }
  .who{ margin-left:auto; display:flex; align-items:center; gap:11px; }
  .who .ava{ width:36px; height:36px; border-radius:50%; background:var(--tinta); color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; flex-shrink:0; }
  .who .nom{ font-size:14px; font-weight:700; line-height:1.2; }
  .who .rol{ font-size:12px; color:var(--gris); }
  .who a.salir{ display:flex; align-items:center; padding:8px; border-radius:8px; text-decoration:none; }
  .who a.salir:hover{ background:rgba(0,0,0,.05); }

  .wrap{ max-width:1180px; margin:0 auto; padding:30px 26px 70px; }
  h1{ font-size:28px; font-weight:700; margin:0 0 4px; }
  .sub{ color:var(--gris); margin:0 0 22px; }
  .sec-t{ font-size:14.5px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; margin:30px 0 12px; }
  .card{ background:#fff; border:1px solid var(--borde); border-radius:6px; padding:20px; }
  .grid{ display:grid; gap:18px; }
  .muted{ color:var(--gris); }
  .chip{ display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:600; padding:2px 9px; border-radius:11px; background:#eef0f3; color:var(--tinta); }
  .chip.ok{ background:#e6f4ea; color:var(--verde); }
  .chip.warn{ background:#fdecea; color:var(--accent); }
  .chip.amb{ background:#fdf3d7; color:var(--ambar); }
  .chip.azul{ background:#e8f0fe; color:var(--azul); }

  .btn{ display:inline-flex; align-items:center; gap:7px; border:none; border-radius:4px; cursor:pointer;
    font-family:'Barlow',sans-serif; font-size:14px; font-weight:700; padding:9px 16px; background:#eef0f3; color:var(--tinta); text-decoration:none; }
  .btn:hover{ filter:brightness(.96); }
  .btn.pri{ background:var(--accent); color:#fff; }
  .btn.sec{ background:var(--navy); color:#fff; }
  .btn.mini{ padding:5px 10px; font-size:12.5px; }
  .btn.peligro{ background:#fdecea; color:var(--accent); }
  .btn[disabled]{ opacity:.5; cursor:default; }

  input[type=text],input[type=number],input[type=date],input[type=url],select,textarea{
    width:100%; background:#f2f3f5; border:1px solid var(--borde); border-radius:4px; color:var(--tinta);
    padding:9px 11px; font-size:14px; font-family:'Barlow',sans-serif; }
  input:focus,select:focus,textarea:focus{ outline:none; border-color:#6ea8d8; background:#fff; }
  textarea{ resize:vertical; min-height:70px; }
  label.fl{ display:block; font-size:12.5px; font-weight:700; color:var(--gris); text-transform:uppercase; letter-spacing:.8px; margin:0 0 5px; }
  .fila{ display:flex; gap:14px; flex-wrap:wrap; }
  .fila>div{ flex:1; min-width:160px; }

  table{ width:100%; border-collapse:collapse; font-size:14px; }
  th{ text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:.8px; color:var(--gris); border-bottom:2px solid var(--borde); padding:8px 10px; }
  td{ border-bottom:1px solid #eef0f3; padding:9px 10px; vertical-align:middle; }
  tr:hover td{ background:#fafbfc; }

  .barra{ height:8px; border-radius:4px; background:#e9eaee; overflow:hidden; min-width:70px; }
  .barra>div{ height:100%; background:var(--accent); }
  .barra.v>div{ background:var(--verde); }

  /* Cards de curso (alumno) */
  .cursos-fila{ display:flex; gap:16px; flex-wrap:wrap; }
  .curso-card{ position:relative; width:216px; min-height:220px; border-radius:6px; overflow:hidden; color:#fff;
    display:flex; flex-direction:column; justify-content:flex-end; padding:14px; cursor:pointer; }
  .curso-card:hover{ box-shadow:0 6px 20px rgba(0,0,0,.22); }
  .curso-card .cc-top{ position:absolute; top:10px; left:10px; right:10px; display:flex; justify-content:space-between; align-items:center; }
  .curso-card .cc-dur{ background:rgba(20,20,20,.5); font-size:12px; font-weight:600; padding:3px 8px; border-radius:4px; }
  .curso-card .cc-nom{ font-size:16px; font-weight:800; text-transform:uppercase; line-height:1.15; text-shadow:0 1px 4px rgba(0,0,0,.35); }
  .curso-card .cc-est{ margin-top:8px; font-size:12.5px; font-weight:600; }
  .curso-card .tilde{ width:30px; height:30px; border-radius:50%; background:rgba(20,20,20,.45); display:flex; align-items:center; justify-content:center; }
  .curso-card .tilde.ok{ background:var(--verde); }

  /* Detalle de curso */
  .mod{ border:1px solid var(--borde); border-radius:6px; padding:16px 18px; background:#fff; margin-bottom:12px; }
  .mod .m-cab{ display:flex; align-items:center; gap:12px; }
  .mod .m-num{ width:28px; height:28px; border-radius:50%; background:#eef0f3; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex-shrink:0; }
  .mod.ok .m-num{ background:var(--verde); color:#fff; }
  .mod .m-tit{ font-weight:700; font-size:15.5px; flex:1; }
  .mod .m-cuerpo{ margin:12px 0 0 40px; color:#333; line-height:1.55; }
  .mod .m-cuerpo p{ margin:0 0 10px; }
  .video-marco{ position:relative; padding-top:56.25%; border-radius:6px; overflow:hidden; background:#000; }
  .video-marco iframe{ position:absolute; inset:0; width:100%; height:100%; border:none; }

  .preg{ border:1px solid var(--borde); border-radius:6px; padding:14px 16px; background:#fff; margin-bottom:10px; }
  .preg .q{ font-weight:700; margin-bottom:9px; }
  .preg label.op{ display:flex; gap:9px; align-items:flex-start; padding:6px 8px; border-radius:5px; cursor:pointer; font-size:14.5px; }
  .preg label.op:hover{ background:#f6f7f8; }
  .preg.bien{ border-color:var(--verde); }
  .preg.mal{ border-color:var(--accent); }

  /* Badges hexagonales */
  .badges{ display:flex; gap:12px; flex-wrap:wrap; }
  .badge-hex{ width:64px; text-align:center; }
  .badge-hex svg{ filter:drop-shadow(0 3px 5px rgba(0,0,0,.18)); }
  .badge-hex .b-nom{ font-size:10.5px; font-weight:600; color:var(--gris); line-height:1.2; margin-top:3px; }

  /* Modal */
  .velo{ position:fixed; inset:0; background:rgba(10,14,20,.55); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .modal{ background:#fff; border-radius:8px; max-width:560px; width:100%; max-height:88vh; overflow:auto; padding:24px; }
  .modal h2{ margin:0 0 6px; font-size:20px; }

  /* Certificado */
  #certVista{ position:fixed; inset:0; background:rgba(10,14,20,.65); z-index:60; display:flex; align-items:center; justify-content:center; padding:20px; overflow:auto; }
  .cert{ background:#fff; width:820px; max-width:100%; padding:52px 58px; border:10px solid var(--navy); position:relative; }
  .cert .c-borde{ position:absolute; inset:8px; border:2px solid var(--accent); pointer-events:none; }
  .cert .c-logo{ height:40px; }
  .cert .c-tit{ font-family:'Barlow Condensed',sans-serif; font-style:italic; font-weight:800; font-size:42px; letter-spacing:2px; margin:22px 0 4px; color:var(--navy); }
  .cert .c-quien{ font-size:32px; font-weight:800; margin:14px 0 2px; color:var(--accent); }
  .cert .c-firmas{ display:flex; gap:60px; margin-top:44px; }
  .cert .c-firma{ flex:1; text-align:center; border-top:1.5px solid var(--tinta); padding-top:8px; font-size:14px; }
  .cert .c-firma b{ display:block; font-size:15px; }
  @media print{
    body *{ visibility:hidden; }
    #certVista, #certVista *{ visibility:visible; }
    #certVista{ position:absolute; inset:0; background:#fff; padding:0; }
    .cert{ border-width:8px; box-shadow:none; width:100%; }
    .no-print{ display:none !important; }
  }

  .vacio{ border:1.5px dashed var(--borde); border-radius:6px; padding:34px 20px; text-align:center; color:var(--gris); background:#fff; }
  .err{ background:#fdecea; border:1px solid #f5c6c0; color:#8a1f11; border-radius:6px; padding:12px 16px; margin-bottom:16px; }
  @media (max-width:760px){
    .topbar{ padding:0 14px; gap:14px; overflow-x:auto; }
    .wrap{ padding:20px 14px 60px; }
    .who .nom,.who .rol{ display:none; }
  }
</style>

<body>
<div class="franja"></div>
<div class="topbar">
  <a href="../" title="Volver al Portal"><img class="logo" src="assets/logo-mateu.png" alt="Mateu Sports"></a>
  <div class="marca"><span>ACADEMIA</span><span>DE VENTAS</span></div>
  <div class="tabs" id="tabs"></div>
  <div class="who">
    <div class="ava" id="whoAva">·</div>
    <div><div class="nom" id="whoNom">—</div><div class="rol" id="whoRol">—</div></div>
    <a class="salir" href="../" title="Volver al Portal">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M10 4 H5.5 V20 H10" stroke="#6b7280" stroke-width="1.8" stroke-linecap="round"/><path d="M14 8 L18 12 L14 16 M18 12 H9" stroke="#6b7280" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </div>
</div>
<div class="wrap" id="app"><div class="muted">Cargando…</div></div>

<script>
/* ============================================================
   ACADEMIA DE VENTAS — versión funcional
   ------------------------------------------------------------
   - Cursos y programas los carga el capacitador (Iván) y quedan en
     Firebase: base recepciones-mateu (reglas abiertas, ya en vivo),
     nodo aparte `capacitaciones/` (no toca recepciones/, barrida/,
     objetivos/, ingreso/).
   - El avance es POR PERSONA: la cuenta de sucursal elige quién es
     (dotación de Indicadores) y cada uno marca módulos + rinde el quiz.
   - Guardado agrupado por slug (avances/<slug>/...) para que cada
     sucursal baje solo lo suyo (seguridad blanda, como Indicadores).
   - Aviso de programa nuevo → Bandeja del Portal (mensajes-mateu).
   Las pantallas .dc.html de la carpeta son el prototipo de Design que
   originó este módulo; quedan como referencia visual.
   ============================================================ */

/* ---------- config ---------- */
const FIREBASE_DB_URL = 'https://recepciones-mateu-default-rtdb.firebaseio.com';
const ROOT = 'capacitaciones';
const MENSAJES_DB_URL = 'https://mensajes-mateu-default-rtdb.firebaseio.com';

const CAPACITADOR_FIRMA = 'Iván Nicoloff';
const SUPERVISOR_FIRMA  = 'Cristian Campion';

const COMPETENCIAS = ['Venta y servicio','Producto de marca','Digital y omnicanal','Operaciones de tienda',
  'Ejecución visual','Perspectivas comerciales','Liderándome a mí mismo','Liderando mi equipo'];
const COLORES_CURSO = ['#1e88e5','#d81b60','#7cb342','#f4a300','#5e35b1','#00897b','#e4002b','#455a64'];

/* Personas conocidas (mail → identidad) para el header del staff. */
const PERSONAS_MAIL = {
  'capacitacion@mateu.com.ar':     { nombre:'Iván Nicoloff',    rol:'Capacitador · Admin' },
  'cristian.campion@mateu.com.ar': { nombre:'Cristian Campion', rol:'Supervisor · Admin' },
  'julian@mateu.com.ar':           { nombre:'Julián Mateu',     rol:'Gerencia · Admin' }
};

/* slug del Portal → sucursal de datos en Indicadores (mismo mapa que Buscador/RRHH). */
const SLUG_SUC_IND = {
  'calle-12':'12-MS Calle 12','city-bell':'06-MS City Bell','calle-47':'08-MS Calle 47',
  'calle-49':'19-MS Calle 49','los-hornos':'13-MS Los Hornos','plaza':'01-MS Plaza Italia',
  'berisso':'16-MS Berisso','ensenada':'11-MS Ensenada','kids':'02-Mateu Kids',
  'aurelius-12':'04-Aurelius Calle 12','aurelius-5':'18-Aurelius Calle 5','aurelius-cb':'17-Aurelius City Bell',
  'adidas-12':'21-Adidas Calle 12','adidas':'09-Adidas Av. 7','originals':'15-Adidas Originals',
};
const GRUPO_ROL_IND = { Jefatura:'encargado', Ventas:'vendedor', Caja:'cajera', Refuerzos:'deposito' };
const ROL_LABEL_PERSONA = { encargado:'Encargado/a', vendedor:'Vendedor/a', cajera:'Caja', deposito:'Depósito' };
const ROLES_DESTINO = ['encargado','vendedor','cajera','deposito'];

/* ---------- sesión ---------- */
const SESSION_KEY = 'mateu_portal_session';
function readSession(){ try{ const s=localStorage.getItem(SESSION_KEY); return s?JSON.parse(s):null; }catch(e){ return window.__sess||null; } }
const SESSION = readSession();
if(!SESSION || !SESSION.rol){ location.replace('../'); }
const ES_STAFF = SESSION && (SESSION.rol==='admin' || SESSION.rol==='capacitador' || SESSION.rol==='supervisor');
const puedeVer = SESSION && (ES_STAFF || (SESSION.herramientas||[]).includes('capacitaciones'));
if(SESSION && SESSION.rol && !puedeVer){ location.replace('../'); }
const MI_SLUG = SESSION ? (SESSION.sucursal || SESSION.outlet_id || null) : null;

/* ---------- utilidades ---------- */
const $ = id => document.getElementById(id);
const esc = s => (s===null||s===undefined)?'':String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
async function fbGet(path){ const r = await fetch(FIREBASE_DB_URL+'/'+ROOT+'/'+path+'.json'); if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }
async function fbPut(path, data){ const r = await fetch(FIREBASE_DB_URL+'/'+ROOT+'/'+path+'.json',{method:'PUT',body:JSON.stringify(data),headers:{'Content-Type':'application/json'}}); if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }
async function fbPost(path, data){ const r = await fetch(FIREBASE_DB_URL+'/'+ROOT+'/'+path+'.json',{method:'POST',body:JSON.stringify(data),headers:{'Content-Type':'application/json'}}); if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }
async function fbDel(path){ const r = await fetch(FIREBASE_DB_URL+'/'+ROOT+'/'+path+'.json',{method:'DELETE'}); if(!r.ok) throw new Error('HTTP '+r.status); }
async function getJSON(url){ const r = await fetch(url); if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }
function nuevoId(pref){ return pref+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

/* Archivos (PDF/PPT/etc.) subidos por el capacitador: se guardan en Firebase
   como base64 EN PARTES (RTDB limita ~10 MB por escritura), nodo archivos/<fid>.
   El alumno los reconstruye en un Blob al descargar. Tope 20 MB por archivo;
   si la Academia acumula muchos pesados, migrar a Firebase Storage. */
const ARCHIVO_MAX_MB = 20;
const ARCHIVO_CHUNK = 4000000;   // caracteres base64 por parte (~3 MB reales)
async function subirArchivo(file, onProgreso){
  const fid = nuevoId('f');
  const dataUrl = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(new Error('no se pudo leer el archivo')); r.readAsDataURL(file); });
  const b64 = dataUrl.slice(dataUrl.indexOf(',')+1);
  const n = Math.ceil(b64.length/ARCHIVO_CHUNK);
  await fbPut('archivos/'+fid+'/meta', { nombre:file.name, mime:file.type||'application/octet-stream', size:file.size, n, ts:Date.now(), por:SESSION.email });
  for(let i=0;i<n;i++){
    if(onProgreso) onProgreso(i+1,n);
    await fbPut('archivos/'+fid+'/c/'+i, b64.slice(i*ARCHIVO_CHUNK,(i+1)*ARCHIVO_CHUNK));
  }
  return fid;
}
async function bajarArchivo(fid){
  const meta = await fbGet('archivos/'+fid+'/meta');
  if(!meta) throw new Error('archivo no encontrado');
  let b64 = '';
  for(let i=0;i<meta.n;i++) b64 += await fbGet('archivos/'+fid+'/c/'+i);
  const bin = atob(b64); const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return { blob:new Blob([arr],{type:meta.mime}), meta };
}
function hoyISO(){ return new Date().toISOString().slice(0,10); }
function fechaLarga(ts){ try{ return new Date(ts).toLocaleDateString('es-AR',{day:'numeric',month:'long',year:'numeric'}); }catch(e){ return ''; } }
function titleNombre(s){ return (s||'').toLowerCase().replace(/(^|[\s'’-])([a-záéíóúñü])/g,(m,p,c)=>p+c.toUpperCase()); }
function idFromNombre(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }
function archivoInd(nombre){ return nombre.replace(/\./g,'').replace(/\s+/g,'-'); }
function iniciales(nombre){ return (nombre||'·').split(/\s+/).map(w=>w.charAt(0)).join('').slice(0,2).toUpperCase(); }
function diasHasta(iso){ if(!iso) return null; const d=(new Date(iso+'T23:59:59')-Date.now())/86400000; return Math.ceil(d); }
function pct(n,d){ return d? Math.round(100*n/d) : 0; }
function esUrlYoutube(u){ const m=(u||'').match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([\w-]{6,})/); return m?m[1]:null; }

/* ---------- estado ---------- */
let CURSOS = {};        // id → curso
let PROGRAMAS = {};     // id → programa
let AVANCES = {};       // staff: slug → persona → curso → avance | alumno: persona → curso → avance
let YO = null;          // alumno: {id, nombre, rol}
let TAB = ES_STAFF ? 'cursos' : 'mio';
let DOT_CACHE = {};     // slug → [{id,nombre,rol}]
let PERIODO_IND = null;

/* ---------- header ---------- */
(function pintarWho(){
  if(!SESSION) return;
  let p = PERSONAS_MAIL[(SESSION.email||'').toLowerCase()];
  if(!p){
    const base=(SESSION.email||'').split('@')[0].replace(/[._-]+/g,' ');
    p = { nombre: titleNombre(base)||SESSION.email, rol: ES_STAFF?'Staff':'Sucursal' };
  }
  $('whoAva').textContent = iniciales(p.nombre);
  $('whoNom').textContent = p.nombre;
  $('whoRol').textContent = p.rol;
})();

/* ---------- tabs ---------- */
const TABS_STAFF = [ ['cursos','📚 Cursos'], ['programas','🗂 Programas'], ['equipo','👥 Equipo'], ['ranking','🏆 Ranking'], ['encuestas','📊 Encuestas'] ];
const TABS_ALUMNO = [ ['mio','🎓 Mi programa'] ];
function pintarTabs(){
  const lista = ES_STAFF ? TABS_STAFF : TABS_ALUMNO;
  $('tabs').innerHTML = lista.map(([id,lbl])=>'<span class="tab'+(TAB===id?' act':'')+'" data-tab="'+id+'">'+lbl+'</span>').join('');
  $('tabs').querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{ TAB=t.dataset.tab; PREVIEW_CURSO=null; pintarTabs(); render(); }));
}

/* ---------- dotación desde Indicadores ---------- */
async function ultimoPeriodo(){
  if(PERIODO_IND) return PERIODO_IND;
  const p = (await getJSON('../data/indicadores/periodos.json').catch(()=>({periodos:[]}))).periodos||[];
  PERIODO_IND = p.length ? p[0].id : null;
  return PERIODO_IND;
}
async function dotacion(slug){
  if(DOT_CACHE[slug]) return DOT_CACHE[slug];
  const dataName = SLUG_SUC_IND[slug];
  if(!dataName){ DOT_CACHE[slug]=[]; return []; }
  const per = await ultimoPeriodo();
  if(!per){ DOT_CACHE[slug]=[]; return []; }
  const d = await getJSON('../data/indicadores/'+per+'/'+archivoInd(dataName)+'.json').catch(()=>null);
  const out = [];
  ((d&&d.vendedores)||[]).forEach(v=>{
    if(v.cubre) return;
    const rol = GRUPO_ROL_IND[v.grupo]; if(!rol) return;
    out.push({ id:idFromNombre(v.vendedor), nombre:titleNombre(v.vendedor), rol });
  });
  out.sort((a,b)=> (a.rol===b.rol) ? a.nombre.localeCompare(b.nombre) : (a.rol==='encargado'?-1: b.rol==='encargado'?1: a.rol.localeCompare(b.rol)));
  DOT_CACHE[slug]=out; return out;
}

/* ---------- asignación: qué cursos le tocan a una persona ---------- */
function programasDe(slug, rolPersona){
  return Object.values(PROGRAMAS).filter(p=>{
    if(p.activo===false) return false;
    const okRol = !(p.roles&&p.roles.length) || p.roles.includes(rolPersona);
    const okSuc = !(p.sucursales&&p.sucursales.length) || p.sucursales.includes(slug);
    return okRol && okSuc;
  }).sort((a,b)=>(a.ts||0)-(b.ts||0));
}
function cursosDe(slug, rolPersona){
  const vistos = new Set(); const out=[];
  programasDe(slug, rolPersona).forEach(p=>(p.cursos||[]).forEach(cid=>{
    if(vistos.has(cid) || !CURSOS[cid] || CURSOS[cid].activo===false) return;
    vistos.add(cid); out.push({curso:CURSOS[cid], programa:p});
  }));
  return out;
}
/* Cuerpo de un módulo (compartido entre la vista del alumno y la vista previa del staff). */
function cuerpoModulo(m){
  if(m.tipo==='video'){
    const yt = esUrlYoutube(m.contenido);
    return yt ? '<div class="video-marco"><iframe src="https://www.youtube.com/embed/'+yt+'" allowfullscreen loading="lazy"></iframe></div>'
              : '<a class="btn" target="_blank" rel="noopener" href="'+esc(m.contenido)+'">▶ Ver video</a>';
  }
  if(m.tipo==='archivo') return '<button class="btn" data-arch="'+esc(m.contenido)+'">📥 Descargar '+esc(m.archivoNombre||'material')+'</button>';
  if(m.tipo==='enlace') return '<a class="btn" target="_blank" rel="noopener" href="'+esc(m.contenido)+'">📄 Abrir material</a>';
  return esc(m.contenido||'').split(/\n{2,}/).map(p=>'<p>'+p.replace(/\n/g,'<br>')+'</p>').join('');
}
function bindArchivos(app){
  app.querySelectorAll('[data-arch]').forEach(b=>b.addEventListener('click', async ()=>{
    const orig = b.textContent; b.disabled=true; b.textContent='Descargando…';
    try{
      const {blob, meta} = await bajarArchivo(b.dataset.arch);
      const url = URL.createObjectURL(blob);
      if((meta.mime||'').indexOf('pdf')>=0){ window.open(url,'_blank'); }
      else{ const a=document.createElement('a'); a.href=url; a.download=meta.nombre||'material'; document.body.appendChild(a); a.click(); a.remove(); }
    }catch(err){ alert('No se pudo descargar el material: '+err.message); }
    b.disabled=false; b.textContent=orig;
  }));
}

function estadoCurso(av, curso){
  const a = av||{};
  const nm = (curso.modulos||[]).length;
  const modsOk = Object.keys(a.mods||{}).length;
  const hayQuiz = !!(curso.quiz && (curso.quiz.preguntas||[]).length);
  const quizOk = !hayQuiz || !!(a.quiz && a.quiz.ok);
  const total = nm + (hayQuiz?1:0);
  const hecho = Math.min(modsOk,nm) + ((hayQuiz && quizOk)?1:0);
  const completo = !!a.fin || (total>0 && hecho>=total);
  return { modsOk, nm, hayQuiz, quizOk, avance: total? Math.round(100*hecho/total) : 0, completo, empezado: modsOk>0 || !!(a.quiz&&a.quiz.int) };
}

function avanceYo(cid){ return ((AVANCES[YO.id]||{})[cid]) || null; }

function renderCursoAlumno(cid){
  const app = $('app');
  const c = CURSOS[cid];
  if(!c){ CURSO_ABIERTO=null; renderAlumno(); return; }
  const av = avanceYo(cid) || {};
  const est = estadoCurso(av, c);
  const html = [];
  html.push('<p style="margin:0 0 14px"><a href="#" id="volver">← Volver a mi programa</a></p>');
  html.push('<h1>'+esc(c.titulo)+'</h1>');
  html.push('<p class="sub">'+esc(c.competencia||'')+(c.dur?' · '+esc(c.dur):'')+' · avance '+est.avance+'%'+(est.completo?' · <span class="chip ok">Completado</span>':'')+'</p>');
  if(c.desc) html.push('<div class="card" style="margin-bottom:18px;line-height:1.55">'+esc(c.desc).replace(/\n/g,'<br>')+'</div>');

  (c.modulos||[]).forEach((m,i)=>{
    const ok = !!(av.mods&&av.mods[i]);
    const cuerpo = cuerpoModulo(m);
    html.push('<div class="mod'+(ok?' ok':'')+'"><div class="m-cab"><span class="m-num">'+(ok?'✓':(i+1))+'</span>'+
      '<span class="m-tit">'+esc(m.titulo||('Módulo '+(i+1)))+'</span>'+
      '<button class="btn mini'+(ok?'':' pri')+'" data-mod="'+i+'">'+(ok?'Visto ✓':'Marcar visto')+'</button></div>'+
      '<div class="m-cuerpo">'+cuerpo+'</div></div>');
  });

  if(est.hayQuiz){
    const q = c.quiz;
    html.push('<div class="sec-t">Evaluación</div>');
    if(av.quiz && av.quiz.ok){
      html.push('<div class="card"><span class="chip ok">Aprobada</span> &nbsp;Sacaste <b>'+av.quiz.pje+'%</b> ('+fechaLarga(av.quiz.ts)+').'+
        (est.completo?' &nbsp;<button class="btn sec mini" id="btnCert">🎓 Ver mi certificado</button>':'')+'</div>');
    } else {
      const bloqueada = est.nm>0 && est.modsOk<est.nm;
      if(bloqueada){
        html.push('<div class="card muted">Marcá como vistos los '+est.nm+' módulos para habilitar la evaluación. '+
          (av.quiz&&av.quiz.int?('Intentos hasta ahora: '+av.quiz.int+' (último: '+av.quiz.pje+'%).'):'')+'</div>');
      } else {
        html.push('<form id="quizForm">');
        (q.preguntas||[]).forEach((p,pi)=>{
          html.push('<div class="preg" data-p="'+pi+'"><div class="q">'+(pi+1)+'. '+esc(p.q)+'</div>'+
            (p.ops||[]).map((op,oi)=>'<label class="op"><input type="radio" name="p'+pi+'" value="'+oi+'"> <span>'+esc(op)+'</span></label>').join('')+'</div>');
        });
        html.push('<button class="btn pri" type="submit">Entregar evaluación</button> <span class="muted">Se aprueba con '+(q.aprueba||70)+'% o más.'+(av.quiz&&av.quiz.int?(' Intentos: '+av.quiz.int+'.'):'')+'</span></form>');
      }
    }
  } else if(est.completo){
    html.push('<div class="card"><span class="chip ok">Curso completado</span> &nbsp;<button class="btn sec mini" id="btnCert">🎓 Ver mi certificado</button></div>');
  }

  // Encuesta post-curso
  if(est.completo && !av.encTs){
    html.push('<div class="sec-t">Contanos cómo estuvo</div><div class="card" id="encCard">'+
      '<div class="fila">'+[['e1','El contenido'],['e2','La claridad'],['e3','La utilidad para mi trabajo']].map(([id,lbl])=>
        '<div><label class="fl">'+lbl+'</label><select id="'+id+'">'+[5,4,3,2,1].map(v=>'<option value="'+v+'">'+'⭐'.repeat(v)+' ('+v+')</option>').join('')+'</select></div>').join('')+'</div>'+
      '<div style="margin-top:12px"><label class="fl">Comentario (opcional)</label><textarea id="eCom" placeholder="¿Qué mejorarías? ¿Qué te sirvió más?"></textarea></div>'+
      '<div style="margin-top:12px"><button class="btn pri" id="encEnviar">Enviar encuesta</button></div></div>');
  } else if(est.completo && av.encTs){
    html.push('<p class="muted" style="margin-top:16px">Gracias por responder la encuesta de este curso 🙌</p>');
  }

  app.innerHTML = html.join('');
  $('volver').addEventListener('click',e=>{ e.preventDefault(); CURSO_ABIERTO=null; render(); });
  app.querySelectorAll('[data-mod]').forEach(b=>b.addEventListener('click', async ()=>{
    const i = b.dataset.mod;
    const nuevo = Object.assign({}, av); nuevo.mods = Object.assign({}, av.mods||{});
    if(nuevo.mods[i]) delete nuevo.mods[i]; else nuevo.mods[i]=1;
    const e2 = estadoCurso(nuevo, c);
    if(e2.completo && !nuevo.fin) nuevo.fin = Date.now();
    b.disabled=true;
    try{ await guardarAvanceYo(cid, nuevo); }catch(err){ alert('No se pudo guardar: '+err.message); }
    render();
  }));
  bindArchivos(app);
  const qf = $('quizForm');
  if(qf) qf.addEventListener('submit', async e=>{
    e.preventDefault();
    const pregs = c.quiz.preguntas||[];
    let bien=0, sinResp=false;
    pregs.forEach((p,pi)=>{ const v=qf.querySelector('input[name=p'+pi+']:checked'); if(!v){ sinResp=true; return; } if(+v.value===+p.ok) bien++; });
    if(sinResp){ alert('Respondé todas las preguntas antes de entregar.'); return; }
    const pje = pct(bien, pregs.length);
    const ok = pje >= (c.quiz.aprueba||70);
    const nuevo = Object.assign({}, av);
    nuevo.quiz = { pje, ok, ts:Date.now(), int:((av.quiz&&av.quiz.int)||0)+1 };
    const e2 = estadoCurso(nuevo, c);
    if(e2.completo && !nuevo.fin) nuevo.fin = Date.now();
    try{ await guardarAvanceYo(cid, nuevo); }catch(err){ alert('No se pudo guardar: '+err.message); return; }
    // feedback visual pregunta por pregunta
    pregs.forEach((p,pi)=>{ const div=qf.querySelector('[data-p="'+pi+'"]'); const v=qf.querySelector('input[name=p'+pi+']:checked');
      if(div) div.classList.add((+v.value===+p.ok)?'bien':'mal'); });
    setTimeout(()=>{ alert(ok? ('¡Aprobaste con '+pje+'%! 🎉') : ('Sacaste '+pje+'%. Necesitás '+(c.quiz.aprueba||70)+'%. Repasá los módulos y volvé a intentar.')); render(); }, 250);
  });
  const bc = $('btnCert'); if(bc) bc.addEventListener('click',()=>verCertificado(cid, YO.nombre));
  const ee = $('encEnviar'); if(ee) ee.addEventListener('click', async ()=>{
    ee.disabled=true;
    try{
      await fbPost('encuestas/'+cid, { de:YO.nombre, slug:MI_SLUG, r1:+$('e1').value, r2:+$('e2').value, r3:+$('e3').value, com:$('eCom').value.trim(), ts:Date.now() });
      const nuevo = Object.assign({}, av, {encTs:Date.now()});
      await guardarAvanceYo(cid, nuevo);
    }catch(err){ alert('No se pudo enviar: '+err.message); }
    render();
  });
}

  const fecha = fechaLarga((av&&av.fin)||Date.now());

    '<img class="c-logo" src="assets/logo-mateu.png" alt="Mateu Sports">'+

    '<div class="muted">La Academia de Ventas de Mateu Sports certifica que</div>'+
    '<div class="c-quien">'+esc(nombre)+'</div>'+
    '<div style="font-size:16px">completó satisfactoriamente el curso</div>'+
    '<div style="font-size:22px;font-weight:800;margin:6px 0 2px">'+esc(c.titulo)+'</div>'+
    '<div class="muted" style="font-size:14px">'+esc(c.competencia||'')+(c.dur?' · '+esc(c.dur):'')+' · '+fecha+'</div>'+
    '<div class="c-firmas"><div class="c-firma"><b>'+esc(CAPACITADOR_FIRMA)+'</b>Capacitador</div>'+
    '<div class="c-firma"><b>'+esc(SUPERVISOR_FIRMA)+'</b>Supervisor</div></div></div>'+
    '<div class="no-print" style="text-align:center;margin-top:14px;display:flex;gap:10px;justify-content:center">'+
    '<button class="btn pri" id="certImp">🖨 Imprimir / guardar PDF</button>'+
    '<button class="btn" id="certCerrar" style="background:#fff">Cerrar</button></div></div>';
  document.body.appendChild(velo);
  velo.querySelector('#certImp').addEventListener('click',()=>window.print());
  velo.querySelector('#certCerrar').addEventListener('click',()=>velo.remove());
  velo.addEventListener('click',e=>{ if(e.target===velo) velo.remove(); });
}

function renderCursosStaff(){
  const app = $('app');
  if(EDIT_CURSO) return renderEditorCurso();
  const lista = Object.values(CURSOS).sort((a,b)=>(a.ts||0)-(b.ts||0));
  const html = ['<h1>Cursos</h1><p class="sub">El contenido de la Academia: módulos de lectura, video o material + evaluación.</p>'];
  html.push('<p><button class="btn pri" id="nuevoCurso">＋ Nuevo curso</button></p>');
  if(!lista.length) html.push('<div class="vacio">Todavía no hay cursos. Creá el primero con «Nuevo curso».</div>');
  else{

  (c.modulos||[]).forEach((m,i)=>{
    html.push('<div class="card" style="margin-bottom:10px"><div class="fila">'+
      '<div style="flex:2;min-width:220px"><label class="fl">Título del módulo '+(i+1)+'</label><input type="text" data-mt="'+i+'" value="'+esc(m.titulo||'')+'"></div>'+
      '<div><label class="fl">Tipo</label><select data-mtipo="'+i+'">'+
        ['texto','video','archivo','enlace'].map(t=>'<option value="'+t+'"'+(m.tipo===t?' selected':'')+'>'+({texto:'Texto / lectura',video:'Video (YouTube)',archivo:'Archivo (PDF / PowerPoint)',enlace:'Material (link externo)'}[t])+'</option>').join('')+'</select></div>'+
      '<div style="align-self:flex-end"><button class="btn mini peligro" data-mdel="'+i+'">🗑 Quitar</button></div></div>'+
      '<div style="margin-top:10px">'+
      (m.tipo==='texto' ? '<label class="fl">Contenido</label><textarea data-mc="'+i+'" placeholder="El texto que lee el vendedor. Doble enter = párrafo nuevo.">'+esc(m.contenido||'')+'</textarea>'
        : m.tipo==='archivo' ? '<label class="fl">Archivo</label>'+
          (m.contenido ? '<p style="margin:0 0 8px;font-size:14px">Subido: <b>'+esc(m.archivoNombre||m.contenido)+'</b> ✓ — elegir otro archivo lo reemplaza.</p>' : '')+
          '<input type="file" data-mf="'+i+'" accept=".pdf,.ppt,.pptx,.doc,.docx,.xls,.xlsx"> '+
          '<span class="muted" data-mfst="'+i+'" style="font-size:13px"></span>'+
          '<p class="muted" style="font-size:12.5px;margin:7px 0 0">Máx. '+ARCHIVO_MAX_MB+' MB. Si el PPT pesa mucho por las fotos, conviene exportarlo a PDF.</p>'
        : '<label class="fl">URL</label><input type="url" data-mc="'+i+'" value="'+esc(m.contenido||'')+'" placeholder="https://…">')+'</div></div>');
  });
  html.push('</div><p><button class="btn" id="addMod">＋ Agregar módulo</button></p>');

  const q = c.quiz || {aprueba:70,preguntas:[]};
  html.push('<div class="sec-t">Evaluación ('+(q.preguntas||[]).length+' preguntas)</div>');
  html.push('<div class="card" style="margin-bottom:10px"><label class="fl">Se aprueba con (%)</label><input type="number" id="qAprueba" value="'+(q.aprueba||70)+'" min="10" max="100" style="max-width:120px"></div>');
  (q.preguntas||[]).forEach((p,i)=>{
    html.push('<div class="card" style="margin-bottom:10px"><div class="fila">'+
      '<div style="flex:3;min-width:240px"><label class="fl">Pregunta '+(i+1)+'</label><input type="text" data-qq="'+i+'" value="'+esc(p.q||'')+'"></div>'+
      '<div style="align-self:flex-end"><button class="btn mini peligro" data-qdel="'+i+'">🗑 Quitar</button></div></div>'+
      '<div class="fila" style="margin-top:10px">'+
      '<div style="flex:3;min-width:240px"><label class="fl">Opciones (una por línea)</label><textarea data-qo="'+i+'">'+esc((p.ops||[]).join('\n'))+'</textarea></div>'+
      '<div><label class="fl">Correcta (Nº de línea)</label><input type="number" data-qok="'+i+'" value="'+((+p.ok||0)+1)+'" min="1" style="max-width:110px"></div></div></div>');
  });
  html.push('<p><button class="btn" id="addPreg">＋ Agregar pregunta</button></p>');

  html.push('<div style="margin-top:22px;display:flex;gap:10px"><button class="btn pri" id="guardarCurso">💾 Guardar curso</button>'+
    '<button class="btn" id="cancelarCurso" style="background:#fff">Cancelar</button></div>');
  app.innerHTML = html.join('');

  function leerForm(){
    c.titulo = $('cTit').value.trim(); c.dur = $('cDur').value.trim();
    c.competencia = $('cComp').value; c.color = $('cColor').value; c.desc = $('cDesc').value.trim();
    app.querySelectorAll('[data-mt]').forEach(inp=>{ c.modulos[+inp.dataset.mt].titulo = inp.value.trim(); });
    app.querySelectorAll('[data-mtipo]').forEach(inp=>{ c.modulos[+inp.dataset.mtipo].tipo = inp.value; });
    app.querySelectorAll('[data-mc]').forEach(inp=>{ c.modulos[+inp.dataset.mc].contenido = inp.value.trim(); });
    c.quiz = c.quiz||{}; c.quiz.aprueba = Math.max(10, Math.min(100, +$('qAprueba').value||70));
    c.quiz.preguntas = c.quiz.preguntas||[];
    app.querySelectorAll('[data-qq]').forEach(inp=>{ c.quiz.preguntas[+inp.dataset.qq].q = inp.value.trim(); });
    app.querySelectorAll('[data-qo]').forEach(inp=>{ c.quiz.preguntas[+inp.dataset.qo].ops = inp.value.split('\n').map(s=>s.trim()).filter(Boolean); });
    app.querySelectorAll('[data-qok]').forEach(inp=>{ c.quiz.preguntas[+inp.dataset.qok].ok = Math.max(0,(+inp.value||1)-1); });
  }
  $('volver').addEventListener('click',e=>{ e.preventDefault(); EDIT_CURSO=null; render(); });
  $('cancelarCurso').addEventListener('click',()=>{ EDIT_CURSO=null; render(); });
  $('addMod').addEventListener('click',()=>{ leerForm(); c.modulos.push({titulo:'',tipo:'texto',contenido:''}); render(); });
  $('addPreg').addEventListener('click',()=>{ leerForm(); c.quiz.preguntas.push({q:'',ops:[],ok:0}); render(); });
  app.querySelectorAll('[data-mdel]').forEach(b=>b.addEventListener('click',()=>{ leerForm(); c.modulos.splice(+b.dataset.mdel,1); render(); }));
  app.querySelectorAll('[data-qdel]').forEach(b=>b.addEventListener('click',()=>{ leerForm(); c.quiz.preguntas.splice(+b.dataset.qdel,1); render(); }));
  // Cambiar el tipo re-dibuja el campo de contenido (texto/URL/archivo).
  app.querySelectorAll('[data-mtipo]').forEach(sel=>sel.addEventListener('change',()=>{ leerForm(); render(); }));
  // Subida de archivo: se sube a Firebase apenas se elige, en partes.
  app.querySelectorAll('[data-mf]').forEach(inp=>inp.addEventListener('change', async ()=>{
    const f = inp.files && inp.files[0]; if(!f) return;
    if(f.size > ARCHIVO_MAX_MB*1048576){
      alert('«'+f.name+'» pesa '+(f.size/1048576).toFixed(1)+' MB y el máximo es '+ARCHIVO_MAX_MB+' MB.\nSi es un PowerPoint con muchas fotos, exportalo a PDF y subí ese.');
      inp.value=''; return;
    }
    leerForm();
    const st = app.querySelector('[data-mfst="'+inp.dataset.mf+'"]');
    inp.disabled = true;
    try{
      const fid = await subirArchivo(f, (i,n)=>{ if(st) st.textContent = 'Subiendo… parte '+i+' de '+n; });
      const m = c.modulos[+inp.dataset.mf];
      m.contenido = fid; m.archivoNombre = f.name;
      if(!m.titulo) m.titulo = f.name.replace(/\.[^.]+$/,'');
      render();
    }catch(err){
      alert('No se pudo subir el archivo: '+err.message);
      inp.disabled=false; if(st) st.textContent='';
    }
  }));
  $('guardarCurso').addEventListener('click', async ()=>{
    leerForm();
    if(!c.titulo){ alert('Poné un título al curso.'); return; }
    const malas = (c.quiz.preguntas||[]).filter(p=>p.q && (p.ops.length<2 || p.ok>=p.ops.length));
    if(malas.length){ alert('Hay preguntas con menos de 2 opciones o con la correcta fuera de rango.'); return; }
    c.quiz.preguntas = (c.quiz.preguntas||[]).filter(p=>p.q && p.ops.length>=2);
    c.modulos = (c.modulos||[]).filter(m=>m.titulo||m.contenido);
    try{ await fbPut('cursos/'+c.id, c); CURSOS[c.id]=c; EDIT_CURSO=null; render(); }
    catch(err){ alert('No se pudo guardar: '+err.message); }
  });
}

/* ---------- staff: equipo ---------- */
async function renderEquipo(){
  const app = $('app');
  app.innerHTML = '<h1>Equipo</h1><p class="sub">Avance persona por persona en la sucursal elegida.</p><div class="muted">Cargando…</div>';
  const dot = await dotacion(EQ_SLUG);
  const avs = AVANCES[EQ_SLUG] || {};
  const html = ['<h1>Equipo</h1><p class="sub">Avance persona por persona en la sucursal elegida.</p>'];
  html.push('<p><select id="eqSel" style="max-width:260px">'+Object.keys(SLUG_SUC_IND).map(s=>'<option value="'+s+'"'+(s===EQ_SLUG?' selected':'')+'>'+esc(s)+'</option>').join('')+'</select></p>');
  // personas = dotación + cualquiera que haya registrado avance manual
  const personas = dot.slice();
  Object.keys(avs).forEach(pid=>{ if(!personas.find(x=>x.id===pid)){ const alg=Object.values(avs[pid])[0]||{}; personas.push({id:pid,nombre:alg.nombre||pid,rol:alg.rol||'vendedor'}); } });
  if(!personas.length) html.push('<div class="vacio">Sin dotación en Indicadores ni avances registrados para esta sucursal.</div>');
  else{
    html.push('<div class="card" style="padding:0"><table><thead><tr><th>Persona</th><th>Puesto</th><th>Cursos asignados</th><th>Aprobados</th><th style="width:180px">Avance</th></tr></thead><tbody>');
    personas.forEach(per=>{
      const asig = cursosDe(EQ_SLUG, per.rol);
      const avP = avs[per.id]||{};
      const okN = asig.filter(x=>estadoCurso(avP[x.curso.id], x.curso).completo).length;
      const avancePct = asig.length? Math.round(asig.reduce((s,x)=>s+estadoCurso(avP[x.curso.id],x.curso).avance,0)/asig.length) : 0;
      html.push('<tr><td><b>'+esc(per.nombre)+'</b></td><td>'+esc(ROL_LABEL_PERSONA[per.rol]||per.rol)+'</td>'+
        '<td>'+asig.length+'</td><td>'+okN+'</td>'+
        '<td><div style="display:flex;align-items:center;gap:9px"><div class="barra'+(avancePct>=100?' v':'')+'" style="flex:1"><div style="width:'+avancePct+'%"></div></div><span style="font-size:13px;font-weight:700">'+avancePct+'%</span></div></td></tr>');
    });
    html.push('</tbody></table></div>');
  }
  app.innerHTML = html.join('');
  $('eqSel').addEventListener('change',e=>{ EQ_SLUG=e.target.value; lsSet('cap_eq_slug',EQ_SLUG); render(); });
}

/* ---------- staff: ranking ---------- */
async function renderRanking(){
  const app = $('app');
  app.innerHTML = '<h1>Ranking de sucursales</h1><p class="sub">Cumplimiento promedio de la Academia por sucursal.</p><div class="muted">Calculando…</div>';
  const slugs = Object.keys(SLUG_SUC_IND);
  const filas = [];
  await Promise.all(slugs.map(async slug=>{
    const dot = await dotacion(slug).catch(()=>[]);
    const avs = AVANCES[slug] || {};
    const personas = dot.slice();
    Object.keys(avs).forEach(pid=>{ if(!personas.find(x=>x.id===pid)){ const alg=Object.values(avs[pid])[0]||{}; personas.push({id:pid,nombre:alg.nombre||pid,rol:alg.rol||'vendedor'}); } });
    let suma=0, n=0, aprob=0, asigTot=0;
    personas.forEach(per=>{
      const asig = cursosDe(slug, per.rol); if(!asig.length) return;
      const avP = avs[per.id]||{};
      suma += Math.round(asig.reduce((s,x)=>s+estadoCurso(avP[x.curso.id],x.curso).avance,0)/asig.length); n++;
      aprob += asig.filter(x=>estadoCurso(avP[x.curso.id],x.curso).completo).length; asigTot += asig.length;
    });
    filas.push({ slug, personas:n, avance: n?Math.round(suma/n):0, aprob, asigTot });
  }));
  filas.sort((a,b)=>b.avance-a.avance);
  const html = ['<h1>Ranking de sucursales</h1><p class="sub">Cumplimiento promedio de la Academia por sucursal (personas con cursos asignados).</p>'];
  if(!filas.some(f=>f.asigTot)) html.push('<div class="vacio">Todavía no hay programas asignados: el ranking arranca cuando publiques el primero.</div>');
  else{
    html.push('<div class="card" style="padding:0"><table><thead><tr><th>#</th><th>Sucursal</th><th>Personas</th><th>Cursos aprobados</th><th style="width:220px">Avance promedio</th></tr></thead><tbody>');
    filas.forEach((f,i)=>{
      html.push('<tr><td><b>'+(i+1)+'</b>'+(i===0&&f.avance>0?' 🏆':'')+'</td><td><b>'+esc(f.slug)+'</b></td><td>'+f.personas+'</td>'+
        '<td>'+f.aprob+' / '+f.asigTot+'</td>'+
        '<td><div style="display:flex;align-items:center;gap:9px"><div class="barra'+(f.avance>=100?' v':'')+'" style="flex:1"><div style="width:'+f.avance+'%"></div></div><span style="font-size:13px;font-weight:700">'+f.avance+'%</span></div></td></tr>');
    });
    html.push('</tbody></table></div>');
  }
  app.innerHTML = html.join('');
}

/* ---------- staff: encuestas ---------- */
async function renderEncuestas(){
  const app = $('app');
  app.innerHTML = '<h1>Encuestas</h1><div class="muted">Cargando…</div>';
  const data = await fbGet('encuestas').catch(()=>null) || {};
  const html = ['<h1>Encuestas</h1><p class="sub">Lo que dijo el equipo al terminar cada curso (contenido · claridad · utilidad, de 1 a 5).</p>'];
  const cids = Object.keys(data);
  if(!cids.length) html.push('<div class="vacio">Sin respuestas todavía. La encuesta aparece automáticamente al completar un curso.</div>');
  cids.forEach(cid=>{
    const resp = Object.values(data[cid]||{});
    if(!resp.length) return;
    const prom = k => (resp.reduce((s,r)=>s+(+r[k]||0),0)/resp.length).toFixed(1);
    const coms = resp.filter(r=>r.com);
    html.push('<div class="sec-t">'+esc((CURSOS[cid]&&CURSOS[cid].titulo)||cid)+' <span class="chip azul">'+resp.length+' respuesta'+(resp.length===1?'':'s')+'</span></div>');
    html.push('<div class="card"><div class="fila">'+
      [['Contenido',prom('r1')],['Claridad',prom('r2')],['Utilidad',prom('r3')]].map(([l,v])=>
        '<div style="text-align:center"><div style="font-size:26px;font-weight:800">'+v+'</div><div class="muted" style="font-size:13px">'+l+'</div></div>').join('')+'</div>'+
      (coms.length? '<div style="margin-top:14px;border-top:1px solid var(--borde);padding-top:12px">'+
        coms.map(r=>'<div style="margin-bottom:8px;font-size:14px">“'+esc(r.com)+'” <span class="muted">— '+esc(r.de||'')+' ('+esc(r.slug||'')+')</span></div>').join('')+'</div>':'')+'</div>');
  });
  app.innerHTML = html.join('');
}

async function cargarAvancesAlumno(){
  AVANCES = (await fbGet('avances/'+MI_SLUG).catch(()=>null)) || {};
}
function render(){ ES_STAFF ? renderStaff() : renderAlumno(); }

(async function init(){
  if(!SESSION || !puedeVer) return;
  pintarTabs();
  try{
    const [cursos, programas] = await Promise.all([ fbGet('cursos').catch(()=>null), fbGet('programas').catch(()=>null) ]);
    CURSOS = cursos||{}; PROGRAMAS = programas||{};
    if(ES_STAFF){
      AVANCES = (await fbGet('avances').catch(()=>null)) || {};   // staff ve todas las sucursales
    } else {
      await asegurarYo();
      await cargarAvancesAlumno();                                 // la sucursal baja SOLO lo suyo
    }
    render();
  }catch(e){
    $('app').innerHTML = '<div class="err">No se pudo cargar la Academia ('+esc(e.message)+'). Probá recargar.</div>';
  }
})();
</script>
