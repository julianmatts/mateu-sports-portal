<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Academia de Ventas — Mateu Sports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700;1,800&family=Barlow+Condensed:ital,wght@0,600;0,700;1,700;1,800&display=swap" rel="stylesheet">
<script src="../shared/iconos.js" defer></script>
<!-- Header unificado del shell: barra Menú + logo + calendario retail + drawer -->
<script src="../shared/header.js" defer></script>
<style>
  :root{
    --accent:#e4002b; --accent-dk:#b30022; --azul:#0057b8; --tinta:#1a1c1f;
    --fondo:#f6f7f8; --gris:#6b7280; --gris2:#9aa0a8; --borde:#e2e4e8; --verde:#178a50;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--fondo); color:var(--tinta);
    font-family:'Barlow','Helvetica Neue',sans-serif; font-size:15px; }
  a{ color:var(--accent); }
  a:hover{ color:var(--accent-dk); }
  button{ font-family:'Barlow',sans-serif; }
  button:focus,input:focus,select:focus,textarea:focus{ outline:none; }

  .franja{ height:4px; background:linear-gradient(90deg,var(--accent) 0%,var(--accent) 58%,#fff 58%,#fff 61%,var(--azul) 61%,var(--azul) 100%); }
  .topbar{ background:#fff; border-bottom:1px solid var(--borde); padding:0 32px; height:64px;
    display:flex; align-items:center; gap:28px; position:sticky; top:var(--msh-h,67px); z-index:20; }
  .topbar img.logo{ height:30px; display:block; }
  .nav{ display:flex; align-items:center; gap:24px; height:100%; }
  .nav .tab{ color:var(--gris); text-decoration:none; font-size:15px; font-weight:600; height:100%;
    display:flex; align-items:center; gap:7px; border-bottom:3px solid transparent; cursor:pointer; user-select:none; white-space:nowrap; }
  .nav .tab:hover{ color:var(--tinta); }
  .nav .tab.act{ color:var(--tinta); font-weight:700; border-bottom-color:var(--accent); }
  .nav .pill{ min-width:20px; height:20px; border-radius:10px; background:var(--accent); color:#fff; font-size:12px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; padding:0 6px; }
  .who{ margin-left:auto; display:flex; align-items:center; gap:12px; }
  .who .ava{ width:38px; height:38px; border-radius:50%; background:var(--tinta); color:#fff; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; flex-shrink:0; cursor:default; }
  .who .nom{ font-size:14px; font-weight:700; line-height:1.25; }
  .who .rol{ font-size:12px; color:var(--gris); }
  .who a.salir{ display:flex; align-items:center; padding:8px; border-radius:8px; text-decoration:none; margin-left:2px; }
  .who a.salir:hover{ background:rgba(0,0,0,.05); }
  .who .cambiar{ font-size:11.5px; }

  .wrap{ max-width:1360px; margin:0 auto; padding:36px 32px 64px; }
  .wrap.angosto{ max-width:860px; }
  .wrap.medio{ max-width:1100px; }
  .titulo-xl{ font-family:'Barlow Condensed',sans-serif; font-style:italic; font-weight:800; font-size:44px; line-height:1; text-transform:uppercase; }
  .bajada{ margin-top:10px; font-size:16px; color:var(--gris); }
  .sec-t{ font-size:14px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--tinta); }
  .muted{ color:var(--gris); }
  .card-b{ background:#fff; border:1px solid var(--borde); border-radius:6px; padding:22px 24px; }
  .vacio{ border:1.5px dashed var(--borde); border-radius:6px; padding:36px 22px; text-align:center; color:var(--gris); background:#fff; }
  .err{ background:#fde7eb; border:1px solid #f5c6cf; color:#8a1f11; border-radius:6px; padding:12px 16px; margin-bottom:16px; }

  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; border:none; border-radius:3px; cursor:pointer;
    font-size:13px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; padding:12px 22px; background:#eef0f3; color:var(--tinta); text-decoration:none; }
  .btn:hover{ filter:brightness(.96); }
  .btn.pri{ background:var(--accent); color:#fff; }
  .btn.pri:hover{ background:var(--accent-dk); filter:none; }
  .btn.oscuro{ background:var(--tinta); color:#fff; }
  .btn.linea{ background:transparent; border:1px solid var(--tinta); color:var(--tinta); }
  .btn.mini{ padding:7px 12px; font-size:11.5px; letter-spacing:1px; }
  .btn.peligro{ background:#fde7eb; color:var(--accent); }
  .btn[disabled]{ opacity:.5; cursor:default; }

  input[type=text],input[type=number],input[type=date],input[type=url],select,textarea{
    width:100%; background:#fff; border:1px solid var(--borde); border-radius:4px; color:var(--tinta);
    padding:11px 13px; font-size:15px; font-family:'Barlow',sans-serif; }
  input:focus,select:focus,textarea:focus{ border-color:#6ea8d8; }
  textarea{ resize:vertical; min-height:80px; }
  label.fl{ display:block; font-size:12px; font-weight:700; color:var(--gris); text-transform:uppercase; letter-spacing:1.2px; margin:0 0 6px; }
  .fila{ display:flex; gap:14px; flex-wrap:wrap; }
  .fila>div{ flex:1; min-width:170px; }

  .chip{ display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700; letter-spacing:1px; text-transform:uppercase; padding:4px 10px; border-radius:3px; }
  .chip.rojo{ background:#fde7eb; color:var(--accent-dk); }
  .chip.azulc{ background:#e7effa; color:var(--azul); }
  .chip.ambar{ background:#fdf3d7; color:#8a6d00; }
  .chip.verde{ background:#e2f4ea; color:var(--verde); }
  .fchip{ padding:9px 16px; border-radius:999px; font-size:14px; font-weight:700; cursor:pointer; background:#fff; color:var(--tinta); border:1px solid #d8dbe0; letter-spacing:.3px; }
  .fchip.act{ background:var(--tinta); color:#fff; border-color:var(--tinta); }

  /* ---- catálogo ---- */
  .prog-tabs{ display:flex; gap:16px; margin-top:14px; flex-wrap:wrap; }
  .prog-tab{ display:flex; align-items:center; justify-content:space-between; gap:14px; width:252px; min-height:76px; padding:14px 18px;
    color:#fff; border:3px solid transparent; border-radius:6px; cursor:pointer; text-align:left; font-size:16px; font-weight:700; text-transform:uppercase; line-height:1.2; letter-spacing:.5px; }
  .prog-tab.act{ border-color:var(--tinta); }
  .carrusel{ display:flex; gap:18px; overflow-x:auto; margin-top:26px; padding-bottom:14px; scroll-snap-type:x proximity; }
  .ccard{ position:relative; flex-shrink:0; width:258px; height:460px; border-radius:6px; overflow:hidden; background:#e2e4e8; scroll-snap-align:start; cursor:pointer; }
  .ccard:hover{ box-shadow:0 8px 24px rgba(0,0,0,.22); }
  .ccard img.cover{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  .ccard .grad{ position:absolute; inset:0; pointer-events:none; }
  .ccard .check{ position:absolute; top:14px; left:14px; width:38px; height:38px; border-radius:50%; background:rgba(20,20,20,.45); display:flex; align-items:center; justify-content:center; color:#fff; font-size:12.5px; font-weight:700; }
  .ccard .check.ok{ background:#fff; color:var(--tinta); }
  .ccard .pie{ position:absolute; left:16px; right:16px; bottom:18px; display:flex; flex-direction:column; align-items:flex-start; gap:10px; }
  .ccard .dur{ display:inline-flex; align-items:center; gap:6px; background:rgba(20,20,20,.55); color:#fff; font-size:13px; font-weight:600; padding:4px 10px; border-radius:4px; }
  .ccard .tit{ color:#fff; font-size:19px; font-weight:800; text-transform:uppercase; line-height:1.15; text-shadow:0 1px 3px rgba(0,0,0,.25); }
  .ccard.chica{ height:420px; cursor:default; }
  .ccard.chica:hover{ box-shadow:none; }
  .ccard .editar{ position:absolute; top:14px; right:14px; z-index:2; }

  /* ---- player de curso ---- */
  .hero{ background:#17181a; color:#fff; }
  .hero-in{ max-width:1240px; margin:0 auto; padding:30px 32px 26px; }
  .hero a.volver{ color:var(--gris2); text-decoration:none; font-size:14px; font-weight:600; }
  .hero a.volver:hover{ color:#fff; }
  .hero .h-tit{ font-family:'Barlow Condensed',sans-serif; font-style:italic; font-weight:800; font-size:42px; line-height:1; text-transform:uppercase; }
  .hero .h-sub{ margin-top:10px; font-size:15px; color:#cfd3d9; }
  .player{ max-width:1240px; margin:0 auto; padding:32px; display:grid; grid-template-columns:320px 1fr; gap:28px; align-items:start; }
  @media (max-width:900px){ .player{ grid-template-columns:1fr; } .indice{ position:static !important; } }
  .indice{ background:#fff; border:1px solid var(--borde); border-radius:6px; overflow:hidden; position:sticky; top:calc(var(--msh-h,67px) + 88px); }
  .indice .cab{ padding:16px 20px; border-bottom:1px solid var(--borde); font-size:13px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--gris); }
  .lec{ display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:13px 20px; border:none; border-left:4px solid transparent; background:#fff; cursor:pointer; }
  .lec:hover{ background:#f2f3f5; }
  .lec.act{ background:#f2f3f5; border-left-color:var(--accent); }
  .lec .n{ width:26px; height:26px; border-radius:50%; background:#e9eaee; color:var(--gris); display:inline-flex; align-items:center; justify-content:center; font-size:12.5px; font-weight:700; flex-shrink:0; }
  .lec.act .n{ background:var(--tinta); color:#fff; }
  .lec.ok .n{ background:var(--verde); color:#fff; }
  .lec .t{ font-size:14.5px; font-weight:600; color:var(--tinta); line-height:1.3; }
  .lec.act .t{ font-weight:700; }
  .lec-tit{ font-family:'Barlow Condensed',sans-serif; font-style:italic; font-weight:800; font-size:34px; line-height:1; text-transform:uppercase; }
  .seccion{ border:1px solid var(--borde); border-left:4px solid #d8dbe0; border-radius:6px; padding:20px 24px; background:#fff; }
  .seccion .st{ font-size:13px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--gris); }
  .seccion .sx{ margin-top:10px; font-size:15.5px; color:#33383f; line-height:1.6; white-space:pre-line; }
  .seccion.dato{ background:#e7effa; border-color:#c9dcf2; border-left-color:var(--azul); } .seccion.dato .st{ color:var(--azul); }
  .seccion.evitar{ background:#fde7eb; border-color:#f5c6cf; border-left-color:var(--accent); } .seccion.evitar .st{ color:var(--accent-dk); }
  .seccion.tip{ background:#e2f4ea; border-color:#c3e5d2; border-left-color:var(--verde); } .seccion.tip .st{ color:var(--verde); }
  .seccion.ejemplo{ background:#f2f3f5; border-color:var(--borde); border-left-color:var(--tinta); } .seccion.ejemplo .st{ color:var(--tinta); }
  .video-marco{ position:relative; padding-top:56.25%; border-radius:6px; overflow:hidden; background:#000; }
  .video-marco iframe{ position:absolute; inset:0; width:100%; height:100%; border:none; }
  .preg-card{ background:#fff; border:1px solid var(--borde); border-radius:6px; padding:20px 24px; }
  .preg-card .q{ font-size:16px; font-weight:700; line-height:1.4; }
  .op-btn{ display:block; width:100%; text-align:left; padding:12px 14px; border-radius:4px; border:1.5px solid #d8dbe0; background:#fff; color:var(--tinta); font-size:15px; font-weight:600; cursor:pointer; }
  .op-btn.sel{ background:#f2f3f5; border-color:var(--tinta); }
  .op-btn.bien{ background:#e2f4ea; border-color:var(--verde); color:var(--verde); }
  .op-btn.mal{ background:#fde7eb; border-color:var(--accent); color:var(--accent-dk); }
  .banner{ border-radius:6px; padding:22px 26px; color:#fff; }
  .banner.verde{ background:var(--verde); }
  .banner.rojo{ background:var(--accent-dk); }

  /* ---- historial ---- */
  .hcard{ position:relative; flex-shrink:0; width:258px; height:420px; border-radius:6px; overflow:hidden; background:#e2e4e8; }
  .hcert{ display:flex; flex-direction:column; align-items:center; padding:28px 20px; }
  .hcert .ct{ font-family:'Barlow Condensed',sans-serif; font-style:italic; font-weight:800; font-size:34px; color:#fff; letter-spacing:1px; }
  .hlock{ background:#eceef1; border:1px dashed #c6cad1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:28px 24px; gap:16px; text-align:center; }

  /* ---- novedades ---- */
  .nov{ background:#fff; border:1px solid var(--borde); border-radius:6px; padding:20px 22px; display:flex; gap:16px; cursor:pointer; }
  .nov:hover{ box-shadow:0 4px 16px rgba(0,0,0,.08); }
  .nov.nueva{ border-color:#efb4bf; }
  .nov.leida{ opacity:.72; }
  .nov .ava{ width:44px; height:44px; border-radius:50%; color:#fff; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700; flex-shrink:0; }

  /* ---- equipo / ranking ---- */
  .nivel-card{ background:#fff; border:1px solid var(--borde); border-top:4px solid var(--tinta); border-radius:6px; padding:16px; display:flex; flex-direction:column; gap:6px; }
  .tabla{ background:#fff; border:1px solid var(--borde); border-radius:6px; overflow:hidden; }
  .trow{ display:grid; gap:16px; padding:15px 22px; border-bottom:1px solid #eef0f3; align-items:center; }
  .trow:hover{ background:#fafbfc; }
  .trow.cab{ padding:14px 22px; background:#fafbfc; border-bottom:1px solid var(--borde); font-size:12px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--gris); }
  .trow.cab:hover{ background:#fafbfc; }
  .pava{ border-radius:50%; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; flex-shrink:0; }
  .barra{ height:6px; border-radius:3px; background:#e9eaee; overflow:hidden; }
  .barra>div{ height:100%; background:var(--accent); }
  .barra.v>div{ background:var(--verde); }
  .podio{ background:#fff; border:1px solid var(--borde); border-top:5px solid #c9a800; border-radius:6px; padding:24px; display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; }
  .toggle{ display:flex; border:1px solid #d8dbe0; border-radius:4px; overflow:hidden; }
  .toggle button{ padding:11px 20px; font-size:13px; font-weight:700; letter-spacing:1px; text-transform:uppercase; cursor:pointer; border:none; background:#fff; color:var(--tinta); }
  .toggle button.act{ background:var(--tinta); color:#fff; }
  .toggle button+button{ border-left:1px solid #d8dbe0; }

  /* ---- inicio ---- */
  .ini-grid{ display:grid; grid-template-columns:1.1fr 1.1fr .9fr; gap:28px; margin-top:32px; align-items:start; }
  @media (max-width:1000px){ .ini-grid{ grid-template-columns:1fr; } }
  .badge-hex{ width:72px; text-align:center; cursor:pointer; }
  .badge-hex svg{ filter:drop-shadow(0 3px 5px rgba(0,0,0,.18)); }
  .icard{ position:relative; flex-shrink:0; width:214px; height:310px; border-radius:6px; overflow:hidden; background:#e2e4e8; cursor:pointer; display:block; }
  .icard:hover{ box-shadow:0 6px 20px rgba(0,0,0,.18); }

  /* ---- modal / certificado ---- */
  .velo{ position:fixed; inset:0; background:rgba(10,14,20,.55); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .modal{ background:#fff; border-radius:8px; max-width:560px; width:100%; max-height:88vh; overflow:auto; padding:26px; }
  .modal h2{ margin:0 0 6px; font-size:21px; }
  #certVista{ position:fixed; inset:0; background:rgba(10,14,20,.68); z-index:60; display:flex; align-items:center; justify-content:center; padding:20px; overflow:auto; }
  .cert{ background:#fff; width:840px; max-width:100%; padding:52px 58px; border:10px solid #0B1527; position:relative; }
  .cert .c-borde{ position:absolute; inset:8px; border:2px solid var(--accent); pointer-events:none; }
  .cert .c-logo{ height:40px; }
  .cert .c-tit{ font-family:'Barlow Condensed',sans-serif; font-style:italic; font-weight:800; font-size:42px; letter-spacing:2px; margin:22px 0 4px; color:#0B1527; }
  .cert .c-quien{ font-size:32px; font-weight:800; margin:14px 0 2px; color:var(--accent); }
  .cert .c-firmas{ display:flex; gap:60px; margin-top:44px; }
  .cert .c-firma{ flex:1; text-align:center; border-top:1.5px solid var(--tinta); padding-top:8px; font-size:14px; }
  .cert .c-firma b{ display:block; font-size:15px; }
  @media print{
    body *{ visibility:hidden; }
    #certVista, #certVista *{ visibility:visible; }
    #certVista{ position:absolute; inset:0; background:#fff; padding:0; }
    .cert{ border-width:8px; width:100%; }
    .no-print{ display:none !important; }
  }
  @media (max-width:820px){
    .topbar{ padding:0 14px; gap:14px; overflow-x:auto; }
    .wrap{ padding:24px 14px 60px; }
    .who .nom,.who .rol,.who .cambiar{ display:none; }
    .titulo-xl{ font-size:34px; }
  }
</style>
</head>
<body>
<div class="franja"></div>
<div class="topbar">
  <div class="nav" id="nav"></div>
  <div class="who">
    <div class="ava" id="whoAva" title="">·</div>
    <div><div class="nom" id="whoNom">—</div><div class="rol" id="whoRol">—</div>
      <a href="#" class="cambiar" id="whoCambiar" style="display:none">Cambiar persona</a></div>
    <a class="salir" href="../" title="Volver al Portal">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M10 4 H5.5 V20 H10" stroke="#6b7280" stroke-width="1.8" stroke-linecap="round"/><path d="M14 8 L18 12 L14 16 M18 12 H9" stroke="#6b7280" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </div>
</div>
<div id="app"><div class="wrap muted">Cargando la Academia…</div></div>

<script>
/* ============================================================
   ACADEMIA DE VENTAS — plataforma funcional con el diseño del
   prototipo de Design (las .dc.html quedan solo como referencia).
   ------------------------------------------------------------
   - Datos: Firebase recepciones-mateu, nodo `capacitaciones/`
     (cursos/, programas/, avances/<slug>/<persona>/<curso>,
      novedades/, encuestas/, archivos/).
   - Dotación real: data/indicadores del último período (mismo
     mapa SLUG_SUC_IND que Buscador/RRHH).
   - Staff (admin/capacitador/supervisor) gestiona cursos y
     programas; alumno (cuenta sucursal → elige persona) cursa.
   ============================================================ */

/* ---------- config ---------- */
const FIREBASE_DB_URL = 'https://recepciones-mateu-default-rtdb.firebaseio.com';
const ROOT = 'capacitaciones';
const MENSAJES_DB_URL = 'https://mensajes-mateu-default-rtdb.firebaseio.com';
const CAPACITADOR_FIRMA = 'Iván Nicoloff';
const SUPERVISOR_FIRMA  = 'Cristian Campion';

const COMPETENCIAS = ['Venta y servicio','Producto de marca','Digital y omnicanal','Operaciones de tienda',
  'Ejecución visual','Perspectivas comerciales','Liderándome a mí mismo','Liderando mi equipo'];
const PALETA = ['#e4002b','#0057b8','#1a1c1f','#5c6672','#00396f','#7cb342','#d81b60','#c9a800','#1e88e5','#00897b','#5e35b1','#c07a3e'];

const PERSONAS_MAIL = {
  'capacitacion@mateu.com.ar':     { nombre:'Iván Nicoloff',    rol:'Capacitador · Admin' },
  'cristian.campion@mateu.com.ar': { nombre:'Cristian Campion', rol:'Supervisor · Admin' },
  'julian@mateu.com.ar':           { nombre:'Julián Mateu',     rol:'Gerencia · Admin' }
};

const SLUG_SUC_IND = {
  'calle-12':'12-MS Calle 12','city-bell':'06-MS City Bell','calle-47':'08-MS Calle 47',
  'calle-49':'19-MS Calle 49','los-hornos':'13-MS Los Hornos','plaza':'01-MS Plaza Italia',
  'berisso':'16-MS Berisso','ensenada':'11-MS Ensenada','kids':'02-Mateu Kids',
  'aurelius-12':'04-Aurelius Calle 12','aurelius-5':'18-Aurelius Calle 5','aurelius-cb':'17-Aurelius City Bell',
  'adidas-12':'21-Adidas Calle 12','adidas':'09-Adidas Av. 7','originals':'15-Adidas Originals',
};
const SUC_LABEL = {};
Object.keys(SLUG_SUC_IND).forEach(s=>{ SUC_LABEL[s] = SLUG_SUC_IND[s].replace(/^\d+-/,''); });
const GRUPO_ROL_IND = { Jefatura:'encargado', Ventas:'vendedor', Caja:'cajera', Refuerzos:'deposito' };
const ROL_LABEL_PERSONA = { encargado:'Encargado/a', vendedor:'Vendedor/a', cajera:'Cajera', deposito:'Depósito' };
const ROL_COLOR = { encargado:'#1e88e5', vendedor:'#d81b60', cajera:'#c9a800', deposito:'#00897b' };
const ROL_DESC = { encargado:'Asigna el foco y sigue el avance de su sucursal', vendedor:'Cursa los programas de venta y producto', cajera:'Cursa módulos de caja y atención', deposito:'Cursa módulos de depósito y operaciones' };
const ROLES_DESTINO = ['encargado','vendedor','cajera','deposito'];

function nuevoId(pref){ return pref+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function fechaLarga(ts){ try{ return new Date(ts).toLocaleDateString('es-AR',{day:'numeric',month:'long',year:'numeric'}); }catch(e){ return ''; } }
function fechaCorta(ts){ try{ return new Date(ts).toLocaleDateString('es-AR',{day:'numeric',month:'short',year:'numeric'}); }catch(e){ return ''; } }
function tiempoRel(ts){
  const d = Date.now()-ts;
  if(d<60000) return 'recién';
  if(d<3600000) return 'hace '+Math.floor(d/60000)+' min';
  if(d<86400000) return 'hace '+Math.floor(d/3600000)+' h';
  if(d<172800000) return 'ayer';
  return 'hace '+Math.floor(d/86400000)+' días';
}
function titleNombre(s){ return (s||'').toLowerCase().replace(/(^|[\s'’-])([a-záéíóúñü])/g,(m,p,c)=>p+c.toUpperCase()); }
function idFromNombre(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }
function archivoInd(n){ return n.replace(/\./g,'').replace(/\s+/g,'-'); }
function iniciales(n){ return (n||'·').split(/\s+/).map(w=>w.charAt(0)).join('').slice(0,2).toUpperCase(); }
function diasHasta(iso){ if(!iso) return null; return Math.ceil((new Date(iso+'T23:59:59')-Date.now())/86400000); }
function pct(n,d){ return d? Math.round(100*n/d):0; }
function esUrlYoutube(u){ const m=(u||'').match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([\w-]{6,})/); return m?m[1]:null; }
function hexToRgba(hex,a){ const n=parseInt(hex.slice(1),16); return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')'; }
function gradCard(color){ return 'linear-gradient(to top,'+color+' 0%,'+color+' 16%,'+hexToRgba(color,.85)+' 32%,rgba(0,0,0,0) 60%)'; }

/* ---------- archivos (PDF/PPT en Firebase, en partes base64) ---------- */
const ARCHIVO_MAX_MB = 20;
const ARCHIVO_CHUNK = 4000000;
async function subirArchivo(file,onProgreso){
  const fid = nuevoId('f');
  const dataUrl = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(new Error('no se pudo leer el archivo')); r.readAsDataURL(file); });
  const b64 = dataUrl.slice(dataUrl.indexOf(',')+1);
  const n = Math.ceil(b64.length/ARCHIVO_CHUNK);
  await fbPut('archivos/'+fid+'/meta',{nombre:file.name,mime:file.type||'application/octet-stream',size:file.size,n,ts:Date.now(),por:SESSION.email});
  for(let i=0;i<n;i++){ if(onProgreso) onProgreso(i+1,n); await fbPut('archivos/'+fid+'/c/'+i, b64.slice(i*ARCHIVO_CHUNK,(i+1)*ARCHIVO_CHUNK)); }
  return fid;
}
async function bajarArchivo(fid){
  const meta = await fbGet('archivos/'+fid+'/meta'); if(!meta) throw new Error('archivo no encontrado');
  let b64=''; for(let i=0;i<meta.n;i++) b64 += await fbGet('archivos/'+fid+'/c/'+i);
  const bin = atob(b64); const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return { blob:new Blob([arr],{type:meta.mime}), meta };
}

/* ---------- dotación (Indicadores) ---------- */
async function ultimoPeriodo(){
  if(PERIODO_IND) return PERIODO_IND;
  const p = (await getJSON('../data/indicadores/periodos.json').catch(()=>({periodos:[]}))).periodos||[];
  PERIODO_IND = p.length ? p[0].id : null; return PERIODO_IND;
}
async function dotacion(slug){
  if(DOT_CACHE[slug]) return DOT_CACHE[slug];
  const dn = SLUG_SUC_IND[slug]; if(!dn){ DOT_CACHE[slug]=[]; return []; }
  const per = await ultimoPeriodo(); if(!per){ DOT_CACHE[slug]=[]; return []; }
  const d = await getJSON('../data/indicadores/'+per+'/'+archivoInd(dn)+'.json').catch(()=>null);
  const out=[];
  ((d&&d.vendedores)||[]).forEach(v=>{
    if(v.cubre) return; const rol=GRUPO_ROL_IND[v.grupo]; if(!rol) return;
    out.push({id:idFromNombre(v.vendedor), nombre:titleNombre(v.vendedor), rol});
  });
  out.sort((a,b)=> a.rol===b.rol ? a.nombre.localeCompare(b.nombre) : (a.rol==='encargado'?-1: b.rol==='encargado'?1: a.rol.localeCompare(b.rol)));
  DOT_CACHE[slug]=out; return out;
}
function personasDe(slug){
  const dot = DOT_CACHE[slug]||[];
  const avs = AVANCES[slug]||{};
  const out = dot.slice();
  Object.keys(avs).forEach(pid=>{
    if(!out.find(x=>x.id===pid)){ const a=Object.values(avs[pid])[0]||{}; out.push({id:pid,nombre:a.nombre||pid,rol:a.rol||'vendedor'}); }
  });
  return out;
}

/* ---------- asignación y avance ---------- */
function progColor(p,i){ return p.color || PALETA[(i!==undefined?i:Object.keys(PROGRAMAS).indexOf(p.id))%PALETA.length] || '#1a1c1f'; }
function programasDe(slug, rolPersona){
  return Object.values(PROGRAMAS).filter(p=>{
    if(p.activo===false) return false;
    const okRol = !(p.roles&&p.roles.length) || p.roles.includes(rolPersona);
    const okSuc = !(p.sucursales&&p.sucursales.length) || p.sucursales.includes(slug);
    return okRol && okSuc;
  }).sort((a,b)=>(a.ts||0)-(b.ts||0));
}
function cursosDe(slug, rolPersona){
  const vistos=new Set(); const out=[];
  programasDe(slug,rolPersona).forEach(p=>(p.cursos||[]).forEach(cid=>{
    if(vistos.has(cid)||!CURSOS[cid]||CURSOS[cid].activo===false) return;
    vistos.add(cid); out.push({curso:CURSOS[cid],programa:p});
  }));
  return out;
}
function estadoCurso(av,curso){
  const a=av||{}; const nm=(curso.modulos||[]).length;
  const modsOk=Object.keys(a.mods||{}).length;
  const hayQuiz=!!(curso.quiz&&(curso.quiz.preguntas||[]).length);
  const quizOk=!hayQuiz||!!(a.quiz&&a.quiz.ok);
  const total=nm+(hayQuiz?1:0);
  const hecho=Math.min(modsOk,nm)+((hayQuiz&&quizOk)?1:0);
  const completo=!!a.fin||(total>0&&hecho>=total);
  return { modsOk, nm, hayQuiz, quizOk, avance: total?Math.round(100*hecho/total):0, completo, empezado: modsOk>0||!!(a.quiz&&a.quiz.int) };
}
function statsPersona(slug, per){
  const asig = cursosDe(slug, per.rol);
  const avP = (AVANCES[slug]||{})[per.id]||{};
  let suma=0, mods=0, certs=0, ult=0;
  asig.forEach(x=>{
    const a=avP[x.curso.id]; const e=estadoCurso(a,x.curso);
    suma+=e.avance; mods+=e.modsOk+((e.hayQuiz&&e.quizOk&&a)?1:0); if(e.completo) certs++;
    if(a){ ult=Math.max(ult, a.fin||0, (a.quiz&&a.quiz.ts)||0, a.encTs||0); }
  });
  return { asig:asig.length, pct: asig.length?Math.round(suma/asig.length):0, mods, certs, ult };
}
function avanceYo(cid){ return YO ? (((AVANCES[MI_SLUG]||{})[YO.id]||{})[cid]||null) : null; }
async function guardarAvanceYo(cid,av){
  av.nombre=YO.nombre; av.rol=YO.rol;
  AVANCES[MI_SLUG]=AVANCES[MI_SLUG]||{}; AVANCES[MI_SLUG][YO.id]=AVANCES[MI_SLUG][YO.id]||{};

  await fbPut('avances/'+MI_SLUG+'/'+YO.id+'/'+cid, av);

  if(av.fin && !(antes&&antes.fin)){
    const c=CURSOS[cid];
    fbPost('novedades',{ tipo:'Curso completado', autor:YO.nombre, rol:(ROL_LABEL_PERSONA[YO.rol]||YO.rol)+' · '+(SUC_LABEL[MI_SLUG]||MI_SLUG),

      cuerpo: 'Curso aprobado'+(av.quiz?(' con '+av.quiz.pje+'% en la evaluación.'):'.'), ts:Date.now() }).catch(()=>{});
  }
}

  const progs = programasDe(MI_SLUG, YO.rol);

  html.push('<div style="font-size:32px;font-weight:700">¡Bienvenido, '+esc(YO.nombre)+'!</div>');

  if(!lista.length){

    const aprob = lista.filter(x=>estadoCurso(avanceYo(x.curso.id),x.curso).completo);
    html.push('<div class="ini-grid">');

    // Mi progreso
    const progPend = progs.find(p=>{
      const cs=(p.cursos||[]).filter(cid=>CURSOS[cid]&&CURSOS[cid].activo!==false);
      return cs.some(cid=>!estadoCurso(avanceYo(cid),CURSOS[cid]).completo);
    }) || progs[0];
    let progHtml='';
    if(progPend){
      const cs=(progPend.cursos||[]).filter(cid=>CURSOS[cid]&&CURSOS[cid].activo!==false);
      const ok=cs.filter(cid=>estadoCurso(avanceYo(cid),CURSOS[cid]).completo).length;
      const d=diasHasta(progPend.limite);
      progHtml='<div style="border-top:1px dashed #d8dbe0;margin:6px 0"></div>'+
        '<div style="font-size:15.5px"><b>Mi programa</b> '+esc(progPend.nombre)+'</div>'+
        '<div style="display:flex;align-items:center;gap:14px"><span style="font-size:15px;font-weight:700">'+ok+'/'+cs.length+'</span>'+
        '<div class="barra" style="flex:1;height:8px"><div style="width:'+pct(ok,cs.length)+'%"></div></div></div>'+
        (d!==null?'<div style="font-size:14.5px;color:var(--gris)"><b style="color:var(--tinta)">'+(d<0?'Vencido':d+' día'+(d===1?'':'s'))+'</b>'+(d<0?' — hablá con tu encargado.':' para terminar '+esc(progPend.nombre)+'.')+'</div>':'');
    }
    html.push('<div><div class="sec-t">Mi progreso de aprendizaje</div>'+
      '<div class="card-b" style="margin-top:14px;display:flex;flex-direction:column;gap:12px">'+
      '<div style="font-size:15.5px"><b>Mi nivel</b> '+esc(ROL_LABEL_PERSONA[YO.rol]||YO.rol)+'</div>'+
      '<div style="font-size:15.5px"><b>Mi capacitador</b> '+esc(CAPACITADOR_FIRMA)+'</div>'+
      '<div style="font-size:15.5px"><b>Mi supervisor</b> '+esc(SUPERVISOR_FIRMA)+'</div>'+progHtml+'</div></div>');

    // Competencias

/* ---------- PLAYER DE CURSO ---------- */
function abrirCurso(cid){
  const av = ES_STAFF ? null : avanceYo(cid);
  const c = CURSOS[cid]; if(!c) return;
  const nm=(c.modulos||[]).length;
  let idx=0;
  if(av&&av.mods){ while(idx<nm && av.mods[idx]) idx++; }   // primer módulo pendiente
  PLAYER={ cid, idx, resp:{}, enviado:false };
  render();
  window.scrollTo(0,0);
}
function seccionesDeTexto(contenido){
  // Bloques separados por línea en blanco. "[[tipo]] Título" al inicio de un
  // bloque lo convierte en tarjeta destacada (dato / tip / evitar / ejemplo).
  return (contenido||'').split(/\n\s*\n/).map(b=>{
    const m=b.match(/^\[\[(dato|tip|evitar|ejemplo)\]\]\s*([^\n]*)\n?([\s\S]*)$/);
    if(m) return {tipo:m[1], titulo:m[2], texto:m[3].trim()};
    const t=b.match(/^([^\n]{2,60}):\s*\n([\s\S]+)$/);
    if(t) return {tipo:'', titulo:t[1], texto:t[2].trim()};
    return {tipo:'', titulo:'', texto:b.trim()};
  }).filter(s=>s.texto||s.titulo);
}

    const pregs=c.quiz.preguntas||[];
    if(pregs.some((p,i)=>PLAYER.resp[i]===undefined)){ alert('Respondé todas las preguntas antes de enviar.'); return; }
    const bien=pregs.filter((p,i)=>PLAYER.resp[i]===+p.ok).length;
    const pje=pct(bien,pregs.length); const okQ=pje>=(c.quiz.aprueba||70);
    const nuevo=Object.assign({},av);
    nuevo.quiz={pje,ok:okQ,ts:Date.now(),int:((av.quiz&&av.quiz.int)||0)+1};
    const e2=estadoCurso(nuevo,c); if(e2.completo&&!nuevo.fin) nuevo.fin=Date.now();
    env.disabled=true;
    try{ await guardarAvanceYo(c.id,nuevo); }catch(err){ alert('No se pudo guardar: '+err.message); return; }
    PLAYER.enviado=true; render();
  });
  const rei=$('pReintentar'); if(rei) rei.addEventListener('click',()=>{ PLAYER.resp={}; PLAYER.enviado=false; render(); });
  const ee=$('encEnviar'); if(ee) ee.addEventListener('click', async ()=>{
    ee.disabled=true;
    try{
      await fbPost('encuestas/'+c.id,{de:YO.nombre,slug:MI_SLUG,r1:+$('e1').value,r2:+$('e2').value,r3:+$('e3').value,com:$('eCom').value.trim(),ts:Date.now()});
      const nuevo=Object.assign({},avanceYo(c.id)||{},{encTs:Date.now()});
      await guardarAvanceYo(c.id,nuevo);
    }catch(err){ alert('No se pudo enviar: '+err.message); }
    render();
  });
  bindArchivos(app);
}

/* ---------- CERTIFICADO ---------- */
function verCertificado(op){
  const quien = ES_STAFF ? quienSoy().nombre : (YO?YO.nombre:'—');
  let titulo='', detalle='', fecha=Date.now();
  if(op.curso){
    titulo=op.curso.titulo; detalle=(op.curso.competencia||'')+(op.curso.dur?' · '+op.curso.dur:'');
    const a=ES_STAFF?null:avanceYo(op.curso.id); if(a&&a.fin) fecha=a.fin;
  } else if(op.programa){
    titulo=op.programa.nombre; detalle='Programa completo de la Academia de Ventas';
    if(!ES_STAFF){
      const cs=(op.programa.cursos||[]).filter(cid=>CURSOS[cid]);
      fecha=Math.max.apply(null, cs.map(cid=>{ const a=avanceYo(cid); return (a&&a.fin)||0; }).concat([Date.now()*0+1]));
      if(!isFinite(fecha)||fecha<=1) fecha=Date.now();
    }
  }
  const velo=document.createElement('div'); velo.id='certVista';
  velo.innerHTML='<div><div class="cert"><div class="c-borde"></div>'+
    '<img class="c-logo" src="assets/logo-mateu.png" alt="Mateu Sports">'+
    '<div class="c-tit">CERTIFICADO DE FINALIZACIÓN</div>'+
    '<div class="muted">La Academia de Ventas de Mateu Sports certifica que</div>'+
    '<div class="c-quien">'+esc(quien)+'</div>'+
    '<div style="font-size:16px">completó satisfactoriamente '+(op.programa?'el programa':'el curso')+'</div>'+
    '<div style="font-size:22px;font-weight:800;margin:6px 0 2px">'+esc(titulo)+'</div>'+
    '<div class="muted" style="font-size:14px">'+esc(detalle)+' · '+fechaLarga(fecha)+'</div>'+
    '<div class="c-firmas"><div class="c-firma"><b>'+esc(CAPACITADOR_FIRMA)+'</b>Capacitador</div>'+
    '<div class="c-firma"><b>'+esc(SUPERVISOR_FIRMA)+'</b>Supervisor</div></div></div>'+
    '<div class="no-print" style="text-align:center;margin-top:14px;display:flex;gap:10px;justify-content:center">'+
    '<button class="btn pri" id="certImp">🖨 Imprimir / PDF</button>'+
    '<button class="btn" id="certCerrar" style="background:#fff">Cerrar</button></div></div>';
  document.body.appendChild(velo);
  velo.querySelector('#certImp').addEventListener('click',()=>window.print());
  velo.querySelector('#certCerrar').addEventListener('click',()=>velo.remove());
  velo.addEventListener('click',e=>{ if(e.target===velo) velo.remove(); });
}

}
function renderGesProgramas(){
  const app=$('app');
  const lista=Object.values(PROGRAMAS).sort((a,b)=>(a.ts||0)-(b.ts||0));
  const html=['<div class="wrap medio">'];
  html.push('<div class="titulo-xl">Gestión</div><div class="bajada">Qué cursos le tocan a cada puesto y sucursal, y para cuándo.</div>'+gesTabs());
  html.push('<p style="margin-top:24px"><button class="btn pri" id="nuevoProg">＋ Nuevo programa</button></p>');
  if(!lista.length) html.push('<div class="vacio">Sin programas. Un programa junta cursos y se asigna a puestos/sucursales con fecha límite.</div>');
  else{
    html.push('<div class="tabla"><div class="trow cab" style="grid-template-columns:1.8fr .7fr 1.4fr 1.4fr 1fr 1fr 1.3fr"><div>Programa</div><div>Cursos</div><div>Puestos</div><div>Sucursales</div><div>Vence</div><div>Aviso</div><div></div></div>'+
      lista.map(p=>{
        const d=diasHasta(p.limite);
        return '<div class="trow" style="grid-template-columns:1.8fr .7fr 1.4fr 1.4fr 1fr 1fr 1.3fr">'+
        '<div style="display:flex;align-items:center;gap:10px"><span style="width:14px;height:14px;border-radius:3px;background:'+progColor(p)+';flex-shrink:0"></span><b>'+esc(p.nombre)+'</b></div>'+
        '<div>'+((p.cursos||[]).length)+'</div>'+
        '<div style="font-size:13.5px">'+((p.roles&&p.roles.length)?p.roles.map(r=>esc(ROL_LABEL_PERSONA[r]||r)).join(', '):'Todos')+'</div>'+
        '<div style="font-size:13.5px">'+((p.sucursales&&p.sucursales.length)?p.sucursales.map(s=>esc(SUC_LABEL[s]||s)).join(', '):'Todas')+'</div>'+
        '<div style="font-size:13.5px">'+(p.limite?esc(p.limite)+(d!==null&&d<0?' <span class="chip rojo">vencido</span>':''):'—')+'</div>'+
        '<div>'+(p.avisado?'<span class="chip verde">enviado</span>':'<button class="btn mini oscuro" data-aviso="'+esc(p.id)+'">📣 Avisar</button>')+'</div>'+
        '<div style="white-space:nowrap;text-align:right"><button class="btn mini" data-ed="'+esc(p.id)+'">✏</button> <button class="btn mini peligro" data-del="'+esc(p.id)+'">🗑</button></div></div>';
      }).join('')+'</div>');
    html.push('<p class="muted" style="font-size:13px;margin-top:12px">«Avisar» publica la notificación en la Bandeja del Portal y en Novedades de la Academia.</p>');
  }
  html.push('</div>');
  app.innerHTML=html.join('');
  bindGesTabs(app);
  $('nuevoProg').addEventListener('click',()=>{
    EDIT_PROG={ id:nuevoId('p'), nombre:'', color:PALETA[Object.keys(PROGRAMAS).length%PALETA.length], cursos:[], roles:[], sucursales:[], limite:'', activo:true, ts:Date.now(), por:SESSION.email };
    VISTA={t:'editorProg'}; render();
  });
  app.querySelectorAll('[data-ed]').forEach(b=>b.addEventListener('click',()=>{ EDIT_PROG=JSON.parse(JSON.stringify(PROGRAMAS[b.dataset.ed])); VISTA={t:'editorProg'}; render(); }));
  app.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', async ()=>{
    const p=PROGRAMAS[b.dataset.del];
    if(!confirm('¿Eliminar el programa «'+p.nombre+'»?')) return;
    await fbDel('programas/'+p.id); delete PROGRAMAS[p.id]; render();
  }));
  app.querySelectorAll('[data-aviso]').forEach(b=>b.addEventListener('click', async ()=>{
    const p=PROGRAMAS[b.dataset.aviso];
    const texto='🎓 Academia de Ventas: nuevo programa «'+p.nombre+'»'+(p.limite?(' — completar antes del '+p.limite):'')+'. Entrá a Capacitaciones desde el Portal.';
    if(!confirm('Se publica este aviso en la Bandeja del Portal y en Novedades:\n\n'+texto+'\n\n¿Enviar?')) return;
    b.disabled=true;
    const yo=quienSoy();
    try{
      const r=await fetch(MENSAJES_DB_URL+'/avisos.json',{method:'POST',body:JSON.stringify({de:SESSION.email,texto,ts:Date.now()}),headers:{'Content-Type':'application/json'}});
      if(!r.ok) throw new Error('HTTP '+r.status);
      await fbPost('novedades',{tipo:'Nuevo programa',autor:yo.nombre,rol:yo.rol,titulo:'Nuevo programa: '+p.nombre,cuerpo:(p.limite?'Completar antes del '+p.limite+'. ':'')+'Ya está disponible en el catálogo.',ts:Date.now()});
      NOVEDADES=await fbGet('novedades').catch(()=>NOVEDADES)||{};
      p.avisado=Date.now(); await fbPut('programas/'+p.id,p);
    }catch(err){ alert('No se pudo enviar el aviso: '+err.message); }
    render(); pintarNav();
  }));
}
function renderEditorPrograma(){
  const app=$('app'); const p=EDIT_PROG;
  const cursosLista=Object.values(CURSOS).filter(c=>c.activo!==false).sort((a,b)=>(a.ts||0)-(b.ts||0));
  const html=['<div class="wrap medio">'];
  html.push('<p style="margin:0 0 14px"><a href="#" id="volver">← Volver a gestión</a></p>');
  html.push('<div class="titulo-xl">'+(PROGRAMAS[p.id]?'Editar programa':'Nuevo programa')+'</div>');
  html.push('<div class="card-b" style="margin-top:22px"><div class="fila">'+
    '<div style="flex:2;min-width:240px"><label class="fl">Nombre</label><input type="text" id="pNom" value="'+esc(p.nombre)+'" placeholder="Ej: Programa Encargados"></div>'+
    '<div><label class="fl">Color</label><select id="pColor">'+PALETA.map(x=>'<option value="'+x+'"'+(p.color===x?' selected':'')+' style="background:'+x+';color:#fff">'+x+'</option>').join('')+'</select></div>'+
    '<div><label class="fl">Fecha límite</label><input type="date" id="pLim" value="'+esc(p.limite||'')+'"></div></div>'+
    '<div class="fila" style="margin-top:14px">'+
    '<div><label class="fl">Cursos del programa</label><select id="pCursos" multiple size="8">'+
      cursosLista.map(c=>'<option value="'+esc(c.id)+'"'+((p.cursos||[]).includes(c.id)?' selected':'')+'>'+esc(c.titulo)+'</option>').join('')+'</select>'+
      (cursosLista.length?'':'<p class="muted" style="font-size:13px">Primero creá cursos en la pestaña Cursos.</p>')+'</div>'+
    '<div><label class="fl">Puestos (vacío = todos)</label><select id="pRoles" multiple size="5">'+
      ROLES_DESTINO.map(r=>'<option value="'+r+'"'+((p.roles||[]).includes(r)?' selected':'')+'>'+esc(ROL_LABEL_PERSONA[r])+'</option>').join('')+'</select></div>'+
    '<div><label class="fl">Sucursales (vacío = todas)</label><select id="pSucs" multiple size="8">'+
      Object.keys(SLUG_SUC_IND).map(s=>'<option value="'+s+'"'+((p.sucursales||[]).includes(s)?' selected':'')+'>'+esc(SUC_LABEL[s])+'</option>').join('')+'</select></div>'+
    '</div><p class="muted" style="font-size:12.5px;margin:10px 0 0">Ctrl+click para elegir varios. Vacío = aplica a todos.</p></div>');
  html.push('<div style="margin-top:20px;display:flex;gap:10px"><button class="btn pri" id="guardarProg">💾 Guardar programa</button>'+
    '<button class="btn" id="cancelarProg" style="background:#fff">Cancelar</button></div></div>');
  app.innerHTML=html.join('');
  $('volver').addEventListener('click',e=>{ e.preventDefault(); EDIT_PROG=null; VISTA=null; render(); });
  $('cancelarProg').addEventListener('click',()=>{ EDIT_PROG=null; VISTA=null; render(); });
  $('guardarProg').addEventListener('click', async ()=>{
    p.nombre=$('pNom').value.trim(); p.color=$('pColor').value; p.limite=$('pLim').value;
    p.cursos=Array.from($('pCursos').selectedOptions).map(o=>o.value);
    p.roles=Array.from($('pRoles').selectedOptions).map(o=>o.value);
    p.sucursales=Array.from($('pSucs').selectedOptions).map(o=>o.value);
    if(!p.nombre){ alert('Poné un nombre al programa.'); return; }
    if(!p.cursos.length){ alert('Elegí al menos un curso.'); return; }
    try{ await fbPut('programas/'+p.id,p); PROGRAMAS[p.id]=p; EDIT_PROG=null; VISTA=null; render(); }
    catch(err){ alert('No se pudo guardar: '+err.message); }
  });
}
async function renderGesEncuestas(){
  const app=$('app');
  app.innerHTML='<div class="wrap medio"><div class="titulo-xl">Gestión</div><div class="bajada">Cargando encuestas…</div></div>';
  const data=await fbGet('encuestas').catch(()=>null)||{};
  const html=['<div class="wrap medio">'];
  html.push('<div class="titulo-xl">Gestión</div><div class="bajada">Lo que dijo el equipo al terminar cada curso (contenido · claridad · utilidad, de 1 a 5).</div>'+gesTabs());
  const cids=Object.keys(data);
  if(!cids.length) html.push('<div class="vacio" style="margin-top:26px">Sin respuestas todavía. La encuesta aparece automáticamente al completar un curso.</div>');
  cids.forEach(cid=>{
    const resp=Object.values(data[cid]||{}); if(!resp.length) return;
    const prom=k=>(resp.reduce((s,r)=>s+(+r[k]||0),0)/resp.length).toFixed(1);
    const coms=resp.filter(r=>r.com);
    html.push('<div class="sec-t" style="margin-top:28px">'+esc((CURSOS[cid]&&CURSOS[cid].titulo)||cid)+' <span class="chip azulc">'+resp.length+' respuesta'+(resp.length===1?'':'s')+'</span></div>');
    html.push('<div class="card-b" style="margin-top:10px"><div class="fila">'+
      [['Contenido',prom('r1')],['Claridad',prom('r2')],['Utilidad',prom('r3')]].map(([l,v])=>
        '<div style="text-align:center"><div style="font-size:26px;font-weight:800">'+v+'</div><div class="muted" style="font-size:13px">'+l+'</div></div>').join('')+'</div>'+
      (coms.length?'<div style="margin-top:14px;border-top:1px solid var(--borde);padding-top:12px">'+
        coms.map(r=>'<div style="margin-bottom:8px;font-size:14px">“'+esc(r.com)+'” <span class="muted">— '+esc(r.de||'')+' ('+esc(SUC_LABEL[r.slug]||r.slug||'')+')</span></div>').join('')+'</div>':'')+'</div>');
  });
  html.push('</div>');
  app.innerHTML=html.join('');
  bindGesTabs(app);
}

async function cargarAvancesAlumno(){ AVANCES[MI_SLUG]=(await fbGet('avances/'+MI_SLUG).catch(()=>null))||{}; }
(async function init(){
  if(!SESSION || !puedeVer) return;
  try{
    const [cursos, programas, novedades] = await Promise.all([
      fbGet('cursos').catch(()=>null), fbGet('programas').catch(()=>null), fbGet('novedades').catch(()=>null)
    ]);
    CURSOS=cursos||{}; PROGRAMAS=programas||{}; NOVEDADES=novedades||{};
    if(ES_STAFF){
      AVANCES=(await fbGet('avances').catch(()=>null))||{};
    } else {
      if(MI_SLUG){ await asegurarYo(); await cargarAvancesAlumno(); }
    }
    pintarWho(); pintarNav(); render();
  }catch(e){
    $('app').innerHTML='<div class="wrap"><div class="err">No se pudo cargar la Academia ('+esc(e.message)+'). Probá recargar.</div></div>';
  }
})();
</script>
