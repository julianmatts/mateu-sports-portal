<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
/* Sesion del Portal (seguridad blanda, igual que el resto de los modulos) */
(function(){
  var s=null; try{ var t=localStorage.getItem('mateu_portal_session'); s=t?JSON.parse(t):null; }catch(e){ s=window.__sess||null; }
  if(!s || !s.rol || !(s.rol==='admin' || s.rol==='capacitador' || s.rol==='supervisor' || (s.herramientas||[]).indexOf('capacitaciones')>=0)) location.replace('../');
})();
</script>
<script src="./support.js"></script>
<script src="./sesion.js" defer></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700&amp;family=Barlow+Condensed:ital,wght@1,700;1,800&amp;display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; background: #e9ebee; font-family: 'Barlow', 'Helvetica Neue', sans-serif; }
    a { color: #e4002b; }
    a:hover { color: #b30022; }
    @media print { body { background: #ffffff; } }
  </style>
</helmet>

<div data-screen-label="Certificado" style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 24px; box-sizing: border-box;">

  <div style="width: 1160px; background: #ffffff; box-shadow: 0 10px 40px rgba(0,0,0,0.12); position: relative; overflow: hidden;">

    <!-- banda superior -->
    <div style="height: 10px; background: {{ accent }};"></div>

    <!-- deco diagonal esquina -->
    <div style="position: absolute; right: -120px; top: -120px; width: 340px; height: 340px; transform: rotate(-8deg); background: {{ colorClaro }}; pointer-events: none;"></div>

    <div style="position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 64px 80px 56px; box-sizing: border-box;">

      <img src="assets/logo-mateu.png" alt="Mateu Sports" style="height: 58px; display: block;">

      <div style="margin-top: 40px; font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 68px; line-height: 1; color: #1a1c1f; letter-spacing: 1px;">CERTIFICADO</div>
      <div style="margin-top: 10px; font-size: 20px; font-weight: 700; letter-spacing: 7px; color: #6b7280;">DE FINALIZACIÓN</div>

      <div style="margin-top: 48px; font-size: 17px; color: #6b7280;">Se otorga a</div>
      <div style="margin-top: 10px; font-size: 52px; font-weight: 700; color: #1a1c1f; line-height: 1.1;">{{ nombre }}</div>
      <div style="margin-top: 8px; width: 340px; height: 3px; background: {{ accent }};"></div>

      <div style="margin-top: 34px; font-size: 17px; color: #4b5158; max-width: 640px; line-height: 1.5;">Por completar con éxito la capacitación del siguiente nivel de carrera en tienda:</div>

      <div style="margin-top: 22px; display: flex; align-items: center; gap: 18px;">
        <div style="position: relative; width: 66px; height: 73px; display: flex; align-items: center; justify-content: center; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.2));">
          <svg width="66" height="73" viewBox="0 0 72 80" style="position: absolute; inset: 0;">
            <polygon points="36,2 68,21 68,59 36,78 4,59 4,21" fill="{{ colorPrograma }}" stroke="#ffffff" stroke-width="3"></polygon>
            <polygon points="36,10 61,25 61,55 36,70 11,55 11,25" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="2"></polygon>
          </svg>
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" style="position: relative;"><path d="M12 20 C8 16.5 5.5 14 5.5 11 A3.2 3.2 0 0 1 12 9.5 A3.2 3.2 0 0 1 18.5 11 C18.5 14 16 16.5 12 20 Z" stroke="#ffffff" stroke-width="1.7" stroke-linejoin="round"></path><path d="M9 12 L11 14 L15 10" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </div>
        <div style="font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 46px; color: {{ colorPrograma }}; letter-spacing: 1px; text-transform: uppercase;">{{ programa }}</div>
      </div>

      <div style="margin-top: 60px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 48px; width: 100%; align-items: end;">
        <div style="display: flex; flex-direction: column; gap: 8px; align-items: center;">
          <div style="font-size: 22px; font-weight: 700; color: #1a1c1f;">{{ capacitador }}</div>
          <div style="width: 100%; height: 1.5px; background: #c6cad1;"></div>
          <div style="font-size: 12.5px; font-weight: 700; letter-spacing: 2px; color: #6b7280;">CAPACITADOR</div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px; align-items: center;">
          <div style="font-size: 22px; font-weight: 700; color: #1a1c1f;">{{ fecha }}</div>
          <div style="width: 100%; height: 1.5px; background: #c6cad1;"></div>
          <div style="font-size: 12.5px; font-weight: 700; letter-spacing: 2px; color: #6b7280;">FECHA</div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px; align-items: center;">
          <div style="font-size: 22px; font-weight: 700; color: #1a1c1f;">{{ supervisor }}</div>
          <div style="width: 100%; height: 1.5px; background: #c6cad1;"></div>
          <div style="font-size: 12.5px; font-weight: 700; letter-spacing: 2px; color: #6b7280;">SUPERVISOR</div>
        </div>
      </div>

      <div style="margin-top: 44px; display: flex; align-items: center; gap: 12px;">
        <span style="color: #9aa0a8; font-size: 13px;">powered by</span>
        <span style="font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 18px; color: #1a1c1f; line-height: 1;">MATEU</span>
        <div style="width: 1px; height: 22px; background: #d8dbe0;"></div>
        <div style="display: flex; flex-direction: column; font-size: 8.5px; font-weight: 700; letter-spacing: 1px; color: #1a1c1f; line-height: 1.3; text-align: left;">
          <span>ACADEMIA</span>
          <span>DE VENTAS</span>
        </div>
      </div>

    </div>

    <div style="height: 10px; background: #0057b8;"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 1240, &quot;height&quot;: 940 },
  &quot;nombre&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Iván Nicoloff&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Certificado&quot; },
  &quot;programa&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;Onboarding&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;Onboarding&quot;, &quot;Programa Vendedores&quot;, &quot;Programa Vendedores Intermedio&quot;, &quot;Programa Encargados&quot;], &quot;section&quot;: &quot;Certificado&quot; },
  &quot;fecha&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;30 de agosto de 2025&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Certificado&quot; },
  &quot;capacitador&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Rocío Vega&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Firmas&quot; },
  &quot;supervisor&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Cristian Giménez&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Firmas&quot; },
  &quot;accentColor&quot;: { &quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#e4002b&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;#e4002b&quot;, &quot;#0057b8&quot;, &quot;#ff6900&quot;, &quot;#1a1c1f&quot;], &quot;section&quot;: &quot;Marca&quot; }
}">
class Component extends DCLogic {
  COLORES = {
    "Onboarding": "#7cb342",
    "Programa Vendedores": "#d81b60",
    "Programa Vendedores Intermedio": "#c9a800",
    "Programa Encargados": "#1e88e5",
  };

  renderVals() {
    const programa = this.props.programa ?? "Onboarding";
    const colorPrograma = this.COLORES[programa] ?? "#7cb342";
    return {
      accent: this.props.accentColor ?? "#e4002b",
      nombre: this.props.nombre ?? "Iván Nicoloff",
      programa,
      colorPrograma,
      colorClaro: colorPrograma + "22",
      fecha: this.props.fecha ?? "30 de agosto de 2025",
      capacitador: this.props.capacitador ?? "Rocío Vega",
      supervisor: this.props.supervisor ?? "Cristian Giménez",
    };
  }
}
</script>
</body>
</html>
