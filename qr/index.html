<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>¿Está tu talle? — Mateu Sports</title>
<!-- Página PÚBLICA que abre el cliente al escanear la etiqueta QR del salón (26/09/2026).
     Sin sesión del Portal. Lee /api/qr (functions/api/qr.js → lib/qr-publico.mjs): producto, precio,
     talles en esta sucursal y en las demás. Con ?c=<código>&s=<sucursal> muestra el artículo;
     solo con ?s= es el buscador del local (QR genérico: texto o cámara sobre el código de barras).
     Aurelius: shared/marca.js pinta la página con su estética cuando la sucursal es Aurelius. -->
<link rel="icon" href="../icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=Saira:ital,wght@1,800&display=swap" rel="stylesheet">
<script src="../shared/marca.js"></script>
<script src="../shared/iconos.js" defer></script>
<style>
:root{--navy:#0B1527;--red:#CC0000;--off:#f5f7fc;--muted:#5b6b85;--border:#e3e8f2;--ok:#1f7a3a}
:root[data-marca="aurelius"]{--navy:#0b0b0d;--red:#C2201F;--off:#f3f3f4;--muted:#5a5a63;--border:#e2e2e6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--off);color:var(--navy);font-family:Barlow,system-ui,sans-serif;-webkit-text-size-adjust:100%}
.top{background:var(--navy);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 18px 12px;border-bottom:3px solid var(--red);display:flex;align-items:center;justify-content:space-between;gap:12px}
.top img{height:26px;display:block;filter:brightness(0) invert(1)}
:root[data-marca="aurelius"] .top img{filter:none}
.top .suc{font-family:'Barlow Condensed';font-weight:600;font-size:14px;opacity:.9;text-align:right;line-height:1.1}
.top .suc b{display:block;font-size:16px;font-weight:700}
main{padding:14px 16px 28px;max-width:560px;margin:0 auto}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(11,21,39,.05)}
.brand{font-family:'Barlow Condensed';font-weight:700;letter-spacing:.6px;font-size:13px;color:var(--red);text-transform:uppercase}
.name{font-family:'Barlow Condensed';font-weight:700;font-size:24px;line-height:1.05;margin:2px 0 6px}
.meta{color:var(--muted);font-size:13px}
.price{font-family:Saira,Barlow;font-style:italic;font-weight:800;font-size:40px;line-height:1;margin-top:10px}
.price.sin{font-family:'Barlow Condensed';font-style:normal;font-weight:600;font-size:17px;color:var(--muted);margin-top:8px}
.price small{display:block;font-family:Barlow;font-style:normal;font-weight:500;font-size:13px;color:var(--muted);margin-top:5px}
.price .promo{color:var(--ok);font-weight:600}
.sec{font-family:'Barlow Condensed';font-weight:700;font-size:14px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:2px 0 8px}
.sec b{color:var(--navy)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--navy);border-radius:9px;padding:7px 4px 5px;min-width:54px;text-align:center;font-family:'Barlow Condensed';font-weight:700;font-size:18px;color:var(--navy);position:relative;line-height:1}
.chip small{display:block;font-family:Barlow;font-weight:500;font-size:10px;color:var(--muted);margin-top:3px;letter-spacing:.2px}
.chip.no{border-color:#d7dde8;color:#a3adbf;border-style:dashed}
.chip.no .t{text-decoration:line-through}
.chip.last:after{content:'último';position:absolute;top:-8px;right:-6px;background:var(--red);color:#fff;font-size:9px;font-weight:700;padding:2px 5px;border-radius:6px;letter-spacing:.3px;font-family:Barlow}
.hint{color:var(--muted);font-size:12.5px;margin-top:9px;line-height:1.4}
.empty{color:var(--muted);font-size:14px;line-height:1.45}
.oth{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--border);font-size:14px}
.oth:first-of-type{border-top:0}
.oth .n{font-weight:600}
.oth .t{color:var(--muted);font-size:12.5px}
.oth .ch{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.oth .ch span{font-family:'Barlow Condensed';font-weight:700;font-size:13px;border:1px solid var(--navy);border-radius:6px;padding:2px 6px;line-height:1.2}
.btn{display:block;width:100%;text-align:center;padding:13px;border-radius:12px;font-family:'Barlow Condensed';font-weight:700;font-size:17px;letter-spacing:.3px;margin-top:10px;border:0;cursor:pointer;text-decoration:none;color:var(--navy);background:#fff}
.btn.red{background:var(--red);color:#fff}
.btn.out{border:2px solid var(--navy);background:#fff}
.btn.g{border:1.5px solid var(--border);font-size:15px;font-weight:600}
.btn[disabled]{opacity:.5}
.foot{text-align:center;color:var(--muted);font-size:11px;margin-top:16px;line-height:1.5}
.err{background:#fff3f3;border:1px solid #f0c2c2;color:#8a1f1f;border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.45}
.load{color:var(--muted);text-align:center;padding:40px 0;font-size:14px}
/* formularios (hoja al pie) */
.veil{position:fixed;inset:0;background:rgba(11,21,39,.5);display:none;z-index:50}
.veil.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px));z-index:51;transform:translateY(105%);transition:transform .2s;max-height:88vh;overflow:auto}
.sheet.on{transform:none}
.sheet h3{font-family:'Barlow Condensed';font-weight:700;font-size:21px;margin:0 0 4px}
.sheet p{margin:0 0 10px;color:var(--muted);font-size:13.5px;line-height:1.4}
label{display:block;font-family:'Barlow Condensed';font-weight:600;font-size:13px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin:10px 0 4px}
input,select{width:100%;font:16px Barlow,sans-serif;padding:11px 12px;border:1.5px solid var(--border);border-radius:10px;background:#fff;color:var(--navy)}
input:focus,select:focus{outline:none;border-color:var(--navy)}
.tsel{display:flex;flex-wrap:wrap;gap:6px}
.tsel button{border:1.5px solid var(--border);background:#fff;border-radius:9px;padding:8px 0;min-width:50px;font-family:'Barlow Condensed';font-weight:700;font-size:16px;color:var(--navy);cursor:pointer}
.tsel button.on{border-color:var(--red);background:var(--red);color:#fff}
.okmsg{background:#eef8f0;border:1px solid #cfe8d5;color:#1f5a30;border-radius:12px;padding:14px;font-size:14.5px;line-height:1.45;margin-top:8px}
/* buscador del local */
.search{display:flex;gap:8px}
.search input{flex:1}
.search button{border:0;background:var(--navy);color:#fff;border-radius:10px;padding:0 14px;font-size:20px;cursor:pointer}
.res{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--border);cursor:pointer}
.res:first-child{border-top:0}
.res .d{font-weight:600;font-size:14.5px;line-height:1.2}
.res .c{color:var(--muted);font-size:12px;margin-top:2px}
.res .s{font-family:'Barlow Condensed';font-weight:700;font-size:15px;white-space:nowrap}
.res .s.cero{color:#a3adbf}
#cam{display:none;margin-top:10px;border-radius:12px;overflow:hidden;background:#000}
#cam video{width:100%;display:block;max-height:280px;object-fit:cover}
.hero{font-family:'Bebas Neue';font-size:38px;line-height:.95;margin:6px 0 4px}
.hero b{color:var(--red);font-weight:400}
@media print{.top,.btn,.veil,.sheet{display:none}}
</style>
</head>

<main id="app"><div class="load">Cargando…</div></main>

<script>
(function(){
  'use strict';
  var API = '../api/qr';
  var Q = {}; location.search.replace(/^\?/, '').split('&').forEach(function(p){ if(!p) return; var i = p.indexOf('='); var k = decodeURIComponent(i < 0 ? p : p.slice(0, i)), v = decodeURIComponent(i < 0 ? '' : p.slice(i + 1).replace(/\+/g, ' ')); Q[k] = v; });
  var SLUG = (Q.s || '').toLowerCase(), COD = (Q.c || '').toUpperCase();
  var D = null;   // respuesta del artículo
  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  var fmtHora = function(ts){ if(!ts) return ''; var d = new Date(ts); return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); };
  var fmtPeso = function(n){ return '$ ' + Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.'); };
  var tallesTxt = function(t){ return t.map(function(x){ return x.t; }).join(', '); };

  function get(params, cb){
    var x = new XMLHttpRequest();
    x.open('GET', API + '?' + params, true); x.timeout = 25000;
    x.onload = function(){ var d = null; try{ d = JSON.parse(x.responseText); }catch(e){} cb(x.status, d); };
    x.onerror = x.ontimeout = function(){ cb(0, null); };
    x.send();
  }
  function post(body, cb){
    var x = new XMLHttpRequest();
    x.open('POST', API, true); x.timeout = 25000; x.setRequestHeader('Content-Type', 'application/json');
    x.onload = function(){ var d = null; try{ d = JSON.parse(x.responseText); }catch(e){} cb(x.status, d); };
    x.onerror = x.ontimeout = function(){ cb(0, null); };
    x.send(JSON.stringify(body));
  }

  function pintarTop(suc){
    $('topSuc').innerHTML = suc ? 'Estás en<b>' + esc(suc.nombre) + '</b>' : '';
    if(suc && suc.marca === 'aurelius' && window.Marca && Marca.vista){ try{ Marca.vista(suc.slug); }catch(e){} }
  }

  /* ===================== artículo ===================== */
  function pintarArticulo(d){
    D = d;
    var a = d.articulo, aca = d.aca, sucN = d.sucursal.nombre, cfg = d.config || {};
    document.title = a.descripcion + ' — ' + sucN;
    var hay = aca.talles.filter(function(x){ return x.c > 0; });
    var precio = d.precio && d.precio.lista
      ? '<div class="price">' + (d.precio.promo && d.precio.promo.precio ? fmtPeso(d.precio.promo.precio) + '<small><s>' + fmtPeso(d.precio.lista) + '</s> · <span class="promo">' + esc(d.precio.promo.nombre || 'Promo') + '</span></small>' : fmtPeso(d.precio.lista) + '<small>Precio de lista' + (cfg.promoTexto ? ' · ' + esc(cfg.promoTexto) : '') + '</small>') + '</div>'
      : '<div class="price sin">💲 Consultá el precio en caja o a un vendedor' + (cfg.promoTexto ? '<small>' + esc(cfg.promoTexto) + '</small>' : '') + '</div>';
    var chips = '';
    if(aca.sinDato) chips = '<div class="empty">Esta sucursal todavía no publica sus talles acá. Preguntale a un vendedor: te lo busca al toque.</div>';
    else if(!aca.talles.length) chips = '<div class="empty">' + (aca.stock > 0 ? 'Hay <b>' + aca.stock + '</b> en esta sucursal (sin apertura por talle). Preguntale a un vendedor.' : 'En esta sucursal no queda en este momento.') + '</div>';
    else chips = '<div class="chips">' + aca.talles.map(function(x){
      var ar = d.ar && d.ar[String(x.t).toUpperCase()];
      return '<span class="chip' + (x.c > 0 ? (x.c === 1 ? ' last' : '') : ' no') + '"><span class="t">' + esc(x.t) + '</span>' + (ar ? '<small>' + esc(ar) + ' AR</small>' : '') + '</span>';
    }).join('') + '</div>';
    var otras = d.otras.length
      ? d.otras.map(function(o){
          return '<div class="oth"><div><div class="n">' + esc(o.nombre) + '</div><div class="t">' + (o.web ? 'comprás online y te llega a tu casa' : (o.cerca ? 'cerca de acá' : '')) + '</div></div><div class="ch">' + (o.talles.length ? o.talles.map(function(t){ return '<span>' + esc(t.t) + '</span>'; }).join('') : '<span>' + o.stock + ' u.</span>') + '</div></div>';
        }).join('')
      : '<div class="empty">Por ahora no figura en otras sucursales.</div>';
    var html = ''
      + '<div class="card"><div class="brand">' + esc(a.marca || '') + (a.disciplina ? ' · ' + esc(a.disciplina) : '') + '</div>'
      + '<div class="name">' + esc(a.descripcion) + '</div>'
      + '<div class="meta">' + (a.genero ? esc(a.genero) + ' · ' : '') + esc(a.codigo) + '</div>' + precio + '</div>'
      + '<div class="card"><div class="sec">Talles en <b>' + esc(sucN) + '</b>' + (d.escala && d.escala !== 'AR' && aca.talles.length ? ' · ' + esc(d.escala) : '') + '</div>' + chips
      + '<div class="hint">' + (aca.talles.length ? 'Tachado = no queda en este local. ' : '') + (aca.actualizado ? 'Stock actualizado el ' + fmtHora(aca.actualizado) + '. ' : '') + 'Si no ves tu talle, pedilo: puede estar en camino.</div></div>'
      + '<div class="card"><div class="sec">En otras sucursales</div>' + otras
      + (d.otras.length ? '<button class="btn out" id="btnPedir">📲 Pedir que lo traigan a ' + esc(sucN) + '</button>' : '') + '</div>'
      + '<button class="btn red" id="btnAviso">🔔 Avisame cuando llegue mi talle</button>'
      + (cfg.ecommerce ? '<a class="btn g" href="' + esc(cfg.ecommerce) + '" target="_blank" rel="noopener">🛒 Comprarlo online</a>' : '')
      + (cfg.whatsapp ? '<a class="btn g" href="https://wa.me/' + esc(String(cfg.whatsapp).replace(/\D/g, '')) + '?text=' + encodeURIComponent('Hola! Consulto por ' + a.descripcion + ' (' + a.codigo + ')') + '" target="_blank" rel="noopener">💬 Escribirle al local por WhatsApp</a>' : '')
      + (cfg.resena ? '<a class="btn g" href="' + esc(cfg.resena) + '" target="_blank" rel="noopener">⭐ ¿Te atendieron bien? Dejanos tu reseña</a>' : '')
      + (Q.c && SLUG ? '<a class="btn g" href="?s=' + encodeURIComponent(SLUG) + '">🔎 Buscar otro producto de esta sucursal</a>' : '')
      + '<div class="foot">' + (d.sucursal.marca === 'aurelius' ? 'Aurelius' : 'Mateu Sports') + ' · Los precios pueden variar · Consultá en caja</div>';
    $('app').innerHTML = html;
    var bA = $('btnAviso'); if(bA) bA.onclick = function(){ abrirAviso(); };
    var bP = $('btnPedir'); if(bP) bP.onclick = function(){ abrirPedido(); };
  }

  function tallesParaElegir(){
    var t = {};
    D.aca.talles.forEach(function(x){ t[x.t] = 1; });
    D.otras.forEach(function(o){ o.talles.forEach(function(x){ t[x.t] = 1; }); });
    return Object.keys(t);
  }
  function selTallesHtml(lista){
    if(!lista.length) return '<input id="fTalle" placeholder="Tu talle (p.ej. 42, M)" maxlength="10">';
    return '<div class="tsel" id="fTalles">' + lista.map(function(t){ return '<button type="button" data-t="' + esc(t) + '">' + esc(t) + '</button>'; }).join('') + '</div><input id="fTalle" placeholder="u otro talle" maxlength="10" style="margin-top:8px">';
  }
  function talleElegido(){
    var on = document.querySelector('#fTalles button.on');
    var libre = ($('fTalle').value || '').trim();
    return libre || (on ? on.dataset.t : '');
  }
  function wireTalles(){
    var box = $('fTalles'); if(!box) return;
    box.querySelectorAll('button').forEach(function(b){ b.onclick = function(){ box.querySelectorAll('button').forEach(function(x){ x.classList.toggle('on', x === b && !x.classList.contains('on')); }); }; });
  }
  function abrirSheet(html){ $('sheet').innerHTML = html; $('veil').classList.add('on'); setTimeout(function(){ $('sheet').classList.add('on'); }, 10); }
  function cerrarSheet(){ $('sheet').classList.remove('on'); $('veil').classList.remove('on'); }
  $('veil').onclick = cerrarSheet;

  function abrirAviso(){
    var lista = tallesParaElegir();
    abrirSheet('<h3>🔔 Avisame cuando llegue mi talle</h3><p>Te escribimos por WhatsApp cuando el talle entre a <b>' + esc(D.sucursal.nombre) + '</b>. Solo lo usamos para eso.</p>'
      + '<label>Talle</label>' + selTallesHtml(lista)
      + '<label>Tu nombre</label><input id="fNombre" maxlength="60" placeholder="Nombre">'
      + '<label>Tu WhatsApp</label><input id="fTel" type="tel" maxlength="20" placeholder="221 555 1234">'
      + '<button class="btn red" id="fOk">Avisarme</button><button class="btn g" id="fNo">Cancelar</button>');
    wireTalles();
    $('fNo').onclick = cerrarSheet;
    $('fOk').onclick = function(){
      var talle = talleElegido(), tel = $('fTel').value.trim();
      if(!talle){ alert('Elegí el talle.'); return; }
      if(tel.replace(/\D/g, '').length < 8){ alert('Dejanos un WhatsApp válido.'); return; }
      $('fOk').disabled = true;
      post({ accion: 'aviso', c: D.codigo, s: D.sucursal.slug, talle: talle, nombre: $('fNombre').value, tel: tel, desc: D.articulo.descripcion }, function(st, r){
        if(st === 200 && r && r.ok){ abrirSheet('<div class="okmsg">✅ Listo. Cuando el talle <b>' + esc(talle) + '</b> entre a ' + esc(D.sucursal.nombre) + ', te avisan por WhatsApp.</div><button class="btn g" id="fNo">Cerrar</button>'); $('fNo').onclick = cerrarSheet; }
        else { $('fOk').disabled = false; alert((r && r.error) || 'No se pudo mandar. Probá de nuevo o decile a un vendedor.'); }
      });
    };
  }
  function abrirPedido(){
    var lista = [];
    D.otras.forEach(function(o){ o.talles.forEach(function(x){ if(lista.indexOf(x.t) < 0) lista.push(x.t); }); });
    var desde = D.otras.filter(function(o){ return !o.web; });
    abrirSheet('<h3>📲 Pedir que lo traigan</h3><p>Lo pedimos a otra sucursal y te avisamos cuando esté en <b>' + esc(D.sucursal.nombre) + '</b> (suele tardar uno o dos días).</p>'
      + '<label>Talle</label>' + selTallesHtml(lista)
      + (desde.length ? '<label>Traerlo desde</label><select id="fDesde">' + desde.map(function(o){ return '<option value="' + esc(o.slug) + '">' + esc(o.nombre) + ' (' + tallesTxt(o.talles) + ')</option>'; }).join('') + '</select>' : '')
      + '<label>Tu nombre</label><input id="fNombre" maxlength="60" placeholder="Nombre">'
      + '<label>Tu WhatsApp</label><input id="fTel" type="tel" maxlength="20" placeholder="221 555 1234">'
      + '<button class="btn red" id="fOk">Pedirlo</button><button class="btn g" id="fNo">Cancelar</button>');
    wireTalles();
    $('fNo').onclick = cerrarSheet;
    $('fOk').onclick = function(){
      var talle = talleElegido(), tel = $('fTel').value.trim();
      if(tel.replace(/\D/g, '').length < 8){ alert('Dejanos un WhatsApp válido.'); return; }
      $('fOk').disabled = true;
      post({ accion: 'pedido', c: D.codigo, s: D.sucursal.slug, desde: $('fDesde') ? $('fDesde').value : '', talle: talle, nombre: $('fNombre').value, tel: tel, desc: D.articulo.descripcion }, function(st, r){
        if(st === 200 && r && r.ok){ abrirSheet('<div class="okmsg">✅ Pedido enviado. La sucursal lo coordina y te escribe por WhatsApp.</div><button class="btn g" id="fNo">Cerrar</button>'); $('fNo').onclick = cerrarSheet; }
        else { $('fOk').disabled = false; alert((r && r.error) || 'No se pudo mandar. Probá de nuevo o decile a un vendedor.'); }
      });
    };
  }

  /* ===================== buscador del local (QR genérico) ===================== */
  var ZX = null, ZXreader = null;
  function pintarBuscador(info){
    var suc = info.sucursal;
    document.title = 'Buscá tu producto — ' + suc.nombre;
    $('app').innerHTML = '<div class="card"><div class="hero">¿Está <b>tu talle?</b></div><p class="empty" style="margin:0 0 10px">Escribí el nombre o el código del producto, o apuntá la cámara al <b>código de barras</b> de la etiqueta.</p>'
      + '<div class="search"><input id="q" placeholder="Zapatilla, remera, código…" autocomplete="off"><button id="btnCam" title="Escanear el código de barras">📷</button></div>'
      + '<div id="cam"><video id="video" playsinline muted></video></div>'
      + '<div id="resBox"></div></div>'
      + (info.config && info.config.resena ? '<a class="btn g" href="' + esc(info.config.resena) + '" target="_blank" rel="noopener">⭐ ¿Te atendieron bien? Dejanos tu reseña</a>' : '')
      + '<div class="foot">' + (suc.marca === 'aurelius' ? 'Aurelius' : 'Mateu Sports') + ' · ' + esc(suc.nombre) + '</div>';
    var t = null;
    $('q').addEventListener('input', function(){ clearTimeout(t); var v = $('q').value.trim(); if(v.length < 3){ $('resBox').innerHTML = ''; return; } t = setTimeout(function(){ buscar(v); }, 350); });
    $('q').addEventListener('keydown', function(e){ if(e.key === 'Enter'){ clearTimeout(t); buscar($('q').value.trim()); } });
    $('btnCam').onclick = camara;
    setTimeout(function(){ try{ $('q').focus(); }catch(e){} }, 100);
  }
  function buscar(v){
    $('resBox').innerHTML = '<div class="load" style="padding:16px 0">Buscando…</div>';
    get('s=' + encodeURIComponent(SLUG) + '&q=' + encodeURIComponent(v), function(st, r){
      if(st !== 200 || !r || !r.ok){ $('resBox').innerHTML = '<div class="empty" style="padding:10px 0">' + esc((r && r.error) || 'No se pudo buscar. Probá de nuevo.') + '</div>'; return; }
      if(r.sinDato){ $('resBox').innerHTML = '<div class="empty" style="padding:10px 0">Esta sucursal todavía no publica su stock acá. Preguntale a un vendedor.</div>'; return; }
      if(!r.resultados.length){ $('resBox').innerHTML = '<div class="empty" style="padding:10px 0">No encontramos nada con «' + esc(v) + '». Probá con otra palabra o preguntale a un vendedor.</div>'; return; }
      $('resBox').innerHTML = '<div style="margin-top:10px">' + r.resultados.map(function(a){
        return '<div class="res" data-c="' + esc(a.codigo) + '"><div><div class="d">' + esc(a.descripcion || a.codigo) + '</div><div class="c">' + esc(a.codigo) + '</div></div><div class="s' + (a.stock > 0 ? '' : ' cero') + '">' + (a.talles.length ? tallesTxt(a.talles) : (a.stock > 0 ? a.stock + ' u.' : 'sin stock')) + '</div></div>';
      }).join('') + (r.total > r.resultados.length ? '<div class="hint">Se muestran ' + r.resultados.length + ' de ' + r.total + ': escribí algo más.</div>' : '') + '</div>';
      $('resBox').querySelectorAll('.res').forEach(function(el){ el.onclick = function(){ irA(el.dataset.c); }; });
      if(r.porEan && r.resultados.length === 1) irA(r.resultados[0].codigo);
    });
  }
  function irA(codigo){
    pararCamara();
    history.pushState({}, '', '?c=' + encodeURIComponent(codigo) + '&s=' + encodeURIComponent(SLUG));
    COD = codigo; cargarArticulo();
  }
  function camara(){
    var box = $('cam');
    if(box.style.display === 'block'){ pararCamara(); return; }
    function arrancar(){
      box.style.display = 'block';
      ZXreader = new ZXing.BrowserMultiFormatReader();
      ZXreader.decodeFromVideoDevice(null, 'video', function(res){ if(res && res.text){ pararCamara(); $('q').value = res.text; buscar(res.text); } }).catch(function(){ pararCamara(); alert('No pude abrir la cámara. Escribí el código o el nombre.'); });
    }
    if(window.ZXing) return arrancar();
    var s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
    s.onload = arrancar; s.onerror = function(){ alert('No pude cargar el lector de cámara. Escribí el código o el nombre.'); };
    document.head.appendChild(s);
  }
  function pararCamara(){ try{ if(ZXreader) ZXreader.reset(); }catch(e){} ZXreader = null; var b = $('cam'); if(b) b.style.display = 'none'; }

  /* ===================== arranque ===================== */
  function cargarArticulo(){
    $('app').innerHTML = '<div class="load">Buscando el producto…</div>';
    get('c=' + encodeURIComponent(COD) + '&s=' + encodeURIComponent(SLUG) + (Q.nolog ? '&nolog=1' : ''), function(st, d){
      if(st === 200 && d && d.ok){ pintarTop(d.sucursal); pintarArticulo(d); return; }
      $('app').innerHTML = '<div class="err">' + esc((d && d.error) || (st === 429 ? 'Demasiadas consultas. Esperá un minuto.' : 'No pudimos cargar el producto. Revisá la conexión y volvé a escanear.')) + '</div>' + (SLUG ? '<a class="btn g" href="?s=' + encodeURIComponent(SLUG) + '">🔎 Buscar un producto de esta sucursal</a>' : '');
    });
  }
  window.addEventListener('popstate', function(){ location.reload(); });
  if(!SLUG){ $('app').innerHTML = '<div class="err">Falta la sucursal en el código. Volvé a escanear la etiqueta.</div>'; return; }
  // Matts como asesor de producto para el cliente (shared/asistente.js, modo público: solo producto + stock de esta sucursal)
  var NN2SLUG = { '01':'plaza','02':'kids','03':'calle-55','04':'aurelius-12','06':'city-bell','07':'aurelius-10','08':'calle-47','09':'adidas','10':'diagonal','11':'ensenada','12':'calle-12','13':'los-hornos','14':'gonnet','15':'originals','16':'berisso','17':'aurelius-cb','18':'aurelius-5','19':'calle-49','20':'av-44','21':'adidas-12','99':'ecommerce' };
  window.MATTS_PUBLICO = { sucursal: NN2SLUG[SLUG] || SLUG };
  (function(){ var sc = document.createElement('script'); sc.src = '../shared/asistente.js'; sc.defer = true; document.head.appendChild(sc); })();
  if(COD) cargarArticulo();
  else get('s=' + encodeURIComponent(SLUG), function(st, d){
    if(st === 200 && d && d.ok){ pintarTop(d.sucursal); pintarBuscador(d); }
    else $('app').innerHTML = '<div class="err">' + esc((d && d.error) || 'No pudimos cargar la sucursal. Revisá la conexión.') + '</div>';
  });
})();
</script>
</body>
</html>
