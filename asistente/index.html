<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Matts · uso — Mateu Sports</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@300;400;500;600;700&family=Saira:ital,wght@1,800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B1527;--navy-mid:#1a2f55;--red:#CC0000;--off:#f5f7fc;--muted:#6B7A99;--border:#dce3f0;
  --ok:#16a34a;--ok-bg:#f0fdf4;--warn:#d97706;--warn-bg:#fffbeb;--bad:#dc2626;--bad-bg:#fef2f2;
  --font-d:'Bebas Neue',sans-serif;--font-c:'Barlow Condensed',sans-serif;--font-b:'Barlow',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--off);color:var(--navy);font-family:var(--font-b);min-height:100vh}
main{max-width:1240px;margin:0 auto;padding:22px 18px 110px}
h1{font-family:var(--font-d);font-weight:400;font-size:34px;letter-spacing:1px;line-height:1}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}
.sel,.inp{border:1.5px solid var(--border);border-radius:8px;padding:8px 11px;font-family:var(--font-b);font-size:14px;color:var(--navy);background:#fff}
.btn{border:1.5px solid var(--border);background:#fff;border-radius:8px;padding:8px 13px;font-family:var(--font-c);font-weight:700;font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--navy);cursor:pointer}
.btn:hover{border-color:var(--navy)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.kpi .l{font-family:var(--font-c);font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:'Saira',sans-serif;font-style:italic;font-weight:800;font-size:30px;line-height:1.1;margin-top:4px}
.kpi .n{font-size:12.5px;color:var(--muted);margin-top:3px}
.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;margin-top:14px}
.card h2{font-family:var(--font-c);font-size:15px;letter-spacing:1px;text-transform:uppercase;margin-bottom:12px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.dias{display:flex;align-items:flex-end;gap:4px;height:120px}
.dias div{flex:1;background:var(--navy);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.dias div span{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted)}
.dias div b{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:10.5px;font-weight:600}
.fila{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:5px 0;border-bottom:1px solid #eef1f7}
.fila:last-child{border:0}
.fila .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fila .bx{width:90px;height:7px;background:#e8edf6;border-radius:4px;overflow:hidden}
.fila .bx i{display:block;height:100%;background:var(--navy)}
.fila .nu{width:34px;text-align:right;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--border);background:#fff;border-radius:16px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--navy)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.q{border:1px solid var(--border);border-radius:10px;margin-top:8px;background:#fff;overflow:hidden}
.q.mal{border-left:4px solid var(--bad)}.q.bien{border-left:4px solid var(--ok)}
.q summary{list-style:none;cursor:pointer;padding:10px 12px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.q summary::-webkit-details-marker{display:none}
.q .meta{font-size:12px;color:var(--muted);white-space:nowrap}
.q .pt{flex:1;min-width:200px;font-size:14px;font-weight:500}
.tag{display:inline-block;font-family:var(--font-c);font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;border-radius:5px;padding:2px 6px;background:#e8edf6;color:var(--navy-mid);margin-left:4px}
.tag.mal{background:var(--bad-bg);color:var(--bad)}.tag.bien{background:var(--ok-bg);color:var(--ok)}
.q .r{padding:0 12px 12px;font-size:13.5px;line-height:1.5;color:#2a3550;white-space:pre-wrap;border-top:1px dashed var(--border);padding-top:10px}
.hint{color:var(--muted);font-size:13.5px}
.nota{background:var(--warn-bg);border:1px solid #f3dfae;border-radius:10px;padding:10px 13px;font-size:13px;color:#7a5300;margin-top:14px}
@media(max-width:640px){h1{font-size:28px}.kpi .v{font-size:25px}}
</style>
<script src="../shared/marca.js"></script>
<script src="../shared/iconos.js" defer></script>
<script>window.MATEU_TUTORIAL={herramienta:'portal'};</script>
<script src="../shared/header.js" defer></script>
</head>
<body>
<main>
  <h1>Matts · uso</h1>
  <div class="sub">Qué le preguntan al asistente, qué respondió mal y cuánto gasta. Solo gerencia.</div>
  <div class="bar">
    <select class="sel" id="selMes"></select>
    <button class="btn" id="btnRef">↻ Actualizar</button>
    <span style="flex:1"></span>
    <label class="hint">Crédito cargado (US$) <input class="inp" id="inpCred" type="number" min="0" step="1" style="width:90px"></label>
    <button class="btn" id="btnCred">Guardar</button>
  </div>
  <div id="body"><div class="hint">Cargando…</div></div>
</main>
<script>
/* Panel de uso de Matts (asistente del portal). Lee recepciones-mateu/asistente/log/<YYYY-MM> (lo escribe
   functions/api/asistente.js: una entrada por consulta con pregunta, respuesta, herramientas, tokens y voto).
   Solo lectura, salvo asistente/config/credito (lo que se cargó en la consola de Anthropic, para estimar el
   saldo). Seguridad blanda como el resto: entra solo gerencia (ADMINS). */
var DB = 'https://recepciones-mateu-default-rtdb.firebaseio.com/asistente';
var ADMINS = ['julian@mateu.com.ar'];
// Haiku 4.5: US$1 por millón de tokens de entrada y US$5 de salida. Es un techo: no descuenta el caché.
var US_IN = 1, US_OUT = 5;
var SESSION = null;
try{ SESSION = JSON.parse(localStorage.getItem('mateu_portal_session') || 'null'); }catch(e){}
if(!SESSION || SESSION.rol !== 'admin' || ADMINS.indexOf(String(SESSION.email||'').toLowerCase()) < 0) location.href = '../';

function $(id){ return document.getElementById(id); }
function esc(x){ return (x==null?'':String(x)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function gj(u){ return fetch(u).then(function(r){ return r.json(); }).catch(function(){ return null; }); }
function us(n){ return 'US$' + n.toFixed(n < 1 ? 3 : 2).replace('.', ','); }
function costo(x){ return ((x.tin||0) * US_IN + (x.tout||0) * US_OUT) / 1e6; }
function cuenta(m){ return String(m||'').split('@')[0]; }
var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function mesTxt(ym){ return MESES[+ym.slice(5)-1] + ' ' + ym.slice(0,4); }
var TOOL_TXT = { guia_modulo:'guía de otro módulo', buscar_catalogo:'catálogo', consultar_stock:'stock y ubicación', resumen_gestion:'gestión del local' };

var LOGS = {}, MES = '', FILTRO = 'todas', BUSCA = '', CRED = 0;

function cargar(){
  $('body').innerHTML = '<div class="hint">Cargando…</div>';
  return Promise.all([gj(DB + '/log.json?shallow=true'), gj(DB + '/config.json')]).then(function(r){
    var meses = Object.keys(r[0] || {}).sort();
    CRED = (r[1] && Number(r[1].credito)) || 0; $('inpCred').value = CRED || '';
    if(!meses.length){ $('body').innerHTML = '<div class="card hint">Todavía no hay consultas registradas.</div>'; return; }
    return Promise.all(meses.map(function(m){ return gj(DB + '/log/' + m + '.json'); })).then(function(todos){
      LOGS = {}; meses.forEach(function(m, i){ LOGS[m] = Object.keys(todos[i] || {}).map(function(k){ var o = todos[i][k]; o._id = k; return o; }).filter(function(o){ return o && o.ts; }).sort(function(a,b){ return b.ts - a.ts; }); });
      if(!MES || !LOGS[MES]) MES = meses[meses.length-1];
      $('selMes').innerHTML = meses.slice().reverse().map(function(m){ return '<option value="'+m+'"'+(m===MES?' selected':'')+'>'+mesTxt(m)+' ('+LOGS[m].length+')</option>'; }).join('');
      pintar();
    });
  });
}

function ranking(lista, fn, max){
  var c = {}; lista.forEach(function(x){ [].concat(fn(x)).forEach(function(k){ if(k) c[k] = (c[k]||0) + 1; }); });
  var a = Object.keys(c).map(function(k){ return [k, c[k]]; }).sort(function(p,q){ return q[1]-p[1]; }).slice(0, max || 10);
  var top = a.length ? a[0][1] : 1;
  return a.length ? a.map(function(p){ return '<div class="fila"><span class="nm" title="'+esc(p[0])+'">'+esc(p[0])+'</span><span class="bx"><i style="width:'+Math.round(p[1]/top*100)+'%"></i></span><span class="nu">'+p[1]+'</span></div>'; }).join('') : '<div class="hint">Sin datos.</div>';
}

function pintar(){
  var L = LOGS[MES] || [];
  var gastoMes = L.reduce(function(a,x){ return a + costo(x); }, 0);
  var gastoTotal = Object.keys(LOGS).reduce(function(a,m){ return a + LOGS[m].reduce(function(b,x){ return b + costo(x); }, 0); }, 0);
  var cuentas = {}; L.forEach(function(x){ cuentas[x.mail] = 1; });
  var bien = L.filter(function(x){ return x.voto > 0; }).length, mal = L.filter(function(x){ return x.voto < 0; }).length;
  var h = '<div class="kpis">'
    + '<div class="kpi"><div class="l">Consultas</div><div class="v">'+L.length+'</div><div class="n">'+Object.keys(cuentas).length+' cuentas lo usaron</div></div>'
    + '<div class="kpi"><div class="l">¿Les sirvió?</div><div class="v" style="color:'+(bien+mal ? (bien/(bien+mal) >= .7 ? 'var(--ok)' : 'var(--bad)') : 'inherit')+'">'+(bien+mal ? Math.round(bien/(bien+mal)*100)+'%' : '—')+'</div><div class="n">'+bien+' sí · '+mal+' no · '+(L.length-bien-mal)+' sin votar</div></div>'
    + '<div class="kpi"><div class="l">Gasto del mes (estimado)</div><div class="v">'+us(gastoMes)+'</div><div class="n">'+(L.length ? us(gastoMes/L.length)+' por consulta' : '')+'</div></div>'
    + '<div class="kpi"><div class="l">Saldo estimado</div><div class="v">'+(CRED ? us(Math.max(0, CRED - gastoTotal)) : '—')+'</div><div class="n">'+(CRED ? 'de '+us(CRED)+' cargados · gastó '+us(gastoTotal)+' en total' : 'Cargá arriba cuánto crédito compraste')+'</div></div>'
    + '</div>';

  // por día
  var dias = {}, n = new Date(+MES.slice(0,4), +MES.slice(5), 0).getDate();
  L.forEach(function(x){ var d = new Date(x.ts - 3*3600e3).getUTCDate(); dias[d] = (dias[d]||0) + 1; });
  var mx = 1; for(var d=1; d<=n; d++) mx = Math.max(mx, dias[d]||0);
  var barras = ''; for(d=1; d<=n; d++) barras += '<div style="height:'+Math.round((dias[d]||0)/mx*100)+'%;'+(dias[d]?'':'background:#e8edf6')+'">'+(dias[d]?'<b>'+dias[d]+'</b>':'')+(d%2?'<span>'+d+'</span>':'')+'</div>';
  h += '<div class="card"><h2>Consultas por día</h2><div class="dias" style="margin:18px 0 22px">'+barras+'</div></div>';

  h += '<div class="cols">'
    + '<div class="card"><h2>Quién lo usa</h2>'+ranking(L, function(x){ return cuenta(x.mail) + (x.suc ? ' · ' + x.suc : ''); }, 12)+'</div>'
    + '<div class="card"><h2>Desde qué módulo</h2>'+ranking(L, function(x){ return x.modulo; }, 12)+'</div>'
    + '<div class="card"><h2>Qué tuvo que consultar</h2>'+ranking(L, function(x){ var t = (x.tools||[]).filter(function(v,i,a){ return a.indexOf(v)===i; }).map(function(k){ return TOOL_TXT[k]||k; }); return t.length ? t : ['nada (respondió con lo que sabe)']; }, 8)+'</div>'
    + '</div>';

  h += '<div class="card"><h2>Las preguntas</h2><div class="bar" style="margin:0 0 6px"><div class="chips" id="chips">'
    + [['todas','Todas'],['mal','No sirvió'],['bien','Sirvió'],['gestion','Gestión'],['stock','Stock'],['catalogo','Producto'],['portal','Uso del portal']].map(function(c){ return '<button class="chip'+(FILTRO===c[0]?' on':'')+'" data-f="'+c[0]+'">'+c[1]+'</button>'; }).join('')
    + '</div><span style="flex:1"></span><input class="inp" id="busca" placeholder="Buscar en las preguntas…" value="'+esc(BUSCA)+'" style="min-width:220px"><button class="btn" id="btnCopiar">⧉ Copiar las que no sirvieron</button></div><div id="lista"></div></div>';
  h += '<div class="nota">El gasto es una estimación con la tarifa de Haiku 4.5 sobre los tokens de cada consulta; no incluye los botones ✨ de la Academia, que usan la misma clave. El saldo real está en la consola de Anthropic → Facturación.</div>';
  $('body').innerHTML = h;
  pintarLista();
}

function filtradas(){
  var L = LOGS[MES] || [], b = BUSCA.toLowerCase();
  return L.filter(function(x){
    var t = x.tools || [];
    if(FILTRO==='mal' && !(x.voto < 0)) return false;
    if(FILTRO==='bien' && !(x.voto > 0)) return false;
    if(FILTRO==='gestion' && t.indexOf('resumen_gestion') < 0) return false;
    if(FILTRO==='stock' && t.indexOf('consultar_stock') < 0) return false;
    if(FILTRO==='catalogo' && (t.indexOf('buscar_catalogo') < 0 || t.indexOf('consultar_stock') >= 0)) return false;
    if(FILTRO==='portal' && t.length && t.indexOf('guia_modulo') < 0) return false;
    if(b && (String(x.q)+' '+String(x.r)+' '+x.mail).toLowerCase().indexOf(b) < 0) return false;
    return true;
  });
}
function pintarLista(){
  var F = filtradas();
  $('lista').innerHTML = F.length ? F.slice(0, 300).map(function(x){
    var f = new Date(x.ts - 3*3600e3), hh = ('0'+f.getUTCDate()).slice(-2)+'/'+('0'+(f.getUTCMonth()+1)).slice(-2)+' '+('0'+f.getUTCHours()).slice(-2)+':'+('0'+f.getUTCMinutes()).slice(-2);
    var tags = (x.tools||[]).filter(function(v,i,a){ return a.indexOf(v)===i; }).map(function(k){ return '<span class="tag">'+esc(TOOL_TXT[k]||k)+'</span>'; }).join('');
    return '<details class="q'+(x.voto<0?' mal':x.voto>0?' bien':'')+'"><summary><span class="meta">'+hh+' · '+esc(cuenta(x.mail))+' · '+esc(x.modulo||'')+'</span><span class="pt">'+esc(x.q)+'</span><span>'+tags+(x.voto<0?'<span class="tag mal">no sirvió</span>':x.voto>0?'<span class="tag bien">sirvió</span>':'')+'</span><span class="meta">'+us(costo(x))+'</span></summary><div class="r">'+esc(x.r)+(String(x.r||'').length>=800?' […]':'')+'</div></details>';
  }).join('') + (F.length > 300 ? '<div class="hint" style="margin-top:8px">Se muestran 300 de '+F.length+'.</div>' : '') : '<div class="hint" style="padding:10px 0">Nada con ese filtro.</div>';
}

document.addEventListener('click', function(e){
  var t = e.target;
  if(t.getAttribute && t.getAttribute('data-f')){ FILTRO = t.getAttribute('data-f'); [].forEach.call(document.querySelectorAll('#chips .chip'), function(c){ c.className = 'chip' + (c.getAttribute('data-f')===FILTRO ? ' on' : ''); }); pintarLista(); }
  if(t.id === 'btnRef') cargar();
  if(t.id === 'btnCred'){
    CRED = Number($('inpCred').value) || 0;
    fetch(DB + '/config.json', { method:'PATCH', body: JSON.stringify({ credito: CRED, por: SESSION.email, ts: Date.now() }) }).then(pintar);
  }
  if(t.id === 'btnCopiar'){
    var txt = (LOGS[MES]||[]).filter(function(x){ return x.voto < 0; }).map(function(x){ return '• ['+cuenta(x.mail)+' · '+(x.modulo||'')+'] '+x.q+'\n  → '+String(x.r||'').replace(/\n+/g,' ').slice(0, 300); }).join('\n\n') || 'Ninguna respuesta marcada como «no sirvió» este mes.';
    try{ navigator.clipboard.writeText(txt); t.textContent = '✓ Copiado'; setTimeout(function(){ t.textContent = '⧉ Copiar las que no sirvieron'; }, 1800); }catch(err){ alert(txt); }
  }
});
document.addEventListener('input', function(e){ if(e.target.id === 'busca'){ BUSCA = e.target.value; pintarLista(); } });
document.addEventListener('change', function(e){ if(e.target.id === 'selMes'){ MES = e.target.value; pintar(); } });
cargar();
</script>
</body>
</html>
